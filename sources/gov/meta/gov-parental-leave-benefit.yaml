tags: [육아휴직, 육아기근로시간단축, 고용보험급여, 선대금, 근로시간단축]
summary: 8세 이하(또는 초등 2학년 이하) 자녀 양육을 위한 육아휴직 또는 근로시간 단축 급여를 신청하는 법정 신청서입니다.
usage: >
  근로자가 자녀 양육을 위해 육아휴직 또는 근로시간 단축을 했을 때 고용센터에 제출합니다.
  신청 기간은 휴직 또는 단축 시작 1개월부터 종료 후 12개월 이내입니다.
  신청인 정보·대상 자녀·신청 기간·받을 계좌번호·신청 기간 중 다른 소득 활동 여부를 기입합니다.
  법정양식이므로 정확하게 작성해야 하며, 거짓 기입 시 부정수급으로 결정되어 반환 및 추징이 발생합니다.
howto:
  - 신청인과 대상 자녀의 정보를 적습니다.
  - 급여를 받을 계좌번호를 적습니다.
  - 신청 기간 중 다른 소득 활동 여부를 확인하여 적습니다.
  - 신청인이 서명 또는 인감을 합니다.
faq:
  - q: 육아휴직과 근로시간 단축은 어떻게 다른가요?
    a: 육아휴직은 8세 이하(초등 2학년 이하) 자녀용이고, 근로시간 단축은 12세 이하(초등 6학년 이하) 자녀용입니다. 신청인이 상황에 맞게 선택하면 됩니다.
  - q: 신청 기간은 정해져 있나요?
    a: 휴직 또는 단축 시작일 이후 1개월부터 종료일 이후 12개월 이내에 신청해야 합니다.
related: [parental-leave-request, gov-maternity-leave-benefit]
variant_use: 육아휴직·근로시간 단축 급여 신청용 법정 양식입니다.
