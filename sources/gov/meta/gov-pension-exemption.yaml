tags: [국민연금, 납부예외, 납부재개, 지역가입자, 사업장가입자]
summary: 질병·실직·휴직 등으로 국민연금 보험료 납부가 어려울 때 납부를 예외로 신청하고, 예외 사유가 종료될 때 납부를 재개하는 법정 신청서입니다.
usage: >
  지역가입자나 사업장에서 월 보험료를 낼 수 없는 사람이 국민연금공단에 제출합니다.
  납부 예외를 신청할 때는 예외 사유 코드와 예외 예정일을 적습니다.
  납부를 재개할 때는 재개일과 이후 소득을 적습니다.
  신청서 뒷면의 예외 사유 부호표를 참고하여 정확한 코드를 기입해야 합니다.
howto:
  - 납부 예외신청서 또는 납부 재개신고서 중 해당 항목을 선택합니다.
  - 개인정보와 예외 사유 코드를 적습니다.
  - 예외 기간 또는 재개 기간을 적습니다.
  - 신청인이 서명 또는 인감을 합니다.
faq:
  - q: 예외 사유 코드는 어디서 확인하나요?
    a: 신청서에 지역가입자, 사업장가입자별 예외 사유 부호표가 있습니다. 자신의 상황과 맞는 번호를 선택하면 됩니다.
  - q: 자동이체는 언제 신청하나요?
    a: 납부를 재개 신고할 때만 자동이체를 신청할 수 있습니다. 은행명과 계좌번호를 적으면 됩니다.
related: [gov-health-voluntary-continuation, gov-maternity-leave-benefit]
variant_use: 국민연금 납부예외·재개 신청용 법정 양식입니다.
