summary: 기부금을 받은 단체가 기부자에게 발급하는 법정 기부금 영수증입니다.
usage: '기부금을 받은 단체가 기부자에게 발급하는 영수증으로, 기부자의 세액공제 증거서류로 사용됩니다. 기부자와 기부금 단체의 정보, 기부 내용(금액, 날짜), 기부금 구분 코드를 기재합니다. 현물기부 시에는 품명, 수량, 단가를 함께 기록합니다. 기부금공제대상 기부금단체로 규정하는 법령을 명시해야 합니다.

  '
howto:
- 기부자의 성명(법인명), 주민등록번호(사업자등록번호), 주소를 적습니다.
- 기부금 단체명, 사업자등록번호, 소재지를 기재합니다.
- 기부 구분(금전 또는 현물)과 기부일, 금액을 입력합니다.
- 현물기부면 품명, 수량, 단가를 작성합니다.
- 기부자와 수령인이 각각 서명 또는 인을 합니다.
faq:
- q: 금전기부와 현물기부는 어떻게 다르게 적나요?
  a: 금전기부는 구분란에 "금전"만 적고, 현물기부는 "현물"과 함께 품명·수량·단가를 기재합니다.
- q: 기부금공제 근거법령을 모르면 어떻게 하나요?
  a: 소득세법, 법인세법, 조세특례제한법 등에 따라 정해지며, 해당 법령 조항과 코드번호를 확인하여 적습니다.
- q: 언론기관을 통해 기부했을 때도 영수증을 받나요?
  a: 네, 언론기관이 기부금을 중개한 경우 ❸ 기부금 모집처(언론기관)에 매체명과 사업자등록번호를 적습니다.
