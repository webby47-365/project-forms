tags: [건강보험임의계속, 건강보험가입, 퇴직자보험, 직장가입자, 자영업자보험]
summary: 직장을 그만둔 후 건강보험 자격을 유지하고 싶을 때 국민건강보험공단에 제출하는 법정 신청서입니다.
usage: >
  직장을 그만두어 직장가입자에서 지역가입자로 자격이 변동된 사람이 건강보험 임의계속 가입을 신청하는 서류입니다.
  임의계속가입은 사직 후 지역가입자가 된 다음 최초 보험료 납부기한부터 2개월 이내에 신청해야 합니다.
  신청인의 인적사항, 퇴직한 사업장 정보, 피부양자가 있으면 피부양자 정보, 보험료 자동이체와 전자고지 신청을 작성합니다.
  임의계속 기간은 최장 36개월이며, 첫 보험료를 2개월 내에 납부하지 않으면 자격이 소급하여 상실됩니다.
howto:
  - 가입 또는 탈퇴 선택 항목에 √ 표시를 합니다.
  - 신청인(가입자)의 성명, 주민등록번호, 주소, 전화번호를 적습니다.
  - 퇴직한 사업장의 명칭과 재직기간을 월 단위로 기입합니다.
  - 피부양자가 있는 경우 관계, 성명, 주민등록번호, 장애인·국가유공자 여부를 적습니다.
  - 보험료 자동이체와 전자고지 신청 사항을 선택하고 서명 또는 인장합니다.
faq:
  - q: 임의계속가입 신청 기한은 정해져 있나요?
    a: 예, 지역가입자 보험료 납부기한부터 2개월 이내에 신청해야 합니다. 기한을 지나면 신청이 불가능합니다.
  - q: 얼마나 오래 임의계속가입을 유지할 수 있나요?
    a: 최장 36개월입니다. 그 이후는 지역가입자로 자동 전환됩니다. 재취업하면 직장가입자로 변경됩니다.
  - q: 재취업하면 어떻게 되나요?
    a: 재취업한 직장에서 직장가입자 자격을 취득하면 임의계속가입은 자동으로 상실되고 직장가입자로 전환됩니다.
