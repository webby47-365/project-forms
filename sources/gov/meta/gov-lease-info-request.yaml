summary: 임대차계약서상 확정일자 부여 현황과 임차인 정보를 요청하는 법정 신청서입니다.
usage: '이 서식은 주택을 임차하려거나 현재 임차인이 임대차 정보를 필요할 때 읍·면·동사무소에 제출합니다. 요청인의 신분과 요청 이유를 확인하는 항목들을 정확히 기재해야 하며, 이해관계인으로서 요청하는 경우 그 사유를 명시해야 합니다. 대리인이 신청하는 경우 대리인의 신분증 사본을 첨부합니다. 요청 대상 주택의 정확한 소재지(건물명, 동, 층, 호수까지
  구체적 기재)를 기재하고, 확정일자 부여현황의 종류(일반, 임차인 특정, 임대인·임차인용, 계약 갱신 거절 임차인용)를 선택해야 합니다. 수수료 600원과 신분증이 필요합니다.

  '
howto:
- 요청인 신분(이해관계인 또는 계약자)과 연락처를 적습니다.
- 요청할 주택의 위치를 동·호수까지 구체적으로 기재합니다.
- 확정일자 부여현황의 종류를 선택하고 필요시 임차인 성명을 적습니다.
- 요청 정보의 형태(열람 또는 출력물 교부)를 선택합니다.
- 신청인이 서명하고 해당 읍면동사무소 또는 공증인에게 제출합니다.
faq:
- q: 이해관계인으로 요청할 수 있는 자격이 무엇인가요?
  a: 임대인·임차인, 주택 소유자, 등기기록상 권리자, 우선변제권 승계 금융기관, 계약 갱신 거절로 피해를 입은 전 임차인 등이 해당합니다.
- q: 대리인이 신청하려면 어떻게 해야 하나요?
  a: 신청인의 인감증명서, 본인서명사실 확인서 또는 신분증명서 사본을 첨부하고, 대리인의 신분증을 제시합니다.
- q: 처리기간은 얼마나 걸리나요?
  a: 확정일자 정보제공은 즉시 처리됩니다.
