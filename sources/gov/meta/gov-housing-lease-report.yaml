summary: 주택을 월세나 전세로 빌리거나 빌려줄 때 시·군·구청에 신고하는 임대차 계약 신고서입니다.
usage: '주택 임대차 계약을 체결하거나 갱신했을 때 계약 내용을 시·군·구 또는 읍면동에 신고하는 서류입니다. 임대인과 임차인의 인적사항, 주택의 종류·위치·면적, 임대료(보증금·월차임), 계약 기간, 계약갱신요구권 행사 여부를 기입합니다. 신고는 계약 체결일부터 30일 이내에 해야 하며, 부동산거래관리시스템(rtms.molit.go.kr)에서도 온라인
  신청이 가능합니다. 신고하지 않거나 거짓으로 신고하면 100만원 이하의 과태료가 부과될 수 있습니다.

  '
howto:
- 임대인의 성명(법인명), 주민등록번호, 주소, 전화번호를 적습니다.
- 임차인의 성명(법인명), 주민등록번호, 주소, 전화번호를 적습니다.
- 주택의 종류를 선택하고 소재지, 건물명, 동·층·호를 정확히 기입합니다.
- 신규 또는 갱신 계약을 선택해 보증금, 월차임, 계약 기간, 체결일을 적습니다.
- 계약갱신요구권 행사 여부를 표시하고 임대인·임차인이 함께 서명 또는 인장합니다.
faq:
- q: 온라인으로도 신고할 수 있나요?
  a: 예, 부동산거래관리시스템(rtms.molit.go.kr)에서 온라인으로 신고할 수 있습니다.
- q: 신고 기한을 놓치면 어떻게 되나요?
  a: 계약 체결일부터 30일 이내 미신고 또는 거짓 신고 시 100만원 이하의 과태료가 부과됩니다.
- q: 보증금이나 월세가 변경되면 다시 신고해야 하나요?
  a: 예, 변경·해제 사항이 확정되면 30일 이내에 변경 신고를 해야 합니다.
