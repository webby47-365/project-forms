summary: 자동차를 사거나 받은 후 새로운 소유자로 등록을 변경하는 신청서입니다.
usage: 자동차를 사거나 증여·상속 등으로 받은 새 소유자가 자동차등록관청에 소유권 이전을 신청하는 서류입니다. 신청인·양도인 정보, 자동차등록번호, 주행거리, 등록 원인을 적습니다. 원문에 따르면 매매는 매수한 날부터 15일 이내 등 원인별 기간 안에 신청해야 하며, 넘기면 범칙금 대상이 됩니다. 자동차365(www.car365.go.kr)에서도 신청할
  수 있습니다.
howto:
- 신청인(신 소유자)의 성명, 주민등록번호, 사용 본거지를 적습니다.
- 구 소유자(양도인)의 성명, 주민등록번호, 주소를 기입합니다.
- 자동차등록번호, 주행거리, 등록 원인을 선택합니다.
- 등록 원인에 따라 필요한 서류(양도증명서, 인감증명서 등)를 준비합니다.
- 신청인이 서명 또는 인을 하고 해당 자동차등록사무소에 제출합니다.
faq:
- q: 매매 후 언제까지 신청해야 하나요?
  a: 매매일부터 15일 이내 신청합니다. 기한 내 미신청 시 관련 규정에 따라 범칙금이 부과됩니다.
- q: 자동차365에서도 신청이 가능한가요?
  a: 네, 자동차365(www.car365.go.kr)에서 온라인으로도 신청할 수 있습니다.
- q: 대리인이 신청할 수 있나요?
  a: 네, 대리인 신청 시 위임장과 위임인의 신분증명서 사본이 필요합니다.
