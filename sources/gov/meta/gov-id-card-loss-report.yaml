summary: 주민등록증이나 모바일 주민등록증을 잃어버렸을 때 읍면동에 제출하는 분실신고서입니다.
usage: '주민등록증이나 모바일 주민등록증을 잃어버렸을 때 해당 읍면동 주민센터에 신고하는 서류입니다. 분실자의 성명, 주민등록번호, 주소, 연락처와 분실 일시, 분실 사유를 기입합니다. 신고서는 분실신고만 하는 용도이며, 재발급을 받으려면 별도의 재발급 신청서를 작성해야 합니다. 분실신고가 접수되면 주민등록증과 모바일 주민등록증의 효력이 모두 정지됩니다.

  '
howto:
- 주민등록증 분실, 모바일 주민등록증 분실, 분실신고 또는 철회 중 해당 항목에 √ 표시합니다.
- 분실자의 성명(한글), 주민등록번호, 주소, 연락처를 적습니다.
- 분실한 날짜와 분실 사유를 구체적으로 기입합니다.
- 분실자가 직접 신고하는 경우 '신고(철회)인' 칸에 서명 또는 인장합니다.
- 다른 사람이 대리 신고하는 경우 신고인의 성명, 주민등록번호, 분실자와의 관계를 적습니다.
faq:
- q: 분실신고 후 신분증을 찾았으면 어떻게 하나요?
  a: 읍·면사무소 또는 동 주민센터에 철회 신청을 하면 됩니다. 이 신청서의 철회 항목을 선택해 제출합니다.
- q: 분실신고만으로 새 신분증을 받을 수 있나요?
  a: 아니요, 분실신고는 효력 정지만 합니다. 새 신분증이 필요하면 별도의 재발급 신청서를 제출해야 합니다.
- q: 대리인이 신고할 수 있나요?
  a: 예, 신고인이 직접 신고할 수 없을 때 대리인이 신고할 수 있습니다. 신고인의 성명과 분실자와의 관계를 적으세요.
