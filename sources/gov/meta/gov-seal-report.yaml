tags: [인감신고, 인감변경, 서면신고, 보증인, 증명청]
summary: 인감을 처음 신고하거나 기존 인감을 새로운 인감으로 변경할 때 증명청에 제출하는 법정 신고서입니다.
usage: >
  직접 증명청을 방문할 수 없을 때 서면으로 신고합니다.
  신고인과 보증인이 함께 작성하고, 신고할 인감의 인장이나 인감지를 첨부합니다.
  보증인은 인감이 이미 신고된 성년자여야 하며 신고인의 진의를 확인해야 합니다.
  신고는 무료이나 변경은 600원의 수수료가 발생합니다.
howto:
  - 신고인의 성명·주민등록번호·주소를 적습니다.
  - 신고할 인감을 보존용 칸에 찍고 인감지를 첨부합니다.
  - 서면신고 사유와 이를 증명하는 서류를 준비합니다.
  - 보증인이 인감을 날인하거나 서명하고, 신고인이 서명 또는 인감을 합니다.
faq:
  - q: 보증인은 누구나 되나요?
    a: 인감이 신고된 성년자만 보증인이 될 수 있으며, 신고인의 진의를 확인하고 보증해야 합니다. 보증인의 인감은 반드시 신고된 것이어야 합니다.
  - q: 서면신고 사유로 뭘 적나요?
    a: 직접 방문할 수 없는 사유(해외 거주, 수감, 질병 등)와 이를 증명하는 서류(3개월 이내)를 제출합니다.
related: [power-of-attorney, gov-seal-certificate-poa]
variant_use: 인감 신고·변경용 서면신고 법정 양식입니다.
