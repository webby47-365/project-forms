summary: 정부기관이나 공공기관에 보유한 정보를 공개해달라고 청구하는 법정 신청서입니다.
usage: 정부 부처·지방자치단체·공공기관이 가지고 있는 정보를 공개해 달라고 청구하는 서류입니다. 청구인의 인적사항, 청구 내용, 공개 방법(열람·사본·전자파일 등)과 수령 방법을 적습니다. 수수료 감면 대상이면 사유를 적고 증명서류를 붙입니다. 정보공개포털(www.open.go.kr)에서도 청구할 수 있습니다.
howto:
- 청구인의 성명(법인명·대표자명), 생년월일, 주소, 전화번호를 적습니다.
- 공개를 받으려는 정보를 구체적으로 '청구 내용'에 기입합니다.
- 공개 방법(열람, 사본, 전자파일 등)과 수령 방법(방문, 우편, 팩스 등)을 선택합니다.
- 수수료 감면 대상이면 해당 사유를 적고 증명서류를 첨부합니다.
- 서명 또는 인장을 하고 접수 기관장에게 제출합니다.
faq:
- q: 정보공개 청구가 거절될 수도 있나요?
  a: 예, 국가안보·개인정보 침해·법인 영업 비밀 등의 이유로 공개가 거절될 수 있습니다. 거절된 경우 이의신청이 가능합니다.
- q: 정보공개를 받으면 수수료를 내야 하나요?
  a: 기본적으로 무료이나, 사본이나 전자파일 등을 받을 때는 실비 범위의 수수료가 청구될 수 있습니다.
- q: 오랫동안 결정이 없으면 어떻게 하나요?
  a: 원문 안내에 따르면 청구한 날부터 20일이 지나도록 공개 여부 결정이 없으면 이의신청이나 행정심판 등을 청구할 수 있습니다.
