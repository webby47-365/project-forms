summary: 본인이나 다른 사람의 주민등록표 등본 또는 초본을 열람하거나 교부받기 위한 법정 신청서입니다.
usage: '읍면동 주민센터나 정부24에 제출하여 주민등록표를 발급받습니다. 신청인의 신분증을 제시하고, 필요한 항목(과거 주소 변동·세대원·병역사항 등)을 선택하여 신청합니다. 개인정보보호를 위해 필요한 정보만 선택하면 그 부분만 기재되어 발급됩니다. 본인이 신청하는 경우와 다른 사람이 신청하는 경우 용도 및 목적 작성 여부가 다릅니다.

  '
howto:
- 신청인 정보(성명·주민등록번호·주소)를 적습니다.
- 등본 또는 초본을 선택하고, 포함할 정보를 체크합니다.
- 용도 및 목적을 기입합니다(다른 사람 신청 시 필수).
- 신청인이 서명 또는 인감을 합니다.
faq:
- q: 등본과 초본은 어떻게 다른가요?
  a: 등본은 세대주와 세대원이 함께 나오는 세대 단위 기록이고, 초본은 한 사람의 주소 변동 이력 등 개인 기록입니다. 제출처가 요구하는 쪽을 고르십시오.
- q: 다른 사람 주민등록표도 신청할 수 있나요?
  a: 법정 상속, 채무청구 등 정당한 사유가 있어야 하며, 용도와 증명 자료를 제시해야 합니다.
