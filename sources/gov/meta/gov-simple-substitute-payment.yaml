summary: 회사에서 받지 못한 임금을 근로복지공단으로부터 받는 대지급금 지급을 신청하는 양식입니다.
usage: '퇴직자나 재직 중인 근로자가 회사에서 체불된 임금의 대지급금을 신청할 때 근로복지공단 관할 지역본부 또는 지사에 제출합니다. 청구인 정보, 근무기간, 청구 구분(퇴직자/재직자), 체불 임금 구분(판결/확인서), 미수금액, 대상 사업주 정보를 작성합니다. 판결에 따른 신청은 판결일부터 1년 이내, 확인서에 따른 신청은 발급일부터 6개월 이내에 제출해야
  합니다.

  '
howto:
- 청구인(본인)의 성명, 주민등록번호, 주소, 휴대전화번호를 적습니다.
- 체불 임금의 대상이 된 회사에서의 근무 기간을 적습니다.
- 청구 구분(퇴직자/재직자)과 청구 방식(판결/확인서)을 선택합니다.
- 지급받지 못한 임금의 총 확정금액과 이미 받은 금액을 기입합니다.
- 입금받을 본인 계좌 정보를 기입하고 서명 또는 인을 합니다.
faq:
- q: 판결 없이도 신청할 수 있나요?
  a: 체불임금등·사업주 확인서로도 신청 가능합니다. 근로복지공단에서 확인서 발급 기준과 절차를 문의하십시오.
- q: 처리 기간은 얼마나 되나요?
  a: 법정 처리 기간은 14일입니다. 더 자세한 일정은 신청한 지역본부 또는 지사에 문의하십시오.
- q: 대지급금 지급 대상이 되는 임금은 무엇인가요?
  a: 최종 3개월분 임금·휴업수당·출산전후휴가 급여와 최종 3년간의 퇴직급여(퇴직자의 경우)가 대상입니다.
