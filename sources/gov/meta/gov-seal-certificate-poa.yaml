summary: 인감증명서 발급을 받기 위해 다른 사람에게 권한을 위임하는 법정 위임장입니다.
usage: 본인이 직접 주민센터를 방문하기 어려울 때 대리인에게 인감증명서 발급을 맡기며 쓰는 위임장입니다. 위임자의 인적사항, 용도, 발급 통수와 대리인의 인적사항·관계를 적고 위임자가 서명 또는 인감을 찍습니다. 원문에 따르면 위임(동의) 효력은 위임일부터 6개월입니다. 대리인은 신분증을 지참합니다.
howto:
- 위임자의 성명·주민등록번호·주소·신분증 종류를 적습니다.
- 용도와 발급 통수를 기입합니다.
- 대리인의 성명·주민등록번호·주소와 위임자와의 관계를 적습니다.
- 위임자가 자필로 서명하거나 인감으로 날인합니다.
faq:
- q: 용도는 구체적으로 뭐라고 적나요?
  a: 부동산 매매용, 근저당 설정용 같이 구체적으로 적습니다. 포괄적 표현은 피해야 합니다.
- q: 유효기간이 있나요?
  a: 위임 또는 동의일부터 6개월까지 유효합니다. 기간 내에 인감증명서를 받아야 합니다.
