- 사업자
- 폐업
- 영업중단
summary: 사업을 휴업하거나 폐업할 때 세무서에 제출하는 법정 신고서입니다.
usage: '사업을 일시 중단하거나 완전히 폐지할 때 세무서(홈택스)에 신고하는 서류입니다. 휴업 또는 폐업을 선택하고, 해당하는 사유를 체크합니다. 휴업이면 휴업 기간을, 폐업이면 폐업일을 기입합니다. 홈택스(www.hometax.go.kr)에서도 온라인 신고가 가능합니다.

  '
howto:
- 상호(법인명), 사업자등록번호를 적습니다.
- 성명(대표자), 전화번호, 사업장 소재지를 기재합니다.
- 휴업 또는 폐업을 선택하고 해당 날짜를 적습니다.
- 휴업/폐업 사유에 해당하는 번호를 체크합니다.
- 대리인이 신고하면 위임장과 함께 제출합니다.
faq:
- q: 휴업과 폐업의 차이가 뭔가요?
  a: 휴업은 일정 기간 사업을 중단했다가 재개할 수 있고, 폐업은 사업을 완전히 끝내는 것입니다.
- q: 폐업한 뒤 부가가치세 신고는 언제 하나요?
  a: 원문 유의사항에 따르면 폐업일이 속한 달의 말일부터 25일 이내에 부가가치세 확정신고·납부를 해야 합니다.
- q: 폐업할 때 사업자등록증이 필요한가요?
  a: 폐업신고를 할 때는 사업자등록증 원본을 함께 제출해야 합니다.
