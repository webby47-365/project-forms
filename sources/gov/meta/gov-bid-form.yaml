summary: 국가·지방자치단체의 공사·물품·용역 입찰에 참가할 때 제출하는 법정 입찰서입니다.
usage: '정부나 지자체의 공사, 물품구매, 용역 발주에 입찰할 때 작성하는 서류입니다. 입찰 공고번호, 건명, 입찰금액, 준공 예정일, 입찰자 정보를 기입합니다. 입찰금액이 100억원 이상인 경우 산출내역서를 별도로 첨부합니다. 구체적 입찰 유의사항과 계약조건은 발주기관의 입찰공고를 확인하십시오.

  '
howto:
- 입찰 공고번호, 입찰 일자, 공사/물품/용역 구분을 적습니다.
- 공사명(건명)과 입찰 금액을 기재합니다.
- 준공(납품) 예정 연월일을 적습니다.
- 입찰자 정보(상호, 법인등록번호, 주소, 전화번호, 대표자명)를 적습니다.
- 서명 또는 인을 하고 발주기관에 제출합니다.
faq:
- q: 입찰금액을 어떻게 계산하나요?
  a: 발주기관의 설계서·규격서를 검토하여 자신의 비용을 근거로 입찰금액을 결정합니다.
- q: 입찰보증금이 따로 필요한가요?
  a: 입찰공고에 명시된 보증금이 있으면 별도로 납부해야 합니다.
- q: 100억 이상 공사는 어떻게 다른가요?
  a: 100억원 이상 공사는 산출내역서를 작성하여 입찰서와 함께 제출합니다.
