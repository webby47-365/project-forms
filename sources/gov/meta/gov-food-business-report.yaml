summary: 음식점·카페·편의점 등 식품을 취급하는 영업장을 운영할 때 시·군·구청에 내는 법정 신고서입니다.
usage: '식품을 취급하는 영업장을 운영하려는 사람이 해당 시·군·구청에 신고하는 서류입니다. 신고인의 인적사항, 영업장의 명칭·주소·전화번호, 영업 종류, 영업장 면적, 식품용수 종류, 공동조리장 이용 여부를 작성합니다. 신고 처리 기간은 15일 이내이며, 필요시 시설조사를 실시합니다. 처리수수료는 전자민원 신고 시 8,300원(한시적 영업신고), 일반영업신고
  25,200원이고, 방문·우편 신청 시는 9,300원·28,000원입니다.

  '
howto:
- 신고인의 성명, 주민등록번호(법인의 경우 법인명칭 및 대표자명), 주소를 적습니다.
- 신고장소의 명칭, 전화번호, 소재지, 영업 종류를 선택해 기입합니다.
- 영업장 면적, 식품용수 종류, 공동조리장·공유주방 이용 여부 등을 표시합니다.
- 법정 신고임을 확인하고 서명 또는 인장을 합니다.
- 행정정보 공동이용 동의서에 동의 여부를 표시하고 서명합니다.
faq:
- q: 영업신고 전에 무엇을 준비하나요?
  a: 원문 첨부서류 목록(교육이수증, 건강진단 결과서 등)을 확인해 준비하고, 제출 기관에 필요 서류를 확인하십시오.
- q: 폐업할 때도 신고하나요?
  a: 예, 식품위생법에 따라 신고한 영업을 폐업하는 때에도 신고해야 합니다.
- q: 처리 기간은 얼마나 되나요?
  a: 신고서 접수 후 검토·결재를 거쳐 15일 이내에 신고증을 발급합니다. 필요시 시설조사를 실시합니다.
