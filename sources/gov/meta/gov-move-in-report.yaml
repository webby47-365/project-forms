summary: 새로운 주소로 이사할 때 읍·면·동사무소에 제출하는 법정 전입신고서입니다.
usage: 세대 전체가 이사해 세대주 변경이 없을 때 이사한 날부터 14일 이내에 새 주소지 읍·면·동 주민센터에 내는 신고서입니다. 신고인의 성명·주민등록번호·연락처, 전에 살던 곳과 현재 사는 곳, 전입 사유를 적습니다. 정당한 사유 없이 기간을 넘기면 과태료가 부과될 수 있습니다. 우편물 전입지 전송 서비스를 원하면 아래 동의서 부분을 함께 작성합니다.
howto:
- 신고인(세대주)의 성명, 주민등록번호, 연락처를 적습니다.
- 이전에 살던 시·도와 시·군·구(상세 주소는 생략 가능)를 기입합니다.
- 현재 사는 곳(이사한 곳)의 주소를 건물명, 동, 호수까지 정확히 기입합니다.
- 전입 사유를 해당하는 것 하나 선택하고, 필요하면 '그 밖의 사유'에 구체적으로 기입합니다.
- 신고인이 서명하고 읍·면·동사무소에 제출합니다.
faq:
- q: 세대 일부만 이사하면 어떻게 하나요?
  a: 이 서식은 세대 전체가 이사하는 경우입니다. 세대원 중 일부만 이동하는 경우 별도 서식을 사용합니다.
- q: 14일을 지나서 신고하면 어떻게 되나요?
  a: 정당한 사유 없이 14일을 넘기면 5만 원 이하의 과태료를 받습니다.
- q: 우편물 전입지 전송 서비스는 무엇인가요?
  a: 이전 주소로 배달되던 우편물을 새로운 주소로 3개월간 자동으로 받을 수 있는 서비스입니다.
