summary: 집을 옮기거나 세대 구성을 확인해야 할 때 읍면동에 신청하는 전입세대확인서 열람·교부 신청서입니다.
usage: '임대차계약, 금융거래, 공공지원 신청 등 특정 목적으로 전입세대확인서가 필요할 때 해당 시·군·구 또는 읍면동에 신청하는 서류입니다. 개인이 신청하거나 법인·단체가 신청할 수 있으며, 다른 사람에게 신청을 위임할 수도 있습니다. 신청 내용(열람 또는 교부), 신청인 인적사항, 위임 여부, 용도 및 목적을 작성합니다. 처리 기간은 즉시이며, 열람은
  1건 1회 300원, 교부는 1통 400원입니다. 일부 대상은 수수료가 면제됩니다.

  '
howto:
- 신청 내용에서 열람 또는 교부를 선택해 √ 표시합니다.
- 신청인의 성명, 주민등록번호, 주소, 연락처를 적습니다.
- 열람 또는 교부 대상이 되는 건물·시설의 정확한 주소를 기입합니다.
- 신청 용도 및 목적을 구체적으로 작성합니다.
- 위임받아 신청하는 경우 위임장을 작성하고 위임인의 서명 또는 인장을 합니다.
faq:
- q: 열람과 교부의 차이는 뭔가요?
  a: 열람은 신청처에서 서류를 확인하는 것이고, 교부는 사본을 받아가는 것입니다.
- q: 수수료를 면제받을 수 있나요?
  a: 수급자, 독립유공자, 국가유공자 등 일부 대상은 수수료가 면제됩니다. 해당 사항이 있으면 증명서류를 제출하십시오.
- q: 다른 사람이 신청해줄 수 있나요?
  a: 예, 신청을 위임할 수 있습니다. 위임장과 본인 및 위임인의 신분증명서를 함께 제출해야 합니다.
