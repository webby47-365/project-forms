summary: 행정청의 처분이나 부작위에 불복할 때 행정심판위원회에 제출하는 법정 청구서입니다.
usage: '행정청의 처분이나 부작위에 이의가 있을 때 행정심판을 청구하는 서류입니다. 청구인의 인적사항, 피청구인, 처분 내용과 청구 취지를 기입합니다. 처분 내용을 증명하는 증거서류를 함께 제출해야 합니다. 처분이 있음을 안 날부터 제출 기한 등 자세한 사항은 해당 행정심판위원회에 확인하십시오.

  '
howto:
- 청구인 정보(성명, 주소, 주민등록번호, 전화번호)를 적습니다.
- 대리인이 있으면 대리인 정보를 적습니다.
- 피청구인과 소관 행정심판위원회를 선택하여 적습니다.
- 처분 내용과 처분을 안 날을 기입합니다.
- 청구 취지 및 이유를 작성하고 증거 서류를 기재합니다.
faq:
- q: 대리인 없이 혼자 청구할 수 있나요?
  a: 네, 대리인이 없어도 청구할 수 있습니다. 대리인을 선임하면 위임장과 대리인의 자격 증명 서류가 필요합니다.
- q: 처분을 안 날부터 얼마 내에 청구해야 하나요?
  a: 처분을 안 날부터 제출 기한이 정해져 있습니다. 해당 행정심판위원회 규정을 확인하십시오.
- q: 구술심리를 신청하려면 어떻게 하나요?
  a: 구술심리를 원하면 해당 란에 "여"를 체크하고 별도 신청서를 첨부합니다.
