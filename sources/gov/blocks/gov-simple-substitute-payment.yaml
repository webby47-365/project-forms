    size: 7.2
- {type: spacer, exact: true, height_pt: 6.1}
- type: gov_table
  widths: [100.0]
  heights_mm: [4.63, 19.81]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 자료제공 요청 동의]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, '본인은 귀 기관이 「임금채권보장법」 제23조제1항제6호ㆍ제8호 및 제9호에 해당하는 자료를 「법률구조법」 제8조에 따른 대한 법률구조공단, 「근로자퇴직급여 보장법」 제26조에 따른 퇴직연금사업자 및 「보험업법」에 따른 보험회사로부터 제공받아 간이대지급금 지급 등의 처리 업무에 이용하는 것에 동의합니다.']
    - [l, ＊동의하지 않는 경우에는 청구인이 직접 관련 자료를 간이대지급금 지급청구서 접수기관에 제출해야 합니다. 청구인            (서명 또는 인)]
    size: 7.2
- {type: page_break}
- type: gov_table
  widths: [100.0]
  heights_mm: [4.63, 40.61]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 공지사항]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, 1. 이 민원의 처리 결과에 대한 만족도 및 관련 제도 개선에 필요한 의견조사를 위해 귀하의 전화번호 또는 휴대전화번호로 전화 조사를 할 수 있습니다.]
    - [l, '2. 거짓이나 그 밖의 부정한 방법으로 대지급금을 지급받은 경우 「임금채권보장법」 제14조에 따라 그 대지급금의 전부 또는 일부를 환수하고, 거짓이나 그 밖의 부정한 방법으로 지급받은 대지급금의 5배 이하의 금액을 추가로 징수할 수 있으며, 같은 법 제28조제1항에 따라 3년 이하의 징역 또는 3천만원 이하의 벌금형을 받을 수 있습니다.']
    - [l, '3. 체불 임금등ㆍ사업주 확인서에 따라 대지급금이 지급된 경우, 근로복지공단은 「임금채권보장법」 제8조제1항에 따라 대지급금 지급액의 한도에서 청구인의 임금등 청구권을 대위하여 해당 사업주에 대해 민사소송 등을 제기할 수 있으며, 민사소송 등의 과정 에서 필요한 경우 청구인에게 협조를 요청할 수 있습니다. 만약 청구인이 대지급금 지급과정에서
        주장했던 임금등 체불액이 민사소송 등에서 인정되지 않을 경우, 「임금채권보장법」 제14조제2항제2호에 따라 대지급금의 전부 또는 일부를 환수할 수도 있습니다.']
    size: 7.2
- {type: spacer, exact: true, height_pt: 7.2}
- type: gov_table
  widths: [100.0]
  heights_mm: [4.63, 138.53]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 작성방법]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, 1. ①“근무기간”란에는 간이대지급금의 지급대상이 되는 임금등 체불 사업주에게 고용되어 근무한 기간을 적습니다.]
    - [l, '2. ②“청구 구분”란 중 “퇴직자 대지급금 청구”란은 「임금채권보장법」 제7조제1항제4호 또는 제5호에 따라 퇴직한 근로자에 대한 간이 대지급금을 청구하는 경우에 표시하고, “재직자 대지급금 청구”란은 같은 법 제7조의2제1항에 따라 재직 중인 근로자에 대한 간이 대지급금을 청구하는 경우에 표시합니다.']
    - [l, '3. ②“청구 구분”란 중 “판결등에 따른 청구”란은 「임금채권보장법」 제7조제1항제4호(같은 법 제7조의2제1항에서 제7조제1항제4호에 해당하는 경우를 포함)에 따라 확정 판결등으로 간이대지급금 지급을 청구하는 경우에 표시하고, 체불 임금등ㆍ사업주 확인서에 따른 청구”란은 「임금채권보장법」 제7조제1항제5호(같은 법 제7조의2제1항에서 제7조제1항제5호에
        해당하는 경우를 포함)에 따라 체불 임금등ㆍ사업주 확인서로 간이대지급금 지급을 청구하는 경우에 표시합니다.']
    - [l, '4. ③“지급받지 못한 임금등의 총 확정금액”란에는 “판결등에 따른 청구”의 경우에는 법원에서 판결등을 통해 인정되어 확정된 체불 임금등의 금액을 적고, “체불 임금등ㆍ사업주 확인서에 따른 청구”의 경우에는 체불 임금등ㆍ사업주 확인서에서 인정된 체불 임금등의 금액을 적습니다.']
    - [l, 5. ④“지급받지 못한 임금등의 총 확정금액에 대하여 대지급금 지급 청구일까지 사업주 등으로부터 지급받은 금액”은 법원에서 확정한 체불 임금등 중 지급청구서 제출일 현재까지 사업주나 퇴직연금사업자 등으로부터 지급받은 임금등이나 퇴직연금 등의 금액을 말합니]
    - [l, 다.]
    - [l, '6. ⑤란의 가. “최종 3개월분(재직자의 경우 소송등 또는 진정등 제기일 기준 마지막 3개월분)의 임금ㆍ휴업수당ㆍ출산전후휴가 기간 중 급여”는 간이대지급금 지급청구서 제출일 현재 기준, 사업주로부터 지급받지 못한 전체 체불 임금등 중 퇴직일부터 최종 3개월(재직자의 경우 소송등 또는 진정등의 제기일을 기준으로 맨 나중의 임금 체불이 발생한
        날부터 소급하여 3개월)에 해당하는 임금ㆍ휴업수당ㆍ출산전후휴가기간 중 급여를 말합니다.']
    - [l, '7. ⑤란의 나. “최종 3년간의 퇴직급여등(퇴직자인 경우)”은 “퇴직자 대지급금 청구”란에 표시한 근로자에 한하여, 간이대 지급금 지급청구서 제출일 현재 기준, 사업주로부터 지급받지 못한 전체 체불 임금등 중 퇴직일부터 최종 3년간에 해당하는 퇴직 급여등을 말합니다.']
    - [l, '8. ⑥“지급받아야 할 대지급금”란은 ⑤란의 “가” 와 “나”의 합계 금액을 말합니다. 다만, 합계 금액이 고용노동부장관이 고시한 대지급금의 상한액을 초과하는 경우에는 그 상한액이 지급받게 될 대지급금의 금액이 됩니다.']
    - [l, 9. ⑦“대지급금 지급 결정 시 희망하는 통지 방법”란은 대지급금을 지급하기로 결정된 경우 청구인이 통지받기를 원하는 방법을 표시합니다(일부지급 또는 부지급 시에는 우편으로 통지합니다).]
    - [l, 10. ⑧“입금의뢰”란에는 청구인이 소지하고 있는 본인의 예금계좌 중에서 간이대지급금의 입금을 희망하는 예금계좌에 관한 사항을 적습니다. 만약 간이대지급금을 압류방지 전용계좌(「임금채권보장법」 제11조제1항 본문에 따른 대지급금수급계좌)로 입금받기를 희망 하는 경우에는 담당하는 금융기관에서 청구인 본인 명의의 대지급금수급계좌를 발급받은 뒤 그
        계좌에 대한 사항을 적습니다.]
    - [l, '11. ⑨“대상사업주”란에는 청구인이 근로를 제공하고 임금등을 지급받지 못한 사업장의 명칭, 대표자 성명, 소재지를 적습니다.']
    - [l, '※ 간이대지급금 지급청구서는 판결등에 따라 청구하는 경우에는 해당 사업주에 대하여 「임금채권보장법」 제7조제1항제4호 각 목의 어느 하나에 해당하는 판결등을 받은 날부터 1년 이내에, 체불 임금등ㆍ사업주 확인서를 통해 청구하는 경우에는 체불 임금등 ㆍ사업주 확인서가 최초로 발급된 날부터 6개월 이내에 근로복지공단 관할 지역본부 또는 지사에
        제출해야 합니다.']
    size: 7.2
