  - at: [0, 2, 1, 1]
    lines:
    - [l, '1. 「임금채권보장법」 제7조제1항제4호 각 목의 어느 하나에 해당하는 판결, 명령, 조정 또는 결정 등이 있는 경우 그 정본 또는 사본']
    - [l, '2. 다음각목의어느하나에해당하는종국판결,소송상화해또는결정이있는경우에는그확정증명원정본또는사본']
    - [l, 가. 「임금채권보장법」 제7조제1항제4호가목에 따른 종국판결]
    - [l, 나. 「임금채권보장법」 제7조제1항제4호다목에 따른 확정판결과 같은 효력을 가지는 것 중 소송상 화해]
    - [l, 다. 「임금채권보장법」 제7조제1항제4호마목에 따른 조정을 갈음하는 결정]
    - [l, 3. 체불 임금등ㆍ사업주 확인서 원본 또는 사본]
    size: 7.2
