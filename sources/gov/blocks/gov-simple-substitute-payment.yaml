  - at: [6, 1, 1, 4]
    lines:
    - [l, '④지급받지 못한 임금등의 총 확정금액에 대하여 대지급금 지급 청구일까지 사업주나 퇴직연금사업자 등으로부터 지 급받은 금액(사업주 지급금, 퇴직연금, 외국인 근로자의 출국만기보험ㆍ신탁 및 보증보험 등의 금액) 원']
    - [l, '가. 지급 청구일까지 지급받지 못했으나, 향후 퇴직연금사업자로부터 지급받을 퇴직연금이 있습니까?']
    - [r, '[ ]예   [ ]아니오']
    - [l, '나. 지급청구일까지지급받지못했으나, 향후외국인근로자의출국만기보험ㆍ신탁및보증보험으로지급받을보험금이있습니까?']
    - [r, '[ ]예   [ ]아니오']
    size: 8.1
  - at: [7, 1, 1, 4]
