    - [c, 확인사항]
    size: 7.2
  - at: [1, 1, 1, 1]
    lines:
    - [l, '※ 담당 공무원이 행정정보의 공동이용을 통해 확인하는 것에 동의하는 서류 앞의 [ ]에 √표를 합니다.']
    - [l, '[ ] 1. 신청인이 전입세대확인서의 열람 또는 교부 신청을 할 수 있는 자 임을 입증하는 「주민등록법 시행규칙」 별표 2에 따른 서류']
    - [l, '[ ] 2. 신청인의 수급자 정보, 독립유공자 정보, 국가유공자 정보, 고엽제후 유의증환자 정보, 참전군인 정보, 5ㆍ18민주유공자정보, 특수임무 수행자 정보, 한부모가족 지원대상자 정보를 확인할 수 있는 자료']
    size: 7.2
  - at: [2, 1, 1, 1]
    lines:
    - [l, '※ 담당 공무원이 본인정보 제공 요구 및 공동이용 또는 행정정보 공동이용을 통해 확인하는 것에 동의하는 서류 앞의 [ ]에 √표를 합니다.']
    - [l, '[ ] 3. 신청인의 가족관계증명서(상세)']
    size: 7.2
- type: gov_table
  widths: [100.0]
  heights_mm: [4.98, 14.21, 5.72, 5.07, 32.19]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 본인정보 제공 요구서]
    size: 9.9
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, '「민원 처리에 관한 법률」 제10조의2, 같은 법 시행령 제7조의3 및 제7조의4에 따라 공동이용을 위한 본인정보를 위와 같이 신청합니다.']
    - [r, 신청인(위임한 사람)          (서명 또는 인)]
    size: 8.1
  - at: [2, 0, 1, 1]
    lines:
    - [l, 법원행정처장 귀하]
    size: 11.0
  - at: [3, 0, 1, 1]
    lines:
    - [c, 본인정보 공동이용 및 행정정보 공동이용 동의서]
    size: 9.9
    fill: true
  - at: [4, 0, 1, 1]
    lines:
    - [l, '[ ] 1. 본인은 이 건 업무 처리와 관련하여 「민원 처리에 관한 법률」 제10조의2에 따른 본인정보 제공 요구를 통해 민원처리 기관의 담당자가 전자적으로 본인에 관한 행정정보를 확인하는 것에 동의합니다.']
    - [l, '[ ] 2. 본인은 이 건 업무 처리와 관련하여 담당 공무원이 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용(「주택임대차보호법」 제3조의6제2항 후단에 따른 전산처리정보조직의 이용을 포함합니다)을 통해 위의 담당 공무원 확인사항을 확인하는 것에 동의합니다.']
    - [l, ※ 신청인이 본인정보 공동이용 또는 행정정보의 공동이용에 동의하지 않거나 본인정보 공동이용 또는 행정정보의 공동이용을 통해 확인할 수 있는 서류가 아닌 경우에는 신청인이 직접 해당 서류를 제출해야 합니다.]
    - [r, 신청인(위임한 사람)          (서명 또는 인)]
    size: 7.2
- type: gov_table
  widths: [100.0]
  heights_mm: [5.07, 136.47]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 유의 사항]
    size: 9.9
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, 1.‘서명 또는 인’란에는 서명을 하거나 도장을 찍어야 하며 지문은 사용할 수 없습니다. 이 경우 서명을 할 때에는 자필로 한글 성명을 써야 합니다.]
    - [l, '2. 외국인등록을 한 외국인 또는 국내거소신고를 한 외국국적동포의 경우 「출입국관리법」제33조제1항에 따른 외국인등록증 또는 「재외동포의 출입국과 법적 지위에 관한 법률」 제7조제1항에 따른 국내거소신고증을 제시해야 하며, 주민등록번호는 외국인등록 번호 또는 국내거소신고번호로 갈음할 수 있습니다.']
    - [l, 3. 법인ㆍ단체 신청인의 경우에는‘대표자’란에 대표자가 서명하거나 법인 인감(사용 인감을 포함합니다)을 찍습니다.]
    - [l, 4. 동일 신청자가 동일 증명자료에 따라 동일 목적으로 여러 건물 또는 시설의 소재지에 대해 전입세대확인서의 열람 또는 교부를 신청하는 경우에는 「주민등록법 시행규칙」 별지 제15호서식과 별지 제16호서식에 따라 일괄 신청할 수 있습니다. 이 경우 해당 별지 제15호서식과 별지 제16호서식 사이에는 신청인의 확인(간인)이 있어야 합니다.]
    - [l, '5. 전입세대확인서의 열람 또는 교부 신청의 위임은 해당 건물 또는 시설의 소유자, 임차인, 임대차계약자 또는 매매계약자 본인만이 할 수 있습니다. 이 경우 위임받아 신청하는 자는 위임장과 본인 및 위임한 자의 신분증명서(법인ㆍ단체의 경우에는 대표자의 신분증명서, 법인인감증명서 또는 사용인감계를 말합니다)를 함께 제출해야 합니다.']
    - [l, 6. 다른 사람의 서명 또는 도장 등을 위조하거나 부정하게 사용하는 등의 방법으로 신청서 또는 위임장을 거짓으로 작성하는 경우에는 「형법」에 따라 처벌을 받게 됩니다.]
    - [l, 7. 확인하려는 전입세대의 주소가 사실과 다르게 기재된 경우에는 전입세대확인서를 통해 해당 전입세대를 확인할 수 없습니다.]
    - [l, '8. 외국인 및 외국국적동포는 세대주 또는 주민등록표 상의 동거인이 될 수 없으므로, 외국인 및 외국국적동포의 세대주 및 동거인 여부는 전입세대확인서를 통해 확인할 수 없습니다.']
    - [l, 9. ｢주민등록법 시행규칙｣ 제18조제1항에 따른 전입세대확인서 열람 또는 교부 신청 수수료 면제 대상은 다음과 같습니다.]
    - [l, 가. 「주민등록법」 제29조의2제2항제3호마목에 따라 국가나 지방자치단체가 공무상 필요하여 신청하는 경우]
    - [l, 나.「국민기초생활 보장법」 제2조제2호에 따른 수급자가 신청하는 경우]
    - [l, '다. 재해의 발생 등 행정안전부장관, 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장이 필요하다고 인정하는 경우']
    - [l, 라. 관계 법령에서 주민등록자료 제공에 대한 수수료를 면제하도록 한 규정이 있는 경우]
    - [l, 마.「독립유공자예우에 관한 법률」 제6조에 따라 등록된 독립유공자와 그 유족(선순위자만 해당됩니다)이 신청하는 경우]
    - [l, '바.「국가유공자 등 예우 및 지원에 관한 법률」 제6조에 따라 등록된 국가유공자 등과 그 유족(선순위자만 해당하되, 선순위자가 부 또는 모인 경우에는 선순위자가 아닌 모 또는 부를 포함합니다)이 신청하는 경우']
    - [l, 사.「고엽제후유의증 등 환자지원 및 단체설립에 관한 법률」 제4조에 따라 등록된 고엽제후유의증환자 등이 신청하는 경우]
    - [l, 아.「참전유공자 예우 및 단체설립에 관한 법률」 제5조에 따라 등록된 참전유공자 등이 신청하는 경우]
