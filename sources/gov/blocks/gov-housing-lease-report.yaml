    - [l, 1. 주택 임대차 계약서(「부동산 거래신고 등에 관한 법률」 제6조의5제3항에 따른 확정일자를 부여받으려는 경우 및 「부동산 거래신고 등에 관한 법률 시행규칙」 제6조의2제3항ㆍ제5항ㆍ제9항에 따른 경우만 해당합니다)]
    - [l, 2. 입금표ㆍ통장사본 등 주택 임대차 계약 체결 사실을 입증할 수 있는 서류 등(주택 임대차 계약서를 작성하지 않 은 경우만 해당합니다) 및 계약갱신요구권 행사 여부를 확인할 수 있는 서류 등]
    - [l, 3. 단독신고사유서(「부동산 거래신고 등에 관한 법률」 제6조의2제3항 및 같은 법 시행규칙 제6조의2제5항에 따라 단독으로 주택 임대차 신고서를 제출하는 경우만 해당합니다)]
    size: 7.2
- {type: spacer, exact: true, height_pt: 7.0}
- type: gov_table
  widths: [100.0]
  heights_mm: [5.11, 124.95]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 유의사항]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, '1. 「부동산 거래신고 등에 관한 법률」 제6조의2제1항 및 같은 법 시행규칙 제6조의2제1항에 따라 주택 임대차 계약 당사자는 이 신고서에 공동으로 서명 또는 날인해 계약 당사자 중 일방이 신고서를 제출해야 하고, 계약 당사자 중 일방이 국가, 지방자치 단체, 공공기관, 지방직영기업, 지방공사 또는 지방공단인 경우(국가등)에는 국가등이 신고해야
        합니다.']
    - [l, 2. 주택 임대차 계약의 당사자가 다수의 임대인 또는 임차인인 경우 계약서에 서명 또는 날인한 임대인 및 임차인 1명의 인적사항 을 적어 제출할 수 있습니다.]
    - [l, '3. 「부동산 거래신고 등에 관한 법률 시행규칙」 제6조의2제3항에 따라 주택 임대차 계약 당사자 일방이 이 신고서에 주택 임대 차 계약서 또는 입금증, 주택 임대차 계약과 관련된 금전거래내역이 적힌 통장사본 등 주택 임대차 계약 체결 사실을 입증할 수 있는 서류 등(주택 임대차 계약서를 작성하지 않은 경우만 해당합니다), 「주택임대차보호법」제6조의3에
        따른 계약갱신요 구권 행사 여부를 확인할 수 있는 서류 등을 제출하는 경우에는 계약 당사자가 공동으로 신고한 것으로 봅니다.']
    - [l, 4. 「부동산 거래신고 등에 관한 법률 시행규칙」 제6조의2제9항에 따라 신고인이 같은 조 제1항 각 호의 사항이 모두 적힌 주택 임대차 계약서를 신고관청에 제출하면 주택 임대차 계약 신고서를 제출하지 않아도 됩니다. 이 경우 신고관청에서 주택 임대차 계약서로 주택 임대차 신고서 작성 항목 모두를 확인할 수 없으면 주택 임대차 계약 신고서의
        제출을 요구할 수 있습니다.]
    - [l, 5. 「부동산 거래신고 등에 관한 법률 시행규칙」 제6조의5에 따라 주택 임대차 계약 당사자로부터 신고서의 작성 및 제출을 위임 받은 자는 제출인란에 서명 또는 날인해 제출해야 합니다.]
    - [l, '6. 주택 임대차 계약의 내용을 계약 체결일부터 30일 이내에 신고하지 않거나, 거짓으로 신고하는 경우 「부동산 거래신고 등에 관 한 법률」 제28조제5항제3호에 따라 100만원 이하의 과태료가 부과됩니다.']
    - [l, '7. 신고한 주택 임대차 계약의 보증금, 차임 등 임대차 가격이 변경되거나 임대차 계약이 해제된 경우에도 변경 또는 해제가 확정된 날부터 30일 이내에 「부동산 거래신고 등에 관한 법률」 제6조의3에 따라 신고해야 합니다.']
    size: 7.2
- {type: spacer, exact: true, height_pt: 8.0}
- type: gov_table
  widths: [100.0]
  heights_mm: [5.16, 81.32]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 작성방법]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, '①ㆍ② 임대인 및 임차인의 성명ㆍ주민등록번호 등 인적사항을 적으며, 주택 임대차 계약의 당사자가 다수의 임대인 또는 임차인인 경우 계약서에 서명 또는 날인한 임대인 및 임차인 1명의 인적사항을 적어 제출할 수 있습니다.']
    - [l, '③ 임대 목적물 현황의 종류란에는 임대차 대상인 주택의 종류에 √표시를 하고, 주택의 종류를 모를 경우 건축물대장(인터넷 건축 행정시스템 세움터에서 무료 열람 가능)에 적힌 해당 주택의 용도를 참고합니다.']
    - [l, '④ 소재지(주소)란에는 임대차 대상 주택의 소재지(주소)를 적고, 건물명이 있는 경우 건물명(예: OO아파트, OO빌라, 다가구건물 명 등)을 적으며, 동ㆍ층ㆍ호가 있는 경우 이를 적고, 구분 등기가 되어 있지 않은 다가구주택 및 고시원 등의 일부를 임대한 경우에도 동ㆍ층ㆍ호를 적습니다.']
    - [l, '⑤ 임대 면적란에는 해당 주택의 건축물 전체에 대해 임대차 계약을 체결한 경우 집합건축물은 전용면적을 적고, 그 밖의 건축물은 연면적을 적습니다. 건축물 전체가 아닌 일부를 임대한 경우에는 임대차 계약 대상 면적만 적고 해당 면적을 모르는 경우에는 방의 수(칸)를 적습니다.']
    - [l, '⑥ㆍ⑦ 신고하는 주택 임대차 계약이 신규 계약 또는 갱신 계약 중 해당하는 하나에 √표시를 하고, 보증금 또는 월 차임(월세) 금액을 각각의 란에 적으며, 임대차 계약 기간과 계약 체결일도 각각의 란에 적습니다.']
    - [l, ⑧ 갱신 계약란에 √표시를 한 경우 임차인이 「주택임대차보호법」제6조의3에 따른 계약갱신요구권을 행사했는지를 “행사” 또 는 “미행사”에 √표시를 합니다.]
    - [l, ※ 같은 임대인과 임차인이 소재지(주소)가 다른 다수의 주택에 대한 임대차 계약을 일괄하여 체결한 경우에도 임대 목적물별로 각각 주택 임대차 신고서를 작성해 제출해야 합니다.]
