- {type: spacer, exact: true, height_pt: 8.8}
- {type: para, text: '1. 주민등록표 열람 또는 등ㆍ초본 교부 신청인은 주민등록증(모바일 주민등록증을 포함합니다) 등 신분증명서 를 제시하여야 하며, 신청인이 「출입국관리법」 제31조에 따라 등록한 외국인 또는 「재외동포의 출입국 과 법적 지위에 관한 법률」 제6조에 따라 국내거소신고를 한 외국국적동포인 경우에는 외국인등록증 또 는 국내거소신고증을
    제시하여야 합니다. 또한 법인 방문자인 경우에는 방문자의 신분증명서와 사원증 또 는 재직증명서를 제시하여야 합니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.8}
- {type: para, text: 2. 본인ㆍ세대원이 본인ㆍ세대원의 주민등록표 열람 또는 등ㆍ초본 교부를 주민등록증(모바일 주민등록증을 포함합니다) 등 신분증명서만을 제시하여 신청하는 경우에는 “전자 이미지 서명 입력기”에 자필 한글 성 명으로 서명하여야 열람 또는 교부받을 수 있습니다., align: left, size: 9.0, space_after: 0,
  line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.4}
- {type: para, text: 3. ｢주민등록법 시행규칙｣ 제18조제1항에 따른 주민등록표 열람 또는 등ㆍ초본 교부 신청 수수료 면제 대 상은 다음과 같습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 가. 법 제29조제2항제1호에 따라 국가나 지방자치단체가 공무상 필요하여 신청하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 나. 「국민기초생활 보장법」 제2조제2호에 따른 수급자가 신청하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: '다. 재해의 발생 등 행정안전부장관, 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장이 필요하다고 인정하는 경우', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 라. 관계 법령에서 주민등록자료 제공에 대한 수수료를 면제하도록 한 규정이 있는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 마. 「독립유공자예우에 관한 법률」 제6조에 따라 등록된 독립유공자와 그 유족(선순위자만 해당됩니다)이 신청하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: '바. 「국가유공자 등 예우 및 지원에 관한 법률」 제6조에 따라 등록된 국가유공자 등과 그 유족(선순위자만 해당하되, 선순위자가 부 또는 모인 경우에는 선순위자가 아닌 모 또는 부를 포함합니다)이 신청하는 경우', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 사. 「고엽제후유의증 등 환자지원 및 단체설립에 관한 법률」 제4조에 따라 등록된 고엽제후유의증환자 등이 신청하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 아. 「참전유공자 예우 및 단체설립에 관한 법률」 제5조에 따라 등록된 참전유공자 등이 신청하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: '자. 「5ㆍ18민주유공자 예우에 관한 법률」 제7조에 따라 등록 결정된 5ㆍ18민주유공자와 그 유족(선순위자만 해당하되, 선순위자가 부 또는 모인 경우에는 선순위자가 아닌 모 또는 부를 포함합니다)이 신청하는 경우', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: '차. 「특수임무유공자 예우 및 단체설립에 관한 법률」 제6조에 따라 등록된 특수임무유공자와 그 유족(선순위자만 해당하되, 선순위자가 부 또는 모인 경우에는 선순위자가 아닌 모 또는 부를 포함합니다)이 신청하는 경우', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 카. 「한부모가족지원법」 제5조 또는 제5조의2에 따른 지원대상자가 신청하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: '타. 미성년자인 자녀(가족관계등록부 기록을 기준으로 하고, 조부모와 손자녀로만 구성된 가족의 경우에 는 손자녀를 말합니다) 2명 이상을 양육하는 사람이 신청하는 경우', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 파. 출생신고된 사람의 초본을 최초 1통 발급하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 하. 지방자치단체가 조례로 정하는 경우, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.8}
- {type: para, text: 4. 신청인은 “신청 내용”란의 각 항목에서 “포함”여부를 선택하여 신청할 수 있습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.8}
- {type: para, text: 5. 상속 등기 대위 신청을 위하여 채무자의 주민등록초본 교부를 신청하는 경우에는 과거의 주소 변동 사 항을 포함하여 열람하게 하거나 발급할 수 있습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.7}
- {type: para, text: '6. “과거의 주소 변동 사항”을 “직접 입력”으로 선택하는 경우, 그 기간은 1년 단위로 해야 합니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.8}
- {type: para, text: '7. 초본 교부를 신청할 때 “3. 과거의 주소 변동 사항 중 세대주의 성명과 세대주와의 관계” 항목은 대상자가 성 년인 경우에는 본인 또는 본인의 위임을 받은 사람, 대상자가 미성년자인 경우에는 세대주 또는 직계존 속, 국가나 지방자치단체가 공무상 필요한 경우에만 “포함”을 선택할 수 있고, “8. 병역사항” 항목은 본인
    이나 세대원(그 위임을 받은 사람 포함), 「주민등록법」 제29조제2항제5호에 따른 가족, 국가나 지방자치 단체가 공무상 필요한 경우에만 “포함”을 선택할 수 있습니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.8}
- {type: para, text: '8. 본인이나 세대원이 아닌 사람이 교부받는 등ㆍ초본에는 작성하신 용도 및 목적이 표시되니 반드시 “용도 및 목적”칸을 작성하여야 하며, 등본을 신청하는 경우에는 별도의 증명 자료를 제출하여야 합니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.7}
- {type: para, text: 9. 「주민등록법」 제37조제5호에 따라 거짓이나 그 밖의 부정한 방법으로 다른 사람의 주민등록표를 열람하 거나 등ㆍ초본을 교부받은 경우에는 3년 이하의 징역형이나 3천만원 이하의 벌금형을 받게 됩니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.8}
- {type: para, text: '10. 한 신청자가 하나의 증명 자료를 가지고 같은 목적으로 여러 사람의 주민등록표를 열람하거나 등ㆍ초본 교 부를 신청하는 경우에는 별지 제7호서식과 별지 제8호서식을 함께 사용하여 일괄적으로 신청할 수 있으며, 이 경우 별지 제7호서식과 별지 제8호서식 사이에는 신청인의 간인(서명 포함)이 있어야 합니다.', align: left,
  size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 6.8}
- {type: para, text: 11. 신청인이 「출입국관리법」 제31조에 따라 등록한 외국인 또는 「재외동포의 출입국과 법적 지위에 관한 법 률」 제6조에 따라 국내거소신고를 한 외국국적동포인 경우에는 주민등록번호칸에 외국인등록번호 또는 국내거소신고번호를 작성하시기 바랍니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
