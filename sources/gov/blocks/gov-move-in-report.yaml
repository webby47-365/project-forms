    lines:
    - [r, '※ 주택의 이름, 동 번호 및 호수까지 작성']
    - [l, 주소]
    - [r, (호수가 없는 경우에는 층수를 작성합니다)]
    size: 7.2
  - at: [4, 0, 1, 1]
    lines:
    - [l, 전입 사유 (※주된1가지)]
    size: 9.0
  - at: [4, 1, 1, 3]
    lines:
    - [l, '[ ] 직업 (취업, 사업, 직장 이전 등)        [ ] 교육 (진학, 학업, 자녀 교육 등)']
    - [l, '[ ] 가족 (가족과 함께 거주, 결혼, 분가 등)     [ ] 주거 환경 (교통, 문화 ㆍ 편의 시설 등)']
    - [l, '[ ] 주택 (주택 구입, 계약 만료, 집세, 재개발 등)  [ ] 자연 환경 (건강, 공해, 전원생활 등)']
    - [l, '[ ] 그 밖의 사유 (            )']
    size: 7.2
  - at: [5, 0, 1, 4]
    lines:
    - [l, 읍ㆍ면ㆍ동장 및 출장소장 귀하]
    size: 11.0
  - at: [6, 0, 1, 4]
    lines:
    - [c, 유의사항]
    size: 9.0
    fill: true
  - at: [7, 0, 1, 4]
    lines:
    - [l, '1. 전입신고는 신거주지에 전입한 날부터 14일 이내에 현 거주지에서 해야 하며, 전입신고 내용의 사실 여부는 통장ㆍ이장이 사후에 확인하며, 거짓으로 신고한 것이 확인되면 처벌을 받습니다.']
    - [l, '- 정당한 사유 없이 14일 이내에 신고를 하지 않으면 5만 원 이하의 과태료를 물게 되며, 거짓으로 신고한 경우에는 3년 이하의 징역형 또는 3천만원 이하의 벌금형을 받게 됩니다(「주민등록법」 제37조 및 제40조).']
    - [l, '2. 거짓 전입 및 무단 전출을 하면 신고한 최종 주소지에 ‘거주불명 등록’될 수 있고, ‘거주불명 등록’ 후 1년 내에 실제 거주지에 재등록하지 않으면 최종 주소지 관할 읍ㆍ면사무소 또는 동 주민센터의 주소를 행정상 관리주소로 하여 거주불명 등록을 할 수 있습니다.']
    - [l, '3. 전입 사유 칸은 「통계법」에 따라 인구 이동 통계 작성을 위한 자료로 활용됩니다. 같은 법 제32조에 따라 성실하게 응답해야 할 의무가 있으며, 같은 법 제33조에 따라 비밀이 보호되고, 전입 사유 칸의 내용은 통계 작성의 목적으로만 사용됩니다.']
    size: 7.2
  - at: [8, 0, 1, 4]
    lines:
    - [c, 작성방법]
    size: 9.0
    fill: true
  - at: [9, 0, 1, 4]
    lines:
    - [l, '1. ‘연락처’는 도로명주소 등 신고인에게 필요한 사항을 알리고 도우려는 목적으로만 이용되니 연락처가 바뀔 때에는 관할 읍ㆍ면사무소 또는 동 주민센터에 알려 주시기 바라며, 희망하는 사람만 연락처를 쓰기 바랍니다.']
    - [l, '2. 전입 주소가 다가구주택 또는 준주택인 경우에 ‘주택의 이름, 동 번호 및 호수(호수가 없는 경우에는 층수)’는 주민등록 관리 등을 위해 필요한 사항으로 공법상 주소로는 인정되지 않으며, 「주민등록법 시행령」 제9조제6항 각 호의 어느 하나에 해당하는 경우 국가나 지방자치단체 등에 전산자료의 형태로 제공될 수 있습니다.']
    - [l, '※ 다만, 「도로명주소법」에 의한 상세 주소(동ㆍ층ㆍ호)가 부여된 경우 공법상 주소로 전입신고 가능합니다.']
    size: 7.2
  - at: [10, 0, 1, 4]
    lines:
    - [l, ※ 우편물 전입지 전송 서비스를 신청하는 사람만 작성합니다.]
    size: 9.9
  - at: [11, 0, 1, 4]
    lines:
    - [l, 우편물 전입지 전송(전입신고 3일 후부터 3개월) 서비스 신청서 및 개인 정보 제공 동의서]
    size: 9.0
    fill: true
  - at: [12, 0, 1, 4]
    lines:
    - [l, '이 서비스는 전에 살던 주소지로 배달되던 우편물을 전입신고한 주소로 배달하는 서비스로서 세대주 및 세대원의 개인 정보가 우체국으로 제공되므로 신청인의 동의가 필요합니다(전입지 전송 서비스 신청 후 새로운 곳으로 다시 전입신고한 경우 기존에 신청한 건은 자동으로 삭제되며, 직전 주소지에서 새로 전입신고한 주소지로만 서비스가 제공됩니다).']
    - [l, ※ 수수료 등은 「우편법」에 따라 부과될 수 있습니다.]
    - [l, '■ 제공 항목: 동의하는 세대주 및 세대원의 성명, 주소, 전화번호(휴대전화 번호)']
    - [l, '○ 우편물 전송을 받으려 하는 세대주 및 세대원 성명 작성:']
    - [l, '○ 신청인 전화번호: ☏   -   -   (휴대전화:   -    -     )']
    - [l, '[ ] 위의 사항을 확인하였고 정보 제공에 동의합니다.']
    - [r, 신청인            (서명 또는 인)]
    size: 7.2
