- type: gov_table
  widths: [100.0]
  heights_mm: [8.71, 36.08]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 유의사항]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, '1. 이 신고서는 주민등록증 또는 모바일 주민등록증 분실신고를 하려고 할 때만 사용하시고, 주민등록증 또는 모바일 주민등록증을 재발급 받으려면 별지 제32호서식의 주민등록증 재발급 신청서 또는 별지 제31호의2서식의 모바일 주민등록증 재발급 신청서를 작성하시기 바랍니다.']
    - [l, 2. 주민등록증의 분실신고를 하신 분은 주민등록증 진위 확인 자동응답시스템(ARS 국번 없이 ‘1382’)을 이용하여 신고 사항의 처리 여부를 확인하실 수 있습니다.]
    - [l, 3. 분실된 주민등록증 또는 모바일 주민등록증을 되찾았을 때에는 읍ㆍ면사무소 또는 동 주민센터에 철회 신청을 하기 바랍니다.]
    - [l, 4. 주민등록증의 분실신고가 접수되면 주민등록증 및 모바일 주민등록증의 효력이 모두 정지됩니다.]
    size: 7.2
