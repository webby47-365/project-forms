    - [c, 유 의 사 항]
    size: 9.9
    fill: true
  - at: [4, 0, 1, 2]
    lines:
    - [l, 1. 공개 청구된 공개 대상 정보의 전부 또는 일부가 제3자와 관련이 있다고 인정되는 경우에는 「공공기관의 정보공개 에 관한 법률」 제11조제3항에 따라 청구사실이 제3자에게 통지됩니다.]
    - [l, '2. 정보공개를 청구한 날로부터 20일이 경과하도록 정보공개 결정이 없는 경우에는 「공공기관의 정보공개에 관한 법률」 제18조부터 제20조까지의 규정에 따라 해당 공공기관에 이의신청을 하거나, 행정심판(서면 또는 온라인 : www.simpan.go.kr) 또는 행정소송을 제기할 수 있습니다.']
    - [l, 3. 청구인은 정보공개시스템 및 다른 시스템과의 연계를 통해 통지된 문서를 대외적으로 활용하기 위해 필요한 경우 직인날인의 보완을 요구할 수 있습니다.]
    - [l, 4. 본인확인이 필요한 정보를 청구하는 경우「공공기관의 정보공개에 관한 법률」 제10조제1항제2호에 따라 공공기 관에서 청구인의 주민등록번호를 추가로 요구할 수 있습니다.]
    size: 9.0
