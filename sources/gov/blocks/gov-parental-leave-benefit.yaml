    lines:
    - [l, ① 급여 신청기간            년   월   일 ~   년 월 일]
    size: 9.0
  - at: [7, 0, 1, 3]
    lines:
    - [l, '①-1: 위 급여 신청기간에 ｢남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률｣ 제19조제2항 단서에 따른 육아 휴직 추가 부여기간(6개월)이 포함되어 있습니까?      [ ] 예        [ ] 아니오']
    size: 9.0
  - at: [8, 0, 1, 3]
    lines:
    - [l, '①-2(①-1란을 ‘예’로 선택한 경우). 육아휴직 추가 부여기간(6개월)이 포함된 경우 그 사유는 무엇입니까?']
    - [l, '[ ] 같은 자녀를 대상으로 부모가 모두 육아휴직을 각각 3개월 이상 사용한 경우의 부(父) 또는 모(母)']
    - [l, '[ ] 「한부모가족지원법」 제4조제1호의 부 또는 모']
    - [l, '[ ] 「장애인복지법 시행규칙」 별표 1에 따른 장애의 정도가 심한 장애아동의 부 또는 모']
    size: 9.0
  - at: [9, 0, 1, 3]
    lines:
    - [l, '①-3: 위 육아휴직 기간이 ｢남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률｣ 제19조제6항에 따른 육아휴직 기간입니까?   [ ] 예       [ ] 아니오']
    size: 9.0
  - at: [10, 0, 1, 3]
    lines:
    - [l, '①-4(①-3란을 ‘예’로 선택한 경우): 해당 육아휴직은 반드시 주 단위로(7일 또는 14일) 사용해야 합니다. 해당 하는 사용기간이 며칠입니까?   [ ] 7일       [ ] 14일']
    size: 9.0
  - at: [11, 0, 1, 3]
    lines:
    - [l, '①-5(①-3란을 ‘예’로 선택한 경우): 해당 육아휴직은 휴업ㆍ휴교ㆍ휴원, 방학, 질병ㆍ사고로 인한 입원 및 감 염병으로 인한 격리ㆍ등교 중지의 경우에만 사용할 수 있습니다. 해당하는 경우를 선택하여 주시기 바랍니다.']
    - [l, '[ ] 휴업ㆍ휴교ㆍ휴원 [ ] 방학 [ ] 질병ㆍ사고로 인한 입원 [ ] 감염병으로 인한 격리ㆍ등교 중지']
    size: 9.0
  - at: [12, 0, 1, 3]
    lines:
    - [l, ② 급여를 지급받을 계좌번호]
    - [l, '은행명:            계좌번호:            예금주:']
    size: 9.0
  - at: [13, 0, 1, 3]
    lines:
    - [l, '③ 대상 자녀에 대해 신청인이 아닌 부 또는 모가 과거에 육아휴직을 사용한 적이 있어 이번 육아휴직이 부모 중 두 번째 육아휴직에 해당합니까?  [ ] 예        [ ] 아니오']
    size: 9.0
  - at: [14, 0, 1, 3]
    lines:
    - [l, '④(③란을 ‘예’로 선택한 경우) 육아휴직 시작일 기준 신청인의 육아휴직 대상 자녀가 생후 18개월 이내에 해당합니까?']
    size: 9.0
  - at: [15, 0, 1, 3]
    lines:
    - [l, '[ ] 예        [ ] 아니오']
    size: 9.0
  - at: [16, 0, 1, 3]
    lines:
    - [l, '(④-1: ④란을 ‘예’로 선택한 경우 신청인의 배우자가 작성) 신청인의 배우자가 ｢고용보험법 시행령｣ 제95조의3제1 항에 따른 육아휴직급여 특례 규정을 적용받게 되면 해당 배우자에게 육아휴직 급여의 추가 지급분이 발생합니 까? ‘예’로 선택한 경우 해당 배우자의 인적사항 및 계좌번호를 적습니다.']
    size: 9.0
  - at: [17, 0, 1, 3]
    lines:
    - [l, '[ ] 예        [ ] 아니오']
    size: 9.0
  - at: [18, 0, 1, 3]
    lines:
    - [l, '배우자의 성명:            주민등록번호:']
    - [l, '(은행명:          계좌번호:           예금주:        )']
    size: 9.0
  - at: [19, 0, 1, 3]
    lines:
    - [l, '(④-2: ④란을 ‘아니오’로 선택한 경우) 신청인이 신청하려는 육아휴직 급여의 종류를 선택합니다.']
    - [l, '[ ] ｢고용보험법 시행령｣ 제95조에 따른 육아휴직 급여']
    - [l, '[ ] ｢고용보험법 시행령｣ 제95조의2제1항에 따른 육아휴직 급여 특례']
    - [l, ※ 2022년 1월 1일 현재 피보험자의 육아휴직 급여 특례의 적용 기간이 1개월 이상 남은 경우로서 2022년 1월 1일 이후의 육아휴직 기간에 대한 육아휴직 급여 특례를 적용받으려는 경우 선택할 수 있습니다.]
    size: 8.5
  - at: [20, 0, 1, 3]
    lines:
    - [l, '⑤ 신청인은 「한부모가족지원법」 제4조제1호 각 목의 어느 하나에 해당하는 모 또는 부로서 「고용보험법 시행령」 제95조의3제3항에 따른 육아휴직급여를 신청하는 것입니까?']
    size: 9.0
  - at: [21, 0, 1, 3]
    lines:
    - [l, '[ ] 예        [ ] 아니오']
    size: 9.0
  - at: [22, 0, 1, 3]
    lines:
    - [l, 3. 확인사항]
    size: 9.0
  - at: [23, 0, 1, 3]
    lines:
    - [l, '⑥ 급여 신청기간 중 사업주로부터 급여를 받은 사실이 있습니까?']
    - [l, '[ ] 예 (급여를 받은 기간:   부터   까지, 금액:       원),  [ ] 아니오']
    size: 9.0
  - at: [24, 0, 1, 3]
    lines:
    - [l, '⑦ 급여 신청기간 중에 조기 복직 또는 퇴사했거나 다른 사업장에서 근로소득 또는 자영업을 통한 사업 소득 활동을 한 사실이 있습니까? [ ] 예 [ ] 아니오']
    - [l, '※ ‘예’를 선택한 경우 아래 난에서 해당되는 곳에 √표시를 하고, 해당 내용을 적습니다. ▪ ( ) 조기복직        조기복직일:']
    - [l, '( ) 퇴사          퇴사일:']
    - [l, '▪ ( ) 근로소득        소득활동기간:           , 총 소득액:       원 ( ) 사업소득        소득활동기간:           , 총 소득액:       원 ▪ 근로소득의 경우 주당 근로시간: 주     시간']
    size: 9.0
  - at: [25, 0, 1, 3]
    lines:
    - [l, '⑧ 급여신청기간연장사유(육아휴직또는육아기근로시간단축기간이끝난후12개월이지나서신청하는경우에만적습니다) [            ]']
    size: 9.0
  - at: [26, 0, 1, 3]
    lines:
    - [l, 4. 서명 및 날인]
    size: 9.0
  - at: [27, 0, 1, 3]
    lines:
    - [l, 「고용보험법」 제70조 또는 제73조의2 및 같은 법 시행규칙 제116조제1항에 따라 위와 같이 신청합니다. 년   월   일]
    - [r, 신청인            (서명 또는 인)]
    - [r, 배우자            (서명 또는 인)]
    - [l, ○○지방고용노동청(지청)장 귀하]
    size: 9.0
- {type: page_break}
- type: gov_table
  widths: [100.0]
  heights_mm: [7.41, 25.1, 6.37]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 공지사항]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, 고용보험에서 지급하는 육아휴직 또는 육아기 근로시간 단축 급여는 육아휴직 또는 육아기 근로시간 단 축 시작일 이후 1개월부터 종료일 이후 12개월 이내에 신청해야 합니다.]
    - [l, '※ 다만, 천재지변 등의 사유로 육아휴직 또는 육아기 근로시간 단축 급여를 신청할 수 없었던 사람은 그 사유가 끝 난 후 30일 이내에 신청해야 합니다.']
    size: 8.5
  - at: [2, 0, 1, 1]
    lines:
    - [c, 작성방법]
    size: 9.0
    fill: true
- {type: para, text: 1. 근로자가 8세 이하 또는 초등학교 2학년 이하의 자녀의 양육을 위하여 한 육아휴직에 대하여 육아휴직 급 여를 신청하거나 12세 이하 또는 초등학교 6학년 이하의 자녀의 양육을 위하여 한 육아기 근로시간 단축 급여를 신청하려는 경우에는 1. 신청인 정보란에 대상 자녀의 주민등록번호를 적습니다., align: left,
  size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 2. 임신 중인 여성 근로자가 모성보호를 위하여 한 육아휴직에 대하여 육아휴직 급여를 신청하려는 경우에 는 1. 신청인 정보란에 출산 예정일(신청인이 육아휴직 신청 시 육아휴직 신청서에 적은 출산 예정일을 말합니다)을 적습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: 3. ①란에는 사업주로부터 부여받은 총 휴직기간 또는 근로시간 단축 기간 중 급여를 지급받으려는 기간을 적습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: '4. ①-1란에는 「남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률」 제19조제2항 단서에 따라 추가로 부여 받은 육아휴직 기간에 대한 육아휴직 급여 신청 여부를 적고, ①-2란에는 그 사유를 선택합니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: '5. ①-3란은 「남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률」 제19조제6항에 따른 육아휴직에 해당 하는지 여부를 선택하고, ①-4란은 해당 육아휴직 사용 기간을 선택하며, ①-5란은 해당 육아휴직 사 유를 선택합니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 6. ②란에는 반드시 신청인 본인의 계좌번호를 적어야 합니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: 7. ③란은 「고용보험법 시행령」 제95조의2제1항에 따라 같은 자녀에 대하여 부모가 순차적으로 육아휴 직을 사용하는 경우로서 두 번째 육아휴직을 사용한 사람에 해당하는지 여부를 적습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: 8. ④란 및 ④-1란은 「고용보험법 시행령」 제95조의3제1항에 따라 같은 자녀에 대하여 자녀의 출생 후 18개월이 될 때까지 피보험자인 부모가 모두 육아휴직을 하는 경우에 적습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: 9. ④-1란의 “추가 지급분”이란 신청인의 배우자가 「고용보험법 시행령」 제95조의3제1항에 따라 지급 받아야 할 육아휴직 급여에서 같은 법 시행령 제95조제1항에 따라 종전에 지급받은 육아휴직 급여를 뺀 금액을 말합니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 10. ⑤란은 신청인이 다음 각 목의 어느 하나에 해당하는 모 또는 부로서 「고용보험법 시행령」제95조의 3제3항에 따른 육아휴직급여를 신청하는지 여부를 적습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 가. 배우자와 사별 또는 이혼하거나 배우자로부터 유기(遺棄)된 사람, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: 나. 정신이나 신체의 장애로 장기간 노동능력을 상실한 배우자를 가진 사람, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 다. 교정시설ㆍ치료감호시설에 입소한 배우자 또는 병역복무 중인 배우자를 가진 사람, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: '라. 미혼자[사실혼(事實婚) 관계에 있는 사람은 제외됩니다]', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.8}
- {type: para, text: 마. 배우자의 생사가 분명하지 않은 사람, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 바. 배우자 또는 배우자 가족과의 불화 등으로 인하여 가출한 사람, align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 11. ⑥란에는 육아휴직 또는 육아기 근로시간 단축 급여 신청기간 중 사업주로부터 급여의 일부 또는 전부를 지급받은 경우(지급예정인 경우 포함) 그 기간 및 금액을 적습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: '12. ⑦란은 육아휴직 또는 육아기 근로시간 단축 급여 신청기간 중 ⓐ신고한 육아휴직 또는 육아기 근로시간 단축 기간보다 조기에 복직 또는 퇴사했거나, ⓑ해당 기간에 다른 사업장에서 근로소득 또는 자영업을 통한 소득이 있는 경우에만 적습니다. 급여신청기간 중 근로소득 및 사업소득이 있 었던 경우에는 해당 소득활동을 했던
    기간과 총 소득금액을 적되, 근로소득이 있었던 경우에는 주 당 근로시간까지 적습니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: '13. ⑥란, ⑦란 및 ⑧란을 사실대로 적지 않으면 부정수급으로 결정되어 수급한 급여액을 반환해야 하고, 그 급여액의 2배에 해당하는 금액을 추징당하는 등의 불이익을 받을 수 있습니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: '14. ⑧란에는 천재지변, 본인ㆍ배우자 또는 그 직계존속ㆍ직계비속의 질병ㆍ부상, 「병역법」에 따 른 의무복무, 범죄혐의로 인한 구속 또는 형의 집행의 경우 등 육아휴직 또는 육아기 근로시간 단축 급여를 신청할 수 없었던 사유를 적습니다.', align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 5.7}
- {type: para, text: 15. 배우자 서명란(1쪽 및 3쪽)은 신청내용 중 ④란을 ‘예’로 선택한 경우에만 적습니다., align: left, size: 9.0, space_after: 0, line_spacing: 1.0}
