  widths: [12.5, 87.5]
  heights_mm: [13.38, 61.86, 8.82, 30.67]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 등록원인]
    size: 9.9
  - at: [0, 1, 1, 1]
    lines:
    - [l, '[ ]매매     [ ]증여     [ ]촉탁     [ ]상속     [ ]기타']
    size: 9.0
  - at: [1, 0, 1, 2]
    lines:
    - [l, '「자동차관리법」 제12조제1항, 「자동차등록령」 제26조제1항 및 「자동차등록규칙」 제33조제1항에 따라 위와 같이 신청합니다.']
    - [r, 년   월   일]
    - [l, 신청인 성명]
    - [r, (서명 또는 인)]
    - [c, 생년월일]
    - [l, 특별시장·광역시장·특별자치시장·도지사·특별자치도지사 또는 시장·군수·구청장 귀하]
    size: 9.0
  - at: [2, 0, 1, 2]
    lines:
    - [c, 행정정보 공동이용 동의서]
    size: 9.0
    fill: true
  - at: [3, 0, 1, 2]
    lines:
    - [l, 본인은 이 건 업무처리와 관련하여 전산정보처리조직 및 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 특별시장·광역시 장·특별자치시장·도지사·특별자치도지사 또는 시장·군수·구청장이 뒤쪽의 확인 사항을 확인하는 것에 동의합니다.]
    - [l, ※ 신청인이 특별시장·광역시장·특별자치시장·도지사·특별자치도지사 또는 시장·군수·구청장의 확인에 동의하지 않거나 전산정보처리조직 및 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 확인할 수 없는 경우에는 해당 서류(법인 등기사항증명서는 제외합니]
    - [l, 다)를 신청인이 직접 제출해야 합니다.]
    - [r, 신청인(대표자)            (서명 또는 인)]
    size: 7.2
- {type: spacer, exact: true, height_pt: 11.2}
- {type: para, text: '210㎜×297㎜[백상지 또는 중질지 80g/㎡]', align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: page_break}
- type: gov_table
  widths: [9.543, 8.494, 69.023, 12.94]
  heights_mm: [111.0, 40.71]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 신청인(대]
    - [c, 표자)]
    - [c, 제출서류]
    size: 7.2
  - at: [0, 1, 1, 2]
    lines:
    - [l, 1. 자동차양도증명서(매매의 경우에만 제출합니다.) 1부]
    - [l, '2. 양도인의 인감증명서, 「본인서명사실 확인 등에 관한 법률」 제2조제3호에 따른 본인서명사실확인서 또 는 같은 법 제7조제5항에 따른 전자본인서명확인서의 발급증[매매로 인한 이전등록의 경우에만 첨부하며, 인감증명서의 경우 「인감증명법 시행령」 제13조제3항에 따라 인감증명서의 사용용도란에 자동차 매도 용임과 양수인의 성명ㆍ주소(「자동차관리법」제53조에
        따라 등록한 자동차매매업자의 경우 사업장소재']
    - [l, '지)ㆍ주민등록번호(법인일 경우 법인명칭ㆍ주소ㆍ법인등록번호)가 기재되어 발급된 것이어야 하고, 본인서 명사실확인서 또는 전자본인서명확인서 발급증의 경우 각각 부동산 관련 외의 용도란 또는 용도란에 자동 차 매도용임과 양수인의 성명ㆍ주소(「자동차관리법」제53조에 따라 등록한 자동차매매업자의 경우 사업 장소재지)ㆍ주민등록번호(법인일 경우 법인명칭ㆍ주소ㆍ법인등록번호)가
        기재되어 있는 것이어야 합니']
    - [l, '다.]. 다만, 다음 각 목의 어느 하나에 해당하는 경우에는 양도인이 이를 첨부할 필요가 없습니다.']
    - [l, 가. 「자동차관리법」 제53조에 따라 등록한 자동차매매업자가 매도한 경우]
    - [l, '나. 「자동차관리법」 제60조에 따른 자동차경매장의 개설자가 경매를 실시한 경우로서 경매거래를 증명하 는 서류(자동차등록번호, 양수인, 경락금액, 경매일자 등이 포함되어야 합니다.)의 원본을 제출한 경우']
    - [l, 다. 양도자와 양수자가 직접 거래한 경우로서 양도인이 등록 관청에서 직접 자동차의 양도 사실을 확인하는 경우]
    - [l, 3. 증여증서(증여의 경우에만 제출합니다.) 1부]
    - [l, 4. 매각결정서(「자동차관리법」 제26조제3항에 따라 매각된 경우에만 제출합니다.) 1부]
    - [l, 5. 확정판결 등본(판결에 따른 소유권 이전의 경우에만 제출합니다) 1부]
    - [l, '6. 대리인이 신청하는 경우에는 위임장 및 위임한 자의 신분을 확인할 수 있는 신분증명서 사본(법인인 경우에 는 법인인감증명서를 말하며, 해당 법인이 제출한 사용인감계를 등록 관청이 대조ㆍ확인할 수 있는 경우에는 제출하지 않아도 됩니다.) 각 1부']
    size: 7.2
  - at: [1, 0, 1, 2]
    lines:
    - [l, 특별시장ㆍ광역시장ㆍ 특별자치시장ㆍ도지사 ㆍ특별자치도지사]
    - [c, 또는]
    - [l, 시장ㆍ군수ㆍ구청장 확인사항]
    size: 7.2
  - at: [1, 2, 1, 1]
    lines:
    - [l, '1. 가족관계기록사항에 관한 증명서(상속의 경우에만 해당하며, 공증증서 등 상속 사실을 증명할 수 있는 서류로 갈음할 수 있습니다.)']
    - [l, '2. 소유자가 개인인 경우에는 주민등록표 초본, 운전면허증 또는 외국인등록사실증명(주민등록증 사본 또는 운전면허증 사본이나 그 밖의 사용 본거지를 알 수 있는 서류로 갈음할 수 있습니']
    - [l, 다.)]
    - [l, 3. 비사업용 자동차를 등록하는 법인 등의 경우에는 사업자등록증 또는 법인 등기사항증명서(사 업자등록증 사본이나 그 밖의 사용 본거지를 알 수 있는 서류로 갈음할 수 있습니다.)]
    - [l, 4. 자동차등록원부]
    size: 7.2
- {type: para, text: 수수료, align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: para, text: '1,000원. 다만,', align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.8}
- {type: para, text: 사용본거지와, align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 다른 시ㆍ도에, align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 신청하는 경우, align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.8}
- {type: para, text: '에는 1,500원', align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 4.9}
- {type: para, text: 입니다., align: right, size: 7.2, space_after: 0, line_spacing: 1.0}
- {type: spacer, exact: true, height_pt: 61.6}
- type: gov_table
  widths: [16.288, 83.712]
  heights_mm: [6.34, 18.16, 10.99, 10.95, 5.3, 6.95, 45.27]
  cells:
  - at: [0, 0, 4, 1]
    lines:
    - [l, 「지방세특례제한 법」에 따른]
    - [l, 취득세 감면 대상 여부]
    size: 7.2
  - at: [0, 1, 1, 1]
    lines:
    - [l, '[ ] 「장애인복지법」에 따른 장애인으로서 장애등급 1급부터 3급까지에 해당하는 사람']
    size: 7.2
  - at: [1, 1, 1, 1]
    lines:
    - [l, '[ ] 「국가유공자 등 예우 및 지원에 관한 법률」에 따른 국가유공자(「보훈보상대상자 지원에 관한 법률」 제2조 제1항 각 호의 어느 하나에 해당하는 보훈보상대상자 및 법률 제11041호 국가유공자 등 예우 및 지원에 관한 법률 일부개정법률 부칙 제19조에 해당하는 사람을 포함합니다)로서 상이등급 1급부터 7급까지의 판정을 받은 사람']
    size: 7.2
  - at: [2, 1, 1, 1]
    lines:
    - [l, '[ ] 「5ㆍ18민주유공자 예우에 관한 법률」에 따라 등록된 5ㆍ18민주화운동부상자로서 신체장애등급 1급부터 14급 까지의 판정을 받은 사람']
    size: 7.2
  - at: [3, 1, 1, 1]
    lines:
    - [l, '[ ] 「고엽제후유의증 등 환자지원 및 단체설립에 관한 법률」에 따른 고엽제후유의증환자로서 경도 장애 이상의 장 애등급 판정을 받은 사람']
    size: 7.2
  - at: [4, 0, 1, 2]
    lines:
    - [l, ※ 「지방세특례제한법」에 따라 취득세 감면 대상인 경우 해당하는 사항에 √ 표시를 해주시기 바랍니다.]
    size: 7.2
  - at: [5, 0, 1, 2]
    lines:
    - [c, 유의 사항]
    size: 9.0
    fill: true
  - at: [6, 0, 1, 2]
    lines:
    - [l, '1. 등록된 자동차매매업자를 통하여 중고자동차를 매매한 경우에는 자동차매매업자가 이전등록신청을 대행합니다. 다만, 양수인이 직접 이전등록 을 신청하려는 경우에는 그렇지 않습니다.(「자동차관리법」 제12조제2항)']
    - [l, 2. 양수인이 이전등록을 신청하지 않는 경우에는 양도인이 이전등록을 신청할 수 있습니다.(「자동차관리법」 제12조제4항)]
    - [l, '3. 양수인이 이전등록 기간(매매: 매수한 날부터 15일 이내, 증여: 증여받은 날부터 20일 이내, 상속: 상속 개시일이 속하는 달의 말일부터 6개 월 이내, 기타: 사유가 발생한 날부터 15일 이내) 이내에 이전등록을 신청하지 않을 경우에는 관련 규정에 따라 범칙금을 물게 됩니다.(「자 동차관리법」 제81조제2호, 제85조제1항)']
    - [l, '4. (휴대)전화번호와 전자우편(이메일)주소는 귀하의 자동차 관리(리콜 등)에 필요한 사항을 안내하고 도움을 드리려는 목적으로 이용되니 적어 주 시고, 변경되는 경우 관할 등록 관청에 알려 주십시오. 다만, 본인이 원하지 않으면 적지 않아도 됩니다.']
    size: 7.2
