- type: gov_table
  widths: [10.441, 80.713, 8.846]
  heights_mm: [60.67]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 첨부서류]
    - [c, (임의계속]
    - [c, 가입의]
    - [c, 경우만]
    - [c, 제출)]
    size: 8.1
  - at: [0, 1, 1, 1]
    lines:
    - [l, 1. 가족관계등록부의 증명서 등 가입자와의 관계를 확인할 수 있는 서류 1부]
    - [l, '2. 「장애인복지법」에 따라 등록된 장애인, 「국가유공자 등 예우 및 지원에 관한 법률」 제4조ㆍ 제73조 및 제74조에 따른 국가유공자 등(법률 제11041호로 개정되기 전의 「국가유공자 등 예우 및 지원에 관한 법률」 제73조의2에 따른 국가유공자 등을 포함한다)으로서 같은 법 제6조의4에 따른 상이등급 판정을 받은 사람과 「보훈보상대상자
        지원에 관한 법률」 제2조에 따른 보훈보상대 상자로서 같은 법 제6조에 따른 상이등급 판정을 받은 사람임을 증명할 수 있는 서류 1부(해당 사항이 있는 경우에만 제출합니다)']
    - [l, 3. 자격 취득을 신고하는 피부양자가 재외국민 또는 외국인인 경우에는 다음의 구분에 따른 서류]
    - [l, '가. 재외국민: 국내거소신고증 사본 또는 국내거소신고사실증명 1부']
    - [l, '나. 외국인: 외국인등록증 사본, 외국인등록사실증명, 국내거소신고증 사본(「재외동포의 출입국과 법적지위에 관한 법률」 제2조제2호에 따른 외국국적동포의 경우에만 제출합니다) 또는 국내거 소신고사실증명(「재외동포의 출입국과 법적지위에 관한 법률」 제2조제2호에 따른 외국국적동 포의 경우에만 제출합니다) 1부']
    size: 8.1
  - at: [0, 2, 1, 1]
    lines:
    - [c, 수수료]
    - [c, 없음]
    size: 8.1
- {type: spacer, exact: true, height_pt: 6.4}
- type: gov_table
  widths: [100.0]
  heights_mm: [6.15, 77.09]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 유 의 사 항]
    size: 9.9
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, 1. 임의계속가입을 신청할 수 있는 사람은 사용관계가 종료되어 직장가입자에서 지역가입자로 자격이 변동된 사람으로서 해당 사용관계가 끝난 날부터 소급하여 18개월 동안 통산 1년(365일) 이상 직장가입자의 자격을 유지한 사람으로서 해당 기간 중 보수월액보험료를 부담한 사람이어야 합니다. 이 경우 임의계속가입자인 사람이 재취업한 경우에는 최 종
        사용관계가 끝난 날(재취업하고 퇴직한 날)을 기준으로 18개월 동안 통산 1년 이상 직장가입자의 자격을 유지한 경우에만 임의계속 재가입이 가능합니다.]
    - [l, 2. 임의계속가입 신청은 지역가입자가 된 이후 「국민건강보험법」 제79조에 따라 최초로 고지받은 지역가입자 보험료의 납부 기한부터 2개월 이내에 신청하여야 합니다.]
    - [l, 3. 사용관계가 끝난 후 임의계속가입을 신청하여 직장가입자의 자격을 유지할 수 있는 기간은 퇴직한 다음 날부터 최장 36개월입니다.]
    - [l, 4. 이 신청에 따라 직장가입자의 자격을 유지하는 동안 적용하는 보수월액은 보수월액보험료가 산정된 최근 12개월간의 보수월액을 평균한 금액으로 합니다.]
    - [l, 5. 임의계속가입 후 최초로 내야 하는 보험료를 그 납부기한부터 2개월이 지난 날까지 납부하지 않으면 직장가입자의 자격이 소급하여 상실됩니다.]
    - [l, '6. 건강보험증은 가입자 또는 피부양자가 신청하는 경우 발급됩니다. 신청은 가까운 지사를 방문하거나 고객센터(☎ 1577-1000), 홈페이지(www.nhis.or.kr), 모바일앱 등을 통해 가능합니다.']
    - [l, '7. 전자고지 신청의 경우, 매월 15일까지 신청 시 신청 당월부터 적용되며, 신청인의 자격 변동 시 자동 해지 처리됩니다.']
    - [l, 8. 임의계속보험료 자동이체 신청 시 평생(전화)계좌. 법인계좌는 신청이 불가합니다.]
    - [l, 9. 환급계좌를 신청하면 향후 발생하는 환급금은 환급계좌로 자동 입금됩니다.]
    size: 8.1
- type: gov_table
  widths: [100.0]
  heights_mm: [6.15, 80.04]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 작 성 방 법]
    size: 9.9
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, '○ 임의계속가입 신청인 경우 “ [ ]가입“에, 탈퇴인 경우 “[ ]탈퇴“에 “∨“표시합니다.']
    - [l, '① ~ ④: 임의계속가입을 신청하는 가입(퇴직)자의 성명, 주민등록번호, 주소 및 전화번호를 적습니다. ⑤ㆍ⑥: 퇴직 당시의 사업장(기관)의 명칭 및 재직기간을 적습니다.']
    - [l, '⑦ ~ ⑪: 피부양자가 있는 경우 적습니다. 다만, 임의계속탈퇴 신청의경우에는 적지 마십시오.']
    - [l, '⑦: 가입자와의 관계를 적습니다.']
    - [l, '※ 배우자, 부모, 조부모, 자녀, 손자ㆍ손녀 이하, 형제자매, 처부모, 시부모, 사위ㆍ며느리, 증조부모, 계자, 생자녀, 생부모, 시조부모, 처조부모, 손녀사위, 손자며느리 등']
    - [l, '⑧ㆍ⑨: 신고 대상 피부양자의 성명, 주민등록번호(외국인등록번호)를 적습니다(외국인의 경우 외국인등록번호, 재외국민은 국내거소신고번호를 적습니다).']
    - [l, '⑩: 장애인 또는 국가유공자(6ㆍ18자유상이자 포함)인 경우 장애인ㆍ국가유공자의 종류 부호 및 등록일을 적습니다.']
    - [l, '※ 장애인ㆍ국가유공자의 종류 부호:']
