    size: 8.1
  - at: [1, 2, 1, 5]
    lines:
    - [l, 1. 대표자 주민등록상 주소 □]
    - [l, '2. 기타 □ (주소:          ,전화번호:        )']
    size: 8.1
  - at: [2, 2, 1, 5]
    lines:
    - [l, 주민등록상 주소가 이전하는 때에 송달장소도 변경되는 것에 동의 여부]
    - [l, '□ 동의함            □ 동의하지 않음 “주민등록상 주소”를 선택하고, 위의 동의함에 체크한 경우 대표자의 주민등록상 주소를이전하는때에자동으로송달장소가변경됩니다(｢국세기본법시행령｣ 제5조제2항)']
    size: 8.1
  - at: [3, 0, 1, 2]
    lines:
    - [l, 폐업자 멘토링 서비스 신청 여부]
    size: 8.1
  - at: [3, 2, 1, 1]
    lines:
    - [c, '[ ]여 [ ]부']
    size: 8.1
  - at: [3, 3, 1, 2]
    lines:
    - [l, 폐업사실증명서 신청 여부]
    size: 8.1
  - at: [3, 5, 1, 2]
    lines:
    - [c, '[ ]여 [ ]부']
    size: 8.1
  - at: [4, 0, 1, 7]
    lines:
    - [l, '※ 1. 폐업자 멘토링 서비스는 세무대리인을 선임하지 못한 경우 신청 가능하며, 서비스 제공 요건을 충족하지 못한 경우 서비스가 제공되지 않을 수 있습니다.']
    - [l, 2.폐업사실증명서는 사업이 실제로 종료된 사실을 확인해주는 서류로서 폐업일이 지나기 전에는 발급할 수 없습니다.]
    size: 8.1
  - at: [5, 0, 1, 7]
    lines:
    - [l, 납세자의 위임을 받아 대리인이 휴업ㆍ폐업 신고를 하는 경우에는 아래의 위임장을 작성하시기 바랍니다.]
    size: 8.1
    fill: true
  - at: [6, 0, 1, 1]
    lines:
    - [c, 위 임 장]
    size: 9.0
  - at: [6, 1, 1, 6]
    lines:
    - [l, '본인은 [ ]휴업,[ ]폐업신고와 관련한 모든 사항을 아래의 대리인에게 위임합니다. 본인 :            (서명 또는 인)']
    size: 8.1
  - at: [7, 0, 2, 1]
    lines:
    - [c, 대리인]
    - [c, 인적사항]
    size: 9.9
  - at: [7, 1, 1, 1]
