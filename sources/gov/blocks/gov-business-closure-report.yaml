- type: gov_table
  widths: [100.0]
  heights_mm: [5.17, 13.12]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 행정정보 공동이용 동의서]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, 본인은 이 건 업무처리와 관련하여 담당 공무원이 「전자정부법」 제36조에 따른 행정정보의 공동이용을 통해 위의 담당 공무원 확인 사항을 확인하는 것에 동의합니다. *동의하지 않는 경우에는 신고인이 직접 관련 서류를 제출해야 합니다. 신고인            (서명 또는 인)]
    size: 7.2
- type: gov_table
  widths: [100.0]
  heights_mm: [4.13, 24.42]
  cells:
  - at: [0, 0, 1, 1]
    lines:
    - [c, 참고 및 유의사항]
    size: 9.0
    fill: true
  - at: [1, 0, 1, 1]
    lines:
    - [l, ※ 참고사항]
    - [l, '관련 법령에 따라 허가ㆍ등록ㆍ신고 등이 필요한 사업으로서 주무관청에 제출해야 하는 해당 법령상의 신고서(예: 폐업신고서)를 함께 제출할 수 있습니다. 이 경우 세무서장은 해당 신고서를 주무관청에 보냅니다.']
    - [l, ※ 유의사항]
    - [l, '1. 휴업기간 중에도 제세신고 기한이 도래하면, 부가가치세 등 확정신고ㆍ납부를 해야 합니다.']
    - [l, 2. 폐업하는 사업자는 과세기간 개시일부터 폐업일까지의 사업실적과 잔존 재화에 대해 폐업일이 속한 달의 말일부터 25일 이내에 부가가치세 확정신고ㆍ납부를 해야 합니다.]
    size: 7.2
