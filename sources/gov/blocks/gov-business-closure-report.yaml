  - at: [8, 6, 1, 1]
  - at: [9, 0, 1, 7]
    lines:
    - [l, '「부가가치세법」 제8조제8항 및 같은 법 시행령 제13조제1항ㆍ제2항에 따라 위와 같이([ ]휴업, [ ]폐업)하였 음을 신고합니다.']
    - [r, 년   월   일]
