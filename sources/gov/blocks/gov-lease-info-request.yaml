    - [l, 2. 주택 소유자의 경우 등기사항증명서 등 소유자임을 증명하는 서류]
    - [l, 3. 해당 주택 또는 그 대지의 등기기록에 기재된 권리자의 경우 등기사항증명서 등 권리자임을 증명하는 서류]
    - [l, 4. 우선변제권을 승계한 금융기관의 경우 채권양도증서 등 우선변제권을 승계하였음을 증명하는 서류]
    - [l, 5.「주택임대차보호법」 제6조의3제1항제8호의 사유로 계약의 갱신이 거절된 임대차계약의 임차 인이었던 자의 경우 임대차계약증서 등 해당 주택의 임차인이었던 자임을 증명하는 서류]
