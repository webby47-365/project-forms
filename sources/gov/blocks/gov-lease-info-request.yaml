    - [l, '1. "확정일자 부여현황"이란 임대차목적물, 임대인ㆍ임차인의 인적사항(요청인에 따라 요청할 수 있는 범위가 다릅니다), 확정일자 부여일, 차임ㆍ보증금 및 임대차기간을 말합니다.']
    - [l, '2. "확정일자 부여현황(임차인 특정)"은 특정한 임차인의 확정일자 부여현황을 요청하는 것으로서, 반드시 임차인 성명을 적어 야 합니다.']
    - [l, '3. "확정일자 부여현황(임대인ㆍ임차인용)"은 임대인ㆍ임차인의 인적사항을 포함한 확정일자 부여현황을 요청하는 것으로서, 임 대차계약서상의 계약당사자(임대인ㆍ임차인)만 요청할 수 있으며, 반드시 임차인 성명을 적어야 합니다.']
    - [l, '4. "확정일자 부여현황(계약 갱신이 거절된 임대차계약의 임차인용)"은 「주택임대차보호법」 제6조의3제1항제8호의 사유로 계 약의 갱신이 거절된 임대차계약의 임차인이었던 자가 그 갱신요구가 거절되지 않았더라면 갱신되었을 기간 중 해당 주택에 존속하는 임대차계약의 확정일자 부여현황을 요청하는 것으로서, 인적사항은 임대인ㆍ임차인의 성명, 법인명
        또는 단체명만 요청할 수 있습니다.']
    size: 7.2
