id: bid-inquiry-form
title: 입찰 질의서
category: public
subcategory: procure
tags: [입찰질의서, 입찰문의, 공고질의, 입찰공고질의, 제안요청서질의]
summary: 입찰공고나 과업 내용 중 불분명한 부분을 발주기관에 문의할 때 쓰는 입찰 질의서 양식입니다.
usage: >
  입찰 공고문, 규격서, 과업지시서를 읽다가 해석이 애매한 부분을 발주기관에 서면으로 묻는 서식입니다.
  공고 번호와 공고명, 질의하는 항목의 쪽수와 조항을 적고 질문을 한 건씩 구체적으로 씁니다.
  질의 접수 기한과 방법(전자조달·이메일·팩스)은 공고마다 다르므로 공고문을 먼저 확인하십시오.
  회신 내용은 입찰서 작성의 근거가 되므로 받은 답변은 보관해 두는 것이 좋습니다.
source: original
featured: false
target_pages: 1
howto:
  - 공고번호와 공고명, 발주기관을 공고문대로 적습니다.
  - 질의하는 업체 정보와 담당자 연락처를 적습니다.
  - 질의 항목마다 해당 쪽수와 조항, 질문 내용을 적습니다.
  - 날짜를 적고 접수 방법에 맞춰 제출합니다.
faq:
  - q: 질의는 언제까지 보내야 하나요?
    a: 공고마다 접수 기한이 다릅니다. 입찰공고문의 질의 안내를 먼저 확인하십시오.
  - q: 질문이 여러 개면 어떻게 적나요?
    a: 한 줄에 한 건씩 나누어 적으면 회신을 받기 쉽습니다.
  - q: 회신은 어디에서 확인하나요?
    a: 공고마다 다릅니다. 이메일 회신이나 공고 게시판 등 안내된 방법을 확인하십시오.
related: [bid-document-submission-list, gov-bid-participation, bid-participation-poa, integrity-pledge-bidding]
blocks:
  - type: doc_title
    text: 입찰 질의서
    spaced: false
  - type: subtitle
    text: 1. 공고 정보
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["공고번호", "", "발주기관", ""]
      - ["공고명", "", "", ""]
    sample_rows:
      - ["", "20261000000-00", "", "한빛시청 총무과"]
      - ["", "청사 시설물 유지관리 용역", "", ""]
  - type: subtitle
    text: 2. 질의 업체
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["업체명", "", "대표자", ""]
      - ["담당자", "", "연락처", ""]
      - ["이메일", "", "질의일", ""]
    sample_rows:
      - ["", "(주)새길데이터", "", "이수현"]
      - ["", "박민준", "", "010-1234-5678"]
      - ["", "minjun@example.com", "", "2026-10-11"]
  - type: subtitle
    text: 3. 질의 내용
  - type: table
    widths: [8, 17, 35, 40]
    header: ["No", 쪽수·조항, 질의 내용, 회신(발주기관 기재)]
    empty_rows: 6
    row_height_mm: 10
    body_align: center
    sample_rows:
      - ["1", "5쪽 제3조", "점검 주기 확인 요청", ""]
      - ["2", "8쪽 규격서", "투입 인력 자격 확인", ""]
  - type: date_line
    sample_text: 2026 년   10 월   11 일
  - type: sign_line
    label: 질의 업체 대표자
    sample_names: [박민준]
  - type: notice
    text: 질의 접수 기한과 방법은 입찰공고문의 안내를 확인하십시오.
