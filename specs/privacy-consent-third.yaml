  - type: sign_line
    label: 본인(또는 법정대리인)
    sample_names: [홍길동]
  - type: notice
    text: 개인정보 보호법 제17조에 따라 제공받는 자, 제공 목적, 제공 항목, 보유기간 및 동의 거부권을 고지합니다.
