id: rent-reduction-request
title: 임대료 감액 요청서
category: estate
subcategory: lease
tags: [임대료감액요청서, 월세인하요청, 임대료조정, 차임감액, 임대료인하]
summary: 임대차 계약 기간 중 월세·관리비 조정을 임대인에게 요청할 때 현재 조건과 희망 조건, 사유를 적는 요청서입니다.
usage: >
  상가나 주택 임차인이 매출 감소, 시세 변동 등을 이유로 임대인에게 월세 감액을 요청할 때
  쓰는 서식입니다. 현재 보증금과 월세, 희망하는 월세와 적용 시작일을 숫자로 분명히 적고
  사유는 객관적인 사실 위주로 짧게 씁니다. 요청서는 협의를 시작하기 위한 문서이며 감액이
  확정되는 것은 아닙니다. 합의가 되면 별도 합의서나 계약서에 조건을 반드시 남기고, 법적
  판단이 필요한 경우 전문가와 상담하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 임차인과 임대인, 임대차 목적물을 적습니다.
  - 현재 보증금과 월세, 희망 월세와 적용 시작일을 적습니다.
  - 감액을 요청하는 사유를 사실 위주로 적습니다.
  - 요청일을 적고 서명한 뒤 사본을 보관합니다.
faq:
  - q: 요청서를 보내면 감액이 확정되나요?
    a: 아닙니다. 협의를 시작하는 문서이며 임대인이 동의해야 조건이 바뀝니다.
  - q: 합의되면 어떻게 남기나요?
    a: 바뀐 월세와 적용 시작일을 합의서나 계약서에 적어 양쪽이 서명하는 것이 안전합니다.
  - q: 사유 증빙을 같이 보내야 하나요?
    a: 매출 자료 등 객관적 자료를 붙이면 협의에 도움이 됩니다. 필수는 아닙니다.
related: [lease-renewal-contract, management-fee-settlement-confirmation, commercial-lease-contract, settlement-agreement]
blocks:
  - type: doc_title
    text: 임대료 감액 요청서
    spaced: false
  - type: subtitle
    text: 1. 당사자 및 목적물
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["임차인", "", "연락처", ""]
      - ["임차 목적물", "", "", ""]
      - ["임대인", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "010-1234-5678"]
      - ["", "서울시 ○○구 ○○로 12, 1층 101호", "", ""]
      - ["", "박민준", "", "010-9876-5432"]
  - type: subtitle
    text: 2. 현재 조건과 요청 조건
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["현재 보증금", "", "현재 월세", ""]
      - ["현재 관리비", "", "계약 종료일", ""]
      - ["희망 월세", "", "적용 시작일", ""]
    sample_rows:
      - ["", "20,000,000원", "", "1,500,000원"]
      - ["", "150,000원", "", "2027-03-31"]
      - ["", "1,300,000원", "", "2026-11-01"]
  - type: subtitle
    text: 3. 요청 사유
  - type: textbox
    hint: "감액을 요청하는 사유를 날짜·수치 등 사실 위주로 적으십시오."
    height_mm: 32
    sample_text: "최근 6개월 평균 매출이 전년 같은 기간보다 감소하여 월세 부담이 커졌습니다. 조정 가능 여부를 협의하고자 요청드립니다."
  - type: para
    text: 위와 같이 임대료 조정에 관한 협의를 요청합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   16 일
  - type: sign_line
