id: minor-overseas-travel-consent
title: 미성년 자녀 해외여행 동의서
category: public
subcategory: family
tags: [해외여행동의서, 미성년자해외여행, 친권자동의서, 자녀해외여행, 부모동의서]
summary: 미성년 자녀가 부모 한쪽 또는 제3자와 해외여행을 갈 때 친권자가 동행과 일정에 동의함을 적는 양식입니다.
usage: >
  미성년 자녀가 친권자 없이, 또는 한쪽 부모만 동행해 해외로 나갈 때 동행을 허락한다는 뜻을 남기는 서식입니다.
  자녀와 동의하는 친권자, 동행자의 정보와 여행 목적지, 기간을 적고 친권자가 서명합니다.
  항공사와 출입국 심사 기관은 요구 서류가 다를 수 있으므로 출발 전에 별도로 확인하십시오.
  본 서식은 동의 사실을 남기는 틀이며 법적 효력이나 입국 허용을 보장하지 않습니다. 여권번호는 적지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 자녀의 성명과 생년월일을 적습니다.
  - 동의하는 친권자와 동행자 정보를 적습니다.
  - 여행 목적지와 출국·귀국 예정일을 적습니다.
  - 날짜를 적고 친권자가 서명합니다.
faq:
  - q: 부모 한 명만 서명해도 되나요?
    a: 서식은 한 명이 써도 되지만, 이용할 항공사와 방문국이 요구하는 서류와 기준은 미리 확인하십시오.
  - q: 이 동의서만으로 출국이 가능한가요?
    a: 보장하지 않습니다. 출입국 기관과 항공사 안내에 따라 추가 서류가 필요할 수 있습니다.
  - q: 여권번호는 적지 않나요?
    a: 개인정보 보호를 위해 이 서식에는 적지 않습니다. 제출처가 요구하면 별도로 안내를 따르십시오.
related: [guardian-consent, family-relationship-confirmation, minor-activity-consent, field-trip-consent]
