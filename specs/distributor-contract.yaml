id: distributor-contract
title: 대리점 계약서
category: corp
subcategory: sales
tags: [대리점계약서, 대리점계약, 총판계약서, 판매대리점, distributor contract]
summary: 공급자와 대리점 간 판매지역·공급가격·최소판매수량·계약해지 조건을 정하는 대리점 계약서입니다.
usage: >
  제조사나 공급자가 특정 지역에서 대리점에게 판매를 위탁할 때 체결하는 계약서입니다.
  판매지역과 최소 판매수량, 공급가격과 결제조건을 명확히 정해야 분쟁을 막을 수
  있습니다. 상표 사용 범위와 재고·반품 처리, 계약기간과 해지 조건도 함께 정해
  둡니다. 본 서식은 참고용이며 개별 사안의 법적 적합성은 이용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

howto:
  - 공급자와 대리점 정보를 적고 판매지역을 정합니다.
  - 공급가격과 결제조건, 최소 판매수량을 정합니다.
  - 상표 사용 범위와 재고·반품 처리 방법을 정합니다.
  - 계약기간과 해지 조건을 확인하고 서명합니다.

faq:
  - q: 판매지역은 겹쳐도 되나요?
    a: 분쟁을 막으려면 대리점별 판매지역을 서로 겹치지 않게 명확히 정하는 것이 좋습니다.
  - q: 계약서만으로 법적 효력이 충분한가요?
    a: 본 서식은 참고용이므로 개별 사안에 맞는 법적 적합성은 이용자가 직접 확인해야 합니다.

blocks:
  - type: doc_title
    text: 대리점 계약서
    spaced: false

  - type: para
    text: 공급자와 대리점은 아래와 같이 대리점 계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 계약 당사자

  - type: grid
    widths: [13, 21, 13, 19, 17, 17]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["공급자 상호", "", "대표자", "", "사업자등록번호", ""]
      - ["소재지", "", "담당자", "", "연락처", ""]
      - ["대리점 상호", "", "대표자", "", "사업자등록번호", ""]
      - ["소재지", "", "담당자", "", "연락처", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "홍길동", "", "000-00-00000"]
      - ["", "서울시 마포구 월드컵북로 100", "", "김서연", "", "010-1234-5678"]
      - ["", "한빛물산", "", "박민준", "", "000-00-00000"]
      - ["", "부산시 해운대구 센텀중앙로 50", "", "이수현", "", "010-9876-5432"]

  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 공급자가 대리점에게 아래 상품의 판매를 위탁하고, 대리점이 이를 판매하는 데 관한 권리와 의무를 정함을 목적으로 한다."

  - type: article
    heading: 제2조 (대리점 지정과 판매지역)
    lines:
      - "공급자는 대리점을 아래 판매지역 내 독점 대리점으로 지정한다: 판매지역 — 부산광역시 및 경상남도."
      - "대리점은 지정된 지역 외에서는 적극적인 판매 활동을 하지 않는다."

  - type: article
    heading: 제3조 (공급가격과 결제)
    lines:
      - "공급가격은 공급자가 정한 공급가표에 따르며, 대리점은 매월 마감 후 익월 10일까지 현금으로 결제한다."
      - "공급가격 변경 시 공급자는 적용 30일 전에 대리점에게 서면으로 통지한다."

  - type: article
    heading: 제4조 (최소 판매수량)
    lines:
      - "대리점은 매 반기 최소 1,000개 이상을 판매하여야 하며, 2회 연속 미달 시 공급자는 제10조에 따라 계약을 해지할 수 있다."

  - type: article
    heading: 제5조 (판매촉진과 광고)
    lines:
      - "대리점은 공급자가 승인한 범위에서 판매촉진 활동을 할 수 있으며, 비용은 대리점이 부담한다."
      - "공급자는 판매 실적에 따라 광고비를 일부 지원할 수 있다."

  - type: article
    heading: 제6조 (상표 사용)
    lines:
      - "대리점은 계약기간 중 공급자의 상표를 판매 목적에 한해 사용할 수 있으며, 계약 종료 시 즉시 사용을 중단한다."

  - type: article
    heading: 제7조 (재고와 반품)
    lines:
      - "대리점은 적정 재고를 유지하며, 공급자의 귀책사유로 인한 불량품은 전액 반품·교환한다."
      - "단순 재고 과다로 인한 반품은 공급자와 사전 협의한 경우에만 가능하다."

  - type: article
    heading: 제8조 (비밀유지)
    lines:
      - "당사자는 계약 이행 과정에서 알게 된 상대방의 영업비밀을 제3자에게 누설하지 않으며, 이 의무는 계약 종료 후에도 2년간 유지된다."

  - type: page_break

  - type: article
    heading: 제9조 (계약기간과 갱신)
    lines:
      - "본 계약의 기간은 체결일로부터 1년으로 하며, 만료 30일 전까지 별도의 서면 통지가 없으면 동일한 조건으로 1년씩 자동 갱신된다."

  - type: article
    heading: 제10조 (해지)
    lines:
      - "당사자 일방이 본 계약을 위반하고 상대방의 시정 요구를 받은 날부터 14일 내에 이를 시정하지 않으면 상대방은 계약을 해지할 수 있다."
      - "최소 판매수량 미달, 결제 지연이 2회 이상 발생한 경우 공급자는 즉시 해지할 수 있다."

  - type: article
    heading: 제11조 (손해배상)
    lines:
      - "당사자가 본 계약을 위반하여 상대방에게 손해를 끼친 경우 그 손해를 배상한다."

  - type: article
    heading: 제12조 (관할법원)
    lines:
      - "본 계약에 관한 분쟁은 공급자의 주소지 관할법원을 제1심 관할법원으로 한다."

  - type: subtitle
    text: 특약사항

  - type: textbox
    hint: "독점 공급 여부, 재고 인수 조건 등 추가로 합의한 사항을 기재하십시오."
    height_mm: 20
    sample_text: 계약 종료 시 대리점 보유 재고는 공급자가 출고가의 80%로 재매입한다.

  - type: para
    text: 본 계약을 증명하기 위하여 계약서 2부를 작성하여 당사자가 서명·날인 후 각 1부씩 보관한다.
    align: center
    size: 10
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    labels: ["공급자", "대리점"]
    sample_names: [홍길동, 박민준]

  - type: notice
    text: 본 서식은 참고용이며 개별 사안에 대한 법적 효력과 적합성은 이용자가 확인해야 합니다. 중요한 거래는 전문가의 검토를 받으십시오.
