id: used-car-sale-contract
title: 중고차 매매계약서
category: legal
subcategory: contract
tags: [중고차매매계약서, 중고자동차매매, 자동차매매계약, 차량매매계약서, 성능점검]
summary: 차량 표시·매매대금 지급일정과 소유권 이전·하자담보책임을 정하는 중고차 매매계약서입니다.
usage: >
  개인 간 또는 개인과 매매상사 간에 중고차를 사고팔 때 사용하는 계약서입니다. 차량번호와
  차대번호로 대상 차량을 정확히 특정하고, 계약금·잔금의 지급일정과 인도일을 명확히 정해야
  합니다. 성능점검기록부로 사고·침수 여부를 확인하고 압류·저당 등 권리관계가 없는지
  자동차등록사업소나 카히스토리 등에서 확인한 후 계약하는 것이 안전합니다. 명의이전은
  법령이 정한 기한 내에 처리하고 미납 과태료·자동차세도 인도 전에 정산해야 합니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

howto:
  - 차량번호와 차대번호로 차량을 특정해 적습니다.
  - 매매대금과 계약금·잔금 지급일정을 적습니다.
  - 성능점검기록부로 사고·침수 여부를 확인합니다.
  - 압류·저당 등 권리관계 여부를 확인합니다.
  - 인도일과 명의이전 기한을 정합니다.

faq:
  - q: 성능점검기록부는 꼭 확인해야 하나요?
    a: 네, 사고나 침수 여부를 확인할 수 있는 자료이므로 계약 전 반드시 확인하는 것이 안전합니다.
  - q: 미납 과태료는 누가 부담하나요?
    a: 통상 인도 전에 정산하는 것으로 정하며, 계약서에 부담 주체를 명확히 적어 두어야 합니다.

blocks:
  - type: doc_title
    text: 중고차 매매계약서
    spaced: false
  - type: para
    text: 매도인과 매수인은 아래 차량에 관하여 다음과 같이 매매계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 차량의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["차명(모델)", "", "연식", ""]
      - ["차량번호", "", "색상", ""]
      - ["차대번호", "", "배기량", ""]
      - ["주행거리", "", "", ""]
    sample_rows:
      - ["", "현대 소나타 (DN8)", "", "2021년식"]
      - ["", "12가 3456", "", "흰색"]
      - ["", "KMH************", "", "1,999cc"]
      - ["", "68,500km", "", ""]
  - type: subtitle
    text: 매매대금 및 지급일정
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["매매대금", "", "", ""]
      - ["계약금", "", "지급일", ""]
      - ["잔금", "", "지급일", ""]
      - ["입금계좌", "", "인도예정일", ""]
    sample_rows:
      - ["", "금 12,000,000원 (금 일천이백만원)", "", ""]
      - ["", "1,200,000원", "", "2026-10-01"]
      - ["", "10,800,000원", "", "2026-10-08"]
      - ["", "한빛은행 000-000000-00-000", "", "2026-10-08"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "매도인은 위 차량을 매수인에게 매도하고, 매수인은 이를 매수하며 매매대금을 지급한다."
  - type: article
    heading: 제2조 (소유권 이전 등록)
    lines:
      - "매수인은 잔금 지급 및 차량 인도 후 지체 없이 관할 자동차등록사업소에서 소유권 이전 등록을 한다."
      - "이전등록에 필요한 서류는 매도인이 인도일에 매수인에게 교부한다."
  - type: article
    heading: 제3조 (차량의 인도)
    lines:
      - "매도인은 위 인도예정일에 차량과 관련 서류, 부속품(키, 매뉴얼 등)을 매수인에게 인도한다."
  - type: page_break
  - type: article
    heading: 제4조 (하자담보책임과 성능점검)
    lines:
      - "매도인은 성능점검기록부에 기재된 내용과 실제 차량 상태가 다르지 않음을 보증한다."
      - "인도 후 성능점검기록부와 다른 중대한 하자가 발견된 경우 매도인은 관련 법령이 정하는 범위에서 책임을 진다."
  - type: article
    heading: 제5조 (압류·저당 등 권리관계)
    lines:
      - "매도인은 인도일까지 차량에 설정된 압류·저당·리스 등 권리제한을 모두 해소하여 인도한다."
      - "다만 매수인이 권리제한을 승계하기로 합의한 경우 그 내용을 특약사항에 기재한다."
  - type: article
    heading: 제6조 (미납 과태료·세금의 정산)
    lines:
      - "인도일 전에 부과된 자동차세, 과태료, 범칙금 등은 매도인이 부담하고, 인도일 이후의 것은 매수인이 부담한다."
  - type: article
    heading: 제7조 (계약의 해제)
    lines:
      - "매수인이 계약금 지급 후 잔금 지급을 지체한 경우 매도인은 상당한 기간을 정하여 이행을 최고하고 계약을 해제할 수 있다."
      - "계약이 해제된 경우 원상회복 의무를 부담하며, 손해배상에 관하여는 별도로 정한다."
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["매도인", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["매수인", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "김서연", "", "1982-05-09"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "홍길동", "", "1992-11-20"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-9876-5432"]
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["매도인", "매수인"]
    sample_names: ["김서연", "홍길동"]
  - type: notice
    text: 계약 전 성능점검기록부와 자동차등록원부로 사고·침수 여부와 압류·저당 등 권리관계를 확인하고, 명의이전은 관련 법령이 정한 기한 내에 처리하십시오.
