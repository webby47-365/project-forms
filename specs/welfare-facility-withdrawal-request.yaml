id: welfare-facility-withdrawal-request
title: 복지시설 퇴소 신청서
category: welfare
subcategory: consent
tags: [복지시설퇴소신청서, 시설퇴소, 요양시설퇴소, 이용종료신청, 퇴소요청서]
summary: 복지시설 이용자나 보호자가 이용을 마치고 퇴소하겠다는 뜻을 시설에 알리는 신청서입니다.
usage: >
  복지시설이나 요양시설을 이용하던 분이 이용을 끝내고 나가려 할 때, 이용자 본인 또는 보호자가 시설에
  제출하는 서식입니다. 이용자와 신청인의 관계, 퇴소 희망일과 사유, 정산·짐 정리 방법을 적고 서명합니다.
  퇴소 예고 기간, 비용 정산 방식, 필요 서류는 시설 운영 규정마다 다르므로 제출 전에 시설 안내를 확인하십시오.
  건강 상태나 병명은 적지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 시설 이름과 이용자 성명, 입소일을 적습니다.
  - 신청인이 보호자라면 이용자와의 관계를 적습니다.
  - 퇴소 희망일과 사유, 퇴소 후 거주 예정지를 적습니다.
  - 신청일을 적고 서명하여 시설 담당자에게 제출합니다.
faq:
  - q: 퇴소 신청은 언제까지 해야 하나요?
    a: 시설 규정에 따라 예고 기간이 다를 수 있습니다. 시설에 먼저 확인하고 여유를 두고 내십시오.
  - q: 이용 비용 정산은 어떻게 되나요?
    a: 정산 기준과 환급 방법은 시설 이용계약과 운영 규정을 따릅니다. 계약서를 확인하십시오.
  - q: 보호자가 대신 신청해도 되나요?
    a: 보호자가 신청하는 경우 이용자와의 관계를 적고, 시설이 요구하는 확인 서류가 있는지 문의하십시오.
related: [welfare-facility-application, long-term-care-application, care-service-application, medical-expense-support]
blocks:
  - type: doc_title
    text: 복지시설 퇴소 신청서
    spaced: false
  - type: subtitle
    text: 1. 이용자 정보
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["시설명", "", "입소일", ""]
      - ["이용자 성명", "", "생년월일", ""]
    sample_rows:
      - ["", "행복마을 요양원", "", "2025-06-01"]
      - ["", "이수현", "", "1948-02-15"]
  - type: subtitle
    text: 2. 신청인 정보
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["신청인 성명", "", "이용자와의 관계", ""]
      - ["연락처", "", "퇴소 후 거주지", ""]
    sample_rows:
      - ["", "홍길동", "", "자녀"]
      - ["", "010-1234-5678", "", "서울특별시 마포구 000"]
  - type: subtitle
    text: 3. 퇴소 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["퇴소 희망일", "", "정산 방법", ""]
      - ["퇴소 사유", "", "", ""]
    sample_rows:
      - ["", "2026-11-30", "", "계좌 이체"]
      - ["", "가족 돌봄으로 전환", "", ""]
  - type: textbox
    hint: "개인 물품 정리, 인수 방법 등 시설에 전달할 사항을 적으십시오. 건강 상태는 적지 않습니다."
    height_mm: 22
    sample_text: "개인 물품은 퇴소일에 보호자가 직접 가져가겠습니다."
  - type: para
    text: 위와 같이 퇴소를 신청합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   20 일
  - type: sign_line
    labels: ["신청인", "시설 확인"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 퇴소 예고 기간과 정산 기준은 시설 운영 규정과 이용계약을 확인하십시오.
