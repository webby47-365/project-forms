id: service-contract
title: 용역계약서
category: legal
subcategory: contract
tags: [용역계약, 서비스계약, 용역대금, 계약서, 프리랜서]
summary: 용역의 범위·기간·대금·지급방법과 당사자의 권리의무를 정하는 용역계약서 양식입니다.
usage: >
  프리랜서·개인사업자가 용역비로 소정의 작업을 수행하기로 계약할 때 사용합니다. 용역의
  범위를 구체적으로 특정하고 계약기간, 용역대금, 지급 기한과 방법을 명확히 해야 나중의
  금전 분쟁을 방지할 수 있습니다. 지식재산권(저작권, 특허권 등) 귀속 여부도 반드시
  명시하여야 합니다. 큰 규모의 용역은 검수 기준과 기일, 부분 지급 일정을 미리 정하는
  것이 좋습니다. 본 서식은 참고용이며 법적 효력과 적합성은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 용역계약서
  - type: para
    text: 아래 당사자는 다음과 같이 용역계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["발주처", "성명/회사명", "", "생년월일/사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
      - ["용역인(수급인)", "성명/회사명", "", "생년월일/사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
  - type: subtitle
    text: 계약 내용
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["용역의 명칭", "", "계약기간", ""]
      - ["용역기간", "", "용역대금", ""]
      - ["지급방법", "", "검수기한", ""]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 발주처가 용역인에게 위 용역의 수행을 의뢰하고, 용역인이 이를 수행하기로 합의하는 것을 목적으로 한다."
  - type: article
    heading: 제2조 (용역의 범위)
    lines:
      - "용역인은 위 용역의 명칭과 범위에 따라 성실하게 용역을 수행한다."
      - "용역 범위를 초과하는 작업은 별도 합의에 따라 처리한다."
  - type: article
    heading: 제3조 (계약기간)
    lines:
      - "본 계약의 용역기간은 위 계약기간에 따른다."
      - "용역인이 정당한 사유 없이 기한까지 용역을 완료하지 못한 경우, 발주처는 계약을 해지할 수 있다."
  - type: article
    heading: 제4조 (용역대금 및 지급방법)
    lines:
      - "발주처는 용역인에게 위 용역대금을 지급한다."
      - "용역대금은 다음의 방법으로 지급한다: (예시) 계약체결 시 30%, 중간검수 시 40%, 최종검수·납품 시 30%"
      - "지급은 용역인이 지정한 계좌로 송금한다."
  - type: article
    heading: 제5조 (검수 및 인수)
    lines:
      - "발주처는 용역 완료 후 기한 내에 검수를 수행하고, 적합한 경우 인수한다."
      - "부적합한 경우 용역인에게 수정을 요구할 수 있으며, 용역인은 지정된 기한 내에 수정한다."
  - type: article
    heading: 제6조 (지식재산권 귀속)
    lines:
      - "본 용역으로 발생하는 지식재산권(저작권, 특허권, 상표권 등)은 발주처에 귀속한다."
      - "다만 용역인이 기존에 보유한 지식재산권은 용역인에게 귀속한다."
  - type: article
    heading: 제7조 (비밀유지)
    lines:
      - "당사자들은 본 계약 체결 과정에서 알게 된 상대방의 기술, 영업비밀 등을 제3자에게 공개하지 않는다."
      - "비밀유지 의무는 계약 종료 후에도 3년간 계속된다."
  - type: article
    heading: 제8조 (계약의 해제·해지)
    lines:
      - "발주처가 정당한 사유 없이 계약을 해제하는 경우 기납부 용역대금은 반환하지 아니한다."
      - "용역인이 정당한 사유 없이 계약을 해제하는 경우 이미 지급받은 용역대금을 반환한다."
  - type: article
    heading: 제9조 (손해배상)
    lines:
      - "당사자 일방이 본 계약을 위반하여 상대방에게 손해를 입힌 경우, 그 손해를 배상한다."
  - type: article
    heading: 제10조 (분쟁해결 및 관할)
    lines:
      - "본 계약에 관한 분쟁은 발주처의 주소지 관할법원을 제1심 관할법원으로 한다."
      - "분쟁 발생 시 당사자들은 먼저 상호 협의를 통해 해결하기로 한다."
  - type: spacer
    height_pt: 8
  - type: date_line
  - type: sign_line
    labels: ["발주처", "용역인(수급인)"]
  - type: notice
    text: 본 계약은 참고용이며 당사자의 특정 상황에 맞게 조정·수정하여야 합니다. 큰 규모의 용역은 변호사와 상담하여 계약서를 작성하는 것이 좋습니다.
