id: business-card-request
title: 명함신청서
category: corp
subcategory: admin
tags: [명함신청서, 명함 제작 신청, 사원 명함, 명함 발주, 총무 신청서]
summary: 명함에 인쇄할 표기 정보와 수량·납품 희망일을 기재해 제작을 신청하는 서식입니다.
usage: >
  입사·승진·부서 이동이나 연락처 변경으로 명함을 새로 제작할 때 총무부서에 제출하는 신청서입니다.
  국문과 영문 표기를 모두 적고, 직위 영문 표기와 이메일 주소는 오타가 잦으므로 신청자가 직접
  확인하십시오. 기존 명함과 달라지는 부분은 변경사항 칸에 표시하면 제작 오류를 줄일 수 있습니다.
  수량은 소진 속도를 고려해 정하고, 시안 확인이 필요한 경우 회신받을 연락처를 적으십시오.
  제작 단가와 납기는 총무부서의 계약 업체 기준을 따릅니다.
source: original
featured: false
target_pages: 1

howto:
  - 소속·직위·성명 등 기본 정보를 적습니다.
  - 국문과 영문 표기를 정확히 확인해 기재합니다.
  - 수량과 납품 희망일을 적습니다.
  - 변경사항이 있으면 별도 칸에 표시합니다.
  - 작성 후 총무부서에 제출합니다.

faq:
  - q: 영문 이름 표기는 어떻게 정하나요?
    a: 여권 표기법을 기준으로 하되 기존 명함과 다르면 변경사항 칸에 표시하십시오.
  - q: 수량은 얼마나 신청해야 하나요?
    a: 평소 소진 속도를 고려해 1~2년 사용분을 기준으로 정하는 경우가 많습니다.

blocks:
  - type: doc_title
    text: 명함신청서
  - type: grid
    widths: [16, 22, 14, 20, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 7
    rows:
      - ["소속(부서)", "", "직위", "", "성명", ""]
      - ["신청일자", "", "사번", "", "연락처", ""]
    sample_rows:
      - ["", "마케팅팀", "", "대리", "", "홍길동"]
      - ["", "2026-09-13", "", "A1234", "", "010-1234-5678"]
  - type: subtitle
    text: 1. 명함 표기 정보 (국문)
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 7
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["성명", "", "직위", ""]
      - ["부서(팀)", "", "회사명", ""]
      - ["주소", "", "", ""]
      - ["휴대전화", "", "사무실 전화", ""]
      - ["팩스", "", "이메일", ""]
    sample_rows:
      - ["", "홍길동", "", "대리"]
      - ["", "마케팅팀", "", "(주)한빛커머스"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", "02-1234-5678"]
      - ["", "02-1234-5679", "", "gildong.hong@example.com"]
  - type: subtitle
    text: 2. 명함 표기 정보 (영문)
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 7
    rows:
      - ["Name", "", "Title", ""]
      - ["Department", "", "Company", ""]
      - ["Mobile", "", "Office", ""]
    sample_rows:
      - ["", "Hong Gildong", "", "Assistant Manager"]
      - ["", "Marketing Team", "", "Hanbit Commerce Co., Ltd."]
      - ["", "010-1234-5678", "", "02-1234-5678"]
  - type: subtitle
    text: 3. 신청 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 7
    rows:
      - ["신청 구분", "신규 / 재제작 / 정보변경", "수량", "       매 (      통)"]
      - ["명함 종류", "단면 / 양면", "납품 희망일", ""]
      - ["시안 확인", "필요 / 불필요", "회신 연락처", ""]
    sample_rows:
      - ["", "", "", "100매 (2통)"]
      - ["", "", "", "2026-09-20"]
      - ["", "", "", "010-1234-5678"]
  - type: textbox
    hint: "변경사항 및 요청사항 — 기존 명함과 달라지는 항목을 기재하십시오."
    height_mm: 16
    sample_text: 직위가 사원에서 대리로 변경되어 새로 제작 요청합니다.
  - type: para
    text: 위와 같이 명함 제작을 신청합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    label: 신청인
    sample_names: [홍길동]
  - type: subtitle
    text: 결재
  - type: grid
    widths: [16, 21, 21, 21, 21]
    label_cols: [0]
    row_height_mm: 12
    rows:
      - ["결재", "담당", "팀장", "임원", "대표"]
      - ["", "", "", "", ""]
    sample_rows:
      - ["", "", "", "", ""]
      - ["", "박민준", "김서연", "이수현", "홍길동"]
  - type: notice
    text: 표기 정보의 오탈자는 신청인이 최종 확인해야 합니다.
