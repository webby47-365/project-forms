id: budget-execution
title: 예산 집행 내역서
category: corp
subcategory: finance
tags: [예산집행내역서, 예산집행현황, 예산대비실적, 집행률, budget-execution]
summary: 편성된 예산 대비 실제 집행액과 잔액·집행률을 계정과목별로 정리하는 내역서입니다.
usage: >
  편성된 예산이 계획대로 집행되고 있는지 정기적으로 점검할 때 작성하는 문서입니다.
  계정과목별로 예산액과 집행액을 적고 잔액을 계산해 집행률을 산출하며, 적요에는 구체적인
  지출 내용과 증빙 종류를 함께 기재합니다. 집행률이 지나치게 낮거나 높은 항목은 특이사항에
  사유를 적어 보고하고, 세부 세액 처리는 회계팀과 별도로 확인하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
blocks:
  - type: doc_title
    text: 예산 집행 내역서
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["부서", "", "회계연도", ""]
      - ["집행기간", "", "작성자", ""]
    sample_rows:
      - ["", "마케팅팀", "", "2026년"]
      - ["", "2026-01-01 ~ 2026-09-30", "", "박민준"]
  - type: subtitle
    text: 집행 내역
  - type: table
    widths: [12, 16, 24, 14, 14, 12, 8]
    header: [집행일, 계정과목, 적요, 예산액, 집행액, 잔액, 증빙]
    empty_rows: 8
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["2026-09-01", "광고비", "SNS 광고 집행비", "65,000,000", "20,000,000", "45,000,000", "세금계산서"]
      - ["2026-09-05", "인건비", "계약직 인건비", "160,000,000", "40,000,000", "120,000,000", "급여대장"]
      - ["2026-09-10", "행사비", "오프라인 행사비", "18,000,000", "8,000,000", "10,000,000", "지출결의서"]
  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["예산액 합계", "", "집행액 합계", ""]
      - ["잔액 합계", "", "집행률", ""]
    sample_rows:
      - ["", "243,000,000", "", "68,000,000"]
      - ["", "175,000,000", "", "28%"]
  - type: subtitle
    text: 특이사항
  - type: textbox
    hint: "특이사항 — 예산 초과, 집행 지연 사유 등을 기재하십시오."
    height_mm: 16
    sample_text: 광고비 집행은 계획대로 진행 중이며, 인건비는 신규 채용 지연으로 집행률이 낮습니다. 4분기 행사 일정에 따라 잔여 예산 집행이 집중될 예정입니다.
  - type: subtitle
    text: 결재
  - type: grid
    widths: [25, 25, 25, 25]
    row_height_mm: 18
    rows:
      - ["담당", "팀장", "본부장", "대표"]
      - ["", "", "", ""]
    sample_rows:
      - ["", "", "", ""]
      - ["박민준", "김서연", "이수현", "최지우"]
  - type: notice
    text: 집행률 계산이나 세액 처리에 의문이 있는 경우 회계팀 또는 세무대리인에게 확인하십시오.
