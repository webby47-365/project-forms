id: caregiver-contract
title: 간병인 계약서
category: welfare
subcategory: consent
tags: [간병인계약서, 간병계약서, 개인간병계약, 병원동행간병계약, 간병서비스계약]
summary: 환자 보호자와 간병인 사이의 간병 기간·업무 범위·간병비 지급 조건을 정하는 계약서입니다.
usage: >
  병원이나 가정에서 환자를 돌볼 간병인을 개인적으로 계약할 때 사용하는 서식입니다. 간병
  기간과 근무 형태, 1일 간병비와 지급일을 명확히 적어야 분쟁을 예방할 수 있습니다.
  간병인은 의료 행위를 할 수 없으므로 투약이나 처치가 필요한 경우 의료진에게 요청해야
  하며, 업무 범위와 사고 발생 시 조치를 계약서에 구체적으로 명시하는 것이 좋습니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

blocks:
  - type: doc_title
    text: 간병인 계약서
    spaced: false

  - type: subtitle
    text: 1. 위탁인(보호자) 정보

  - type: grid
    widths: [14, 20, 14, 20, 18, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "연락처", "", "환자와의 관계", ""]
    sample_rows:
      - ["", "김서연", "", "010-1234-5678", "", "자녀"]

  - type: subtitle
    text: 2. 간병인 정보

  - type: grid
    widths: [14, 20, 14, 20, 14, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "박민준", "", "1979-06-21", "", "010-9876-5432"]

  - type: subtitle
    text: 3. 환자 정보

  - type: grid
    widths: [14, 22, 14, 22, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", "", "입원 병원·병동", ""]
    sample_rows:
      - ["", "홍길동", "", "1958-03-02", "", "한빛병원 3병동"]

  - type: subtitle
    text: 4. 계약 조건

  - type: grid
    widths: [16, 18, 16, 18, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["간병 기간", "", "근무 형태", "", "1일 간병비", ""]
      - ["지급일", "", "지급방법", "", "", ""]
    sample_rows:
      - ["", "2026-09-20 ~ 2026-10-19", "", "24시간 상주", "", "130,000원"]
      - ["", "매월 5일, 20일", "", "계좌 입금", "", ""]

  - type: subtitle
    text: 5. 간병 업무 범위

  - type: table
    widths: [40, 20, 40]
    header: [업무 내용, 수행 여부, 비고]
    rows:
      - ["식사 보조", "", ""]
      - ["이동 보조", "", ""]
      - ["위생 관리", "", ""]
      - ["복약 확인", "", ""]
      - ["병원 동행", "", ""]
    empty_rows: 1
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["세탁 보조", "", "요청 시"]

  - type: article
    heading: 제1조 (업무 범위 준수)
    lines:
      - "간병인은 제5조에서 정한 업무 범위 내에서 간병 업무를 수행한다."
      - "업무 범위를 벗어난 사항은 위탁인과 사전에 협의한다."

  - type: article
    heading: 제2조 (의료 행위 금지)
    lines:
      - "간병인은 투약, 주사, 처치 등 의료 행위를 하지 않는다."
      - "의료 행위가 필요한 경우 간병인은 의료진에게 즉시 요청한다."

  - type: article
    heading: 제3조 (비밀유지)
    lines:
      - "간병인은 업무 중 알게 된 환자와 가족의 개인정보를 제3자에게 누설하지 않는다."

  - type: article
    heading: 제4조 (사고 시 조치와 책임)
    lines:
      - "간병 중 사고가 발생한 경우 간병인은 즉시 의료진과 위탁인에게 알린다."
      - "고의 또는 중대한 과실로 인한 사고의 책임은 해당 당사자가 부담한다."

  - type: article
    heading: 제5조 (계약 해지)
    lines:
      - "양 당사자는 7일 이상의 서면 통지로 계약을 해지할 수 있다."
      - "간병인의 업무 태만이나 계약 위반이 있는 경우 즉시 해지할 수 있다."

  - type: article
    heading: 제6조 (대체 간병인)
    lines:
      - "간병인이 개인 사정으로 근무할 수 없는 경우 위탁인과 협의하여 대체 간병인을 배치할 수 있다."

  - type: para
    text: 위 조건으로 간병 계약을 체결하며, 양 당사자는 이를 준수할 것을 확인합니다.
    align: center
    size: 10.5
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    20 일

  - type: sign_line
    labels: ["위탁인(보호자)", "간병인"]
    sample_names: [김서연, 박민준]

  - type: notice
    text: 간병인은 의료 행위를 할 수 없으며, 투약·처치는 의료진이 수행합니다.

  - type: notice
    text: 개인정보(건강정보 포함)의 수집 목적은 간병 계약 체결 및 업무 수행이며, 보유기간은 계약 종료 후 관계 법령에 따라 보관한 후 파기합니다.

  - type: notice
    text: 본 서식은 참고용이며, 의학적 설명과 판단은 담당 의료진이 수행합니다. 기관별 양식이 따로 있는 경우 해당 기관 양식을 사용하십시오.
