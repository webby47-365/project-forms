id: family-relationship-confirmation
title: 가족관계 사실 확인서
category: public
subcategory: family
tags: [가족관계확인서, 가족관계사실확인서, 가족사항확인서, 친족관계확인, 가족확인서]
summary: 확인인과 상대방의 가족관계를 사실대로 적어 제출처에 알리는 일반 용도의 가족관계 사실 확인서입니다.
usage: >
  학교·직장·기관 등에서 가족관계를 간단히 확인해 달라고 할 때, 확인인이 가족관계를 사실대로
  적어 내는 서식입니다. 관계를 확인하는 대상자의 이름·생년월일과 관계, 제출처와 용도를 적습니다.
  공적인 증명이 필요한 경우에는 증명서 발급이 따로 필요하므로 제출처 요구를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 확인인의 성명과 생년월일, 연락처를 적습니다.
  - 확인 대상자의 성명, 생년월일, 관계를 적습니다.
  - 제출처와 사용 용도를 적습니다.
  - 사실과 다름이 없음을 확인하고 서명합니다.
faq:
  - q: 가족관계증명서를 대신할 수 있나요?
    a: 제출처가 허용하는 경우에만 가능합니다. 공적 증명이 필요하면 증명서를 따로 발급받아야 합니다.
  - q: 주민등록번호를 적어야 하나요?
    a: 이 서식은 생년월일만 적습니다. 번호가 꼭 필요한 곳은 제출처 안내를 확인하십시오.
  - q: 대상자가 여러 명이면 어떻게 하나요?
    a: 확인 대상자 표에 한 줄씩 이어서 적습니다. 칸이 모자라면 서식을 한 장 더 쓰십시오.
related: [family-certificate-issuance-poa, residence-fact-confirmation, gov-resident-register-copy, resident-register-copy-poa]
blocks:
  - type: doc_title
    text: 가족관계 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 확인인
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "", ""]
      - ["주소", "", "", ""]
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    sample_rows:
      - ["", "홍길동", "", "1980-01-01"]
      - ["", "010-1234-5678", "", ""]
      - ["", "서울특별시 ○○구 ○○로 00", "", ""]
  - type: subtitle
    text: 2. 확인 대상자
  - type: table
    widths: [8, 28, 28, 18, 18]
    header: ["No", 성명, 생년월일, 관계, 비고]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "홍하나", "2010-05-05", "자녀", ""]
      - ["2", "김서연", "1982-03-03", "배우자", ""]
  - type: subtitle
    text: 3. 제출처와 용도
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["제출처", "", "용도", ""]
    sample_rows:
      - ["", "○○초등학교", "", "학교 제출용"]
  - type: para
    text: 위 내용이 사실과 다름이 없음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   19 일
  - type: sign_line
    label: 확인인
    sample_names: [홍길동]
  - type: notice
    text: 공적 증명이 필요한 경우 제출처 요구에 따라 증명서를 별도로 발급받으십시오.
