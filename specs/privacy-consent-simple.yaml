id: privacy-consent-simple
title: 개인정보 수집·이용 동의서 (간편형)
category: public
subcategory: consent
tags: [개인정보동의서, 간편동의서, 개인정보수집동의, 개인정보이용동의, privacy consent]
summary: 수집 항목과 목적, 보유기간을 한눈에 정리하고 동의 여부만 표시하면 되는 반 페이지 간편 동의서입니다.
usage: >
  설문, 상담 신청, 이벤트 접수처럼 간단한 접점에서 개인정보를 수집할 때 사용하는 짧은 동의서입니다.
  수집 항목·목적·보유기간을 표에 정리해두면 상담원이나 담당자가 항목만 채워 바로 사용할 수 있습니다.
  동의를 거부할 권리와 거부 시 불이익을 반드시 안내하고, 동의함·동의하지 않음 중 하나를 표시받으십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

howto:
  - 성명과 연락처를 적습니다.
  - 수집 항목과 목적, 보유기간을 확인합니다.
  - 동의 거부 권리와 불이익 안내를 확인합니다.
  - 동의함 또는 동의하지 않음 중 하나를 표시합니다.
  - 서명 후 담당자에게 제출합니다.

faq:
  - q: 상세형과 어떻게 다른가요?
    a: 간편형은 표 하나로 수집 항목과 목적을 정리한 반 페이지 축약 양식입니다.
  - q: 동의를 거부하면 불이익이 있나요?
    a: 불이익 여부는 서비스마다 다르므로 안내 문구를 반드시 확인하십시오.

blocks:
  - type: doc_title
    text: 개인정보 수집·이용 동의서 (간편형)
    spaced: false
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
  - type: subtitle
    text: 수집·이용 내역
  - type: table
    widths: [20, 45, 35]
    header: ["수집 항목", "수집·이용 목적", "보유 및 이용기간"]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["성명, 연락처", "상담 신청 접수 및 답변", "목적 달성 후 6개월"]
      - ["이메일", "접수 결과 통보", "목적 달성 후 6개월"]
  - type: para
    text: 귀하는 위 개인정보 수집·이용에 동의하지 않을 권리가 있습니다. 다만 동의하지 않을 경우 상담·신청 접수가 제한될 수 있습니다.
    align: left
    size: 10.5
  - type: table
    widths: [60, 20, 20]
    header: ["동의 항목", "동의함", "동의하지 않음"]
