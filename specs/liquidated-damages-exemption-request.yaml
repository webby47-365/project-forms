id: liquidated-damages-exemption-request
title: 지체상금 면제 신청서
category: public
subcategory: procure
tags: [지체상금면제, 지체상금감면, 납기지연사유서, 계약이행지연, 지체일수제외]
summary: 계약 납기나 준공이 늦어진 사유가 계약상대자 책임이 아님을 밝혀 지체상금 면제 또는 지체일수 제외를 신청하는 신청서 양식입니다.
usage: >
  공사·물품·용역 계약에서 납기나 준공이 늦어졌을 때, 지연 사유가 천재지변이나 발주처 사정 등 계약상대자 책임이 아니라고
  판단되면 발주처에 지체일수 제외나 지체상금 면제를 신청하는 서류입니다. 계약 정보와 지연 기간, 지연 사유를 적고
  증빙을 붙입니다. 인정 여부와 범위는 계약서와 발주처 판단에 따르므로 지연 사유가 생긴 즉시 관련 자료를 모아 두십시오.
source: original
featured: false
target_pages: 1
howto:
  - 계약명과 계약번호, 발주처를 계약서대로 적습니다.
  - 약정한 납기와 실제 이행일, 지연 일수를 적습니다.
  - 지연 사유가 생긴 기간과 사유를 구체적으로 적습니다.
  - 붙임 증빙 목록을 적고 대표자가 서명 또는 날인합니다.
faq:
  - q: 지연 사유가 인정되면 지체상금이 없어지나요?
    a: 인정된 기간은 지체일수에서 빠질 수 있습니다. 인정 범위는 발주처 판단과 계약서를 확인하십시오.
  - q: 언제까지 내야 하나요?
    a: 제출 시한은 계약서와 발주처 안내에 따릅니다. 사유가 생기면 가능한 한 빨리 냅니다.
  - q: 어떤 증빙을 붙이나요?
    a: 공문, 날씨 기록, 자재 수급 확인서처럼 지연 사유를 보여 주는 자료를 붙입니다.
related: [defect-warranty-deposit-refund-request, contract-performance-deposit-refund-request, goods-inspection-report, delivery-confirmation]
blocks:
  - type: doc_title
    text: 지체상금 면제 신청서
    spaced: false
  - type: subtitle
    text: 1. 계약 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["계약명", "", "", ""]
      - ["계약번호", "", "발주처", ""]
      - ["계약상대자", "", "대표자", ""]
    sample_rows:
      - ["", "청사 사무용 가구 납품", "", ""]
      - ["", "2026-물품-0123", "", "한빛시청"]
      - ["", "(주)새길데이터", "", "김서연"]
  - type: subtitle
    text: 2. 지연 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["약정 납기", "", "실제 이행일", ""]
      - ["지연 일수", "", "제외 요청 일수", ""]
    sample_rows:
      - ["", "2026-09-30", "", "2026-10-12"]
      - ["", "12일", "", "9일"]
  - type: subtitle
    text: 3. 지연 사유와 증빙
  - type: textbox
    hint: "지연이 생긴 기간과 사유, 계약상대자 책임이 아니라고 보는 이유를 적으십시오."
    height_mm: 34
    sample_text: 9월 말 태풍으로 운송이 중단되어 자재 입고가 9일 늦어졌습니다. 해당 기간을 지체일수에서 제외해 주시기 바랍니다.
  - type: table
    widths: [10, 60, 30]
    header: ["No", 붙임 증빙, 쪽수]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["1", "운송사 운행 중단 확인서", "1"]
      - ["2", "기상청 특보 기록", "2"]
  - type: date_line
    sample_text: 2026 년   10 월   14 일
  - type: sign_line
    label: 계약상대자
    sample_names: [김서연]
  - type: notice
    text: 인정 여부와 범위는 계약서와 발주처 규정을 확인하십시오.
