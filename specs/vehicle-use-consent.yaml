id: vehicle-use-consent
title: 자동차 사용 승낙서
category: public
subcategory: vehicle
tags: [자동차사용승낙서, 차량사용승낙서, 차량운행동의서, 차량빌려쓰기, 자동차대여동의]
summary: 차량 소유자가 다른 사람에게 일정 기간 차량 사용을 허락할 때 기간·범위·책임 사항을 적는 승낙서입니다.
usage: >
  가족이나 지인, 직원에게 차량을 빌려주거나 업무용으로 쓰게 할 때 사용 허락의 범위를 남기는
  서식입니다. 소유자와 사용자 정보, 차량번호와 차종, 사용 기간과 목적을 적고 사고·과태료 처리
  기준을 미리 정해 적어 둡니다. 보험 적용 범위(운전자 한정 등)는 보험사 약관에 따라 달라지므로
  사용 전에 보험사에 확인하십시오. 본 서식은 합의 내용을 기록하는 틀이며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 차량 소유자와 사용자의 성명과 연락처를 적습니다.
  - 차량번호와 차종, 사용 목적을 적습니다.
  - 사용 기간과 반납 시기를 적습니다.
  - 사고·과태료 처리 방법을 정해 적고 두 사람이 서명합니다.
faq:
  - q: 보험이 알아서 적용되나요?
    a: 운전자 연령·범위 한정 여부에 따라 다릅니다. 사용 전에 보험사에 확인하십시오.
  - q: 과태료는 누가 내나요?
    a: 서로 합의한 내용을 특약란에 적어 두면 분쟁을 줄일 수 있습니다. 기준은 당사자가 정합니다.
  - q: 사용 기간이 끝나기 전에 돌려받을 수 있나요?
    a: 반환 조건을 특약란에 적어 두면 좋습니다. 조건이 없으면 사용자와 먼저 협의하십시오.
related: [vehicle-delivery-confirmation, rental-car-return-confirmation, traffic-violation-driver-confirmation, vehicle-lease-contract]
blocks:
  - type: doc_title
    text: 자동차 사용 승낙서
    spaced: false
  - type: para
    text: 소유자는 아래 사용자에게 아래 차량의 사용을 승낙합니다.
    align: center
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["소유자", "", "연락처", ""]
      - ["사용자", "", "연락처", ""]
      - ["관계", "", "운전면허 종류", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "김서연", "", "010-3456-7890"]
      - ["", "배우자", "", "1종 보통"]
  - type: subtitle
    text: 2. 차량 및 사용 내용
  - type: grid
    widths: [16, 36, 16, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
      - [3, 1, 3, 3]
    rows:
      - ["차량번호", "", "차종", ""]
      - ["사용 기간", "", "반납 시기", ""]
      - ["사용 목적", "", "", ""]
      - ["사고·과태료", "", "", ""]
    sample_rows:
      - ["", "12가 3456", "", "소형 승용차"]
      - ["", "10-06 ~ 10-12", "", "2026-10-12"]
      - ["", "출장 이동", "", ""]
      - ["", "사용 기간 중 위반 과태료는 사용자가 부담", "", ""]
  - type: subtitle
    text: 3. 특약
  - type: textbox
    hint: "보험 적용 범위, 주행 한도, 금지 사항 등 합의한 내용을 적으십시오."
    height_mm: 24
    sample_text: "보험은 가입된 범위 안에서만 적용되며, 타인에게 재대여하지 않습니다. 차량은 사용 종료일에 소유자에게 반납합니다."
  - type: date_line
    sample_text: 2026 년   10 월    5 일
  - type: sign_line
    labels: ["소유자", "사용자"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 보험 적용 범위와 사고 처리는 가입한 보험사 약관을 확인하십시오.
