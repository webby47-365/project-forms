id: equipment-loan-request
title: 비품 대여신청서
category: corp
subcategory: admin
tags: [비품대여신청서, 물품대여신청서, 사무용품대여, 회사비품대여, 대여물품신청서]
summary: 직원이 사내 공용 비품을 빌릴 때 대여 품목과 기간, 반납 조건을 적어 총무 담당자의 승인을 받는 비품 대여신청서입니다.
usage: >
  노트북·빔프로젝터·카메라 등 회사 공용 비품을 일정 기간 빌려 쓸 때 신청하는 서식입니다.
  대여 품목과 용도, 대여 시작일과 반납 예정일을 적어 총무 담당자의 승인을 받습니다.
  파손이나 분실 시 변상 책임과 반납 기한을 미리 확인해 두면 분쟁을 줄일 수 있고, 반납할
  때는 상태를 확인받아 대여 기록을 마무리합니다.
source: original
featured: false
target_pages: 1

howto:
  - 신청자의 부서·성명·연락처와 신청일자를 적습니다.
  - 대여할 품목과 수량, 용도를 적습니다.
  - 대여 시작일과 반납 예정일을 적습니다.
  - 대여 조건을 확인하고 총무 담당자·부서장의 승인을 받습니다.
  - 반납할 때 상태를 확인받고 반납일을 기재합니다.

faq:
  - q: 여러 품목을 한 번에 신청할 수 있나요?
    a: 네, 대여 내역 표에 품목을 나누어 적으면 됩니다.
  - q: 반납이 늦어지면 어떻게 하나요?
    a: 반납 예정일 전에 담당자에게 미리 알려 기간 연장 여부를 협의하는 것이 좋습니다.
  - q: 파손되면 어떻게 되나요?
    a: 사내 규정에 따라 변상 책임이 있을 수 있으므로 사용 전 상태를 함께 확인해 두십시오.

related: [asset-ledger, facility-repair-request]

blocks:
  - type: doc_title
    text: 비품 대여신청서
    spaced: true

  - type: subtitle
    text: 1. 신청자 정보

  - type: grid
    widths: [16, 28, 16, 20, 20]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["부서", "", "성명", "", "연락처"]
      - ["신청일자", "", "", "", ""]
    sample_rows:
      - ["", "마케팅팀", "", "박민준", "010-1234-5678"]
      - ["", "2026-09-22", "", "", ""]

  - type: subtitle
    text: 2. 대여 내역

  - type: table
    widths: [24, 18, 10, 24, 12, 12]
    header: [품목명, 규격/모델, 수량, 용도, 대여시작일, 반납예정일]
    empty_rows: 4
    row_height_mm: 8
    sample_rows:
      - ["빔프로젝터", "LX-300", "1", "외부 발표용", "2026-09-23", "2026-09-25"]

  - type: subtitle
    text: 3. 대여 조건 확인

  - type: kv_list
    items:
      - "대여 전 품목의 상태를 확인하고 이상이 있으면 담당자에게 알립니다."
      - "반납 예정일을 지키며, 연장이 필요하면 미리 담당자와 협의합니다."
      - "파손·분실 시 사내 규정에 따라 변상 책임이 있을 수 있습니다."

  - type: grid
    widths: [22, 26, 26, 26]
    label_cols: [0]
    row_height_mm: 13
    rows:
      - ["신청자", "총무 담당", "부서장", "반납 확인일"]
      - ["", "", "", ""]
    sample_rows:
      - ["", "", "", ""]
      - ["박민준", "이수현", "김서연", "2026-09-25"]

  - type: date_line
    sample_text: 2026 년    9 월   22 일

  - type: notice
    text: 반납할 때는 품목 상태를 담당자와 함께 확인한 뒤 반납 확인일을 기재하십시오.
