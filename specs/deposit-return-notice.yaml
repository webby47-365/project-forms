id: deposit-return-notice
title: 전세보증금 반환 내용증명
category: estate
subcategory: lease
tags: [전세보증금반환내용증명, 보증금반환청구, 임대차내용증명, 전세금반환통지, 명도통지]
summary: 임대차 종료에 따라 전세보증금 반환을 요구하며 계좌와 기한을 명시해 발송하는 내용증명입니다.
usage: >
  임대차기간이 끝나가거나 이미 끝났는데 임대인이 보증금을 돌려주지 않을 때, 반환을 공식적으로
  요구하며 기록을 남기기 위해 보내는 문서입니다. 임대차 목적물과 계약일·보증금·계약
  종료일·명도 예정일을 정확히 적어 어떤 계약에 대한 통지인지 특정하십시오. 반환 계좌와
  구체적인 기한을 명시하고, 기한까지 반환되지 않을 경우 밟을 수 있는 절차가 있다는 점만
  일반적으로 안내합니다. 발송 전 사본을 보관하고 우체국에서 내용증명으로 접수하십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1
howto:
  - 발신인과 수신인, 임대차 목적물을 적습니다.
  - 계약일과 보증금, 계약 종료일을 적습니다.
  - 반환받을 계좌와 반환 기한을 적습니다.
  - 사본을 보관하고 우체국에서 내용증명으로 발송합니다.

faq:
  - q: 계약이 끝나기 전에 보내도 되나요?
    a: 계약 종료가 임박했다면 미리 보내 반환 일정을 확인받는 것이 좋습니다.
  - q: 기한까지 반환되지 않으면 어떻게 하나요?
    a: 이 문서는 통지용이며 이후 절차는 관련 기관이나 전문가와 상담해 진행하십시오.

blocks:
  - type: doc_title
    text: 전세보증금 반환 내용증명
    spaced: false
  - type: subtitle
    text: 1. 발신인·수신인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["발신인(임차인)", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["수신인(임대인)", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-9876-5432"]
      - ["", "서울특별시 마포구 월드컵북로 100, 202동 1503호", "", ""]
      - ["", "김서연", "", "010-1234-5678"]
      - ["", "서울특별시 서초구 강남대로 200, 101동 801호", "", ""]
  - type: subtitle
    text: 2. 임대차 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["목적물 주소", "", "", ""]
      - ["계약일", "", "계약 종료일", ""]
      - ["보증금", "", "명도 예정일", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100, 202동 1503호", "", ""]
      - ["", "2024-10-15", "", "2026-10-14"]
      - ["", "금 50,000,000원 (금 오천만원)", "", "2026-10-14"]
  - type: subtitle
    text: 3. 통지 내용
  - type: textbox
    hint: "임대차 종료 사실과 보증금 반환을 요청하는 취지를 구체적으로 기재하십시오."
    height_mm: 32
    sample_text: "본인은 귀하와 2024년 10월 15일 체결한 위 임대차계약에 따라 2026년 10월 14일 임대차기간이 만료됨을 통지합니다. 본인은 계약 갱신을 원하지 않으며, 위 기일까지 목적물을 명도할 예정이니 확인하여 주시기 바랍니다."
  - type: subtitle
    text: 4. 반환 요구 및 기한
  - type: textbox
    hint: "보증금 반환 계좌와 반환 기한을 명시하십시오."
    height_mm: 18
    sample_text: "보증금 50,000,000원을 명도일인 2026년 10월 14일까지 아래 계좌로 반환하여 주시기 바랍니다. 입금계좌: 한빛은행 123-456-789012 (예금주 홍길동)"
  - type: subtitle
    text: 5. 불이행 시 조치
  - type: para
    text: 위 기한까지 반환이 이루어지지 않을 경우, 임차권등기명령 신청, 지급명령 신청 등 관련 법적 절차를 진행할 수 있음을 알려드립니다.
    align: left
    size: 10.5
  - type: para
    text: 위와 같이 통지합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월   20 일
  - type: sign_line
    label: 발신인
    sample_names: [홍길동]
  - type: notice
    text: 본 내용증명은 발신인 보관용·수신인 수령용·우체국 보관용 3부를 작성하여 제출하십시오.
