id: illegal-parking-report
title: 불법 주정차 신고서
category: public
subcategory: civil
tags: [불법주정차, 주정차신고, 민원신고, 불법주차, 교통민원]
summary: 소화전·횡단보도·인도 등에 불법으로 세워 둔 차량의 위치와 시간, 차량 정보를 정리해 관할 기관에 신고할 때 쓰는 불법 주정차 신고서 양식입니다.
usage: >
  주차 금지 구역의 불법 주정차 차량을 구청이나 지자체 민원 창구에 신고할 때 쓰는 서식입니다.
  발견 일시와 장소, 차량번호와 차종, 위반 유형을 적고 현장 사진 촬영 시각과 장수를 함께 적습니다.
  신고 방법과 증빙 요건은 지자체마다 다를 수 있으므로 관할 기관 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신고자 이름과 연락처를 적습니다.
  - 발견한 일시와 정확한 장소를 적습니다.
  - 차량번호와 차종, 위반 유형을 적습니다.
  - 사진 촬영 내역을 적고 날짜와 서명을 합니다.
faq:
  - q: 사진은 몇 장 필요한가요?
    a: 지자체마다 다를 수 있습니다. 차량번호와 위치가 함께 보이는 사진을 여러 장 준비하면 도움이 됩니다.
  - q: 신고자 정보는 상대방에게 알려지나요?
    a: 처리 방식은 기관마다 다릅니다. 비공개 요청 가능 여부를 접수 기관에 문의하십시오.
related: [illegal-advertisement-report, illegal-dumping-report, noise-complaint, road-repair-request]
blocks:
  - type: doc_title
    text: 불법 주정차 신고서
    spaced: false
  - type: subtitle
    text: 1. 신고자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["신고일", "", "회신 방법", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "2026-11-10", "", "문자"]
  - type: subtitle
    text: 2. 위반 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["발견 일시", "", "위반 유형", ""]
      - ["발견 장소", "", "", ""]
      - ["차량번호", "", "차종·색상", ""]
    sample_rows:
      - ["", "2026-11-09 18:20", "", "소화전 앞"]
      - ["", "서울시 ○○구 ○○로 00 앞 도로", "", ""]
      - ["", "00가 0000", "", "승용차·흰색"]
  - type: table
    widths: [10, 30, 30, 30]
    header: ["No", 촬영 시각, 촬영 대상, 비고]
