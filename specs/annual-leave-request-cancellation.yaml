id: annual-leave-request-cancellation
title: 연차 휴가 신청 취소서
category: corp
subcategory: hr
tags: [연차취소, 연차신청취소, 휴가취소서, 연차철회, 휴가신청철회]
summary: 이미 신청하거나 승인받은 연차 휴가를 쓰지 않기로 했을 때 취소 사유와 잔여 연차 복원을 요청하는 연차 휴가 신청 취소서 양식입니다.
usage: >
  연차 휴가를 신청하거나 승인받은 뒤 업무 사정이나 개인 사정으로 쓰지 않게 되었을 때 취소를 요청하는 문서입니다.
  원래 신청한 휴가 기간과 일수, 취소 사유를 적고 부서장 확인을 받습니다. 취소한 일수는 담당 부서가 잔여 연차에 반영하며,
  이미 시작된 휴가나 결재 후 취소 가능 시한은 회사 취업규칙에 따르므로 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신청자 정보와 원래 신청한 휴가 기간을 적습니다.
  - 취소할 일수를 전부인지 일부인지 표시합니다.
  - 취소 사유를 한두 줄로 적습니다.
  - 서명한 뒤 부서장 확인을 받아 인사 담당에게 냅니다.
faq:
  - q: 취소하면 연차 일수가 바로 돌아오나요?
    a: 인사 담당이 확인해 잔여 연차에 반영합니다. 반영 시점은 회사 기준을 확인하십시오.
  - q: 휴가가 이미 시작됐는데 취소할 수 있나요?
    a: 시작된 휴가는 남은 날만 취소할 수 있는지 회사 규정에 따릅니다. 담당 부서에 먼저 문의하십시오.
  - q: 일부 날짜만 취소해도 되나요?
    a: 됩니다. 취소 구분란에 일부 취소를 표시하고 취소할 날짜를 적습니다.
related: [annual-leave-schedule-change-request, annual-leave-plan, annual-leave-balance-inquiry, leave-request]
blocks:
  - type: doc_title
    text: 연차 휴가 신청 취소서
    spaced: false
  - type: subtitle
    text: 1. 신청자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
