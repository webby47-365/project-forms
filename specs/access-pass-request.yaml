id: access-pass-request
title: 출입증 신청서
category: corp
subcategory: admin
tags: [출입증 신청서, 사원증 발급, 방문증, 출입카드 신청, 보안 출입]
summary: 출입증 발급 구분과 출입 구역·사용기간을 기재해 승인을 받는 출입증 신청서입니다.
usage: >
  신규 발급·재발급이나 협력업체·방문자의 임시 출입증이 필요할 때 제출하는 신청서입니다.
  출입이 필요한 구역과 사용기간을 최소 범위로 적어야 승인이 빠르며, 재발급 신청은 분실 경위를
  함께 기재하십시오. 협력업체 인원은 소속 업체명과 계약기간을 적고, 상주 여부를 표시합니다.
  출입증은 타인에게 대여할 수 없고 퇴사·계약 종료 시 즉시 반납해야 하므로 반납 예정일을
  반드시 적으십시오. 보안구역 출입은 별도 승인 절차가 필요할 수 있습니다.
source: original
featured: false
target_pages: 1

howto:
  - 신청 구분에서 신규·재발급·임시·방문 중 하나를 고릅니다.
  - 출입이 필요한 구역과 사용기간을 적습니다.
  - 재발급이면 분실 경위를 함께 적습니다.
  - 반납 예정일을 적고 담당자 결재를 받습니다.

faq:
  - q: 출입증은 언제까지 쓸 수 있나요?
    a: 신청서에 적은 사용기간까지만 유효하며, 기간이 끝나면 반납해야 합니다.
  - q: 협력업체 직원도 신청할 수 있나요?
    a: 가능합니다. 소속 업체명과 계약기간을 함께 적고 상주 여부를 표시하십시오.
  - q: 출입증을 잃어버리면 어떻게 하나요?
    a: 재발급을 신청하면서 분실 경위를 신청서에 함께 적어야 합니다.

related: [visitor-log, business-card-request, personnel-order]

blocks:
  - type: doc_title
    text: 출입증 신청서
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["신청 구분", "신규 / 재발급 / 임시 / 방문", "신청일자", ""]
      - ["신청 부서", "", "신청 담당자", ""]
      - ["연락처", "", "이메일", ""]
    sample_rows:
      - ["", "", "", "2026-09-13"]
