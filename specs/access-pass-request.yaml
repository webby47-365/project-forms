id: access-pass-request
title: 출입증 신청서
category: corp
subcategory: admin
tags: [출입증 신청서, 사원증 발급, 방문증, 출입카드 신청, 보안 출입]
summary: 출입증 발급 구분과 출입 구역·사용기간을 기재해 승인을 받는 출입증 신청서입니다.
usage: >
  신규 발급·재발급이나 협력업체·방문자의 임시 출입증이 필요할 때 제출하는 신청서입니다.
  출입이 필요한 구역과 사용기간을 최소 범위로 적어야 승인이 빠르며, 재발급 신청은 분실 경위를
  함께 기재하십시오. 협력업체 인원은 소속 업체명과 계약기간을 적고, 상주 여부를 표시합니다.
  출입증은 타인에게 대여할 수 없고 퇴사·계약 종료 시 즉시 반납해야 하므로 반납 예정일을
  반드시 적으십시오. 보안구역 출입은 별도 승인 절차가 필요할 수 있습니다.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 출입증 신청서
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["신청 구분", "신규 / 재발급 / 임시 / 방문", "신청일자", ""]
      - ["신청 부서", "", "신청 담당자", ""]
      - ["연락처", "", "이메일", ""]
  - type: subtitle
    text: 1. 발급 대상자
  - type: table
    widths: [8, 18, 16, 18, 20, 20]
    header: ["No", 성명, 생년월일, 소속(업체명), 직위/역할, 연락처]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
  - type: subtitle
    text: 2. 출입 정보
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["사용기간", "20    년   월   일 ~ 20    년   월   일", "상주 여부", "상주 / 비상주"]
      - ["출입 구역", "", "", ""]
      - ["출입 시간대", "", "출입 목적", ""]
      - ["신청 사유 (재발급 시 분실 경위 포함)", "", "", ""]
  - type: kv_list
    items:
      - "출입증은 본인만 사용하며 타인에게 대여하거나 양도하지 않는다."
      - "출입 구역 외 무단 출입과 사내 자료의 무단 촬영·반출을 하지 않는다."
      - "퇴사·계약 종료·사용기간 만료 시 즉시 반납하며, 분실 시 지체 없이 신고한다."
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["반납 예정일", "", "반납 확인", ""]
  - type: para
    text: 위 사항을 준수할 것을 서약하며 출입증 발급을 신청합니다.
    align: center
    size: 11
  - type: date_line
  - type: sign_line
    label: 신청인
  - type: subtitle
    text: 결재
  - type: grid
    widths: [16, 21, 21, 21, 21]
    label_cols: [0]
    row_height_mm: 16
    rows:
      - ["결재", "담당", "팀장", "임원", "대표"]
      - ["", "", "", "", ""]
  - type: notice
    text: 보안구역 출입은 별도 승인 절차가 필요할 수 있으므로 사내 보안규정을 확인하십시오.
