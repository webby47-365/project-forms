id: volunteer-application
title: 자원봉사 신청서
category: public
subcategory: consent
tags: [자원봉사 신청서, 봉사활동 신청, 자원봉사자 등록, 봉사시간 인정, 봉사 지원서]
summary: 희망 활동 분야와 가능 요일·시간, 관련 경험을 기재해 자원봉사를 신청하는 서식입니다.
usage: >
  기관이나 단체의 자원봉사 활동에 참여하기 위해 제출하는 신청서입니다. 희망하는 활동 분야와
  가능한 요일·시간대를 구체적으로 적어야 배치가 원활합니다. 관련 경험이나 보유 기술이 있으면
  적어 두면 적합한 활동에 연결되기 쉽습니다. 봉사시간 인정이 필요한 경우 인정기관과 아이디를
  함께 기재하십시오. 미성년자는 보호자 동의란을 작성해야 하며, 활동 중 안전사고에 대비한 보험
  가입 여부도 확인합니다. 개인정보 수집·이용 동의는 목적과 보유기간을 확인한 뒤 표시하십시오.
source: original
featured: false
target_pages: 2
howto:
  - 신청인의 성명과 연락처, 주소를 적습니다.
  - 희망하는 활동 분야를 적습니다.
  - 가능한 요일과 시간대를 구체적으로 적습니다.
  - 관련 경험이나 보유 기술을 적습니다.
  - 미성년자는 보호자 동의란을 작성합니다.

faq:
  - q: 봉사시간 인정은 어떻게 받나요?
    a: 인정기관과 본인의 봉사 아이디를 함께 적어야 활동 시간이 정확히 인정됩니다.
  - q: 미성년자도 신청할 수 있나요?
    a: 신청할 수 있으며 보호자 동의란을 반드시 작성해야 합니다.

related: [privacy-consent, minor-activity-consent, event-photo-consent]

blocks:
  - type: doc_title
    text: 자원봉사 신청서
    spaced: false
  - type: subtitle
    text: 1. 신청인 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "이메일", ""]
      - ["소속(학교·직장)", "", "비상 연락처", ""]
    sample_rows:
      - ["", "이수현", "", "1999-05-21"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", "lee.sh@example.com"]
      - ["", "한빛대학교", "", "010-8765-4321"]
  - type: subtitle
    text: 2. 희망 활동
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["희망 활동 분야", "", "", ""]
      - ["활동 희망기간", "20   년  월  일 ~ 20   년  월  일", "희망 활동 장소", ""]
      - ["봉사시간 인정", "필요 / 불필요", "인정기관·아이디", ""]
    sample_rows:
      - ["", "지역아동센터 학습 지도", "", ""]
      - ["", "2026년 9월 14일 ~ 2026년 12월 20일", "", "한빛지역아동센터"]
      - ["", "", "", "VMS / 12345678"]
  - type: subtitle
    text: 3. 가능 요일 및 시간
  - type: table
    widths: [16, 12, 12, 12, 12, 12, 12, 12]
    header: [시간대, 월, 화, 수, 목, 금, 토, 일]
    empty_rows: 2
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["14:00~16:00", "", "○", "", "○", "", "", ""]
  - type: subtitle
    text: 4. 활동 경험 및 보유 기술
  - type: table
    widths: [8, 26, 20, 20, 26]
    header: ["No", 활동(교육)명, 기관, 기간, 역할·내용]
    empty_rows: 2
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "아동 학습멘토링", "한빛지역아동센터", "2025.03~2025.08", "초등부 수학 보조"]
  - type: textbox
    hint: "지원 동기와 전하고 싶은 말씀을 기재하십시오."
    height_mm: 16
    sample_text: 평소 관심 있던 교육 분야에서 도움을 드리고 싶어 신청합니다. 성실히 참여하겠습니다.
  - type: subtitle
    text: 5. 동의 및 보호자 확인
  - type: grid
    widths: [22, 28, 22, 28]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["개인정보 수집·이용 동의", "동의 / 미동의", "활동사진 이용 동의", "동의 / 미동의"]
      - ["보호자 성명 (미성년자)", "", "보호자 연락처", ""]
    sample_rows:
      - ["", "", "", ""]
      - ["", "", "", ""]
  - type: para
    text: 위와 같이 자원봉사 활동을 신청합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["신청인", "보호자(미성년자)"]
    sample_names: [이수현, ""]
  - type: notice
    text: 활동 중 안전을 위해 보험 가입 여부와 유의사항을 담당 기관에 확인하십시오.
