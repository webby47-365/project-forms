id: lease-renewal-refusal-notice
title: 임대차 갱신 거절 통지서
category: estate
subcategory: lease
tags: [임대차 갱신 거절, 계약갱신 거절, 임대차 만료 통지, 갱신 불가 통보, 재계약 거절]
summary: 임대차 계약을 만료일에 끝내고 갱신하지 않겠다는 뜻을 임대인 또는 임차인이 상대방에게 알리는 임대차 갱신 거절 통지서 양식입니다.
usage: >
  주택이나 상가 임대차의 기간이 끝나기 전에 계약을 다시 맺지 않겠다는 뜻을 알리는 문서입니다.
  임대 목적물, 보증금과 월 차임, 계약 기간과 만료일, 거절 사유를 사실 위주로 적습니다.
  통지 기한과 갱신 거절이 허용되는 사유는 법령과 계약 내용에 따라 달라지므로 보내기 전에
  계약서와 관련 법령을 확인하고, 분쟁 가능성이 있으면 내용증명 발송과 전문가 상담을 고려하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 보내는 사람과 받는 사람을 적습니다.
  - 임대 목적물과 보증금, 계약 기간을 적습니다.
  - 갱신하지 않겠다는 뜻과 사유를 적습니다.
  - 날짜를 쓰고 서명한 뒤 보낸 기록을 남깁니다.
faq:
  - q: 통지는 언제까지 해야 하나요?
    a: 법령과 계약 내용에 따라 다릅니다. 만료일 전 정해진 기간이 있는지 계약서와 관련 법령을 확인하십시오.
  - q: 사유를 꼭 적어야 하나요?
    a: 거절이 허용되는 사유가 정해진 경우가 있습니다. 사실 위주로 구체적으로 적어 두고 필요하면 전문가와 상담하십시오.
  - q: 어떻게 보내야 증거가 남나요?
    a: 내용증명이나 문자·이메일 등 보낸 날짜가 남는 방법을 쓰고, 보낸 사본을 보관하십시오.
related: [certified-notice, lease-termination-notice, deposit-return-notice, lease-deposit-return-schedule-agreement]
