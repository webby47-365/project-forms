id: internal-announcement
title: 사내 공지문
category: corp
subcategory: admin
version: 1
created_by: agent
status: published
tags: [사내공지문, 사내공문, 공지사항, 사내알림, internal notice]
summary: 전 직원 또는 특정 부서에 전달할 공지 내용과 세부 안내, 문의처를 정리한 사내 공지문입니다.
usage: >
  조직 내부에 정책 변경, 행사, 시설 이전 등을 알릴 때 쓰는 문서입니다. 수신 범위와
  제목을 먼저 명확히 하고, 본문에는 공지 배경과 핵심 내용을 요약한 뒤 세부 안내
  표에 일정·장소 등 실무 정보를 항목별로 정리합니다. 문의처를 반드시 남겨 궁금한
  점이 있는 직원이 바로 연락할 수 있도록 하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 공지 제목과 수신 범위를 먼저 정합니다.
  - 공지 배경과 핵심 내용을 간단히 씁니다.
  - 일정, 장소 등 세부 안내를 항목별로 정리합니다.
  - 문의처를 남기고 결재 후 게시합니다.

faq:
  - q: 전 직원 공지와 부서 공지를 나눠 써야 하나요?
    a: 수신 범위 항목에 대상을 명확히 적으면 하나의 서식으로 두 경우 모두 처리할 수 있습니다.
  - q: 공지 후 정정할 내용이 생기면 어떻게 하나요?
    a: 정정 공지를 별도로 올리고 원래 공지에도 정정 사실과 안내를 추가합니다.

blocks:
  - type: doc_title
    text: 사내 공지문
    spaced: true

  - type: grid
    widths: [14, 36, 14, 36]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["수신", "", "발신", ""]
      - ["제목", "", "", ""]
      - ["날짜", "", "", ""]
    sample_rows:
      - ["", "전 직원", "", "총무팀"]
      - ["", "2026년 4분기 사무실 이전 안내", "", ""]
      - ["", "2026-09-13", "", ""]

  - type: subtitle
    text: 공지 내용

  - type: textbox
    hint: "공지 배경과 핵심 내용을 간결하게 작성하십시오."
    height_mm: 36
    sample_text: 2026년 10월 1일부로 본사 사무실을 강남구 테헤란로 신사옥으로 이전합니다. 이전 기간 중 혼선이 없도록 각 부서는 9월 25일까지 이전 대상 비품 목록을 총무팀에 제출해 주시기 바랍니다. 세부 이전 일정은 추후 공지하겠습니다.

  - type: subtitle
    text: 세부 안내

  - type: table
    widths: [25, 75]
    header: [항목, 내용]
    empty_rows: 4
    row_height_mm: 9
    sample_rows:
      - ["이전일자", "2026년 10월 1일(목) 오전 9시부터 업무 시작"]
      - ["신주소", "서울특별시 강남구 테헤란로 212, 한빛타워 8층"]
      - ["문의", "총무팀 내선 1234"]

  - type: subtitle
    text: 문의처

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["담당부서", "", "연락처", ""]
    sample_rows:
      - ["", "총무팀", "", "02-1234-5678"]

  - type: para
    text: 위와 같이 공지합니다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    label: 총무팀장
    sample_names: [홍길동]
