id: case-record-inspection-request
title: 소송기록 열람·복사 신청서
category: legal
subcategory: litigation
tags: [소송기록열람, 기록복사신청, 사건기록열람, 열람복사신청서, 재판기록]
summary: 진행 중이거나 끝난 사건의 소송기록을 보거나 복사하려고 법원에 내는 열람·복사 신청서 양식입니다.
usage: >
  본인이 당사자이거나 이해관계가 있는 사건의 기록을 확인할 때 쓰는 서식입니다. 사건번호와 사건명, 신청인과
  사건 관계, 열람할 대상과 복사 범위, 사용 목적을 적습니다. 열람·복사가 가능한 범위와 필요한 서류, 수수료는
  사건 종류와 신청인의 지위에 따라 다르므로 담당 법원 민원실의 안내를 확인하십시오. 본 서식은 참고용이며
  법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 법원 이름과 사건번호, 사건명을 적습니다.
  - 신청인의 성명과 연락처, 사건 관계를 적습니다.
  - 열람할지 복사할지 고르고 대상 서류를 적습니다.
  - 사용 목적을 적고 날짜와 서명을 합니다.
faq:
  - q: 누구나 소송기록을 볼 수 있나요?
    a: 아닙니다. 신청인의 지위와 사건 종류에 따라 범위가 다르므로 담당 법원에 확인하십시오.
  - q: 수수료는 얼마인가요?
    a: 복사 장수 등에 따라 달라집니다. 법원 민원실의 안내를 확인하십시오.
related: [evidence-submission-list, preparatory-brief, hearing-date-change-request, service-address-change-report]
blocks:
  - type: doc_title
    text: 소송기록 열람·복사 신청서
    spaced: false
  - type: subtitle
    text: 1. 사건 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["법원", "", "사건번호", ""]
      - ["사건명", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "서울중앙지방법원", "", "2026가소00000"]
      - ["", "물품대금 청구의 소", "", ""]
  - type: subtitle
    text: 2. 신청인
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["사건 관계", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "원고", "", ""]
  - type: subtitle
    text: 3. 신청 내용
  - type: table
    widths: [14, 46, 20, 20]
    header: ["구분", 대상 서류, 쪽수, 비고]
    empty_rows: 3
    row_height_mm: 9
    sample_rows:
      - ["열람", "소장 및 답변서", "전체", ""]
      - ["복사", "증거서류 목록", "5쪽", "1부"]
  - type: textbox
    hint: "열람·복사가 필요한 이유(사용 목적)를 적으십시오."
    height_mm: 22
    sample_text: "소송 준비를 위해 상대방이 제출한 서류의 내용을 확인하려고 합니다."
  - type: date_line
    sample_text: 2026 년   10 월   30 일
  - type: sign_line
    label: 신청인
    sample_names: [홍길동]
  - type: notice
    text: 열람·복사 범위와 수수료는 담당 법원의 안내를 확인하십시오.
