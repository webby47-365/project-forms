id: contract-down-payment-refund-agreement
title: 계약금 반환 합의서
category: legal
subcategory: contract
tags: [계약금반환, 계약금합의, 반환합의서, 계약해제, 환불합의]
summary: 계약이 이행되지 않게 되었을 때 이미 받은 계약금을 돌려주는 금액·기한·방법을 당사자끼리 정리하는 계약금 반환 합의서 양식입니다.
usage: >
  매매나 용역 계약을 맺고 계약금을 주고받은 뒤 계약을 진행하지 않기로 했을 때 쓰는 서식입니다.
  원래 계약의 내용, 받은 계약금, 반환할 금액과 기한, 계좌를 적고 양쪽이 서명합니다.
  위약금이나 공제 항목이 있다면 반환액 산정 방법을 빠짐없이 적어 두십시오.
  책임 소재는 이 서식이 판단하지 않으며 분쟁 소지가 있으면 전문가 상담을 권합니다.
source: original
featured: false
target_pages: 1
howto:
  - 원래 계약의 이름과 계약일, 계약 당사자를 적습니다.
  - 받은 계약금과 반환하기로 한 금액을 적습니다.
  - 반환 기한과 입금받을 계좌를 적습니다.
  - 공제 항목이 있으면 사유와 금액을 적고 양쪽이 서명합니다.
faq:
  - q: 계약금을 전부 돌려받는 것으로 적어야 하나요?
    a: 반드시 그렇지는 않습니다. 당사자끼리 정한 대로 적되, 공제가 있으면 사유와 금액을 분명히 적으십시오.
  - q: 반환을 나누어 받을 수도 있나요?
    a: 가능합니다. 반환 일정란에 회차별 금액과 날짜를 적고 지연 시 처리 방법을 함께 적어 두면 좋습니다.
  - q: 합의서를 쓰면 더 이상 청구하지 못하나요?
    a: 합의서 문구에 따라 달라질 수 있습니다. 추가 청구 가능성이 있다면 서명 전에 전문가와 상의하십시오.
related: [contract-termination-agreement, deposit-return-notice, certified-notice-deposit, receipt]
