id: permit-application-poa
title: 인허가 신청 위임장
category: public
subcategory: permit
tags: [인허가위임장, 영업신고위임장, 인허가대행위임장, 허가신청위임장, 영업허가위임장]
summary: 영업 신고나 인허가 신청을 대리인(행정사 등)에게 맡길 때 신청 종류·사업장·위임 범위를 적는 위임장입니다.
usage: >
  식품·공중위생·통신판매 등 영업 신고나 인허가를 직접 처리하기 어려워 행정사나 직원에게 맡길 때
  쓰는 위임장입니다. 신청 종류와 사업장 정보, 위임 범위와 기간을 적고 위임인이 서명 또는 날인합니다.
  업종에 따라 위임장 서식과 첨부 서류(신분증 사본 등)가 정해져 있을 수 있으니 접수처 안내를
  확인한 뒤 제출하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 위임인(신청인)의 성명과 연락처를 적습니다.
  - 신청 종류와 사업장 이름·주소를 적습니다.
  - 대리인 정보를 적고 위임할 범위를 표시합니다.
  - 위임 기간을 정하고 위임인이 서명 또는 날인합니다.

faq:
  - q: 행정사에게 맡길 때도 위임장이 필요한가요?
    a: 대리 접수 시 위임장을 요구하는 경우가 일반적입니다. 접수처와 대행인에게 먼저 확인하십시오.
  - q: 위임 범위는 어떻게 정하나요?
    a: 서류 작성·제출·수령 등 맡길 일만 표시합니다. 범위를 넓게 잡지 말고 필요한 것만 적습니다.
  - q: 신분증 사본도 함께 내야 하나요?
    a: 접수처마다 요구가 다릅니다. 위임인 신분증 사본 등 첨부 서류는 접수처 안내를 확인하십시오.

related: [business-registration-poa, gov-food-business-report, business-facility-use-consent, power-of-attorney]

blocks:
  - type: doc_title
    text: 인허가 신청 위임장
    spaced: false

  - type: para
    text: 본인은 아래 대리인에게 인허가(영업 신고) 신청에 관한 권한을 위임합니다.
    align: center
    size: 10.5

  - type: subtitle
    text: 1. 위임인 (신청인)

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-11-02"]
      - ["", "서울특별시 마포구 월드컵북로 50 101동 502호", "", ""]
      - ["", "010-1234-5678", "", ""]

  - type: subtitle
    text: 2. 신청 내용

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["신청 종류", "", "", ""]
      - ["사업장 명칭", "", "", ""]
      - ["사업장 주소", "", "", ""]
    sample_rows:
      - ["", "일반음식점 영업 신고", "", ""]
      - ["", "한빛식당", "", ""]
      - ["", "서울특별시 마포구 월드컵로 10 1층", "", ""]

  - type: subtitle
    text: 3. 대리인 (수임인)

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["소속", "", "관계", ""]
    sample_rows:
      - ["", "박민준", "", "010-2345-6789"]
      - ["", "새길행정사사무소", "", "행정사"]

  - type: subtitle
    text: 4. 위임 범위

  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["위임 사항", "(   ) 신청서 작성   (   ) 서류 제출   (   ) 보완 서류 제출   (   ) 증서 수령"]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "( ✓ ) 신청서 작성   ( ✓ ) 서류 제출   ( ✓ ) 보완 서류 제출   ( ✓ ) 증서 수령"]
      - ["", "2026-10-01 ~ 2026-10-31"]

  - type: kv_list
    items:
      - "대리인은 위임받은 범위 안에서만 위 신청에 관한 서류를 사용합니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."

  - type: date_line
    sample_text: 2026 년    9 월   30 일

  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 박민준]

  - type: notice
    text: 업종별 필요 서류와 첨부 서류는 접수처 안내를 확인하십시오.
