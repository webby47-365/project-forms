id: delegation-revocation
title: 위임 해지 통지서
category: legal
subcategory: notice
tags: [위임해지통지서, 위임계약해지, 위임해지, 위임종료통지, 위임해제]
summary: 위임인이 수임인에게 위임계약의 해지 의사와 해지 효력 발생일, 인계 요구사항을 통지하는 양식입니다.
usage: >
  위임인이 기존에 맺은 위임계약을 더 이상 유지하지 않기로 하고 이를 수임인에게 공식적으로
  알릴 때 사용합니다. 원 위임의 내용(위임일, 위임 사무, 위임 범위, 보수)을 먼저 밝히고 해지
  사유와 해지 효력이 발생하는 날짜를 명확히 기재합니다. 서류·인장·잔여 금원 등 인계받아야
  할 사항을 표로 정리해 두면 인수인계가 매끄럽습니다. 통지서는 등기우편 등으로 발송해 도달
  사실을 남겨 두는 것이 좋습니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 위임인과 수임인의 인적사항을 적습니다.
  - 원 위임의 내용(위임일, 사무, 범위, 보수)을 적습니다.
  - 해지 사유와 해지 효력 발생일을 기재합니다.
  - 인계받아야 할 서류·인장·잔여 금원을 표로 정리합니다.
  - 등기우편 등으로 발송해 도달 사실을 남깁니다.

faq:
  - q: 해지 효력은 언제부터 발생하나요?
    a: 통지서에 적은 해지 효력 발생일부터이며, 명확히 기재해야 분쟁을 줄일 수 있습니다.
  - q: 꼭 등기우편으로 보내야 하나요?
    a: 도달 사실을 증명하기 위해 등기우편 등 기록이 남는 방법을 권장합니다.

related: [power-of-attorney, certified-notice, handover-report]

blocks:
  - type: doc_title
    text: 위임 해지 통지서
    spaced: false

  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["위임인", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["수임인", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "김서연", "", "010-9876-5432"]
      - ["", "서울특별시 서대문구 충정로 30", "", ""]

  - type: subtitle
    text: 2. 원 위임 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
