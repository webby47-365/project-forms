id: parking-space-consent-vehicle-registration
title: 주차장소 사용승낙서 (자동차 등록용)
category: public
subcategory: vehicle
tags: [주차장소사용승낙서, 자동차등록주차장확보, 차고지증명서, 주차공간사용동의서, 자동차등록위한주차확인]
summary: 자동차 신규·이전등록 시 요구되는 주차장(차고지) 확보를 증명하기 위해 주차장 소유자·관리자가 사용을 승낙하는 서류입니다.
usage: >
  제주특별자치도는 전국에서 유일하게 차고지증명제를 시행하고 있어, 자동차를 신규·이전
  등록할 때 차고지(주차장) 확보를 확인합니다. 본인 소유 주차장이 없으면 다른 사람의
  주차장소를 빌려 쓴다는 사용승낙서를 요구합니다. 주차장 위치와 면적, 사용 기간을
  정확히 적고 소유자(관리자)의 서명을 받아야 합니다. 경형·소형차(1톤 이하 화물차 포함)
  와 전기차·수소차는 대상에서 빠지는 등 세부 기준이 바뀔 수 있으니 관할 차량등록사업소
  (구청)에 먼저 확인한 뒤 준비하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 주차장 소유자(관리자)와 사용자의 인적사항을 적습니다.
  - 주차장 소재지와 면적, 주차 가능 대수를 적습니다.
  - 사용 기간과 사용료 유무를 적습니다.
  - 소유자(관리자)가 서명 또는 날인합니다.

faq:
  - q: 모든 지역에서 필요한가요?
    a: 2026년 기준 제주특별자치도에서만 시행 중이며, 그 안에서도 대상 차종이 정해져 있어 관할 등록사업소에 확인이 필요합니다.
  - q: 유료 주차장도 가능한가요?
    a: 계약 주차 확인서 등 별도 서류를 요구하는 경우가 많아 주차장 운영자에게 필요 서류를 확인하십시오.
  - q: 사용 기간이 끝나면 다시 내야 하나요?
    a: 사용 기간이 끝나기 전에 갱신하거나 다른 차고지 증명 서류를 새로 준비해야 합니다.

related: [gov-vehicle-transfer-registration, gov-vehicle-transfer-cert, vehicle-lease-contract]

