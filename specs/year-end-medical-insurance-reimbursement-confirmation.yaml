id: year-end-medical-insurance-reimbursement-confirmation
title: 연말정산 실손의료보험금 수령 확인서
category: public
subcategory: tax
tags: [연말정산, 실손보험, 보험금수령, 의료비공제, 의료비]
summary: 연말정산 의료비 자료를 낼 때 실손의료보험 등으로 돌려받은 보험금 내역을 적어 회사에 함께 내는 수령 확인서 양식입니다.
usage: >
  병원비를 낸 뒤 보험사에서 보험금을 받았다면 의료비 자료에서 그 금액을 따로 밝혀야 하는 경우가 있습니다.
  이 서식은 의료비를 낸 병원과 총 지출액, 받은 보험금과 수령일, 보험사 이름을 한곳에 정리해 회사 담당 부서에 내는 용도입니다.
  보험금을 아직 받지 못했거나 청구 중이면 그 사실을 비고에 적으십시오.
  공제 대상 여부와 계산은 세법과 회사 안내에 따라 달라지므로 제출 전에 담당 부서에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 제출자의 성명·소속과 귀속 연도를 적습니다.
  - 의료비를 낸 병원과 지출 금액을 표에 적습니다.
  - 받은 보험금과 수령일, 보험사를 같은 줄에 적습니다.
  - 청구 중인 건은 비고에 적고 서명합니다.
faq:
  - q: 보험금을 받지 않았다면 내야 하나요?
    a: 받은 보험금이 없으면 따로 낼 필요가 없는 경우가 많습니다. 회사 안내를 먼저 확인하십시오.
  - q: 다음 해에 받을 보험금은 어떻게 적나요?
    a: 청구 중이거나 수령 예정이면 비고에 적어 두고, 처리 방법은 담당 부서에 문의하십시오.
  - q: 영수증도 함께 내야 하나요?
    a: 의료비 자료와 함께 내는 것이 일반적입니다. 필요한 증빙은 회사 안내를 따르십시오.
related: [year-end-medical-expense-submission, medical-bill-itemization-request, year-end-correction-request, year-end-tax-checklist]
