id: gov-vehicle-transfer-cert
title: 자동차양도증명서 (직접 거래용)
category: public
subcategory: vehicle
tags:
- 자동차
- 중고차
- 직접거래
- 양도
- 소유권이전
summary: 개인 간에 중고차를 직거래할 때 양도인과 양수인이 함께 서명하는 양도증명서입니다.
usage: '개인 간 중고차 직거래 시 양도인(판매자)과 양수인(구매자)가 함께 작성하여 서명합니다. 양도인과 양수인의 인적사항, 차량 정보(등록번호·차대번호·차종), 거래 내용(매매일·금액·인도일)을 기록하고 계약 조항에 동의합니다. 양수인이 이 증명서를 지참하여 15일 이내에 자동차 이전등록을 신청해야 하며, 인지세 납부 후 수입인지를 붙여야 합니다.

  '
source: law-standard
source_note: 자동차등록규칙 별지 제15호서식
law_ref:
  law: 자동차등록규칙
  form_no: 별지 제15호서식
  amended: '2022-12-01'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EC%9E%90%EB%8F%99%EC%B0%A8%EB%93%B1%EB%A1%9D%EA%B7%9C%EC%B9%99&bylNo=0015&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 국토교통부
  checked: '2026-09-16'
featured: false
target_pages: 1
created_by: gov-batch
howto:
- 양도인(판매자)과 양수인(구매자)의 성명과 주민(법인)등록번호를 적습니다.
- 차종, 차대번호, 자동차등록번호 등 차량 정보를 기입합니다.
- 매매일, 매매금액, 잔금지급일, 자동차 인도일을 적습니다.
- 양도인과 양수인이 함께 계약 조항을 확인하고 서명 또는 인을 합니다.
- 인지세 납부 후 수입인지를 붙이고 양수인이 보관합니다.
faq:
- q: 양도증명서는 몇 장을 만드나요?
  a: 2통을 작성합니다. 양도인과 양수인이 각각 1통씩 가집니다.
- q: 공동명의인 경우는 어떻게 하나요?
  a: 공동명의인 경우 각 소유자의 정보를 모두 기입하고, 대표자를 정한 후 모두가 서명합니다.
- q: 인지세는 누가 내나요?
  a: 인지세법에 따라 납부하며, 수입인지를 양도증명서 뒷면 여백에 붙입니다.
