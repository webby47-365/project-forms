      - 제1조(당사자표시) 양도인을 “갑”이라 하고, 양수인을 “을”이라 한다.
    - - l
      - 제2조(동시이행 등) “갑”은 잔금을 수령하고 채권액을 상환한 후 자동차와 소유권이전등록에 필요한 서류를 “을”에게 인 도한다.
    - - l
      - 제3조(공과금부담) 이 자동차에 대한 제세공과금은 자동차 인도일을 기준으로 하여, 그 기준일까지의 분은 “갑”이 부담하 고, 기준일 다음 날부터의 분은 “을”이 부담한다. 다만, 관계 법령에 제세공과금의 납부에 관하여 특별한 규정이 있는 경우에는 그에 따른다.
    - - l
      - 제4조(사고책임) “을”은 이 자동차를 인수한 때부터 발생하는 모든 사고에 대하여 자기를 위하여 운행하는 자로서의 책임 을 진다.
    - - l
      - 제5조(법률상의 하자책임) 자동차인도일 이전에 발생한 행정처분 또는 이전등록 요건의 미비, 그 밖에 행정상의 하자에 대해서는 “갑”이 그 책임을 진다.
    - - l
      - 제6조(등록 지체 책임) “을”이 매매목적물을 인수한 후 정해진 기간에 이전등록을 하지 않을 때에는 이에 대한 모든 책임을 “을” 이 진다.
    - - l
      - 제7조(할부승계특약) “갑”이 자동차를 할부로 구입하여 할부금을 다 내지 않은 상태에서 “을”에게 양도하는 경우에는 나 머지 할부금을 “을”이 승계하여 부담할 것인지의 여부를 특약사항란에 적어야 한다.
    - - l
      - 제8조(양도증명서) 이 양도증명서는 2통을 작성하여 “갑”과 “을”이 각각 1통씩 지니고(공동명의일 경우 대표자가 소지한
    - - l
      - '다) “을”은 이 증명서를 소유권의 이전등록 신청을 할 때(잔금지급일부터 15일 이내)에 등록관청에 제출해야 한다. 제9조(대표자) 공동명의일 경우 대표양도인, 대표양수인은 공동명의자의 합의에 의해 정한다.      수입인지 특약사항:            「인지세법」에 따름 (뒷면 여백에 붙임)'
    - - l
      - 양도인은 자동차매매사업자의 중개를 통하지 않고 양수인과 직접 거래로 소유자동차를 양도하고, 「자동차등록규칙」 제33조제2항제1호에 따라 위 거래내용과 같이 양도하였음을 증명합니다. 년    월    일
    - - l
      - 양도인 (대표)           (서명 또는 인) 양수인 (대표)            (서명 또는 인) 양도인 공동명의자       (서명 또는 인) 양수인 공동명의자         (서명 또는 인)
    size: 7.7
