    lines:
    - - l
      - '1. 양도인 주의사항: 이 양도증명서를 작성할 때 양수인의 인적사항을 적지 않으면 양수인의 무단전매 등으로 예측할 수 없는 손해를 볼 수 있으니 반드시 양수인의 인적사항을 적으시기 바랍니다.'
    - - l
      - '2. 양수인 주의사항: 이 양도증명서를 작성할 때 이 차량에 대하여 부과된 자동차세 및 제세공과금의 납부, 압류ㆍ저당권 등의 등록 및 배출가스저감장치 자기부담금의 납부 여부를 확인하여 뜻하지 않은 손해를 입지 않도록 하시기 바랍니다.'
    - - l
      - '3. 공통사항: 이 당사자거래용 양도증명서를 직접거래 당사자가 아닌 자(자동차매매업자 포함)가 사용할 때에는 자동차관리법령에 따 라 처벌을 받게 됩니다.'
    - - l
      - 4. 정당한 사유 없이 주행거리를 변경한 자는 「자동차관리법」 제71조제2항 및 제79조제16호에 따라 징역 또는 벌금에 처해집니다.
    - - l
      - 5. 자동차정비, 검사, 주행거리 이력, 자동차세 납부 여부, 압류내역 및 배출가스저감장치 자기부담금 납부내역 등 자동차종합이력정 보는 국토교통부에서 제공하는 스마트폰용 어플(“마이카정보”) 또는 자동차민원대국민포털(www.ecar.go.kr)에서 조회가 가능하므 로 확인 바랍니다.
    - - l
      - 6. 양도인이 서명한 경우에는 본인서명사실확인서 또는 전자본인서명확인서 발급증을, 양도인이 날인한 경우에는 인감증명서를 첨부해 야 합니다.
    size: 7.2
