id: joint-venture-contract
title: 공동사업 계약서
category: legal
subcategory: contract
tags: [공동사업 계약서, 동업계약서, 공동투자 계약, 지분 계약서, 동업 약정]
summary: 공동사업의 목적·출자내용·지분비율과 손익분배·의사결정 방법을 정하는 동업계약서입니다.
usage: >
  두 사람 이상이 함께 사업을 운영할 때 권리와 책임을 미리 정해 두는 계약서입니다. 출자는
  현금·현물·노무를 구분해 평가금액과 함께 적고, 지분비율은 합계가 100%가 되도록 기재하십시오.
  손익분배 시기와 방법, 그리고 중요한 의사결정을 어떤 요건으로 할지 정해 두어야 교착을 막을 수
  있습니다. 탈퇴와 지분양도, 경업금지, 청산 절차는 분쟁이 가장 잦은 부분이므로 구체적으로
  합의해 적으십시오. 사업자등록과 세무 처리 방식은 관할 세무서 기준을 확인하십시오.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 공동사업 계약서
    spaced: false
  - type: para
    text: 아래 당사자는 공동으로 사업을 영위하기 위하여 다음과 같이 계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 사업 개요
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["사업명", "", "사업 개시일", ""]
      - ["사업장 소재지", "", "", ""]
      - ["사업 내용(업종)", "", "", ""]
      - ["총 출자금", "", "계약기간", ""]
  - type: subtitle
    text: 출자 및 지분
  - type: table
    widths: [8, 18, 16, 18, 14, 12, 14]
    header: ["No", 성명(상호), 출자 종류, 출자 내용, 평가금액, 지분율, 비고]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 당사자가 공동으로 위 사업을 영위함에 있어 출자·운영·손익분배에 관한 사항을 정함을 목적으로 한다."
  - type: article
    heading: 제2조 (출자)
    lines:
      - "당사자는 위 표에 기재한 출자를 약정한 기일까지 이행한다."
      - "출자를 지체한 당사자에 대하여는 지분율 조정 또는 지연이자 부과 등 당사자가 합의한 조치를 취할 수 있다."
      - "현물 및 노무 출자의 평가는 당사자 전원의 합의로 정한다."
  - type: article
    heading: 제3조 (업무집행 및 의사결정)
    lines:
      - "일상적인 업무집행은 업무집행자가 담당하며, 업무집행자는 당사자 합의로 선임한다."
      - "자산의 처분, 차입, 신규 사업 진출, 지분 변동 등 중요한 사항은 지분율       % 이상의 동의로 결정한다."
      - "당사자는 사업 관련 회계장부를 언제든지 열람할 수 있다."
  - type: page_break
  - type: article
    heading: 제4조 (손익의 분배)
    lines:
      - "이익과 손실은 지분율에 따라 분배하고 부담한다. 다만 당사자가 달리 합의한 경우 특약사항에 따른다."
      - "분배는       개월마다 결산하여 실시하며, 유보가 필요한 경우 당사자 합의로 정한다."
  - type: article
    heading: 제5조 (경업금지 및 비밀유지)
    lines:
      - "당사자는 계약기간 중 본 사업과 경쟁관계에 있는 사업을 영위하지 아니한다."
      - "당사자는 사업상 알게 된 비밀을 제3자에게 누설하지 아니하며, 이 의무는 탈퇴 후에도 존속한다."
  - type: article
    heading: 제6조 (지분의 양도 및 탈퇴)
    lines:
      - "당사자는 다른 당사자 전원의 서면 동의 없이 지분을 제3자에게 양도할 수 없다."
      - "탈퇴하고자 하는 당사자는       개월 전에 서면으로 통지하며, 탈퇴 시 지분 정산 방법은 당사자 합의로 정한다."
  - type: article
    heading: 제7조 (계약의 해지 및 청산)
    lines:
      - "당사자 일방이 본 계약을 중대하게 위반한 경우 다른 당사자는 시정을 요구한 후 계약을 해지할 수 있다."
      - "사업을 종료하는 경우 자산을 환가하여 채무를 변제한 후 잔여재산을 지분율에 따라 분배한다."
  - type: article
    heading: 제8조 (분쟁의 해결)
    lines:
      - "본 계약에 정하지 아니한 사항은 관계 법령과 상관례에 따른다."
      - "분쟁이 발생한 경우 당사자는 성실히 협의하며, 협의가 이루어지지 않으면 합의한 법원을 관할로 한다."
  - type: textbox
    hint: "특약사항 — 역할 분담, 급여·활동비 지급, 추가 출자 요건, 사업자등록 명의 등을 기재하십시오."
    height_mm: 26
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["당사자 1", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["당사자 2", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["당사자 3", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
  - type: date_line
  - type: sign_line
    labels: ["당사자 1", "당사자 2", "당사자 3"]
  - type: notice
    text: 사업자등록 형태와 세무 처리, 대외적 책임 범위는 관할 세무서 및 전문가 기준을 확인하십시오.
