id: small-claims-complaint
title: 소장 (소액사건)
category: legal
subcategory: litigation
tags: [소액심판소장, 소액사건소장, 소장양식, 민사소장, 소액재판]
summary: 청구금액 3천만원 이하 소액사건에 사용하는 민사 소장 양식입니다.
usage: >
  소액사건은 절차가 간이하고 1회 변론으로 종결되는 경우가 많아 변호사 없이도 진행할 수
  있습니다. 청구취지는 판결문에 그대로 옮겨지는 문장이므로 금액과 이자 기산일을 정확히
  써야 하고, 청구원인은 다툼의 경위를 시간순으로 담백하게 적는 편이 유리합니다. 인지대는
  청구금액에 따라 달라지고 송달료는 당사자 수에 따라 계산되므로 제출 직전에 확인하십시오.
  본 서식은 참고용이며 실제 제출 전 대한민국 법원 전자소송 사이트의 최신 양식을 확인하십시오.
source: law-standard
source_note: 소액사건심판법 및 민사소송법상 소장 기재사항을 참고하여 자체 제작
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 소장
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [14, 26, 14, 20, 26]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 4]
      - [3, 1, 3, 4]
    rows:
      - ["원고 성명", "", "생년월일", "", "연락처"]
      - ["원고 주소", "", "", "", ""]
      - ["피고 성명", "", "생년월일", "", "연락처"]
      - ["피고 주소", "", "", "", ""]
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사건명", "", "소가(청구금액)", "금                원"]
  - type: subtitle
    text: 청구 취지
  - type: para
    text: "1. 피고는 원고에게 금            원 및 이에 대하여 20   년   월   일부터 다 갚는 날까지 연      %의 비율로 계산한 돈을 지급하라."
    align: both
    size: 10
    space_after: 2
  - type: para
    text: "2. 소송비용은 피고가 부담한다."
    align: both
    size: 10
    space_after: 2
  - type: para
    text: "3. 제1항은 가집행할 수 있다."
    align: both
    size: 10
  - type: para
    text: 라는 판결을 구합니다.
    align: right
    size: 10
  - type: subtitle
    text: 청구 원인
  - type: textbox
    hint: "다툼의 경위를 시간순으로 기재하십시오. 언제, 누구와, 어떤 약정을 했고, 피고가 무엇을 이행하지 않았는지 사실만 적습니다."
    height_mm: 50
  - type: subtitle
    text: 입증 방법
  - type: table
    widths: [10, 34, 30, 26]
    header: ["No", 서증명, 내용, 비고]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
  - type: subtitle
    text: 첨부 서류
  - type: kv_list
    items:
      - "위 입증방법 사본 각 1부"
      - "인지·송달료 납부서 각 1부"
      - "법인인 경우 법인등기부등본 1부"
  - type: date_line
  - type: sign_line
    label: 원고
  - type: spacer
    height_pt: 6
  - type: para
    text: "                        법원  귀중"
    align: center
    size: 12
    bold: true
  - type: notice
    text: 소액사건은 청구금액 3천만원 이하가 대상입니다. 인지대와 송달료는 청구금액·당사자 수에 따라 달라지므로 제출 직전 법원에 확인하십시오. 본 서식은 참고용이며 법적 효력과 적합성은 이용자가 확인해야 합니다.
