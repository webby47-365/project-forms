id: cover-letter
title: 자기소개서 (기본형)
category: personal
subcategory: career
tags: [자기소개서, 자소서, 입사지원서, 성장과정, cover letter]
summary: 성장과정·성격·경력·지원동기·입사 후 계획 5개 항목으로 구성된 표준 자기소개서 양식입니다.
usage: >
  이력서와 함께 제출하는 서술형 서류입니다. 항목별로 소제목을 달고 두괄식(결론 먼저)으로
  작성하면 가독성이 높아집니다. 회사가 글자 수를 지정한 경우 그 기준을 따르고, 지정이
  없으면 항목당 500~700자 내외로 작성합니다.
source: original
featured: true
featured_rank: 2
target_pages: 2
blocks:
  - type: doc_title
    text: 자기소개서
  - type: grid
    widths: [14, 20, 12, 18, 14, 22]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "지원분야", "", "연락처", ""]
  - type: subtitle
    text: 1. 성장과정 및 가치관
  - type: textbox
    hint: "가정환경, 학창시절, 형성된 가치관을 중심으로 작성하십시오."
    height_mm: 33
  - type: subtitle
    text: 2. 성격의 장점 및 보완점
  - type: textbox
    hint: "장점은 근거가 되는 경험과 함께, 보완점은 개선 노력과 함께 작성하십시오."
    height_mm: 30
  - type: subtitle
    text: 3. 학내외 활동 및 직무 관련 경험
  - type: textbox
    hint: "직무와 연관된 경험을 상황-행동-결과 순서로 구체적으로 작성하십시오."
    height_mm: 33
  - type: subtitle
    text: 4. 지원동기
  - type: textbox
    hint: "회사를 선택한 이유와 해당 직무를 지원한 이유를 함께 작성하십시오."
    height_mm: 30
  - type: subtitle
    text: 5. 입사 후 포부 및 계획
  - type: textbox
    hint: "입사 후 단기(1년)·중장기(3~5년) 목표를 나누어 작성하십시오."
    height_mm: 30
  - type: para
    text: 위 내용은 사실과 다름이 없음을 확인합니다.
    align: center
    size: 11
    space_after: 2
  - type: date_line
  - type: sign_line
    label: 지원자
