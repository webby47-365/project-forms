id: tax-invoice-correction-request
title: 수정세금계산서 발행요청서
category: public
subcategory: tax
tags: [수정세금계산서발행요청서, 세금계산서정정요청서, 수정세금계산서요청, 전자세금계산서정정, 세금계산서오류정정]
summary: 거래 내용이 바뀌거나 세금계산서가 잘못 발급됐을 때 상대 사업자에게 수정 발급을 요청하는 수정세금계산서 발행요청서입니다.
usage: >
  공급가액·품목이 틀리게 발급됐거나 계약 해제·에누리·반품이 생겼을 때, 공급받는 자가
  공급자에게 수정세금계산서 발급을 공식적으로 요청하기 위해 쓰는 문서입니다. 최초
  세금계산서의 작성일자·승인번호와 정정 사유, 정정 후 금액을 함께 적어야 담당자가
  바로 확인할 수 있습니다. 수정 발급 가능 사유와 절차는 국세청 안내를 따르며, 회신
  기한을 정해 두면 부가가치세 신고 일정에 맞추기 쉽습니다.
source: original
featured: false
target_pages: 1

howto:
  - 요청하는 사업자와 받는 사업자의 정보를 적습니다.
  - 최초 발급된 세금계산서의 작성일자와 금액을 적습니다.
  - 정정 사유와 수정 후 금액을 적습니다.
  - 회신 기한을 정해 담당자에게 발송합니다.

faq:
  - q: 어떤 경우에 수정 발급이 되나요?
    a: 기재 오류·공급가액 변동·계약 해제·환입 등이 있을 때 국세청 기준에 따라 수정 발급됩니다.
  - q: 정정 후 부가세 신고는 어떻게 하나요?
    a: 수정세금계산서 발급일이 속한 과세기간의 신고에 반영하는 것이 원칙이라 담당 세무사에게 확인하십시오.
  - q: 상대방이 발급을 거부하면 어떻게 하나요?
    a: 거래 증빙을 갖춰 재요청하고, 계속 거부되면 관할 세무서 상담을 통해 처리 방법을 확인하십시오.

related: [tax-invoice, vat-filing-document-confirmation, income-tax-filing-poa]

blocks:
  - type: doc_title
    text: 수정세금계산서 발행요청서
    spaced: false

  - type: para
    text: 아래와 같은 사유로 수정세금계산서 발급을 요청합니다.
    align: center
    size: 10.5

  - type: subtitle
    text: 1. 요청 사업자 / 발급 사업자

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["요청 사업자(공급받는자)", "", "사업자등록번호", ""]
      - ["담당자·연락처", "", "이메일", ""]
      - ["발급 사업자(공급자)", "", "사업자등록번호", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "김서연 / 010-1234-5678", "", "kim@example.com"]
      - ["", "(주)새길물산", "", "000-00-00000"]

  - type: subtitle
    text: 2. 최초 발급 세금계산서

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["작성일자", "", "승인번호", ""]
      - ["공급가액", "", "세액", ""]
      - ["품목", "", "수량", ""]
    sample_rows:
      - ["", "2026-09-05", "", "20260905-12345678"]
      - ["", "3,000,000원", "", "300,000원"]
      - ["", "사무용 의자 외", "", "10"]

  - type: subtitle
    text: 3. 정정 사유 및 수정 후 내용

  - type: kv_list
    items:
      - "기재사항 착오 정정 (품목·수량·단가 등)"
      - "공급가액 변동 (에누리·할인·추가 공급 등)"
      - "계약의 해제"
      - "재화·용역의 환입(반품)"

  - type: table
    widths: [30, 20, 20, 30]
    header: [정정 후 항목, 공급가액, 세액, 비고]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["사무용 의자 외", "2,700,000원", "270,000원", "품목 1개 반품 처리"]

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["회신 기한", "", "비고", ""]
    sample_rows:
      - ["", "2026-09-25까지", "", "부가가치세 신고 일정 참고"]

  - type: date_line
    sample_text: 2026 년    9 월   16 일

  - type: sign_line
    label: 요청인
    sample_names: [김서연]

  - type: notice
    text: 수정 발급 가능 사유와 절차, 부가가치세 신고 반영 시기는 국세청 안내와 담당 세무사를 통해 확인하십시오.
