id: business-facility-improvement-confirmation
title: 영업 시설 개선 완료 확인서
category: public
subcategory: permit
tags: [영업시설, 시설개선, 개선완료, 영업신고, 확인서]
summary: 영업장의 시설을 고치거나 새로 갖춘 뒤 개선 내용과 완료일을 확인해 관할 기관 제출용으로 남기는 영업 시설 개선 완료 확인서 양식입니다.
usage: >
  영업 신고나 변경 신고, 시정 요청 후속 보고에서 시설 개선을 마쳤다는 사실을 문서로 남길 때 쓰는 서식입니다.
  영업장 정보와 개선 항목별 내용, 완료일, 시공 또는 확인자를 적고 공사 전후 사진이나 계약서 사본을 첨부합니다.
  개선 항목이 법령상 기준을 충족하는지 여부는 이 서식이 판단하지 않으므로 관할 기관이 요구하는 기준과 서식을 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 영업장 상호와 소재지, 영업 종류를 적습니다.
  - 개선한 항목과 개선 내용, 완료일을 한 줄씩 적습니다.
  - 시공업체 또는 확인한 사람을 적고 서명합니다.
  - 공사 전후 사진이나 계약서 사본을 붙여 냅니다.
faq:
  - q: 시공업체 없이 직접 고쳐도 되나요?
    a: 직접 했다면 확인자란에 본인을 적습니다. 관할 기관이 시공 증빙을 요구하는지 확인하십시오.
  - q: 사진은 꼭 붙여야 하나요?
    a: 제출처가 요구하는 경우가 많습니다. 공사 전후를 비교할 수 있는 사진을 보관하는 편이 안전합니다.
related: [business-premises-area-change-confirmation, business-premises-restoration-confirmation, permit-supplement-submission, business-license-reissue-request]
blocks:
  - type: doc_title
    text: 영업 시설 개선 완료 확인서
    spaced: false
  - type: subtitle
    text: 1. 영업장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["상호", "", "영업 종류", ""]
      - ["소재지", "", "", ""]
      - ["대표자", "", "연락처", ""]
    sample_rows:
      - ["", "새길식당", "", "일반음식점"]
      - ["", "서울시 ○○구 예시로 12", "", ""]
      - ["", "홍길동", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 개선 내용
  - type: table
    widths: [7, 20, 38, 17, 18]
    header: ["No", 개선 항목, 개선 내용, 완료일, 시공·확인자]
    empty_rows: 5
    row_height_mm: 8
    sample_rows:
      - ["1", "주방 바닥", "방수 타일로 교체", "2026-10-20", "한빛시공"]
      - ["2", "환기 설비", "후드 덕트 교체", "2026-10-25", "한빛시공"]
  - type: textbox
    hint: "개선 사유나 관할 기관 요청 사항이 있으면 적으십시오."
    height_mm: 20
    sample_text: "위생 점검 시 안내받은 주방 바닥 및 환기 설비 보완을 마쳐 완료 내용을 확인합니다."
  - type: date_line
    sample_text: 2026 년   11 월   11 일
  - type: sign_line
    labels: ["확인자(대표자)"]
    sample_names: [홍길동]
  - type: notice
    text: 개선 항목의 기준 충족 여부는 관할 기관의 기준과 서식을 확인하십시오.
