id: year-end-deceased-dependent-notice
title: 연말정산 부양가족 사망 신고서
category: public
subcategory: family
tags: [연말정산, 부양가족, 사망, 인적공제, 가족변동]
summary: 한 해 동안 부양가족이 사망한 근로자가 연말정산 담당자에게 사망 사실과 사망일을 알리는 신고서입니다.
usage: >
  연중에 부양하던 가족이 사망한 근로자가 연말정산 담당자에게 그 사실을 알릴 때 쓰는 서식입니다.
  근로자 정보와 해당 가족의 성명·관계·생년월일·사망일을 적고 서명합니다.
  사망한 해의 공제 처리는 국세청 기준과 회사 안내에 따르므로 이 서식은 사실을 알리는 틀로만 쓰십시오.
  주민등록번호와 사망 원인은 적지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 근로자 성명과 소속 부서를 적습니다.
  - 해당 가족의 성명, 관계, 생년월일을 적습니다.
  - 사망일을 적습니다.
  - 확인 문구를 읽고 날짜와 서명을 적습니다.
faq:
  - q: 사망 원인도 적어야 하나요?
    a: 아니요, 이 서식에는 원인란이 없습니다. 사망일만 적으면 됩니다.
  - q: 사망한 해에도 공제 대상인가요?
    a: 요건에 따라 달라집니다. 국세청 기준과 회사 안내를 확인하십시오.
  - q: 증빙서류가 필요한가요?
    a: 제출 서류는 회사마다 다를 수 있으니 연말정산 담당자에게 문의하십시오.
related: [year-end-dependent-change-notice, year-end-dependent-duplicate-check, year-end-tax-checklist, family-relationship-confirmation]
blocks:
  - type: doc_title
    text: 연말정산 부양가족 사망 신고서
    spaced: false
  - type: subtitle
    text: 1. 근로자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "소속 부서", ""]
      - ["사번", "", "연락처", ""]
    sample_rows:
      - ["", "박민준", "", "영업지원팀"]
      - ["", "A-1024", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 해당 가족 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "관계", ""]
      - ["생년월일", "", "사망일", ""]
    sample_rows:
      - ["", "박영수", "", "부"]
      - ["", "1950-05-10", "", "2026-07-02"]
  - type: subtitle
    text: 3. 전달 사항
  - type: textbox
    hint: "담당자에게 알릴 내용이 있으면 적으십시오."
    height_mm: 18
    sample_text: "부양가족이 사망하여 연말정산 자료에 반영되도록 알립니다."
  - type: para
    text: 위 내용이 사실과 다름이 없음을 확인하며 신고합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   28 일
  - type: sign_line
    label: 신고자
    sample_names: [박민준]
  - type: notice
    text: 공제 처리는 국세청 기준과 회사 안내를 확인하십시오.
