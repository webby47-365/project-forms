id: corporate-name-change-resolution
title: 법인 상호 변경 결의서
category: corp
subcategory: startup
tags: [법인상호변경, 상호변경결의, 정관변경, 결의서, 변경등기]
summary: 주식회사가 상호를 바꾸기로 결의한 내용과 정관 변경 사항을 기록하는 법인 상호 변경 결의서 양식입니다.
usage: >
  법인이 상호를 바꿀 때 결의한 사실을 남기는 서식입니다. 결의 일시와 장소, 변경 전후 상호, 정관 변경 조항,
  참석 및 찬성 현황을 적고 대표이사가 서명합니다. 결의 방식과 정족수는 정관과 법령에 따라 달라지고
  변경등기는 별도 절차이므로 법무사 또는 등기소 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 결의 일시와 장소, 회의 종류를 적습니다.
  - 변경 전 상호와 변경 후 상호를 적습니다.
  - 정관에서 바뀌는 조항과 내용을 적습니다.
  - 참석·찬성 주식 수를 적고 대표이사가 서명합니다.
faq:
  - q: 이사회와 주주총회 중 어디서 결의하나요?
    a: 정관 변경이 필요해 보통 주주총회 결의를 거칩니다. 회사 정관과 법령을 확인하십시오.
  - q: 이 결의서로 등기까지 끝나나요?
    a: 아닙니다. 변경등기와 사업자등록 정정은 별도로 해야 합니다. 등기소 안내를 확인하십시오.
related: [shareholder-meeting-minutes, board-minutes, corporate-seal-report-poa, business-registration-change-poa]
blocks:
  - type: doc_title
    text: 법인 상호 변경 결의서
    spaced: false
  - type: subtitle
    text: 1. 결의 개요
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["회사명", "", "대표이사", ""]
      - ["결의 일시", "", "결의 장소", ""]
      - ["본점 주소", "", "", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "박민준"]
      - ["", "2026-11-20 10:00", "", "본점 회의실"]
      - ["", "서울특별시 중구 세종대로 000", "", ""]
  - type: subtitle
    text: 2. 상호 변경 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["변경 전 상호", "", "변경 후 상호", ""]
      - ["변경 정관 조항", "", "효력 발생일", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "(주)새길커머스"]
      - ["", "제1조(상호)", "", "2026-12-01"]
  - type: subtitle
    text: 3. 참석 및 결의 현황
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["발행주식 총수", "", "참석 주식 수", ""]
      - ["찬성 주식 수", "", "반대 주식 수", ""]
    sample_rows:
      - ["", "10,000주", "", "8,000주"]
      - ["", "8,000주", "", "0주"]
  - type: textbox
    hint: "상호 변경 사유와 그 밖의 결의 사항을 적으십시오."
    height_mm: 24
    sample_text: "사업 확장에 맞춰 브랜드와 상호를 통일하기 위해 상호를 변경하고 정관 제1조를 개정한다."
  - type: para
    text: 위와 같이 결의하였음을 확인합니다.
