id: incident-report
title: 경위서
category: corp
subcategory: hr
tags: [경위서, 사고보고서, 사건보고, 안전사고보고, 직장사고]
summary: 직장 내 사건·사고의 발생 경과와 대응 결과를 기록하는 서식입니다.
usage: >
  직장 내 안전사고, 클레임, 징계 대상 행위, 기타 특이사항 등을 보고할 때 사용하는 문서입니다.
  사건 발생 직후 즉시 작성하되, 발생 일시, 장소, 관련자, 경위를 시간순으로 상세하게
  기재하고, 당사자의 진술, 목격자 확인, 초기 조치 결과를 명시하십시오. 필요에 따라
  보증인이나 관리자의 서명을 받아 인사담당자에게 제출합니다.
source: original
featured: false
target_pages: 1

howto:
  - 사건 발생 직후 일시와 장소를 먼저 적습니다.
  - 경위를 시간 순서대로 구체적으로 기록합니다.
  - 당사자 진술과 목격자 확인 내용을 정리합니다.
  - 초기 조치 결과를 적고 서명을 받아 제출합니다.

faq:
  - q: 반성문과 같은 문서인가요?
    a: 경위서는 사건 경과를 사실대로 알리는 문서이고, 반성문은 잘못을 인정하고 사과하는 성격이 강해 목적이 다릅니다.
  - q: 목격자가 없으면 어떻게 하나요?
    a: 목격자가 없다고 적고, 당사자 진술과 남아 있는 기록·자료로 경위를 최대한 구체적으로 보완하십시오.

related: [written-apology, disciplinary-notice, fact-confirmation]

blocks:
  - type: doc_title
    text: 경위서
    spaced: true

  - type: subtitle
    text: 기본 정보

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["보고 일자", "", "보고자", ""]
      - ["부서(팀)", "", "담당 사항", ""]
    sample_rows:
      - ["", "2026-09-10", "", "박민준"]
      - ["", "물류팀", "", "창고 관리"]

  - type: subtitle
    text: 사건 개요

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 10
    rows:
      - ["사건명", "", "사건 유형", ""]
      - ["발생 일시", "", "발생 장소", ""]
      - ["관련자 성명", "", "관련자 부서", ""]
    sample_rows:
      - ["", "창고 적재물 낙하 사고", "", "물적 사고"]
      - ["", "2026-09-09 14:20", "", "제2창고 3번 선반"]
      - ["", "이수현", "", "물류팀"]

  - type: subtitle
    text: 사건 경위

  - type: textbox
    hint: "사건의 발생 경과를 시간순으로 상세하게 기재하십시오. 당사자의 진술, 현장 상황, 목격자 확인 사항 등을 포함합니다."
    height_mm: 45
    sample_text: 2026년 9월 9일 14시 20분경 제2창고 3번 선반에 적재된 박스 더미가 지게차 이동 중 충격으로 낙하하였다. 당시 해당 구역에는 작업자가 없어 인명 피해는 없었으며, 박스 내 제품 일부가 파손되었다. 목격자인 이수현 사원이 즉시 현장을 확인하고 관리자에게 보고하였다.

  - type: subtitle
    text: 초기 조치 및 처리 결과

  - type: textbox
    hint: "사건 발생 후 취한 조치, 피해 규모, 안전 조치, 관계자 조치 결과 등을 기재하십시오."
    height_mm: 32
    sample_text: 사고 직후 해당 구역을 통제하고 낙하물을 정리하였다. 파손된 제품은 별도 보관 후 폐기 처리하였고, 선반 고정 상태를 전수 점검하였다. 재발 방지를 위해 적재 높이 기준을 하향 조정하기로 하였다.

  - type: spacer
    height_pt: 8

  - type: para
    text: 본인은 위 사항이 사실임을 확인합니다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    labels: [보고자, 확인자]
    sample_names: [박민준, 이수현]

  - type: spacer
    height_pt: 4

  - type: notice
    text: 사건 발생 후 가능한 빨리 제출하고, 필요시 당사자 진술서와 목격자 확인서를 별지로 첨부하십시오.
