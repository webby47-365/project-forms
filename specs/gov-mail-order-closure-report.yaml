id: gov-mail-order-closure-report
title: 통신판매업 휴업·폐업·영업재개 신고서
category: public
subcategory: permit
tags:
- 통신판매업
- 휴업신고
- 폐업신고
- 영업재개
- 사업중단
summary: 통신판매업을 일시 중단하거나 폐업, 다시 재개할 때 공정거래위원회에 제출하는 법정 신고서입니다.
usage: '통신판매업자가 휴업(일시 중단)하거나 폐업할 때, 또는 휴업했던 사업을 다시 시작할 때 공정거래위원회 또는 시·군·구청에 신고합니다. 신고인의 상호, 신고번호, 소재지, 대표자 정보를 기입하고, 해당하는 사항(휴업, 폐업, 영업재개) 중 하나를 선택합니다. 각 항목별로 신고 기간(시작일과 종료일)을 적거나, 단일 항목인 경우 해당 날짜만 기입합니다.
  폐업 신고 시 통신판매업 신고증 원본을 첨부하거나, 분실·훼손한 경우 그 사유를 기입합니다. 처리기간은 3일이고 수수료는 없습니다.

  '
source: law-standard
source_note: 전자상거래 등에서의 소비자보호에 관한 법률 시행규칙 별지 제5호서식
law_ref:
  law: 전자상거래 등에서의 소비자보호에 관한 법률 시행규칙
  form_no: 별지 제5호서식
  amended: '2026-07-20'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EC%A0%84%EC%9E%90%EC%83%81%EA%B1%B0%EB%9E%98+%EB%93%B1%EC%97%90%EC%84%9C%EC%9D%98+%EC%86%8C%EB%B9%84%EC%9E%90%EB%B3%B4%ED%98%B8%EC%97%90+%EA%B4%80%ED%95%9C+%EB%B2%95%EB%A5%A0+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0005&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 공정거래위원회·시군구
  checked: '2026-09-16'
featured: false
target_pages: 1
created_by: gov-batch
howto:
- 신고인(상호), 신고번호, 소재지, 대표자 성명과 생년월일을 기입합니다.
- 해당하는 신고 사항(휴업, 폐업, 영업재개)에 표시하고, 신고 기간을 년·월·일로 기입합니다.
- 신고 사유를 설명합니다.
- 폐업을 신고하는 경우 신고증 원본을 첨부하거나, 분실·훼손 사유를 기입합니다.
- 신고인이 서명하고 관할 기관에 제출합니다.
faq:
- q: 휴업과 폐업의 차이는 무엇인가요?
  a: 휴업은 일시적으로 사업을 중단했다가 재개하는 경우이고, 폐업은 사업을 완전히 종료하는 경우입니다.
- q: 부가가치세 폐업신고도 함께 해야 하나요?
  a: 폐업신고 시 부가가치세법에 따른 폐업신고도 필요하면 함께 제출해야 합니다.
- q: 폐업 신고증이 없으면 어떻게 하나요?
  a: 신고증 분실·훼손 사유를 명시하면 신고증 없이도 신고할 수 있습니다.
