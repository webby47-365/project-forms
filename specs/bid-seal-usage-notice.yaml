id: bid-seal-usage-notice
title: 사용인감계 (입찰용)
category: public
subcategory: procure
tags: [사용인감계, 입찰사용인감, 입찰인감계, 사용인감신고서, 입찰참가인감]
summary: 입찰서와 계약서에 쓸 인감을 대표자와 다르게 사용할 때 사용자와 인영을 미리 알리는 입찰용 사용인감계입니다.
usage: >
  입찰이나 계약에서 대표자 인감 대신 별도의 사용인감을 쓰려면 발주처에 미리 그 인감을 알려야 합니다.
  상호·대표자와 사용인감의 사용자(대리인)를 적고 인영을 찍어 제출합니다. 사용 범위와 기간은 입찰 건과
  맞춰 적습니다. 제출 방식과 첨부 서류는 공고문 안내를 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 입찰 건 이름과 공고번호를 적습니다.
  - 업체 상호·대표자·사업자 정보를 적습니다.
  - 사용인감을 쓰는 사람과 사용 범위를 적습니다.
  - 사용인감을 찍고 대표자가 서명 또는 날인합니다.

faq:
  - q: 대표자 인감과 사용인감은 어떻게 다른가요?
    a: 대표자 인감은 신고된 인감이고, 사용인감은 업무용으로 따로 정해 쓰는 인감입니다. 제출 방식은 공고문을 확인하십시오.
  - q: 인감증명서도 같이 내야 하나요?
    a: 발주처에 따라 요구가 다르므로 공고문의 제출서류를 확인하십시오.
  - q: 사용 기간은 어떻게 정하나요?
    a: 입찰 건의 진행 기간에 맞춰 적는 것이 일반적입니다.

related: [gov-bid-form, bid-participation-poa, gov-bid-participation, seal-certificate-poa]

blocks:
  - type: doc_title
    text: 사 용 인 감 계
    spaced: true

  - type: subtitle
    text: 1. 입찰 건

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["입찰 건명", "", "", ""]
      - ["공고번호", "", "발주처", ""]
    sample_rows:
      - ["", "2026년 사무용품 구매", "", ""]
      - ["", "2026-000000", "", "○○시청"]

  - type: subtitle
    text: 2. 업체 정보

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["상호", "", "대표자", ""]
      - ["사업자등록번호", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "(주)한빛물산", "", "홍길동"]
      - ["", "000-00-00000", "", "02-123-4567"]
      - ["", "서울특별시 마포구 월드컵북로 50", "", ""]

  - type: subtitle
    text: 3. 사용인감 사용자

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["성명", "", "직위", ""]
      - ["생년월일", "", "연락처", ""]
      - ["사용 범위", "입찰서 제출 및 계약 체결", "", ""]
    sample_rows:
      - ["", "김서연", "", "과장"]
      - ["", "1990-03-15", "", "010-9876-5432"]
      - ["", "입찰서 제출 및 계약 체결", "", ""]

  - type: subtitle
    text: 4. 사용인감 인영

  - type: grid
    widths: [20, 40, 40]
    label_cols: [0]
    row_height_mm: 24
    rows:
      - ["사용인감", "(인)", "(인)"]
    sample_rows:
      - ["", "", ""]

  - type: para
    text: 위 인감을 위 입찰 건의 사용인감으로 사용하겠으므로 신고합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년   10 월    2 일

  - type: sign_line
    labels: ["대표자"]
    sample_names: [홍길동]

  - type: notice
    text: 제출 방식과 첨부 서류는 입찰 공고문을 확인하십시오.
