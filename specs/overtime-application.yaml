id: overtime-application
title: 연장·휴일근로 신청서
category: corp
subcategory: hr
tags: [연장근로 신청서, 휴일근로 신청서, 야근 신청서, 초과근무 신청서, 근로시간 신청]
summary: 연장·야간·휴일근로를 신청할 때 근로일별 시간과 업무내용을 기재하고 동의와 결재를 받는 신청서입니다.
usage: >
  법정 근로시간을 초과하는 연장근로, 밤 10시 이후의 야간근로, 휴일근로를 실시하기 전에
  신청하고 승인을 받는 서류입니다. 근로일별로 구분(연장·야간·휴일)과 시업·종업 시각,
  시간수, 업무내용을 표에 기재하고 합계 시간을 확인합니다. 연장·야간·휴일근로는 근로자의
  동의가 있어야 하며 1주 12시간을 초과할 수 없으므로 신청 전 한도를 확인하십시오.
  수당은 취업규칙이 정한 가산율에 따라 지급됩니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 소속·직위·성명과 사번, 연락처를 적습니다.
  - 근로일별로 연장·야간·휴일 구분을 표시합니다.
  - 시업·종업 시각과 시간수를 기재합니다.
  - 업무내용을 적고 합계 시간을 확인합니다.
  - 근로자 동의를 받은 뒤 결재를 올립니다.

faq:
  - q: 연장근로 한도는 얼마인가요?
    a: 1주 12시간을 초과할 수 없으므로 신청 전 한도를 확인하십시오.
  - q: 야간근로 기준 시간은 언제부터인가요?
    a: 통상 밤 10시부터 다음 날 오전 6시 이전까지를 야간근로로 봅니다.

