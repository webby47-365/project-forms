id: labor-contract-minor
title: 연소근로자 근로계약서
category: corp
subcategory: hr
tags: [연소근로자 근로계약서, 청소년 근로계약서, 미성년자 알바 계약서, 친권자 동의서, 근로계약서]
summary: 18세 미만 연소근로자를 채용할 때 친권자 동의와 근로시간 제한을 함께 기재하는 근로계약서입니다.
usage: >
  만 18세 미만 연소근로자(청소년 알바 포함)를 채용할 때 사용하는 근로계약서입니다.
  친권자 또는 후견인의 동의서를 반드시 첨부하고, 연소자의 가족관계기록사항에 관한
  증명서와 친권자 동의서를 사업장에 비치해야 합니다. 연소자의 근로시간은 1일 7시간,
  1주 35시간을 초과할 수 없으며 당사자 합의 시에도 1일 1시간, 1주 5시간을 넘겨 연장할
  수 없습니다. 야간·휴일근로는 원칙적으로 제한되므로 작성 전 관할 고용노동청 기준을
  확인하십시오.
source: law-standard
source_note: 근로기준법 제66조·제69조 및 제17조 반영
featured: false
target_pages: 2
series: labor-contract
series_name: 근로계약서
variant: 연소근로자
variant_rank: 5
version: 1
