id: gov-bid-form
title: 입찰서 (국가계약)
category: public
subcategory: procure
tags:
- 입찰
- 국가계약
- 입찰서
- 공사입찰
- 용역입찰
summary: 국가·지방자치단체의 공사·물품·용역 입찰에 참가할 때 제출하는 법정 입찰서입니다.
usage: '정부나 지자체의 공사, 물품구매, 용역 발주에 입찰할 때 작성하는 서류입니다. 입찰 공고번호, 건명, 입찰금액, 준공 예정일, 입찰자 정보를 기입합니다. 입찰금액이 100억원 이상인 경우 산출내역서를 별도로 첨부합니다. 구체적 입찰 유의사항과 계약조건은 발주기관의 입찰공고를 확인하십시오.

  '
source: law-standard
source_note: 국가를 당사자로 하는 계약에 관한 법률 시행규칙 별지 제5호서식
law_ref:
  law: 국가를 당사자로 하는 계약에 관한 법률 시행규칙
  form_no: 별지 제5호서식
  amended: '2016-09-23'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EA%B5%AD%EA%B0%80%EB%A5%BC+%EB%8B%B9%EC%82%AC%EC%9E%90%EB%A1%9C+%ED%95%98%EB%8A%94+%EA%B3%84%EC%95%BD%EC%97%90+%EA%B4%80%ED%95%9C+%EB%B2%95%EB%A5%A0+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0005&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
