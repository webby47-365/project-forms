id: business-transfer-contract
title: 영업양도양수계약서
category: public
subcategory: permit
tags: [영업양도양수계약서, 상가인수계약서, 권리금계약서, 영업권양도계약서, 가게인수인계계약]
summary: 상가·점포의 영업권과 시설·집기를 양도인에서 양수인에게 넘기는 조건을 정하는 영업양도양수계약서입니다.
usage: >
  식당·카페 등 영업 중인 점포를 통째로 인수하거나 넘길 때, 영업권(권리금)과 시설·집기,
  재고 포함 범위를 함께 정하는 계약서입니다. 임대차계약 승계, 영업신고·허가 명의변경
  절차가 계약과 별도로 필요하므로 일정을 맞춰 진행해야 합니다. 미수금·미지급금 등
  영업 관련 채권채무의 정산 기준을 특약사항에 명확히 적어 분쟁을 예방하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 양도인과 양수인의 인적사항을 적습니다.
  - 영업장 상호·소재지·업종과 인허가 번호를 적습니다.
  - 권리금과 시설·재고 포함 범위를 정합니다.
  - 계약금·중도금·잔금과 지급일을 적습니다.
  - 특약사항을 적고 양측이 서명 또는 날인합니다.

faq:
  - q: 임대차계약도 자동으로 승계되나요?
    a: 자동 승계되지 않으므로 임대인의 동의를 받아 임대차계약 명의를 별도로 변경해야 합니다.
  - q: 영업신고·허가 명의는 어떻게 바꾸나요?
    a: 계약서 등 서류를 갖춰 관할 관청에 영업자 지위승계신고를 별도로 신청해야 합니다.
  - q: 직원 고용도 함께 넘어가나요?
    a: 자동 승계되지 않으므로 승계 여부와 근로조건을 특약사항에 명확히 적어야 합니다.

related: [gov-business-closure-report, gov-business-registration-individual, commercial-lease-contract]

blocks:
  - type: doc_title
    text: 영업양도양수계약서
    spaced: false

  - type: para
    text: 양도인과 양수인은 아래 영업에 대하여 다음과 같이 양도양수계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 양도인 / 양수인

  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["양도인", "", "생년월일", "", "연락처", ""]
      - ["양수인", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "1978-04-02", "", "010-1234-5678"]
      - ["", "이수현", "", "1990-08-21", "", "010-9876-5432"]

  - type: subtitle
    text: 영업장 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["상호", "", "업종", ""]
      - ["소재지", "", "", ""]
      - ["영업(신고·허가)번호", "", "사업자등록번호", ""]
    sample_rows:
      - ["", "한빛분식", "", "일반음식점"]
      - ["", "서울특별시 마포구 월드컵북로 100 1층", "", ""]
      - ["", "제2024-000123호", "", "000-00-00000"]

  - type: subtitle
    text: 양도 조건 및 대금

  - type: grid
    widths: [18, 30, 18, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["권리금", "", "포함 범위", "시설·집기 / 재고 / 거래처 포함 여부"]
      - ["계약금", "", "지급일", ""]
      - ["잔금", "", "지급일(영업장 인도일)", ""]
    sample_rows:
      - ["", "금 20,000,000원 (금 이천만원)", "", "시설·집기, 재고 포함"]
      - ["", "2,000,000원", "", "2026-09-18 (계약 시)"]
      - ["", "18,000,000원", "", "2026-10-05"]

  - type: textbox
    hint: "미수금·미지급금 정산 기준, 직원 승계 여부, 임대차계약 승계 조건 등 특약사항을 적으십시오."
    height_mm: 22
    sample_text: 양도일 이전 발생한 공과금과 거래처 미지급금은 양도인이 정산하며, 양도일 이후 매출과 비용은 양수인에게 귀속한다.

  - type: para
    text: 위와 같이 계약을 체결하고 계약서 2부를 작성하여 각자 1부씩 보관한다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월   18 일

  - type: sign_line
    labels: ["양도인", "양수인"]
    sample_names: [홍길동, 이수현]

  - type: notice
    text: 임대차계약 승계와 영업자 지위승계신고 등 인허가 명의변경 절차는 관할 관청·임대인과 별도로 진행해야 합니다.
