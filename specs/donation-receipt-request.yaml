id: donation-receipt-request
title: 기부금 영수증 발급 요청서
category: public
subcategory: tax
tags: [기부금영수증, 기부금영수증발급, 연말정산기부금, 기부금확인, 영수증발급요청]
summary: 기부한 단체에 연말정산·세금 신고용 기부금 영수증 발급을 요청할 때 기부 내역과 수령 방법을 정리하는 요청서입니다.
usage: >
  기부한 뒤 연말정산이나 종합소득세 신고에 쓸 기부금 영수증이 필요할 때 기부 단체에 보내는 서식입니다.
  기부자 정보와 기부 일자·금액·종류, 필요한 연도와 받을 방법을 적고 서명합니다. 영수증을 발급할 수
  있는지와 필요한 확인 자료는 단체마다 다르므로 먼저 단체 안내를 확인하십시오. 본 서식은 요청 내용을
  정리하는 틀이며 법정 기부금 영수증 서식을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 기부자 성명과 연락처를 적습니다.
  - 기부 단체명과 기부 종류를 적습니다.
  - 기부한 날짜와 금액을 내역표에 적습니다.
  - 영수증이 필요한 연도와 받을 방법을 적고 서명합니다.
faq:
  - q: 이 요청서가 영수증인가요?
    a: 아닙니다. 영수증 발급을 요청하는 서류이며, 영수증은 기부 단체가 따로 발급합니다.
  - q: 발급에 확인 자료가 필요한가요?
    a: 단체마다 다릅니다. 이체 내역 같은 기부 사실 자료를 요구할 수 있으니 먼저 문의하십시오.
  - q: 어느 연도 영수증을 요청하나요?
    a: 공제를 받으려는 해에 기부한 내역을 기준으로 적고, 제출처 기준을 확인하십시오.
related: [gov-donation-receipt, year-end-tax-checklist, withholding-request, sponsorship-application]
blocks:
  - type: doc_title
    text: 기부금 영수증 발급 요청서
    spaced: false
  - type: subtitle
    text: 1. 기부자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "이메일", ""]
      - ["주소", "", "", ""]
    merges:
      - [2, 1, 2, 3]
    sample_rows:
      - ["", "홍길동", "", "1985-03-02"]
      - ["", "010-1234-5678", "", "hong@example.com"]
      - ["", "서울특별시 예시구 예시로 1", "", ""]
  - type: subtitle
    text: 2. 기부 내역
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["기부 단체", "", "기부 종류", ""]
    sample_rows:
      - ["", "예시복지재단", "", "정기 후원금"]
  - type: table
    widths: [10, 30, 30, 30]
    header: ["No", 기부일, 금액(원), 납부 방법]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2026-03-10", "100,000", "계좌이체"]
      - ["2", "2026-07-10", "100,000", "계좌이체"]
      - ["3", "2026-10-10", "100,000", "카드"]
  - type: subtitle
    text: 3. 영수증 요청 사항
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["필요 연도", "", "수령 방법", ""]
      - ["사용 목적", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "2026년", "", "이메일 발송"]
      - ["", "연말정산 제출용", "", ""]
  - type: para
    text: 위 기부 내역에 대한 기부금 영수증 발급을 요청합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월    2 일
  - type: sign_line
    label: 요청인
    sample_names: [홍길동]
  - type: notice
    text: 발급 가능 여부와 필요한 확인 자료는 기부 단체 안내를 확인하십시오.
