id: proposal-draft
title: 기안서
category: corp
subcategory: admin
tags: [기안서, 사안건의, 정책건의, 안건]
summary: 상급자 결재를 위해 업무 방안과 예산, 추진 일정 등을 정리한 기안서 양식입니다.
usage: >
  회사 정책 결정이나 주요 업무 추진을 위해 필요한 안건을 상급자에게 건의하는
  문서입니다. 기안 내용의 목적과 현황, 추진 방안, 기대 효과를 명확히 기재하고
  필요시 첨부자료를 함께 제출합니다. 담당자부터 대표까지 단계별 결재를 거쳐야 합니다.
source: original
featured: false
target_pages: 1
howto:
  - 기안일자와 기안부서, 기안자를 적습니다.
  - 안건명을 한 줄로 명확하게 씁니다.
  - 목적과 현황, 추진 방안을 순서대로 작성합니다.
  - 예산과 기대 효과를 정리하고 첨부자료를 준비합니다.
  - 담당자부터 결재선을 따라 순차 결재를 받습니다.

faq:
  - q: 첨부자료는 꼭 붙여야 하나요?
    a: 금액이 크거나 근거자료가 있는 안건은 첨부하는 것이 결재에 유리합니다.
  - q: 결재선은 누구까지 넣어야 하나요?
    a: 회사 결재 규정에 따라 다르며 통상 부서장부터 대표까지 단계별로 지정합니다.

related: [expense-approval, cooperation-request, official-letter, budget-plan]

blocks:
  - type: doc_title
    text: 기안서
    spaced: true
  - type: spacer
    height_pt: 6
  - type: grid
    widths: [14, 21, 14, 21, 14, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["기안일자", "", "기안부서", "", "기안자", ""]
      - ["안건명", "", "", "", "", ""]
    sample_rows:
      - ["", "2026-09-13", "", "총무팀", "", "홍길동"]
      - ["", "사내 전자결재 시스템 도입", "", "", "", ""]
  - type: subtitle
    text: 1. 안건 개요
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["현황", "", "문제점", ""]
      - ["추진근거", "", "", ""]
    sample_rows:
      - ["", "종이 결재 문서로 처리 중", "", "승인 지연·문서 분실 위험"]
      - ["", "2026년 업무 효율화 추진계획", "", ""]
  - type: subtitle
    text: 2. 추진 방안
  - type: textbox
    hint: "구체적인 추진 방법, 일정, 예산 등을 기재하십시오."
    height_mm: 30
    sample_text: 전자결재 시스템을 도입하여 2026년 11월부터 전 부서에 적용한다. 10월 중 업체 선정 및 계약을 완료하고, 11월 1일부터 시범 운영 후 단계적으로 확대한다.
  - type: subtitle
    text: 3. 기대 효과 및 예상 비용
  - type: textbox
    hint: "시행에 따른 기대 효과와 소요 예산을 구체적으로 기재하십시오."
    height_mm: 20
    sample_text: 결재 처리 기간 단축 및 문서 보관비용 절감이 예상된다. 도입 비용은 초기 구축비 300만원, 연간 유지보수비 60만원이다.
  - type: subtitle
    text: 결재
  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 1, 2, 3]
    row_height_mm: 12
    rows:
      - ["담당자 (인)", "팀장 (인)", "임원 (인)", "대표 (인)"]
