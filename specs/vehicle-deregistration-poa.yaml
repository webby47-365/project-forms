id: vehicle-deregistration-poa
title: 자동차 말소등록 위임장
category: public
subcategory: vehicle
tags: [자동차말소등록위임장, 폐차위임장, 말소등록대행위임장, 차량말소위임장, 폐차대행위임장]
summary: 폐차 등으로 자동차 말소등록을 대리인이나 폐차업체에 맡길 때 차량 정보와 말소 사유·위임 범위를 적는 위임장입니다.
usage: >
  차를 폐차하거나 수출·도난 등의 사유로 자동차 등록을 지워야 할 때, 소유자가 직접 처리하지 못하고
  폐차업체나 대리인에게 말소등록 절차를 맡길 때 쓰는 서류입니다. 차량번호와 차대번호, 말소 사유를
  정확히 적어야 대리인이 어느 차량의 어떤 절차를 처리하는지 구분됩니다. 말소등록에 필요한
  서류와 자동차 관련 세금·과태료 정산 등은 관할 지자체와 폐차업체 안내를 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 소유자의 성명·연락처를 적습니다.
  - 차량번호·차종·차대번호를 등록증과 맞춰 적습니다.
  - 말소 사유와 위임 범위를 표시합니다.
  - 대리인 정보를 적고 소유자가 서명 또는 날인합니다.

faq:
  - q: 폐차업체에 맡기면 위임장이 꼭 필요한가요?
    a: 업체가 대행하는 경우 위임장을 요구하는 것이 일반적이니 업체 안내를 먼저 확인하십시오.
  - q: 차대번호는 어디서 확인하나요?
    a: 자동차등록증에 적혀 있으니 등록증과 똑같이 옮겨 적습니다.
  - q: 저당이나 압류가 걸려 있어도 말소할 수 있나요?
    a: 제한이 걸려 있으면 절차가 달라질 수 있으니 관할 지자체나 폐차업체에 미리 문의하십시오.

related: [vehicle-registration-poa, gov-vehicle-transfer-registration, used-car-sale-contract, power-of-attorney]

