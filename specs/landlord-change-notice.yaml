id: landlord-change-notice
title: 임대인 변경 통지서
category: estate
subcategory: lease
tags: [임대인변경, 집주인변경, 양수통지, 임대인교체, 임대차통지]
summary: 임대 중인 집이나 상가의 소유자가 바뀌었을 때 새 임대인과 보증금·월세 지급 방법을 임차인에게 알리는 임대인 변경 통지서 양식입니다.
usage: >
  임대차 기간 중에 건물을 팔거나 넘겨서 임대인이 바뀌면 임차인에게 그 사실과 새 연락처, 입금 계좌를 알려야 합니다.
  기존 임대인과 새 임대인, 변경일, 보증금과 월세 승계 여부, 이후 월세 입금 계좌를 적습니다.
  임차인이 계약 내용이 그대로 이어지는지 확인할 수 있게 계약 정보를 함께 씁니다.
  권리 관계는 계약서와 등기 내용에 따르므로 필요하면 전문가나 관할 기관에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 임차인과 임차 물건의 주소를 적습니다.
  - 기존 임대인과 새 임대인의 성명, 연락처, 변경일을 적습니다.
  - 보증금과 월세, 계약 기간이 그대로 이어지는지 적습니다.
  - 새 입금 계좌를 적고 날짜와 서명을 합니다.
faq:
  - q: 임대인이 바뀌면 계약 조건도 바뀌나요?
    a: 보통 기존 계약 내용이 그대로 이어지는 것으로 봅니다. 달라지는 점이 있으면 합의 내용을 따로 적으십시오.
  - q: 통지서만 보내면 월세 계좌를 바꿔도 되나요?
    a: 임차인은 새 계좌가 맞는지 확인하고 싶을 수 있습니다. 새 임대인 명의 계좌인지 서로 확인하는 편이 안전합니다.
related: [lease-deposit-return-schedule-agreement, rent-due-date-change-agreement, lease-termination-notice, monthly-rent-receipt]
blocks:
  - type: doc_title
    text: 임대인 변경 통지서
    spaced: true
  - type: subtitle
    text: 1. 수신 (임차인)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["임차인", "", "연락처", ""]
      - ["임차 물건", "", "", ""]
    sample_rows:
      - ["", "박민준", "", "010-2345-6789"]
      - ["", "한빛시 새길로 10, 301호", "", ""]
  - type: subtitle
    text: 2. 임대인 변경 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["기존 임대인", "", "연락처", ""]
      - ["새 임대인", "", "연락처", ""]
      - ["변경일", "", "변경 사유", ""]
    sample_rows:
      - ["", "이수현", "", "010-3456-7890"]
      - ["", "김서연", "", "010-1234-5678"]
      - ["", "2026-11-01", "", "건물 매매"]
  - type: subtitle
    text: 3. 계약 승계 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["보증금", "", "월 차임", ""]
      - ["계약 기간", "", "승계 여부", ""]
      - ["입금 은행", "", "계좌 명의", ""]
      - ["계좌번호", "", "적용 시작", ""]
    sample_rows:
      - ["", "30,000,000원", "", "600,000원"]
      - ["", "2025-03-01 ~ 2027-02-28", "", "기존 조건 그대로"]
      - ["", "한빛은행", "", "김서연"]
      - ["", "000-000-000000", "", "2026-12월분부터"]
  - type: textbox
    hint: "기존 계약과 달라지는 점이나 임차인에게 알릴 사항이 있으면 적으십시오."
    height_mm: 22
    sample_text: "보증금과 월세, 계약 기간은 기존 계약서 그대로 이어지며 수리 요청은 새 임대인에게 하시면 됩니다."
  - type: date_line
    sample_text: 2026 년   11 월    7 일
  - type: sign_line
    labels: ["기존 임대인", "새 임대인"]
    sample_names: [이수현, 김서연]
  - type: notice
    text: 권리 관계는 계약서와 등기 내용을 기준으로 확인하십시오.
