id: vehicle-registration-poa
title: 차량 이전등록 위임장
category: public
subcategory: civil
tags: [차량이전등록위임장, 자동차명의이전위임장, 차량등록사업소위임장, 자동차이전등록, 차량위임장]
summary: 차량 소유권 이전등록·명의변경 절차를 대리인에게 맡길 때 차량 정보와 위임 범위를 적는 위임장입니다.
usage: >
  중고차 매매나 증여 등으로 차량 소유자가 바뀔 때, 본인이 직접 차량등록사업소(구청)를
  방문하기 어려우면 대리인에게 이전등록 신청을 맡기는 서류입니다. 차량번호·차대번호 등
  차량 정보를 정확히 적고, 위임 범위(이전등록 신청 및 서류 수령 등)를 구체적으로 한정하는
  것이 안전합니다. 양수인 정보도 함께 적어 두면 접수 담당자가 대조하기 쉽습니다. 필요
  서류와 수수료는 관할 차량등록사업소 안내를 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 위임인(양도인)의 인적사항을 적습니다.
  - 대리인의 인적사항을 정확히 적습니다.
  - 차량번호·차대번호 등 차량 정보를 적습니다.
  - 위임 범위와 양수인 정보를 적습니다.
  - 대리인이 위임장을 지참해 차량등록사업소를 방문합니다.

faq:
  - q: 인감증명서도 같이 내야 하나요?
    a: 이전등록 신청 시 인감증명서나 본인서명사실확인서를 요구할 수 있어 관할 등록사업소에 미리 확인하십시오.
  - q: 저당권이 설정된 차량도 위임할 수 있나요?
    a: 저당권 말소 절차가 먼저 필요할 수 있으므로 등록사업소에 처리 순서를 확인하는 것이 안전합니다.

related: [used-car-sale-contract, power-of-attorney, vehicle-maintenance-history]

blocks:
  - type: doc_title
    text: 차량 이전등록 위임장
    spaced: false
  - type: para
    text: 본인은 아래 사람을 대리인으로 정하여 차량 이전등록에 관한 권한을 위임합니다.
    align: center
    size: 10.5
  - type: subtitle
    text: 1. 위임인 (양도인)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "인감 날인", "(인감)"]
    sample_rows:
      - ["", "홍길동", "", "1985-03-11"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", ""]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "위임인과의 관계", ""]
    sample_rows:
      - ["", "박민준", "", "1988-11-02"]
      - ["", "서울특별시 마포구 월드컵북로 120", "", ""]
      - ["", "010-9876-5432", "", "동생"]
  - type: subtitle
    text: 3. 차량 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["차량번호", "", "차종", ""]
      - ["차대번호", "", "등록일자", ""]
    sample_rows:
      - ["", "12가3456", "", "승용(경형)"]
      - ["", "KMHXX00XXXX000000", "", "2021-05-14"]
  - type: subtitle
    text: 4. 위임 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["위임 범위", "이전등록 신청 및 관련 서류 수령", "", ""]
      - ["양수인 성명", "", "양수인 연락처", ""]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일", "", ""]
    sample_rows:
      - ["", "", "", ""]
      - ["", "이수현", "", "010-2345-6789"]
      - ["", "2026년 9월 13일 ~ 2026년 10월 13일", "", ""]
  - type: kv_list
    items:
      - "대리인은 위임 범위를 넘어 서류를 사용하거나 제3자에게 교부하지 않습니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."
  - type: para
    text: 위 위임 내용은 본인의 의사에 따른 것임을 확인합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월   13 일
  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 박민준]
  - type: notice
    text: 필요 서류와 수수료, 저당권 설정 여부에 따른 처리 순서는 관할 차량등록사업소 안내를 확인하십시오.
