id: vehicle-sale-cancellation-agreement
title: 자동차 매매 계약 해제 합의서
category: public
subcategory: vehicle
tags: [자동차매매해제, 중고차계약해제, 차량매매취소, 매매계약해제합의, 계약금반환]
summary: 이미 맺은 자동차 매매계약을 매도인과 매수인이 합의해 해제하고 대금 반환 방법을 적는 합의서입니다.
usage: >
  중고차나 개인 간 차량 거래에서 계약 후 이전등록 전에 거래를 없던 일로 하기로 했을 때
  합의 내용을 남기는 서식입니다. 원래 계약일과 차량 정보, 이미 오간 계약금·대금과 반환
  방법·기한을 적고 양쪽이 서명합니다. 이미 이전등록을 마쳤다면 원상회복 절차가 따로 필요하므로
  관할 기관에 확인하십시오. 본 서식은 합의 내용을 기록하는 틀이며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 매도인과 매수인의 성명과 연락처를 적습니다.
  - 원래 계약일과 차량번호, 차종을 적습니다.
  - 받은 금액과 반환할 금액, 반환 기한을 적습니다.
  - 인도한 서류·열쇠의 반환을 적고 양쪽이 서명합니다.
faq:
  - q: 이전등록 후에도 이 서식으로 되나요?
    a: 등록이 끝났다면 명의를 되돌리는 절차가 따로 필요합니다. 관할 기관에 확인하십시오.
  - q: 계약금은 얼마를 돌려받나요?
    a: 당사자가 합의해 적는 내용입니다. 위약금 여부도 함께 정해 특약란에 적어 두십시오.
  - q: 합의 후에도 분쟁이 생기면요?
    a: 반환 방법과 기한을 구체적으로 적어 두면 분쟁을 줄일 수 있습니다.
related: [used-car-payment-receipt, vehicle-delivery-confirmation, payment-confirmation, settlement-agreement]
blocks:
  - type: doc_title
    text: 자동차 매매 계약 해제 합의서
    spaced: false
  - type: para
    text: 매도인과 매수인은 아래 자동차 매매계약을 상호 합의하여 해제합니다.
    align: center
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["매도인", "", "연락처", ""]
      - ["매수인", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "김서연", "", "010-3456-7890"]
  - type: subtitle
    text: 2. 해제 대상 계약
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["계약일", "", "차량번호", ""]
      - ["차종", "", "매매대금", ""]
      - ["받은 금액", "", "반환 금액", ""]
    sample_rows:
      - ["", "2026-10-10", "", "12가 3456"]
      - ["", "중형 승용차", "", "1,500만 원"]
      - ["", "150만 원", "", "150만 원"]
  - type: subtitle
    text: 3. 반환 및 특약
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["반환 기한", "", "반환 방법", ""]
      - ["서류·열쇠", "", "", ""]
    sample_rows:
      - ["", "2026-11-05", "", "계좌 이체"]
      - ["", "인도 전이라 해당 없음", "", ""]
  - type: textbox
    hint: "위약금 여부, 비용 부담 등 합의한 내용을 적으십시오."
    height_mm: 22
    sample_text: "양 당사자는 본 합의로 계약이 해제됨을 확인하며, 위약금 없이 받은 금액을 반환하고 이후 서로 이의를 제기하지 않습니다."
  - type: date_line
    sample_text: 2026 년   10 월    28 일
  - type: sign_line
    labels: ["매도인", "매수인"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 이전등록이 끝난 경우 관할 기관과 절차를 확인하십시오.
