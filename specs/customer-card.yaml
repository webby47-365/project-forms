id: customer-card
title: 고객관리 카드
category: corp
subcategory: sales
tags: [고객관리카드, 거래처카드, 고객카드, 거래처관리, customer card]
summary: 거래처 기본정보와 거래 조건, 거래·상담 이력을 한 장으로 관리하는 고객관리 카드입니다.
usage: >
  신규 거래처를 등록하거나 기존 거래처 정보를 갱신할 때 작성하는 서식입니다. 상호·담당자
  등 기본정보와 결제조건·여신한도 등 거래 조건을 먼저 확정한 뒤, 거래와 상담이 발생할
  때마다 이력을 추가로 기재해 누적 관리합니다. 담당자 변경 시 인수인계 자료로도
  활용할 수 있습니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 상호와 담당자 등 거래처 기본정보를 적습니다.
  - 결제조건과 여신한도 등 거래 조건을 정합니다.
  - 거래나 상담이 있을 때마다 이력을 추가로 적습니다.
  - 정보가 바뀌면 그때그때 갱신해 최신 상태로 유지합니다.

faq:
  - q: 거래 이력은 얼마나 자세히 적나요?
    a: 날짜와 담당자, 상담 내용을 간단히 요약해 남기면 충분하며, 다음 담당자가 흐름을 파악할 수 있으면 됩니다.
  - q: 담당자가 바뀌면 새로 작성하나요?
    a: 새로 작성하지 말고 기존 카드를 그대로 인계해, 누적된 거래 이력이 끊기지 않도록 하십시오.

blocks:
  - type: doc_title
    text: 고객관리 카드

  - type: subtitle
    text: 1. 고객 기본정보

  - type: grid
    widths: [14, 26, 14, 20, 13, 13]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["상호", "", "대표자", "", "사업자등록번호", ""]
      - ["업종", "", "주소", "", "", ""]
      - ["전화", "", "이메일", "", "", ""]
      - ["담당자", "", "직위", "", "연락처", ""]
    merges:
      - [1, 3, 1, 5]
      - [2, 3, 2, 5]
    sample_rows:
      - ["", "(주)새길데이터", "", "박민준", "", "000-00-00000"]
      - ["", "도매 및 상품중개업", "", "서울시 강남구 테헤란로 120", "", ""]
      - ["", "02-123-4567", "", "contact@example.com", "", ""]
      - ["", "박민준", "", "팀장", "", "010-1234-5678"]

  - type: subtitle
    text: 2. 거래 조건

  - type: grid
    widths: [16, 24, 16, 24, 10, 10]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["결제조건", "", "여신한도", "", "할인율", ""]
      - ["거래개시일", "", "", "", "", ""]
    sample_rows:
      - ["", "월말 마감 익월 10일 지급", "", "3,000만원", "", "3%"]
      - ["", "2024-03-02", "", "", "", ""]

  - type: subtitle
    text: 3. 거래 이력

  - type: table
    widths: [16, 30, 14, 20, 20]
    header: [일자, 품목, 수량, 금액, 비고]
    empty_rows: 5
    row_height_mm: 7.5
    sample_rows:
      - ["2026-06-10", "서버 장비", "10대", "4,200만원", "분할 납품"]
      - ["2026-08-02", "유지보수 용역", "1건", "320만원", "연간 계약"]

  - type: subtitle
    text: 4. 상담 이력

  - type: table
    widths: [16, 16, 40, 28]
    header: [일자, 방식, 내용, 후속조치]
    empty_rows: 4
    row_height_mm: 7.5
    sample_rows:
      - ["2026-08-20", "방문", "차기 납품 일정 및 단가 협의", "견적서 9/1까지 발송"]
      - ["2026-09-05", "전화", "재고 부족 문의 응대", "대체 품목 안내"]

  - type: notice
    text: 본 카드에 기재된 개인정보는 거래 관리 목적 외에는 사용하지 않으며, 거래 종료 후 3년간 보관한 뒤 파기합니다.
