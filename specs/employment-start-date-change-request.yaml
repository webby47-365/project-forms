id: employment-start-date-change-request
title: 입사일 조정 요청서
category: personal
subcategory: career
tags: [입사일조정, 입사일변경, 입사일연기, 출근일조정, 입사승낙]
summary: 입사를 승낙한 뒤 사정이 생겨 출근 시작일을 늦추거나 당기고 싶을 때 희망일과 사유를 적어 회사에 보내는 요청서 양식입니다.
usage: >
  최종 합격 후 이전 직장 인수인계나 이사 일정 때문에 안내받은 입사일에 맞추기 어려울 때 쓰는 서식입니다.
  기존 입사일과 희망하는 입사일, 조정이 필요한 사유를 적고 전 직장 퇴사 예정일도 함께 밝히면 회사가 판단하기 쉽습니다.
  입사일은 근로계약과 보험 가입 일정에 영향을 줄 수 있으므로 회신으로 확정된 날짜를 문서로 남기십시오.
  요청한다고 반드시 받아들여지는 것은 아닙니다.
source: original
featured: false
target_pages: 1
howto:
  - 지원자 성명과 입사 예정 직무를 적습니다.
  - 안내받은 입사일과 희망하는 입사일을 적습니다.
  - 전 직장 퇴사 예정일 등 조정이 필요한 사유를 적습니다.
  - 서명해 인사 담당자에게 보내고 회신을 확인합니다.
faq:
  - q: 이미 입사 승낙서를 냈는데 요청해도 되나요?
    a: 요청은 할 수 있으나 받아들일지는 회사가 정합니다. 가능한 한 빨리 담당자에게 알리십시오.
  - q: 희망 입사일은 하나만 적어야 하나요?
    a: 가능한 범위를 함께 적으면 조율이 쉽습니다. 가장 빠른 날과 늦은 날을 적어 두십시오.
  - q: 확정된 입사일은 어떻게 남기나요?
    a: 회사의 회신 메일이나 근로계약서에 날짜가 적혀 있는지 확인하고 사본을 보관하십시오.
related: [job-offer-acceptance-letter, resignation-letter, labor-contract-standard, career-certificate-request]
blocks:
  - type: doc_title
    text: 입사일 조정 요청서
    spaced: false
  - type: subtitle
    text: 1. 요청자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["입사 회사", "", "입사 직무", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "(주)한빛커머스", "", "마케팅 담당"]
  - type: subtitle
    text: 2. 입사일 조정 내용
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["기존 입사일", "", "희망 입사일", ""]
      - ["전 직장 퇴사 예정일", "", "조정 가능 범위", ""]
    sample_rows:
      - ["", "2026-12-14", "", "2026-12-28"]
      - ["", "2026-12-24", "", "12-28 ~ 2027-01-04"]
  - type: subtitle
    text: 3. 조정 사유
  - type: textbox
    hint: "입사일 조정이 필요한 사정을 구체적으로 적으십시오."
    height_mm: 26
    sample_text: "전 직장의 인수인계가 12월 24일에 끝나 기존 입사일에 맞추기 어렵습니다. 희망일에 정상 출근하겠습니다."
  - type: para
    text: 위와 같이 입사일 조정을 요청드립니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   27 일
  - type: sign_line
    labels: ["요청자"]
    sample_names: [홍길동]
  - type: notice
    text: 확정된 입사일은 회사의 회신으로 확인하십시오.
