id: loan-agreement
title: 차용증 (금전소비대차계약서)
category: legal
subcategory: contract
tags: [차용증, 금전차용증서, 금전소비대차계약서, 돈 빌려줄 때, 지불각서]
summary: 차용금액·변제기일·이자율·변제방법과 기한이익 상실 조항을 담은 금전 차용증입니다.
usage: >
  개인 간 금전 거래 시 작성하는 서면 증거입니다. 차용금액은 반드시 한글과 숫자를 함께
  적고, 송금 기록(계좌이체)을 함께 남기는 것이 좋습니다. 이자는 약정이 없으면 청구하기
  어려우므로 이자율과 지급방법을 명시하십시오. 금액이 크면 공증 또는 내용증명 발송으로
  증거력을 보강하는 것이 안전합니다. 본 서식은 참고용이며 법적 효력은 사용자가 확인해야 합니다.
source: original
featured: true
featured_rank: 10
series: loan-note
series_name: 차용증
variant: 기본형
variant_rank: 1
target_pages: 2
variant_use: 개인 간 금전 대차의 기본 조건만 정할 때 씁니다.

howto:
  - 차용인과 대여인의 인적사항을 적습니다.
  - 차용금액을 한글과 숫자로 함께 적습니다.
  - 이자율과 변제기일, 변제방법을 정합니다.
  - 기한이익 상실 조항을 확인합니다.
  - 서명 날인 후 송금 기록을 남겨 둡니다.

faq:
  - q: 이자를 안 정하면 못 받나요?
    a: 약정이 없으면 이자를 청구하기 어려우므로 이자율과 지급방법을 미리 명시하십시오.
  - q: 공증은 꼭 받아야 하나요?
    a: 필수는 아니지만 금액이 크면 공증이나 내용증명으로 증거력을 보강하는 것이 안전합니다.

related: [payment-pledge, repayment-plan, certified-notice-loan, payment-order-application]

