  - type: article
    heading: 제1조 (대여 및 수령)
    lines:
      - "채권자는 위 차용금액을 채무자에게 대여하였고, 채무자는 이를 수령하였음을 확인한다."
  - type: article
    heading: 제2조 (변제기 및 변제방법)
    lines:
      - "채무자는 위 변제기일까지 위 차용금액과 이자를 채권자가 지정한 계좌로 송금하여 변제한다."
      - "분할변제하는 경우 매월      일에 금            원을 변제하고, 최종 변제기일은 위 변제기일로 한다."
  - type: article
    heading: 제3조 (이자)
    lines:
      - "이자는 위 이자율에 따라 계산하며, 약정한 지급방법에 따라 지급한다."
      - "이자율은 이자제한법이 정하는 최고이자율을 초과할 수 없으며, 초과분은 무효로 한다."
  - type: article
    heading: 제4조 (지연손해금)
    lines:
      - "채무자가 변제기일까지 변제하지 않을 경우 변제기일 다음 날부터 완제일까지 연            %의 지연손해금을 가산하여 지급한다."
  - type: article
    heading: 제5조 (기한이익의 상실)
    lines:
      - "채무자가 분할변제금을 2회 이상 연체한 경우, 또는 가압류·가처분·강제집행·파산신청을 받은 경우 채권자의 통보 없이 기한의 이익을 상실하고 잔액 전부를 즉시 변제한다."
  - type: article
