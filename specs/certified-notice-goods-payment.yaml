id: certified-notice-goods-payment
title: 내용증명 (물품대금 청구)
category: legal
subcategory: notice
tags: [내용증명, 물품대금청구, 물품대금, 대금독촉, 거래대금청구]
summary: 물품을 납품하고도 대금을 받지 못한 공급자가 상대방에게 미수 대금과 지급 기한을 밝혀 청구하는 내용증명 양식입니다.
usage: >
  물품을 공급했지만 약속한 날까지 대금을 받지 못한 공급자가 상대방에게 지급을 공식적으로 요구할 때 씁니다.
  거래한 물품과 납품일, 단가와 수량, 미수 금액을 표로 정리하고 합계를 정확히 적습니다.
  지급 기한과 입금 계좌를 분명히 밝힌 뒤 우체국 등기로 보내면 통지한 사실과 내용이 증거로 남습니다.
  기한까지 지급되지 않을 때의 대응은 사안마다 다르므로 필요하면 전문가에게 확인하십시오.
source: original
featured: false
target_pages: 1
series: certified-notice
series_name: 내용증명
variant: 물품대금 청구
variant_rank: 6
variant_use: 납품한 물품의 미수 대금을 청구할 때 씁니다.
howto:
  - 발신인(공급자)과 수신인(거래처) 정보를 적습니다.
  - 거래한 물품과 납품일, 수량, 금액을 표에 적습니다.
  - 합계와 지급 기한, 입금 계좌를 적습니다.
  - 3부를 출력해 우체국에서 등기로 발송합니다.
faq:
  - q: 거래명세서가 없어도 보낼 수 있나요?
    a: 보낼 수는 있지만 납품 사실을 보여 주는 명세서나 세금계산서를 함께 보관해 두는 편이 좋습니다.
  - q: 지급 기한은 며칠로 잡나요?
    a: 정해진 기간은 없습니다. 보통 수령일로부터 7일에서 14일 안팎으로 적는 경우가 많습니다.
  - q: 내용증명만으로 대금을 받을 수 있나요?
    a: 내용증명은 청구 사실을 남기는 문서입니다. 이후 절차는 사안에 따라 달라 전문가 확인이 필요합니다.
related: [small-claims-complaint, complaint-goods-payment, payment-due-extension-request, quotation]
