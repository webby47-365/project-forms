id: move-out-checklist
title: 퇴거 점검표
category: estate
subcategory: lease
tags: [퇴거점검표, 이사퇴거체크리스트, 원상복구확인서, 퇴거확인서, 이사정산표]
summary: 임차인이 이사 나갈 때 시설물 상태와 공과금·관리비 정산 항목을 임대인과 함께 확인하는 퇴거 점검표입니다.
usage: >
  임대차 계약이 끝나 이사를 나갈 때 입주 당시와 비교해 시설물 파손·오염 여부를 확인하고,
  관리비·공과금 정산 내역과 보증금에서 공제할 항목을 미리 정리해 두는 서식입니다. 입주
  점검표가 있다면 함께 대조하면 원상복구 범위를 놓고 다투는 일을 줄일 수 있습니다. 정산
  결과와 열쇠·카드키 반납 여부를 확인한 뒤 임대인과 임차인이 함께 서명해 각자 보관하십시오.
  정산액은 보증금 반환 시 근거 자료로 활용할 수 있습니다.
source: original
featured: false
target_pages: 1

howto:
  - 주소와 퇴거일 등 기본 정보를 적습니다.
  - 공간별 시설물 상태를 입주 당시와 비교해 확인합니다.
  - 관리비·공과금 정산 내역을 적습니다.
  - 보증금 공제 항목과 반환 예정액을 계산합니다.
  - 열쇠·카드키 반납을 확인하고 임대인·임차인이 서명합니다.

faq:
  - q: 입주 점검표가 없으면 못 쓰나요?
    a: 없어도 현재 상태를 있는 그대로 적고 사진을 남겨 두면 됩니다.
  - q: 공제 항목에 다툼이 있으면 어떻게 하나요?
    a: 우선 사실관계를 기록해 두고, 반환이 지연되면 보증금 반환 내용증명 등으로 대응하십시오.

related: [move-in-checklist, deposit-return-notice, monthly-rent-receipt]

blocks:
  - type: doc_title
    text: 퇴거 점검표
    spaced: false
  - type: subtitle
    text: 1. 기본 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["주소", "", "퇴거일", ""]
      - ["임대인", "", "연락처", ""]
      - ["임차인", "", "연락처", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100, 202동 1503호", "", "2026-11-30"]
      - ["", "김서연", "", "010-1234-5678"]
      - ["", "홍길동", "", "010-9876-5432"]
  - type: subtitle
    text: 2. 시설물 상태 확인
  - type: table
    widths: [15, 30, 25, 30]
    header: ["공간", "점검항목", "상태(양호/파손)", "비고"]
    empty_rows: 6
    row_height_mm: 7
    sample_rows:
      - ["거실", "벽지·바닥·창문", "양호", ""]
      - ["주방", "싱크대·타일·후드", "파손", "싱크대 상판 스크래치 발생"]
      - ["욕실", "배수·타일·환풍기", "양호", ""]
      - ["침실", "벽지·콘센트·창문", "양호", ""]
  - type: subtitle
    text: 3. 공과금·관리비 정산
  - type: table
    widths: [30, 30, 40]
    header: ["항목", "금액", "비고"]
    empty_rows: 4
    row_height_mm: 7
    sample_rows:
      - ["관리비 미납액", "35,000원", "10월분"]
      - ["전기요금", "18,000원", "검침일 기준 정산"]
      - ["수리비 공제", "40,000원", "싱크대 상판 보수"]
  - type: subtitle
    text: 4. 보증금 정산 및 반환
  - type: grid
    widths: [22, 28, 22, 28]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["보증금", "", "공제 합계", ""]
      - ["반환 예정액", "", "반환 예정일", ""]
    sample_rows:
      - ["", "50,000,000원", "", "93,000원"]
      - ["", "49,907,000원", "", "2026-12-05"]
  - type: subtitle
    text: 5. 확인
  - type: kv_list
    items:
      - "열쇠·카드키·주차카드를 모두 반납했습니다."
      - "위 점검 및 정산 내용에 이의가 없습니다."
  - type: date_line
    sample_text: 2026 년   11 월   30 일
  - type: sign_line
    labels: ["임대인", "임차인"]
    sample_names: [김서연, 홍길동]
  - type: notice
    text: 정산 결과는 보증금 반환의 참고 자료이므로 사진과 함께 보관하고, 반환이 지연되면 내용증명 등으로 대응하십시오.
