id: nda
title: 비밀유지계약서 (NDA)
category: legal
subcategory: contract
tags: [NDA, 비밀유지, 기밀계약, 보안계약, 영업비밀]
summary: 비밀정보의 범위·용도·유지의무와 위반 시 책임을 정하는 비밀유지계약서 양식입니다.
usage: >
  기술, 사업계획, 고객정보, 영업비밀 등을 공유받는 상대방과 체결하여 정보 유출을
  방지합니다. 비밀정보의 정의를 최대한 구체적으로 해야 나중에 분쟁을 줄일 수 있습니다.
  특히 NDA는 유효기간이 중요하므로 필요 기간보다 길게 설정하는 것이 좋습니다.
  협상 과정에서 먼저 NDA를 체결한 후 본계약을 진행하는 것이 일반 관행입니다.
  본 서식은 참고용이며 법적 효력과 적합성은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 비밀유지계약서
  - type: para
    text: 아래 당사자는 다음과 같이 비밀유지계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["공개당사자", "성명/회사명", "", "생년월일/사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
      - ["수신당사자", "성명/회사명", "", "생년월일/사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "(주)새길데이터", "", "000-00-00000"]
      - ["", "", "서울특별시 강남구 테헤란로 50", "", "010-9876-5432"]
  - type: subtitle
    text: 계약 내용
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["유효기간", "", "계약일자", ""]
    sample_rows:
      - ["", "2026-09-13 ~ 2028-09-12", "", "2026-09-13"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 공개당사자가 수신당사자에게 비밀정보를 공개하되, 수신당사자가 해당 정보의 기밀성을 보호하도록 의무지우기 위한 것이다."
  - type: article
    heading: 제2조 (비밀정보의 정의)
    lines:
      - "본 계약에서 '비밀정보'란 공개당사자가 수신당사자에게 공개하는 기술, 사업계획, 고객 정보, 영업비밀, 및 기타 정보로서 다음의 조건을 모두 충족하는 정보를 말한다:"
      - "① 공개당사자가 비밀정보임을 명시적으로 표시했거나, 합리적인 관점에서 비밀성이 명백한 정보"
      - "② 공개당사자가 비밀유지에 노력한 정보"
      - "③ 비공개 정보로서 공개당사자의 경쟁상 이익에 관한 정보"
  - type: article
    heading: 제3조 (비밀유지의무)
    lines:
      - "수신당사자는 본 계약의 유효기간 동안 비밀정보를 제3자에게 공개하지 않으며, 비밀정보의 보호에 합리적인 노력을 기울인다."
      - "수신당사자는 비밀정보를 본 계약의 목적 범위 내에서만 사용한다."
      - "수신당사자는 필요최소한의 임직원·수급인에게만 비밀정보를 공개할 수 있으며, 그들에게도 동일한 비밀유지의무를 부과해야 한다."
  - type: article
    heading: 제4조 (예외사유)
    lines:
      - "다음의 경우 비밀정보는 비밀유지의 대상이 되지 않는다:"
      - "① 공개 당시 이미 공개되어 있던 정보"
      - "② 공개당사자의 제3자에 대한 의무 없이 공개되어 있는 정보"
      - "③ 수신당사자가 공개 전부터 보유하고 있던 정보 (서면으로 증명되어야 함)"
      - "④ 법령·행정명령·법원 판결에 의해 공개할 수밖에 없는 정보"
  - type: article
    heading: 제5조 (사용 제한)
    lines:
      - "수신당사자는 비밀정보를 본 계약에서 정한 목적 범위를 벗어나 사용할 수 없다."
      - "수신당사자가 비밀정보를 기초로 새로운 제품·서비스·저작물 등을 개발한 경우, 그 개발물에 대한 권리는 수신당사자에게 귀속하되, 비밀정보 자체는 공개당사자에게 귀속한다."
  - type: article
    heading: 제6조 (자료의 반환·폐기)
    lines:
      - "본 계약 종료 시 수신당사자는 공개당사자의 요구에 따라 비밀정보와 그 사본을 반환하거나 안전하게 폐기한다."
      - "다만 법령상 보관 의무가 있는 경우는 그러하지 아니한다."
  - type: article
    heading: 제7조 (유효기간)
    lines:
      - "본 계약의 유효기간은 위 유효기간에 따른다."
      - "계약 종료 후에도 비밀유지의무는 유효기간 종료 후 3년간 계속된다."
  - type: article
    heading: 제8조 (위반 시 손해배상)
    lines:
      - "수신당사자가 본 계약의 비밀유지의무를 위반하여 공개당사자에게 손해를 입힌 경우, 그 손해를 배상한다."
      - "손해배상액은 입증된 실제 손해액으로 한다."
      - "공개당사자가 비밀유지의무 위반으로 인한 손해의 입증에 어려움을 겪는 경우, 법원의 판결에 따라 손해배상액이 결정될 수 있다."
  - type: article
    heading: 제9조 (관할법원)
    lines:
      - "본 계약에 관한 분쟁은 공개당사자의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: spacer
    height_pt: 8
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["공개당사자", "수신당사자"]
    sample_names: [(주)한빛커머스, (주)새길데이터]
  - type: notice
    text: 본 계약은 참고용이며 당사자의 특정 상황에 맞게 조정·수정하여야 합니다. 국제거래나 복잡한 사안의 경우 변호사와 상담하여 계약서를 작성하시기 바랍니다.
