id: certified-notice-wage
title: 내용증명 (임금체불 청구)
category: legal
subcategory: notice
tags: [내용증명, 임금체불청구, 임금미지급, 체불임금, 내용증명서식]
summary: 근로자가 사업주에게 미지급된 임금과 퇴직금 등을 구체적으로 밝혀 지급을 요구하는 내용증명 양식입니다.
usage: >
  근로를 제공하였음에도 임금이나 퇴직금, 수당을 받지 못한 근로자가 사업주에게 지급을 공식적으로
  요구할 때 사용하는 통지서입니다. 근무한 사업장과 근로기간, 직위, 월 임금을 먼저 밝히고
  체불된 항목과 기간, 금액을 구분하여 합계를 정확히 기재합니다. 구체적인 지급 기한을 명시하고
  우체국 등기로 발송하면 통지 사실에 대한 증거가 남습니다. 기한까지 지급되지 않으면 고용노동부에
  진정을 제기하는 등 별도 절차를 검토할 수 있습니다.
source: original
featured: false
target_pages: 1
series: certified-notice
series_name: 내용증명
variant: 임금체불
variant_rank: 5
version: 1

variant_use: 임금·퇴직금 등 체불된 금품 지급을 요구할 때 씁니다.

howto:
  - 발신인과 수신인(사업주) 정보를 적습니다.
  - 근무한 사업장과 근로기간, 월 임금을 밝힙니다.
  - 체불된 항목과 금액을 구분해 합계를 냅니다.
  - 지급 기한을 명시하고 등기우편으로 발송합니다.

faq:
  - q: 기한까지 지급하지 않으면 어떻게 하나요?
    a: 고용노동부에 진정을 제기하거나 소액사건심판 등 별도 법적 절차를 검토할 수 있습니다.
  - q: 반드시 등기로 보내야 하나요?
    a: 내용증명은 보낸 사실과 내용을 증명하기 위한 것이므로 우체국 등기로 발송해야 합니다.
created_by: agent
status: published

related: [labor-contract-standard, payslip, severance-calculation, small-claims-complaint]

blocks:
  - type: doc_title
    text: 내용증명
    spaced: true

  - type: subtitle
    text: 발신인
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]

  - type: subtitle
    text: 수신인
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "(주)한빛커머스 (대표 김서연)", "", "02-1234-5678"]
      - ["", "서울특별시 영등포구 여의대로 10", "", ""]

  - type: subtitle
    text: 1. 근로 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사업장", "", "직위", ""]
      - ["근로기간", "", "월 임금", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "마케팅팀 사원"]
      - ["", "2025-01-06 ~ 2026-03-31", "", "금 2,500,000원"]

  - type: subtitle
    text: 2. 체불 내역
  - type: table
    widths: [25, 35, 40]
    header: [구분, 기간, 금액]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["임금", "2026-02", "금 2,500,000원"]
      - ["임금", "2026-03", "금 2,500,000원"]
      - ["퇴직금", "2026-03", "금 1,200,000원"]

  - type: grid
    widths: [70, 30]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["합계", "금                                원정(₩                       )"]
    sample_rows:
      - ["", "금 6,200,000원(₩6,200,000)"]

  - type: subtitle
    text: 3. 통지 내용
  - type: textbox
    hint: "근로 제공 사실과 임금·퇴직금을 지급받지 못한 경위를 기재하십시오."
    height_mm: 25
    sample_text: 발신인은 위 사업장에서 근무하였음에도 위 체불 내역과 같이 임금 및 퇴직금을 지급받지 못하였습니다. 수신인은 근로기준법에 따른 임금 지급 의무를 이행하지 않고 있습니다.

  - type: subtitle
    text: 4. 요구 사항 및 이행 기한
  - type: textbox
    hint: "요구하는 사항과 구체적인 이행 기한을 명시하십시오."
    height_mm: 20
    sample_text: 본 통지서를 수령한 날로부터 14일 이내에 위 체불 임금 및 퇴직금 합계 6,200,000원을 지급하여 주시기 바랍니다.

  - type: para
    text: 위 기한까지 지급되지 않을 경우 고용노동부 진정 등 법적 절차를 진행할 수 있음을 알려드립니다.
    align: center
    size: 10.5

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    label: 발신인
    sample_names: [홍길동]

  - type: notice
    text: 본 내용증명은 우체국 창구에서 발신인용·수신인용·우체국 보관용 3부를 작성하여 제출합니다.
  - type: notice
    text: 임금체불에 대하여는 고용노동부에 진정을 제기하는 별도 절차가 있으며, 구체적인 대응 방법은 고용노동부 또는 법률 전문가에게 확인하십시오.
