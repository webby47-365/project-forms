id: event-safety-pledge
title: 행사 참가 안전 서약서
category: public
subcategory: consent
tags: [안전서약서, 행사안전서약, 참가서약서, 안전수칙동의, 현장체험서약]
summary: 행사나 현장 활동에 참가하는 사람이 주최 측 안전수칙을 지키겠다고 서약하는 행사 참가 안전 서약서 양식입니다.
usage: >
  체육대회·야외 행사·현장 체험처럼 안전수칙이 필요한 행사에서 참가자에게 받는 서약서입니다.
  행사 정보와 참가자 정보를 적고 주최 측이 정한 수칙을 읽은 뒤 지키겠다는 항목에 표시하고 서명합니다.
  미성년자는 보호자 동의서를 함께 받으십시오. 수칙 내용은 행사 성격에 맞게 고쳐 쓰며, 책임 범위는 별도 약관이나 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 행사명과 일시, 장소를 적습니다.
  - 참가자 성명과 연락처를 적습니다.
  - 안전수칙을 읽고 지킬 항목에 표시합니다.
  - 서약 날짜를 적고 서명합니다.
faq:
  - q: 안전수칙은 어떻게 정하나요?
    a: 행사 성격에 맞게 주최 측이 정합니다. 아래 예시 항목을 고쳐 쓰면 됩니다.
  - q: 미성년자도 직접 서명하나요?
    a: 보호자 동의서를 따로 받는 편이 안전합니다. 미성년자 활동 동의서를 함께 쓰십시오.
related: [minor-activity-consent, event-application, event-plan, event-photo-consent]
blocks:
  - type: doc_title
    text: 행사 참가 안전 서약서
    spaced: false
  - type: subtitle
    text: 1. 행사 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["행사명", "", "주최", ""]
      - ["일시", "", "장소", ""]
    sample_rows:
      - ["", "가을 체육대회", "", "한빛물산 총무팀"]
      - ["", "2026-11-20 10:00", "", "시민운동장"]
  - type: subtitle
    text: 2. 참가자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "소속", ""]
      - ["연락처", "", "비상 연락처", ""]
    sample_rows:
      - ["", "박민준", "", "영업지원팀"]
      - ["", "010-1234-5678", "", "010-9876-5432"]
  - type: subtitle
    text: 3. 안전수칙 서약
  - type: kv_list
    items:
      - "□ 주최 측의 안내와 진행 요원의 지시를 따르겠습니다."
      - "□ 음주 상태에서 활동에 참여하지 않겠습니다."
      - "□ 몸 상태가 좋지 않으면 즉시 알리고 활동을 멈추겠습니다."
      - "□ 지정된 구역과 시간을 지키고 위험한 행동을 하지 않겠습니다."
      - "□ 수칙을 어겨 생긴 문제는 주최 측 안내에 따르겠습니다."
  - type: para
    text: 위 안전수칙을 읽고 충분히 이해했으며 성실히 지킬 것을 서약합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   20 일
  - type: sign_line
    labels: ["서약자"]
    sample_names: [박민준]
  - type: notice
    text: 수칙은 행사 성격에 맞게 고쳐 쓰고, 책임 범위는 주최 측 안내를 확인하십시오.
