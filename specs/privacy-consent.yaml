id: privacy-consent
title: 개인정보 수집·이용 동의서
category: public
subcategory: consent
tags: [개인정보, 동의서, 개인정보 보호, 수집·이용 동의, 정보통신]
summary: 개인정보 보호법에 따라 고객 개인정보 수집·이용 목적과 항목, 보유기간, 거부권 등을 명시하는 동의서입니다.
usage: >
  회사나 기관이 고객의 개인정보를 수집할 때 반드시 제출받아야 하는 법정 양식입니다.
  수집 목적, 항목, 보유기간을 명확히 기재하고, 필수·선택 항목을 구분하여 각각 동의/미동의를 받아야 합니다.
  제3자 제공과 위탁이 있으면 별도 동의 칸을 두어야 하며, 동의 거부 시 불이익도 명시합니다.
source: original
featured: false
series: privacy-consent
series_name: 개인정보 동의서
variant: 기본형
variant_rank: 1
target_pages: 2

variant_use: 고객 개인정보를 수집할 때 기본으로 쓰는 표준 동의서입니다.

howto:
  - 수집 목적과 수집 항목을 적습니다.
  - 보유 및 이용 기간을 명시합니다.
  - 필수·선택 항목을 구분해 동의 여부를 표시합니다.
  - 제3자 제공이나 위탁이 있으면 별도로 동의를 받습니다.

faq:
  - q: 선택 항목에 동의하지 않으면 불이익이 있나요?
    a: 선택 항목 미동의를 이유로 불이익을 주어서는 안 되며, 이를 동의서에도 명시해야 합니다.
  - q: 보유기간이 지나면 어떻게 하나요?
    a: 목적 달성 후 별도 규정이 없다면 지체 없이 파기하는 것이 원칙입니다.

related: [event-application, survey-consent, portrait-rights-consent, guardian-consent]

