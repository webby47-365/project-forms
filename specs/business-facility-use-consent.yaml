id: business-facility-use-consent
title: 영업시설 사용동의서
category: public
subcategory: permit
tags: [영업시설사용동의서, 건물주동의서, 영업신고동의서, 시설사용동의, 임대인동의서]
summary: 임차인이 건물의 일부 또는 전부를 특정 업종의 영업장으로 사용하는 데 건물주(임대인)가 동의함을 확인하는 동의서입니다.
usage: >
  식당·미용실 등 인허가·신고가 필요한 업종을 새로 시작할 때, 임대차계약서만으로 영업 용도
  사용이 불분명하면 관할 관청이 건물주의 사용동의를 별도로 요구하는 경우가 있습니다.
  건물 소재지와 사용 목적(업종)을 구체적으로 적어 임대차계약의 용도와 실제 신고할
  업종이 일치하는지 담당 부서가 확인할 수 있도록 합니다. 공동소유 건물은 소유자 전원의
  동의가 필요할 수 있으니 미리 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 건물주(소유자)와 사용자(임차인)의 인적사항을 적습니다.
  - 건물 소재지와 사용 부분(층·호수 등)을 적습니다.
  - 사용 목적(업종)과 동의 기간을 적습니다.
  - 건물주가 서명 또는 날인합니다.

faq:
  - q: 임대차계약서가 있으면 이 동의서는 필요 없나요?
    a: 계약서의 용도 항목이 신고 업종과 다르거나 명확하지 않으면 관할 관청이 별도 동의서를 요구할 수 있습니다.
  - q: 건물주가 여러 명이면 어떻게 하나요?
    a: 공동소유인 경우 소유자 전원의 동의가 필요할 수 있어 인적사항과 서명란을 나누어 작성하십시오.
  - q: 동의 기간은 임대차 기간과 같아야 하나요?
    a: 대부분 임대차 기간과 맞추지만, 다르게 정할 사정이 있으면 그 기간을 별도로 적으면 됩니다.

related: [commercial-lease-contract, gov-food-business-report, business-transfer-contract]

blocks:
  - type: doc_title
    text: 영업시설 사용동의서
    spaced: false

  - type: para
    text: 건물주는 아래 사용자가 다음 건물을 영업장으로 사용하는 데 동의합니다.
    align: center
    size: 10.5

  - type: subtitle
    text: 1. 건물주 / 사용자

  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["건물주", "", "생년월일", "", "연락처", ""]
      - ["사용자", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "1972-03-11", "", "010-1234-5678"]
      - ["", "홍길동", "", "1990-08-21", "", "010-9876-5432"]

  - type: subtitle
    text: 2. 건물·사용 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
    rows:
      - ["건물 소재지", "", "", ""]
      - ["사용 부분", "", "사용 목적(업종)", ""]
      - ["동의 기간", "", "", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100 1층 101호", "", ""]
      - ["", "1층 101호 전체(66㎡)", "", "일반음식점"]
      - ["", "2026.10.1~2028.9.30", "", ""]

  - type: subtitle
    text: 3. 동의 내용

  - type: kv_list
    items:
      - "건물주는 위 건물을 사용자가 위 사용 목적의 영업장으로 사용하는 데 동의한다."
      - "사용자는 영업신고·허가 절차에 이 동의서를 첨부할 수 있다."
      - "동의 기간이 끝나거나 임대차계약이 종료되면 이 동의의 효력도 함께 소멸한다."

  - type: para
    text: 위와 같이 사용에 동의하며 본 동의서를 관할 관청에 제출합니다.
