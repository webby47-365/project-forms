id: vehicle-maintenance-history
title: 자동차 관리이력서
category: legal
subcategory: notice
tags: [자동차관리이력서, 차량관리이력서, 정비이력, 자동차이력서, 중고차이력, vehicle history]
summary: 차량 기본정보와 정비·소모품 교체·사고 이력을 정리해 중고차 매매 시 관리 상태를 증명하는 자동차 관리이력서입니다.
usage: >
  중고차를 팔 때 그동안의 관리 상태를 구매자에게 보여주기 위해 작성하는 서류입니다.
  차량번호·차대번호로 차량을 특정하고, 정비·점검 내역을 날짜와 주행거리 순으로 적어야
  신뢰를 줄 수 있습니다. 사고나 침수 이력이 있다면 감추지 말고 사실대로 적어야
  매매 후 분쟁을 막을 수 있습니다. 이 서류는 매도인이 작성하는 참고 자료이며,
  정확한 사고·침수 이력은 보험개발원 카히스토리 등 공식 자료로 별도 확인해야 합니다.
source: original
featured: false
target_pages: 1
from_request: true

howto:
  - 차량번호와 차종, 연식, 주행거리 등 기본정보를 적습니다.
  - 정비·점검 이력을 날짜순으로 빠짐없이 적습니다.
  - 사고·침수 등 특이 이력이 있으면 사실대로 적습니다.
  - 작성일과 소유자 서명을 마지막에 적습니다.

faq:
  - q: 정비 내역이 기억나지 않으면 어떻게 하나요?
    a: 정비업체 영수증이나 보증서를 찾아 확인한 뒤 적고, 확인이 어려운 항목은 비워 두십시오.
  - q: 사고 이력은 꼭 적어야 하나요?
    a: 사실대로 적어야 하며, 허위로 기재하면 매매 후 분쟁의 원인이 될 수 있습니다.
  - q: 이 서식만으로 사고 이력이 증명되나요?
    a: 참고 자료일 뿐이며, 정확한 이력은 보험개발원 카히스토리 등에서 별도로 확인해야 합니다.

related: [used-car-sale-contract, vehicle-log, power-of-attorney]

blocks:
  - type: doc_title
    text: 자동차 관리이력서
    spaced: true
  - type: spacer
    height_pt: 4
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["차량번호", "", "차종(모델)", ""]
      - ["연식", "", "차대번호", ""]
      - ["최초등록일", "", "현재 주행거리", ""]
      - ["소유자", "", "연락처", ""]
    sample_rows:
      - ["", "12가 3456", "", "아반떼 CN7"]
      - ["", "2021년식", "", "KMHXX00XXXX000000"]
      - ["", "2021-03-15", "", "68,000km"]
      - ["", "홍길동", "", "010-1234-5678"]
  - type: subtitle
    text: 정비·소모품 교체 이력
  - type: table
    widths: [15, 15, 40, 20, 10]
    header: ["날짜", "주행거리(km)", "정비·점검 내용", "정비업체", "비용"]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["2023-04-10", "32,000", "엔진오일·필터 교체", "현대오토큐 강남점", "80,000"]
      - ["2024-06-22", "51,000", "타이어 4개 교체", "한국타이어 대리점", "520,000"]
      - ["2025-03-05", "64,500", "정기점검·브레이크 패드 교체", "현대오토큐 강남점", "150,000"]
  - type: subtitle
    text: 사고·침수 이력
  - type: table
    widths: [15, 15, 45, 25]
    header: ["날짜", "구분", "내용", "보험처리 여부"]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["2022-11-08", "경미사고", "후방 주차 중 범퍼 경미 접촉", "자차보험 처리"]
  - type: textbox
    hint: "기타 참고사항 — 튜닝·개조 여부, 리콜 이행 여부, 옵션 변경 등을 적으십시오."
    height_mm: 18
    sample_text: 순정 상태이며 별도 튜닝·개조 이력 없음. 리콜 대상 사항은 모두 이행을 완료함.
  - type: para
    text: 위 기재사항은 사실과 다름이 없음을 확인합니다.
    align: center
    size: 11
    space_after: 2
  - type: date_line
    sample_text: 2026 년    9 월    14 일
  - type: sign_line
    label: 작성자(소유자)
  - type: notice
    text: 정확한 사고·침수 이력은 보험개발원 카히스토리 등 공식 자료로 별도 확인하시기 바랍니다.
