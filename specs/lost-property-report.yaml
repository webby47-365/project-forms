id: lost-property-report
title: 분실물 신고서
category: personal
subcategory: life
tags: [분실물, 분실신고, 분실물신고서, 물건분실, 유실물]
summary: 물건을 잃어버린 장소와 시간, 물건의 특징과 연락처를 적어 시설 관리처나 분실물 센터에 내는 분실물 신고서 양식입니다.
usage: >
  지하철·상가·학교·숙소 등에서 물건을 잃어버렸을 때 담당처에 찾아 달라고 요청하는 서식입니다.
  분실한 날짜와 장소, 물건의 종류·색상·특징을 구체적으로 적을수록 찾을 가능성이 높아집니다.
  지갑이나 카드처럼 금융 정보가 있는 물건은 카드사 분실 신고를 따로 해야 합니다. 이 서식은
  접수 요청서일 뿐 반환 여부와 절차는 담당처 규정을 따르므로 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신고인 이름과 연락처를 적습니다.
  - 잃어버린 날짜와 시간, 장소를 최대한 구체적으로 적습니다.
  - 물건의 종류와 색상, 특징을 적습니다.
  - 찾으면 연락받을 방법을 적고 서명합니다.
faq:
  - q: 카드나 신분증을 잃어버렸을 때도 이걸 쓰나요?
    a: 이 서식과 별개로 카드사와 발급 기관에 분실 신고를 먼저 하십시오. 이 서식은 물건 찾기 요청용입니다.
  - q: 정확한 장소를 모르면 어떻게 적나요?
    a: 마지막으로 본 곳과 이동 경로를 함께 적으면 담당자가 찾는 범위를 좁힐 수 있습니다.
related: [gov-id-card-loss-report, item-loan-confirmation]
blocks:
  - type: doc_title
    text: 분실물 신고서
    spaced: true
  - type: subtitle
    text: 1. 신고인
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["이메일", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "박민준", "", "010-1234-5678"]
      - ["", "minjun@example.com", "", ""]
  - type: subtitle
    text: 2. 분실 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["분실 일시", "", "분실 장소", ""]
      - ["물건 종류", "", "색상·크기", ""]
      - ["물건 특징", "", "", ""]
    merges:
      - [2, 1, 2, 3]
    sample_rows:
      - ["", "2026-11-03 18:30경", "", "새길역 3번 출구 승강장"]
      - ["", "검은색 가죽 지갑", "", "검정 · 손바닥 크기"]
      - ["", "안쪽에 파란색 메모지가 끼워져 있음", "", ""]
  - type: textbox
    hint: "마지막으로 본 곳과 이동 경로, 그 밖의 참고 사항을 적으십시오."
    height_mm: 26
    sample_text: "퇴근길에 승강장 의자에 앉았다가 일어나면서 두고 내린 것으로 보입니다. 열차는 18시 40분발입니다."
  - type: date_line
    sample_text: 2026 년   11 월    4 일
  - type: sign_line
    labels: ["신고인"]
    sample_names: [박민준]
  - type: notice
    text: 카드·신분증은 발급 기관에 분실 신고를 따로 하십시오.
