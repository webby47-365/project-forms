id: real-estate-sale-contract
title: 부동산 매매계약서
category: estate
subcategory: lease
tags: [부동산매매계약서, 아파트매매계약, 토지매매계약, 매매계약서]
summary: 부동산의 표시·매매대금 지급일정과 소유권 이전·제한물권 말소 조항을 담은 매매계약서입니다.
usage: >
  주택·토지·상가를 매매할 때 사용합니다. 계약 전 등기부등본으로 소유자와 근저당·가압류 등
  제한물권을 반드시 확인하고, 잔금일에 이를 말소하는 조건을 계약서에 명시해야 합니다.
  계약금 배액 상환으로 해제할 수 있는 시점, 중도금 지급 이후의 해제 제한, 취득세와
  양도소득세의 부담 주체를 분명히 해 두십시오. 잔금과 동시에 소유권이전등기를 신청하는 것이
  원칙이며, 등기 서류 목록을 특약에 적어두면 잔금일 혼선을 막을 수 있습니다. 본 서식은
  참고용이며 세금과 법적 효력은 전문가에게 확인하십시오.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 부동산 매매계약서
    spaced: false
  - type: para
    text: 매도인과 매수인은 아래 표시 부동산에 관하여 다음과 같이 매매계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 부동산의 표시
  - type: grid
    widths: [14, 26, 14, 20, 12, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 5]
    rows:
      - ["소재지", "", "", "", "", ""]
      - ["토지", "지목", "", "면적", "", "㎡"]
      - ["건물", "구조·용도", "", "면적", "", "㎡"]
      - ["대지권", "", "거래 대상 지분", "", "전부 / 일부", ""]
  - type: subtitle
    text: 2. 매매대금 및 지급 일정
  - type: grid
    widths: [13, 25, 13, 24, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 4]
      - [4, 3, 4, 4]
    rows:
      - ["매매대금", "금                                원정 (₩                    )", "", "", ""]
      - ["계약금", "금                원정", "지급일", "계약 시", ""]
      - ["중도금", "금                원정", "지급일", "20   년   월   일", ""]
      - ["잔금", "금                원정", "지급일", "20   년   월   일", ""]
      - ["입금계좌", "", "예금주", "", ""]
  - type: article
    heading: 제1조 (소유권의 이전과 인도)
    lines:
      - "매도인은 잔금 수령과 동시에 소유권이전등기에 필요한 모든 서류를 매수인에게 교부하고 부동산을 인도한다."
      - "소유권이전등기 신청은 잔금 지급일에 동시에 진행한다."
  - type: article
    heading: 제2조 (제한물권 등의 말소)
    lines:
      - "매도인은 잔금 지급일까지 근저당권·가압류·전세권 등 소유권 행사를 제한하는 권리와 조세·공과금의 미납액을 모두 말소·정산한다."
      - "다만 특약으로 승계하기로 정한 사항은 그에 따른다."
  - type: article
    heading: 제3조 (계약의 해제)
    lines:
      - "매수인이 중도금(중도금이 없을 때는 잔금)을 지급하기 전까지 매도인은 계약금의 배액을 상환하고, 매수인은 계약금을 포기하여 계약을 해제할 수 있다."
  - type: article
    heading: 제4조 (채무불이행과 손해배상)
    lines:
      - "당사자 일방이 채무를 이행하지 않는 경우 상대방은 상당한 기간을 정하여 이행을 촉구하고 계약을 해제할 수 있으며 손해배상을 청구할 수 있다."
      - "손해배상에 관하여 별도 약정이 없으면 계약금을 손해배상의 기준으로 본다."
  - type: article
    heading: 제5조 (위험부담)
    lines:
      - "부동산의 멸실·훼손에 대한 위험은 인도 시점부터 매수인이 부담한다."
  - type: article
    heading: 제6조 (제세공과금의 부담)
    lines:
      - "부동산에 관한 조세·공과금은 인도일을 기준으로 그 전일까지는 매도인이, 인도일부터는 매수인이 부담한다."
      - "취득세와 등기비용은 매수인이, 양도소득세는 매도인이 부담한다."
  - type: article
    heading: 제7조 (임대차 등 승계)
    lines:
      - "본 부동산에 임대차가 있는 경우 그 내용과 승계 여부는 특약사항에 기재하며, 매도인은 임차인에게 소유권 변동을 통지한다."
  - type: article
    heading: 제8조 (중개보수)
    lines:
      - "중개보수는 계약 체결과 동시에 매도인과 매수인이 각각 지급하며, 개업공인중개사는 중개대상물 확인·설명서와 업무보증관계증서 사본을 교부한다."
  - type: subtitle
    text: 특약사항
  - type: textbox
    hint: "승계할 임대차 내용, 잔금일 제출 서류 목록, 시설물·옵션의 포함 범위, 하자 처리 기준 등을 구체적으로 기재하십시오."
    height_mm: 26
  - type: para
    text: 본 계약을 증명하기 위하여 계약 당사자가 이의 없음을 확인하고 각각 서명·날인 후 매 장마다 간인하여 각 1부씩 보관한다.
    align: both
    size: 9
  - type: date_line
  - type: subtitle
    text: 계약 당사자
  - type: grid
    widths: [14, 12, 24, 12, 18, 20]
    label_cols: [0, 1, 3]
    row_height_mm: 8
    rows:
      - ["매도인", "주소", "", "성명", "", "(서명 또는 인)"]
      - ["", "생년월일", "", "연락처", "", ""]
      - ["매수인", "주소", "", "성명", "", "(서명 또는 인)"]
      - ["", "생년월일", "", "연락처", "", ""]
      - ["개업공인중개사", "사무소명", "", "대표", "", "(서명 또는 인)"]
      - ["", "등록번호", "", "연락처", "", ""]
  - type: notice
    text: 계약 전 등기부등본으로 소유자와 근저당·가압류를 확인하고, 잔금일에 제한물권 말소와 소유권이전등기를 동시에 진행하십시오. 취득세·양도소득세는 세무 전문가에게 확인하십시오. 본 서식은 참고용입니다.
