id: dependent-support-fact-confirmation
title: 부양 사실 확인서
category: public
subcategory: family
tags: [부양사실확인서, 부양가족확인, 부모부양확인, 생계같이확인, 부양가족증빙]
summary: 가족을 실제로 부양하고 있는 사실을 부양 기간과 방식, 확인인 서명과 함께 정리하는 확인서입니다.
usage: >
  부모나 형제 등 가족을 경제적으로 돕고 있는 사실을 제출처에 설명해야 할 때 쓰는 서식입니다.
  부양자와 피부양자의 관계, 부양 시작 시기, 생활비 지원이나 동거 등 부양 방식을 적고 부양자가
  서명합니다. 연말정산이나 각종 신청에서 부양가족으로 인정되는지는 소득·동거 등 요건에 따라
  달라지므로 제출처 기준을 먼저 확인하십시오. 본 서식은 사실을 정리하는 틀이며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 부양자의 성명과 연락처를 적습니다.
  - 피부양자의 성명, 생년월일, 관계를 적습니다.
  - 부양 시작 시기와 부양 방식을 적습니다.
  - 확인 내용을 읽고 부양자가 서명합니다.
faq:
  - q: 주민등록번호를 적어야 하나요?
    a: 이 서식에는 생년월일만 적습니다. 제출처가 따로 요구하면 해당 기관 양식을 쓰십시오.
  - q: 이 확인서로 부양가족 공제가 되나요?
    a: 공제는 소득·나이 등 요건에 따라 정해집니다. 제출처와 국세청 기준을 확인하십시오.
  - q: 부양 방식은 어떻게 적나요?
    a: 동거, 정기 생활비 송금처럼 실제 하고 있는 내용을 구체적으로 적으십시오.
related: [family-relationship-confirmation, cohabitant-confirmation, residence-fact-confirmation, year-end-tax-checklist]
blocks:
  - type: doc_title
    text: 부양 사실 확인서
    spaced: true
  - type: subtitle
    text: 1. 부양자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울시 예시구 예시로 12", "", ""]
  - type: subtitle
    text: 2. 피부양자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["관계", "", "동거 여부", ""]
    sample_rows:
      - ["", "김서연", "", "1955-03-02"]
      - ["", "모", "", "동거"]
  - type: subtitle
    text: 3. 부양 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["부양 시작", "", "부양 방식", ""]
    sample_rows:
      - ["", "2020-01", "", "동거 및 생활비 지원"]
  - type: textbox
    hint: "생활비 지원 방법, 의료비 부담 등 부양 상황을 구체적으로 적으십시오."
    height_mm: 26
    sample_text: "부양자와 함께 거주하며 식비와 주거비, 병원비를 부양자가 부담하고 있음."
  - type: para
    text: 위 내용이 사실임을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월    28 일
  - type: sign_line
    label: 부양자
    sample_names: [홍길동]
  - type: notice
    text: 부양가족 인정 여부는 제출처 기준을 확인하십시오.
