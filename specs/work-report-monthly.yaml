id: work-report-monthly
title: 월간업무보고서
category: corp
subcategory: admin
series: work-report
series_name: 업무보고서
variant: 월간
variant_rank: 3
version: 1
created_by: agent
status: published
tags: [월간업무보고서, 월간보고, 업무보고서, 월간실적, monthly report]
summary: 한 달간의 주요 성과와 부문별 실적, 익월 계획을 종합 정리해 보고하는 월간업무보고서입니다.
usage: >
  매월 말 부서의 한 달 성과를 목표·실적·달성률로 정리해 경영진에 보고하는 서류입니다.
  월간 주요 성과는 수치 중심으로 작성하고, 부문별 실적은 담당 조직별로 나누어 비교가
  가능하도록 정리합니다. 애로사항에는 목표 달성을 가로막은 요인과 필요한 지원을
  함께 적어 다음 달 계획에 반영될 수 있도록 하십시오.
source: original
featured: false
target_pages: 2
variant_use: 한 달 전체 실적을 종합해 보고할 때 씁니다.

howto:
  - 이번 달 목표와 실적 수치를 정리합니다.
  - 부문별 실적을 담당 조직별로 나눠 비교합니다.
  - 목표 달성을 가로막은 애로사항과 필요한 지원을 적습니다.
  - 다음 달 계획을 세워 함께 첨부합니다.

faq:
  - q: 주간업무보고서와 무엇이 다른가요?
    a: 월간보고서는 한 달 전체 성과와 다음 달 계획을 종합해 경영진에 보고하는 문서입니다.
  - q: 부문이 하나뿐이면 부문별 실적란은 비워도 되나요?
    a: 담당 업무를 세분해 적으면 부문이 하나라도 성과를 더 구체적으로 보여줄 수 있습니다.

blocks:
  - type: doc_title
    text: 월간업무보고서
    spaced: true

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["보고부서", "", "보고자", ""]
      - ["보고월", "", "작성일", ""]
    sample_rows:
      - ["", "전략기획팀", "", "박민준"]
      - ["", "2026년 8월", "", "2026-09-01"]

  - type: subtitle
    text: 1. 월간 주요 성과

  - type: table
    widths: [16, 24, 24, 12, 24]
    header: [구분, 목표, 실적, 달성률, 비고]
    empty_rows: 4
    row_height_mm: 9
    sample_rows:
      - ["매출", "1,200,000,000원", "1,104,000,000원", "92%", "해외 매출 증가"]
      - ["신규 계약", "15건", "13건", "87%", "2건 이월"]

