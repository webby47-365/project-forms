    empty_rows: 4
    row_height_mm: 9
    sample_rows:
      - ["마케팅", "김서연", "신제품 런칭 캠페인 진행", "SNS 반응 긍정적"]
      - ["영업", "박민준", "거래처 13곳 재계약 완료", "2곳 협상 중"]

  - type: subtitle
