    hint: "목표 달성을 가로막은 요인과 필요한 지원사항을 기재하십시오."
    height_mm: 18
    sample_text: 원자재 단가 상승으로 마케팅 예산 대비 집행 효율이 낮아졌습니다. 4분기 예산 재배정과 디자인 인력 충원을 검토해 주시기 바랍니다.

  - type: subtitle
    text: 결재

