  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["위임인", "", "연락처", ""]
      - ["수임인", "", "연락처", ""]
      - ["관계", "", "차량번호", ""]
    sample_rows:
