id: business-premises-area-change-confirmation
title: 영업장 면적 변경 사실 확인서
category: public
subcategory: permit
tags: [영업장면적변경, 영업장확장, 매장면적변경, 영업신고변경, 면적확인서]
summary: 증축·축소 등으로 영업장 면적이 바뀐 사실을 변경 전후 수치와 사유로 정리해 제출용으로 남기는 확인서입니다.
usage: >
  영업장을 넓히거나 줄여 면적이 달라졌을 때 변경 사실을 기록해 두는 서식입니다. 영업장 정보,
  변경 전후 면적과 변경 사유·시기를 적고 영업자가 서명합니다. 영업 종류에 따라 변경신고가
  필요한지, 시설 기준을 충족하는지는 관할 기관이 판단하므로 제출 전에 담당 부서에 확인하십시오.
  본 서식은 사실을 정리하는 틀이며 신고서를 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 영업장 상호와 소재지, 영업 종류를 적습니다.
  - 변경 전 면적과 변경 후 면적을 적습니다.
  - 변경 사유와 변경한 시기를 적습니다.
  - 영업자가 서명하고 도면 등 증빙을 붙입니다.
faq:
  - q: 이 확인서만 내면 변경신고가 되나요?
    a: 아닙니다. 신고가 필요한지는 영업 종류별로 다르니 관할 기관에 확인하십시오.
  - q: 면적은 어떻게 적나요?
    a: 제곱미터 단위로 적고, 도면이나 임대차계약서의 수치와 맞는지 확인하십시오.
  - q: 증빙은 무엇을 붙이나요?
    a: 도면, 건축물대장, 임대차계약서 등 제출처가 요구하는 자료를 붙입니다.
related: [business-license-reissue-request, permit-supplement-submission, business-facility-use-consent, permit-application-poa]
blocks:
  - type: doc_title
    text: 영업장 면적 변경 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 영업장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["상호", "", "영업 종류", ""]
      - ["소재지", "", "", ""]
      - ["영업자", "", "연락처", ""]
    sample_rows:
      - ["", "한빛식당", "", "일반음식점"]
      - ["", "서울시 예시구 예시로 12", "", ""]
      - ["", "홍길동", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 면적 변경 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["변경 전 면적", "", "변경 후 면적", ""]
      - ["변경 시기", "", "증감 면적", ""]
    sample_rows:
      - ["", "45.0㎡", "", "62.5㎡"]
      - ["", "2026-09-20", "", "+17.5㎡"]
  - type: subtitle
    text: 3. 변경 사유
  - type: textbox
    hint: "증축·임차 면적 변경 등 사유와 첨부한 증빙 자료를 적으십시오."
    height_mm: 26
    sample_text: "옆 호실을 추가로 임차해 홀 면적을 넓혔으며, 변경된 임대차계약서와 도면 사본을 첨부함."
  - type: para
    text: 위 내용이 사실임을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월    28 일
  - type: sign_line
    label: 영업자
    sample_names: [홍길동]
  - type: notice
    text: 변경신고 여부와 시설 기준은 관할 기관에 확인하십시오.
