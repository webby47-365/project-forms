id: gov-mail-order-report
title: 통신판매업 신고서
category: public
subcategory: permit
tags:
- 통신판매업
- 온라인쇼핑몰
- 전자상거래
- 통신판매신고
- 인터넷쇼핑
summary: 온라인 쇼핑몰이나 인터넷 판매를 시작할 때 공정거래위원회에 제출하는 법정 신고서입니다.
usage: '사업자가 텔레비전 홈쇼핑, 인터넷, 카탈로그 등 통신판매업을 시작할 때 공정거래위원회 또는 시·군·구청에 신고합니다. 신고인(법인) 정보, 대표자 정보, 전자우편 주소, 사업자등록번호, 인터넷도메인명과 호스트서버 소재지를 기입합니다. 판매 방식(TV홈쇼핑, 인터넷, 카탈로그, 신문·잡지, 기타) 중 하나를 선택하고, 취급 품목을 해당하는 것 모두에
  표시합니다. 선지급식 통신판매를 하려면 구매안전서비스 이용 확인증을 첨부해야 하며, 수수료는 없습니다. 처리기간은 3일입니다.

  '
source: law-standard
source_note: 전자상거래 등에서의 소비자보호에 관한 법률 시행규칙 별지 제1호서식
law_ref:
  law: 전자상거래 등에서의 소비자보호에 관한 법률 시행규칙
  form_no: 별지 제1호서식
  amended: '2025-02-11'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EC%A0%84%EC%9E%90%EC%83%81%EA%B1%B0%EB%9E%98+%EB%93%B1%EC%97%90%EC%84%9C%EC%9D%98+%EC%86%8C%EB%B9%84%EC%9E%90%EB%B3%B4%ED%98%B8%EC%97%90+%EA%B4%80%ED%95%9C+%EB%B2%95%EB%A5%A0+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0001&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 공정거래위원회·시군구
  checked: '2026-09-16'
featured: false
target_pages: 1
created_by: gov-batch
howto:
- 신고인(법인)의 상호, 법인등록번호, 소재지를 적습니다.
- 대표자의 성명, 주민등록번호, 주소, 연락처를 기입합니다.
- 전자우편주소, 사업자등록번호를 적습니다.
- 인터넷도메인 이름과 호스트서버 소재지를 기재합니다.
- 판매 방식과 취급 품목에 모두 표시하고, 신고인이 서명해 관할 기관에 제출합니다.
faq:
- q: 선지급식 통신판매는 무엇인가요?
  a: 소비자가 상품을 받기 전에 대금을 먼저 내는 판매 방식입니다. 이 경우 구매안전서비스 이용 확인증 등을 첨부합니다.
- q: 신고인과 대표자가 다르면 어떻게 하나요?
  a: 원문 안내대로 신고인이 대표자와 동일인이 아닐 때만 신고인 칸을 따로 적고 서명합니다.
- q: 호스트서버 소재지는 어떻게 확인하나요?
  a: 웹호스팅업체에 확인하여 기입합니다.
