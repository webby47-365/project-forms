  - type: article
    heading: 제2조 (임대차기간)
    lines:
      - "임대인은 임차주택을 임대차 목적대로 사용할 수 있는 상태로 20   년   월   일까지 임차인에게 인도하고, 임대차기간은 인도일로부터 20   년   월   일까지로 한다."
  - type: article
    heading: 제3조 (입주 전 수리)
    lines:
      - "임대인은 입주 전 다음 사항을 수리하기로 한다. (수리할 내용 :                                        )"
      - "수리 완료 시기는 잔금지급기일인 20   년   월   일까지로 하며, 이행하지 않을 경우 임차인은 수리비를 차임 또는 보증금에서 공제할 수 있다."
  - type: article
    heading: 제4조 (임차주택의 사용·관리·수선)
    lines:
      - "임차인은 임대인의 동의 없이 임차주택의 구조를 변경하거나 전대·양도할 수 없으며, 임대차 목적 외의 용도로 사용할 수 없다."
      - "임대인은 계약 존속 중 임차주택을 사용·수익에 필요한 상태로 유지할 의무를 부담하고, 시설물의 노후화나 통상적인 마모에 대한 수선은 임대인이 부담한다."
      - "임차인의 고의·과실로 인한 파손과 전구 등 소모품 교체 비용은 임차인이 부담한다."
  - type: article
    heading: 제5조 (계약의 해제)
    lines:
      - "임차인이 임대인에게 중도금(중도금이 없을 때는 잔금)을 지급하기 전까지, 임대인은 계약금의 배액을 상환하고 임차인은 계약금을 포기하여 이 계약을 해제할 수 있다."
  - type: article
    heading: 제6조 (채무불이행과 손해배상)
    lines:
      - "당사자 일방이 채무를 이행하지 않는 경우 상대방은 상당한 기간을 정하여 이행을 촉구하고 계약을 해제할 수 있으며, 그로 인한 손해배상을 청구할 수 있다."
  - type: article
    heading: 제7조 (계약의 해지)
    lines:
      - "임차인은 본인의 과실 없이 임차주택의 일부가 멸실되어 임대차 목적대로 사용할 수 없게 된 경우 계약을 해지할 수 있다."
      - "임대인은 임차인이 차임을 2기분 이상 연체하거나 제4조를 위반한 경우 계약을 해지할 수 있다."
  - type: article
    heading: 제8조 (계약갱신요구권)
    lines:
      - "임차인은 임대차기간이 끝나기 6개월 전부터 2개월 전까지 계약갱신을 요구할 수 있고, 임대인은 주택임대차보호법이 정한 정당한 사유가 없으면 이를 거절할 수 없다."
  - type: article
    heading: 제9조 (계약의 종료)
    lines:
      - "임대차계약이 종료된 경우 임차인은 임차주택을 원상회복하여 임대인에게 반환하고, 임대인은 보증금을 임차인에게 반환한다. 다만 연체된 차임·관리비와 손해배상액이 있으면 이를 공제할 수 있다."
  - type: article
    heading: 제10조 (중개보수 등)
    lines:
      - "중개보수는 계약 체결과 동시에 임대인과 임차인이 각각 지급하며, 개업공인중개사의 고의·과실 없이 계약이 무효·취소·해제되어도 중개보수는 지급한다."
      - "개업공인중개사는 중개대상물 확인·설명서를 작성하고 업무보증관계증서 사본을 첨부하여 계약 당사자 쌍방에게 교부한다."

  - type: subtitle
    text: 특약사항
  - type: textbox
    hint: "수리 책임 범위, 반려동물 허용 여부, 원상복구 기준, 주택 상태 등 합의한 내용을 구체적으로 기재하십시오."
    height_mm: 26
    sample_text: 반려동물은 소형견 1마리까지 허용하며, 입주 전 발견된 하자는 임대인이 수리한다. 원상복구는 통상적인 사용에 따른 마모를 제외하고 입주 당시 상태를 기준으로 한다.

  - type: para
    text: 본 계약을 증명하기 위하여 계약 당사자가 이의 없음을 확인하고 각각 서명·날인 후 임대인, 임차인, 개업공인중개사는 매 장마다 간인하여 각각 1부씩 보관한다.
    align: both
    size: 9
