      - ["", "금 5,000,000원정", "", "", ""]
      - ["", "해당없음", "", "-", ""]
      - ["", "금 45,000,000원정", "", "2026-11-01", ""]
      - ["", "금 600,000원정", "", "매월 1일", "선불"]
      - ["", "금 80,000원정 (정액) · 포함내역 : 수도·인터넷", "", "", ""]
