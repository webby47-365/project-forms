id: housing-lease-contract
title: 주택임대차계약서
category: estate
subcategory: lease
tags: [주택임대차계약서, 전세계약서, 월세계약서, 임대차계약, 표준계약서]
summary: 부동산 표시·보증금·차임·임대차기간과 갱신요구권·계약해지 조항을 담은 주택임대차계약서입니다.
usage: >
  전세·월세 계약 시 사용하는 서식입니다. 계약 전 등기부등본으로 소유자와 근저당 설정
  여부를 반드시 확인하고, 계약 후에는 잔금일에 전입신고와 확정일자를 받아 대항력과
  우선변제권을 확보해야 합니다. 특약사항에는 수리 책임 범위, 반려동물, 원상복구 기준
  등 다툼이 생기기 쉬운 항목을 구체적으로 적어두십시오. 본 서식은 참고용이며 법적
  효력과 적합성은 사용자가 확인해야 합니다.
source: law-standard
source_note: 주택임대차보호법 및 국토교통부 주택임대차표준계약서 양식을 참고하여 자체 제작
featured: true
featured_rank: 8
series: lease
series_name: 임대차계약서
variant: 주택
variant_rank: 1
target_pages: 2

variant_use: 전세·월세 등 주택을 빌릴 때 씁니다.

howto:
  - 등기부등본으로 소유자와 근저당 여부를 확인합니다.
  - 부동산 표시와 보증금·차임, 임대차기간을 적습니다.
  - 특약사항에 수리 책임과 원상복구 기준을 적습니다.
  - 계약서에 서명하고 계약금을 주고받습니다.
  - 잔금일에 전입신고와 확정일자를 받습니다.

faq:
  - q: 확정일자는 왜 꼭 받아야 하나요?
    a: 전입신고와 함께 확정일자를 받아야 보증금을 지킬 수 있는 우선변제권이 생깁니다.
  - q: 계약 갱신을 요구할 수 있나요?
    a: 주택임대차보호법에 따라 임차인은 계약 기간이 끝나기 전 일정 기간 안에 갱신을 요구할 수 있습니다.

