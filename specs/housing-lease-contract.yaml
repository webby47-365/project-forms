  - type: notice
    text: 계약 전 등기부등본으로 소유자와 근저당·가압류 설정 여부를 확인하고, 잔금일에 전입신고와 확정일자를 받아 대항력과 우선변제권을 확보하십시오. 확정일자는 주민센터·등기소 또는 인터넷등기소에서 받을 수 있습니다.
