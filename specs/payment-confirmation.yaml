id: payment-confirmation
title: 입금확인서
category: corp
subcategory: finance
tags: [입금확인서, 입금증명서, 대금 수령확인, 송금확인서, 거래대금 확인]
summary: 입금일자·금액·입금계좌와 거래 내역을 기재해 대금 수령 사실을 확인해 주는 서식입니다.
usage: >
  거래처로부터 대금을 받았을 때 수령 사실을 문서로 확인해 주는 서류입니다. 입금일자와 금액은
  통장 거래내역과 일치해야 하며, 금액은 한글과 숫자를 함께 적어 변조를 막으십시오. 어떤 거래에
  대한 입금인지 계약명이나 세금계산서 번호를 함께 적어야 나중에 대사하기 쉽습니다. 일부 입금인
  경우 총 거래금액과 잔여금액을 구분해 적고, 잔금 지급 예정일을 기재하십시오. 발행자는 상호와
  대표자를 적고 날인한 뒤 사본을 보관합니다.
source: original
featured: false
target_pages: 1
howto:
  - 통장 거래내역을 보고 입금일자와 금액을 확인합니다.
  - 금액은 숫자와 한글로 함께 적습니다.
  - 어떤 거래인지 계약명이나 세금계산서 번호를 적습니다.
  - 발행자 상호와 대표자를 적고 날인해 사본을 보관합니다.

faq:
  - q: 대금 일부만 입금됐을 때는 어떻게 적나요?
    a: 총 거래금액과 이번 입금액, 남은 잔금을 나눠 적고 잔금 지급 예정일도 함께 적습니다.
  - q: 세금계산서가 없으면 무엇을 적어야 하나요?
    a: 계약서 번호나 주문서 번호처럼 거래를 특정할 수 있는 근거를 대신 적으면 됩니다.

blocks:
