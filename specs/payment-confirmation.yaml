      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
    rows:
      - ["입금금액", "금                                 원정 (₩                       )", "", ""]
      - ["입금일자", "", "입금방법", "계좌이체 / 현금 / 수표"]
      - ["입금계좌 (수취)", "", "", ""]
      - ["입금자명", "", "거래 구분", "전액 / 일부"]
    sample_rows:
      - ["", "금 오백만원정 (₩5,000,000)", "", ""]
      - ["", "2026-09-13", "", ""]
