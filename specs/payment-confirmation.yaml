id: payment-confirmation
title: 입금확인서
category: corp
subcategory: finance
tags: [입금확인서, 입금증명서, 대금 수령확인, 송금확인서, 거래대금 확인]
summary: 입금일자·금액·입금계좌와 거래 내역을 기재해 대금 수령 사실을 확인해 주는 서식입니다.
usage: >
  거래처로부터 대금을 받았을 때 수령 사실을 문서로 확인해 주는 서류입니다. 입금일자와 금액은
  통장 거래내역과 일치해야 하며, 금액은 한글과 숫자를 함께 적어 변조를 막으십시오. 어떤 거래에
  대한 입금인지 계약명이나 세금계산서 번호를 함께 적어야 나중에 대사하기 쉽습니다. 일부 입금인
  경우 총 거래금액과 잔여금액을 구분해 적고, 잔금 지급 예정일을 기재하십시오. 발행자는 상호와
  대표자를 적고 날인한 뒤 사본을 보관합니다.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 입금확인서
  - type: subtitle
    text: 1. 입금 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
    rows:
      - ["입금금액", "금                                 원정 (₩                       )", "", ""]
      - ["입금일자", "", "입금방법", "계좌이체 / 현금 / 수표"]
      - ["입금계좌 (수취)", "", "", ""]
      - ["입금자명", "", "거래 구분", "전액 / 일부"]
  - type: subtitle
    text: 2. 관련 거래
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["거래(계약)명", "", "", ""]
      - ["계약일자", "", "세금계산서 번호", ""]
      - ["총 거래금액", "", "기수령 누계", ""]
      - ["잔여금액", "", "잔금 지급 예정일", ""]
  - type: subtitle
    text: 3. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["입금자(지급인) 상호", "", "대표자", ""]
      - ["주소", "", "", ""]
      - ["수령자(수취인) 상호", "", "대표자", ""]
      - ["주소", "", "", ""]
  - type: textbox
    hint: "비고 — 분할 입금 일정, 수수료 부담 주체 등 특이사항을 기재하십시오."
    height_mm: 18
  - type: para
    text: 위 금액을 정히 입금받았음을 확인합니다.
    align: center
    size: 11
  - type: date_line
  - type: sign_line
    label: 확인자(수령인)
  - type: notice
    text: 입금 사실은 통장 거래내역과 대조해 확인하시고, 세금계산서 발행 여부를 별도로 확인하십시오.
