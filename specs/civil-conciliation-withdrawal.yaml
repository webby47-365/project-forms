id: civil-conciliation-withdrawal
title: 조정신청 취하서
category: legal
subcategory: litigation
tags: [조정신청, 취하서, 민사조정, 조정취하, 신청취하]
summary: 법원에 낸 민사조정 신청을 합의나 사정 변경으로 거두어들일 때 쓰는 조정신청 취하서 양식입니다.
usage: >
  민사조정을 신청한 뒤 상대방과 직접 합의했거나 더 이상 조정이 필요 없을 때 신청을 거두어들이는 서류입니다.
  사건번호와 당사자, 취하 사유를 적고 신청인이 서명합니다.
  취하 시기와 방식, 상대방 동의 필요 여부는 사건 진행 단계에 따라 다를 수 있으므로 해당 법원 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 법원 이름과 사건번호, 사건명을 적습니다.
  - 신청인과 상대방의 성명을 적습니다.
  - 취하하는 사유를 간단히 적습니다.
  - 날짜를 적고 신청인이 서명합니다.
faq:
  - q: 사건번호는 어디서 확인하나요?
    a: 법원에서 받은 서류에 적혀 있습니다. 모르면 접수한 법원에 문의하십시오.
  - q: 상대방 동의가 필요한가요?
    a: 사건 진행 단계에 따라 다를 수 있으므로 해당 법원 안내를 확인하십시오.
  - q: 취하 사유를 자세히 써야 하나요?
    a: 간단히 적으면 됩니다. 합의 내용 전부를 적을 필요는 없습니다.
related: [civil-conciliation, lawsuit-withdrawal, evidence-submission-list]
blocks:
  - type: doc_title
    text: 조정신청 취하서
    spaced: true
  - type: subtitle
    text: 1. 사건 표시
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["법원", "", "사건번호", ""]
      - ["사건명", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "한빛지방법원", "", "2026머0000"]
      - ["", "물품대금 조정", "", ""]
  - type: subtitle
    text: 2. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["신청인", "", "연락처", ""]
      - ["상대방", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "김서연", "", ""]
  - type: subtitle
    text: 3. 취하 사유
  - type: textbox
    hint: "취하하는 사유를 간단히 적으십시오."
    height_mm: 30
    sample_text: "상대방과 직접 합의가 이루어져 조정 절차를 더 진행할 필요가 없어 신청을 취하합니다."
  - type: para
    text: 위 사건의 조정신청을 취하합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   24 일
  - type: sign_line
    label: 신청인
    sample_names: [홍길동]
  - type: notice
    text: 취하 방식은 사건 진행 단계에 따라 다를 수 있으니 해당 법원 안내를 확인하십시오.
