id: quotation-validity-extension-request
title: 견적 유효기간 연장 요청서
category: corp
subcategory: sales
tags: [견적유효기간, 견적 연장, 견적서 연장요청, 견적 기간 연장, 견적 재확인]
summary: 받아 둔 견적서의 유효기간이 지나기 전에 같은 조건으로 기간을 늘려 달라고 거래처에 요청하는 견적 유효기간 연장 요청서 양식입니다.
usage: >
  내부 결재나 예산 확정이 늦어져 받아 둔 견적서의 유효기간이 지날 것 같을 때 쓰는 문서입니다.
  원래 견적 번호와 금액, 유효기간 만료일을 적고 연장을 원하는 기간과 사유를 적어 거래처에 보냅니다.
  연장 여부와 금액 조정은 거래처가 정하므로, 회신 내용을 반드시 받아 두십시오.
source: original
featured: false
target_pages: 1
howto:
  - 요청자와 거래처 정보를 적습니다.
  - 원래 견적 번호와 금액, 만료일을 적습니다.
  - 연장을 원하는 날짜와 사유를 적습니다.
  - 회신 방법을 적어 거래처에 보냅니다.
faq:
  - q: 연장되면 금액도 그대로인가요?
    a: 거래처가 정합니다. 회신란에 금액 유지 여부를 반드시 확인해 두십시오.
  - q: 견적서 자체를 다시 받아야 하나요?
    a: 연장 회신을 서면으로 받으면 충분한 경우가 많습니다. 내부 결재 기준을 확인하십시오.
  - q: 사유는 꼭 적어야 하나요?
    a: 짧게라도 적는 편이 좋습니다. 사유가 분명하면 거래처가 연장을 검토하기 쉽습니다.
related: [quotation, quotation-comparison, sales-contract, unit-price-change-notice]
blocks:
  - type: doc_title
    text: 견적 유효기간 연장 요청서
    spaced: false
  - type: subtitle
    text: 1. 요청자 및 거래처
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["요청 회사", "", "담당자", ""]
      - ["거래처", "", "연락처", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "홍길동"]
      - ["", "한빛물산", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 원래 견적 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["견적 번호", "", "견적 일자", ""]
      - ["견적 금액", "", "유효기간 만료일", ""]
      - ["품목", "", "", ""]
    sample_rows:
      - ["", "Q-2026-0915", "", "2026-09-15"]
      - ["", "12,500,000원", "", "2026-10-31"]
      - ["", "사무용 노트북 20대", "", ""]
  - type: subtitle
    text: 3. 연장 요청
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["연장 희망일", "", "회신 요청일", ""]
    sample_rows:
      - ["", "2026-11-30", "", "2026-10-28"]
  - type: textbox
    hint: "연장이 필요한 사유와 거래처에 확인하고 싶은 사항(금액 유지 여부 등)을 적으십시오."
    height_mm: 24
    sample_text: 내부 예산 승인이 11월 중순에 확정될 예정이라 유효기간을 11월 30일까지 늘려 주시기 바랍니다. 같은 금액으로 가능한지 회신 부탁드립니다.
  - type: date_line
    sample_text: 2026 년   10 월   22 일
  - type: sign_line
    labels: ["요청자"]
    sample_names: [홍길동]
  - type: notice
    text: 연장 여부와 금액은 거래처 회신으로 확정되므로 서면으로 받아 두십시오.
