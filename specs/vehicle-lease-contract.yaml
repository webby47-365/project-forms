id: vehicle-lease-contract
title: 자동차 임대차계약서
category: public
subcategory: vehicle
tags: [자동차임대차계약서, 차량렌트계약서, 개인간차량대여계약서, 자동차대여계약서, 차량임대차계약]
summary: 개인 간에 자동차를 일정 기간 빌려주고 빌릴 때 임대료·보증금과 사고 책임을 정하는 계약서입니다.
usage: >
  지인이나 소상공인끼리 렌터카 업체를 거치지 않고 자동차를 직접 빌려주고 빌릴 때 쓰는
  계약서입니다. 차량번호·차대번호 등 차량 정보를 정확히 적고, 임대기간과 임대료·보증금,
  사고 발생 시 책임 범위를 명확히 해 두어야 분쟁을 줄일 수 있습니다. 인도·반납 시점에는
  계약 당사자가 함께 차량 상태를 확인하고 사진으로 남겨 두는 것이 안전합니다.
source: original
featured: false
target_pages: 1

howto:
  - 임대인과 임차인의 인적사항을 적습니다.
  - 차량번호와 차대번호 등 차량 정보를 적습니다.
  - 임대기간과 임대료, 보증금을 적습니다.
  - 보험 가입과 사고 시 책임 범위를 정합니다.
  - 반납 조건과 특약사항을 적고 서명합니다.

faq:
  - q: 임차인 명의로 보험을 새로 들어야 하나요?
    a: 기존 보험 승계가 어려우면 임차인이 단기운전자보험 등을 별도로 가입하는 것이 안전합니다.
  - q: 임대 중 사고가 나면 누가 책임지나요?
    a: 계약서에 정한 책임 범위를 따르되, 과실 비율은 보험사 조사 결과에 따르는 것이 일반적입니다.
  - q: 보증금은 언제 돌려받나요?
    a: 반납 시 차량 상태를 확인한 뒤 손상·미납금을 정산하고 남은 금액을 돌려받습니다.

related: [vehicle-registration-poa, car-accident-settlement, receipt]

blocks:
  - type: doc_title
    text: 자동차 임대차계약서
    spaced: false

  - type: para
    text: 임대인과 임차인은 아래 자동차에 대하여 다음과 같이 임대차계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 임대인 / 임차인

  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["임대인", "", "생년월일", "", "연락처", ""]
      - ["임차인", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "1982-02-17", "", "010-1234-5678"]
      - ["", "박민준", "", "1991-07-09", "", "010-9876-5432"]

  - type: subtitle
    text: 차량 정보

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["차종(모델명)", "", "차량번호", ""]
      - ["차대번호", "", "연식", ""]
      - ["주행거리(인도 시)", "", "색상", ""]
    sample_rows:
      - ["", "현대 아반떼", "", "12가3456"]
      - ["", "KMHXX00XXXX000000", "", "2023년식"]
      - ["", "32,000km", "", "흰색"]

  - type: subtitle
    text: 임대 조건

  - type: grid
    widths: [18, 30, 18, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [3, 1, 3, 3]
    rows:
      - ["임대기간", "20   년  월  일 ~ 20   년  월  일", "", ""]
      - ["임대료", "", "지급 주기", "선불 / 후불, 매월  일"]
      - ["보증금", "", "반환 조건", "손상·미납금 정산 후 반환"]
      - ["인도 장소·시각", "", "", ""]
    sample_rows:
      - ["", "2026년 9월 20일 ~ 2026년 12월 19일", "", ""]
      - ["", "월 400,000원", "", "선불, 매월 20일"]
      - ["", "500,000원", "", "손상·미납금 정산 후 반환"]
      - ["", "서울특별시 마포구 월드컵북로 100, 오전 10시", "", ""]

  - type: kv_list
    items:
      - "임차인은 임대기간 중 선량한 관리자로서 차량을 관리한다."
      - "임차인의 과실로 발생한 손상·위반과태료는 임차인이 부담한다."
      - "임대 종료 시 임대인 입회 하에 차량 상태를 확인하고 반납한다."

  - type: textbox
    hint: "보험 가입 여부, 사고 시 책임 범위, 위약금 등 특약사항을 적으십시오."
    height_mm: 20
    sample_text: 차량은 임대인의 자동차보험(대인·대물)을 유지한 상태로 인도하며, 임차인은 임대기간 중 책임보험 유지 여부를 확인한다.

  - type: para
    text: 위와 같이 계약을 체결하고 계약서 2부를 작성하여 각자 1부씩 보관한다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월   18 일

  - type: sign_line
    labels: ["임대인", "임차인"]
    sample_names: [홍길동, 박민준]

  - type: notice
    text: 반납 전 임대인과 임차인이 함께 차량 상태를 점검하고 사진으로 기록해 두는 것이 안전합니다.
