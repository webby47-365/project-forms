id: contract-assignment-consent
title: 계약상 지위 양도 승낙서
category: legal
subcategory: contract
tags: [계약양도, 계약상지위양도, 양도승낙, 계약인수, 승계동의]
summary: 계약의 한쪽 당사자가 자리를 제3자에게 넘기는 것에 상대방이 동의한다는 내용을 남기는 승낙서입니다.
usage: >
  사업 양도나 담당자 교체 등으로 계약 당사자의 지위를 다른 사람이나 회사가 넘겨받을 때 계약
  상대방에게 받아 두는 서식입니다. 원래 계약의 이름과 날짜, 넘기는 사람(양도인)과 넘겨받는 사람
  (양수인), 양도 기준일, 이미 발생한 권리·의무를 누가 맡는지를 적습니다. 계약서에 양도 제한
  조항이 있는지 먼저 확인하십시오. 이 서식은 승낙 내용을 기록하는 틀이며 법률 판단을 대신하지
  않습니다. 중요한 계약은 전문가 검토를 권합니다.
source: original
featured: false
target_pages: 1
howto:
  - 원래 계약의 이름과 체결일, 계약 당사자를 적습니다.
  - 넘기는 사람과 넘겨받는 사람의 상호·대표자를 적습니다.
  - 양도 기준일과 기존 권리·의무를 누가 맡는지 적습니다.
  - 승낙하는 상대방과 양도·양수인이 모두 서명합니다.
faq:
  - q: 승낙서 없이 양도하면 어떻게 되나요?
    a: 계약에 양도 제한이 있거나 상대방이 반대하면 문제가 될 수 있습니다. 계약서를 먼저 확인하십시오.
  - q: 이미 낸 대금과 밀린 대금은 누가 맡나요?
    a: 합의로 정합니다. 기준일 전 권리·의무의 귀속을 특약란에 구체적으로 적어 두십시오.
  - q: 상대방 서명만 있으면 되나요?
    a: 양도인과 양수인의 서명도 함께 받아 두는 편이 분명합니다.
related: [claim-assignment-notice, mou-agreement, settlement-agreement, contract-performance-demand-notice]
blocks:
  - type: doc_title
    text: 계약상 지위 양도 승낙서
    spaced: false
  - type: subtitle
    text: 1. 원래 계약
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["계약 명칭", "", "체결일", ""]
      - ["승낙인(상대방)", "", "연락처", ""]
    sample_rows:
      - ["", "사무실 청소 용역계약", "", "2025-03-01"]
      - ["", "한빛물산", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 양도인과 양수인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["양도인", "", "대표자", ""]
      - ["양수인", "", "대표자", ""]
      - ["양도 기준일", "", "", ""]
    merges:
      - [2, 1, 2, 3]
    sample_rows:
      - ["", "(주)새길데이터", "", "홍길동"]
      - ["", "(주)한빛커머스", "", "김서연"]
      - ["", "2026-11-01", "", ""]
  - type: subtitle
    text: 3. 승낙 내용
  - type: para
    text: 승낙인은 위 계약에 대한 양도인의 지위를 양수인이 그대로 넘겨받는 것에 동의합니다.
  - type: textbox
    hint: "기준일 전 이미 발생한 대금·권리·의무를 누가 맡는지, 그 밖의 조건을 적으십시오."
    height_mm: 28
    sample_text: "기준일 이전에 발생한 미지급 대금은 양도인이 정산하고, 기준일 이후의 권리와 의무는 양수인이 승계합니다."
  - type: date_line
    sample_text: 2026 년   10 월    29 일
  - type: sign_line
    labels: ["양도인", "양수인", "승낙인"]
    sample_names: [홍길동, 김서연, 박민준]
  - type: notice
    text: 계약서의 양도 제한·통지 조항을 먼저 확인하고, 필요하면 전문가의 검토를 받으십시오.
