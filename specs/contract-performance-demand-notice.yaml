id: contract-performance-demand-notice
title: 계약 이행 최고서
category: legal
subcategory: notice
tags: [이행최고서, 계약이행 촉구, 이행 최고, 채무불이행 최고, 계약 이행 요청]
summary: 계약상 의무를 이행하지 않는 상대방에게 기한을 정해 이행을 요구하고 그 기록을 남기는 계약 이행 최고서 양식입니다.
usage: >
  대금을 주지 않거나 납품·공사를 미루는 상대방에게 정해진 기한까지 약속을 지키라고 서면으로 요구할 때 쓰는 문서입니다.
  계약 내용과 이행하지 않은 사항, 요구하는 이행 내용과 기한을 사실 위주로 적습니다.
  기한이 지난 뒤의 조치는 계약서와 상황에 따라 달라지므로 단정하지 말고, 중요한 사안은 내용증명으로 보내거나 전문가와 상담하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 보내는 사람과 받는 사람, 계약 이름과 날짜를 적습니다.
  - 상대방이 이행하지 않은 내용을 사실대로 적습니다.
  - 요구하는 이행 내용과 이행 기한을 날짜로 적습니다.
  - 날짜를 쓰고 서명한 뒤 보낸 기록을 남깁니다.
faq:
  - q: 이행 기한은 며칠로 정하나요?
    a: 정해진 일수는 없으며 상대방이 이행할 수 있는 현실적인 기간을 계약 내용에 맞게 정하십시오.
  - q: 꼭 내용증명으로 보내야 하나요?
    a: 필수는 아닙니다. 다만 보낸 날짜와 내용을 증명하려면 내용증명이나 이메일 기록이 도움이 됩니다.
  - q: 기한이 지나면 바로 계약이 해제되나요?
    a: 단정할 수 없습니다. 계약서 조항과 상황에 따라 달라지므로 필요하면 전문가와 상담하십시오.
related: [certified-notice, certified-notice-terminate, settlement-agreement, payment-pledge]
blocks:
  - type: doc_title
    text: 계약 이행 최고서
    spaced: false
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["보내는 사람", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["받는 사람", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "02-0000-0000"]
      - ["", "서울시 ○○구 ○○로 12", "", ""]
      - ["", "(주)새길데이터", "", "02-1111-1111"]
      - ["", "서울시 ○○구 ○○대로 34", "", ""]
  - type: subtitle
    text: 2. 계약 및 미이행 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["계약명", "", "계약일", ""]
    sample_rows:
      - ["", "물품 공급 계약", "", "2026-08-01"]
  - type: textbox
    hint: "계약에서 정한 의무와 아직 이행되지 않은 내용을 날짜와 함께 사실 위주로 적으십시오."
    height_mm: 30
    sample_text: 계약에 따라 2026-09-30까지 납품하기로 하였으나 현재까지 물품이 도착하지 않았습니다.
  - type: subtitle
    text: 3. 요구 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["요구 내용", "", "", ""]
      - ["이행 기한", "", "회신 방법", ""]
    sample_rows:
      - ["", "계약한 물품 전량의 납품", "", ""]
      - ["", "2026-11-06", "", "이메일 회신"]
  - type: para
    text: 위 기한까지 이행하여 주시기 바라며, 이후의 조치는 계약 내용과 관련 법령에 따라 검토하겠습니다.
    align: both
  - type: date_line
    sample_text: 2026 년   10 월   23 일
  - type: sign_line
    labels: ["보내는 사람"]
    sample_names: [홍길동]
  - type: notice
    text: 중요한 사안은 내용증명으로 발송하거나 전문가와 상담하십시오. 법적 판단을 대신하지 않습니다.
