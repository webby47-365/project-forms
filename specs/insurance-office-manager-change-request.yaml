id: insurance-office-manager-change-request
title: 사회보험 사업장 담당자 변경 신청서
category: public
subcategory: insurance
tags: [4대보험 담당자 변경, 사업장 담당자, 보험 업무 담당자, 담당자 교체, 사회보험 사업장]
summary: 4대보험 업무를 맡는 사업장 담당자가 바뀔 때 기존·신규 담당자와 연락처, 변경일을 적어 알리는 신청서 양식입니다.
usage: >
  인사 이동이나 퇴사로 4대보험 업무 담당자가 바뀌었을 때 각 기관에 새 담당자를 알리는 문서입니다.
  사업장 정보, 기존 담당자와 새 담당자, 변경 사유와 적용일을 적고 대표자가 서명합니다.
  기관마다 접수 방식과 필요한 서류가 다를 수 있으므로 해당 기관의 안내를 먼저 확인하십시오.
  담당자 개인정보는 연락에 필요한 항목만 적습니다.
source: original
featured: false
target_pages: 1
howto:
  - 사업장 이름과 소재지, 관리번호를 적습니다.
  - 기존 담당자와 새 담당자의 이름과 연락처를 적습니다.
  - 변경을 알리는 기관을 고르고 변경일을 적습니다.
  - 대표자가 날짜를 쓰고 서명합니다.
faq:
  - q: 4대보험 기관마다 따로 내야 하나요?
    a: 기관마다 접수 방식이 다를 수 있습니다. 알릴 기관을 체크하고 각 기관의 안내를 확인하십시오.
  - q: 새 담당자의 개인정보를 모두 적어야 하나요?
    a: 연락에 필요한 이름과 부서, 전화, 이메일만 적으면 됩니다. 그 밖의 개인정보는 적지 않습니다.
  - q: 변경일은 신청일과 달라도 되나요?
    a: 다를 수 있습니다. 새 담당자가 업무를 시작한 날을 변경일에 적으십시오.
related: [social-insurance-filing-poa, insurance-enrollment-confirmation-request, social-insurance-correction-request, workers-comp-claim-poa]
