id: gov-mail-order-change-report
title: 통신판매업 변경신고서
category: public
subcategory: permit
tags:
- 통신판매업
- 변경신고
- 사업변경
- 온라인쇼핑
- 통신판매
summary: 통신판매업 신고 후 사업 내용이 변경될 때 공정거래위원회에 제출하는 법정 신고서입니다.
usage: 통신판매업자가 신고한 상호·소재지·대표자·인터넷도메인·호스트서버 소재지 등이 바뀌었을 때 공정거래위원회 또는 시·군·구청에 내는 신고서입니다. 변경 전과 변경 후 내용을 나란히 적고 변경 사유를 씁니다. 신고증 원본을 붙이되, 잃어버렸거나 훼손했으면 그 사유를 적습니다. 수수료는 없고 처리기간은 3일입니다. 신고 기한은 제출 기관에 확인하십시오.
source: law-standard
source_note: 전자상거래 등에서의 소비자보호에 관한 법률 시행규칙 별지 제4호서식
law_ref:
  law: 전자상거래 등에서의 소비자보호에 관한 법률 시행규칙
  form_no: 별지 제4호서식
  amended: '2025-02-11'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EC%A0%84%EC%9E%90%EC%83%81%EA%B1%B0%EB%9E%98+%EB%93%B1%EC%97%90%EC%84%9C%EC%9D%98+%EC%86%8C%EB%B9%84%EC%9E%90%EB%B3%B4%ED%98%B8%EC%97%90+%EA%B4%80%ED%95%9C+%EB%B2%95%EB%A5%A0+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0004&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 공정거래위원회·시군구
  checked: '2026-09-16'
featured: false
target_pages: 1
created_by: gov-batch
howto:
- 신고인(법인)의 현재 상호, 신고번호, 소재지, 대표자 정보를 기입합니다.
- 변경 사항 항목에서 변경 전 내용과 변경 후 내용을 각각 기입합니다.
- 변경 사유를 적절히 설명합니다.
- 신고증이 있으면 원본을 첨부하거나, 분실·훼손 사유를 기입합니다.
- 신고인이 서명하고 관할 기관에 제출합니다.
faq:
- q: 모든 변경 사항을 신고해야 하나요?
  a: 신고증에 기재된 사항이 변경되면 신고해야 합니다. 신고증 재교부가 필요한 경우도 있습니다.
- q: 신고증을 분실했는데 신고할 수 있나요?
  a: 신고증 분실 사유를 명시하면 신고증 없이도 신고할 수 있습니다.
