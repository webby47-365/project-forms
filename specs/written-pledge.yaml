id: written-pledge
title: 각서
category: legal
subcategory: notice
tags: [각서, 서약서, 약속, 확약서, 시말서]
summary: 일방이 상대방에게 특정 사항을 약속하고 확인하는 각서 양식입니다.
usage: >
  금전 변제, 책임 인정, 행동 약속 등을 글로 남기고 싶을 때 약속 일방이 작성하여
  상대방과 함께 서명합니다. 각서는 합의서보다 한 쪽이 주된 의무를 지는 경우에 사용하며,
  구체적인 약속 내용과 이행 기한을 명확히 기재해야 나중에 분쟁을 줄일 수 있습니다.
  금전 약속의 경우 금액을 한글과 숫자로 함께 적고 지급 계좌를 명시하는 것이 좋습니다.
  본 서식은 참고용이며 법적 효력과 적합성은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 1
howto:
  - 약속인과 상대방 정보를 적습니다.
  - 약속하는 내용을 구체적으로 적습니다.
  - 이행 기한을 적습니다.
  - 금전 약속이면 금액을 한글과 숫자로 함께 적습니다.
  - 양쪽이 서명·날인합니다.

faq:
  - q: 각서와 합의서는 어떻게 다른가요?
    a: 각서는 한쪽이 주된 의무를 약속하는 문서이고, 합의서는 양쪽이 서로 조건을 주고받을 때 씁니다.
  - q: 각서만 있으면 법적으로 강제할 수 있나요?
    a: 내용에 따라 효력이 다를 수 있으므로, 중요한 약속이라면 변호사 등 전문가의 확인을 받는 것이 안전합니다.

related: [settlement-agreement, payment-pledge, repayment-plan]

blocks:
  - type: doc_title
    text: 각서
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["약속인(의무자)", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["상대방(권리자)", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "홍길동", "", "1990-03-02"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "김서연", "", "1992-07-19"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-5678-1234"]
  - type: subtitle
    text: 약속 내용
  - type: textbox
    hint: "약속하는 구체적인 내용, 이행 기한, 지급액이나 이행 방법을 명확하게 기재하십시오."
    height_mm: 38
    sample_text: 약속인은 2026년 9월 5일까지 마감이 지연된 보고서 제출을 완료하고, 향후 업무 마감일을 성실히 준수할 것을 약속합니다.
  - type: article
    heading: 제1조 (약속의 확인)
    lines:
      - "약속인은 위 내용을 사실 그대로 확인하며, 위 기한까지 성실하게 이행할 것을 약속한다."
  - type: article
    heading: 제2조 (책임)
    lines:
      - "약속인이 위 약속을 이행하지 않을 경우 약속인이 그에 따른 모든 책임을 진다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["약속인", "상대방"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 금전 약속의 경우 송금 기록(계좌이체 영수증)을 함께 보관하시기 바랍니다. 이행 기한이 경과한 후 미이행 상태가 지속되면 상대방이 법적 조치를 취할 수 있습니다.
