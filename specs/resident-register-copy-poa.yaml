id: resident-register-copy-poa
title: 주민등록 등·초본 발급 위임장
category: public
subcategory: family
tags: [주민등록초본위임장, 등본발급위임장, 주민등록등본대리발급, 초본대리발급, 등초본위임장]
summary: 주민등록 등본·초본 발급을 가족이나 대리인에게 맡길 때 발급 목적과 위임 범위를 적는 위임장입니다.
usage: >
  바쁘거나 거동이 불편해 주민센터에 직접 가기 어려울 때 가족·지인에게 등본이나 초본 발급을
  맡기는 경우에 쓰는 위임장입니다. 위임인과 대리인 정보, 필요한 서류 종류와 통수, 발급 목적을
  적고 위임인이 서명 또는 날인합니다. 대리 발급은 본인 신분증 사본 등 추가 서류가 요구될 수 있으므로
  발급 기관의 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 위임인의 성명과 주소, 연락처를 적습니다.
  - 대리인의 성명과 위임인과의 관계를 적습니다.
  - 등본·초본 중 필요한 서류와 통수, 발급 목적을 표시합니다.
  - 날짜를 적고 위임인이 서명 또는 날인합니다.
faq:
  - q: 등본과 초본 중 무엇을 적나요?
    a: 제출처가 요구한 서류를 적습니다. 모르면 제출처에 먼저 물어보고 표시하십시오.
  - q: 대리인 신분증도 필요한가요?
    a: 발급 기관에서 대리인 신분증과 위임인 신분증 사본을 요구할 수 있습니다. 안내를 확인하십시오.
  - q: 위임장 유효기간이 있나요?
    a: 정해진 기간은 기관마다 다릅니다. 위임 기간을 직접 적어 두면 사용 범위가 분명합니다.
related: [gov-resident-register-copy, family-certificate-issuance-poa, residence-fact-confirmation, power-of-attorney]
blocks:
  - type: doc_title
    text: 주민등록 등·초본 발급 위임장
    spaced: false
  - type: para
    text: 본인은 아래 대리인에게 주민등록 등·초본 발급 신청에 관한 권한을 위임합니다.
    align: center
  - type: subtitle
    text: 1. 위임인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-11-02"]
      - ["", "서울특별시 마포구 월드컵북로 50 101동 502호", "", ""]
      - ["", "010-1234-5678", "", ""]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "위임인과의 관계", ""]
    sample_rows:
      - ["", "김서연", "", "1988-04-17"]
      - ["", "010-3456-7890", "", "배우자"]
  - type: subtitle
    text: 3. 위임 내용
  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["서류 종류", "(   ) 주민등록 등본   (   ) 주민등록 초본   통수:      통"]
      - ["발급 목적", ""]
      - ["제출처", ""]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "(   ) 주민등록 등본   ( ✓ ) 주민등록 초본   통수:   1   통"]
      - ["", "은행 대출 서류 제출"]
      - ["", "새길은행 마포지점"]
      - ["", "2026-10-01 ~ 2026-10-07"]
  - type: kv_list
    items:
      - "대리인은 위임받은 범위 안에서만 위 서류를 발급받아 사용합니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."
  - type: date_line
    sample_text: 2026 년   10 월    1 일
  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 대리 발급 시 필요한 신분증·추가 서류는 발급 기관 안내를 확인하십시오.
