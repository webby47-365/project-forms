id: bid-withdrawal-request
title: 입찰 참가 철회서
category: public
subcategory: procure
tags: [입찰참가철회서, 입찰포기서, 입찰철회요청서, 입찰참가포기, 입찰취소요청서]
summary: 입찰 참가 신청 후 사정이 생겨 참가를 철회하거나 포기할 때 공고 정보와 철회 사유를 적어 발주처에 내는 철회서입니다.
usage: >
  입찰 공고에 참가 신청이나 서류 제출을 마친 뒤 인력·자금·일정 사정으로 참가를 이어가기 어려울 때
  발주처에 철회 의사를 문서로 남기는 서류입니다. 공고번호와 공고명, 철회 사유를 적고 대표자가
  서명 또는 날인합니다. 철회 가능 시점과 입찰보증금 처리, 참가 제한 여부는 공고문과 발주처 규정에
  따르므로 제출 전에 반드시 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 공고번호와 공고명, 발주처를 공고문과 똑같이 적습니다.
  - 입찰 참가 업체의 상호와 대표자 정보를 적습니다.
  - 철회 사유를 표시하고 필요하면 한 줄로 덧붙입니다.
  - 대표자가 서명 또는 날인한 뒤 발주처 담당자에게 냅니다.

faq:
  - q: 입찰 마감 뒤에도 철회할 수 있나요?
    a: 마감 뒤 철회는 제한될 수 있습니다. 공고문과 발주처 규정에서 철회 가능 시점을 확인하십시오.
  - q: 철회하면 입찰보증금은 돌려받나요?
    a: 보증금 처리는 공고 조건에 따라 다릅니다. 발주처에 문의하고 반환 절차는 보증금 반환 청구서로 진행합니다.
  - q: 철회 사유를 자세히 써야 하나요?
    a: 해당 항목에 표시하고 짧게 적으면 충분합니다. 사실과 다른 사유는 적지 않습니다.

related: [bid-deposit-refund-request, bid-participation-poa, integrity-pledge-bidding, gov-bid-form]

