id: shareholder-register
title: 주주명부
category: corp
subcategory: startup
tags: [주주명부, 주주현황, 주식보유현황, 법인서류]
summary: 주주의 성명·주소·보유 주식 종류와 수량, 취득일을 기재하는 상법상 주주명부입니다.
usage: >
  상법에 따라 주식회사는 주주명부를 작성해 본점에 비치해야 합니다. 주식 양도나 증자가
  있으면 변경 내용을 즉시 반영하고, 명의개서 없이는 회사에 대해 주주권을 주장할 수 없으므로
  취득일과 명의개서일을 함께 적습니다. 법인 설립등기나 세무신고, 정부지원사업 신청 시
  제출 서류로 자주 요구됩니다. 개인 식별번호 대신 생년월일만 적으십시오.
source: law-standard
source_note: 상법상 주주명부 기재사항을 참고하여 자체 제작
featured: false
target_pages: 1

howto:
  - 회사명과 법인등록번호, 기준일을 적습니다.
  - 발행주식 총수와 1주 금액을 적습니다.
  - 주주별 성명과 주소를 적습니다.
  - 보유 주식 종류와 수량을 적습니다.
  - 취득일과 명의개서일을 적습니다.

faq:
  - q: 주민등록번호를 적어야 하나요?
    a: 아니요, 개인 식별번호 대신 생년월일만 적어 개인정보 노출을 줄이십시오.
  - q: 주식을 양도하면 바로 반영되나요?
    a: 명의개서를 해야 회사에 주주권을 주장할 수 있으므로 변경 즉시 명부에 반영해야 합니다.

related: [stock-transfer-contract, shareholder-meeting-minutes, articles-of-incorporation]

blocks:
