      - ["2", "박민준", "서울 강남구", "1980-11-05", "보통주", "25,000", "25%", "2018-07-10"]
      - ["3", "(주)새길데이터", "서울 영등포구", "-", "보통주", "15,000", "15%", "2020-01-15"]
  - type: grid
