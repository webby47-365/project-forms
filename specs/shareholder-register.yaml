    text: 주주명부
  - type: grid
    widths: [16, 24, 16, 20, 24]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["회사명", "", "법인등록번호", "", "기준일"]
      - ["발행주식 총수", "", "1주 금액", "", "자본금"]
