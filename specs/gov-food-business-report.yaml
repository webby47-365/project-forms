      - 7. 수상레저사업 등록증 1부(수상구조물로 된 수상레저사업장에서 「식품위생법 시행령」 제21조제8 호가목의 휴게음식점영업 및 같은 호 바목의 제과점영업을 하려는 경우만 해당합니다)
    - - l
      - 8. 「국유재산법 시행규칙」 제14조제3항에 따른 국유재산 사용허가서 1부(국유철도의 정거장시설 또는 군사시설에서 「식품위생법 시행령」 제21조제2호의 즉석판매제조ㆍ가공업의 영업, 같은 조 제5호의 식품소분ㆍ판매업의 영업, 같은 조 제8호가목의 휴게음식점영업, 같은 호 나목의 일반음식점영업 또는 같은 호 바목의 제과점영업을 하려는 경우만 해당합니다)
    - - l
      - 9. 해당 도시철도사업자와 체결한 도시철도시설 사용계약에 관한 서류 1부(도시철도의 정거장시설에서 「식품위생법 시행령」 제21조제2호의 즉석판매제조ㆍ가공업의 영업, 같은 조 제5호의 식품소분ㆍ판매업의 영업, 같은 조 제8호가목의 휴게음식점영업, 같은 호 나목의 일반음식점영업 또는 같은 호 바목의 제과점영업을 하려는 경우만 해당합니다)
    - - l
      - 10. 예비군식당 운영계약에 관한 서류 1부(군사시설에서 「식품위생법 시행령」 제21조제8호나목의 일반음식점영업을 하려는 경우만 해당합니다)
    - - l
      - 11. 영업장과 연접하는 외부 장소를 영업장으로 사용하려는 경우에는 해당 외부 장소에 대해 정당한 사용 권한이 있음을 증명하는 서류(「식품위생법 시행령」 제21조제8호가목의 휴게음식점영업, 같 은 호 나목의 일반음식점영업 또는 같은 호 바목의 제과점영업을 하려는 자가 해당 외부 장소에서 음식류 등을 제공하는 경우만 해당합니다)
    - - l
      - 12. 해당 영업장에서 영업을 할 수 있음을 증명하는 「식품위생법 시행규칙」 별표 15의2에 따른 서류 1부[음식판매자동차(「자동차관리법 시행규칙」 별표 1 제1호ㆍ제2호 및 비고 제1호가목에 따른 이동용 음식판매 용도인 소형ㆍ경형화물자동차 또는 같은 표 제2호에 따른 이동용 음식판매 용도인 특수용도형 특수자동차)를 사용하여 「식품위생법 시행령」
        제21조제8호가목의 휴게음식점영업, 같은 호 나목의 일반음식점영업 또는 같은 호 바목의 제과점영업을 하려는 경우만 해당합니다]
    - - l
      - 13. 「어린이놀이시설 안전관리법」 제12조제1항 및 같은 법 시행령 제7조제4항에 따른 어린이놀이시설 설치검사합격증 또는 「어린이놀이시설 안전관리법」 제12조제2항 및 같은 법 시행령 제8조제5항에 따른 어린이놀이시설 정기시설검사합격증(「식품위생법 시행령」 제21조제8호가목, 나목, 마목 또는 바목의 영업을 하려는 경우로서 해당 영업장에 어린이놀이시설을
        설치하는 경우만 해당합니다)
    - - l
      - 14. 공유주방 소재지, 면적 등이 기재된 공유주방 사용계약에 관한 서류(「식품위생법 시행령」제21 조제9호의 공유주방 운영업자의 공유주방을 사용할 경우만 해당합니다)
    - - l
      - 15. 「마리나항만의 조성 및 관리 등에 관한 법률 시행규칙」 제22조제5항에 따른 마리나선박 대여업 등록증(「마리나항만의 조성 및 관리 등에 관한 법률」에 따른 마리나선박에서 영 제21조제8호가목, 나목 또는 바목에 따른 영업을 하려는 경우만 해당합니다)
