    - - l
      - 3. 영업신고를 하려는 자는 「식품위생법 시행규칙」 제42조에서 정한 사항 외에 해당 영업신고와 관련된 다음 법령에 위반되거 나 저촉되는지 여부를 검토하여야 합니다.
    - - l
      - '- 「국토의 계획 및 이용에 관한 법률」, 「하수도법」, 「농지법」, 「학교보건법」, 「옥외광고물 등의 관리와 옥외광고산업 진흥에 관한 법률」, 「하천법」, 「한강수계 상수원수질개선 및 주민지원 등에 관한 법률」, 「물환경보전법」, 「소음ㆍ진 동관리법」, 「관광진흥법」, 「학원의 설립ㆍ운영 및 과외교습에 관한 법률」, 「청소년 보호법」, 「근로기준법」,
        「산업집 적활성화 및 공장설립에 관한 법률」, 「주차장법」, 「지방세법」 등 그 밖의 관련 법령'
    - - l
