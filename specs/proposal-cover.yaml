id: proposal-cover
title: 제안서 표지
category: corp
subcategory: sales
tags: [제안서표지, 제안서양식, 사업제안서, 입찰제안서]
summary: 제안명·제안대상·제안사 정보와 제출일자를 담은 제안서 표지 및 목차 양식입니다.
usage: >
  입찰이나 영업 제안 시 제안서 첫 장에 붙이는 표지입니다. 발주처가 요구하는 제안서 양식이
  있으면 그 기준을 우선 따르고, 없으면 이 표지를 쓰십시오. 제안명은 발주 공고의 사업명을
  그대로 인용해야 심사에서 누락되지 않습니다. 대외비 표시가 필요한 경우 우측 상단 보안등급
  칸에 기재하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 제안명을 발주 공고의 사업명 그대로 적습니다.
  - 제안 대상 기관과 제안사 정보를 적습니다.
  - 제출일자를 확인해 적습니다.
  - 보안등급이 필요하면 표시합니다.

faq:
  - q: 제안명은 마음대로 정해도 되나요?
    a: 아니요, 발주 공고의 사업명을 그대로 인용해야 심사에서 누락되지 않습니다.
  - q: 대외비 표시는 언제 하나요?
    a: 제안서 내용에 외부 공개를 제한할 정보가 있을 때 우측 상단 보안등급 칸에 표시합니다.

