  - type: grid
    widths: [60, 20, 20]
    label_cols: [1]
    row_height_mm: 8
    rows:
      - ["", "보안등급", "대외비 / 일반"]
    sample_rows:
      - ["", "", ""]
  - type: spacer
    height_pt: 30
  - type: para
    text: 제안서
    align: center
    size: 14
    bold: true
    space_after: 6
  - type: doc_title
    text: 제안명 기재
    spaced: false
  - type: spacer
    height_pt: 24
  - type: grid
    widths: [22, 78]
    label_cols: [0]
    row_height_mm: 11
    rows:
      - ["제안 대상 (발주처)", ""]
      - ["사업명 / 공고번호", ""]
