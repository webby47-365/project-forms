id: recommendation-letter
title: 추천서
category: personal
subcategory: career
tags: [추천서, 추천서 양식, 입사 추천서, 학업 추천서, 추천인 의견서]
summary: 추천인과 피추천인의 관계, 역량 평가와 추천 사유를 기재하는 추천서 양식입니다.
usage: >
  취업·진학·장학 심사 등에 제출하기 위해 추천인이 작성하는 서류입니다. 피추천인과 어떤 관계에서
  얼마나 오래 함께했는지 먼저 밝히면 신뢰도가 높아집니다. 추천 사유는 막연한 칭찬보다 구체적인
  사례와 결과를 들어 적으십시오. 항목별 평가표는 근거가 되는 사례와 함께 작성하고, 보완이
  필요한 부분도 균형 있게 쓰면 진정성이 전달됩니다. 추천인의 소속과 직위, 연락처를 정확히 적고
  서명·날인한 뒤 제출처가 요구하는 방식(밀봉 여부 등)을 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 피추천인 정보와 추천인과의 관계를 적습니다.
  - 함께한 기간과 계기를 적습니다.
  - 항목별 역량을 구체적인 사례와 함께 평가합니다.
  - 추천 사유를 정리해 적습니다.
  - 추천인 정보를 적고 서명·날인합니다.

faq:
  - q: 부족한 점도 적어야 하나요?
    a: 보완이 필요한 부분을 균형 있게 적으면 오히려 추천서의 신뢰도가 높아집니다.
  - q: 밀봉해서 제출해야 하나요?
    a: 제출처마다 방식이 다르므로 밀봉 여부와 제출 방법을 미리 확인하십시오.

blocks:
  - type: doc_title
    text: 추천서
  - type: subtitle
    text: 1. 피추천인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", ""]
      - ["소속(학교·직장)", "", "직위(학년)", ""]
      - ["지원 분야", "", "제출처", ""]
    sample_rows:
      - ["", "김서연", "", "1999-02-14"]
      - ["", "한국대학교", "", "4학년"]
      - ["", "데이터분석 직무", "", "(주)새길데이터"]
  - type: subtitle
    text: 2. 추천인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "소속", ""]
      - ["직위", "", "연락처", ""]
      - ["피추천인과의 관계", "", "함께한 기간", ""]
    sample_rows:
      - ["", "박민준", "", "한빛물산"]
      - ["", "팀장", "", "010-1234-5678"]
      - ["", "지도교수", "", "2023.03~2026.08"]
  - type: subtitle
    text: 3. 역량 평가
  - type: table
    widths: [22, 12, 12, 12, 12, 30]
    header: [평가 항목, 탁월, 우수, 보통, 미흡, 근거 사례]
    empty_rows: 2
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["성실성", "", "O", "", "", "2년간 결근 없이 업무 수행"]
      - ["문제해결력", "O", "", "", "", "데이터 오류 원인 분석 및 해결"]
  - type: subtitle
    text: 4. 추천 사유
  - type: textbox
    hint: "구체적인 경험과 성과를 들어 추천 사유를 기재하십시오."
    height_mm: 56
    sample_text: 김서연 씨는 지난 2년간 데이터분석팀에서 함께 근무하며 맡은 업무를 기한 내에 정확하게 처리하였습니다. 특히 지난해 매출 데이터 오류를 스스로 발견하고 원인을 분석하여 해결한 사례가 인상적이었습니다. 동료들과의 협업에서도 적극적으로 의견을 나누어 팀 성과에 기여하였습니다. 이러한 역량을 바탕으로 지원 분야에서도 좋은 성과를 낼 것이라 믿고 추천합니다.
  - type: textbox
    hint: "보완이 필요한 점이나 그 밖에 전하고 싶은 의견을 기재하십시오."
    height_mm: 22
    sample_text: 세부 일정 관리에 다소 어려움을 겪는 경우가 있었으나, 최근에는 스스로 점검표를 만들어 개선하는 모습을 보였습니다.
  - type: para
    text: 위와 같이 추천합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    label: 추천인
    sample_names: [박민준]
  - type: notice
    text: 제출처에 따라 밀봉 제출이나 직접 발송이 요구될 수 있으므로 제출 방식을 확인하십시오.
