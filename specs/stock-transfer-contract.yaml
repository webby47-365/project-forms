id: stock-transfer-contract
title: 주식 양도양수 계약서
category: corp
subcategory: startup
tags: [주식양도양수계약서, 주식양도계약, 지분양도계약서, 비상장주식양도, 법인서류]
summary: 비상장 주식의 양도대금·지급방법·명의개서 절차를 정한 주식 양도양수 계약서입니다.
usage: >
  비상장회사의 주주가 보유 주식을 다른 사람에게 넘길 때 작성하는 계약서입니다. 양도 대상
  주식의 종류·수량·액면가를 정확히 특정하고, 양도대금과 지급방법, 대금 지급과 명의개서의
  선후 관계를 명확히 적어야 분쟁을 막을 수 있습니다. 정관에 주식 양도를 이사회 승인 등으로
  제한하는 경우가 있으므로 계약 전에 정관을 확인하고, 지분 비율이 높은 거래는 법무사·
  변호사의 검토를 받으십시오.
source: original
featured: false
created_by: agent
status: published
version: 1
target_pages: 2
howto:
  - 양도인과 양수인의 인적사항을 적습니다.
  - 양도할 주식의 종류와 수량, 액면가를 특정합니다.
  - 양도대금과 지급방법, 지급기일을 정합니다.
  - 대금 지급과 명의개서의 순서를 명확히 적습니다.
  - 서명 날인 후 정관상 제한 여부를 확인합니다.

faq:
  - q: 정관 확인은 왜 필요한가요?
    a: 이사회 승인 등으로 주식 양도를 제한하는 회사가 있어 계약 전에 확인해야 합니다.
  - q: 명의개서는 누가 신청하나요?
    a: 통상 양수인이 회사에 청구하며, 계약서에 그 절차를 명시해 두면 좋습니다.

related: [shareholder-register, articles-of-incorporation, board-minutes]

blocks:
  - type: doc_title
    text: 주식 양도양수계약서
    spaced: false

  - type: para
    text: 양도인과 양수인은 아래 주식에 관하여 다음과 같이 양도양수계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["양도인", "성명(법인명)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["양수인", "성명(법인명)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "1975-03-11", ""]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678", ""]
      - ["", "박민준", "", "1988-07-22", ""]
      - ["", "서울특별시 강남구 테헤란로 152", "", "010-2345-6789", ""]

  - type: subtitle
    text: 양도 주식의 표시
  - type: table
    widths: [20, 20, 25, 35]
    header: [주식 종류, 수량, 1주 액면가, 비고]
    empty_rows: 2
    row_height_mm: 8
    sample_rows:
      - ["보통주", "5,000주", "5,000원", "전체 지분의 10%"]

  - type: article
    heading: 제1조 (목적)
    lines:
      - "양도인은 위 주식을 양수인에게 양도하고, 양수인은 이를 양수하며 양도대금을 지급한다."

  - type: article
    heading: 제2조 (양도 주식의 표시)
    lines:
      - "양도 대상 주식의 종류·수량·액면가는 위 표와 같다."
      - "양도인은 위 주식에 제3자의 담보권이나 처분 제한이 없음을 확인한다."

  - type: article
    heading: 제3조 (양도대금과 지급방법)
    lines:
      - "양도대금은 금                                 원정(₩                       )으로 한다."
      - "양수인은 계약일로부터 30일 내에 양도인이 지정한 계좌로 전액을 지급한다."

  - type: article
    heading: 제4조 (명의개서)
    lines:
      - "양도인은 대금 수령 후 지체 없이 회사에 명의개서를 청구하는 데 필요한 서류를 양수인에게 제공한다."

  - type: article
    heading: 제5조 (진술과 보장)
    lines:
      - "양도인은 위 주식에 대한 적법한 소유권을 가지며, 제3자의 권리나 법적 분쟁이 없음을 보증한다."

  - type: page_break

  - type: article
    heading: 제6조 (선행조건)
    lines:
      - "본 계약의 효력 발생은 회사 정관에서 정한 이사회 승인 등 필요한 절차의 완료를 조건으로 한다."

  - type: article
    heading: 제7조 (계약의 해제)
    lines:
      - "당사자 일방이 본 계약의 주요 의무를 위반하고 상당한 기간 내에 시정하지 않는 경우 상대방은 계약을 해제할 수 있다."

  - type: article
    heading: 제8조 (비밀유지)
    lines:
      - "당사자는 본 계약 체결 사실 및 내용을 상대방의 동의 없이 제3자에게 공개하지 아니한다."

  - type: article
    heading: 제9조 (관할법원)
    lines:
      - "본 계약과 관련한 분쟁은 민사소송법상 관할법원을 관할법원으로 한다."

  - type: para
    text: 본 계약을 증명하기 위하여 계약서 2통을 작성하고 각자 서명·날인한 후 각 1통씩 보관한다.
    align: center
    size: 10

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    labels: ["양도인", "양수인"]
    sample_names: [김서연, 박민준]

  - type: notice
    text: 본 서식은 참고용입니다. 정관상 양도 제한 규정이 있거나 지분 비율이 높은 거래는 법무사·변호사의 검토를 받으십시오.
