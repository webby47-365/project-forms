id: blood-transfusion-consent
title: 수혈 동의서
category: welfare
subcategory: consent
tags: [수혈동의서, 수혈전동의서, 혈액제제동의서, 수혈설명동의서]
summary: 수혈 전 환자에게 설명한 사항과 동의 여부를 기록하는 수혈 동의서 양식입니다.
usage: >
  의료법 제24조의2에 따라 수혈을 시행하기 전 환자(또는 법정대리인)에게 수혈의 필요성과
  부작용 위험을 설명하고 서면 동의를 받을 때 사용합니다. 설명한 의료인의 성명과 설명 일시,
  예정된 혈액제제 종류를 반드시 기재하고, 환자가 각 설명 항목을 이해했는지 확인란에
  표시합니다. 기관별로 정한 법정 서식이 있으면 해당 서식을 우선 사용하십시오.
source: law-standard
source_note: 의료법 제24조의2에 따른 수술등에 관한 설명·동의 기재사항을 수혈에 준용해 반영
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 환자 정보와 진단명, 예정된 혈액제제 종류를 적습니다.
  - 설명한 의료인의 성명과 설명 일시를 기재합니다.
  - 수혈의 필요성과 부작용 위험 등 설명 항목을 확인란에 표시합니다.
  - 환자 또는 법정대리인이 동의 여부에 서명합니다.

faq:
  - q: 수혈을 거부할 수도 있나요?
    a: 가능합니다. 거부 시 예상되는 위험을 설명받은 뒤 거부 의사를 별도로 기재합니다.
  - q: 응급 상황에서도 동의서가 필요한가요?
    a: 의식이 없는 응급환자는 사후에 보호자 동의를 받거나 병원 내부 규정에 따라 처리합니다.

blocks:
  - type: doc_title
    text: 수혈 동의서
    spaced: true

  - type: subtitle
    text: 1. 환자 정보

  - type: grid
    widths: [14, 22, 14, 18, 14, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", "", "등록번호", ""]
      - ["진단명", "", "", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1958-03-02", "", "00-000000"]
      - ["", "위장관 출혈", "", "", "", ""]

  - type: subtitle
    text: 2. 수혈 예정 내용

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["혈액제제 종류", "", "예정 수량", ""]
      - ["예정 일시", "", "담당의", ""]
    sample_rows:
      - ["", "농축적혈구", "", "2 단위"]
      - ["", "2026-09-20 10:00", "", "김현우 교수"]

  - type: subtitle
    text: 3. 설명받은 사항 확인

  - type: table
    widths: [44, 28, 28]
    header: [설명 항목, 설명 여부, 환자 이해 확인]
    rows:
      - ["수혈의 목적과 필요성", "", ""]
      - ["수혈 방법과 절차", "", ""]
      - ["수혈 부작용과 감염 위험", "", ""]
      - ["수혈 거부 시 예상되는 위험", "", ""]
      - ["대체 가능한 치료법", "", ""]
    empty_rows: 0
    row_height_mm: 8
    body_align: center

  - type: subtitle
    text: 4. 설명한 의료인

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "면허번호", ""]
      - ["설명 일시", "", "서명", ""]
    sample_rows:
      - ["", "김현우", "", "12345"]
      - ["", "2026-09-18 16:30", "", "(서명)"]

  - type: para
    text: 본인(법정대리인)은 위 수혈에 관한 설명을 충분히 듣고 이해하였으며, 수혈 시행에 동의합니다.
    align: center
    size: 10.5
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    18 일

  - type: grid
    widths: [20, 26, 18, 36]
    label_cols: [0, 2]
    row_height_mm: 10
    rows:
      - ["환자 본인", "(서명 또는 인)", "관계", ""]
      - ["법정대리인", "(서명 또는 인)", "연락처", ""]
    sample_rows:
      - ["", "", "", "본인"]
      - ["", "", "", "010-1234-5678"]

  - type: notice
    text: 개인정보(건강정보 포함)의 수집 목적은 수혈 동의 확인이며, 보유기간은 관계 법령에 따라 보관한 후 파기합니다.

  - type: notice
    text: 본 서식은 참고용이며, 의학적 설명과 판단은 담당 의료진이 수행합니다. 기관별 양식이 따로 있는 경우 해당 기관 양식을 사용하십시오.
