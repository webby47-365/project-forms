id: year-end-dependent-income-statement
title: 연말정산 부양가족 소득 확인서
category: corp
subcategory: hr
tags: [연말정산, 부양가족소득, 소득확인, 인적공제, 소득요건]
summary: 연말정산 때 부양가족의 연간 소득 내역을 직접 적어 회사에 알리는 소득 확인서입니다.
usage: >
  부양가족 공제를 받으려는 근로자가 가족의 한 해 소득 여부를 담당자에게 알릴 때 쓰는 서식입니다.
  가족별 관계와 소득 종류, 연간 금액을 적고 서명합니다. 공제 가능 여부는 나이와 소득 요건에 따라
  달라지므로 국세청 안내와 회사 기준을 확인하십시오. 이 서식은 소득 내역을 알리는 틀이며 공제 여부를
  판단하지 않습니다. 주민등록번호는 적지 않고 생년월일만 적습니다.
source: original
featured: false
target_pages: 1
howto:
  - 신고자 성명과 소속 부서를 적습니다.
  - 가족별 관계와 생년월일을 표에 적습니다.
  - 소득 종류와 연간 금액을 적고 없으면 0원으로 적습니다.
  - 확인 문구를 읽고 날짜와 서명을 적습니다.
faq:
  - q: 소득이 없는 가족도 적나요?
    a: 네, 소득이 없으면 금액란에 0원이라고 적어 두면 담당자가 확인하기 쉽습니다.
  - q: 증빙도 같이 내야 하나요?
    a: 회사마다 다릅니다. 담당자 안내에 따라 필요한 증빙을 별도로 제출하십시오.
  - q: 이 서식으로 공제가 확정되나요?
    a: 아닙니다. 공제 여부는 요건에 따라 정해지니 국세청 기준과 회사 안내를 확인하십시오.
related: [year-end-dependent-change-notice, dependent-support-fact-confirmation, year-end-tax-checklist, family-relationship-confirmation]
blocks:
  - type: doc_title
    text: 연말정산 부양가족 소득 확인서
    spaced: false
  - type: subtitle
    text: 1. 신고자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "소속 부서", ""]
      - ["사번", "", "연락처", ""]
    sample_rows:
      - ["", "박민준", "", "영업지원팀"]
      - ["", "A-1024", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 부양가족 소득 내역
  - type: table
    widths: [7, 14, 12, 19, 18, 15, 15]
    header: ["No", 성명, 관계, 생년월일, 소득 종류, 연간 금액, 비고]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "박영수", "부", "1952-01-15", "연금소득", "8,400,000", ""]
      - ["2", "김영희", "모", "1955-03-02", "없음", "0", ""]
      - ["3", "박서준", "동생", "2004-06-11", "아르바이트", "3,200,000", ""]
  - type: subtitle
    text: 3. 전달 사항
  - type: textbox
    hint: "소득과 관련해 담당자에게 알릴 내용을 적으십시오."
    height_mm: 16
    sample_text: "연금소득 외 다른 소득은 없으며, 증빙은 담당자 안내에 따라 제출하겠습니다."
  - type: para
    text: 위 소득 내역이 사실과 다름이 없음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   12 일
  - type: sign_line
    label: 신고자
    sample_names: [박민준]
  - type: notice
    text: 공제 대상 여부는 국세청 기준과 회사 안내를 확인하십시오.
