id: remote-work-request
title: 재택근무 신청서
category: corp
subcategory: hr
tags: [재택근무 신청서, 원격근무, 재택근무 승인, 유연근무, 홈오피스]
summary: 재택근무 기간·근무장소·업무계획과 연락체계를 기재해 결재를 받는 신청서입니다.
usage: >
  집이나 외부 장소에서 근무하기 위해 사전에 승인을 받는 사내 신청서입니다. 신청 기간과
  근무시간을 명확히 적고, 해당 기간에 수행할 업무와 산출물을 구체적으로 기재해야 승인이
  수월합니다. 업무시간 중 연락 가능한 수단과 응답 기준을 반드시 적고, 회사 자료를 외부에서
  다루는 만큼 보안 서약란도 빠짐없이 확인하십시오. 부서 사정으로 출근이 필요한 날은 비고에
  표시합니다. 사내 유연근무 규정에서 정한 신청 기한보다 여유 있게 제출하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 소속과 성명, 신청일자를 적습니다.
  - 재택근무 희망 기간과 근무시간을 적습니다.
  - 해당 기간에 수행할 업무와 산출물을 구체적으로 적습니다.
  - 연락 가능한 수단과 보안 서약을 확인하고 결재를 받습니다.

faq:
  - q: 출근이 필요한 날은 어떻게 표시하나요?
    a: 부서 사정으로 출근이 필요한 날은 비고란에 별도로 표시하면 됩니다.
  - q: 신청은 얼마나 미리 해야 하나요?
    a: 사내 유연근무 규정에서 정한 기한보다 여유 있게 미리 제출하는 것이 좋습니다.

related: [work-report-weekly, leave-request, overtime-application]

blocks:
  - type: doc_title
    text: 재택근무 신청서
  - type: grid
    widths: [16, 22, 14, 20, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["소속(부서)", "", "직위", "", "성명", ""]
      - ["신청일자", "", "사번", "", "연락처", ""]
    sample_rows:
      - ["", "전략기획팀", "", "대리", "", "홍길동"]
      - ["", "2026-09-13", "", "2021015", "", "010-1234-5678"]
  - type: subtitle
    text: 1. 신청 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
    rows:
      - ["재택근무 기간", "20    년    월    일 ~ 20    년    월    일 (총      일)", "", ""]
      - ["근무형태", "전일 재택 / 부분 재택", "근무시간", "    시    분 ~     시    분"]
      - ["근무장소", "", "", ""]
      - ["신청사유", "", "출근 필요일", ""]
    sample_rows:
      - ["", "2026년 10월 5일 ~ 2026년 10월 9일 (총 5일)", "", ""]
      - ["", "", "", "09시 00분 ~ 18시 00분"]
      - ["", "자택 (서울특별시 마포구 월드컵북로 100)", "", ""]
      - ["", "보고서 작성 업무 집중", "", "매주 수요일"]
  - type: subtitle
    text: 2. 업무 수행 계획
  - type: table
    widths: [14, 30, 26, 15, 15]
