      - ["10/6", "데이터 분석 및 검토", "분석 결과 요약", "메신저 보고", ""]
  - type: subtitle
    text: 3. 연락체계 및 보안
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
