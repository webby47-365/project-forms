id: bank-account-poa
title: 금융거래(계좌) 위임장
category: personal
subcategory: life
tags: [금융거래위임장, 계좌위임장, 통장위임장, 은행업무위임장, 예금위임장]
summary: 본인이 은행을 직접 방문하기 어려울 때 계좌 관련 업무를 대리인에게 맡기는 금융거래 위임장입니다.
usage: >
  입원·거동 불편·원거리 거주 등의 사유로 본인이 은행 창구를 직접 방문할 수 없을 때,
  예금 인출·계좌 조회·통장(카드) 재발급 등의 업무를 가족 등 대리인에게 맡기기 위해 쓰는
  서류입니다. 위임 범위를 구체적으로 적을수록 은행 창구에서 처리가 수월하며, 은행에
  따라 본인 확인을 위해 위임인의 신분증 사본이나 인감증명서를 추가로 요구할 수 있습니다.
  방문 전에 해당 은행 지점에 필요한 서류를 미리 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 위임인(계좌 명의인)의 인적사항을 적습니다.
  - 대리인의 인적사항을 정확히 적습니다.
  - 거래 은행과 계좌번호, 위임 범위를 표시합니다.
  - 위임인이 서명 또는 날인하고 신분증 사본을 함께 준비합니다.

faq:
  - q: 인감증명서도 같이 가져가야 하나요?
    a: 은행과 거래 종류(고액 인출 등)에 따라 요구할 수 있어 방문 전 해당 지점에 확인하십시오.
  - q: 위임장 하나로 여러 계좌를 위임할 수 있나요?
    a: 계좌마다 위임 범위가 다를 수 있어, 계좌별로 위임장을 작성하는 편이 안전합니다.
  - q: 고액 인출도 대리인이 할 수 있나요?
    a: 은행이 고액 거래에 대해 본인 확인을 강화할 수 있어 사전에 가능 여부와 한도를 확인하십시오.

related: [power-of-attorney, seal-certificate-poa, family-certificate-issuance-poa]

