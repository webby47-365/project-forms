id: tax-data-inquiry-consent
title: 세무 자료 조회 동의서
category: public
subcategory: tax
tags: [세무자료조회동의서, 세무대리인, 홈택스조회동의, 세무조정자료, 신고자료조회]
summary: 세무대리인이나 가족이 신고·상담에 필요한 세무 자료를 대신 조회·수집하도록 허락하는 동의서 양식입니다.
usage: >
  세무사 사무실이나 가족, 회계 담당자에게 신고에 필요한 자료를 대신 모으게 할 때 쓰는 동의서입니다.
  동의하는 사람의 인적사항과 자료를 조회할 사람, 조회할 자료의 종류와 목적, 동의 기간을 적습니다.
  조회 목적과 기간을 좁게 적을수록 안전하며, 기간이 끝나면 자료를 폐기하도록 요청하는 것이 좋습니다.
  실제 조회 권한은 홈택스 등 해당 기관의 위임·동의 절차를 따르므로 제출처 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 동의하는 사람의 이름과 연락처를 적습니다.
  - 자료를 조회할 사람(세무대리인 등)을 적습니다.
  - 조회할 자료의 종류와 사용 목적을 표시합니다.
  - 동의 기간을 적고 날짜와 서명을 합니다.
faq:
  - q: 이 동의서만으로 홈택스 조회가 되나요?
    a: 아닙니다. 실제 조회는 해당 기관의 위임·동의 절차를 따라야 하므로 제출처 안내를 확인하십시오.
  - q: 동의 기간은 얼마로 적는 게 좋나요?
    a: 신고 업무가 끝나는 시점까지로 짧게 적는 편이 안전합니다. 연장은 새로 작성합니다.
  - q: 조회한 자료는 어떻게 되나요?
    a: 목적 달성 후 폐기를 요청할 수 있도록 하단에 폐기 요청 칸을 두었습니다.
related: [income-tax-filing-poa, vat-filing-poa, withholding-tax-filing-poa, tax-clearance-certificate-poa]
blocks:
  - type: doc_title
    text: 세무 자료 조회 동의서
    spaced: false
  - type: subtitle
    text: 1. 동의인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "구분", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-03-02"]
      - ["", "010-1234-5678", "", "개인사업자"]
      - ["", "서울시 중구 세종대로 1길 10", "", ""]
  - type: subtitle
    text: 2. 조회 수임인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명·상호", "", "연락처", ""]
      - ["관계", "", "사무소 주소", ""]
    sample_rows:
      - ["", "한빛세무회계", "", "02-123-4567"]
      - ["", "세무대리인", "", "서울시 중구 퇴계로 5길 3"]
  - type: subtitle
    text: 3. 조회 내용
  - type: table
    widths: [8, 32, 40, 20]
    header: ["No", 조회 자료, 사용 목적, 대상 기간]
    empty_rows: 4
    row_height_mm: 8
    sample_rows:
      - ["1", "부가가치세 신고 내역", "부가세 신고서 작성", "2026년 1기"]
      - ["2", "사업용 카드 사용 내역", "경비 증빙 정리", "2026년 1월~6월"]
      - ["3", "원천징수 신고 내역", "지급명세서 작성", "2026년 상반기"]
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["동의 기간", "", "폐기 요청", ""]
    sample_rows:
      - ["", "2026.10.12~11.30", "", "업무 종료 후 폐기"]
  - type: para
    text: 위 조회 수임인이 위 범위의 세무 자료를 조회·수집하여 위 목적에만 사용하는 것에 동의합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   12 일
  - type: sign_line
    labels: ["동의인"]
    sample_names: [홍길동]
  - type: notice
    text: 실제 조회 권한은 해당 기관의 절차를 따릅니다. 제출처 안내를 확인하십시오.
