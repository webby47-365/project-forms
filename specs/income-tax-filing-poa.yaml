id: income-tax-filing-poa
title: 종합소득세 신고 위임장
category: public
subcategory: tax
tags: [종합소득세신고위임장, 세무대리위임장, 소득세신고위임, 세무사위임장, 종합소득세위임장]
summary: 종합소득세 신고를 세무대리인에게 맡길 때 납세자 정보와 위임 범위를 적는 위임장입니다.
usage: >
  사업소득·프리랜서 소득 등이 있어 종합소득세를 신고해야 하는 납세자가, 신고서 작성과
  제출을 세무대리인(세무사)에게 맡길 때 쓰는 서류입니다. 위임 범위에 홈택스 전자신고나
  서류 열람·수령까지 포함할지 명확히 적어야 세무대리인이 필요한 절차를 대신 진행할 수
  있습니다. 위임 기간을 정해 두면 신고 이후 불필요하게 권한이 남는 것을 막을 수 있습니다.
source: original
featured: false
target_pages: 1

howto:
  - 위임인(납세자)의 인적사항과 사업자등록번호를 적습니다.
  - 세무대리인의 사무소명과 세무사등록번호를 적습니다.
  - 신고 대상 연도와 위임 범위를 적습니다.
  - 위임 기간을 정하고 서명 또는 날인합니다.

faq:
  - q: 홈택스 전자신고 권한도 위임할 수 있나요?
    a: 위임 범위에 홈택스 전자신고와 서류 수령을 함께 적으면 위임할 수 있습니다.
  - q: 위임장 원본을 세무서에 내야 하나요?
    a: 세무대리인이 보관하는 것이 일반적이나, 세무서가 확인을 요청하면 제시할 수 있어야 합니다.
  - q: 위임 기간이 끝나면 다시 작성해야 하나요?
    a: 네. 다음 신고분부터는 위임 기간을 새로 정해 위임장을 다시 작성하는 것이 안전합니다.

related: [gov-business-registration-individual, vat-filing-document-confirmation, power-of-attorney]

blocks:
  - type: doc_title
    text: 종합소득세 신고 위임장
    spaced: false

  - type: para
    text: 본인은 아래 세무대리인에게 종합소득세 신고에 관한 권한을 위임합니다.
    align: center
    size: 10.5

  - type: subtitle
    text: 1. 위임인 (납세자)

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명(상호)", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "사업자등록번호", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-06-14"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", "000-00-00000"]

  - type: subtitle
    text: 2. 수임인 (세무대리인)

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["사무소명", "", "세무사 성명", ""]
      - ["세무사등록번호", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "새길세무회계", "", "김서연"]
      - ["", "제12345호", "", "010-9876-5432"]
      - ["", "서울특별시 영등포구 여의대로 50", "", ""]

  - type: subtitle
    text: 3. 위임 내용

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["신고 대상 연도", "", "과세기간", ""]
      - ["위임 범위", "종합소득세 신고서 작성·제출 및 관련 서류 열람·수령", "", ""]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일", "", ""]
    sample_rows:
      - ["", "2025년 귀속분", "", "2025.1.1~2025.12.31"]
      - ["", "종합소득세 신고서 작성·제출 및 홈택스 전자신고·서류 수령", "", ""]
      - ["", "2026년 5월 1일 ~ 2026년 5월 31일", "", ""]

  - type: kv_list
    items:
      - "수임인은 위임받은 범위를 벗어나 자료를 사용하거나 제3자에게 제공하지 않습니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."

  - type: para
    text: 위 위임 내용은 본인의 의사에 따른 것임을 확인합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년    9 월   18 일

  - type: sign_line
    labels: ["위임인", "수임인(세무대리인)"]
    sample_names: [홍길동, 김서연]

  - type: notice
    text: 신고 기한과 제출 서류는 관할 세무서·홈택스 안내를 확인하십시오.
