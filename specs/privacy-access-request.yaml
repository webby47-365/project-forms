id: privacy-access-request
title: 개인정보 열람 요구서
category: public
subcategory: consent
tags: [개인정보열람, 열람요구서, 정보주체, 개인정보처리현황, 열람청구]
summary: 기관이나 업체가 보유한 내 개인정보의 열람을 요구할 때 쓰는 개인정보 열람 요구서 양식입니다.
usage: >
  병원·학원·회사·쇼핑몰 등이 내 개인정보를 어떤 항목으로 보유하고 있는지 확인하고 싶을 때 해당 기관에 내는 요구서입니다.
  요구하는 사람의 정보, 열람을 요구하는 개인정보의 범위, 받아볼 방법을 적어 제출합니다. 기관은 본인 확인 후 정해진
  기한 안에 열람 여부를 알려 주는 것이 일반적이므로 기한과 접수 방법은 기관 안내를 확인하십시오. 주민등록번호는
  적지 않고 생년월일로 구분합니다.
source: original
featured: false
target_pages: 1
howto:
  - 요구하는 기관의 이름과 담당 부서를 적습니다.
  - 본인의 이름, 생년월일, 연락처를 적습니다.
  - 열람하고 싶은 개인정보의 범위를 적습니다.
  - 열람 방법을 고르고 날짜를 적어 서명합니다.
faq:
  - q: 열람 요구를 하면 바로 볼 수 있나요?
    a: 기관이 본인 확인을 한 뒤 처리합니다. 처리 기한과 방법은 기관 안내를 확인하십시오.
  - q: 열람 요구에 비용이 드나요?
    a: 기관마다 다릅니다. 수수료 여부는 접수처에 먼저 문의하십시오.
  - q: 다른 사람이 대신 요구할 수 있나요?
    a: 대리인은 위임장과 본인 확인 서류가 필요할 수 있습니다. 기관 안내를 확인하십시오.
related: [privacy-consent-withdrawal, privacy-consent, privacy-consent-third, family-certificate-issuance-poa]
blocks:
  - type: doc_title
    text: 개인정보 열람 요구서
    spaced: false
  - type: subtitle
    text: 1. 요구 대상 기관
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["기관명", "", "담당 부서", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "고객지원팀"]
  - type: subtitle
    text: 2. 요구하는 사람
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "이메일", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1990-04-12"]
      - ["", "010-1234-5678", "", "hong@example.com"]
      - ["", "서울시 ○○구 ○○로 10", "", ""]
  - type: subtitle
    text: 3. 열람을 요구하는 개인정보
  - type: textbox
    hint: "열람하려는 개인정보의 항목과 기간을 구체적으로 적으십시오."
    height_mm: 28
    sample_text: 2025년 1월부터 현재까지 회원 가입 시 제공한 이름·연락처·주소와 주문 내역을 열람하고자 합니다.
  - type: subtitle
    text: 4. 열람 방법
  - type: kv_list
    items:
      - "□ 서면 열람   □ 사본 교부   □ 이메일 전송"
  - type: para
    text: 위와 같이 본인의 개인정보 열람을 요구합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   20 일
  - type: sign_line
    labels: ["요구인"]
    sample_names: [홍길동]
  - type: notice
    text: 처리 기한과 본인 확인 방법은 해당 기관의 안내를 확인하십시오.
