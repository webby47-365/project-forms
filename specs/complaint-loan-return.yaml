    row_height_mm: 8
    merges:
      - [1, 1, 1, 4]
      - [3, 1, 3, 4]
    rows:
      - ["원고 성명", "", "생년월일", "", "연락처"]
      - ["원고 주소", "", "", "", ""]
      - ["피고 성명", "", "생년월일", "", "연락처"]
      - ["피고 주소", "", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1990-03-15", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "", ""]
      - ["", "김서연", "", "1988-11-02", "010-9876-5432"]
      - ["", "서울특별시 서대문구 충정로 30", "", "", ""]

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사건명", "", "소가(청구금액)", "금                                원"]
    sample_rows:
      - ["", "대여금 반환 청구의 소", "", "금 10,000,000원(금 일천만원)"]

  - type: subtitle
    text: 청구 취지
  - type: textbox
    hint: "피고가 원고에게 지급할 금액과 소송비용 부담, 가집행 등 구하는 판결 내용을 기재하십시오."
    height_mm: 25
    sample_text: 피고는 원고에게 금 10,000,000원 및 이에 대하여 2026년 6월 11일부터 다 갚는 날까지 연 12%의 비율로 계산한 돈을 지급하라. 소송비용은 피고가 부담한다. 제1항은 가집행할 수 있다.

  - type: subtitle
    text: 청구 원인
  - type: textbox
    hint: "대여 경위와 변제기일, 피고의 미지급 사실을 시간순으로 기재하십시오."
    height_mm: 50
    sample_text: 원고는 2025년 6월 10일 피고에게 금 10,000,000원을 변제기일 2026년 6월 10일로 정하여 대여하였습니다. 그러나 피고는 변제기일이 지난 현재까지 위 대여금을 변제하지 않고 있습니다. 원고는 피고에게 수차례 변제를 요청하였으나 피고로부터 별다른 답변을 받지 못하였습니다.

  - type: subtitle
