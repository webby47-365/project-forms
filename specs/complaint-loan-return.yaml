id: complaint-loan-return
title: 소장 (대여금 반환청구)
category: legal
subcategory: litigation
tags: [소장, 대여금반환청구소송, 대여금소장, 대여금청구, 민사소장]
summary: 빌려준 돈을 갚지 않는 채무자를 상대로 대여금 반환을 구하는 민사 소장 양식입니다.
usage: >
  금전을 대여하였으나 변제기일이 지나도록 돌려받지 못한 경우 법원에 제출하는 소장입니다.
  대여 일자와 금액, 변제기일, 이자율 등 대여 내역을 먼저 밝히고 청구취지에 정확한 금액과
  이자 기산일을 기재해야 합니다. 청구원인에는 대여 경위와 피고의 미지급 사실을 시간순으로
  담백하게 적는 것이 유리합니다. 본 서식은 참고용이며 제출 전 법원 전자소송 사이트의 최신
  양식과 관할을 확인하십시오.
source: law-standard
source_note: 민사소송법상 소장 기재사항을 참고하여 자체 제작
featured: false
target_pages: 2
series: complaint
series_name: 소장
variant: 대여금
variant_rank: 3
version: 1
created_by: agent
status: published

variant_use: 빌려준 돈을 갚지 않을 때 제기하는 소송에 씁니다.

howto:
  - 원고와 피고의 인적사항을 적습니다.
  - 대여 일자와 금액, 이자율, 변제기일을 밝힙니다.
  - 청구취지에 청구 금액과 이자 기산일을 적습니다.
  - 청구원인에 대여 경위와 미지급 사실을 시간순으로 적습니다.
  - 관할 법원을 확인한 뒤 제출합니다.

faq:
  - q: 이자 기산일은 어떻게 정하나요?
    a: 통상 변제기일 다음 날부터 이자를 계산해 청구취지에 기재합니다.
  - q: 이 서식 그대로 제출해도 되나요?
    a: 참고용이므로 제출 전 법원 전자소송 사이트의 최신 양식과 관할을 확인하십시오.

blocks:
  - type: doc_title
    text: 소장
    spaced: true

  - type: subtitle
    text: 당사자
  - type: grid
    widths: [14, 26, 14, 20, 26]
