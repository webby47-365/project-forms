id: bid-guarantee-pledge
title: 입찰보증금 지급각서
category: public
subcategory: procure
tags: [입찰보증금지급각서, 입찰보증각서, 보증금지급각서, 입찰각서, 입찰보증]
summary: 입찰 참가 시 현금 대신 입찰보증금을 낙찰 후 지급하겠다고 약속하는 지급각서 양식으로, 입찰 건명과 보증금액을 적습니다.
usage: >
  입찰에 참가하면서 입찰보증금을 현금이나 보증서로 내는 대신, 낙찰되고도 계약을 체결하지 않을 때
  보증금 상당액을 납부하겠다고 약속하는 각서입니다. 입찰자 정보, 입찰 건명, 보증금액과 납부 조건을
  적고 대표자가 서명 또는 날인합니다. 보증금 면제·지급각서 허용 여부와 금액은 입찰공고문마다
  다르므로 공고문의 조건을 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 입찰공고문에서 건명과 공고번호, 입찰보증금 비율을 확인합니다.
  - 입찰자 상호와 대표자 정보를 적습니다.
  - 입찰 건명과 보증금액을 숫자와 한글로 함께 적습니다.
  - 날짜를 적고 대표자가 서명 또는 날인합니다.
faq:
  - q: 모든 입찰에서 지급각서를 낼 수 있나요?
    a: 아닙니다. 지급각서로 갈음할 수 있는지는 공고문 조건에 따릅니다. 반드시 공고문을 먼저 확인하십시오.
  - q: 보증금액은 어떻게 정하나요?
    a: 공고문에 적힌 입찰금액 대비 비율 또는 정액을 따릅니다. 이 서식에는 정해진 금액만 적습니다.
  - q: 낙찰되지 않으면 각서는 어떻게 되나요?
    a: 보통 개찰 후 반환을 요청합니다. 반환 절차는 발주처 안내를 확인하십시오.
related: [bid-participation-poa, gov-bid-participation, bid-deposit-refund-request, integrity-pledge-bidding]
