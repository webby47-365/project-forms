id: fact-inquiry-application
title: 사실조회 신청서
category: legal
subcategory: litigation
tags: [사실조회, 사실조회신청, 민사소송, 법원, 증거신청]
summary: 소송 중 공공기관이나 단체에 필요한 사실을 법원이 대신 물어봐 달라고 신청할 때 쓰는 사실조회 신청서 양식입니다.
usage: >
  소송 중 당사자가 직접 얻기 어려운 사실을 기관이나 단체에 법원이 조회해 달라고 요청하는 서식입니다.
  사건번호와 당사자, 조회를 받을 기관, 조회할 사항과 그 사실이 왜 필요한지를 적어 재판부에 냅니다.
  조회할 사항은 기관이 바로 답할 수 있게 짧고 구체적인 질문으로 나누어 적는 편이 좋습니다.
  채택 여부는 재판부가 정하므로 제출 방법과 기한은 해당 법원에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 법원, 사건번호, 사건명과 당사자를 적습니다.
  - 조회를 받을 기관의 이름과 주소를 적습니다.
  - 조회할 사항을 번호를 붙여 짧게 나누어 적습니다.
  - 그 사실이 왜 필요한지 입증 취지를 적고 제출합니다.
faq:
  - q: 사실조회와 문서제출명령은 어떻게 다른가요?
    a: 사실조회는 기관에 사실을 물어 회신을 받는 방식입니다. 문서 자체를 받으려면 다른 신청이 필요할 수 있습니다.
  - q: 개인에게도 사실조회를 신청할 수 있나요?
    a: 주로 공공기관이나 단체를 대상으로 합니다. 개인은 증인신청 등이 맞는지 법원에 확인하십시오.
related: [evidence-submission-list, witness-application, written-statement, service-address-change-report]
blocks:
  - type: doc_title
    text: 사실조회 신청서
    spaced: true
  - type: subtitle
    text: 1. 사건의 표시
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["법원", "", "사건번호", ""]
      - ["원고", "", "피고", ""]
      - ["사건명", "", "", ""]
    sample_rows:
      - ["", "서울중앙지방법원", "", "2026가소123456"]
      - ["", "홍길동", "", "한빛물산"]
      - ["", "물품대금", "", ""]
  - type: subtitle
    text: 2. 조회를 받을 곳
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["기관명", "", "담당 부서", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "○○시 ○○구청", "", "민원여권과"]
      - ["", "서울시 ○○구 ○○로 100", "", ""]
  - type: subtitle
    text: 3. 조회할 사항
  - type: textbox
    hint: "기관이 바로 답할 수 있도록 번호를 붙여 짧고 구체적으로 적으십시오."
    height_mm: 45
    sample_text: "1. 2025년 3월부터 2026년 2월까지 위 장소에 등록된 사업자의 상호와 대표자. 2. 해당 사업자의 영업 개시일과 폐업 여부."
  - type: subtitle
    text: 4. 입증 취지
  - type: textbox
    hint: "위 사실이 이 사건에서 왜 필요한지 간단히 적으십시오."
    height_mm: 30
    sample_text: "피고의 영업 기간을 확인하여 주문 시점에 피고가 영업 중이었음을 밝히려는 것입니다."
  - type: date_line
    sample_text: 2026 년   11 월    9 일
  - type: sign_line
    labels: ["신청인"]
    sample_names: [홍길동]
  - type: notice
    text: 채택 여부와 제출 방법은 해당 법원에 확인하십시오.
