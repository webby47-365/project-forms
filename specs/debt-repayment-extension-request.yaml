id: debt-repayment-extension-request
title: 변제기한 연장 요청서
category: legal
subcategory: notice
tags: [변제기한연장, 상환유예, 지급기한연장, 채무변제, 기한연장요청]
summary: 갚아야 할 돈의 변제 기한을 늦춰 달라고 상대방에게 요청할 때 채무 내용과 연장 희망일, 분할 방법, 사유를 적는 요청서 양식입니다.
usage: >
  약속한 날까지 돈을 갚기 어려울 때 연체가 되기 전에 상대방에게 기한을 늦춰 달라고 알리는 서식입니다.
  채무의 발생 원인과 남은 금액, 기존 기한과 연장을 희망하는 기한, 나눠 갚을 계획이 있다면 그 일정을 적습니다.
  이 요청서는 상대방이 받아들여야 효력이 생기는 제안이므로 합의가 되면 별도 합의서나 각서로 남기는 것이 좋습니다.
  이자와 지연 책임은 계약 내용에 따라 달라질 수 있으니 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 요청자와 상대방의 성명·연락처를 적습니다.
  - 채무의 내용과 남은 금액, 기존 변제기한을 적습니다.
  - 연장을 희망하는 기한과 분할 일정을 적습니다.
  - 사유를 쓰고 서명해 상대방에게 전달합니다.
faq:
  - q: 요청서를 보내면 기한이 자동으로 늘어나나요?
    a: 아닙니다. 상대방이 받아들여야 합니다. 합의되면 그 내용을 합의서 등으로 따로 남기십시오.
  - q: 일부라도 먼저 갚으면 도움이 되나요?
    a: 일부 변제 의사와 일정을 밝히면 협의에 도움이 될 수 있습니다. 이체 내역은 보관하십시오.
  - q: 기한이 지난 뒤에도 보낼 수 있나요?
    a: 보낼 수는 있으나 가능하면 기한 전에 알리는 것이 좋습니다. 지연에 따른 책임은 계약을 확인하십시오.
related: [repayment-plan, settlement-agreement, payment-pledge, certified-notice-reply]
blocks:
  - type: doc_title
    text: 변제기한 연장 요청서
    spaced: false
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["요청인", "", "연락처", ""]
      - ["상대방", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "박민준", "", "010-9876-5432"]
  - type: subtitle
    text: 2. 채무 내용
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["채무 발생 원인", "", "발생일", ""]
      - ["남은 금액", "", "기존 변제기한", ""]
      - ["연장 희망 기한", "", "분할 여부", ""]
    sample_rows:
      - ["", "물품대금", "", "2026-07-15"]
      - ["", "3,000,000원", "", "2026-11-30"]
      - ["", "2027-02-28", "", "월 1,000,000원 3회"]
  - type: subtitle
    text: 3. 연장 요청 사유와 변제 계획
  - type: textbox
    hint: "기한 내 변제가 어려운 사정과 연장 후 변제 계획을 적으십시오."
    height_mm: 30
    sample_text: "거래처 대금 입금이 늦어져 기한 내 변제가 어렵습니다. 2026년 12월부터 매월 말일 1,000,000원씩 나눠 갚겠습니다."
  - type: para
    text: 위와 같이 변제기한 연장을 요청드리며, 협조해 주시기 바랍니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   27 일
  - type: sign_line
    labels: ["요청인"]
    sample_names: [홍길동]
  - type: notice
    text: 합의된 내용은 합의서 등으로 따로 남기시기 바랍니다.
