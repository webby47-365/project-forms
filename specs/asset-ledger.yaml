id: asset-ledger
title: 비품 관리대장
category: corp
subcategory: admin
version: 1
created_by: agent
status: published
tags: [비품관리대장, 비품대장, 자산관리, 물품관리대장, asset ledger]
summary: 사무실 비품의 품명·규격·수량·보관부서·관리자를 기록해 현황을 관리하는 비품 관리대장입니다.
usage: >
  사내 비품을 체계적으로 관리하기 위해 취득일, 수량, 단가, 보관부서와 관리자를 한
  표에 기록하는 대장입니다. 신규 구매나 폐기가 발생할 때마다 즉시 갱신해야 현품과
  기록이 일치하며, 정기 점검 시 이 대장을 기준으로 재고와 상태를 대조합니다. 관리자
  변경 시에도 반드시 본 대장에 기재하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 비품 관리대장
    spaced: true

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["관리부서", "", "작성일자", ""]
    sample_rows:
      - ["", "총무팀", "", "2026-09-13"]

  - type: subtitle
    text: 비품 현황

  - type: table
    widths: [5, 16, 14, 12, 8, 12, 13, 11, 9]
    header: ["No", 품명, 규격, 취득일, 수량, 단가, 보관부서, 관리자, 비고]
    empty_rows: 13
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "사무용 책상", "1200x600x750mm", "2023-03-10", "15", "180,000", "총무팀", "김서연", "정상"]
      - ["2", "사무용 의자", "메쉬형 회전의자", "2023-03-10", "15", "95,000", "총무팀", "박민준", "정상"]
      - ["3", "레이저 프린터", "A4 양면인쇄", "2024-06-05", "3", "320,000", "마케팅팀", "이수현", "정상"]
      - ["4", "노트북 거치대", "알루미늄 접이식", "2025-02-20", "8", "28,000", "총무팀", "홍길동", "파손 1개"]

  - type: notice
    text: 신규 취득 또는 폐기 시 즉시 갱신하고, 현품과 대장이 일치하는지 정기적으로 대조하십시오.
