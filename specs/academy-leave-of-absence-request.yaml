id: academy-leave-of-absence-request
title: 학원 휴원 신청서
category: edu
subcategory: school
tags: [학원휴원신청서, 수강휴원, 학원휴원, 수강일시중지, 휴원신청]
summary: 질병·여행·시험 준비 등으로 일정 기간 수강을 쉬려는 학부모가 학원에 내는 학원 휴원 신청서 양식입니다.
usage: >
  학원에 다니는 학생이 일정 기간 수업을 쉬어야 할 때 학부모가 학원에 휴원을 알리는 서식입니다.
  학생 정보와 수강 과목, 휴원 기간과 사유, 복귀 예정일을 적고 보호자가 서명합니다.
  휴원 기간의 수강료 처리와 보강 여부는 학원 규정에 따르므로 신청 전에 학원에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 학생 이름과 학년, 수강 과목을 적습니다.
  - 휴원 시작일과 복귀 예정일을 적습니다.
  - 휴원 사유를 간단히 적습니다.
  - 보호자가 날짜를 적고 서명합니다.
faq:
  - q: 휴원 기간의 수강료는 어떻게 되나요?
    a: 학원 규정에 따라 다릅니다. 이월이나 감면 여부를 신청 전에 학원에 확인하십시오.
  - q: 복귀일이 바뀌면 어떻게 하나요?
    a: 학원에 미리 알리고 변경 내용을 다시 적어 제출하면 됩니다.
  - q: 사유를 자세히 적어야 하나요?
    a: 간단히 적으면 충분합니다. 건강 정보는 꼭 필요한 만큼만 적으십시오.
related: [tuition-refund-request, academy-attendance, student-early-leave-request, afterschool-program-application]
blocks:
  - type: doc_title
    text: 학원 휴원 신청서
    spaced: false
  - type: subtitle
    text: 1. 학생 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["학생 이름", "", "학년", ""]
      - ["수강 과목", "", "담당 선생님", ""]
      - ["보호자", "", "연락처", ""]
    sample_rows:
      - ["", "홍하늘", "", "중학교 2학년"]
      - ["", "수학 중급반", "", "김선생"]
      - ["", "홍길동", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 휴원 기간과 사유
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["휴원 시작일", "", "복귀 예정일", ""]
      - ["휴원 사유", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "2026-12-01", "", "2026-12-31"]
      - ["", "가족 여행 및 기말고사 준비", "", ""]
  - type: textbox
    hint: "학원에 전달할 내용이나 수강료·보강 관련 요청을 적으십시오."
    height_mm: 24
    sample_text: "휴원 기간의 수강료 처리와 복귀 후 보강 가능 여부를 안내해 주시기 바랍니다."
  - type: date_line
    sample_text: 2026 년   11 월   18 일
  - type: sign_line
    labels: ["보호자"]
    sample_names: [홍길동]
  - type: notice
    text: 휴원 기간의 수강료와 보강은 학원 규정을 확인하십시오.
