id: business-closure-confirmation
title: 영업 폐업 사실 확인서
category: public
subcategory: permit
tags: [폐업사실확인서, 폐업확인서, 영업폐업확인, 폐업일확인, 휴폐업확인서]
summary: 사업장을 폐업했다는 사실과 폐업일·사유·정리 내용을 적어 거래처나 기관에 내는 확인서입니다.
usage: >
  가게나 사무실을 닫은 뒤 임대인, 거래처, 금융기관 등에 폐업 사실을 알려야 할 때 쓰는 서식입니다.
  상호와 사업장 주소, 폐업일, 폐업 사유, 재고와 집기 정리 내용을 적고 대표자가 서명합니다.
  세무서 폐업 신고와 별개로 당사자에게 사실을 알리는 용도이므로, 제출처가 요구하는 증빙(폐업사실증명 등)이
  따로 있는지 먼저 확인하십시오. 본 서식은 사실을 기록하는 틀이며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 상호와 대표자, 사업장 주소를 적습니다.
  - 폐업일과 폐업 사유를 적습니다.
  - 재고·집기·계약 정리 상황을 적습니다.
  - 날짜를 적고 대표자가 서명합니다.
faq:
  - q: 이 확인서로 세무서 폐업 신고가 되나요?
    a: 아닙니다. 관할 세무서 신고는 별도입니다. 이 서식은 거래처 등에 사실을 알리는 용도입니다.
  - q: 제출처가 폐업사실증명을 요구하면 어떻게 하나요?
    a: 증명은 세무서에서 발급받습니다. 이 확인서와 함께 내라는 곳이 많으니 제출처에 확인하십시오.
related: [business-closure-poa, business-premises-restoration-confirmation, gov-business-closure-report, contract-performance-deposit-refund-request]
blocks:
  - type: doc_title
    text: 영업 폐업 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 사업장 정보
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["상호", "", "대표자", ""]
      - ["업종", "", "연락처", ""]
      - ["사업장 주소", "", "", ""]
    sample_rows:
      - ["", "새길상회", "", "홍길동"]
      - ["", "소매업", "", "010-1234-5678"]
      - ["", "서울시 예시구 예시로 12", "", ""]
  - type: subtitle
    text: 2. 폐업 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["폐업일", "", "제출처", ""]
      - ["폐업 사유", "", "", ""]
    sample_rows:
      - ["", "2026-09-30", "", "임대인"]
      - ["", "임대차 기간 만료 및 경영 사정", "", ""]
  - type: subtitle
    text: 3. 정리 내용
  - type: textbox
    hint: "재고·집기 처분, 거래처 정산, 임대차 정리 상황을 적으십시오."
    height_mm: 30
    sample_text: "재고는 전량 처분하였고 집기는 철거를 완료하였습니다. 거래처 대금은 정산을 마쳤으며 사업장은 원상태로 비웠습니다."
  - type: para
    text: 위와 같이 영업을 폐업하였음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월    8 일
  - type: sign_line
    label: 대표자
    sample_names: [홍길동]
  - type: notice
    text: 세무서 폐업 신고는 별도로 해야 하며, 제출처 요구 서류를 확인하십시오.
