id: certified-notice-damages
title: 내용증명 (손해배상 청구)
category: legal
subcategory: notice
tags: [내용증명, 손해배상청구, 손해배상내용증명, 피해배상, 내용증명서식]
summary: 상대방의 행위로 입은 손해의 내용과 금액을 밝혀 배상을 요구하는 내용증명 양식입니다.
usage: >
  물건 파손, 계약 불이행, 시공 하자 등으로 손해를 입었을 때 상대방에게 배상을 공식적으로 요구하는 통지서입니다.
  손해가 생긴 경위와 일시, 손해 항목별 금액과 증빙을 적고 지급 기한과 계좌를 밝힙니다.
  우체국 등기로 보내면 통지한 사실과 내용이 기록으로 남습니다. 책임 유무와 배상액은 사안마다 다르므로 필요하면 전문가 상담을 받으십시오.
source: original
featured: false
target_pages: 1
series: certified-notice
series_name: 내용증명
variant: 손해배상 청구
variant_rank: 9
variant_use: 상대방의 행위로 입은 손해의 배상을 요구할 때 씁니다.
howto:
  - 발신인과 수신인의 성명·주소를 적습니다.
  - 손해가 생긴 일시와 경위를 사실대로 적습니다.
  - 손해 항목별 금액과 증빙을 적고 합계를 냅니다.
  - 지급 기한과 계좌를 적고 등기로 보냅니다.
faq:
  - q: 증빙은 꼭 붙여야 하나요?
    a: 필수는 아니지만 견적서·영수증·사진 등을 목록으로 적어 두면 청구 근거가 분명해집니다.
  - q: 기한까지 배상하지 않으면 어떻게 하나요?
    a: 소액사건 등 별도 절차를 검토할 수 있습니다. 사안별로 전문가 상담을 권합니다.
  - q: 배상 금액은 어떻게 정하나요?
    a: 실제 입은 손해를 증빙으로 계산해 적습니다. 인정 범위는 사안마다 다릅니다.
related: [certified-notice-reply, settlement-agreement, small-claims-complaint, car-accident-settlement]
blocks:
  - type: doc_title
    text: 내 용 증 명
    spaced: true
  - type: subtitle
    text: 1. 발신인·수신인
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["발신인", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["수신인", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울시 중구 예시로 1", "", ""]
      - ["", "김서연", "", "010-2345-6789"]
      - ["", "서울시 마포구 샘플로 2", "", ""]
  - type: subtitle
    text: 2. 손해 발생 경위
  - type: textbox
    hint: "손해가 생긴 일시·장소와 경위를 사실대로 시간순으로 적으십시오."
    height_mm: 32
    sample_text: "2026년 9월 3일 수신인이 작업 중 제 소유 사무실 바닥재를 파손하였고, 같은 달 5일 현장을 함께 확인하였습니다."
  - type: subtitle
    text: 3. 청구 손해 내역
  - type: table
    widths: [8, 36, 22, 34]
    header: ["No", 손해 항목, 금액(원), 증빙]
    empty_rows: 4
    row_height_mm: 8
    sample_rows:
      - ["1", "바닥재 교체 비용", "1,200,000", "견적서"]
      - ["2", "임시 원상복구 비용", "300,000", "영수증"]
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["청구 합계", "", "지급 기한", ""]
      - ["입금 계좌", "", "예금주", ""]
    sample_rows:
      - ["", "1,500,000원", "", "2026-12-10"]
      - ["", "한빛은행 000-000-000000", "", "홍길동"]
  - type: para
    text: 위 금액을 기한까지 지급해 주시기 바라며, 이행되지 않을 경우 법적 절차를 검토할 수 있음을 알려드립니다.
    align: both
  - type: date_line
    sample_text: 2026 년   11 월   18 일
  - type: sign_line
    labels: ["발신인"]
    sample_names: [홍길동]
  - type: notice
    text: 책임 유무와 배상액은 사안마다 다릅니다. 필요하면 전문가 상담을 받으십시오.
