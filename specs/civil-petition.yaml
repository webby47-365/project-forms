id: civil-petition
title: 민원신청서
category: public
subcategory: civil
tags: [민원신청, 민원, 신청서, 공공기관, 행정신청]
summary: 정부 부처나 지방자치단체 등 공공기관에 민원을 신청할 때 제출하는 신청서 양식입니다.
usage: >
  각 부처, 지자체, 공공기관의 민원 창구에 인허가, 확인, 증명, 보조금, 서비스 등을 신청할 때 사용합니다.
  신청자의 기본정보, 신청 대상 기관, 신청 내용을 명확하고 구체적으로 기재해야 하며, 신청 사유와 배경도 상세히 기술합니다.
  첨부 문서 목록을 명시하고 제출일자를 반드시 기재해야 하며, 신청 기한이 있으면 사전에 확인해야 합니다.
source: original
featured: false
target_pages: 2

howto:
  - 신청자의 기본정보를 적습니다.
  - 신청 대상 기관을 적습니다.
  - 신청 내용과 사유를 구체적으로 적습니다.
  - 첨부 문서 목록을 적습니다.
  - 제출일자를 확인해 적고 제출합니다.

faq:
  - q: 신청 기한이 있는지 어떻게 아나요?
    a: 해당 민원을 담당하는 기관의 공고나 안내문을 통해 신청 기한을 미리 확인해야 합니다.
  - q: 첨부서류는 어디까지 준비해야 하나요?
    a: 기관마다 요구하는 서류가 다르므로 접수 창구나 홈페이지에서 필요한 목록을 확인하십시오.

blocks:
  - type: doc_title
    text: 민원신청서
    spaced: false
  - type: spacer
    height_pt: 4
  - type: subtitle
    text: 신청자 정보
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처(휴대폰)", "", "이메일", ""]
    sample_rows:
      - ["", "홍길동", "", "1990-03-02"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", "gildong.hong@example.com"]
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 민원 신청 대상
  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["신청 기관명", ""]
      - ["담당 부서", ""]
    sample_rows:
      - ["", "마포구청"]
      - ["", "민원여권과"]
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 신청 내용
  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["신청 사항", ""]
    sample_rows:
      - ["", "주민등록등본 발급 신청"]
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 신청 이유 및 사유
  - type: textbox
    hint: "민원 신청 배경, 경위, 상세한 신청 이유를 시간순으로 구체적으로 기재하십시오."
    height_mm: 14
    sample_text: 전입신고 후 행정복지센터 방문이 어려워 온라인으로 등본 발급을 신청합니다.
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 첨부문서
  - type: table
    widths: [10, 60, 15, 15]
    header: ["No", "첨부 서류명", "선택", "비고"]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["1", "신분증 사본", "", ""]
      - ["2", "신청서", "", ""]
  - type: spacer
    height_pt: 2
  - type: grid
    widths: [30, 70]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["기타 첨부 사항", ""]
    sample_rows:
      - ["", "해당없음"]
  - type: spacer
    height_pt: 4
  - type: para
    text: "본인은 위와 같이 민원을 신청하며, 기재 내용이 사실임을 확인합니다."
    align: center
    size: 11
    space_after: 2
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: spacer
    height_pt: 2
  - type: sign_line
    label: 신청자
    sample_names: [홍길동]
  - type: notice
    text: 신청 내용은 구체적으로 기재하여 주시기 바라며, 필요한 첨부 서류를 빠짐없이 제출하십시오. 신청 기한을 확인하여 기일 내에 제출해야 합니다.
