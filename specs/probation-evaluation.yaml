id: probation-evaluation
title: 수습 평가서
category: corp
subcategory: hr
tags: [수습평가서, 수습평가표, 정규직전환평가, 수습기간평가, 신입사원평가]
summary: 수습 기간 중 업무 수행 결과를 항목별로 평가하고 정규직 전환 여부를 검토하는 평가서입니다.
usage: >
  신입 또는 경력 입사자의 수습 기간 종료 시점에 업무 수행 결과를 종합적으로 평가하기 위해
  사용하는 문서입니다. 업무 이해도, 수행 능력, 성실성, 협업, 조직 적응 등 항목별로 점수와
  의견을 기재합니다. 종합점수와 등급을 산출한 뒤 정규직 전환 적합 여부에 대한 평가자 의견을
  덧붙입니다. 평가자 2인의 서명을 받아 인사부서에 제출하며, 최종 전환 여부는 인사위원회
  심의를 거쳐 결정됩니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 대상자 성명과 부서, 수습 기간을 적습니다.
  - 업무 이해도와 수행 능력 등 항목별 점수를 매깁니다.
  - 항목마다 구체적인 평가 의견을 적습니다.
  - 종합점수와 등급을 산출합니다.
  - 전환 적합 여부 의견을 적고 평가자 2인이 서명합니다.

faq:
  - q: 평가 등급은 몇 단계로 나누나요?
    a: 정해진 형식은 없으며 회사 인사 기준에 맞추어 등급 수와 명칭을 정하면 됩니다.
  - q: 전환 여부는 이 평가서로 바로 결정되나요?
    a: 이 평가서는 참고 자료이며 최종 전환 여부는 인사위원회 심의를 거쳐 결정됩니다.

blocks:
  - type: doc_title
    text: 수습 평가서
    spaced: true

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "부서", ""]
      - ["직위", "", "수습기간", ""]
    sample_rows:
      - ["", "홍길동", "", "마케팅팀"]
      - ["", "사원", "", "2026-04-01 ~ 2026-06-30"]

  - type: subtitle
    text: 1. 평가 항목

  - type: table
    widths: [24, 12, 14, 50]
    header: [평가 항목, 배점, 평가 점수, 평가 의견]
    empty_rows: 5
    row_height_mm: 9
    sample_rows:
      - ["업무이해도", "20", "17", "직무 관련 기본 지식을 빠르게 습득함"]
      - ["업무수행능력", "20", "16", "업무 처리 속도와 정확성이 양호함"]
      - ["성실성", "20", "18", "근태가 양호하고 책임감 있게 임함"]
      - ["협업·소통", "20", "15", "팀원과의 협업에 적극적으로 참여함"]

  - type: subtitle
    text: 2. 종합 평가

  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["종합점수", "", "등급", ""]
      - ["정규직 전환 의견", "", "", ""]
    sample_rows:
      - ["", "86", "", "B+"]
      - ["", "적합 — 업무 이해도와 성실성이 우수하여 정규직 전환을 건의함", "", ""]

  - type: date_line
    sample_text: 2026 년    6 월   30 일

  - type: sign_line
    labels: ["1차 평가자", "2차 평가자"]
    sample_names: [김서연, 박민준]

  - type: notice
    text: 정규직 전환 여부의 최종 결정은 인사위원회 심의를 거쳐 확정됩니다.
