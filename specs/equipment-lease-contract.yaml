id: equipment-lease-contract
title: 장비 임대차계약서
category: legal
subcategory: contract
tags: [장비임대차계약서, 기자재임대계약, 렌탈계약서, 장비대여계약, 설비임대차]
summary: 장비 명세·임대기간·임대료와 유지보수·멸실훼손 시 배상 책임을 정하는 장비 임대차계약서입니다.
usage: >
  행사·공사·사무용 장비나 기계를 일정 기간 빌려주고 빌릴 때 사용하는 계약서입니다. 장비를
  품명·모델·제조번호로 구체적으로 특정하고, 임대기간과 임대료, 보증금, 지급일을 명확히
  정해야 합니다. 사용 중 발생하는 고장의 수리 책임과 분실·파손 시 배상 기준을 미리 정해
  두어야 분쟁을 줄일 수 있습니다. 반환 시 장비의 상태를 서로 확인하고, 임차인의 전대는
  원칙적으로 금지하는 것이 일반적입니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

howto:
  - 장비의 품명과 모델, 제조번호를 적습니다.
  - 임대기간과 임대료, 보증금, 지급일을 적습니다.
  - 고장 수리 책임과 분실·파손 배상 기준을 정합니다.
  - 전대 가능 여부 등 특약사항을 적습니다.
  - 반환 시 장비 상태를 확인하고 양측이 서명합니다.

faq:
  - q: 임차인이 다른 사람에게 다시 빌려줘도 되나요?
    a: 원칙적으로 전대는 금지되며 필요한 경우 계약서에 별도로 허용 조건을 정해야 합니다.
  - q: 사용 중 고장이 나면 누가 수리하나요?
    a: 계약서에 정한 수리 책임 조항에 따르며 미리 정해 두지 않으면 분쟁의 원인이 됩니다.

blocks:
  - type: doc_title
    text: 장비 임대차계약서
    spaced: false
  - type: para
    text: 임대인과 임차인은 아래 장비에 관하여 다음과 같이 임대차계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["임대인", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["임차인", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)새길데이터", "", "000-00-00000"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-5678-1234"]
      - ["", "", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
  - type: subtitle
    text: 장비 명세
  - type: table
    widths: [8, 24, 18, 10, 22, 18]
    header: ["No", 품명, 모델, 수량, 제조번호, 상태]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "노트북 컴퓨터", "한빛 NB-15", "10대", "SN-0001~SN-0010", "양호"]
      - ["2", "빔프로젝터", "한빛 PJ-200", "2대", "SN-P001, SN-P002", "양호"]
  - type: subtitle
    text: 임대 조건
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["임대기간", "", "설치장소", ""]
      - ["임대료", "", "지급일", ""]
      - ["보증금", "", "", ""]
    sample_rows:
      - ["", "2026-10-01 ~ 2027-09-30 (1년)", "", "(주)한빛커머스 본사 3층"]
      - ["", "월 800,000원 (부가세 별도)", "", "매월 1일"]
      - ["", "2,000,000원", "", ""]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "임대인은 위 장비를 임차인에게 임대하고, 임차인은 이를 임차하여 사용하며 임대료를 지급한다."
  - type: article
    heading: 제2조 (인도와 반환)
    lines:
      - "임대인은 임대기간 시작일에 위 설치장소에서 장비를 임차인에게 인도하고, 임차인은 임대기간 종료일에 동일한 상태로 반환한다."
      - "인도·반환 시 양 당사자는 장비의 상태를 함께 확인하고 그 결과를 기록한다."
  - type: page_break
  - type: article
    heading: 제3조 (사용상의 주의)
    lines:
      - "임차인은 장비를 선량한 관리자의 주의로 사용하며, 제조사가 정한 사용 방법과 용도에 따라서만 사용한다."
  - type: article
    heading: 제4조 (유지보수 책임)
    lines:
      - "통상적인 사용으로 인한 소모품 교체와 경미한 유지보수는 임차인이 부담하고, 장비 자체의 결함으로 인한 고장 수리는 임대인이 부담한다."
  - type: article
    heading: 제5조 (멸실·훼손 시 배상)
    lines:
      - "임차인의 고의·과실로 장비가 멸실·훼손된 경우 임차인은 수리비 또는 동종 장비의 시가에 해당하는 금액을 배상한다."
      - "배상액은 보증금에서 우선 공제할 수 있으며, 부족한 경우 별도로 청구할 수 있다."
  - type: article
    heading: 제6조 (전대 금지)
    lines:
      - "임차인은 임대인의 사전 서면 동의 없이 장비를 제3자에게 전대하거나 사용권을 양도할 수 없다."
  - type: article
    heading: 제7조 (계약의 해지)
    lines:
      - "임차인이 임대료를 2회 이상 연체하거나 제6조를 위반한 경우 임대인은 계약을 해지하고 장비의 반환을 청구할 수 있다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["임대인", "임차인"]
    sample_names: ["(주)새길데이터 대표 박민준", "(주)한빛커머스 대표 김서연"]
  - type: notice
    text: 장비의 파손·분실에 대비해 보험 가입 여부를 확인하고, 고가 장비는 인도·반환 시 상태를 사진으로 남겨 두는 것이 안전합니다.
