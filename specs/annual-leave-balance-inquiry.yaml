id: annual-leave-balance-inquiry
title: 연차 잔여일수 조회 요청서
category: corp
subcategory: hr
tags: [연차잔여일수, 연차조회, 연차확인요청, 휴가일수조회, 연차사용촉진]
summary: 내 연차가 몇 일 발생했고 몇 일 남았는지 회사에 서면으로 확인 요청하는 연차 잔여일수 조회 요청서입니다.
usage: >
  연차 사용 촉진 시기나 퇴사 정산을 앞두고 본인의 발생·사용·잔여 연차를 정확히 알고 싶을 때 인사 담당자에게
  제출하는 서식입니다. 조회할 기준일과 기간, 알고 싶은 항목을 체크하고 회신받을 방법을 적습니다. 본인이 파악한
  사용 내역을 함께 적어 두면 회사 기록과 대조하기 쉽습니다. 발생·차감 기준은 회사 취업규칙에 따르므로 회신 내용에
  이견이 있으면 근거 자료를 요청해 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신청인 이름과 소속, 입사일을 적습니다.
  - 조회 기준일과 확인하고 싶은 항목을 고릅니다.
  - 본인이 파악한 사용 내역을 적어 둡니다.
  - 회신 방법을 적고 서명해 인사 담당자에게 냅니다.
faq:
  - q: 회사는 연차 잔여일수를 알려줄 의무가 있나요?
    a: 일률적으로 정해진 회신 기한은 없습니다. 보통 급여명세서나 인사 시스템으로 확인하며, 서면 요청이 필요하면 이 서식을 씁니다.
  - q: 회사 기록과 제 계산이 다르면 어떻게 하나요?
    a: 사용일 목록과 발생 기준을 서로 대조해 어느 부분이 다른지 먼저 확인합니다. 해결되지 않으면 고용노동부 상담을 이용할 수 있습니다.
  - q: 입사 1년 미만도 조회할 수 있나요?
    a: 가능합니다. 기준일을 입사일부터 현재까지로 적고 월 단위 발생분을 확인해 달라고 쓰면 됩니다.
related: [annual-leave-usage-status-confirmation, annual-leave-plan, unused-annual-leave-pay-request, leave-request]
