id: household-budget-weekly
title: 가계부 (주간)
category: personal
subcategory: life
tags: [가계부, 주간가계부, 주간예산, 생활비관리, 주간지출기록, weekly budget]
summary: 한 주간의 수입·지출을 날짜별로 기록하고 분류별 소계와 총평을 정리하는 주간 가계부 양식입니다.
usage: >
  매주 정해진 요일에 한 주의 수입과 지출을 기록하면서 예산 대비 소비 흐름을 점검하는
  양식입니다. 날짜와 요일별로 항목·분류를 적고 수입·지출을 반영하여 남은 잔액을 계산합니다.
  분류별 소계로 식비·교통비 등 지출 비중을 한눈에 파악할 수 있고, 주간 총평에는 다음 주
  예산 조정 방향을 적어 두면 월간 가계부를 작성할 때에도 참고 자료로 활용할 수 있습니다.
source: original
featured: false
series: household-budget
series_name: 가계부
variant: 주간
variant_rank: 2
version: 1
created_by: agent
status: published

variant_use: 한 주 단위로 수입과 지출을 세세하게 관리할 때 씁니다.

howto:
  - 날짜와 요일별로 수입·지출 항목을 적습니다.
  - 항목별로 분류(식비·교통비 등)를 정합니다.
  - 분류별 소계를 계산해 지출 비중을 확인합니다.
  - 주간 총평에 다음 주 예산 조정 방향을 적습니다.

faq:
  - q: 고정 지출은 어느 주에 적나요?
    a: 실제로 결제된 주에 적는 것이 원칙이나, 매주 나누어 적어도 무방합니다.
  - q: 월간 가계부와 같이 써야 하나요?
    a: 주간 기록을 모아 월말에 월간 가계부로 옮겨 정리하면 흐름을 파악하기 좋습니다.
target_pages: 1

blocks:
  - type: doc_title
    text: 가계부 (주간)
    spaced: false

  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["주차", "", "기간", ""]
      - ["주간 예산", "", "", ""]
    sample_rows:
      - ["", "2026년 9월 2주차", "", "2026-09-07 ~ 09-13"]
      - ["", "250,000원", "", ""]

  - type: subtitle
    text: 1. 일별 수입·지출

  - type: table
    widths: [11, 9, 19, 13, 16, 16, 16]
    header: [날짜, 요일, 항목, 분류, "수입(원)", "지출(원)", "잔액(원)"]
    empty_rows: 12
    row_height_mm: 6.5
    sample_rows:
      - ["09-07", "월", "식비 마트 장보기", "식비", "", "45,000", "205,000"]
      - ["09-08", "화", "버스·지하철 충전", "교통", "", "8,000", "197,000"]
      - ["09-09", "수", "통신비 자동납부", "통신", "", "35,000", "162,000"]
      - ["09-10", "목", "용돈 입금", "수입", "100,000", "", "262,000"]
      - ["09-11", "금", "저녁 외식", "여가", "", "32,000", "230,000"]

  - type: subtitle
    text: 2. 분류별 소계

  - type: table
    widths: [14, 14, 14, 14, 14, 14, 16]
    header: [식비, 교통, 주거, 통신, 여가, 기타, 합계]
    empty_rows: 1
    row_height_mm: 8
    sample_rows:
      - ["45,000", "8,000", "0", "35,000", "32,000", "0", "120,000"]

  - type: subtitle
    text: 3. 주간 총평

  - type: textbox
    hint: "이번 주 소비 패턴과 다음 주 예산 계획을 적으십시오."
    height_mm: 25
    sample_text: 이번 주는 외식과 통신비 자동납부로 지출이 늘었다. 다음 주는 식비를 줄이고 남은 예산으로 저축을 늘릴 계획이다.

  - type: notice
    text: 지출 분류는 식비·교통·주거·통신·여가·기타 등 가구 상황에 맞게 자유롭게 수정하여 사용하십시오.
