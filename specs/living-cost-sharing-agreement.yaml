id: living-cost-sharing-agreement
title: 생활비 분담 약정서
category: personal
subcategory: life
tags: [생활비분담, 룸메이트, 공동생활, 공과금, 분담약정]
summary: 함께 사는 사람끼리 월세·공과금·식비 등 생활비를 어떻게 나눌지 미리 정해 두는 약정서입니다.
usage: >
  룸메이트나 동거 가족처럼 한 집에서 비용을 나누는 사람들이 분담 항목과 비율, 납부일, 정산 방법을 서로
  확인하려고 쓰는 서식입니다. 항목별로 누가 얼마를 내는지 적고, 변경과 퇴거 때의 처리 방식을 정해 둡니다.
  임대차계약상의 책임은 이 약정서와 별개이므로 계약서 내용을 따로 확인하십시오. 법률 판단을 대신하지
  않는 사적 합의 문서입니다.
source: original
featured: false
target_pages: 1
howto:
  - 함께 사는 사람들의 이름과 연락처를 적습니다.
  - 월세·공과금·식비 등 항목별 금액과 분담 비율을 적습니다.
  - 납부일과 정산 방법을 정해 적습니다.
  - 날짜를 적고 모두 서명해 사진이나 사본을 나눠 갖습니다.
faq:
  - q: 월세는 어떻게 나누는 게 좋나요?
    a: 방 크기나 사용 면적을 고려해 합의하면 됩니다. 정해진 기준은 없으니 서로 납득할 비율로 적으십시오.
  - q: 중간에 한 명이 나가면 어떻게 하나요?
    a: 퇴거 통지 시점과 정산 방법을 미리 적어 두면 분쟁이 줄어듭니다. 아래 특약란을 활용하십시오.
  - q: 임대인에게도 효력이 있나요?
    a: 아닙니다. 사는 사람들 사이의 합의이며 임대차계약의 책임은 계약서를 따로 확인하십시오.
related: [move-in-checklist, monthly-rent-receipt, household-budget, item-loan-confirmation]
blocks:
  - type: doc_title
    text: 생활비 분담 약정서
    spaced: false
  - type: subtitle
    text: 1. 공동생활 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["거주지", "", "", ""]
      - ["약정 기간", "", "정산일", ""]
    merges:
      - [0, 1, 0, 3]
    sample_rows:
      - ["", "서울시 ○○구 ○○로 1, 201호", "", ""]
      - ["", "2026-12-01 ~ 2027-05-31", "", "매월 25일"]
  - type: subtitle
    text: 2. 참여자
  - type: table
    widths: [8, 22, 30, 20, 20]
    header: ["No", 성명, 연락처, 입주일, 서명]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "박민준", "010-1234-5678", "2026-12-01", ""]
      - ["2", "이수현", "010-2345-6789", "2026-12-01", ""]
  - type: subtitle
    text: 3. 분담 내역
  - type: table
    widths: [8, 22, 22, 24, 24]
    header: ["No", 항목, 월 금액, 분담 비율, 납부 담당]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "월세", "900,000", "50 : 50", "박민준"]
      - ["2", "관리비·공과금", "150,000", "50 : 50", "이수현"]
      - ["3", "인터넷", "30,000", "50 : 50", "이수현"]
  - type: subtitle
    text: 4. 특약
  - type: textbox
    hint: "퇴거·변경·연체 때의 처리 방식 등 따로 정한 내용을 적으십시오."
    height_mm: 20
    sample_text: "퇴거는 30일 전에 알리고, 마지막 달 비용은 사용 일수에 맞춰 나누어 정산한다."
  - type: para
    text: 위 내용을 서로 확인하고 성실히 지키기로 약정합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   14 일
  - type: notice
    text: 임대차계약상의 책임은 계약서를 따로 확인하십시오.
