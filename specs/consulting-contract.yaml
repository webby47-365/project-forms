id: consulting-contract
title: 컨설팅 계약서
category: legal
subcategory: contract
tags: [컨설팅계약서, 경영컨설팅, 자문계약서, 컨설팅용역, 전문가자문]
summary: 컨설팅 범위·투입 인력·보수와 지식재산권·경업금지·비밀유지를 정하는 컨설팅 계약서입니다.
usage: >
  경영·마케팅·기술 등 특정 분야의 자문을 의뢰하는 의뢰인과 컨설턴트(법인 또는 개인)가
  체결하는 계약서입니다. 컨설팅 범위와 투입 인력, 기간을 구체적으로 정해야 추가 업무를
  둘러싼 다툼을 줄일 수 있습니다. 보수의 지급 시기와 방법, 산출물의 지식재산권 귀속,
  컨설팅 과정에서 알게 된 정보에 대한 비밀유지와 경업금지 범위를 반드시 명시하십시오.
  본 서식은 참고용이며 법적 효력과 적합성은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

howto:
  - 컨설팅 범위와 투입 인력, 기간을 구체적으로 정합니다.
  - 보수 금액과 지급 시기·방법을 명시합니다.
  - 산출물의 지식재산권 귀속을 정합니다.
  - 비밀유지와 경업금지 범위를 적고 서명합니다.

faq:
  - q: 추가 업무가 생기면 어떻게 하나요?
    a: 계약서에 정한 범위를 벗어나는 업무는 별도 협의나 추가 계약으로 처리하도록 조항에 미리 정해 두십시오.
  - q: 위약금 조항이 꼭 필요한가요?
    a: 필수는 아니지만, 계약 위반 시 책임 소재를 명확히 하기 위해 위약금이나 손해배상 조항을 넣는 경우가 많습니다.

related: [nda, quotation, invoice-request]

blocks:
  - type: doc_title
    text: 컨설팅 계약서
    spaced: false
  - type: para
    text: 갑과 을은 다음과 같이 컨설팅 계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["갑(의뢰인)", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["을(컨설턴트)", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "(주)새길데이터", "", "000-00-00000"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-5678-1234"]
  - type: subtitle
    text: 계약 조건
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["컨설팅명", "", "컨설팅 분야", ""]
      - ["계약기간", "", "투입 인력", ""]
      - ["보수(총액)", "", "지급방법", ""]
    sample_rows:
      - ["", "온라인 판매채널 확장 전략 컨설팅", "", "마케팅·유통전략"]
      - ["", "2026-10-01 ~ 2026-12-31 (3개월)", "", "컨설턴트 2명"]
      - ["", "금 24,000,000원 (금 이천사백만원)", "", "매월 말 8,000,000원씩 3회 지급"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 갑이 을에게 위 컨설팅명의 자문 업무를 의뢰하고, 을이 전문성을 바탕으로 이를 수행하는 것을 목적으로 한다."
  - type: article
    heading: 제2조 (컨설팅 범위)
    lines:
      - "을의 컨설팅 범위는 위 컨설팅 분야에 관한 현황 분석, 개선안 제시 및 실행 자문으로 한다."
      - "범위를 벗어난 추가 업무는 당사자가 서면으로 합의한 경우에 한하여 수행하며, 대가는 별도로 정한다."
  - type: article
    heading: 제3조 (기간과 투입 인력)
    lines:
      - "컨설팅 기간은 위 계약기간에 따르며, 을은 위 투입 인력을 배치하여 업무를 수행한다."
      - "투입 인력을 변경할 필요가 있는 경우 을은 사전에 갑의 동의를 받는다."
  - type: article
    heading: 제4조 (보수와 지급)
    lines:
      - "갑은 을에게 위 보수를 위 지급방법에 따라 을이 지정한 계좌로 지급한다."
      - "갑이 지급을 지체하는 경우 지체일수에 대하여 당사자가 합의한 지연이자를 지급한다."
  - type: article
    heading: 제5조 (자료 제공과 협조)
    lines:
      - "갑은 컨설팅 수행에 필요한 자료와 정보를 신의에 따라 성실히 제공하고, 을이 요청하는 관계자 면담 등에 협조한다."
      - "갑이 제공한 자료가 사실과 다르거나 부족하여 발생한 결과에 대하여는 을의 책임을 제한할 수 있다."
  - type: page_break
  - type: article
    heading: 제6조 (성과물과 지식재산권)
    lines:
      - "을은 컨설팅 결과를 보고서 등 성과물로 작성하여 갑에게 제출한다."
      - "성과물에 관한 지식재산권은 보수가 완납된 때 갑에게 귀속한다. 다만 을이 기존에 보유한 방법론·도구는 을에게 귀속한다."
  - type: article
    heading: 제7조 (비밀유지)
    lines:
      - "당사자는 컨설팅 수행 중 알게 된 상대방의 경영정보, 영업비밀 및 개인정보를 제3자에게 누설하지 아니하며, 이 의무는 계약 종료 후 3년간 존속한다."
  - type: article
    heading: 제8조 (경업금지)
    lines:
      - "을은 계약기간 중 갑의 사전 동의 없이 갑과 직접 경쟁하는 사업자에게 동일한 컨설팅 범위의 자문을 제공하지 아니한다."
  - type: article
    heading: 제9조 (계약의 해지)
    lines:
      - "당사자 일방이 계약상 의무를 중대하게 위반한 경우 상대방은 상당한 기간을 정하여 시정을 요구한 후 계약을 해지할 수 있다."
  - type: article
    heading: 제10조 (손해배상)
    lines:
      - "당사자 일방이 본 계약을 위반하여 상대방에게 손해를 입힌 경우 그 손해를 배상한다."
  - type: article
    heading: 제11조 (관할)
    lines:
      - "본 계약에 관한 분쟁은 갑의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["갑(의뢰인)", "을(컨설턴트)"]
    sample_names: ["(주)한빛커머스 대표 김서연", "(주)새길데이터 대표 박민준"]
  - type: notice
    text: 본 계약은 참고용이며 컨설팅의 규모와 특성에 맞게 조정하여 사용하시고, 법적 효력은 관련 법령과 개별 사안을 확인하십시오.
