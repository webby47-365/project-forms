id: gift-receipt-report
title: 금품 등 수령신고서
category: corp
subcategory: admin
tags: [금품등수령신고서, 청탁금지법신고서, 선물수령신고서, 접대수수신고서, 금품수수신고]
summary: 업무 관련자로부터 금품·선물을 받았을 때 수령 경위와 처리 방법을 신고하는 사내 서식입니다.
usage: >
  거래처나 민원인 등 업무 관련자로부터 금품·선물을 받았을 때, 반려하지 못했거나 받은 뒤
  신고가 필요한 경우 수령 경위와 품목·금액(상당액)을 적어 소속 부서에 신고하는 서식입니다.
  신고 후에는 반환·소속기관 인도·사회복지시설 기부 등 처리 방법을 정해 진행합니다. 허용되는
  금품의 기준과 신고 의무 범위는 회사마다 다르므로 사규를 확인한 뒤 작성하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 수령자와 제공자의 인적사항을 적습니다.
  - 수령한 품목과 수량, 금액(상당액)을 적습니다.
  - 수령 경위와 처리 방법을 적습니다.
  - 부서장(감사부서) 확인을 받아 제출합니다.

faq:
  - q: 반려하지 못하고 받은 경우에도 신고해야 하나요?
    a: 반려가 어려워 일단 받은 경우에도 신고 후 처리 방법을 안내받는 것이 안전합니다.
  - q: 금액을 정확히 모르면 어떻게 적나요?
    a: 시가를 추정한 상당액을 적고 추정 근거를 비고란에 함께 남기십시오.
  - q: 신고한 물품은 이후 어떻게 처리되나요?
    a: 소속 기관 규정에 따라 반환·인도·기부 등으로 처리되며 담당 부서 안내를 따릅니다.

related: [receipt, gov-donation-receipt]

blocks:
  - type: doc_title
    text: 금품 등 수령신고서
    spaced: false

  - type: subtitle
    text: 1. 수령자

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["소속·부서", "", "직위", ""]
      - ["성명", "", "연락처", ""]
    sample_rows:
      - ["", "영업2팀", "", "대리"]
      - ["", "홍길동", "", "010-1234-5678"]

  - type: subtitle
    text: 2. 제공자

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["소속(상호)", "", "성명", ""]
      - ["관계", "", "연락처", ""]
    sample_rows:
      - ["", "(주)새길데이터", "", "김서연"]
      - ["", "거래처 대표", "", "010-9876-5432"]

  - type: subtitle
    text: 3. 수령 내역

  - type: table
    widths: [8, 18, 34, 12, 16, 12]
    header: ["No", 수령일시, 품목, 수량, "금액(상당액)", 비고]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2026-09-10 14:00", "선물세트(홍삼)", "1개", "150,000원", "거래처 방문 시 수령"]

  - type: textbox
    hint: "수령 경위와 반려하지 못한 사정 등을 구체적으로 적으십시오."
    height_mm: 18
    sample_text: 거래처 대표가 사무실 방문 시 명절 인사로 두고 가 그 자리에서 반려하지 못하고 수령함.

  - type: subtitle
    text: 4. 처리 방법

  - type: grid
    widths: [20, 50, 15, 15]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["처리 방법", "반환 / 소속기관 인도 / 사회복지시설 기부 / 기타", "처리일", ""]
    sample_rows:
      - ["", "사회복지시설 기부", "", "2026-09-12"]

  - type: date_line
    sample_text: 2026 년    9 월   18 일

  - type: sign_line
    labels: ["작성자(수령자)", "부서장(확인)"]
    sample_names: [홍길동, 이수현]

  - type: notice
    text: 허용되는 금품의 기준과 신고 의무 범위는 소속 기관의 청탁금지법 관련 사규를 확인하십시오.
