id: workforce-headcount-change-confirmation
title: 사업장 근로자 수 변동 확인서
category: public
subcategory: insurance
tags: [근로자수, 인원변동, 4대보험, 사업장, 확인서]
summary: 사업장의 월별 근로자 수 변동 내역을 정리해 4대보험 관련 제출용으로 남기는 사업장 근로자 수 변동 확인서 양식입니다.
usage: >
  지원금 신청이나 보험 관련 확인에서 월별 근로자 수 증감을 보여 줘야 할 때 쓰는 서식입니다.
  사업장 정보와 기준 기간을 적고 월별 입사자 수, 퇴사자 수, 월말 근로자 수를 한 줄씩 정리합니다.
  근로자 개인정보는 적지 않고 인원 수만 적습니다. 인정 기준과 증빙은 제출처마다 다르므로 제출처 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 사업장명과 사업자 구분, 기준 기간을 적습니다.
  - 월별 입사자 수와 퇴사자 수를 적습니다.
  - 월말 근로자 수를 계산해 적습니다.
  - 대표자가 서명하고 제출처에 냅니다.
faq:
  - q: 근로자 이름도 적어야 하나요?
    a: 이 서식에는 인원 수만 적습니다. 명단이 필요한지는 제출처에 확인하십시오.
  - q: 월말 근로자 수는 어떻게 구하나요?
    a: 전월 말 인원에 이번 달 입사자를 더하고 퇴사자를 뺍니다. 제출처 산정 기준이 있으면 그에 따릅니다.
related: [insurance-enrollment-confirmation-request, social-insurance-payment-certificate-request, social-insurance-correction-request, social-insurance-filing-poa]
blocks:
  - type: doc_title
    text: 사업장 근로자 수 변동 확인서
    spaced: false
  - type: subtitle
    text: 1. 사업장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["사업장명", "", "대표자", ""]
      - ["기준 기간", "", "연락처", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "홍길동"]
      - ["", "2026.06~2026.10", "", "02-000-0000"]
  - type: subtitle
    text: 2. 월별 근로자 수 변동
  - type: table
    widths: [10, 22, 22, 22, 24]
    header: ["No", 해당 월, 입사자 수, 퇴사자 수, 월말 근로자 수]
    empty_rows: 6
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2026-06", "2", "0", "12"]
      - ["2", "2026-07", "1", "1", "12"]
      - ["3", "2026-08", "0", "1", "11"]
      - ["4", "2026-09", "2", "0", "13"]
  - type: textbox
    hint: "인원 변동의 사유나 제출 목적을 적으십시오."
    height_mm: 20
    sample_text: "신규 채용과 계약 만료에 따른 인원 변동이며, 지원금 신청 증빙용으로 제출합니다."
  - type: para
    text: 위 내용이 사실임을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   11 일
  - type: sign_line
    labels: ["확인자(대표자)"]
    sample_names: [홍길동]
  - type: notice
    text: 인정 기준과 증빙은 제출처 안내를 확인하십시오.
