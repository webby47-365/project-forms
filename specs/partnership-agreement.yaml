id: partnership-agreement
title: 동업계약서
category: corp
subcategory: startup
tags: [동업계약서, 공동창업계약, 지분약정서, 동업약정]
summary: 동업자의 출자·지분·역할과 손익분배, 탈퇴·해산 조건을 정하는 동업계약서입니다.
usage: >
  공동으로 사업을 시작할 때 가장 먼저 서면으로 남겨야 하는 문서입니다. 분쟁은 대부분 지분,
  의사결정 방법, 한쪽이 빠질 때의 정산에서 발생하므로 이 세 가지를 구체적인 숫자와 절차로
  적어야 합니다. 출자는 현금·현물·노무를 구분해 평가액을 기재하고, 경업금지와 지분 양도
  제한도 함께 정해 두십시오. 본 서식은 참고용이며 개별 사안의 법적 적합성은 이용자가
  확인해야 합니다.
source: original
featured: false
target_pages: 2

howto:
  - 동업자 인적사항과 출자 내역을 적습니다.
  - 출자 형태를 현금, 현물, 노무로 구분해 평가액을 적습니다.
  - 지분율과 담당 역할을 나눠 적습니다.
  - 손익분배 방법과 탈퇴·해산 조건을 정합니다.
  - 경업금지와 지분 양도 제한을 적습니다.

faq:
  - q: 노무 출자는 어떻게 평가하나요?
    a: 동업자끼리 협의해 금액으로 환산한 평가액을 정하고 그 근거를 함께 기록해 두는 것이 좋습니다.
  - q: 한쪽이 중간에 빠지면 어떻게 되나요?
    a: 계약서에 정한 탈퇴 절차와 지분 정산 방법에 따라 처리합니다.

related: [partnership-dissolution-agreement, business-reg-checklist, joint-venture-contract, business-plan-standard]

blocks:
  - type: doc_title
    text: 동업계약서
    spaced: false
  - type: para
    text: 아래 당사자는 공동으로 사업을 영위하기 위하여 다음과 같이 계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 동업자 및 출자 내역
  - type: table
    widths: [16, 14, 16, 18, 18, 18]
    header: [성명, 생년월일, 출자형태, 출자 평가액, 지분율, 담당 역할]
    empty_rows: 4
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["홍길동", "1985-03-11", "현금", "3,000만원", "60%", "대표/영업"]
      - ["김서연", "1988-07-22", "현물", "2,000만원", "40%", "생산/품질"]
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사업체명", "", "사업 개시일", ""]
      - ["사업장 소재지", "", "사업 종목", ""]
    sample_rows:
      - ["", "한빛물산", "", "2026-10-01"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "생활용품 유통업"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 당사자가 공동으로 위 사업을 영위함에 있어 출자·지분·업무분담·손익분배 및 탈퇴에 관한 사항을 정함을 목적으로 한다."
  - type: article
    heading: 제2조 (출자)
    lines:
      - "각 동업자는 위 표에 기재된 출자를 계약 체결일부터      일 내에 이행한다."
      - "노무 출자는 그 평가액과 최소 근무조건을 위 표 및 별지에 명시하며, 이를 이행하지 않을 경우 지분을 재조정한다."
  - type: article
    heading: 제3조 (지분)
    lines:
      - "지분은 위 표에 따르며, 추가 출자·증자로 지분이 변동되는 경우 전원의 서면 합의로 정한다."
      - "동업자는 다른 동업자 전원의 서면 동의 없이 지분의 전부 또는 일부를 제3자에게 양도하거나 담보로 제공할 수 없다."
  - type: article
    heading: 제4조 (업무집행과 의사결정)
    lines:
      - "일상적인 업무는 각자 담당 역할에 따라 집행한다."
      - "다음 사항은 동업자 전원의 서면 합의로 결정한다. 신규 차입, 자산의 처분, 신규 동업자 영입, 사업 종목의 변경, 금             원 이상의 지출."
      - "그 외 사항은 지분 과반수의 동의로 결정한다."
  - type: article
    heading: 제5조 (손익의 분배)
    lines:
      - "손익은 지분율에 따라 분배하며, 분배 시기는 매      개월마다 결산 후      일 내로 한다."
      - "동업자에게 지급하는 급여 또는 활동비는 손익분배와 별도로 하며 그 금액은 전원 합의로 정한다."
  - type: article
    heading: 제6조 (회계와 열람)
    lines:
      - "사업의 회계는 별도 계좌로 관리하고 모든 수입·지출은 증빙을 보관한다."
      - "각 동업자는 언제든지 장부와 증빙의 열람·복사를 요구할 수 있다."
  - type: article
    heading: 제7조 (경업금지)
    lines:
      - "동업자는 계약 기간 중 및 탈퇴 후      년간 동일·유사한 사업을 직접 또는 제3자를 통하여 영위하지 않는다."
  - type: article
    heading: 제8조 (탈퇴와 정산)
    lines:
      - "동업자는      개월 전 서면 통지로 탈퇴할 수 있다."
      - "탈퇴자의 지분은 탈퇴일 기준 순자산에 지분율을 곱한 금액으로 평가하여      개월 내에 정산한다. 평가에 이견이 있으면 쌍방이 합의한 회계사의 평가에 따른다."
      - "잔존 동업자는 탈퇴자의 지분을 우선 매수할 권리를 가진다."
  - type: article
    heading: 제9조 (제외)
    lines:
      - "동업자가 출자를 이행하지 않거나 횡령·배임 등 중대한 의무 위반을 한 경우 다른 동업자 전원의 합의로 제외할 수 있다."
  - type: article
    heading: 제10조 (해산)
    lines:
      - "사업의 해산은 동업자 전원의 합의로 하며, 잔여재산은 채무를 변제한 후 지분율에 따라 분배한다."
  - type: article
    heading: 제11조 (분쟁해결)
    lines:
      - "본 계약에 관한 분쟁은 상호 협의로 해결하되, 협의가 되지 않으면 사업장 소재지 관할법원을 제1심 관할법원으로 한다."
  - type: subtitle
    text: 특약사항
  - type: textbox
    hint: "상표·특허 등 지식재산의 귀속, 가족의 사업 참여, 배우자 동의 여부 등 합의한 내용을 기재하십시오."
    height_mm: 22
    sample_text: 상표 출원비용은 공동 부담하며, 등록 후 권리는 사업체 명의로 한다.
  - type: para
    text: 본 계약을 증명하기 위하여 동업자 수만큼 계약서를 작성하여 각자 1부씩 보관한다.
    align: center
    size: 10
    space_after: 2
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: table
    widths: [22, 30, 26, 22]
    header: [구분, 성명, 주소, 서명 또는 인]
    rows:
      - ["동업자", "", "", ""]
    empty_rows: 2
    row_height_mm: 11
    body_align: center
    sample_rows:
      - ["동업자", "김서연", "서울특별시 강남구 테헤란로 50", ""]
  - type: notice
    text: 본 서식은 참고용이며 개별 사안에 대한 법적 효력과 적합성은 이용자가 확인해야 합니다. 출자금이 크거나 지식재산이 관련된 경우 반드시 전문가의 검토를 받으십시오.
