id: annual-leave-plan-submission-request
title: 연차 사용계획 제출 요청서
category: corp
subcategory: hr
tags: [연차 사용계획 제출, 연차 계획 요청, 연차 사용 촉진, 연차계획서 제출 요청, 연차 안내]
summary: 남은 연차의 사용 시기를 정해 제출하도록 근로자에게 기한을 정해 요청하는 연차 사용계획 제출 요청서 양식입니다.
usage: >
  연차 사용 촉진 시기에 근로자별 남은 연차 일수를 알리고 사용계획 제출을 요청하는 회사용 문서입니다.
  대상자, 남은 연차 일수, 제출 기한, 제출 방법을 적고 근로자가 확인해 서명하도록 합니다.
  법에 따른 연차 사용 촉진의 방식과 기한은 정해진 절차를 따라야 하므로 이 요청서는 안내용으로 쓰고,
  실제 촉진 통지는 연차 사용 촉진 통지서 등으로 별도로 진행하며 고용노동부 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 요청 대상자와 남은 연차 일수를 적습니다.
  - 제출 기한과 제출 방법을 적습니다.
  - 요청 날짜와 담당자를 적습니다.
  - 근로자가 수령을 확인하고 서명합니다.
faq:
  - q: 이 요청서만으로 연차 사용 촉진이 되나요?
    a: 이 문서는 제출을 안내하는 용도입니다. 법에 따른 촉진은 정해진 통지 절차와 기한을 따라야 하므로 별도로 확인하십시오.
  - q: 제출 기한은 어떻게 정하나요?
    a: 근로자가 계획을 세울 시간을 줄 수 있도록 여유 있게 정하고, 회사의 촉진 일정에 맞추십시오.
related: [annual-leave-promotion-notice, annual-leave-plan, annual-leave-reply, annual-leave-team-schedule]
blocks:
  - type: doc_title
    text: 연차 사용계획 제출 요청서
    spaced: false
  - type: subtitle
    text: 1. 요청 대상
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "부서·직위", ""]
      - ["입사일", "", "발생 연차", ""]
      - ["사용 연차", "", "남은 연차", ""]
    sample_rows:
      - ["", "김서연", "", "영업팀 · 대리"]
      - ["", "2022-03-02", "", "16일"]
      - ["", "8일", "", "8일"]
  - type: subtitle
    text: 2. 제출 안내
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["제출 기한", "", "제출 방법", ""]
      - ["제출처", "", "", ""]
    sample_rows:
      - ["", "2026-11-10", "", "서면 · 메일"]
      - ["", "인사팀 박민준 (hr@example.com)", "", ""]
  - type: textbox
    hint: "추가 안내 사항이 있으면 적으십시오 (사용 가능 기간, 부서 일정 조율 등)."
    height_mm: 24
    sample_text: 남은 연차의 사용 시기를 정해 제출 기한까지 알려 주시기 바랍니다. 부서 일정 때문에 조율이 필요하면 팀장과 먼저 협의해 주십시오.
  - type: para
    text: 위와 같이 연차 사용계획의 제출을 요청합니다.
  - type: date_line
    sample_text: 2026 년   10 월   26 일
  - type: sign_line
    labels: ["요청자", "수령 확인(근로자)"]
    sample_names: [박민준, 김서연]
  - type: notice
    text: 법에 따른 연차 사용 촉진은 정해진 통지 절차와 기한을 따라야 합니다. 고용노동부 안내를 확인하십시오.
