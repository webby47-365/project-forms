id: business-plan-standard
title: 사업계획서 (표준형)
category: corp
subcategory: startup
tags: [사업계획서, 창업사업계획서, 사업계획서양식, 투자제안서, 정책자금신청]
summary: 사업 개요부터 시장분석·제품·자금조달·손익추정·추진일정까지 담는 표준 사업계획서입니다.
usage: >
  은행 대출, 정책자금 신청, 투자 유치, 정부 지원사업 제출용으로 사업 전반을 체계적으로
  설명할 때 사용합니다. 사업 개요와 시장·경쟁 분석으로 사업의 타당성을 보이고, 제품·서비스의
  차별점과 판매 전략을 구체적으로 적어야 신뢰를 얻습니다. 소요 자금과 조달 계획, 3개년
  손익 추정치를 숫자로 제시하고, 추진 일정으로 실행 가능성을 보여주십시오. 제출 기관이
  별도 양식을 지정한 경우 그 양식을 우선 사용하십시오.
source: original
featured: false
created_by: agent
status: published
version: 1
target_pages: 2
series: business-plan
series_name: 사업계획서
variant: 표준형
variant_rank: 1
blocks:
  - type: doc_title
    text: 사업계획서
    spaced: false

  - type: subtitle
    text: 1. 기업 개요
  - type: grid
    widths: [14, 36, 14, 36]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사업명", "", "대표자", ""]
      - ["업종", "", "설립예정일", ""]
      - ["소재지", "", "연락처", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "김서연"]
      - ["", "모바일 식품 배달 중개업", "", "2026-11-02"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]

  - type: subtitle
    text: 2. 사업 개요
  - type: textbox
    hint: "사업 아이템과 핵심 가치를 요약하십시오."
    height_mm: 18
    sample_text: "당사는 전국 소상공인 식당과 소비자를 연결하는 모바일 배달 중개 플랫폼을 운영하며, 수수료 기반 수익 모델로 지속 성장을 추구합니다."

  - type: subtitle
    text: 3. 시장 및 경쟁 분석
  - type: textbox
    hint: "목표 시장 규모, 성장성, 경쟁사 현황과 자사의 강점을 기재하십시오."
    height_mm: 18
    sample_text: "국내 배달 중개 시장은 연평균 12% 성장 중이며, 대형 플랫폼 3사가 과점하고 있어 지역 상권 특화 서비스로 틈새시장을 공략할 계획입니다."

  - type: subtitle
    text: 4. 제품·서비스
  - type: table
    widths: [20, 50, 30]
    header: [구분, 내용, 차별점]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["플랫폼 앱", "소비자용 주문 앱 및 사장님용 관리 앱 제공", "지역 상권 특화 추천 알고리즘"]
      - ["배달 대행", "제휴 라이더를 통한 실시간 배달 서비스", "평균 배달시간 20분 이내"]

  - type: subtitle
    text: 5. 판매 전략
  - type: textbox
    hint: "고객 확보·마케팅·가격 전략을 구체적으로 기재하십시오."
    height_mm: 16
    sample_text: "오픈 초기 6개월은 입점 수수료를 면제해 가맹점을 확보하고, 이후 지역 커뮤니티 마케팅과 재구매 포인트 적립으로 충성도를 높입니다."

  - type: subtitle
    text: 6. 소요 자금 및 조달 계획
  - type: table
    widths: [30, 30, 40]
    header: [용도, 금액, 조달방법]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["앱 개발 및 서버 구축", "80,000,000원", "자기자본"]
      - ["초기 마케팅비", "30,000,000원", "정책자금 대출"]

  - type: subtitle
    text: 7. 추정 손익
  - type: table
    widths: [25, 25, 25, 25]
    header: [구분, 1년차, 2년차, 3년차]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["매출액", "200,000,000원", "450,000,000원", "800,000,000원"]
      - ["영업이익", "-30,000,000원", "20,000,000원", "90,000,000원"]

  - type: subtitle
    text: 8. 추진 일정
  - type: table
    widths: [15, 55, 30]
    header: [단계, 내용, 기간]
    empty_rows: 4
    row_height_mm: 8
    sample_rows:
      - ["1단계", "앱 개발 및 베타테스트", "2026.10~2026.12"]
      - ["2단계", "정식 출시 및 초기 마케팅", "2027.01~2027.03"]

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    label: 대표자
    sample_names: [김서연]

  - type: notice
    text: 본 사업계획서는 참고용 구성입니다. 제출 기관(은행·투자기관·지원사업)이 별도 양식을 지정한 경우 그 양식을 우선 사용하십시오.
