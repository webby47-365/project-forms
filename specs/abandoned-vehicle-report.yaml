id: abandoned-vehicle-report
title: 방치 차량 신고서
category: public
subcategory: vehicle
tags: [방치차량, 방치차량신고, 무단방치, 장기주차, 차량신고]
summary: 도로나 주차장, 공터에 오랫동안 세워진 방치 의심 차량의 위치와 상태를 적어 관할 기관에 신고하는 방치 차량 신고서 양식입니다.
usage: >
  오랫동안 움직이지 않는 차량이 통행이나 주차를 막을 때 위치와 상태를 정리해 관할 구청이나 관리 주체에 내는 서식입니다.
  차량 번호와 종류, 방치된 장소, 처음 발견한 날, 차량 상태를 적고 사진을 붙입니다.
  방치 여부의 판단과 처리 절차는 관할 기관이 정하므로 사실만 적고 추측은 쓰지 않습니다.
  신고 방법과 접수 창구는 지역마다 다르니 관할 기관 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신고자 성명과 연락처, 신고일을 적습니다.
  - 차량 번호와 종류, 색상을 적습니다.
  - 방치된 장소와 처음 발견한 날, 현재 상태를 적습니다.
  - 사진 등 증빙을 붙여 관할 기관에 냅니다.
faq:
  - q: 차량 소유자를 모르면 신고할 수 없나요?
    a: 소유자를 몰라도 차량 번호와 위치만 있으면 신고할 수 있습니다. 소유자 확인은 관할 기관이 합니다.
  - q: 사진은 꼭 붙여야 하나요?
    a: 필수는 아니지만 위치와 상태를 보여 주는 사진이 있으면 확인이 빠릅니다. 번호판이 보이게 찍으십시오.
  - q: 신고하면 바로 견인되나요?
    a: 아닙니다. 소유자 확인과 안내 등 절차를 거치며 기간은 기관과 상황에 따라 다릅니다.
related: [illegal-dumping-report, vehicle-deregistration-poa, road-repair-request, noise-complaint]
