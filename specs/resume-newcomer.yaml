id: resume-newcomer
title: 이력서 (신입용)
category: personal
subcategory: career
tags: [이력서, 신입이력서, 신입공채, 대외활동, 인턴, resume]
summary: 학력·전공과 대외활동·인턴·수상·어학 자격을 중심으로 작성하는 신입 구직자용 이력서입니다.
usage: >
  경력이 거의 없는 신입 구직자가 공채·수시채용에 제출하는 이력서입니다. 경력 대신 학력과 전공,
  대외활동·인턴 경험, 수상 내역, 어학·자격증을 충분히 기재해 직무 역량을 드러내십시오. 학력은
  고등학교부터 최종학력까지 역순으로 적고, 대외활동은 맡은 역할과 성과가 드러나게 씁니다.
  경력이 전혀 없다면 해당 칸에 "해당 없음"으로 표기해도 무방합니다.
source: original
featured: false
target_pages: 1
series: resume
series_name: 이력서
variant: 신입용
variant_rank: 2
version: 1
created_by: agent
status: published

variant_use: 경력이 없는 신입 구직자가 공채에 지원할 때 씁니다.

howto:
  - 인적사항과 연락처를 적습니다.
  - 학력을 고등학교부터 최종학력까지 역순으로 적습니다.
  - 대외활동과 인턴 경험을 역할과 성과 중심으로 적습니다.
  - 수상 내역과 어학·자격증을 기재합니다.
  - 최종 확인 후 서명하고 제출합니다.

faq:
  - q: 경력이 전혀 없으면 어떻게 적나요?
    a: 경력 칸에 해당 없음이라고 적어도 무방합니다.
  - q: 대외활동은 몇 개까지 적어야 하나요?
    a: 지원 직무와 관련성이 높은 활동 위주로 골라서 적는 것이 좋습니다.

