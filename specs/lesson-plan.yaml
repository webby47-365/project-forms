id: lesson-plan
title: 수업 지도안
category: edu
subcategory: school
tags: [수업지도안, 교수학습지도안, 수업계획안, 학습지도안, 교안]
summary: 수업 개요와 학습 목표, 교수·학습 과정, 평가 계획을 단계별로 정리하는 수업 지도안입니다.
usage: >
  교사가 한 차시 수업을 준비하며 학습 목표부터 평가 계획까지 체계적으로 정리할 때 쓰는
  서식입니다. 교수·학습 과정은 도입·전개·정리 단계별로 학습 내용과 교수·학생 활동, 소요
  시간, 준비 자료를 나누어 적으면 수업 흐름을 한눈에 점검할 수 있습니다. 평가 계획에는
  평가 내용과 방법, 기준을 함께 적어 수업 목표 달성 여부를 확인할 수 있게 하십시오. 수업
  대상과 차시를 정확히 기재해 동 교과 협의회 자료로도 활용하십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

howto:
  - 수업 대상과 단원, 차시를 적습니다.
  - 학습 목표를 적습니다.
  - 도입·전개·정리 단계별로 학습 내용과 활동을 적습니다.
  - 단계별 소요 시간과 준비 자료를 적습니다.
  - 평가 내용과 방법, 기준을 적습니다.

faq:
  - q: 도입·전개·정리 시간 배분은 어떻게 하나요?
    a: 한 차시 전체 시간에 맞춰 도입과 정리는 짧게, 전개는 가장 길게 배분하는 것이 일반적입니다.
  - q: 평가 계획은 꼭 채점 기준까지 적어야 하나요?
    a: 협의회나 장학 자료로 쓴다면 평가 기준까지 적는 것이 좋고, 단순 수업용이면 평가 방법 정도만 적어도 됩니다.

blocks:
  - type: doc_title
    text: 수업 지도안

  - type: subtitle
    text: 1. 수업 개요

  - type: grid
    widths: [14, 22, 14, 14, 14, 22]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["과목", "", "단원", "", "차시", ""]
      - ["대상", "", "일시", "", "장소", ""]
      - ["지도교사", "", "", "", "", ""]
    sample_rows:
      - ["", "수학", "", "일차방정식", "", "3/10"]
      - ["", "2학년 3반", "", "2026-09-21 2교시", "", "2학년 3반 교실"]
      - ["", "김서연", "", "", "", ""]

  - type: subtitle
    text: 2. 학습 목표

  - type: kv_list
    items:
      - "일차방정식의 뜻을 설명할 수 있다."
      - "등식의 성질을 이용해 일차방정식을 풀 수 있다."
      - "실생활 문제를 일차방정식으로 나타내고 해결할 수 있다."

  - type: subtitle
    text: 3. 교수·학습 과정

  - type: table
    widths: [10, 24, 20, 20, 10, 16]
    header: [단계, 학습 내용, 교수 활동, 학생 활동, 시간, 자료]
    empty_rows: 8
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["도입", "전시 학습 확인", "질문으로 복습 유도", "질문에 답변", "5분", "PPT"]
      - ["전개", "일차방정식 풀이", "예제 설명, 순회 지도", "모둠별 문제 풀이", "30분", "학습지"]
      - ["정리", "핵심 내용 정리", "요약 질의응답", "배운 내용 발표", "5분", ""]

  - type: subtitle
    text: 4. 평가 계획

  - type: table
    widths: [30, 30, 40]
    header: [평가 내용, 평가 방법, 기준]
    empty_rows: 3
    row_height_mm: 9
    sample_rows:
      - ["일차방정식 풀이 능력", "학습지 풀이 확인", "풀이 과정과 답의 정확성"]
      - ["수업 참여도", "관찰 평가", "모둠 활동 참여 정도"]

  - type: subtitle
    text: 5. 유의사항

  - type: textbox
    hint: "지도상 유의할 점, 학습 지원이 필요한 부분 등을 기재하십시오."
    height_mm: 20
    sample_text: 등식의 성질 개념이 약한 학생은 모둠 활동 중 개별 확인을 병행한다.

  - type: notice
    text: 차시별 진행 상황에 따라 시간 배분과 활동 내용은 현장에서 조정할 수 있습니다.
