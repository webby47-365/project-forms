id: subcontract-notification
title: 하도급 계약 통보서
category: public
subcategory: procure
tags: [하도급, 하도급통보, 계약상대자, 발주처통보, 조달계약]
summary: 계약상대자가 계약 일부를 하도급으로 맡기게 되었을 때 그 내용을 발주처에 알리는 하도급 계약 통보서 양식입니다.
usage: >
  원 계약을 맡은 업체가 일부 공정이나 용역을 다른 업체에 맡길 때, 계약서나 관련 규정에 따라 발주처에 알려야 하는 경우가 있습니다.
  이 서식에는 원 계약 정보, 하도급 업체와 하도급 범위, 금액과 기간을 적습니다.
  통보 또는 승인이 필요한지와 제출 기한은 계약서와 관련 법령에 따라 다르므로 계약 담당자에게 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 원 계약의 계약명과 계약번호를 적습니다.
  - 하도급 업체의 상호와 대표자, 연락처를 적습니다.
  - 하도급 범위와 금액, 기간을 적습니다.
  - 날짜를 적고 서명·날인합니다.
faq:
  - q: 하도급은 항상 통보해야 하나요?
    a: 계약서와 관련 법령에 따라 통보나 승인이 필요한 경우가 있습니다. 해당 여부는 계약 담당자에게 확인하십시오.
  - q: 하도급 계약서 사본도 내나요?
    a: 발주처가 요구하는 경우가 많으므로 사본을 함께 준비해 두는 것이 무난합니다. 필요 서류는 발주처 안내를 확인하십시오.
related: [subcontract-agreement, work-commencement-report, progress-payment-claim, integrity-pledge-bidding]
blocks:
  - type: doc_title
    text: 하도급 계약 통보서
    spaced: true
  - type: subtitle
    text: 1. 원 계약 정보
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges: [[0, 1, 0, 3]]
    rows:
      - ["계약명", "", "", ""]
      - ["계약번호", "", "계약금액(원)", ""]
      - ["원 계약업체", "", "대표자", ""]
    sample_rows:
      - ["", "본관 사무실 내부 개선공사", "", ""]
      - ["", "2026-0123", "", "58,000,000"]
      - ["", "(주)새길건설", "", "김서연"]
  - type: subtitle
    text: 2. 하도급 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges: [[3, 1, 3, 3]]
    rows:
      - ["하도급 업체", "", "대표자", ""]
      - ["사업자등록번호", "", "연락처", ""]
      - ["하도급 금액(원)", "", "하도급 기간", ""]
      - ["하도급 범위", "", "", ""]
    sample_rows:
      - ["", "(주)한빛설비", "", "박민준"]
      - ["", "000-00-00000", "", "010-1234-5678"]
      - ["", "12,000,000", "", "2026-10-01 ~ 11-30"]
      - ["", "전기·조명 설비 공사", "", ""]
  - type: textbox
    hint: "하도급 사유나 발주처에 전달할 내용을 적으십시오."
    height_mm: 24
    sample_text: "전문 설비 공정이라 전문업체에 하도급합니다. 하도급 계약서 사본을 첨부합니다."
  - type: para
    text: 위와 같이 계약의 일부를 하도급하였음을 통보합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   25 일
  - type: sign_line
    labels: ["통보인(원 계약업체)", "접수 담당자"]
    sample_names: [김서연, ""]
  - type: notice
    text: 통보·승인 요건과 제출 서류는 계약서와 관련 법령을 확인하십시오.
