id: claim-assignment-notice
title: 채권양도 통지서
category: legal
subcategory: notice
tags: [채권양도 통지서, 채권양도 통지, 양도인 통지, 내용증명 채권, 채권 이전]
summary: 양도한 채권의 내용과 양수인 정보를 채무자에게 알리는 채권양도 통지서입니다.
usage: >
  채권을 다른 사람에게 넘긴 사실을 채무자에게 알려 변제받을 상대방을 확정하는 문서입니다.
  통지는 양도인이 하는 것이 원칙이므로 발신인 명의를 확인하십시오. 어떤 채권인지 원인관계와
  발생일·금액으로 특정해야 하며, 일부만 양도한 경우 양도 범위를 명확히 적습니다. 양수인의
  성명과 입금계좌를 기재해 통지 이후에는 양수인에게 변제하도록 안내하십시오. 도달 사실을
  남기기 위해 내용증명 우편으로 발송하고 사본을 보관하는 것이 안전합니다. 대항요건과 효력
  발생 시점은 관련 법령 기준을 확인하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 채권양도 통지서
    spaced: false
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
      - [5, 1, 5, 3]
    rows:
      - ["양도인(발신인)", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["양수인", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["채무자(수신인)", "", "연락처", ""]
      - ["주소", "", "", ""]
  - type: subtitle
    text: 2. 양도 채권의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["채권의 원인", "", "", ""]
      - ["채권 발생일", "", "변제기일", ""]
      - ["채권 원금", "", "이자·지연손해금", ""]
      - ["양도 금액", "", "양도 범위", "전부 / 일부"]
      - ["양도일자", "", "양도 원인", ""]
  - type: subtitle
    text: 3. 통지 내용
  - type: para
    text: 양도인은 위 채권을 양수인에게 양도하였으므로 이를 통지합니다. 본 통지가 도달한 이후에는 아래 양수인에게 변제하여 주시기 바랍니다.
    align: left
    size: 10.5
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["변제 받을 계좌 (양수인)", "", "", ""]
      - ["변제 기한", "", "문의처", ""]
  - type: textbox
    hint: "기타 안내사항 — 분할 양도 내역, 기존 변제 내역 등을 기재하십시오."
    height_mm: 24
  - type: para
    text: 위와 같이 통지합니다.
    align: center
    size: 11
  - type: date_line
  - type: sign_line
    labels: ["양도인", "양수인"]
  - type: notice
    text: 채권양도의 대항요건과 효력 발생 시점은 관련 법령 기준을 확인하시고, 도달 증거를 남기려면 내용증명 우편을 이용하십시오.
