id: claim-assignment-notice
title: 채권양도 통지서
category: legal
subcategory: notice
tags: [채권양도 통지서, 채권양도 통지, 양도인 통지, 내용증명 채권, 채권 이전]
summary: 양도한 채권의 내용과 양수인 정보를 채무자에게 알리는 채권양도 통지서입니다.
usage: >
  채권을 다른 사람에게 넘긴 사실을 채무자에게 알려 변제받을 상대방을 확정하는 문서입니다.
  통지는 양도인이 하는 것이 원칙이므로 발신인 명의를 확인하십시오. 어떤 채권인지 원인관계와
  발생일·금액으로 특정해야 하며, 일부만 양도한 경우 양도 범위를 명확히 적습니다. 양수인의
  성명과 입금계좌를 기재해 통지 이후에는 양수인에게 변제하도록 안내하십시오. 도달 사실을
  남기기 위해 내용증명 우편으로 발송하고 사본을 보관하는 것이 안전합니다. 대항요건과 효력
  발생 시점은 관련 법령 기준을 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 양도인과 양수인, 채무자의 인적사항을 적습니다.
  - 양도한 채권의 발생일과 금액으로 채권을 특정합니다.
  - 일부만 양도했다면 양도 범위를 명확히 적습니다.
  - 양수인의 입금계좌를 안내합니다.
  - 내용증명 우편으로 발송하고 사본을 보관합니다.

faq:
  - q: 통지는 누가 해야 하나요?
    a: 원칙적으로 양도인이 통지해야 채무자에게 효력이 있으니 발신인 명의를 확인하십시오.
  - q: 꼭 내용증명으로 보내야 하나요?
    a: 필수는 아니지만 도달 사실을 남기기 위해 내용증명 우편 발송을 권장합니다.

related: [certified-notice, balance-confirmation, loan-agreement, repayment-plan]

