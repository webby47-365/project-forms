id: goods-purchase-contract
title: 물품구매계약서
category: public
subcategory: procure
tags: [물품구매계약서, 물품공급계약서, 조달계약서, 납품계약, 계약보증금]
summary: 발주자가 공급자로부터 물품을 구매할 때 품목·수량·단가와 납품·검수, 계약보증금·지체상금을 정하는 물품구매계약서입니다.
usage: >
  관공서나 기업이 입찰·수의계약으로 물품 공급업체를 선정한 뒤 실제 구매 조건을 정할 때 쓰는
  계약서입니다. 품목별 규격·수량·단가를 표에 정리하고, 납품 기한과 장소, 검사(검수) 방법을
  구체적으로 적어야 분쟁을 줄일 수 있습니다. 공공기관 계약은 계약보증금과 지체상금률을
  관련 법령·계약예규 기준으로 정하는 경우가 많으므로 발주기관의 계약 조건을 먼저 확인하십시오.
  하자보수(보증) 기간도 물품 특성에 맞게 미리 정해 둡니다.
source: original
featured: false
target_pages: 2

howto:
  - 발주자와 공급자의 상호·사업자번호·연락처를 적습니다.
  - 계약명과 계약금액, 납품기한·장소를 적습니다.
  - 품명·규격·수량·단가를 표에 정리합니다.
  - 계약보증금·지체상금률·하자보수기간을 정하고 서명합니다.

faq:
  - q: 계약보증금은 꼭 받아야 하나요?
    a: 공공기관 계약은 계약예규 기준으로 통상 받으며, 민간 계약은 당사자 협의로 정합니다.
  - q: 지체상금률은 어떻게 정하나요?
    a: 발주기관이 정한 비율이 있으면 그대로 따르고, 없으면 계약 전 협의로 정합니다.
  - q: 검수 후 하자가 나오면 어떻게 하나요?
    a: 계약서의 하자보수기간 안이면 공급자에게 무상 보수·교환을 요청할 수 있습니다.

related: [gov-bid-form, gov-bid-participation, delivery-confirmation, quotation]

blocks:
  - type: doc_title
    text: 물품구매계약서
    spaced: false

  - type: para
    text: 발주자와 공급자는 다음과 같이 물품구매계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 계약 당사자

  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["발주자", "상호(기관명)", "", "사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
      - ["공급자", "상호(법인명)", "", "사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "○○시청 총무과", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "02-1234-5678"]
      - ["", "", "(주)한빛물산", "", "000-00-00000"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-1234-5678"]

  - type: subtitle
    text: 계약 개요

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["계약명", "", "계약금액", ""]
      - ["납품기한", "", "납품장소", ""]
    sample_rows:
      - ["", "사무용 복합기 공급 계약", "", "금 22,000,000원 (부가세 포함)"]
      - ["", "2026-10-15까지", "", "○○시청 별관 1층 전산실"]

  - type: subtitle
    text: 구매 물품 내역

  - type: table
    widths: [7, 24, 22, 10, 17, 20]
    header: ["No", 품명, 규격, 수량, 단가, 금액]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "컬러 복합기", "A3 지원 / 분당 30매", "2", "8,000,000원", "16,000,000원"]
      - ["2", "복합기 전용 책상", "1,200×600mm", "2", "3,000,000원", "6,000,000원"]

  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 발주자가 공급자로부터 위 물품을 구매하는 데 필요한 사항을 정함을 목적으로 한다."

  - type: article
    heading: 제2조 (계약금액과 대금지급)
    lines:
      - "발주자는 물품 검수 완료 후 공급자가 청구하는 계약금액을 지정한 기한 내에 지급한다."
      - "대금은 공급자가 지정한 계좌로 지급한다."

  - type: page_break

  - type: article
    heading: 제3조 (납품과 검사)
    lines:
      - "공급자는 정한 납품기한과 장소에 물품을 납품하고, 발주자는 규격·수량을 검사한 뒤 그 결과를 통지한다."
      - "검사 결과 부적합한 물품은 공급자의 비용으로 교체·보완한다."

  - type: article
    heading: 제4조 (계약보증금)
    lines:
      - "공급자는 계약 체결 시 발주자가 정한 비율의 계약보증금을 납부하며, 계약을 정상 이행하면 반환한다."

  - type: article
    heading: 제5조 (지체상금)
    lines:
      - "공급자가 정한 납품기한을 지키지 못하면 지체일수에 대하여 계약에서 정한 지체상금률을 계약금액에 곱한 금액을 배상한다."

  - type: article
    heading: 제6조 (하자보수)
    lines:
      - "공급자는 검수 완료일로부터 정한 하자보수기간 동안 물품의 하자에 대하여 무상으로 보수하거나 교체한다."

  - type: article
    heading: 제7조 (계약의 해제·해지)
    lines:
      - "당사자 일방이 계약 내용을 이행하지 않거나 이행이 불가능한 경우 상대방은 상당한 기간을 정하여 최고한 후 계약을 해제·해지할 수 있다."

  - type: article
    heading: 제8조 (분쟁해결)
    lines:
      - "본 계약에 관한 분쟁은 먼저 당사자 간 협의로 해결하며, 협의가 이루어지지 않으면 관할법원에 제기할 수 있다."

  - type: date_line
    sample_text: 2026 년    9 월    17 일

  - type: sign_line
    labels: ["발주자", "공급자"]
    sample_names: ["○○시청 총무과장 김서연", "(주)한빛물산 대표 박민준"]

  - type: notice
    text: 계약보증금·지체상금률 등 세부 기준은 발주기관의 계약 조건과 관련 법령·계약예규를 확인하십시오.
