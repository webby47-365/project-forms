id: lease-early-termination-agreement
title: 임대차 중도해지 합의서
category: estate
subcategory: lease
tags: [임대차, 중도해지, 계약해지합의, 보증금반환, 퇴거합의]
summary: 임대차 기간이 끝나기 전에 임대인과 임차인이 합의로 계약을 끝낼 때 해지일·보증금 반환·정산 조건을 적는 중도해지 합의서 양식입니다.
usage: >
  이직·이사 등으로 계약 기간 중에 집을 비워야 하거나 임대인 사정으로 계약을 일찍 끝내기로 했을 때 양쪽 합의 내용을 남기는 서식입니다.
  계약 정보, 합의한 해지일과 명도일, 보증금 반환 금액과 시기, 밀린 월세·관리비 정산 내용을 적고 양쪽이 서명합니다.
  중개보수와 위약금 부담은 계약서와 합의 내용에 따라 달라지므로 필요하면 전문가와 상의하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 임대 목적물 주소와 원래 계약 기간을 적습니다.
  - 합의한 해지일과 집을 비우는 날을 적습니다.
  - 보증금 반환액, 반환일, 정산 항목을 적습니다.
  - 양쪽이 날짜를 적고 서명·날인합니다.
faq:
  - q: 해지일과 집을 비우는 날이 달라도 되나요?
    a: 달라도 됩니다. 두 날짜를 각각 적고 그 사이 월세와 관리비를 누가 내는지 특약란에 함께 적어 두십시오.
  - q: 보증금은 언제 돌려받나요?
    a: 합의로 정하는 것이므로 반환일을 날짜로 구체적으로 적어 두는 편이 분쟁을 줄입니다.
  - q: 중개보수는 누가 내나요?
    a: 계약서와 합의 내용에 따라 달라지므로 특약란에 부담자를 적어 두십시오.
related: [lease-deposit-return-schedule-agreement, lease-restoration-cost-statement, move-out-checklist, management-fee-settlement-confirmation]
blocks:
  - type: doc_title
    text: 임대차 중도해지 합의서
    spaced: true
  - type: subtitle
    text: 1. 계약 및 당사자
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges: [[0, 1, 0, 3], [1, 1, 1, 3]]
    rows:
      - ["임대 목적물", "", "", ""]
      - ["원 계약 기간", "", "", ""]
      - ["임대인", "", "연락처", ""]
      - ["임차인", "", "연락처", ""]
      - ["보증금(원)", "", "월세(원)", ""]
    sample_rows:
