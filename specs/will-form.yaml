id: will-form
title: 자필유언장 양식
category: personal
subcategory: life
tags: [자필유언장, 유언장양식, 자필증서유언, 유언장작성법, 유언장]
summary: 민법상 자필증서 유언의 법정 요건을 안내하고 유언 내용을 정리해 보는 초안 작성용 양식입니다.
usage: >
  자필증서에 의한 유언을 준비할 때 들어가야 할 항목과 순서를 미리 정리해 보는 초안용
  양식입니다. 민법 제1066조에 따라 유언자 본인이 전문·연월일·주소·성명을 모두 손으로
  직접 쓰고 날인해야 효력이 있으며, 컴퓨터로 작성하거나 다른 사람이 대신 쓰면 무효가
  됩니다. 이 양식으로 내용을 먼저 정리한 뒤, 실제 유언장은 백지에 전부 자필로 옮겨
  작성하십시오. 유언의 효력이나 유류분 등 법률 문제는 변호사·공증인 등 전문가에게
  반드시 확인하십시오.
source: law-standard
source_note: 민법 제1066조 자필증서에 의한 유언의 방식
featured: false
version: 1
created_by: agent
status: published
target_pages: 1

howto:
  - 유언자 성명과 작성일, 주소를 적습니다.
  - 재산 처분 내용을 구체적으로 정리합니다.
  - 유언 집행자를 정해 적습니다.
  - 내용을 확인한 뒤 백지에 전부 자필로 옮겨 씁니다.
  - 연월일, 주소, 성명을 자필로 쓰고 도장을 찍습니다.

faq:
  - q: 이 양식에 바로 인쇄해서 써도 되나요?
    a: 이 양식은 내용을 미리 정리하는 초안용이며 실제 유언장은 백지에 전부 자필로 다시 써야 효력이 있습니다.
  - q: 도장 대신 서명만 해도 되나요?
    a: 민법은 자필증서 유언에 날인을 요구하므로 서명만으로는 효력이 인정되지 않을 수 있습니다.

blocks:
  - type: doc_title
    text: 자필유언장 양식
    spaced: false

  - type: notice
    text: 민법 제1066조에 따라 자필증서 유언은 유언자가 전문(全文)과 연월일·주소·성명을 모두 자필로 쓰고 날인하여야 효력이 있습니다. 컴퓨터로 작성하거나 다른 사람이 대신 쓴 경우는 무효입니다.

  - type: kv_list
    items:
      - "전문·연월일·주소·성명을 모두 본인이 손으로 직접 써야 합니다(자필)."
      - "성명을 쓴 다음 도장을 찍거나 지문을 날인해야 합니다."
      - "타이핑, 대필, 녹음, 영상 방식은 자필증서 유언으로 인정되지 않습니다."
      - "이 양식은 작성 순서를 안내하는 초안용이며, 실제 유언장은 아래 내용을 백지에 전부 손으로 옮겨 써야 합니다."

  - type: subtitle
    text: 유언 내용 (초안)

  - type: textbox
    hint: "유언의 내용을 구체적으로 적으십시오. (예: 재산의 종류와 수증자, 비율 등)"
    height_mm: 45
    sample_text: 나는 아래와 같이 유언한다. 1. 서울특별시 마포구 소재 부동산은 배우자 김서연에게 상속한다. 2. 예금과 보험금은 자녀들에게 균등하게 나누어 상속한다. 3. 장례는 가족과 상의하여 간소하게 치른다.

  - type: subtitle
    text: 연월일·주소·성명·날인

  - type: date_line
    text: "20        년        월        일 (자필로 직접 기재)"
    sample_text: 2026 년    9 월    13 일

  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 10
    rows:
      - ["주소", ""]
      - ["성명", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100"]
      - ["", "홍길동"]

  - type: sign_line
    label: 날인(인)
    sample_names: ["홍길동 (인)"]

  - type: notice
    text: 이 양식은 초안 작성용입니다. 실제 유언장은 전문·연월일·주소·성명을 처음부터 끝까지 본인이 종이에 직접 손으로 쓰고 날인하여 완성하십시오. 타이핑된 내용을 그대로 제출하면 법적 효력이 없습니다.

  - type: notice
    text: 유언의 효력, 유류분, 상속 관련 사항은 법률 전문가(변호사) 또는 공증인에게 확인하십시오.
