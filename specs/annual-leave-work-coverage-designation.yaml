id: annual-leave-work-coverage-designation
title: 연차 휴가 업무 대행자 지정서
category: corp
subcategory: hr
tags: [업무대행자지정서, 휴가 업무대행, 연차 업무 인계, 부재중 업무대행, 휴가 대직자]
summary: 연차 휴가 기간 동안 맡은 업무를 누가 대신 처리할지 정하고 급한 연락 방법까지 남기는 업무 대행자 지정서 양식입니다.
usage: >
  연차를 쓰는 동안 자리를 비우는 사람이 업무를 대신 맡을 사람을 정해 두는 문서입니다.
  휴가 기간과 대행자를 적고, 맡길 업무를 항목별로 나누어 처리 범위와 주의할 점을 함께 적습니다.
  대행자와 부서장이 확인 서명을 하면 휴가 중 업무 공백과 책임 다툼을 줄일 수 있습니다.
  결재 권한이 필요한 업무는 회사의 위임 규정을 따르십시오.
source: original
featured: false
target_pages: 1
howto:
  - 휴가자와 대행자의 부서·성명, 휴가 기간을 적습니다.
  - 맡길 업무를 항목별로 나누어 처리 범위를 적습니다.
  - 급한 연락이 필요한 경우의 방법과 주의사항을 적습니다.
  - 휴가자·대행자·부서장이 서명합니다.
faq:
  - q: 대행자 동의가 꼭 필요한가요?
    a: 업무를 실제로 맡는 사람이 내용을 알아야 하므로 서명이나 확인을 받아 두는 편이 안전합니다.
  - q: 휴가 중 연락해도 되나요?
    a: 급한 일의 연락 여부와 방법은 휴가자와 합의해 적어 두십시오. 회사 규정도 함께 확인합니다.
  - q: 결재 업무도 맡길 수 있나요?
    a: 결재 권한은 회사의 위임 규정에 따라 달라집니다. 필요하면 부서장 확인을 받으십시오.
related: [leave-request, handover-report, annual-leave-plan, half-day-leave-request]
blocks:
  - type: doc_title
    text: 연차 휴가 업무 대행자 지정서
    spaced: false
  - type: subtitle
    text: 1. 휴가자 및 대행자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [3, 1, 3, 3]
    rows:
      - ["휴가자", "", "부서(직위)", ""]
      - ["대행자", "", "부서(직위)", ""]
      - ["휴가 기간", "", "휴가 일수", ""]
      - ["급한 연락", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "영업지원팀 대리"]
      - ["", "김서연", "", "영업지원팀 사원"]
      - ["", "11-09 ~ 11-11", "", "3일"]
      - ["", "급한 건에 한해 메신저로 연락", "", ""]
  - type: subtitle
    text: 2. 대행 업무
  - type: table
    widths: [8, 28, 38, 26]
    header: ["No", 업무, 처리 범위, 관련 자료 위치]
    empty_rows: 5
    row_height_mm: 8
    sample_rows:
      - ["1", "거래처 문의 응대", "단순 문의 답변·접수", "공용 메일함"]
      - ["2", "주문서 접수", "접수 후 처리는 복귀 뒤", "공유 폴더/주문"]
      - ["3", "월간 보고 취합", "11-10 마감분 제출", "공유 폴더/보고"]
  - type: subtitle
    text: 3. 전달 사항
  - type: textbox
    hint: "대행자가 알아야 할 주의사항과 판단이 어려울 때 확인할 사람을 적으십시오."
    height_mm: 22
    sample_text: 판단이 어려운 건은 처리하지 말고 부서장에게 먼저 확인해 주십시오. 복귀 후 진행 상황을 함께 점검하겠습니다.
  - type: date_line
    sample_text: 2026 년   10 월   23 일
  - type: sign_line
    labels: ["휴가자", "대행자", "부서장"]
    sample_names: [홍길동, 김서연, 박민준]
  - type: notice
    text: 결재·계약 등 권한이 필요한 업무는 회사의 위임 규정을 확인하십시오.
