id: traffic-accident-confirmation
title: 교통사고 현장확인서
category: public
subcategory: vehicle
tags: [교통사고현장확인서, 사고확인서, 교통사고접수서류, 사고사실확인서, 자동차사고확인서]
summary: 교통사고 직후 현장에서 양측 차량·보험 정보와 사고 경위를 함께 기록해 보험사 접수 등에 쓰는 확인서입니다.
usage: >
  교통사고가 났을 때 사고 직후 현장에서 상대방과 함께 차량번호·보험 정보와 사고
  발생 경위, 피해 상황을 기록해 두는 문서입니다. 보험사 접수나 이후 절차의 기초
  자료로 쓰이며, 과실 비율이나 책임 소재를 이 서식에서 단정하지 않습니다. 목격자가
  있으면 연락처를 받아 두고, 사고 현장 사진과 블랙박스 영상도 함께 보관해 두면
  이후 확인이 훨씬 수월합니다.
source: original
featured: false
target_pages: 1

howto:
  - 사고 일시와 장소를 적습니다.
  - 양측 차량번호와 보험 정보를 적습니다.
  - 사고 경위와 피해 상황을 적습니다.
  - 목격자가 있으면 연락처를 받아 적습니다.

faq:
  - q: 과실 비율도 이 서식에 적어야 하나요?
    a: 과실 비율은 보험사·경찰의 조사로 정해지므로 이 서식에서 단정해 적지 않습니다.
  - q: 사진이나 블랙박스 영상도 남겨야 하나요?
    a: 네. 이 확인서와 함께 현장 사진, 블랙박스 영상을 보관하면 이후 확인에 도움이 됩니다.
  - q: 인적 피해가 있는 사고도 이 서식을 쓸 수 있나요?
    a: 우선 이 서식으로 사실관계를 기록하되, 인적 피해가 있으면 즉시 경찰과 보험사에 신고하십시오.

related: [car-accident-settlement, quotation]

blocks:
  - type: doc_title
    text: 교통사고 현장확인서
    spaced: true

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사고일시", "", "사고장소", ""]
    sample_rows:
      - ["", "2026-09-14 18:20", "", "서울 마포구 월드컵북로 사거리"]

  - type: subtitle
