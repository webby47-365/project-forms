  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["운전자", "", "연락처", "", "차량번호", ""]
      - ["보험사", "", "증권번호", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678", "", "12가 3456"]
      - ["", "한빛화재", "", "AB-2026-001234", "", ""]

  - type: subtitle
