id: rental-car-return-confirmation
title: 렌터카 반납확인서
category: public
subcategory: vehicle
tags: [렌터카반납확인서, 렌트카반납체크리스트, 차량반납확인서, 렌터카연료확인, 렌터카파손확인]
summary: 렌터카를 반납할 때 주행거리·연료량·파손 여부를 임대인(렌터카 업체)과 이용자가 함께 확인하는 반납확인서입니다.
usage: >
  렌터카 이용이 끝나고 차량을 반납할 때, 대여 당시와 비교해 주행거리·연료 잔량·외관 파손
  여부·부속품(하이패스 단말기·내비게이션 등) 상태를 함께 확인해 두는 서류입니다. 추가
  요금(연료 부족·파손 수수료 등)이 발생할 수 있는 항목을 반납 시점에 사진과 함께 기록해
  두면 나중에 청구 내용에 다툼이 생겼을 때 근거로 쓸 수 있습니다. 업체 담당자와 이용자가
  함께 확인하고 서명한 뒤 각자 보관하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 대여 기간과 차량 정보를 적습니다.
  - 반납 시 주행거리와 연료 잔량을 확인해 적습니다.
  - 외관·내부·부속품 상태를 점검해 이상 여부를 표시합니다.
  - 추가 요금 발생 항목을 확인하고 이용자·담당자가 서명합니다.

faq:
  - q: 파손이 있으면 그 자리에서 배상해야 하나요?
    a: 대여 계약의 보험·배상 조건에 따라 다르므로, 확인서에 상태를 기록해 두고 업체 안내를 따르십시오.
  - q: 연료를 가득 채우지 않고 반납하면 어떻게 되나요?
    a: 대부분 업체가 부족한 만큼 연료비와 추가 수수료를 청구하므로 반납 전 주유 여부를 미리 확인하십시오.
  - q: 하이패스 이용 요금은 어떻게 정산하나요?
    a: 반납 후 후불로 청구되는 경우가 많아 통행 내역을 미리 확인해 두는 것이 안전합니다.

related: [vehicle-lease-contract, traffic-accident-confirmation, car-accident-settlement]

blocks:
  - type: doc_title
    text: 렌터카 반납확인서
    spaced: false

  - type: subtitle
    text: 1. 대여·반납 정보

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["대여업체", "", "이용자", ""]
      - ["차량번호", "", "차종", ""]
      - ["대여일시", "", "반납일시", ""]
    sample_rows:
      - ["", "한빛렌터카 강남점", "", "홍길동"]
      - ["", "12가 3456", "", "아반떼"]
      - ["", "2026-09-24 10:00", "", "2026-09-26 10:00"]

  - type: subtitle
    text: 2. 주행거리·연료

  - type: grid
    widths: [22, 28, 22, 28]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["대여 시 주행거리", "", "반납 시 주행거리", ""]
      - ["대여 시 연료 게이지", "", "반납 시 연료 게이지", ""]
    sample_rows:
      - ["", "23,150km", "", "23,480km"]
      - ["", "가득(Full)", "", "가득(Full)"]

  - type: subtitle
    text: 3. 상태·부속품 점검

  - type: table
    widths: [25, 40, 15, 20]
    header: ["점검 항목", "확인 내용", "이상 여부", "비고"]
    empty_rows: 6
    row_height_mm: 7
    sample_rows:
      - ["외관 파손", "범퍼·문짝·유리", "없음", ""]
      - ["내부 상태", "시트·매트·재떨이", "없음", ""]
      - ["하이패스 단말기", "부착 및 작동 상태", "정상", ""]
      - ["내비게이션·블랙박스", "부착 및 작동 상태", "정상", ""]

  - type: subtitle
    text: 4. 추가 요금 확인

  - type: textbox
    hint: "연료 부족·파손·초과 주행거리 등 추가 요금이 예상되는 항목과 사유를 적으십시오."
    height_mm: 20
    sample_text: 해당 없음. 반납 시 연료·주행거리 모두 계약 조건 내에서 확인됨.

  - type: para
    text: 위 내용을 반납 시점에 함께 확인하였음을 확인합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년    9 월   26 일

  - type: sign_line
    labels: ["이용자", "업체 담당자"]
    sample_names: [홍길동, 김서연]

  - type: notice
    text: 파손·연료 관련 최종 청구 금액은 업체의 정산 기준에 따르므로 영수증을 함께 보관하십시오.
