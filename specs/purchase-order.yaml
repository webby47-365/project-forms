id: purchase-order
title: 발주서
category: corp
subcategory: finance
tags: [발주서, 구매발주, 주문서, PO, purchase-order]
summary: 상품·서비스 구매를 의뢰할 때 품목·수량·금액·납기일을 명기하는 발주서입니다.
usage: >
  구매 부서가 공급업체에 상품 또는 서비스의 구매를 공식적으로 의뢰하는 문서로, 발주 내용의
  이행 기준이 되고 분쟁 해결의 근거가 됩니다. 견적서와 달리 실제 주문 의도를 담으므로
  품목·규격·수량·단가·납기일·결제조건을 정확하게 작성해야 합니다. 발주 금액이 크거나
  정기 발주인 경우 담당자·팀장·임원을 거쳐 대표가 최종 결재하며, 결재 기준은 회사의
  결재규정을 확인하여 반영하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 발주번호와 발주일자, 발주처를 적습니다.
  - 공급자명과 담당자, 연락처를 적습니다.
  - 품목별 규격·수량·단가·납기일을 적습니다.
  - 결제조건을 확인하고 적습니다.
  - 결재 순서에 따라 서명을 받습니다.

faq:
  - q: 견적서와 무엇이 다른가요?
    a: 견적서는 가격 제안이고, 발주서는 실제 주문 의사를 담아 이행 기준이 되는 문서입니다.
  - q: 결재는 누구까지 받아야 하나요?
    a: 금액과 발주 성격에 따라 다르므로 회사의 결재규정을 확인해 반영하십시오.

