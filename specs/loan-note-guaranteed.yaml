  - type: article
    heading: 제1조 (차용금의 수령)
    lines:
      - "채무자는 위 차용금액을 채권자로부터 수령하였음을 확인한다."
  - type: article
    heading: 제2조 (변제기 및 변제방법)
    lines:
      - "채무자는 위 변제기일까지 차용금액과 이자를 채권자가 지정한 계좌로 송금하여 변제한다."
  - type: article
    heading: 제3조 (이자와 지연손해금)
    lines:
      - "이자는 위 이자율에 따라 계산하며, 변제기일까지 변제하지 않을 경우 그 다음 날부터 완제일까지 지연손해금을 가산한다."
  - type: article
    heading: 제4조 (연대보증)
    lines:
      - "연대보증인은 위 보증채무 범위와 보증 최고액의 범위 내에서 채무자와 연대하여 채무를 이행할 책임을 진다."
      - "연대보증인의 책임은 위 보증기간 중 발생한 채무에 한하며, 채권자의 청구가 있으면 채무자와 동일한 책임을 진다."
  - type: article
    heading: 제5조 (기한이익의 상실)
    lines:
      - "채무자가 이자 지급을 2회 이상 연체하거나 가압류·강제집행·파산신청을 받은 경우 기한의 이익을 상실하고 잔액 전부를 즉시 변제한다."
  - type: article
    heading: 제6조 (관할)
    lines:
      - "본 계약에 관한 분쟁은 채권자의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["채권자", "채무자", "연대보증인"]
    sample_names: ["김서연", "홍길동", "박민준"]
  - type: notice
    text: 보증인 보호를 위한 특별법에 따라 보증계약은 보증인이 그 내용을 직접 서면으로 확인하고, 보증기간과 보증 최고액을 명확히 정해야 합니다. 관련 법령과 개별 사안을 확인하십시오.
