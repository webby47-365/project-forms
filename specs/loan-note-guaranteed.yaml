id: loan-note-guaranteed
title: 차용증 (연대보증 포함)
category: legal
subcategory: contract
tags: [차용증, 연대보증인, 보증계약, 금전차용증, 채무보증]
summary: 채권자·채무자·연대보증인의 권리의무와 보증채무의 범위·최고액을 명시한 차용증입니다.
usage: >
  채무자의 신용이 부족하거나 차용금액이 커서 연대보증인을 세우는 경우에 사용하는
  차용증입니다. 연대보증인이 책임지는 채무의 범위와 보증기간, 보증 최고액(보증한도)을
  구체적으로 적어야 보증인 보호를 위한 법정 요건을 충족할 수 있습니다. 보증계약은
  보증인이 그 내용을 직접 확인하고 서명하는 것이 원칙이며, 보증 범위를 벗어난 채무까지
  책임지지 않도록 최고액을 명확히 기재해야 합니다.
source: original
featured: false
series: loan-note
series_name: 차용증
variant: 연대보증
variant_rank: 3
target_pages: 2
version: 1
created_by: agent
status: published

variant_use: 연대보증인을 세워 차용하는 경우에 씁니다.

howto:
  - 채권자·채무자·연대보증인의 인적사항을 적습니다.
  - 차용 금액과 이자율, 변제기일을 기재합니다.
  - 연대보증인의 보증 범위와 보증기간, 최고액을 적습니다.
  - 각 당사자가 내용을 확인한 뒤 서명·날인합니다.

faq:
  - q: 보증 최고액은 왜 정해야 하나요?
    a: 보증인이 책임질 한도를 명확히 해 범위를 벗어난 채무까지 책임지지 않도록 하기 위해서입니다.
  - q: 연대보증인도 직접 서명해야 하나요?
    a: 네, 보증인이 내용을 직접 확인하고 서명하는 것이 원칙입니다.

