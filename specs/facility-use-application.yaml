id: facility-use-application
title: 시설 사용 신청서
category: public
subcategory: consent
tags: [시설사용신청서, 회의실사용신청, 강당대관, 시설대관신청, 장소사용신청]
summary: 회의실·강당·운동장 등 시설을 쓰려는 단체가 일시·인원·용도·준수사항을 적어 내는 시설 사용 신청서입니다.
usage: >
  학교, 주민센터, 복지관, 마을회관 등의 공용 시설을 빌려 쓰기 위해 관리 주체에 내는 신청서입니다.
  신청 단체와 담당자, 사용할 시설과 일시, 예상 인원, 사용 목적을 적습니다. 사용 후 원상복구와 안전
  관리 책임을 약속하는 확인 문구도 담았습니다. 사용료와 허가 여부는 시설 운영 규정에 따라 달라지므로
  신청 전에 관리 부서에 문의하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신청 단체 이름과 담당자 연락처를 적습니다.
  - 사용할 시설과 날짜, 시간을 적습니다.
  - 예상 인원과 사용 목적을 적습니다.
  - 준비물과 특이사항을 적고 신청인이 서명합니다.
faq:
  - q: 사용료는 신청서에 적나요?
    a: 사용료는 시설 규정에 따라 관리자가 정합니다. 신청서에는 필요한 경우만 메모로 남깁니다.
  - q: 사용 허가는 신청하면 바로 나오나요?
    a: 아닙니다. 일정이 겹치거나 규정에 맞지 않으면 거절될 수 있으니 관리 부서의 회신을 기다리십시오.
  - q: 정기 사용도 이 서식으로 되나요?
    a: 사용 일시란에 기간과 요일을 적어 신청할 수 있습니다. 정기 사용 가능 여부는 관리 부서에 확인하십시오.
related: [event-application, business-facility-use-consent, event-photo-consent, sponsorship-application]
blocks:
  - type: doc_title
    text: 시설 사용 신청서
    spaced: false
  - type: subtitle
    text: 1. 신청 단체
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["단체명", "", "대표자", ""]
      - ["담당자", "", "연락처", ""]
    sample_rows:
      - ["", "한빛 독서모임", "", "홍길동"]
      - ["", "김서연", "", "010-3456-7890"]
  - type: subtitle
    text: 2. 사용 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
      - [3, 1, 3, 3]
    rows:
      - ["사용 시설", "", "예상 인원", ""]
      - ["사용 일자", "", "사용 시간", ""]
      - ["사용 목적", "", "", ""]
      - ["준비물", "", "", ""]
    sample_rows:
      - ["", "3층 다목적실", "", "20명"]
      - ["", "2026-10-24", "", "14:00 ~ 17:00"]
      - ["", "독서 토론 모임", "", ""]
      - ["", "빔프로젝터, 의자 20개", "", ""]
  - type: subtitle
    text: 3. 특이사항
  - type: textbox
    hint: "음향·음식물 반입 등 관리자가 미리 알아야 할 사항을 적으십시오."
    height_mm: 22
    sample_text: "음식물 반입은 없으며, 사용 후 의자를 정리하고 쓰레기를 모두 수거하겠습니다."
  - type: para
    text: 위와 같이 시설 사용을 신청하며, 사용 후 원상복구와 안전 관리를 책임지겠습니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월    9 일
  - type: sign_line
    label: 신청인
    sample_names: [홍길동]
  - type: notice
    text: 사용 허가와 사용료는 시설 운영 규정에 따릅니다. 관리 부서에 확인하십시오.
