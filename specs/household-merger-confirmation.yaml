id: household-merger-confirmation
title: 세대 합가 사실 확인서
category: public
subcategory: family
tags: [세대합가, 합가확인서, 동거사실확인, 세대합침, 전입합가]
summary: 따로 살던 가족이 한집에 합쳐 살게 된 사실과 일자, 관계를 확인해 적는 세대 합가 사실 확인서 양식입니다.
usage: >
  부모와 자녀 등 따로 살던 가족이 한 주소로 합쳐 살게 되었을 때 그 사실을 문서로 남기는 확인서입니다.
  합가 일자와 새 주소, 합가하는 사람들의 이름과 관계, 합가 사유를 적고 세대주와 합가자가 함께 서명합니다.
  주민등록 정리는 전입신고 등 별도 절차로 해야 하며 이 문서가 그 절차를 대신하지 않습니다. 제출처가 요구하는
  양식이 따로 있으면 그 기준을 먼저 확인하십시오. 주민등록번호는 적지 않고 생년월일로 구분합니다.
source: original
featured: false
target_pages: 1
howto:
  - 합가 일자와 합가 후 주소를 적습니다.
  - 세대주와 합가하는 사람의 이름, 생년월일, 관계를 적습니다.
  - 합가한 사유를 간단히 적습니다.
  - 세대주와 합가자가 함께 서명합니다.
faq:
  - q: 이 확인서로 전입신고가 되나요?
    a: 아닙니다. 주민등록 정리는 전입신고로 따로 해야 하며, 이 문서는 합가 사실을 남기는 용도입니다.
  - q: 주민등록번호를 적어야 하나요?
    a: 이 서식은 생년월일로 구분합니다. 제출처가 요구하면 그 기관의 안내를 따르십시오.
  - q: 합가자가 여러 명이면 어떻게 하나요?
    a: 표에 한 줄씩 적고, 칸이 모자라면 같은 서식을 한 장 더 사용합니다.
related: [moving-in-report, resident-registration-request, household-head-change-consent, cohabitant-confirmation]
blocks:
  - type: doc_title
    text: 세대 합가 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 합가 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["합가 일자", "", "작성일", ""]
      - ["합가 후 주소", "", "", ""]
    sample_rows:
      - ["", "2026-10-01", "", "2026-10-14"]
      - ["", "서울시 ○○구 ○○로 10, 101동 202호", "", ""]
  - type: subtitle
    text: 2. 세대주 및 합가자
  - type: table
    widths: [8, 20, 22, 20, 30]
    header: ["No", 성명, 생년월일, 세대주와 관계, 합가 전 거주지]
    empty_rows: 5
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["1", "홍길동", "1970-03-15", "세대주", "현 주소"]
      - ["2", "박민준", "1998-07-21", "자녀", "○○시 ○○동"]
      - ["3", "김서연", "1972-11-02", "배우자", "○○시 ○○동"]
  - type: subtitle
    text: 3. 합가 사유
  - type: textbox
    hint: "합가하게 된 이유를 간단히 적으십시오. 건강 정보 등 민감한 내용은 적지 않아도 됩니다."
    height_mm: 24
    sample_text: "자녀의 직장이 가까워져 가족이 한 주소에서 함께 생활하게 되었습니다."
  - type: para
    text: 위와 같이 세대를 합쳐 함께 거주하고 있음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년    10 월    14 일
  - type: sign_line
    labels: ["세대주", "합가자"]
    sample_names: [홍길동, 박민준]
  - type: notice
    text: 주민등록 정리는 전입신고 등 별도 절차로 하며, 제출처 기준을 확인하십시오.
