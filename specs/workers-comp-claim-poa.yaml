id: workers-comp-claim-poa
title: 산재보험 급여 청구 위임장
category: public
subcategory: insurance
tags: [산재보험위임장, 산재신청위임장, 산재급여청구위임장, 산재대리신청, 근로복지공단위임장]
summary: 산재보험 급여 청구나 요양 신청 절차를 공인노무사 등 대리인에게 맡길 때 위임 범위를 적는 위임장입니다.
usage: >
  업무상 사고나 질병으로 산재보험 급여를 청구할 때 본인이 직접 처리하기 어려워 대리인(공인노무사·
  가족 등)에게 맡기는 경우에 쓰는 위임장입니다. 위임인·대리인 정보와 청구 종류, 위임 범위와 기간을
  적고 위임인이 서명 또는 날인합니다. 재해 경위와 상병 내용은 이 서식에 적지 않으며 신청서류에
  별도로 작성합니다. 접수 기관의 양식과 첨부 서류는 안내를 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 위임인과 사업장(소속 회사) 정보를 적습니다.
  - 대리인의 성명·소속·연락처를 적습니다.
  - 청구 종류와 위임할 범위를 표시합니다.
  - 위임 기간을 정하고 위임인이 서명 또는 날인합니다.

faq:
  - q: 재해 내용은 위임장에 적어야 하나요?
    a: 적지 않습니다. 재해 경위와 상병 내용은 산재 신청서류에 따로 작성하고, 위임장에는 위임 범위만 적습니다.
  - q: 가족이 대신 신청할 때도 위임장이 필요한가요?
    a: 대리 신청 시 위임장을 요구할 수 있습니다. 접수 기관의 안내와 필요 서류를 먼저 확인하십시오.
  - q: 위임 범위는 어디까지 적나요?
    a: 신청서 작성·제출·보완 서류 제출·결과 수령 등 맡길 일만 표시하고 나머지는 비워 둡니다.

related: [power-of-attorney, social-insurance-filing-poa, gov-separation-confirmation, withholding-tax-filing-poa]

blocks:
  - type: doc_title
    text: 산재보험 급여 청구 위임장
    spaced: false

  - type: para
    text: 본인은 아래 대리인에게 산재보험 급여 청구에 관한 권한을 위임합니다.
    align: center
    size: 10.5

  - type: subtitle
    text: 1. 위임인

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["소속 사업장", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-11-02"]
      - ["", "서울특별시 마포구 월드컵북로 50 101동 502호", "", ""]
      - ["", "(주)한빛물산", "", "010-1234-5678"]

  - type: subtitle
    text: 2. 대리인

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["소속", "", "위임인과의 관계", ""]
    sample_rows:
      - ["", "박민준", "", "010-2345-6789"]
      - ["", "새길노무사사무소", "", "공인노무사"]

  - type: subtitle
    text: 3. 위임 내용

  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["청구 종류", "(   ) 요양급여   (   ) 휴업급여   (   ) 장해급여   (   ) 기타"]
      - ["위임 사항", "(   ) 신청서 작성·제출   (   ) 보완 서류 제출   (   ) 결과 수령"]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "( ✓ ) 요양급여   (   ) 휴업급여   (   ) 장해급여   (   ) 기타"]
      - ["", "( ✓ ) 신청서 작성·제출   ( ✓ ) 보완 서류 제출   ( ✓ ) 결과 수령"]
      - ["", "2026-10-01 ~ 2026-12-31"]

  - type: kv_list
    items:
      - "대리인은 위임받은 범위 안에서만 위 청구에 관한 서류를 사용합니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."

  - type: date_line
    sample_text: 2026 년    9 월   30 일

  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 박민준]

  - type: notice
    text: 접수 기관의 양식과 첨부 서류는 안내를 확인하십시오. 재해 경위는 신청서류에 따로 적습니다.
