id: invitation-card
title: 초대장
category: personal
subcategory: life
tags: [초대장, 행사 초대장, 모임 초대장, 개업 초대장, 초청장 양식]
summary: 행사명과 일시·장소·참석 안내를 담아 손님을 초청하는 초대장 양식입니다.
usage: >
  개업이나 돌잔치, 모임, 발표회처럼 손님을 모시는 자리에 보내는 초청 문서입니다. 행사명과 일시,
  장소를 눈에 띄게 적고 주소는 찾아오기 쉽도록 교통편과 주차 안내를 함께 기재하십시오. 회신이
  필요하면 회신 기한과 연락처를 명확히 적어야 인원 파악이 수월합니다. 초대 인사말은 격식을
  갖추되 간결하게 쓰고, 복장이나 선물 사양 같은 안내사항이 있으면 따로 적습니다. 발송 전에
  날짜와 요일이 맞는지, 장소명이 정확한지 다시 확인하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 초대장
  - type: spacer
    height_pt: 8
  - type: textbox
    hint: "초대 인사말 — 모시는 마음을 담아 간결하게 작성하십시오."
    height_mm: 40
    sample_text: 꽃피는 계절을 맞아 저희 (주)한빛커머스가 새 사무실로 이전하게 되었습니다. 바쁘신 가운데 귀한 발걸음 하시어 축하의 자리를 함께해 주시면 큰 영광이겠습니다.
  - type: subtitle
    text: 행사 안내
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
      - [3, 1, 3, 3]
    rows:
      - ["행사명", "", "", ""]
      - ["일시", "20   년   월   일 (  요일)", "시각", "     시     분"]
      - ["장소", "", "", ""]
      - ["주소", "", "", ""]
      - ["주최(초대인)", "", "연락처", ""]
    sample_rows:
      - ["", "(주)한빛커머스 사옥 이전 기념식", "", ""]
      - ["", "2026년 10월 5일 (월요일)", "", "14 시 00 분"]
      - ["", "한빛타워 3층 그랜드홀", "", ""]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "(주)한빛커머스", "", "010-1234-5678"]
  - type: subtitle
    text: 참석 안내
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["회신 기한", "", "회신 방법", "전화 / 문자 / 이메일"]
      - ["복장", "", "동반 인원", "        명"]
      - ["교통편·주차 안내", "", "", ""]
    sample_rows:
      - ["", "2026-09-25까지", "", "전화"]
      - ["", "캐주얼", "", "1 명"]
      - ["", "지하철 6호선 마포구청역 2번 출구, 건물 지하 주차장 무료 이용", "", ""]
  - type: subtitle
    text: 초대 명단
  - type: table
    widths: [8, 24, 20, 22, 26]
    header: ["No", 성함, 관계, 연락처, 회신 여부]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "김서연", "친구", "010-2222-3333", "참석"]
      - ["2", "이수현", "동료", "010-3333-4444", "참석"]
      - ["3", "박민준", "거래처", "010-4444-5555", "미정"]
  - type: textbox
    hint: "기타 안내사항 — 식사 제공, 선물 사양, 우천 시 안내 등을 기재하십시오."
    height_mm: 18
    sample_text: 행사 후 다과가 준비되어 있습니다. 별도 화환이나 선물은 정중히 사양하며, 우천 시에도 행사는 정상 진행됩니다.
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    label: 초대인
    sample_names: [박민준]
  - type: notice
    text: 발송 전 날짜와 요일, 장소명과 주소가 정확한지 다시 확인하십시오.
