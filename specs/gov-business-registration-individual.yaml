    lines:
    - - l
      - 가. 다른 사람에게 사업자명의를 빌려주는 경우 사업과 관련된 각종 세금이 명의를 빌려준 사람에게 나오게 되어 다음과 같은 불이익이 있을 수 있습니다.
    - - l
      - 1) 조세의 회피 및 강제집행의 면탈을 목적으로 자신의 성명을 사용하여 타인에게 사업자등록을 할 것을 허락하거나 자신 명 의의 사업자등록을 타인이 이용하여 사업을 영위하도록 한 자는 「조세범 처벌법」 제11조제2항에 따라 1년 이하의 징역 또는 1천만원 이하의 벌금에 처해집니다.
    - - l
      - 2) 소득이 늘어나 국민연금과 건강보험료를 더 낼 수 있습니다.
    - - l
      - 3) 명의를 빌려간 사람이 세금을 못 내게 되면 체납자가 되어 소유재산의 압류ㆍ공매처분, 체납명세의 금융회사 등 통보, 출국규제 등의 불이익을 받을 수 있습니다.
    - - l
      - 나. 다른 사람의 명의로 사업자등록을 하고 실제 사업을 하는 것으로 확인되는 경우 다음과 같은 불이익이 있을 수 있습니다.
    - - l
      - 1) 조세의 회피 또는 강제집행의 면탈을 목적으로 타인의 성명을 사용하여 사업자등록을 하거나 타인 명의의 사업자등록을 이용하여 사업을 영위한 자는 「조세범 처벌법」 제11조제1항에 따라 2년 이하의 징역 또는 2천만원 이하의 벌금에 처해집 니다.
    - - l
      - 2) 「부가가치세법」 제60조제1항제2호에 따라 사업 개시일부터 실제 사업을 하는 것으로 확인되는 날의 직전일까지의 공급 가액 합계액의 2%에 해당하는 금액을 납부세액에 더하여 납부해야 합니다.
    - - l
      - 3) 「주민등록법」 제37조제10호에 따라 다른 사람의 주민등록번호를 부정하게 사용한 자는 3년 이하의 징역 또는 3천만원 이하의 벌금에 처해집니다.
    - - l
      - 다. 귀하가 재화 또는 용역을 공급하지 않거나 공급받지 않고 세금계산서 또는 계산서를 발급하거나 발급받은 경우 또는 이와 같 은 행위를 알선ㆍ중개한 경우에는 「조세범 처벌법」 제10조제3항 또는 제4항에 따라 3년 이하의 징역 또는 공급가액에 부가 가치세의 세율을 적용하여 계산한 세액의 3배 이하에 상당하는 벌금에 처해집니다.
    - - l
      - 라. 신용카드 가맹 및 이용은 반드시 사업자 본인 명의로 해야 하며 사업상 결제목적 외의 용도로 신용카드를 이용할 경우 「여신전문금융업법」 제70조제3항제2호부터 제6호까지의 규정에 따라 3년 이하의 징역 또는 2천만원 이하의 벌금에 처해 집니다.
    size: 7.2
