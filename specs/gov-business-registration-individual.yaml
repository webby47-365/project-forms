id: gov-business-registration-individual
title: 사업자등록 신청서 (개인사업자용)
category: public
subcategory: tax
tags:
- 사업자등록
- 개인사업자
- 개업
- 신청서
- 부가가치세
summary: 개인이 사업을 시작할 때 세무서에 제출하는 법정 사업자등록 신청서입니다.
usage: '개인사업을 시작하려면 개업일부터 20일 이내에 세무서에 등록 신청해야 합니다. 상호, 성명, 사업장 소재지, 주업태, 주종목 등 사업장 현황을 작성합니다. 사업 허가증, 임대차계약서 등 필요 서류를 함께 제출합니다. 처리기간은 2일이며 홈택스(www.hometax.go.kr)에서도 온라인 신청 가능합니다.

  '
source: law-standard
source_note: 부가가치세법 시행규칙 별지 제4호서식
law_ref:
  law: 부가가치세법 시행규칙
  form_no: 별지 제4호서식
  amended: '2026-03-20'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EB%B6%80%EA%B0%80%EA%B0%80%EC%B9%98%EC%84%B8%EB%B2%95+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0004&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 국세청
  checked: '2026-09-16'
featured: false
target_pages: 6
created_by: gov-batch
howto:
- 상호(단체명), 성명, 주민등록번호, 사업장 소재지를 적습니다.
- 주업태, 주종목, 개업일, 종업원 수를 입력합니다.
- 자가 또는 임차사업장 여부를 선택하고 임대인 정보를 기재합니다.
- 사업자금 명세와 과세 방식을 선택합니다.
- 대리인이 신청하면 위임장을 첨부합니다.
faq:
- q: 개업일부터 몇 일 내에 신청해야 하나요?
  a: 사업 개시일부터 20일 이내에 신청해야 합니다. 늦으면 가산세가 붙을 수 있습니다.
- q: 임차사업장이면 어떤 서류가 필요한가요?
  a: 임대차계약서 사본을 냅니다. 전차(다시 빌린) 사업장이면 임대인의 전차동의서도 함께 제출합니다.
- q: 사업 허가가 필요한 업종도 있나요?
  a: 네, 일부 업종(음식점, 미용실 등)은 관계기관의 허가증을 함께 제출해야 합니다.
related:
- startup-checklist
- business-plan-simple
- employment-certificate
