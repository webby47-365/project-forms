id: certified-notice-reply
title: 내용증명 회신서
category: legal
subcategory: notice
tags: [내용증명회신, 내용증명답변, 답변서, 회신문, 이의제기]
summary: 상대방에게 내용증명을 받았을 때 받은 내용에 대한 입장과 사실관계, 요구 사항을 정리해 답하는 내용증명 회신서 양식입니다.
usage: >
  내용증명을 받고 가만히 있으면 상대 주장을 인정한 것처럼 보일 수 있어 입장을 문서로 남겨 두는 서식입니다.
  받은 내용증명의 발송일과 제목, 그 내용에 대한 인정·부인 여부, 내 입장과 근거를 차례로 적습니다.
  감정적인 표현은 빼고 날짜와 금액 같은 사실 위주로 쓰십시오. 법적 대응이 필요한 사안이면 전문가 상담을 권합니다.
source: original
featured: false
target_pages: 1
howto:
  - 받는 사람과 보내는 사람 정보를 적습니다.
  - 받은 내용증명의 발송일과 제목을 적습니다.
  - 상대 주장 중 인정하는 부분과 다투는 부분을 나누어 적습니다.
  - 요구 사항을 적고 서명해 우체국에서 다시 내용증명으로 보냅니다.
faq:
  - q: 회신하지 않으면 불리한가요?
    a: 회신 의무가 정해져 있지는 않지만, 입장을 남기지 않으면 다툼이 생길 때 설명이 어려울 수 있습니다.
  - q: 회신서도 내용증명으로 보내야 하나요?
    a: 보낸 사실과 내용을 남기려면 내용증명으로 보내는 편이 좋습니다. 같은 문서를 세 부 준비합니다.
  - q: 일부만 인정해도 되나요?
    a: 됩니다. 인정하는 부분과 다투는 부분을 나누어 적는 편이 오해를 줄입니다.
related: [certified-notice, statement-of-facts, settlement-agreement, repayment-plan]
blocks:
  - type: doc_title
    text: 내용증명 회신서
    spaced: true
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["수신인", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["발신인", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "박민준", "", "010-2345-6789"]
      - ["", "서울시 마포구 예시로 10", "", ""]
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울시 강남구 샘플로 20", "", ""]
  - type: subtitle
    text: 2. 받은 내용증명
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["발송일", "", "제목", ""]
    sample_rows:
      - ["", "2026-11-05", "", "물품대금 지급 청구"]
  - type: subtitle
    text: 3. 회신 내용
  - type: textbox
    hint: "상대 주장 중 인정하는 부분과 사실과 다른 부분을 날짜·금액 위주로 적으십시오."
    height_mm: 50
    sample_text: "2026년 9월 납품분 대금 중 300만원은 지급 받았음을 인정합니다. 다만 10월 납품분 200만원은 검수 과정에서 불량이 확인되어 지급 보류 사유가 있었습니다."
  - type: textbox
    hint: "상대방에게 요구하는 사항과 회신을 기다리는 기한을 적으십시오."
    height_mm: 25
    sample_text: "불량 물량의 교환 또는 재검수를 요청하며, 이 서면을 받은 날부터 14일 안에 회신해 주시기 바랍니다."
  - type: date_line
    sample_text: 2026 년   11 월   16 일
  - type: sign_line
    labels: ["발신인"]
    sample_names: [홍길동]
  - type: notice
    text: 법적 효과가 걸린 사안은 제출 전 전문가 상담을 받으십시오.
