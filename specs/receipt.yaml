id: receipt
title: 영수증
category: corp
subcategory: finance
tags: [영수증, 거래영수증, 판매영수증, 결제영수증, receipt]
summary: 금전·물품·용역 거래 시 결제 사실을 증명하는 표준 영수증입니다.
usage: >
  판매자가 구매자에게 결제를 받은 사실을 증명하고, 구매자의 경비 영수증 또는 세무 증빙으로
  사용되는 문서입니다. 판매자명·거래일시·금액·거래 품목을 명확히 기재하고, 부가세 포함 여부를
  구분하여 작성해야 합니다. 전자 영수증이 아닌 수기 영수증을 사용할 경우 발행자의 서명이나
  도장을 반드시 남기고, 제출처의 영수증 요식에 따라 기재하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 영수증
    spaced: true
  - type: spacer
    height_pt: 8
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["영수증번호", "", "발행일자", ""]
    sample_rows:
      - ["", "R-2026-0045", "", "2026-09-13"]
  - type: subtitle
    text: 공급자 정보
  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 1]
    rows:
      - ["상호(판매자)", ""]
      - ["소재지", ""]
      - ["사업자등록번호", ""]
      - ["전화번호", ""]
    sample_rows:
      - ["", "(주)한빛커머스"]
      - ["", "서울특별시 마포구 월드컵북로 100"]
      - ["", "000-00-00000"]
      - ["", "02-1234-5678"]
  - type: subtitle
    text: 수령자 정보
  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 1]
    rows:
      - ["상호명/개인명(구매자)", ""]
      - ["연락처", ""]
    sample_rows:
      - ["", "홍길동"]
      - ["", "010-1234-5678"]
  - type: subtitle
    text: 거래 내용
  - type: table
    widths: [40, 20, 20, 20]
    header: [품목명, 수량, 단가, 금액]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["사무용 의자", "5", "50,000", "250,000"]
      - ["A4 복사용지", "10", "4,000", "40,000"]
  - type: grid
    widths: [40, 20, 20, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["공급가액 합계", "", "", ""]
      - ["부가세(10%)", "", "", ""]
      - ["합계금액", "", "", ""]
    sample_rows:
      - ["", "", "", "290,000"]
      - ["", "", "", "29,000"]
      - ["", "", "", "319,000"]
  - type: spacer
    height_pt: 4
  - type: para
    text: 위와 같이 영수증을 발행합니다.
    align: center
    size: 11
    space_after: 4
  - type: grid
    widths: [50, 50]
    label_cols: []
    row_height_mm: 16
    rows:
      - ["판매자 서명(날인)", ""]
    sample_rows:
      - ["", "(주)한빛커머스 대표 홍길동 (인)"]
  - type: notice
    text: 영수증 발행일로부터 5년간 보관하십시오. 분실 시 발행자에게 사본 발행을 요청할 수 있습니다.
