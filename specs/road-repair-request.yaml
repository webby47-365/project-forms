id: road-repair-request
title: 도로·가로등 보수 요청 민원
category: public
subcategory: civil
tags: [도로보수민원, 가로등고장신고, 시설물보수요청, 도로파손신고, 생활불편신고]
summary: 도로 파손이나 가로등 고장 등 공공시설 하자의 보수를 관할 기관에 요청하는 민원 서식입니다.
usage: >
  도로·보도·가로등 등 공공시설물이 파손되거나 고장 난 것을 발견했을 때 관할 구청이나
  시설관리부서에 보수를 요청하는 서식입니다. 시설물의 정확한 위치와 관리번호(있는 경우)를
  적고, 하자 상태와 위험도를 구체적으로 기재하면 처리에 도움이 됩니다. 사진을 함께 제출하면
  현장 확인 없이도 상태를 빠르게 파악할 수 있습니다. 처리 순서와 일정은 관할 기관의 예산과
  현장 여건에 따라 달라질 수 있습니다.
source: original
featured: false
created_by: agent
status: published
version: 1
target_pages: 1
howto:
  - 파손된 시설물의 정확한 위치를 적습니다.
  - 관리번호가 있으면 함께 적습니다.
  - 하자 상태와 위험도를 구체적으로 씁니다.
  - 현장 사진을 첨부해 관할 기관에 제출합니다.

faq:
  - q: 관리번호를 모르면 못 내나요?
    a: 관리번호가 없어도 접수할 수 있으며, 위치와 하자 상태를 최대한 자세히 적으면 됩니다.
  - q: 처리 결과는 언제 알려주나요?
    a: 처리 기간은 관할 기관의 예산과 현장 여건에 따라 달라지므로, 접수 기관에 문의해 확인하는 것이 좋습니다.

blocks:
  - type: doc_title
    text: 도로·가로등 보수 요청 민원
    spaced: false

  - type: subtitle
    text: 신청인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "010-2345-6789"]

  - type: subtitle
    text: 시설물 위치
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["도로명주소", "", "상세위치", ""]
      - ["시설 종류", "", "관리번호", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100 앞", "", "인도 보도블록 파손 구간"]
      - ["", "가로등", "", "MP-2026-0456"]

  - type: subtitle
    text: 하자 내용
  - type: table
    widths: [20, 30, 20, 30]
    header: [구분, 상태, 위험도, 발견일]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["가로등", "점등 불량(점멸)", "중", "2026-08-10"]
      - ["보도블록", "일부 파손 및 들뜸", "하", "2026-08-12"]

  - type: notice
    text: 하자 상태를 확인할 수 있는 사진을 함께 제출하면 처리에 도움이 됩니다.

  - type: subtitle
    text: 요청 사항
  - type: textbox
    hint: "보수를 요청하는 이유와 바라는 조치를 적으십시오."
    height_mm: 14
    sample_text: "보행자 안전을 위해 조속한 보수를 요청드립니다."

  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["제출처(관할 구청·시설관리부서)", ""]
    sample_rows:
      - ["", "○○구청 도로시설과"]

  - type: date_line
    sample_text: 2026 년    8 월   13 일

  - type: sign_line
    label: 신청인
    sample_names: [김서연]

  - type: notice
    text: 처리 순서와 일정은 관할 기관의 예산 및 현장 여건에 따라 달라질 수 있습니다.
