id: gov-info-disclosure-request
title: 정보공개 청구서 (법정서식)
category: public
subcategory: civil
tags:
- 정보공개청구
- 공공정보공개
- 정보공개
- 공공기관정보
- 투명성
summary: 정부기관이나 공공기관에 보유한 정보를 공개해달라고 청구하는 법정 신청서입니다.
usage: 정부 부처·지방자치단체·공공기관이 가지고 있는 정보를 공개해 달라고 청구하는 서류입니다. 청구인의 인적사항, 청구 내용, 공개 방법(열람·사본·전자파일 등)과 수령 방법을 적습니다. 수수료 감면 대상이면 사유를 적고 증명서류를 붙입니다. 정보공개포털(www.open.go.kr)에서도 청구할 수 있습니다.
source: law-standard
source_note: 공공기관의 정보공개에 관한 법률 시행규칙 별지 제1호의2서식
law_ref:
  law: 공공기관의 정보공개에 관한 법률 시행규칙
  form_no: 별지 제1호의2서식
  amended: '2024-09-13'
