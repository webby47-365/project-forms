id: commercial-lease-contract
title: 상가건물 임대차계약서
category: estate
subcategory: lease
tags: [상가임대차계약서, 상가계약서, 점포임대차, 사업장임대차, 상가건물임대차보호법]
summary: 상가건물의 보증금·차임·권리금과 계약갱신요구권·원상복구 조항을 담은 임대차계약서입니다.
usage: >
  점포나 사무실을 임차할 때 사용합니다. 상가건물임대차보호법의 보호를 받으려면 사업자등록과
  확정일자를 받아야 하고, 환산보증금이 지역별 기준을 넘으면 일부 조항만 적용되므로 계약
  전에 확인해야 합니다. 임차인은 최초 계약일부터 10년까지 계약갱신을 요구할 수 있고,
  권리금 회수 기회도 법으로 보호됩니다. 원상복구 범위와 인테리어 설치물의 소유권은 분쟁이
  가장 많은 항목이므로 특약에 구체적으로 적으십시오. 본 서식은 참고용이며 법적 효력과
  적합성은 이용자가 확인해야 합니다.
source: law-standard
source_note: 상가건물 임대차보호법 및 법무부 상가건물임대차 표준계약서를 참고하여 자체 제작
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 상가건물 임대차계약서
    spaced: false
  - type: para
    text: 임대인과 임차인은 아래 표시 상가건물에 관하여 다음과 같이 임대차계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 임대차 목적물의 표시
  - type: grid
    widths: [14, 26, 14, 20, 12, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 5]
    rows:
      - ["소재지", "", "", "", "", ""]
      - ["건물", "구조·용도", "", "면적", "", "㎡"]
      - ["임차할 부분", "", "층 / 호", "", "면적", "㎡"]
      - ["업종", "", "사업자등록 예정", "", "가능 / 불가", ""]
  - type: subtitle
    text: 2. 계약 내용 — 제1조 (보증금·차임·권리금)
  - type: grid
    widths: [13, 25, 13, 24, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 4]
      - [5, 1, 5, 4]
    rows:
      - ["보증금", "금                                원정 (₩                    )", "", "", ""]
      - ["계약금", "금                원정", "지급일", "계약 시", ""]
      - ["잔금", "금                원정", "지급일", "20   년   월   일", ""]
      - ["차임(월세)", "금                원정", "지급일", "매월        일", "선불 / 후불"]
      - ["관리비", "금                원정", "부가세", "별도 / 포함", ""]
      - ["권리금", "금                원정 (권리금 수수 당사자 :                        )", "", "", ""]
  - type: article
    heading: 제2조 (임대차기간)
    lines:
      - "임대인은 임차 목적물을 사용할 수 있는 상태로 20   년   월   일까지 임차인에게 인도하고, 임대차기간은 인도일부터 20   년   월   일까지로 한다."
  - type: article
    heading: 제3조 (사용 목적과 용도 변경)
    lines:
      - "임차인은 위 업종으로만 사용하며, 업종을 변경하려면 임대인의 서면 동의를 받아야 한다."
      - "임차인은 임대인의 동의 없이 목적물을 전대하거나 임차권을 양도할 수 없다."
  - type: article
    heading: 제4조 (시설물의 설치와 원상복구)
    lines:
      - "임차인이 설치한 인테리어와 시설물의 소유권 및 원상복구 범위는 특약사항에 따른다."
      - "임대차 종료 시 임차인은 특약에 정한 범위까지 원상복구하여 반환하고, 임대인은 보증금을 반환한다."
  - type: article
    heading: 제5조 (수선 의무)
    lines:
      - "건물의 구조·설비에 관한 수선은 임대인이 부담하고, 임차인의 영업을 위한 시설과 소모품의 유지·교체는 임차인이 부담한다."
  - type: article
    heading: 제6조 (계약갱신요구권)
    lines:
      - "임차인은 임대차기간이 끝나기 6개월 전부터 1개월 전까지 계약갱신을 요구할 수 있고, 임대인은 상가건물 임대차보호법이 정한 정당한 사유가 없으면 이를 거절할 수 없다."
      - "갱신요구권은 최초 임대차기간을 포함하여 전체 임대차기간이 10년을 초과하지 않는 범위에서 행사할 수 있다."
  - type: article
    heading: 제7조 (권리금 회수기회의 보호)
    lines:
      - "임대인은 임대차 종료 6개월 전부터 종료 시까지 임차인이 주선한 신규 임차인이 되려는 자로부터 권리금을 받는 것을 정당한 사유 없이 방해하지 않는다."
  - type: article
    heading: 제8조 (계약의 해지)
    lines:
      - "임차인이 차임을 3기분 이상 연체하거나 제3조를 위반한 경우 임대인은 계약을 해지할 수 있다."
      - "임차인은 본인의 과실 없이 목적물을 사용할 수 없게 된 경우 계약을 해지할 수 있다."
  - type: article
    heading: 제9조 (제세공과금)
    lines:
      - "건물에 대한 재산세 등은 임대인이 부담하고, 전기·수도·가스 등 사용료와 영업에 따른 공과금은 임차인이 부담한다."
  - type: article
    heading: 제10조 (중개보수)
    lines:
      - "중개보수는 계약 체결과 동시에 임대인과 임차인이 각각 지급하며, 개업공인중개사는 중개대상물 확인·설명서를 교부한다."
  - type: subtitle
    text: 특약사항
  - type: textbox
    hint: "원상복구 범위, 인테리어 소유권, 간판 설치, 주차 대수, 영업시간 제한, 관리비 포함내역 등을 구체적으로 기재하십시오."
    height_mm: 26
  - type: para
    text: 본 계약을 증명하기 위하여 계약 당사자가 이의 없음을 확인하고 각각 서명·날인 후 각 1부씩 보관한다.
    align: both
    size: 9
  - type: date_line
  - type: subtitle
    text: 계약 당사자
  - type: grid
    widths: [14, 12, 24, 12, 18, 20]
    label_cols: [0, 1, 3]
    row_height_mm: 8
    rows:
      - ["임대인", "주소", "", "성명", "", "(서명 또는 인)"]
      - ["", "생년월일", "", "연락처", "", ""]
      - ["임차인", "주소", "", "성명", "", "(서명 또는 인)"]
      - ["", "사업자번호", "", "연락처", "", ""]
      - ["개업공인중개사", "사무소명", "", "대표", "", "(서명 또는 인)"]
      - ["", "등록번호", "", "연락처", "", ""]
  - type: notice
    text: 상가건물 임대차보호법의 보호를 받으려면 사업자등록과 확정일자가 필요합니다. 환산보증금이 지역별 기준을 초과하면 일부 조항만 적용되므로 계약 전 확인하십시오. 본 서식은 참고용입니다.
