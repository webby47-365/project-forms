id: meeting-minutes
title: 회의록
category: corp
subcategory: admin
tags: [회의록, 회의결과, 회의일지, minutes, 의사록]
summary: 회의 일시·장소·참석자와 안건별 논의내용·결정사항·후속조치를 기록하는 회의록 양식입니다.
usage: >
  회의 진행 과정을 공식 기록으로 남기는 서류입니다. 회의 중 논의된 안건별로 의견을
  정리하고 최종 결정사항과 개별 담당사항을 명확히 기재해야 향후 이행 여부 추적이
  가능합니다. 회의 직후 작성하여 참석자 일원으로부터 확인받으십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 회의록
    spaced: true
  - type: spacer
    height_pt: 6
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["회의명", "", "회의일시", ""]
      - ["회의장소", "", "", ""]
      - ["참석자", "", "", ""]
  - type: subtitle
    text: 1. 안건별 논의 내용
  - type: table
    widths: [15, 85]
    header: [안건, "논의 내용 및 결정사항"]
    empty_rows: 10
    row_height_mm: 10
  - type: subtitle
    text: 2. 결정사항 및 후속조치
  - type: table
    widths: [10, 40, 25, 15, 10]
    header: ["No", "결정사항", "담당자", "기한", "상태"]
    empty_rows: 6
    row_height_mm: 9
  - type: spacer
    height_pt: 6
  - type: para
    text: 위 회의록이 사실과 다름이 없음을 확인합니다.
    align: center
    size: 11
  - type: date_line
  - type: sign_line
    label: 회의 주재자
