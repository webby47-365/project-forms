id: meeting-minutes
title: 회의록
category: corp
subcategory: admin
tags: [회의록, 회의결과, 회의일지, minutes, 의사록]
summary: 회의 일시·장소·참석자와 안건별 논의내용·결정사항·후속조치를 기록하는 회의록 양식입니다.
usage: >
  회의 진행 과정을 공식 기록으로 남기는 서류입니다. 회의 중 논의된 안건별로 의견을
  정리하고 최종 결정사항과 개별 담당사항을 명확히 기재해야 향후 이행 여부 추적이
  가능합니다. 회의 직후 작성하여 참석자 일원으로부터 확인받으십시오.
source: original
featured: false
target_pages: 1
series: meeting-minutes
series_name: 회의록
variant: 기본형
variant_rank: 1
variant_use: 일반 부서·팀 회의 기록에 씁니다.

howto:
  - 회의명과 일시, 장소, 참석자를 먼저 적습니다.
  - 안건을 순서대로 나열합니다.
  - 안건별 논의 내용과 결정사항을 정리합니다.
  - 담당자와 처리 기한을 적습니다.
  - 작성자가 서명하고 참석자 확인을 받습니다.

faq:
  - q: 회의 중에 바로 작성해야 하나요?
    a: 기억이 정확한 회의 직후에 정리하는 것이 좋습니다. 결정사항과 담당자만 먼저 메모해 두면 편합니다.
  - q: 참석자가 서명을 거부하면 어떻게 하나요?
    a: 참석 여부와 의견을 회의록에 그대로 기록해 두면 됩니다. 서명은 확인용이지 효력 요건은 아닙니다.

related: [proposal-draft, cooperation-request, internal-announcement]

blocks:
  - type: doc_title
    text: 회의록
    spaced: true
  - type: spacer
    height_pt: 6
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["회의명", "", "회의일시", ""]
      - ["회의장소", "", "", ""]
      - ["참석자", "", "", ""]
    sample_rows:
      - ["", "2분기 마케팅 전략 회의", "", "2026-09-10 14:00"]
      - ["", "본사 3층 회의실 A", "", ""]
      - ["", "박민준, 김서연, 이수현", "", ""]
  - type: subtitle
    text: 1. 안건별 논의 내용
  - type: table
    widths: [15, 85]
    header: [안건, "논의 내용 및 결정사항"]
    empty_rows: 10
    row_height_mm: 10
    sample_rows:
      - ["1. 3분기 광고 예산", "채널별 배분안을 검토한 결과 SNS 비중을 40%로 상향하기로 결정함."]
      - ["2. 신제품 출시 일정", "생산 일정이 2주 지연되어 출시일을 10월 2주차로 연기하기로 함."]
  - type: subtitle
    text: 2. 결정사항 및 후속조치
  - type: table
    widths: [10, 40, 25, 15, 10]
    header: ["No", "결정사항", "담당자", "기한", "상태"]
    empty_rows: 6
    row_height_mm: 9
    sample_rows:
      - ["1", "SNS 광고 예산 40%로 상향 집행", "박민준", "2026-09-20", "진행중"]
      - ["2", "신제품 출시 일정 10월 2주차로 변경 공지", "김서연", "2026-09-15", "완료"]
  - type: spacer
    height_pt: 6
  - type: para
    text: 위 회의록이 사실과 다름이 없음을 확인합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    label: 회의 주재자
    sample_names: [박민준]
