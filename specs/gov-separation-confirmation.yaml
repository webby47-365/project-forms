- type: para
  text: '- ⑦란에는 ⑤란에 적은 기간에 지급된 기본급과 기본급 외의 기타수당을 적습니다. 상여금과 연차수당은 12개월 동안 지급된 총액의 3개월분만 작성합니다. 다만, 12개월 미만으로 근로했던 이직자에 대해서 는 그 근로한 개월에 지급된 상여금에 3을 곱하고 근로한 개월을 나눈 금액을 적습니다.'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 8.7
- type: para
  text: '※ 예) 근로한 개월이 6개월인 경우: 상여금 × 3/6'
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 7.8
- type: para
  text: '- ⑧란은 필요한 경우에만 적되,「근로기준법 시행령」 제6조에 따른 통상임금을 적습니다. 다만, 이직일을 기준으로 근무한 기간이 3개월 미만 경우에는 통상임금을 반드시 적습니다.'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 8.6
- type: para
  text: '- ⑨란은 ⑤번란에 작성한 임금계산기간 동안 고용보험료를 모두 기준보수로 낸 경우에만 작성하되, 이직 연도의 시간단위 기준 보수에 ⑩란의 1일 소정 근로시간수를 곱한 임금을 적습니다'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 13.8
- type: para
  text: '■ ⑪란 작성법: 이직자가 이직 당시에 1주 소정 근로시간이 15시간 미만이고, 1주 소정 근로일수가 2일 이하인 근로자였던 경우에만 적습니다. 실제 근로시간 및 근로일수가 아닌 근로계약서 등 으로 정한 소정 근로시간 및 근로일수를 기준으로 작성합니다.'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 13.8
- type: para
  text: '■ ⑫란 작성법: 기준기간 연장사유가 있는 경우에만 기재합니다. “사유코드”란에는 이직일 이전 18개월(다만, ⑪번에 해당하는 이직자는 24개월)간 30일 이상 보수 지급을 받을 수 없었던 사유의 코드번호를 적고, “연 장기간”란에 보수의 지급을 받을 수 없었던 기간을 적습니다. 이 경우 휴업 또는 휴직기 간에 보수를 지급 받을 수 없었다는 것을
    증명할 수 있는 서류를 첨부해야 합니다.'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
