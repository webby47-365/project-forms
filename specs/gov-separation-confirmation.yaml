- type: para
  text: '- ⑥란의 첫 번째 칸에는 이직일이 포함된 월의 1일부터 이직일까지를 적고, 차례로 1개월씩 지난 기간을 적되, 마지 막 칸에는 이직자의 이직 월에서는 3개월을 빼고, 이직일에는 1일을 더한 날부터 해당월의 말일까지 적습니다.'
