id: gov-separation-confirmation
title: 피보험자 이직확인서
category: public
subcategory: insurance
tags:
- 피보험자
- 이직확인서
- 실업급여
- 근로자
- 평균임금
summary: 회사를 그만둘 때 고용보험 실업급여 신청을 위해 사업주가 발급하는 법정 이직확인서입니다.
usage: '근로자가 퇴직 후 고용센터에 실업급여를 신청할 때 사업주가 작성하여 발급합니다. 근로자의 입사일·이직일·이직 사유·보수 내역·근로 기간 등을 기입합니다. 이직 사유는 코드와 함께 10자 이상 구체적으로 기입해야 합니다. 거짓 기입 시 과태료가 부과되거나 연대 책임이 발생할 수 있습니다.

  '
source: law-standard
source_note: 고용보험법 시행규칙 별지 제75호의4서식
law_ref:
  law: 고용보험법 시행규칙
  form_no: 별지 제75호의4서식
  amended: '2025-07-01'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EA%B3%A0%EC%9A%A9%EB%B3%B4%ED%97%98%EB%B2%95+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0075&bylBrNo=04&bylCls=BF&bylEfYdYn=Y
  agency: 고용노동부·근로복지공단
  checked: '2026-09-16'
featured: false
target_pages: 2
created_by: gov-batch
howto:
- 사업장과 근로자(이직자)의 기본정보를 적습니다.
- 이직 코드와 구체적인 이직 사유를 10자 이상 기입합니다.
- 피보험 기간·보수 지급 기초일수·임금 내역을 기입합니다.
- 사업장 명의자 또는 보험사무대행기관이 서명 또는 인감을 합니다.
faq:
- q: 이직 사유 코드는 뭔가요?
  a: 자진퇴사, 폐업, 정년 등 이직 원인에 따른 코드입니다. 신청서 뒷면의 상실(이직)사유 구분코드표에서 확인하면 됩니다.
- q: 평균임금은 어떻게 계산하나요?
  a: 이직 3개월 전의 임금 내역으로 계산합니다. 기본급·수당·상여금·연차수당을 모두 포함해야 합니다.
related:
- resignation-letter
- severance-calculation
