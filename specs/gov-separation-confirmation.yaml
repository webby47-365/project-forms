- type: para
  text: '- ②란의 가장 위 칸에는 이직자의 이직일이 포함된 월의 1일부터 이직일까지를 적습니다. 그 아래 칸에는 1개월씩 지난 기간을 각각 적습니다.'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 8.7
- type: para
  text: ※ 예) 12. 24. 이직자의 경우 가장 위 칸에는 12. 1. ~ 12. 24.를 적고 그 아래 칸에는 11. 1. ~ 11. 30., 10. 1.~ 10. 31.을 적되, 통산 피보험단위기간(④)이 180일이 되는 날까지만 적습니다(통상 7 ~ 8개월 작성하면 됩니다).
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 7.8
- type: para
  text: '- ③란에는 ②란에 작성된 기간 중 실제로 보수지급의 기초가 된 날을 모두 합산하여 작성합니다. 따라서 무급휴일, 보수가 지급되지 않은 결근일 등은 제외되고, 유급휴가, 유급휴일 등은 포함됩니다.'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 8.6
- type: para
  text: '- ④란에는 ③란에 작성된 보수지급 기초 일수를 모두 합산하여 적습니다.'
  align: left
  size: 9.0
  space_after: 0
  line_spacing: 1.0
