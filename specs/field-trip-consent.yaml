id: field-trip-consent
title: 현장학습 동의서
category: edu
subcategory: school
tags: [현장학습 동의서, 체험학습 신청서, 교외학습 동의, 보호자 동의서, 소풍 동의서]
summary: 현장학습의 일정·장소·이동수단을 안내하고 보호자 동의와 비상연락처를 받는 서식입니다.
usage: >
  학교나 기관의 교외 활동에 학생이 참여할 때 보호자의 동의를 받는 서류입니다. 활동 일시와 장소,
  이동 수단과 인솔 교사를 구체적으로 안내해 보호자가 판단할 수 있게 하십시오. 비상연락처는 반드시
  연결 가능한 번호를 적고, 활동 중 유의해야 할 사항이 있으면 보호자가 특이사항란에 적도록 안내합니다.
  참가비와 준비물, 우천 시 대체 일정도 함께 안내하면 문의를 줄일 수 있습니다. 동의서는 회신 기한
  전에 제출받아 인원을 확정하고, 안전보험 가입 여부를 확인하십시오.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 현장학습 동의서
    spaced: false
  - type: subtitle
    text: 1. 활동 안내
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
    rows:
      - ["활동명", "", "", ""]
      - ["일시", "20   년   월   일    시 ~    시", "인솔 교사", ""]
      - ["장소 및 주소", "", "", ""]
      - ["이동 수단", "도보 / 대중교통 / 전세버스", "참가비", ""]
      - ["준비물", "", "우천 시", "정상 진행 / 대체 일정"]
  - type: subtitle
    text: 2. 학생 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "학년·반·번호", ""]
      - ["생년월일", "", "학생 연락처", ""]
  - type: subtitle
    text: 3. 보호자 및 비상연락
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["보호자 성명", "", "학생과의 관계", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "비상 연락처", ""]
  - type: subtitle
    text: 4. 동의 사항
  - type: table
    widths: [48, 20, 16, 16]
    header: [동의 항목, 내용, 동의, 비고]
    empty_rows: 2
    row_height_mm: 8
  - type: kv_list
    items:
      - "자녀가 위 현장학습에 참여하는 것에 동의합니다."
      - "활동 중 인솔 교사의 안전 지도에 따르도록 지도하겠습니다."
      - "활동 사진의 교육 목적 이용에 동의합니다. (동의 / 미동의)"
  - type: textbox
    hint: "특이사항 — 활동 중 유의할 점이나 사전에 알려야 할 사항을 기재하십시오."
    height_mm: 14
  - type: grid
    widths: [22, 28, 22, 28]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["참가 여부", "참가 / 불참", "회신 기한", ""]
  - type: date_line
  - type: sign_line
    label: 보호자
  - type: spacer
    height_pt: 4
  - type: para
    text: ○○학교장 귀하
    align: center
    size: 11
  - type: notice
    text: 활동 중 안전을 위해 보험 가입 여부와 비상 대응 절차를 학교(기관)에 확인하십시오.
