id: pet-adoption-contract
title: 반려동물 분양 계약서
category: personal
subcategory: life
tags: [반려동물분양계약서, 반려동물계약서, 분양계약, 펫분양, 동물분양]
summary: 반려동물의 정보와 건강 상태를 확인하고 분양 조건·관리 의무를 정하는 분양 계약서입니다.
usage: >
  반려동물을 분양하거나 입양할 때 분양자와 입양자가 동물의 정보와 건강 상태를 확인하고
  분양 조건을 명확히 하기 위해 작성합니다. 종·품종·예방접종 이력 등을 사실대로 기재하고,
  인수 후 관리 의무와 유기 금지, 파양 시 통보 의무를 조항으로 남겨 분쟁을 예방합니다.
  소유자가 변경되면 동물보호법에 따른 동물등록 변경신고도 잊지 말고 진행하십시오.
source: original
featured: false
version: 1
created_by: agent
status: published
target_pages: 2

howto:
  - 반려동물의 종·품종과 예방접종 이력을 사실대로 적습니다.
  - 분양 조건과 대금 지급 방법을 정합니다.
  - 인수 후 관리 의무와 유기 금지 조항을 확인합니다.
  - 양 당사자가 서명하고 한 부씩 보관합니다.

faq:
  - q: 소유자 변경 신고도 해야 하나요?
    a: 예. 동물보호법에 따라 소유자가 바뀌면 동물등록 변경신고를 별도로 진행해야 합니다.
  - q: 파양하고 싶으면 어떻게 하나요?
    a: 계약서에 정한 통보 의무에 따라 분양자에게 미리 알리고, 정해진 절차를 거쳐 처리하십시오.

blocks:
  - type: doc_title
    text: 반려동물 분양 계약서

  - type: para
    text: 아래 당사자는 다음과 같이 반려동물 분양에 관하여 계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 당사자

  - type: grid
    widths: [16, 21, 17, 21, 25]
    label_cols: [0, 1, 3]
    row_height_mm: 8
    rows:
      - ["분양자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["입양자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "박민준", "", "1982-11-05"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "홍길동", "", "1990-02-14"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-9876-5432"]

  - type: subtitle
    text: 동물 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [3, 1, 3, 3]
    rows:
      - ["종", "", "품종", ""]
      - ["성별", "", "생년월일(추정)", ""]
      - ["모색", "", "체중", ""]
      - ["개체등록번호", "", "", ""]
    sample_rows:
      - ["", "개", "", "말티즈"]
      - ["", "암", "", "2025-04(추정)"]
      - ["", "크림색", "", "2.6kg"]
      - ["", "417000012345678", "", ""]

  - type: subtitle
    text: 건강 상태

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["예방접종 이력", "", "중성화 여부", ""]
      - ["최근 검진일", "", "", ""]
    sample_rows:
      - ["", "종합백신 3차 완료", "", "미중성화"]
      - ["", "2026-08-02 (웰빙동물병원)", "", ""]

  - type: subtitle
    text: 분양 조건

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["분양일", "", "분양비", ""]
      - ["인도 장소", "", "", ""]
    sample_rows:
      - ["", "2026-09-20", "", "300,000원"]
      - ["", "분양자 자택 (서울특별시 마포구 월드컵북로 100)", "", ""]

  - type: article
    heading: 제1조 (건강 상태의 고지)
    lines:
      - "분양자는 계약 체결 시점까지 확인된 반려동물의 건강 상태와 예방접종·병력을 입양자에게 사실대로 고지한다."

  - type: article
    heading: 제2조 (인수 후 관리 의무)
    lines:
      - "입양자는 인수 후 반려동물이 건강하게 생활할 수 있도록 적절한 사육환경, 먹이, 예방접종과 치료를 제공한다."

  - type: article
    heading: 제3조 (파양 시 통보 의무)
    lines:
      - "입양자가 부득이하게 반려동물을 더 이상 기를 수 없게 된 경우, 사전에 분양자에게 통보하고 이후 처리를 협의한다."

  - type: article
    heading: 제4조 (유기 금지)
    lines:
      - "입양자는 어떠한 경우에도 반려동물을 유기하지 않으며, 동물보호법 등 관계 법령을 준수한다."

  - type: article
    heading: 제5조 (동물등록 의무)
    lines:
      - "입양자는 동물보호법에 따라 반려동물의 소유자 변경 등록을 관할 시·군·구에 신고한다."

  - type: article
    heading: 제6조 (분쟁 해결)
    lines:
      - "본 계약과 관련하여 분쟁이 발생하는 경우 당사자는 우선 협의로 해결하며, 협의가 이루어지지 않는 경우 관계 법령에 따른다."

  - type: notice
    text: 반려동물의 소유자가 변경되면 동물보호법에 따라 관할 시·군·구에 동물등록 변경신고를 하여야 합니다.

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    labels: ["분양자", "입양자"]
    sample_names: [박민준, 홍길동]
