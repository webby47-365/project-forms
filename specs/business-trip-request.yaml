id: business-trip-request
title: 출장신청서
category: corp
subcategory: hr
tags: [출장신청서, 출장원, 출장신청, 여행경비, 출장보고]
summary: 출장지·기간·목적·예산을 기재하고 부서장과 대표가 승인하는 출장신청 양식입니다.
usage: >
  업무상 출장이 필요할 때 출장지, 기간, 목적, 예상 비용을 기재하여 제출하는 서류입니다.
  출장 예정일 최소 5일 전에 제출하여 사전 승인을 받아야 하며, 필요한 경우 업무대행자를
  지정하고 비상연락처를 남겨두어야 합니다. 반드시 예상 예산과 실제 사용 내역을 명확히 기재하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 인적사항과 소속 부서를 적습니다.
  - 출장지와 출장 기간, 목적을 적습니다.
  - 예상 비용을 항목별로 나눠 적습니다.
  - 업무대행자와 비상연락처를 지정합니다.
  - 부서장 결재를 받아 제출합니다.

faq:
  - q: 며칠 전에 제출해야 하나요?
    a: 회사 규정에 따라 다르지만 보통 출장 예정일로부터 최소 5일 전에 제출하는 것이 안전합니다.
  - q: 실제 비용이 예산과 다르면 어떻게 하나요?
    a: 출장 후 실제 사용 내역을 정산서에 별도로 작성해 차액을 보고합니다.

related: [business-trip-report, expense-report, expense-approval, vehicle-use-request]

blocks:
  - type: doc_title
    text: 출장신청서
    spaced: true

  - type: grid
    widths: [16, 18, 16, 18, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 9
    rows:
      - ["부서(팀)", "", "직위", "", "성명", ""]
      - ["사번", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "영업팀", "", "과장", "", "박민준"]
      - ["", "B5678", "", "1990-07-22", "", "010-1234-5678"]

  - type: subtitle
