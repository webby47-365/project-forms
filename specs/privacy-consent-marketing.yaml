id: privacy-consent-marketing
title: 마케팅 활용 동의서
category: public
subcategory: consent
series: privacy-consent
series_name: 개인정보 동의서
variant: 마케팅 활용
variant_rank: 4
tags: [마케팅활용동의서, 광고성정보수신동의, 개인정보동의서, 수신동의, 마케팅동의]
summary: 문자·이메일·앱푸시 등 채널별 광고성 정보 수신에 대한 선택 동의와 수신 거부 방법을 안내하는 동의서입니다.
usage: >
  신제품 소식이나 할인 혜택처럼 광고성 정보를 보내기 전에 받는 선택 동의서입니다. 수신 채널별로
  동의 여부를 따로 받고, 활용 목적·항목·보유기간을 표에 기재합니다. 이 동의는 선택 사항이며
  동의하지 않아도 기본 서비스 이용에는 제한이 없다는 점을 명시해야 합니다. 수신 거부(철회)
  방법을 함께 안내하여 언제든 동의를 철회할 수 있게 하십시오.
source: law-standard
source_note: 개인정보 보호법 제22조 및 정보통신망법 제50조 반영
featured: false
target_pages: 1
created_by: agent
status: published
version: 1
blocks:
  - type: doc_title
    text: 마케팅 활용 동의서
    spaced: false
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
  - type: subtitle
    text: 1. 광고성 정보 수신 동의 (선택)
  - type: para
    text: 아래 동의는 선택 사항이며, 동의하지 않아도 서비스 이용에 제한이 없습니다.
    align: left
    size: 10.5
  - type: table
    widths: [50, 25, 25]
    header: ["수신 채널", "동의", "동의하지 않음"]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["문자(SMS/MMS)", "○", ""]
      - ["이메일", "○", ""]
      - ["앱 푸시", "", "○"]
  - type: subtitle
    text: 2. 활용 목적·항목 및 보유기간
  - type: table
    widths: [35, 35, 30]
    header: ["활용 목적", "활용 항목", "보유 및 이용기간"]
    empty_rows: 2
    row_height_mm: 8
    sample_rows:
      - ["신상품 소식 및 할인 혜택 안내", "성명, 연락처, 이메일", "동의 철회 시까지"]
  - type: subtitle
    text: 3. 수신 거부 방법
  - type: para
    text: 수신을 원하지 않으시면 고객센터(1588-0000) 또는 이메일 회신으로 언제든 수신 거부(동의 철회)를 요청할 수 있습니다.
    align: left
    size: 10.5
  - type: date_line
    sample_text: 2026 년    9 월   13 일
  - type: sign_line
    label: 본인
    sample_names: [홍길동]
  - type: notice
    text: 이 동의는 선택 사항이며, 동의하지 않아도 기본 서비스 이용에는 영향이 없습니다.
