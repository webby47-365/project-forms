id: sales-contract
title: 판매계약서
category: corp
subcategory: sales
tags: [판매계약서, 물품판매계약, 공급계약서, 거래계약서]
summary: 판매 품목·수량·대금·인도조건과 하자담보·계약해지 조항을 담은 물품 판매계약서입니다.
usage: >
  물품을 계속적·반복적으로 공급하는 거래에서 조건을 미리 확정해 두는 계약서입니다. 단가
  변동 조건, 하자 발생 시 처리 방법, 소유권 이전 시점을 명확히 해야 분쟁을 막을 수 있습니다.
  개별 발주는 이 계약을 근거로 발주서로 처리하는 것이 일반적입니다. 본 서식은 참고용이며
  개별 사안의 법적 적합성은 이용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 판매계약서
    spaced: false
  - type: para
    text: 매도인과 매수인은 아래와 같이 물품 판매계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 계약 당사자
  - type: grid
    widths: [14, 26, 14, 22, 24]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["매도인 상호", "", "대표자", "", "사업자등록번호"]
      - ["소재지", "", "담당자", "", "연락처"]
      - ["매수인 상호", "", "대표자", "", "사업자등록번호"]
      - ["소재지", "", "담당자", "", "연락처"]
  - type: subtitle
    text: 계약 내용
  - type: table
    widths: [8, 26, 18, 10, 16, 22]
    header: ["No", 품명, 규격, 단위, 단가, 월 예상수량]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
  - type: grid
    widths: [16, 24, 16, 20, 24]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["계약기간", "", "대금 지급방법", "", "현금 / 어음 / 카드"]
      - ["결제조건", "", "인도 장소", "", "운송비 부담"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 매도인이 매수인에게 위 물품을 공급하고 매수인이 그 대금을 지급하는 것에 관한 사항을 정함을 목적으로 한다."
  - type: article
    heading: 제2조 (개별 발주)
    lines:
      - "구체적인 품목·수량·납기는 매수인이 발행하는 발주서에 따르며, 발주서의 내용이 본 계약과 상충하는 경우 본 계약을 우선한다."
  - type: article
    heading: 제3조 (단가의 조정)
    lines:
      - "원자재 가격이나 환율이 현저히 변동한 경우 당사자는 협의하여 단가를 조정할 수 있다. 조정은 서면 합의로만 효력이 있다."
  - type: article
    heading: 제4조 (인도 및 검수)
    lines:
      - "매도인은 약정한 장소에 물품을 인도하고, 매수인은 인도일로부터 7일 내에 검수하여 그 결과를 통지한다."
      - "기간 내 통지가 없으면 검수에 합격한 것으로 본다."
  - type: article
    heading: 제5조 (소유권 및 위험부담)
    lines:
      - "물품의 소유권은 대금 완납 시 매수인에게 이전하며, 멸실·훼손의 위험은 인도 시점부터 매수인이 부담한다."
  - type: article
    heading: 제6조 (하자담보책임)
    lines:
      - "매수인은 인도일로부터      개월 내에 발견된 하자에 대하여 보수·교체 또는 대금 감액을 청구할 수 있다."
      - "매수인의 보관·사용상 과실로 인한 하자는 제외한다."
  - type: article
    heading: 제7조 (지연손해금)
    lines:
      - "매도인이 납기를 지연한 경우 지연일수에 대하여 해당 물품 대금의 1일 0.1%를 지연손해금으로 지급한다."
      - "매수인이 대금 지급을 지연한 경우에도 같은 기준을 적용한다."
  - type: article
    heading: 제8조 (계약의 해지)
    lines:
      - "당사자 일방이 본 계약을 위반하고 상대방의 시정 요구를 받은 날부터 14일 내에 이를 시정하지 않으면 상대방은 계약을 해지할 수 있다."
  - type: article
    heading: 제9조 (비밀유지)
    lines:
      - "당사자는 본 계약 이행 과정에서 알게 된 상대방의 영업비밀을 제3자에게 누설하지 않는다."
  - type: article
    heading: 제10조 (관할법원)
    lines:
      - "본 계약에 관한 분쟁은 매도인의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: subtitle
    text: 특약사항
  - type: textbox
    hint: "반품 조건, 최소 발주수량, 독점 공급 여부 등 합의한 내용을 기재하십시오."
    height_mm: 22
  - type: para
    text: 본 계약을 증명하기 위하여 계약서 2부를 작성하여 당사자가 서명·날인 후 각 1부씩 보관한다.
    align: center
    size: 10
    space_after: 2
  - type: date_line
  - type: sign_line
    labels: ["매도인", "매수인"]
  - type: notice
    text: 본 서식은 참고용이며 개별 사안에 대한 법적 효력과 적합성은 이용자가 확인해야 합니다. 금액이 큰 거래는 전문가의 검토를 받으십시오.
