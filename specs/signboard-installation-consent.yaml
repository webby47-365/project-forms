id: signboard-installation-consent
title: 간판 설치 동의서
category: public
subcategory: permit
tags: [간판설치동의서, 간판동의서, 옥외광고물동의서, 건물주간판동의, 간판허가동의]
summary: 건물 소유자나 임대인이 임차인의 간판·옥외광고물 설치에 동의함을 적는 서식으로, 설치 위치와 크기, 원상복구 조건을 담습니다.
usage: >
  상가 임차인이 간판을 달기 전에 건물 소유자(또는 임대인)의 동의를 받아 두는 서식입니다. 건물 정보와
  설치할 간판의 종류·위치·크기, 설치 기간과 철거·원상복구 조건을 적고 동의인이 서명 또는 날인합니다.
  옥외광고물 신고나 허가가 필요한 경우 담당 관청에 제출할 서류로 요구될 수 있으므로 제출처 안내를
  함께 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 건물 소재지와 동의인(소유자)을 적습니다.
  - 간판을 설치할 사람과 상호를 적습니다.
  - 간판 종류와 위치, 크기를 적습니다.
  - 철거·원상복구 조건을 확인하고 날짜와 서명을 합니다.
faq:
  - q: 임대인이 건물 소유자가 아니면 누가 동의하나요?
    a: 제출처가 요구하는 동의인을 따릅니다. 보통 건물 소유자 동의를 요구하므로 먼저 확인하십시오.
  - q: 간판 크기는 어떻게 적나요?
    a: 가로×세로를 센티미터 단위로 적고, 돌출형이면 돌출 길이도 함께 적으면 분명합니다.
  - q: 동의서만 있으면 간판을 달 수 있나요?
    a: 아닙니다. 옥외광고물은 별도 신고나 허가가 필요할 수 있으니 관할 관청 안내를 확인하십시오.
related: [business-facility-use-consent, commercial-lease-contract, business-report-agent-poa, permit-application-poa]
blocks:
  - type: doc_title
    text: 간판 설치 동의서
    spaced: true
  - type: subtitle
    text: 1. 동의인 (건물 소유자)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명(상호)", "", "연락처", ""]
      - ["건물 소재지", "", "", ""]
    sample_rows:
      - ["", "박민준", "", "010-2345-6789"]
      - ["", "서울특별시 마포구 월드컵북로 50 1층", "", ""]
  - type: subtitle
    text: 2. 설치 신청인 (임차인)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "상호", ""]
      - ["연락처", "", "업종", ""]
    sample_rows:
      - ["", "김서연", "", "새길커피"]
      - ["", "010-3456-7890", "", "휴게음식점"]
  - type: subtitle
    text: 3. 간판 내용
  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["간판 종류", "(   ) 돌출간판   (   ) 벽면 이용   (   ) 지주   (   ) 기타"]
      - ["설치 위치", ""]
      - ["크기(가로×세로)", ""]
      - ["설치 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "( ✓ ) 돌출간판   (   ) 벽면 이용   (   ) 지주   (   ) 기타"]
      - ["", "1층 전면 출입구 우측 외벽"]
      - ["", "60cm × 120cm"]
      - ["", "2026-10-15 ~ 2028-10-14"]
  - type: kv_list
    items:
      - "동의인은 위 간판의 설치에 동의합니다."
      - "설치 기간이 끝나거나 임대차가 종료되면 신청인이 간판을 철거하고 원상복구합니다."
      - "간판의 설치·유지로 생기는 안전사고의 관리 책임은 신청인에게 있습니다."
  - type: date_line
    sample_text: 2026 년   10 월    1 일
  - type: sign_line
    labels: ["동의인", "신청인"]
    sample_names: [박민준, 김서연]
  - type: notice
    text: 옥외광고물 신고·허가 여부와 제출 서류는 관할 관청 안내를 확인하십시오.
