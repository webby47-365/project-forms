id: career-certificate-request
title: 경력증명서 발급 요청서
category: personal
subcategory: career
tags: [경력증명서발급요청서, 경력증명서신청서, 경력증명서요청, 재직경력증명요청, 이직서류요청]
summary: 이직·입사 서류 제출을 위해 전 직장에 경력증명서 발급을 요청할 때 근무 기간·발급 부수·수령 방법을 적는 요청서입니다.
usage: >
  새 직장 입사나 이직 절차에서 경력증명서를 내야 할 때, 이전 직장 인사 담당자에게 발급을 요청하는
  서류입니다. 재직했던 기간과 부서·직위, 필요한 부수, 제출처와 수령 방법을 적어 두면 담당자가
  빠르게 처리할 수 있습니다. 퇴사 후에는 회사의 발급 절차와 소요 기간이 달라질 수 있으므로 제출
  기한에 여유를 두고 요청하십시오. 경력증명서에 넣을 담당 업무 내용도 미리 정해 전달하면 좋습니다.
source: original
featured: false
target_pages: 1

howto:
  - 요청자 성명·연락처와 재직했던 기간을 적습니다.
  - 근무했던 부서와 직위, 담당 업무를 적습니다.
  - 필요한 부수와 제출처, 수령 방법을 적습니다.
  - 서명해 인사 담당자에게 보냅니다.

faq:
  - q: 퇴사한 뒤에도 요청할 수 있나요?
    a: 회사마다 발급 절차가 달라 인사 담당 부서에 요청 방법을 먼저 확인하는 것이 좋습니다.
  - q: 담당 업무를 요청서에 적어도 되나요?
    a: 적어 두면 증명서에 넣을 내용을 맞추기 쉽습니다. 다만 최종 내용은 회사가 확인해 작성합니다.
  - q: 제출 기한이 촉박하면 어떻게 하나요?
    a: 요청서에 희망 수령일을 적고 담당자에게 따로 연락해 처리 가능한 일정을 확인하십시오.

related: [career-certificate, employment-certificate, resume-experienced, reference-check-consent]

blocks:
  - type: doc_title
    text: 경력증명서 발급 요청서
    spaced: false

  - type: subtitle
    text: 1. 요청자 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "이메일", ""]
    sample_rows:
      - ["", "홍길동", "", "1992-04-08"]
      - ["", "010-1234-5678", "", "hong@example.com"]

  - type: subtitle
    text: 2. 재직 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
    rows:
      - ["재직 기간", "20   년  월  일 ~ 20   년  월  일", "", ""]
      - ["부서", "", "직위", ""]
      - ["담당 업무", "", "", ""]
    sample_rows:
      - ["", "2021년 3월 2일 ~ 2026년 8월 31일", "", ""]
      - ["", "마케팅팀", "", "대리"]
      - ["", "온라인 광고 운영과 성과 분석", "", ""]

  - type: subtitle
    text: 3. 발급 요청 내용

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [2, 1, 2, 3]
      - [3, 1, 3, 3]
    rows:
      - ["필요 부수", "", "희망 수령일", ""]
      - ["제출처", "", "용도", ""]
      - ["수령 방법", "(   ) 방문   (   ) 이메일   (   ) 우편", "", ""]
      - ["비고", "", "", ""]
    sample_rows:
      - ["", "1부", "", "2026-10-06"]
      - ["", "(주)새길데이터", "", "이직 서류 제출"]
      - ["", "(   ) 방문   ( ✓ ) 이메일   (   ) 우편", "", ""]
      - ["", "", "", ""]

  - type: para
    text: 위와 같이 경력증명서의 발급을 요청합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년    9 월   29 일

  - type: sign_line
    label: 요청자
    sample_names: [홍길동]

  - type: para
    text: (주)한빛커머스 인사 담당자 귀하
