id: national-pension-history-poa
title: 국민연금 가입내역 확인서 발급 위임장
category: public
subcategory: insurance
tags: [국민연금가입내역위임장, 연금가입내역확인서, 국민연금대리발급, 가입증명위임장, 국민연금위임장]
summary: 국민연금 가입내역 확인서 발급을 가족이나 대리인에게 맡길 때 위임 범위와 제출 용도를 적는 위임장입니다.
usage: >
  이직·대출·공공기관 제출 등으로 국민연금 가입내역 확인서가 필요한데 직접 방문이 어려울 때
  대리인에게 발급을 맡기는 위임장입니다. 위임인과 대리인 정보, 필요한 서류의 용도와 통수, 위임
  기간을 적고 위임인이 서명 또는 날인합니다. 대리 발급 시 요구되는 신분증과 서류는 기관별로 다를 수
  있으므로 발급 기관 안내를 먼저 확인하십시오. 이 서식에는 주민등록번호를 적지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 위임인의 성명과 생년월일, 연락처를 적습니다.
  - 대리인의 성명과 위임인과의 관계를 적습니다.
  - 필요한 서류의 용도와 통수, 제출처를 적습니다.
  - 위임 기간을 적고 위임인이 서명 또는 날인합니다.
faq:
  - q: 주민등록번호를 적어야 하나요?
    a: 이 서식에는 적는 칸이 없습니다. 기관이 본인 확인을 요구하면 창구에서 별도로 확인합니다.
  - q: 위임장이 있으면 신분증 없이 가능한가요?
    a: 대개 신분증 확인이 필요합니다. 방문 전에 필요한 서류를 기관에 문의하십시오.
  - q: 발급 용도는 무엇을 적나요?
    a: 제출처가 요구한 목적을 그대로 적습니다. 예를 들어 이직 서류나 대출 심사 제출용입니다.
related: [gov-pension-exemption, social-insurance-filing-poa, employment-insurance-history-request, insurance-enrollment-confirmation-request]
blocks:
  - type: doc_title
    text: 국민연금 가입내역 확인서 발급 위임장
    spaced: false
  - type: para
    text: 본인은 아래 대리인에게 국민연금 가입내역 확인서 발급 신청에 관한 권한을 위임합니다.
    align: center
  - type: subtitle
    text: 1. 위임인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-11-02"]
      - ["", "서울특별시 마포구 월드컵북로 50 101동 502호", "", ""]
      - ["", "010-1234-5678", "", ""]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "위임인과의 관계", ""]
    sample_rows:
      - ["", "김서연", "", "1988-04-17"]
      - ["", "010-3456-7890", "", "배우자"]
  - type: subtitle
    text: 3. 위임 내용
  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["서류 종류", "국민연금 가입내역 확인서   통수:      통"]
      - ["발급 용도", ""]
      - ["제출처", ""]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "국민연금 가입내역 확인서   통수:   1   통"]
      - ["", "이직 서류 제출"]
      - ["", "(주)새길데이터 인사팀"]
      - ["", "2026-10-06 ~ 2026-10-10"]
  - type: kv_list
    items:
      - "대리인은 위임받은 범위 안에서만 위 서류를 발급받아 사용합니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."
  - type: date_line
    sample_text: 2026 년   10 월    5 일
  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 대리 발급에 필요한 신분증·추가 서류는 발급 기관 안내를 확인하십시오.
