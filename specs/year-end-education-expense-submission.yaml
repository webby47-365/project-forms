id: year-end-education-expense-submission
title: 연말정산 교육비 납입 자료 제출서
category: corp
subcategory: finance
tags: [연말정산, 교육비, 학원비, 납입증명, 소득공제]
summary: 연말정산을 위해 근로자가 본인·자녀 등의 교육비 납입 내역과 납입증명 서류를 회사에 제출할 때 쓰는 교육비 납입 자료 제출서 양식입니다.
usage: >
  연말정산 간소화 자료에 잡히지 않은 교육비 납입 내역을 회사에 알리고 증빙을 내는 서식입니다.
  교육 대상자의 관계, 교육기관, 교육 구분, 납입 기간과 납입액을 한 줄씩 적고 교육기관에서 받은 납입증명서를 붙입니다.
  교육 대상자의 주민등록번호는 적지 않습니다. 공제 대상과 한도는 세법과 회사 안내에 따라 달라지므로 담당 부서와 국세청 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 제출자의 성명과 소속, 제출일을 적습니다.
  - 교육 대상자와의 관계, 교육기관명을 적습니다.
  - 교육 구분과 납입 기간, 납입액을 적습니다.
  - 교육기관 납입증명서를 붙여 담당 부서에 냅니다.
faq:
  - q: 교육 대상자 주민번호도 적나요?
    a: 이 서식에는 적지 않습니다. 필요 여부는 회사 담당 부서와 교육기관 증명서 기준에 따릅니다.
  - q: 간소화 자료에 있는 교육비도 적나요?
    a: 이미 조회되는 내역은 보통 다시 내지 않습니다. 빠진 교육기관만 적는 편이 좋습니다.
related: [year-end-tax-checklist, year-end-dependent-change-notice, year-end-medical-expense-submission, year-end-simplified-data-consent]
blocks:
  - type: doc_title
    text: 연말정산 교육비 납입 자료 제출서
    spaced: false
  - type: subtitle
    text: 1. 제출자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "소속", ""]
      - ["직위", "", "제출일", ""]
      - ["귀속 연도", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "(주)한빛커머스 영업팀"]
      - ["", "과장", "", "2026-11-11"]
      - ["", "2026년", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 교육비 납입 내역
  - type: table
    widths: [7, 14, 25, 18, 16, 20]
    header: ["No", 관계, 교육기관, 교육 구분, 납입 기간, 납입액(원)]
    empty_rows: 5
    row_height_mm: 8
    sample_rows:
      - ["1", "자녀", "새길초등학교", "초등", "2026.03~08", "900,000"]
      - ["2", "본인", "한빛대학원", "대학원", "2026.03~08", "3,500,000"]
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["납입 합계", "", "증빙 첨부", ""]
    sample_rows:
      - ["", "4,400,000원", "", "납입증명서 2부"]
  - type: textbox
    hint: "간소화 자료에 없는 이유나 추가 납입 예정 내용을 적으십시오."
    height_mm: 20
    sample_text: "학교에서 직접 납부한 내역이 간소화 자료에 조회되지 않아 납입증명서로 보완합니다."
  - type: date_line
    sample_text: 2026 년   11 월   11 일
  - type: sign_line
    labels: ["제출자"]
    sample_names: [홍길동]
  - type: notice
    text: 공제 대상과 한도는 세법과 회사 안내를 확인하십시오.
