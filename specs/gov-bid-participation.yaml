id: gov-bid-participation
title: 입찰참가신청서 (국가계약)
category: public
subcategory: procure
tags:
- 입찰
- 입찰참가신청
- 국가계약
- 조달
- 낙찰보증금
summary: 국가·지방자치단체의 공사·물품·용역 입찰에 참가하기 전에 제출하는 법정 신청서입니다.
usage: '정부나 지자체의 공사, 물품, 용역 입찰에 참가하려면 먼저 입찰참가신청을 합니다. 신청인(회사) 정보, 입찰 공고번호, 입찰보증금, 대리인 정보를 작성합니다. 입찰참가자격을 증명하는 서류와 인감증명서를 함께 제출합니다. 자세한 참가 자격 요건과 제출 기한은 발주기관의 입찰공고를 확인하십시오.

  '
source: law-standard
source_note: 국가를 당사자로 하는 계약에 관한 법률 시행규칙 별지 제3호서식
law_ref:
  law: 국가를 당사자로 하는 계약에 관한 법률 시행규칙
  form_no: 별지 제3호서식
  amended: '2016-09-23'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EA%B5%AD%EA%B0%80%EB%A5%BC+%EB%8B%B9%EC%82%AC%EC%9E%90%EB%A1%9C+%ED%95%98%EB%8A%94+%EA%B3%84%EC%95%BD%EC%97%90+%EA%B4%80%ED%95%9C+%EB%B2%95%EB%A5%A0+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0003&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 기획재정부·조달청
  checked: '2026-09-16'
featured: false
target_pages: 1
created_by: gov-batch
howto:
- 신청인(회사)의 상호, 법인등록번호, 주소, 전화번호를 적습니다.
- 입찰 공고번호와 입찰 건명, 일자를 적습니다.
- 입찰보증금 규모와 납부 방법을 기재합니다.
- 대리인이 있으면 대리인 정보를 적습니다.
- 필요한 서류를 첨부하여 제출합니다.
faq:
- q: 입찰보증금은 얼마를 내야 하나요?
  a: 입찰공고에 명시된 보증금율 또는 보증액을 확인하여 납부합니다.
- q: 대리인이 신청할 수 있나요?
  a: 대리인이 신청하는 경우 신청인의 위임을 받아야 하며, 대리인의 권한 증명 서류가 필요합니다.
- q: 어떤 자격 증명 서류가 필요한가요?
  a: 입찰참가자격을 증명하는 서류와 인감증명서(또는 본인서명사실확인서) 등 입찰공고에서 정한 서류를 제출합니다.
