id: course-registration
title: 수강신청서
category: edu
subcategory: school
tags: [수강신청서, 강좌 신청서, 학원 수강신청, 과목 신청, 수강 등록]
summary: 신청 강좌와 수강 기간·수강료, 환불 규정 확인을 기재하는 수강신청서입니다.
usage: >
  학교나 학원, 평생교육기관의 강좌를 신청할 때 작성하는 서식입니다. 신청 강좌는 과목명과 담당
  강사, 요일·시간을 함께 적어 일정이 겹치지 않는지 확인하십시오. 수강료와 교재비는 나누어 적고
  납부 방법과 납부일을 명확히 기재합니다. 환불 규정은 기관마다 다르므로 신청 전에 확인하고 확인란에
  표시하십시오. 미성년자가 신청하는 경우 보호자 정보와 동의가 필요하며, 개인정보 수집·이용
  동의 항목도 함께 확인합니다. 수강 변경이나 취소가 필요할 때를 대비해 사본을 보관하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 수강신청서
  - type: subtitle
    text: 1. 신청인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "이메일", ""]
      - ["소속(학교·학년)", "", "신청 경로", ""]
    sample_rows:
      - ["", "박민준", "", "2010-05-14"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", "park.minjun@example.com"]
      - ["", "한빛고등학교 2학년", "", "홈페이지"]
  - type: subtitle
    text: 2. 신청 강좌
  - type: table
    widths: [8, 24, 16, 20, 16, 16]
    header: ["No", 강좌(과목)명, 담당 강사, 요일·시간, 수강기간, 수강료]
    empty_rows: 2
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "수능 영어 독해", "이수현", "화·목 19시", "2026.09~11", "280,000원"]
  - type: subtitle
    text: 3. 납부 내역
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["수강료 합계", "", "교재비", ""]
      - ["할인 내역", "", "납부 총액", ""]
      - ["납부 방법", "계좌이체 / 카드 / 현금", "납부 예정일", ""]
    sample_rows:
      - ["", "280,000원", "", "20,000원"]
      - ["", "없음", "", "300,000원"]
      - ["", "계좌이체", "", "2026-09-20"]
  - type: subtitle
    text: 4. 확인 및 동의
  - type: table
    widths: [46, 22, 16, 16]
    header: [확인 항목, 내용, 확인, 비고]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["환불 규정을 확인하였습니다.", "-", "확인", "-"]
      - ["개인정보 수집·이용에 동의합니다.", "-", "동의", "-"]
  - type: kv_list
    items:
      - "수강 취소와 환불은 기관이 정한 규정에 따르며, 신청 전에 규정을 확인하였습니다."
      - "개인정보는 수강 관리와 안내 목적으로만 이용하는 데 동의합니다."
      - "강좌 일정은 기관 사정으로 변경될 수 있으며 변경 시 사전에 안내받습니다."
  - type: grid
    widths: [22, 28, 22, 28]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["보호자 성명 (미성년자)", "", "보호자 연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-8765-4321"]
  - type: para
    text: 위와 같이 수강을 신청합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월   13 일
  - type: sign_line
    labels: ["신청인", "보호자(미성년자)"]
    sample_names: [박민준, 홍길동]
  - type: notice
    text: 환불 규정과 수강 변경 절차는 기관마다 다르므로 신청 전에 확인하고 사본을 보관하십시오.
