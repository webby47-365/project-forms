id: business-license-reissue-request
title: 영업신고증 재발급 신청서
category: public
subcategory: permit
tags: [영업신고증재발급, 영업허가증재발급, 신고필증분실, 영업신고증분실, 재교부신청]
summary: 분실하거나 훼손한 영업신고증(허가증)의 재발급을 관할 기관에 요청하는 신청서입니다.
usage: >
  영업신고증이나 허가증을 잃어버렸거나 찢어져 못 쓰게 되었을 때 관할 기관에 재발급을 요청하는
  신청서입니다. 영업자 정보와 영업장 주소, 기존 신고번호, 재발급 사유를 적고 신분증 등
  제출처가 요구하는 서류를 함께 냅니다. 업종과 지자체마다 접수 방식과 수수료가 다르므로 접수 전에
  관할 기관의 안내를 확인하십시오. 분실한 경우 재발급 뒤 예전 증서를 다시 찾아도 사용하지 않도록 합니다.
source: original
featured: false
target_pages: 1

howto:
  - 영업자의 성명과 연락처, 상호를 적습니다.
  - 영업장 소재지와 기존 신고번호를 적습니다.
  - 재발급 사유를 분실·훼손 중에서 고릅니다.
  - 날짜와 신청인 서명을 하고 관할 기관에 냅니다.

faq:
  - q: 신고번호를 모르면 어떻게 하나요?
    a: 비워 두고 상호와 영업장 주소를 정확히 적으면 관할 기관에서 확인해 줄 수 있습니다.
  - q: 수수료가 있나요?
    a: 업종과 지자체에 따라 다르므로 접수 전에 관할 기관에 확인하십시오.

related: [business-report-agent-poa, permit-application-poa, business-registration-poa]

blocks:
  - type: doc_title
    text: 영업신고증 재발급 신청서
    spaced: false

  - type: subtitle
    text: 1. 신청인(영업자)

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["상호", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-11-02"]
      - ["", "한빛식당", "", "010-1234-5678"]

  - type: subtitle
    text: 2. 영업 내용

  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["업종", ""]
      - ["영업장 소재지", ""]
      - ["기존 신고번호", ""]
    sample_rows:
      - ["", "일반음식점"]
      - ["", "서울특별시 마포구 월드컵북로 50 1층"]
      - ["", "제2024-0000호"]

  - type: subtitle
    text: 3. 재발급 사유

  - type: kv_list
    items:
      - "[   ] 분실   [   ] 훼손   [   ] 기타"

  - type: textbox
    hint: "분실·훼손 경위와 시기를 간단히 적으십시오."
    height_mm: 24
    sample_text: "이전 중 이삿짐 정리 과정에서 영업신고증 원본을 분실하였습니다."

  - type: para
    text: 위와 같이 영업신고증의 재발급을 신청합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년   10 월    4 일

  - type: sign_line
    label: 신청인
    sample_names: [홍길동]

  - type: notice
    text: 접수 방식·수수료·첨부 서류는 관할 기관의 안내를 확인하십시오.
