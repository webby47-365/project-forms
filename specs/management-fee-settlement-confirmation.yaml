id: management-fee-settlement-confirmation
title: 관리비 정산 확인서
category: estate
subcategory: lease
tags: [관리비정산확인서, 이사관리비정산, 임대차관리비정산서, 오피스텔관리비정산, 관리비미납확인서]
summary: 이사·계약 종료 시 임차인이 낸 관리비와 예치금, 미납·환급액을 정리해 임대인(관리사무소)과 임차인이 함께 확인하는 관리비 정산 확인서입니다.
usage: >
  임대차 계약이 끝나 이사를 나갈 때, 그동안 낸 관리비 예치금과 정산월분 관리비를 정리해
  환급액이나 추가 납부액을 확정하기 위해 쓰는 서류입니다. 관리사무소나 임대인이 청구하는
  정산 내역을 항목별로 표에 적고, 미납액이 있으면 함께 정리해 보증금 반환 정산과 어긋나지
  않게 맞춥니다. 장기수선충당금 등 환급 대상 항목이 있는지는 관리규약을 먼저 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 임대인(관리사무소)과 임차인, 정산 대상 호실을 적습니다.
  - 정산 기간과 관리비 예치금 내역을 적습니다.
  - 정산월분 관리비 항목별 금액을 표에 정리합니다.
  - 미납액·환급액을 계산해 최종 정산금액을 확정합니다.
  - 양측이 확인 서명합니다.

faq:
  - q: 장기수선충당금도 돌려받나요?
    a: 임차인이 낸 장기수선충당금은 임대인에게 청구해 돌려받는 것이 원칙이라 정산서에 별도로 표시합니다.
  - q: 관리비 정산과 보증금 반환은 따로 처리하나요?
    a: 보통 관리비 정산금을 보증금 반환액에 합산해 한 번에 정산하므로 이사 전에 미리 확정하는 것이 좋습니다.
  - q: 정산 기준일은 언제로 하나요?
    a: 통상 실제 퇴거일(관리비 부과 종료일)을 기준으로 하며, 관리사무소 마감일정에 따라 달라질 수 있습니다.

related: [move-in-checklist, deposit-return-notice, housing-lease-contract]

blocks:
  - type: doc_title
    text: 관리비 정산 확인서
    spaced: true

  - type: subtitle
    text: 1. 정산 대상

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["건물명·호실", "", "정산 기준일", ""]
      - ["임대인(관리사무소)", "", "임차인", ""]
    sample_rows:
      - ["", "한빛오피스텔 302호", "", "2026-09-30"]
      - ["", "한빛오피스텔 관리사무소", "", "이수현"]

  - type: subtitle
    text: 2. 관리비 예치금 내역

  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["예치금 납부액", "", "예치금 납부일", ""]
    sample_rows:
      - ["", "150,000원", "", "2025-03-15"]

  - type: subtitle
    text: 3. 정산월분 관리비

  - type: table
    widths: [26, 18, 18, 20, 18]
    header: [항목, 부과금액, 미납액, 환급액, 비고]
    empty_rows: 5
    row_height_mm: 8
    sample_rows:
      - ["일반관리비", "80,000원", "-", "-", "9월분 정산"]
      - ["전기·수도료", "35,000원", "-", "-", "실사용분"]
      - ["장기수선충당금", "-", "-", "20,000원", "임대인 청구분"]

  - type: subtitle
    text: 4. 최종 정산 결과

  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["미납 합계", "", "환급 합계", ""]
      - ["최종 정산금액", "", "정산 방법", "보증금 반환액에 합산 / 별도 지급"]
    sample_rows:
      - ["", "0원", "", "20,000원"]
      - ["", "20,000원 환급", "", ""]

  - type: date_line
    sample_text: 2026 년    9 월   30 일

  - type: sign_line
    labels: ["임대인(관리사무소)", "임차인"]
    sample_names: [한빛오피스텔 관리사무소, 이수현]

  - type: notice
    text: 장기수선충당금 환급 등 세부 항목은 관리규약과 임대차계약 특약사항을 확인한 뒤 정산하십시오.
