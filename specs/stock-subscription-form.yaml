id: stock-subscription-form
title: 주식인수청약서
category: corp
subcategory: startup
tags: [주식인수청약서, 주식청약, 신주인수, 유상증자청약, 주식인수]
summary: 회사가 발행하는 신주를 인수하겠다는 뜻으로 청약자와 인수 주식 수, 납입 금액을 적는 청약서입니다.
usage: >
  회사를 설립하거나 유상증자를 할 때 주식을 인수하려는 사람이 회사에 제출하는 청약서의 일반
  양식입니다. 청약자 정보, 주식의 종류와 인수할 주식 수, 1주당 발행가액과 총 납입 금액,
  납입 기일을 적습니다. 숫자는 주주명부와 정관, 이사회·주주총회 결의 내용과 맞아야 하므로
  제출 전 다시 확인하십시오. 등기 등 후속 절차는 별도 서류가 필요하며, 본 서식은 청약 내용을
  기록하는 틀로 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 회사명과 청약자 정보를 적습니다.
  - 주식의 종류, 인수 주식 수, 1주당 발행가액을 적습니다.
  - 총 납입 금액과 납입 기일, 납입 계좌를 적습니다.
  - 청약일을 적고 청약자가 서명합니다.
faq:
  - q: 청약서를 내면 바로 주주가 되나요?
    a: 청약만으로 끝나지 않고 납입 등 절차가 필요합니다. 정관과 결의 내용을 확인하십시오.
  - q: 총 납입 금액은 어떻게 계산하나요?
    a: 인수 주식 수에 1주당 발행가액을 곱한 금액입니다.
  - q: 법인 명의로도 청약할 수 있나요?
    a: 가능합니다. 청약자란에 법인명과 대표자를 적고 법인 인감 사용 여부는 회사 기준을 확인하십시오.
related: [shareholder-register, board-minutes, shareholder-meeting-minutes, stock-transfer-contract]
