id: business-representative-change-confirmation
title: 영업 대표자 변경 사실 확인서
category: public
subcategory: permit
tags: [대표자변경, 영업대표자변경, 영업신고변경, 대표자교체확인, 영업자지위]
summary: 영업장의 대표자가 바뀐 사실을 변경 전후 대표자 정보와 변경일, 확인인 서명으로 정리하는 확인서입니다.
usage: >
  영업신고나 허가를 받은 사업장에서 대표자가 바뀌었을 때 그 사실을 제출처에 설명해야 하는 경우 쓰는
  서식입니다. 영업장 정보와 변경 전·후 대표자, 변경일과 사유를 적고 양쪽 대표자가 서명합니다.
  변경 신고의 방법과 기한, 필요 서류는 업종과 지자체마다 다르므로 관할 기관 안내를 확인하십시오.
  본 서식은 사실을 정리하는 틀이며 변경 신고서를 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 영업장의 상호와 소재지, 업종을 적습니다.
  - 변경 전 대표자와 변경 후 대표자 정보를 적습니다.
  - 변경일과 변경 사유를 적습니다.
  - 확인 내용을 읽고 두 대표자가 서명합니다.
faq:
  - q: 이 확인서만 내면 변경 신고가 끝나나요?
    a: 아닙니다. 변경 신고는 관할 기관 절차를 따로 밟아야 하니 방법과 기한을 먼저 확인하십시오.
  - q: 변경 전 대표자가 연락되지 않으면요?
    a: 서명을 받기 어려운 사정은 제출처에 문의하십시오. 기관마다 인정하는 방식이 다릅니다.
  - q: 사업자등록도 함께 바꾸나요?
    a: 세무 정정은 별도 절차입니다. 국세청 안내를 확인하십시오.
related: [business-permit-name-change-consent, business-transfer-contract, business-registration-change-poa, permit-application-poa]
blocks:
  - type: doc_title
    text: 영업 대표자 변경 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 영업장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["상호", "", "업종", ""]
      - ["소재지", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "한빛식당", "", "일반음식점"]
      - ["", "서울특별시 예시구 예시로 10", "", ""]
  - type: subtitle
    text: 2. 대표자 변경 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["변경 전 대표자", "", "연락처", ""]
      - ["변경 후 대표자", "", "연락처", ""]
      - ["변경일", "", "변경 사유", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "이수현", "", "010-2345-6789"]
      - ["", "2026-10-15", "", "영업 양수"]
  - type: subtitle
    text: 3. 경위 및 첨부 서류
  - type: textbox
    hint: "대표자가 바뀐 경위와 첨부하는 서류(계약서 등)를 적으십시오."
    height_mm: 28
    sample_text: "영업 양도양수에 따라 대표자가 변경되었으며, 관련 계약서 사본을 첨부합니다."
  - type: para
    text: 위와 같이 영업장의 대표자가 변경되었음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월    2 일
  - type: sign_line
    labels: ["변경 전 대표자", "변경 후 대표자"]
    sample_names: [홍길동, 이수현]
  - type: notice
    text: 변경 신고의 방법과 기한은 관할 기관 안내를 확인하십시오.
