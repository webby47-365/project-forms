id: english-cover-letter
title: 영문 커버레터 (Cover Letter)
category: personal
subcategory: career
tags: [영문 커버레터, cover letter, 영문 자기소개서, 외국계 지원서류, 영문 이력서 첨부]
summary: 지원 직무와 지원 동기·핵심 역량을 영문 서한 형식으로 작성하는 커버레터 양식입니다.
usage: >
  외국계 기업이나 해외 채용에 영문 이력서와 함께 제출하는 서한입니다. 상단에 본인 연락처와
  수신인 정보를 적고 날짜를 넣는 표준 비즈니스 레터 형식을 따르십시오. 첫 문단에서 지원 직무와
  지원 경로를 밝히고, 본문에서는 이력서를 반복하지 말고 직무 요구사항에 맞는 경험 두세 가지를
  결과 중심으로 서술합니다. 마지막 문단에서 면접 기회를 요청하며 마무리하고, 전체 분량은 한 장을
  넘기지 않는 것이 좋습니다. 회사명과 담당자 이름의 철자를 반드시 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 상단에 본인 연락처와 수신인 정보, 날짜를 적습니다.
  - 첫 문단에 지원 직무와 지원 경로를 밝힙니다.
  - 직무와 관련된 경험 두세 가지를 결과 중심으로 적습니다.
  - 면접 기회를 요청하는 문장으로 마무리합니다.

faq:
  - q: 이력서 내용을 그대로 반복해도 되나요?
    a: 반복하지 말고 직무 요구사항에 맞는 핵심 경험 위주로 새롭게 서술하는 것이 좋습니다.
  - q: 분량은 어느 정도가 적당한가요?
    a: 한 장을 넘기지 않는 선에서 간결하게 작성하는 것이 좋습니다.

related: [resume-english, portfolio-cover, recommendation-letter]

blocks:
  - type: doc_title
    text: Cover Letter
    spaced: false
  - type: subtitle
    text: Applicant Information
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["Full Name", "", "Phone", ""]
      - ["Address", "", "", ""]
      - ["Email", "", "LinkedIn / Portfolio", ""]
    sample_rows:
      - ["", "HONG GILDONG", "", "+82 10-1234-5678"]
      - ["", "100 World Cup-ro, Mapo-gu, Seoul", "", ""]
      - ["", "gildong.hong@example.com", "", "linkedin.com/in/gildonghong"]
  - type: subtitle
    text: Recipient
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["Hiring Manager", "", "Company", ""]
      - ["Company Address", "", "", ""]
      - ["Position Applied For", "", "Job Reference No.", ""]
    sample_rows:
      - ["", "Ms. Sarah Lee", "", "Hanbit Commerce Co., Ltd."]
      - ["", "200 Teheran-ro, Gangnam-gu, Seoul", "", ""]
      - ["", "Marketing Specialist", "", "REQ-2026-014"]
  - type: date_line
    text: "Date : 20    /      /      "
    sample_text: "Date : 2026 / 09 / 13"
  - type: subtitle
    text: Letter Body
  - type: para
    text: "Dear ________________________ ,"
    align: left
    size: 10.5
    sample_text: "Dear Ms. Sarah Lee,"
  - type: textbox
    hint: "Opening — State the position you are applying for and how you learned about it."
    height_mm: 24
    sample_text: "I am writing to apply for the Marketing Specialist position at Hanbit Commerce, which I found on your careers page. My background in digital marketing fits this role well."
  - type: textbox
    hint: "Body — Highlight two or three achievements that match the job requirements, with measurable results."
    height_mm: 52
    sample_text: "In my current role at Saegil Data, I led a social media campaign that grew our audience by 40% in three months. I also redesigned our email newsletter, raising open rates from 18% to 27%. These results reflect the data-driven approach I would bring to your team."
  - type: textbox
    hint: "Closing — Express interest in an interview and thank the reader."
    height_mm: 22
    sample_text: "I would welcome the chance to discuss how my experience can support your marketing goals. Thank you for your time and consideration."
  - type: para
    text: "Sincerely,"
    align: left
    size: 10.5
  - type: sign_line
    label: Signature
    sample_names: [HONG GILDONG]
  - type: notice
    text: 회사명과 담당자 이름의 철자를 확인하고, 전체 분량은 A4 한 장을 넘기지 않도록 작성하십시오.
