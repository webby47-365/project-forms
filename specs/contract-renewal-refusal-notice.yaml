  - type: para
    text: 위 계약을 만료일에 끝내고 갱신하지 않겠음을 통지합니다.
  - type: textbox
    hint: "갱신하지 않는 사유를 사실 위주로 간단히 적으십시오."
    height_mm: 26
    sample_text: 내부 사정으로 용역 방식을 변경할 예정이어서 계약 기간 만료 후 갱신하지 않으려 합니다. 그동안의 협조에 감사드립니다.
  - type: para
    text: 정산할 사항이 있으면 만료일 전에 협의하여 주시기 바랍니다.
  - type: date_line
    sample_text: 2026 년   10 월   26 일
  - type: sign_line
    labels: ["통지인"]
    sample_names: [김서연]
  - type: notice
    text: 통지 기한과 거절 사유의 허용 범위는 계약서와 법령에 따라 다릅니다. 계약서의 갱신 조항을 확인하십시오.
