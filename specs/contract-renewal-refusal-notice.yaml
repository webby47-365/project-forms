id: contract-renewal-refusal-notice
title: 계약 갱신 거절 통지서
category: legal
subcategory: notice
tags: [계약갱신 거절, 갱신 거절 통지, 계약 만료 통보, 재계약 불가, 갱신 거절]
summary: 기간이 끝나는 계약을 다시 맺지 않겠다는 뜻을 기한 안에 알리고 기록으로 남기는 계약 갱신 거절 통지서 양식입니다.
usage: >
  용역·임대·공급 등 기간이 정해진 계약을 만료일에 끝내고 다시 맺지 않겠다는 뜻을 상대방에게 알리는 문서입니다.
  계약 이름, 계약 기간, 만료일과 거절 사유를 사실 위주로 적습니다.
  통지 기한과 갱신 거절이 허용되는 사유는 계약서와 법령에 따라 다르므로 보내기 전에 계약서의 갱신 조항을 확인하고,
  중요한 계약은 내용증명으로 보내거나 전문가와 상담하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 보내는 사람과 받는 사람을 적습니다.
  - 계약 이름과 계약 기간, 만료일을 적습니다.
  - 갱신하지 않겠다는 뜻과 사유를 적습니다.
  - 날짜를 쓰고 서명한 뒤 보낸 기록을 남깁니다.
faq:
  - q: 통지는 만료 며칠 전까지 해야 하나요?
    a: 계약서와 법령에 따라 다릅니다. 계약서의 갱신 조항을 확인하고 필요하면 전문가와 상담하십시오.
  - q: 거절 사유는 꼭 적어야 하나요?
    a: 사유가 필요한지는 계약 종류에 따라 다릅니다. 사실 위주로 짧게 적어 두는 편이 나중에 확인하기 좋습니다.
  - q: 이메일로 보내도 되나요?
    a: 계약서에 정한 통지 방법이 있으면 따르십시오. 보낸 날짜와 내용을 증명하려면 내용증명이 도움이 됩니다.
related: [certified-notice, certified-notice-terminate, settlement-agreement, delegation-revocation]
