    size: 12
    bold: true
  - type: notice
    text: 송달받은 날부터 2주 이내에 제출하지 않으면 지급명령이 확정되어 강제집행을 당할 수 있습니다. 제출 전 대한민국 법원 전자소송 사이트에서 최신 양식과 관할을 확인하십시오. 본 서식은 참고용입니다.
