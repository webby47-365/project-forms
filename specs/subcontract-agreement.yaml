      - ["", "주소", "", "연락처", ""]
      - ["수급사업자", "상호(성명)", "", "사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "(주)새길데이터", "", "000-00-00000"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-5678-1234"]
  - type: subtitle
    text: 공사(용역) 개요
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["공사(용역)명", "", "공사(작업)장소", ""]
      - ["공사기간", "", "도급금액", ""]
    sample_rows:
      - ["", "사옥 리모델링 전기설비 공사", "", "서울특별시 마포구 월드컵북로 100"]
      - ["", "2026-10-01 ~ 2026-12-31", "", "금 80,000,000원 (금 팔천만원)"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 원사업자가 수급사업자에게 위 공사(용역)의 시공·수행을 위탁하고, 수급사업자가 이를 수행하는 것을 목적으로 한다."
  - type: article
    heading: 제2조 (계약금액과 대금 지급)
    lines:
      - "원사업자는 수급사업자에게 위 도급금액을 지급하며, 지급 시기·방법과 지급기일은 관련 법령이 정한 기준을 따른다."
      - "대금은 수급사업자가 지정한 계좌로 지급한다."
  - type: article
    heading: 제3조 (선급금)
    lines:
      - "원사업자가 발주자로부터 선급금을 받은 경우, 받은 날로부터 관련 법령이 정한 기간 내에 수급사업자에게 같은 비율의 선급금을 지급한다."
  - type: article
    heading: 제4조 (설계변경과 대금의 조정)
    lines:
      - "설계변경, 공사기간 연장 등으로 하도급대금이 변경되어야 하는 경우 원사업자는 그 사유가 발생한 날로부터 상당한 기간 내에 대금을 조정하여 지급한다."
  - type: page_break
  - type: article
    heading: 제5조 (검수)
    lines:
      - "원사업자는 수급사업자로부터 공사(용역)의 완료를 통지받은 후 정한 기간 내에 검사하고 그 결과를 통지한다."
  - type: article
    heading: 제6조 (하자담보책임)
    lines:
      - "수급사업자는 공사(용역) 결과물이 계약 내용에 적합함을 보증하며, 하자가 발견된 경우 원사업자가 정한 기간 내에 보수한다."
  - type: article
    heading: 제7조 (안전보건)
    lines:
      - "수급사업자는 작업 현장의 안전보건 관계 법령을 준수하고, 원사업자는 산업안전보건법 등에 따른 안전조치에 협조한다."
  - type: article
    heading: 제8조 (부당한 특약의 금지)
    lines:
      - "원사업자는 수급사업자의 이익을 부당하게 침해하는 특약을 정할 수 없으며, 그러한 특약은 효력이 없다."
  - type: article
    heading: 제9조 (지연손해금)
    lines:
      - "원사업자가 대금 지급을 지체하는 경우 지연기간에 대하여 관련 법령이 정한 지연손해금을 가산하여 지급한다."
  - type: article
    heading: 제10조 (분쟁조정)
    lines:
      - "본 계약에 관한 분쟁은 먼저 당사자 간 협의로 해결하며, 협의가 이루어지지 않으면 하도급분쟁조정협의회에 조정을 신청하거나 관할법원에 제기할 수 있다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["원사업자", "수급사업자"]
    sample_names: ["(주)한빛커머스 대표 김서연", "(주)새길데이터 대표 박민준"]
  - type: notice
    text: 하도급거래 공정화에 관한 법률에 따라 원사업자는 계약서를 수급사업자에게 서면으로 발급해야 하며, 대금 지급기일 등 세부 기준이 있으므로 관련 법령과 개별 사안을 확인하십시오.
