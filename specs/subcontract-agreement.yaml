id: subcontract-agreement
title: 하도급 계약서
category: legal
subcategory: contract
tags: [하도급계약서, 하도급법, 원사업자, 수급사업자, 공사대금지급]
summary: 도급금액·대금 지급과 선급금·설계변경·하자담보책임을 정하는 하도급 계약서입니다.
usage: >
  원사업자가 공사나 용역의 일부를 수급사업자에게 다시 위탁할 때 체결하는 계약서입니다.
  공사(용역)명과 장소, 기간, 도급금액을 구체적으로 정하고 대금 지급 시기와 방법을
  명확히 해야 합니다. 하도급거래 공정화에 관한 법률은 원사업자의 서면 계약서 발급 의무와
  대금 지급기일, 부당한 특약의 금지 등을 정하고 있으므로 계약 체결 전에 관련 법령을
  반드시 확인해야 합니다. 설계변경이나 공사기간 연장에 따른 대금 조정 방법도 미리
  정해 두는 것이 좋습니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

howto:
  - 공사(용역)명과 장소, 기간을 정합니다.
  - 도급금액과 대금 지급 시기·방법을 정합니다.
  - 설계변경, 공사기간 연장 시 대금 조정 방법을 정합니다.
  - 하자담보책임 기간을 정하고 서명합니다.

faq:
  - q: 계약서를 반드시 서면으로 발급해야 하나요?
    a: 관련 법률에 따라 원사업자는 수급사업자에게 서면 계약서를 발급할 의무가 있습니다.
  - q: 대금은 언제까지 지급해야 하나요?
    a: 법령에서 정한 지급기일을 확인하고 계약서에도 구체적인 날짜를 명시해야 합니다.

related: [purchase-order, delivery-confirmation, invoice-request, transaction-statement]

