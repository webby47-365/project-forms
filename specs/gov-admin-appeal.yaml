- type: para
  text: 1. 제도개요
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 청구인이 경제적 능력으로 인해 대리인을 선임할 수 없는 경우에는 행정심판위원회에 국선대리인을 선임해 줄 것을 신청할 수 있습니다.
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 21.3
- type: para
  text: 2. 신청자격
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 가. 「국민기초생활 보장법」 제2조제2호에 따른 수급자
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 나. 「한부모가족지원법」 제5조 및 제5조의2에 따른 지원대상자
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 다. 「기초연금법」 제2조제3호에 따른 기초연금 수급자
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 라. 「장애인연금법」 제2조제4호에 따른 수급자
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 마. 「북한이탈주민의 보호 및 정착지원에 관한 법률」 제2조제2호에 따른 보호대상자
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 바. 그 밖에 행정심판위원회의 위원장이 경제적 능력으로 인해 대리인을 선임할 수 없다고 인정하는 사람
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 21.3
- type: para
  text: 3. 신청절차
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 국선대리인의 선임을 신청하려는 청구인은 「행정심판법 시행규칙」 별지 제27호의2서식에 따른 국선대리인 선임 신청서를 제 출해야 하며, 신청자격에 해당하는 사람이라는 사실을 소명하는 서류를 함께 제출해야 합니다.
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 23.3
- type: para
  text: 구술심리 제도 안내
  align: center
  size: 9.0
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 16.1
- type: para
  text: 1. 제도개요
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 행정심판의 심리는 구술심리나 서면심리로 합니다. 다만, 당사자가 구술심리를 신청한 경우에는 서면심리만으로 결정할 수 있 다고 인정되는 경우 외에는 구술심리로 진행합니다.
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 21.3
- type: para
  text: 2. 신청절차
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
- type: spacer
  exact: true
  height_pt: 6.5
- type: para
  text: 당사자가 구술심리를 신청하려면 행정심판위원회에「행정심판법 시행규칙」 별지 제39호서식의 구술심리 신청서를 제출하거나 구술로 신청해야 합니다.
  align: left
  size: 7.2
  space_after: 0
  line_spacing: 1.0
