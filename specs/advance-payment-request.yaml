id: advance-payment-request
title: 선금 지급 신청서
category: public
subcategory: procure
tags: [선금, 선금신청, 선급금, 계약선금, 조달]
summary: 용역·공사·물품 계약을 맺은 계약상대자가 발주처에 계약금액 일부를 먼저 지급해 달라고 요청할 때 쓰는 선금 지급 신청서 양식입니다.
usage: >
  계약을 맺은 뒤 착수 단계에서 필요한 자금을 먼저 받으려는 계약상대자가 발주처에 내는 신청서입니다.
  계약 정보와 신청 금액, 사용 계획, 입금 계좌를 적고 보증서 등 필요한 서류를 붙입니다.
  지급 가능 여부와 비율, 보증 방식은 계약 조건과 발주처 규정에 따라 달라지므로 계약서와 발주처 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 계약명과 계약번호, 계약금액, 계약기간을 적습니다.
  - 선금으로 신청할 금액과 사용 목적을 적습니다.
  - 입금받을 계좌 정보를 적습니다.
  - 보증서 등 첨부 서류를 확인하고 발주처에 냅니다.
faq:
  - q: 신청 금액은 얼마까지 적을 수 있나요?
    a: 계약서와 발주처 규정에서 정한 범위 안에서 적습니다. 비율은 계약마다 다를 수 있으니 확인하십시오.
  - q: 보증서는 꼭 내야 하나요?
    a: 대개 선금 보증을 요구합니다. 필요한 서류와 보증 방식은 계약서와 발주처 안내를 따르십시오.
  - q: 선금은 아무 곳에나 써도 되나요?
    a: 보통 해당 계약 이행에 쓰도록 정해져 있습니다. 사용 범위는 계약 조건을 확인하십시오.
related: [contract-completion-confirmation, contract-period-extension-request, contract-performance-deposit-refund-request, goods-inspection-report]
