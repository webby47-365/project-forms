id: half-day-leave-request
title: 반차·시간단위 연차 신청서
category: corp
subcategory: hr
tags: [반차신청서, 반반차, 시간단위연차, 연차신청서, 반일휴가]
summary: 오전·오후 반차나 시간 단위로 연차를 나눠 쓸 때 일시·사용 시간·업무 대행자를 적는 신청서입니다.
usage: >
  하루 연차 전체가 아니라 반나절 또는 몇 시간만 연차를 쓸 때 제출하는 서식입니다. 사용 날짜와 구분
  (오전 반차·오후 반차·시간 단위)을 고르고, 시작과 종료 시각, 차감될 연차 시간을 적습니다. 자리를
  비우는 동안 급한 업무를 맡을 사람도 함께 적어 두면 승인이 빨라집니다. 반차·시간 단위 사용 가능
  여부와 차감 기준은 회사 취업규칙에 따르므로 제출 전에 인사 담당자에게 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신청자 이름과 소속, 연락처를 적습니다.
  - 사용 날짜와 구분(오전·오후·시간 단위)을 고릅니다.
  - 시작·종료 시각과 차감되는 연차 시간을 적습니다.
  - 업무 대행자를 적고 신청인이 서명합니다.
faq:
  - q: 반차는 연차 몇 시간으로 계산하나요?
    a: 회사 기준에 따라 다릅니다. 보통 하루 8시간의 절반을 쓰지만 취업규칙을 확인하십시오.
  - q: 시간 단위 연차는 누구나 쓸 수 있나요?
    a: 회사가 허용하는 경우에 쓸 수 있습니다. 허용 단위와 최소 시간은 인사 담당자에게 문의하십시오.
  - q: 당일 아침에 신청해도 되나요?
    a: 회사 규정에 따라 다릅니다. 급한 경우 구두로 먼저 알리고 이 서식을 사후 제출하는 곳도 있습니다.
related: [leave-request, annual-leave-plan, unused-annual-leave-pay-request, handover-report]
blocks:
  - type: doc_title
    text: 반차·시간단위 연차 신청서
    spaced: false
  - type: subtitle
    text: 1. 신청인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "소속·직위", ""]
      - ["연락처", "", "신청일", ""]
    sample_rows:
      - ["", "홍길동", "", "경영지원팀 대리"]
      - ["", "010-1234-5678", "", "2026-10-09"]
  - type: subtitle
    text: 2. 사용 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [3, 1, 3, 3]
    rows:
      - ["사용 날짜", "", "구분", ""]
      - ["시작 시각", "", "종료 시각", ""]
      - ["차감 연차", "", "잔여 연차", ""]
      - ["사유", "", "", ""]
    sample_rows:
      - ["", "2026-10-13", "", "오후 반차"]
      - ["", "14:00", "", "18:00"]
      - ["", "4시간", "", "9일 4시간"]
      - ["", "병원 방문", "", ""]
  - type: subtitle
    text: 3. 업무 대행
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["대행자", "", "연락 방법", ""]
