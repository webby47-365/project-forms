    hint: "자리를 비우는 동안 처리할 업무와 급한 연락 시 안내사항을 적으십시오."
    height_mm: 24
    sample_text: "오후에 접수되는 거래처 문의는 김서연 님이 받아 주시고, 긴급 건은 휴대전화로 연락 바랍니다."
  - type: para
    text: 위와 같이 연차휴가 사용을 신청합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월    9 일
  - type: sign_line
    labels: ["신청인", "부서장 확인"]
    sample_names: [홍길동, 박민준]
  - type: notice
    text: 반차·시간 단위 사용 기준은 회사 취업규칙을 확인하십시오.
