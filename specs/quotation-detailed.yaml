id: quotation-detailed
title: 견적서 (상세형)
category: corp
subcategory: finance
tags: [견적서, 상세견적서, 사업자견적서, 견적내역서, estimate]
summary: 공급자 사업자정보와 수신처, 품목별 세액까지 모두 기재하는 상세형 견적서입니다.
usage: >
  금액이 크거나 공식 거래처 검토가 필요한 견적에 사용하는 상세형 견적서입니다. 공급자의
  사업자등록번호·업태·종목까지 모두 밝히고 품목별로 공급가액과 세액을 구분해 기재합니다.
  유효기간·납기일·결제조건을 명확히 표기해야 추후 분쟁을 막을 수 있고, 발행 전 담당자와
  대표자 결재를 거쳐 직인을 날인한 뒤 송부하십시오.
source: original
featured: false
target_pages: 2
series: quotation
series_name: 견적서
variant: 상세형
variant_rank: 3
version: 1
created_by: agent
status: published
variant_use: 금액이 크거나 정식 거래처 검토가 필요할 때 씁니다.

howto:
  - 공급자의 사업자등록번호와 업태·종목을 적습니다.
  - 수신처와 견적 유효기간, 납기일을 기재합니다.
  - 품목별 수량과 단가, 공급가액·세액을 구분해 적습니다.
  - 합계금액과 결제조건을 확인합니다.
  - 담당자와 대표자 결재 후 직인을 찍어 송부합니다.

faq:
  - q: 세액은 어떻게 계산하나요?
    a: 공급가액의 10%를 부가세로 별도 표기하는 것이 일반적입니다.
  - q: 유효기간은 꼭 적어야 하나요?
    a: 가격 변동으로 인한 분쟁을 막기 위해 유효기간을 명시하는 것이 안전합니다.

