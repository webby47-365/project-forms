    align: center
    size: 10.5

  - type: subtitle
    text: 1. 위임인 (사업자)

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["상호(성명)", "", "대표자", ""]
      - ["사업장 주소", "", "", ""]
      - ["연락처", "", "사업자등록번호", ""]
    sample_rows:
