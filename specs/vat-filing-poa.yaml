id: vat-filing-poa
title: 부가가치세 신고 위임장
category: public
subcategory: tax
tags: [부가가치세신고위임장, 부가세신고위임장, 세무대리위임장, 부가세위임장, 세무사위임장]
summary: 부가가치세 신고를 세무대리인에게 맡길 때 사업자 정보와 위임 범위·과세기간을 적는 위임장입니다.
usage: >
  사업자가 부가가치세 신고서 작성과 홈택스 전자신고를 세무대리인(세무사)에게 맡길 때 쓰는
  서류입니다. 부가가치세는 과세기간(1·2기)마다 신고해야 하므로, 위임장에 신고 대상
  과세기간을 명확히 적어야 세무대리인이 해당 기간의 신고만 대리하는지 계속 대리하는지
  구분할 수 있습니다. 위임 기간을 정해 두면 신고가 끝난 뒤 불필요하게 권한이 남는 것을
  막을 수 있습니다.
source: original
featured: false
target_pages: 1

howto:
  - 위임인(사업자)의 인적사항과 사업자등록번호를 적습니다.
  - 세무대리인의 사무소명과 세무사등록번호를 적습니다.
  - 신고 대상 과세기간과 위임 범위를 적습니다.
  - 위임 기간을 정하고 서명 또는 날인합니다.

faq:
  - q: 홈택스 전자신고 권한도 위임할 수 있나요?
    a: 위임 범위에 홈택스 전자신고와 세금계산서 자료 열람을 함께 적으면 위임할 수 있습니다.
  - q: 매 과세기간마다 새로 작성해야 하나요?
    a: 위임 기간을 특정 기간으로 한정했다면 다음 과세기간부터는 다시 작성하는 것이 안전합니다.
  - q: 종합소득세 위임장과 같이 써도 되나요?
    a: 세목이 달라 별도 문서로 작성하는 것이 원칙이나, 같은 세무대리인이면 함께 전달해도 됩니다.

related: [income-tax-filing-poa, vat-filing-document-confirmation, power-of-attorney]

blocks:
