id: afterschool-program-application
title: 방과후학교 수강 신청서
category: edu
subcategory: school
tags: [방과후학교, 방과후신청, 방과후수강, 특기적성, 학부모신청]
summary: 학생이 듣고 싶은 방과후 프로그램과 귀가 방법을 적어 학교에 내는 방과후학교 수강 신청서 양식입니다.
usage: >
  학기 초 방과후학교 프로그램을 신청할 때 학교에 제출하는 서식입니다. 학생 정보, 희망 프로그램을
  우선순위대로, 수업 후 귀가 방법과 비상 연락처를 적고 학부모가 서명합니다. 프로그램 정원과 수강료,
  신청 기간은 학교마다 다르므로 가정통신문을 함께 확인하십시오. 알레르기나 질병 같은 건강 정보는
  꼭 필요한 경우에만 학교 안내에 따라 별도로 전달하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 학년·반·번호와 학생 이름을 적습니다.
  - 희망 프로그램을 1순위부터 적습니다.
  - 수업 후 귀가 방법과 비상 연락처를 적습니다.
  - 학부모가 서명해 신청 기한까지 냅니다.
faq:
  - q: 희망 프로그램을 여러 개 적어도 되나요?
    a: 정원이 차면 다음 순위로 배정되므로 순위를 매겨 적는 편이 좋습니다. 가능 개수는 학교 안내를 따르십시오.
  - q: 수강료는 어떻게 내나요?
    a: 학교마다 납부 방식이 다릅니다. 가정통신문의 안내를 확인하십시오.
related: [student-absence-notice, field-trip-consent, minor-activity-consent, tuition-refund-request]
blocks:
  - type: doc_title
    text: 방과후학교 수강 신청서
    spaced: false
  - type: subtitle
    text: 1. 학생 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["학교", "", "학년·반·번호", ""]
      - ["학생 이름", "", "보호자 이름", ""]
      - ["보호자 연락처", "", "비상 연락처", ""]
    sample_rows:
      - ["", "한빛초등학교", "", "3학년 2반 14번"]
      - ["", "김서연", "", "이수현"]
      - ["", "010-1234-5678", "", "010-9876-5432"]
