    row_height_mm: 9
    rows:
      - ["귀가 방법", "", "인수 보호자", ""]
      - ["전달 사항", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "도보 귀가", "", "해당 없음"]
      - ["", "수업 종료 후 바로 귀가합니다.", "", ""]
  - type: para
    text: 위와 같이 방과후학교 수강을 신청합니다.
    align: center
  - type: date_line
