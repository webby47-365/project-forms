      - ["2", "미술 놀이", "수 14:30", ""]
      - ["3", "축구 교실", "금 14:30", ""]
  - type: subtitle
    text: 3. 수업 후 귀가 방법
  - type: grid
    widths: [20, 30, 20, 30]
