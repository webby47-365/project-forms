id: portrait-rights-consent
title: 초상권 이용 동의서
category: public
subcategory: consent
tags: [초상권, 동의서, 사진, 촬영, 이용 허가]
summary: 촬영·기록된 사진이나 영상의 사용 목적, 매체, 기간, 편집 범위를 명시하고 초상권 사용을 승인하는 동의서입니다.
usage: >
  방송국, 신문사, SNS, 마케팅, 학교, 행사 등에서 사람의 사진·영상을 촬영하거나 게시할 때 법적 분쟁을 피하기 위해 미리 동의를 받는 양식입니다.
  촬영 목적과 사용 범위(온라인·오프라인), 사용 기간(언제까지 사용 가능한지)을 명확히 기재해야 합니다.
  미성년자의 경우 반드시 법정대리인(부모) 동의를 별도로 받아야 합니다.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 초상권 이용 동의서
    spaced: false
  - type: spacer
    height_pt: 4
  - type: subtitle
    text: 피촬영자(초상권자) 정보
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "이메일", ""]
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 촬영·이용 내용
  - type: table
    widths: [25, 75]
    header: ["항목", "내용"]
    empty_rows: 0
    row_height_mm: 9
    body_align: left
  - type: table
    widths: [30, 70]
    header: ["구분", "상세내용"]
    empty_rows: 0
    row_height_mm: 8
    body_align: left
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 동의 범위
  - type: table
    widths: [50, 25, 25]
    header: ["사용 범위·매체", "동의", "미동의"]
    empty_rows: 0
    row_height_mm: 8
    body_align: left
  - type: table
    widths: [50, 25, 25]
    header: ["편집 허용 범위", "가능", "불가능"]
    empty_rows: 0
    row_height_mm: 8
    body_align: left
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 사용기간
  - type: grid
    widths: [30, 70]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["사용 시작일", ""]
      - ["사용 종료일", ""]
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 법정대리인 동의 (미성년자인 경우)
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "관계", ""]
      - ["연락처", "", "동의여부", ""]
  - type: spacer
    height_pt: 4
  - type: para
    text: "본인(또는 법정대리인)은 위의 초상권 이용에 동의합니다."
    align: center
    size: 11
    space_after: 2
  - type: date_line
  - type: spacer
    height_pt: 2
  - type: sign_line
    labels: ["피촬영자", "법정대리인(미성년자)"]
  - type: notice
    text: 촬영·이용 내용 변경 시 사전 동의를 다시 받아야 하며, 미성년자는 부모 또는 법정대리인 동의가 필수입니다.
