id: portrait-rights-consent
title: 초상권 이용 동의서
category: public
subcategory: consent
tags: [초상권, 동의서, 사진, 촬영, 이용 허가]
summary: 촬영·기록된 사진이나 영상의 사용 목적, 매체, 기간, 편집 범위를 명시하고 초상권 사용을 승인하는 동의서입니다.
usage: >
  방송국, 신문사, SNS, 마케팅, 학교, 행사 등에서 사람의 사진·영상을 촬영하거나 게시할 때 법적 분쟁을 피하기 위해 미리 동의를 받는 양식입니다.
  촬영 목적과 사용 범위(온라인·오프라인), 사용 기간(언제까지 사용 가능한지)을 명확히 기재해야 합니다.
  미성년자의 경우 반드시 법정대리인(부모) 동의를 별도로 받아야 합니다.
source: original
featured: false
target_pages: 2

howto:
  - 촬영 대상자의 성명과 연락처를 적습니다.
  - 촬영 목적과 사용 매체를 적습니다.
  - 사용 기간과 편집 범위를 적습니다.
  - 미성년자면 법정대리인 동의를 받습니다.
  - 동의 여부를 표시하고 서명합니다.

faq:
  - q: 미성년자는 본인 서명만으로 되나요?
    a: 아니요, 법정대리인인 부모의 동의를 별도로 받아야 합니다.
  - q: 동의 기간이 끝나면 어떻게 되나요?
    a: 정해진 사용 기간이 지나면 재동의를 받거나 사용을 중단해야 합니다.

related: [event-photo-consent, privacy-consent, guardian-consent, minor-activity-consent]

