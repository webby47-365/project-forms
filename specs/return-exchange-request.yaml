id: return-exchange-request
title: 반품·교환 신청서
category: corp
subcategory: sales
tags: [반품신청서, 교환신청서, 반품교환신청서, 반품처리서, 교환처리서]
summary: 고객이 구매한 물품의 반품·교환 사유와 처리 방법을 기록하는 신청서 양식입니다.
usage: >
  거래처나 고객이 납품받은 물품을 반품·교환할 때 사유와 수량, 처리 방법을 남기기 위해
  사용합니다. 단순 변심인지 불량·파손인지에 따라 처리 방법과 비용 부담이 달라지므로
  사유를 구체적으로 적고 증빙 사진이나 검수 결과를 첨부하는 편이 좋습니다. 환불 계좌는
  구매자 명의와 일치하는지 확인한 뒤 기재하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 신청일자와 신청인, 원래 구매일자를 적습니다.
  - 반품·교환 대상 품목과 수량을 적습니다.
  - 반품·교환 사유를 선택하고 상세 내용을 적습니다.
  - 처리 방법(환불·교환·수리)과 환불 계좌를 적습니다.

faq:
  - q: 단순 변심도 반품이 되나요?
    a: 판매자 정책에 따라 다르며, 상품 상태와 반품 가능 기한을 먼저 확인해야 합니다.
  - q: 배송비는 누가 부담하나요?
    a: 불량·오배송은 판매자가, 단순 변심은 통상 구매자가 부담하며 사전에 정한 정책을 따릅니다.

related: [delivery-confirmation, complaint-handling, transaction-statement, payment-confirmation]

blocks:
  - type: doc_title
    text: 반품·교환 신청서
    spaced: false

  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["신청일자", "", "신청인", "", "연락처", ""]
    sample_rows:
      - ["", "2026-09-14", "", "이수현", "", "010-2345-6789"]

  - type: subtitle
    text: 1. 구매 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["구매일자", "", "주문번호", ""]
      - ["구매처", "", "결제수단", ""]
    sample_rows:
      - ["", "2026-09-05", "", "ORD-20260905-013"]
      - ["", "(주)한빛커머스", "", "카드"]

  - type: subtitle
    text: 2. 반품·교환 대상 품목

  - type: table
    widths: [26, 14, 12, 18, 30]
    header: [품목명, 수량, 단가, 구분(반품/교환), 사유]
    empty_rows: 4
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["무선 마우스 M120", "2", "15,000원", "반품", "포장 파손 상태로 수령"]
      - ["USB 허브 4포트", "1", "22,000원", "교환", "동일 상품 정상품으로 교환 요청"]

  - type: subtitle
    text: 3. 처리 요청 사항

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["처리 방법", "환불 / 교환 / 수리", "환불 은행·계좌", ""]
      - ["예금주", "", "구매자와 일치 여부", ""]
    sample_rows:
      - ["", "", "", "한빛은행 000-000000-00-000"]
      - ["", "이수현", "", "일치"]

  - type: textbox
    hint: "반품·교환 사유와 상품 상태를 상세히 적고, 필요하면 사진 첨부 여부를 함께 기재하십시오."
    height_mm: 26
    sample_text: 수령한 USB 허브 4포트 제품이 전원이 인식되지 않아 정상 작동하는 동일 상품으로 교환을 요청합니다. 파손 부위 사진을 별도로 첨부합니다.

  - type: date_line
    sample_text: 2026 년    9 월    14 일

  - type: sign_line
    label: 신청인

  - type: notice
    text: 환불 계좌는 반드시 구매자 명의와 일치하는지 확인한 뒤 기재하십시오. 반품·교환 가능 기한과 배송비 부담 기준은 판매자 정책을 따릅니다.
