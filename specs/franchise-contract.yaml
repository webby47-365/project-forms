id: franchise-contract
title: 가맹계약서
category: legal
subcategory: contract
tags: [가맹계약서, 프랜차이즈계약, 가맹점계약서, 가맹금, 가맹사업]
summary: 영업표지 사용·영업지역·가맹금·교육지원과 계약기간·해지를 정하는 가맹계약서입니다.
usage: >
  가맹본부(갑)가 가맹점사업자(을)에게 브랜드와 영업시스템을 사용하도록 허락하고 가맹점을
  운영하게 할 때 체결하는 계약서입니다. 영업지역과 가입비·보증금·로열티 등 가맹금의 구성,
  교육과 지원 내용, 상품 공급 방식을 구체적으로 정해야 합니다. 가맹계약은 체결 전에
  가맹사업법에 따라 가맹본부가 정보공개서를 제공해야 하는 등 별도의 절차가 있으므로
  계약 전에 관련 법령을 반드시 확인해야 합니다. 본 서식은 참고용이며 법적 효력은
  사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

howto:
  - 가맹본부와 가맹점사업자 정보를 적고 영업지역을 정합니다.
  - 가입비·보증금·로열티 등 가맹금 구성을 정합니다.
  - 교육과 지원 내용, 상품 공급 방식을 정합니다.
  - 계약기간과 해지 조건을 확인하고 서명합니다.

faq:
  - q: 계약 전에 꼭 확인할 게 있나요?
    a: 가맹사업법에 따라 가맹본부가 정보공개서를 미리 제공해야 하니 계약 전에 확인하십시오.
  - q: 이 서식만으로 계약해도 되나요?
    a: 본 서식은 참고용이므로 법적 효력과 세부 조건은 이용자가 직접 확인해야 합니다.

blocks:
  - type: doc_title
    text: 가맹계약서
  - type: para
    text: 갑(가맹본부)과 을(가맹점사업자)은 다음과 같이 가맹계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["갑(가맹본부)", "상호(성명)", "", "사업자번호", ""]
      - ["", "주소", "", "연락처", ""]
      - ["을(가맹점사업자)", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "홍길동", "", "000-00-00000"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-9876-5432"]
  - type: subtitle
    text: 가맹점 개요
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["가맹점명", "", "영업표지(브랜드)", ""]
      - ["영업소재지", "", "영업지역", ""]
      - ["계약기간", "", "개점예정일", ""]
    sample_rows:
      - ["", "한빛커머스 마포점", "", "한빛커머스"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "마포구 일대 반경 1km"]
      - ["", "2026-11-01 ~ 2031-10-31 (5년)", "", "2026-11-01"]
  - type: subtitle
    text: 가맹금
  - type: table
    widths: [22, 26, 26, 26]
    header: [구분, 금액, 납부시기, 비고]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["가입비", "10,000,000원", "계약체결 시", "반환 불가"]
      - ["보증금", "5,000,000원", "계약체결 시", "계약종료 시 정산 후 반환"]
      - ["로열티", "매출액의 3% (월 최저 300,000원)", "매월 말 정산", "-"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 갑이 을에게 위 영업표지와 영업시스템을 사용하여 가맹점을 운영하도록 허락하고, 을이 그 대가로 가맹금을 지급하는 것을 목적으로 한다."
  - type: article
    heading: 제2조 (영업표지의 사용)
    lines:
      - "을은 갑이 정하는 기준에 따라 위 영업표지와 상호, 디자인을 사용하며, 갑의 사전 동의 없이 이를 변경할 수 없다."
  - type: article
    heading: 제3조 (영업지역)
    lines:
      - "갑은 계약기간 중 정당한 사유 없이 을의 영업지역 안에 동일한 영업표지를 사용하는 가맹점을 추가로 설치하지 아니한다."
  - type: article
    heading: 제4조 (가맹금)
    lines:
      - "을은 위 가맹금(가입비, 보증금, 로열티)을 위 표에 정한 시기와 방법으로 갑에게 지급한다."
      - "보증금은 계약 종료 시 을의 미지급 채무를 정산한 후 잔액을 반환한다."
  - type: article
    heading: 제5조 (교육과 지원)
    lines:
      - "갑은 을과 종업원에게 개점 전 운영 교육을 실시하고, 계약기간 중 정기적으로 경영·판촉 지원을 제공한다."
  - type: article
    heading: 제6조 (상품 공급)
    lines:
      - "갑은 을에게 가맹사업에 필요한 상품과 원재료를 공급하며, 공급가격과 거래조건은 별도 공급계약에 따른다."
  - type: page_break
  - type: article
    heading: 제7조 (가맹점 준수사항)
    lines:
      - "을은 갑이 정한 운영 매뉴얼과 품질 기준을 준수하며, 가맹본부의 명예와 신용을 훼손하는 행위를 하지 아니한다."
      - "을은 갑의 사전 동의 없이 영업표지를 이용한 다른 사업을 겸영하지 아니한다."
  - type: article
    heading: 제8조 (계약기간과 갱신)
    lines:
      - "계약기간은 위 계약기간에 따르며, 을이 기간 만료 전 갱신을 요구하는 경우 관련 법령이 정한 절차에 따라 갱신 여부를 정한다."
  - type: article
    heading: 제9조 (계약의 해지)
    lines:
      - "을이 가맹금을 지급하지 않거나 운영 매뉴얼을 중대하게 위반한 경우 갑은 상당한 기간을 정하여 시정을 요구한 후 계약을 해지할 수 있다."
  - type: article
    heading: 제10조 (계약 종료 후의 의무)
    lines:
      - "계약이 종료된 경우 을은 영업표지의 사용을 중단하고 간판 등 표시물을 철거하며, 갑으로부터 제공받은 자료를 반환한다."
  - type: article
    heading: 제11조 (분쟁 해결)
    lines:
      - "본 계약에 관한 분쟁은 먼저 당사자 간 협의로 해결하도록 하며, 협의가 이루어지지 않으면 갑의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["갑(가맹본부)", "을(가맹점사업자)"]
    sample_names: ["(주)한빛커머스 대표 김서연", "홍길동"]
  - type: notice
    text: 가맹사업거래의 공정화에 관한 법률에 따라 가맹본부는 가맹계약 체결일로부터 일정 기간 전에 가맹점사업자에게 정보공개서를 제공해야 합니다. 계약 전 관련 법령과 개별 사안을 확인하십시오.
