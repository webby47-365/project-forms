id: annual-leave-promotion-notice
title: 연차 사용 촉진 통지서 (1차)
category: corp
subcategory: hr
tags: [연차촉진통지서, 연차사용촉진, 미사용연차, 연차수당, 연차소멸, 1차촉진]
summary: 근로자별 미사용 연차 일수를 알리고 사용 시기를 정해 알려 달라고 서면으로 촉구하는 1차 통지서입니다.
usage: >
  연차휴가 사용 기간이 끝나기 전에 회사가 근로자에게 남은 연차 일수를 알리고 사용 시기를
  정해 회신해 달라고 요청할 때 쓰는 통지서입니다. 근로자별로 발생 일수, 사용 일수, 미사용
  일수를 적고 회신 기한을 정해 한 장씩 교부합니다. 통지 날짜와 받은 사람의 서명을 남겨 두어야
  나중에 통지 사실을 보여 줄 수 있습니다. 통지 시기와 방식은 근로기준법과 고용노동부 안내를 확인하십시오.
source: law-standard
source_note: 근로기준법 제61조(연차 유급휴가의 사용 촉진)
featured: false
target_pages: 1
series: annual-leave-promotion
series_name: 연차 사용 촉진 통지서
variant: 1차 촉구
variant_rank: 1
variant_use: 미사용 연차를 알리고 사용 시기를 회신받을 때 씁니다.

howto:
  - 근로자의 부서·직위·성명과 연차 발생 기간을 적습니다.
  - 발생·사용·미사용 연차 일수를 적습니다.
  - 근로자가 사용 시기를 회신할 기한을 적습니다.
  - 통지일과 회사 대표 이름을 적고 근로자에게 교부해 수령 서명을 받습니다.

faq:
  - q: 모든 근로자에게 같은 통지서를 돌려도 되나요?
    a: 일수가 근로자마다 다르므로 근로자별로 따로 작성해 교부하는 것이 안전합니다.
  - q: 근로자가 서명을 거부하면 어떻게 하나요?
    a: 교부한 날짜와 방법을 기록하고, 이메일 등 전달 기록을 함께 보관하십시오.
  - q: 통지 시기는 언제인가요?
    a: 사용 기간 만료 전의 법정 시기가 정해져 있으므로 근로기준법과 고용노동부 안내를 확인하십시오.

related: [annual-leave-plan, leave-request, employee-roster, severance-calculation]

blocks:
  - type: doc_title
    text: 연차 사용 촉진 통지서 (1차)
    spaced: false

  - type: subtitle
    text: 1. 대상 근로자

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["부서(팀)", "", "직위", ""]
      - ["성명", "", "입사일", ""]
      - ["연차 사용기간", "", "", ""]
    merges:
      - [2, 1, 2, 3]
    sample_rows:
      - ["", "영업지원팀", "", "대리"]
      - ["", "홍길동", "", "2022-03-02"]
      - ["", "2026-03-02 ~ 2027-03-01", "", ""]

  - type: subtitle
    text: 2. 연차휴가 현황

  - type: table
    widths: [25, 25, 25, 25]
    header: [발생 일수, 사용 일수, 미사용 일수, 회신 기한]
    empty_rows: 1
    row_height_mm: 10
    sample_rows:
      - ["15일", "4일", "11일", "2026-10-30"]

  - type: subtitle
    text: 3. 통지 내용

  - type: textbox
    hint: "남은 연차의 사용 시기를 정해 회신 기한까지 회사에 알려 주십시오."
    height_mm: 24
    sample_text: "귀하의 미사용 연차휴가는 위 표와 같습니다. 회신 기한까지 사용 시기를 정하여 서면(이메일 포함)으로 알려 주시기 바랍니다."

  - type: date_line
    sample_text: 2026 년   10 월   16 일

  - type: sign_line
    labels: ["회사 대표", "수령 근로자"]
    sample_names: [김서연, 홍길동]

  - type: notice
    text: 통지 시기와 방식은 근로기준법과 고용노동부 안내를 확인하십시오. 통지서 사본을 보관하십시오.
