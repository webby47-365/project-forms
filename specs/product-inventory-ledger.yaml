id: product-inventory-ledger
title: 상품수불부
category: corp
subcategory: finance
tags: [상품수불부, 재고수불부, 입출고대장, 재고관리, 상품재고, inventory-ledger]
summary: 상품별로 입고·출고 수량과 재고를 일자순으로 기록하는 상품수불부 양식입니다.
usage: >
  상품을 사들여 보관하고 판매하는 사업장에서 상품별 입고·출고·재고 수량을 일자순으로
  기록하는 장부입니다. 상품명과 규격, 전기이월 수량을 먼저 적고, 거래가 있을 때마다
  입고 또는 출고 수량을 적은 뒤 잔량을 바로 갱신합니다. 거래처와 증빙번호를 함께
  남기면 나중에 확인하기 쉽습니다. 월말에는 합계를 계산해 실제 재고와 맞는지
  확인하고 담당자와 책임자가 서명합니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
from_request: true
howto:
  - 상품명, 규격, 단위, 관리 기간과 전기이월 수량을 적습니다.
  - 입고나 출고가 생길 때마다 날짜순으로 한 줄씩 적습니다.
  - 거래처와 증빙번호를 적어 근거를 남깁니다.
  - 거래마다 잔량을 바로 갱신합니다.
  - 월말에 합계를 내고 실제 재고와 맞는지 확인한 뒤 서명합니다.
faq:
  - q: 상품이 여러 개면 장부를 따로 쓰나요?
    a: 상품별로 한 장씩 쓰는 것이 확인하기 편합니다. 종류가 많으면 상품마다 따로 출력해 사용하십시오.
  - q: 장부 잔량과 실제 재고가 다르면 어떻게 하나요?
    a: 거래 순서대로 누락이나 계산 오류를 다시 확인하고, 차이와 사유를 비고란에 남기십시오.
related: [purchase-order, transaction-statement, asset-ledger, delivery-confirmation]
