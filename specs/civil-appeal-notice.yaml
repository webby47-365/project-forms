id: civil-appeal-notice
title: 항소장 (민사)
category: legal
subcategory: litigation
tags: [항소장, 민사항소, 항소제기, 1심판결불복, 항소장양식]
summary: 민사 1심 판결에 불복해 항소심 법원에 항소를 제기할 때 사건 표시와 불복 범위, 항소 취지를 적는 항소장 양식입니다.
usage: >
  1심 판결에 불복해 항소할 때 1심 법원에 내는 서류의 틀입니다. 1심 사건번호와 당사자, 판결 선고일, 불복 범위를 적고
  항소의 취지를 씁니다. 항소 기간은 판결서를 송달받은 날부터 정해져 있고 놓치면 판결이 확정될 수 있으므로,
  기간과 인지·송달료 등 제출 요건은 반드시 법원 안내를 확인하십시오. 항소 이유는 따로 준비서면으로 낼 수 있습니다.
source: original
featured: false
target_pages: 1
howto:
  - 1심 법원과 사건번호, 사건명을 판결문대로 적습니다.
  - 항소인과 피항소인의 이름과 주소를 적습니다.
  - 판결 선고일과 판결서를 받은 날을 적습니다.
  - 1심 판결 중 불복하는 범위와 항소 취지를 적고 서명합니다.
faq:
  - q: 항소 이유도 항소장에 꼭 써야 하나요?
    a: 항소장에는 항소 취지를 적고, 이유는 따로 준비서면으로 낼 수 있습니다. 법원 안내를 확인하십시오.
  - q: 항소장은 어디에 내나요?
    a: 일반적으로 1심 판결을 한 법원에 냅니다. 접수 방법은 해당 법원 안내를 확인하십시오.
  - q: 항소 기간은 언제까지인가요?
    a: 기간은 판결서를 송달받은 날을 기준으로 정해집니다. 놓치지 않도록 법원이나 법률구조기관에 확인하십시오.
related: [preparatory-brief, evidence-submission-list, service-address-change-report, power-of-attorney]
blocks:
  - type: doc_title
    text: 항 소 장
    spaced: true
  - type: subtitle
    text: 1. 사건의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["1심 법원", "", "사건번호", ""]
      - ["사건명", "", "판결 선고일", ""]
      - ["판결서 송달일", "", "", ""]
    sample_rows:
      - ["", "서울중앙지방법원", "", "2026가소123456"]
      - ["", "물품대금", "", "2026-09-24"]
      - ["", "2026-09-30", "", ""]
  - type: subtitle
    text: 2. 당사자
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["항소인", "", "연락처", ""]
      - ["주소", "", "", ""]
