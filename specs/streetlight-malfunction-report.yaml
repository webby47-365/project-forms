id: streetlight-malfunction-report
title: 가로등 고장 신고서
category: public
subcategory: civil
tags: [가로등고장, 가로등신고, 보안등, 민원신고, 시설물수리]
summary: 길가의 가로등이 꺼지거나 깜빡일 때 위치와 증상을 정리해 관할 기관에 수리를 요청하는 가로등 고장 신고서 양식입니다.
usage: >
  밤길이 어두워 위험하거나 가로등이 계속 깜빡일 때 관할 기관에 알리는 서식입니다.
  고장 위치는 도로명과 가까운 건물, 전봇대 번호(있으면)를 함께 적어야 현장 확인이 빠릅니다.
  고장이 보이기 시작한 날과 증상, 위험한 점을 적고 가능하면 사진을 붙입니다. 가로등은 관리 주체가 달라 지자체 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신고자의 성명과 연락처를 적습니다.
  - 고장 난 가로등의 위치를 도로명과 주변 건물로 적습니다.
  - 증상과 처음 발견한 날, 위험한 점을 적습니다.
  - 사진을 붙여 관할 기관에 냅니다.
faq:
  - q: 어디에 신고하나요?
    a: 공공 도로 가로등은 보통 시·군·구청이 관리합니다. 아파트 단지 안이나 사유지는 관리사무소가 맡습니다.
  - q: 전봇대 번호를 꼭 적어야 하나요?
    a: 필수는 아닙니다. 번호가 있으면 위치 확인이 훨씬 빨라 적어 두면 좋습니다.
  - q: 처리 결과를 받을 수 있나요?
    a: 연락처를 적으면 처리 결과를 안내받을 수 있는 경우가 많습니다. 기관별 방식은 다릅니다.
related: [road-repair-request, noise-complaint, civil-petition, illegal-dumping-report]
blocks:
  - type: doc_title
    text: 가로등 고장 신고서
    spaced: false
  - type: subtitle
    text: 1. 신고자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["회신 방법", "", "신고일", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "문자 회신", "", "2026-11-16"]
  - type: subtitle
    text: 2. 고장 위치와 증상
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [1, 1, 1, 3]
    rows:
      - ["도로명 주소", "", "", ""]
      - ["주변 건물", "", "", ""]
      - ["전봇대 번호", "", "고장 개수", ""]
      - ["증상", "", "처음 발견일", ""]
    sample_rows:
      - ["", "서울시 마포구 예시로 10 앞", "", ""]
      - ["", "예시빌딩 옆 골목 입구", "", ""]
      - ["", "12-345", "", "2개"]
      - ["", "꺼짐", "", "2026-11-10"]
  - type: textbox
    hint: "밤길에 위험한 점(어린이 통학로, 급커브 등)과 추가로 알릴 내용을 적으십시오."
    height_mm: 30
    sample_text: "초등학교 통학로여서 저녁 시간에 보행자가 많고, 가로등 두 개가 연달아 꺼져 골목 전체가 어둡습니다."
  - type: textbox
    hint: "현장 사진을 붙이는 칸입니다. 위치와 고장 상태가 보이게 찍으십시오."
    height_mm: 45
  - type: date_line
    sample_text: 2026 년   11 월   16 일
  - type: sign_line
    labels: ["신고자"]
    sample_names: [홍길동]
  - type: notice
    text: 가로등 관리 주체는 지역마다 다르므로 관할 기관 안내를 확인하십시오.
