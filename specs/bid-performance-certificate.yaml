id: bid-performance-certificate
title: 실적증명서 (입찰용)
category: public
subcategory: procure
tags: [실적증명서, 계약이행실적, 입찰참가서류, 수행실적증명, 조달실적증명]
summary: 공공입찰 참가 시 과거 계약을 정상적으로 이행했음을 발주기관이 확인해 주는 실적증명서입니다.
usage: >
  공공기관·공기업 입찰에 참가할 때 최근 몇 년간 유사한 계약을 이행한 실적이 있는지
  증명하기 위해 제출하는 서류입니다. 계약을 발주했던 기관(수요기관)이 신청을 받아
  발급하는 방식이 일반적이므로, 입찰 공고를 확인하는 즉시 발주기관 담당 부서에
  미리 신청해 두는 것이 좋습니다. 공고문에서 요구하는 실적 인정 기간(통상 최근
  3~5년)과 실적 인정 금액 기준을 먼저 확인한 뒤 그 범위 안의 계약만 적으십시오.
source: original
featured: false
target_pages: 1

howto:
  - 증명서를 신청하는 회사와 발급기관 정보를 적습니다.
  - 증명 대상 계약명과 계약기간, 계약금액을 적습니다.
  - 이행 상태와 준공(완료) 여부를 적습니다.
  - 발급기관 담당자가 확인 후 서명하거나 직인을 찍습니다.

faq:
  - q: 실적증명서는 누가 발급하나요?
    a: 계약을 발주했던 기관(발주처)의 계약·사업 담당 부서가 신청을 받아 발급합니다.
  - q: 실적 인정 기간은 어떻게 확인하나요?
    a: 입찰 공고문의 참가자격 항목에 적힌 실적 인정 기간과 금액 기준을 먼저 확인해야 합니다.
  - q: 여러 건의 계약을 한 장에 적어도 되나요?
    a: 공고문에서 별도 서식을 지정하지 않았다면 표에 행을 추가해 여러 건을 함께 적어도 됩니다.

related: [gov-bid-participation, gov-bid-form, business-reg-checklist, quotation]

blocks:
  - type: doc_title
    text: 실적증명서
    spaced: true

  - type: para
    text: 아래와 같이 계약을 이행하였음을 증명합니다.
    align: center
    size: 11

  - type: subtitle
    text: 신청 회사

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["상호(법인명)", "", "대표자", ""]
      - ["사업자등록번호", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "홍길동"]
      - ["", "000-00-00000", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]

  - type: subtitle
    text: 계약 이행 실적 내역

  - type: table
    widths: [7, 24, 16, 19, 14, 10, 10]
    header: ["No", 계약명, 발주기관, 계약기간, 계약금액, 이행상태, 비고]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "청사 사무기기 공급 계약", "○○시청", "2025-03~2025-06", "48,000,000원", "준공", "-"]
      - ["2", "청사 전산장비 유지보수 용역", "○○구청", "2025-07~2026-06", "36,000,000원", "이행중", "-"]

  - type: subtitle
    text: 발급기관 확인

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["발급기관명", "", "부서·담당자", ""]
      - ["발급번호", "", "발급일", ""]
    sample_rows:
      - ["", "○○시청 총무과", "", "계약팀 김서연"]
      - ["", "2026-제0142호", "", "2026-09-16"]

  - type: notice
    text: 실적 인정 기간·금액 기준은 입찰 공고문의 참가자격을 우선 확인하십시오.

  - type: date_line
    sample_text: 2026 년    9 월   16 일

  - type: sign_line
    label: 발급기관 (직인)
