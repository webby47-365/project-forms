id: appointment-contract
title: 위촉계약서
category: legal
subcategory: contract
tags: [위촉계약서, 위촉 계약, 프리랜서 위촉, 업무위촉, 강사 위촉, 위촉장]
summary: 위촉 업무·위촉기간·보수와 업무 수행 방식을 정해 프리랜서와 맺는 위촉계약서 양식입니다.
usage: >
  회사나 기관이 외부 전문가·강사·프리랜서에게 특정 업무를 맡길 때 체결하는 위촉계약서입니다.
  위촉 업무의 범위와 위촉기간, 보수의 금액과 지급 시기를 구체적으로 적어야 나중에 업무 내용을
  증명하는 자료로 쓸 수 있습니다. 세금 처리는 원천징수 여부를 함께 적어 두십시오. 업무 수행 방법을
  수탁자가 스스로 정하는지 여부는 근로자성 판단과 연결될 수 있으므로 제출처 또는 전문가 기준을
  확인하십시오.
source: original
featured: false
from_request: true
target_pages: 2
howto:
  - 위촉하는 사람과 위촉받는 사람의 인적사항을 적습니다.
  - 위촉 업무의 내용과 위촉기간을 적습니다.
  - 보수 금액과 지급일, 원천징수 여부를 적습니다.
  - 특약사항을 확인하고 양쪽이 서명합니다.
faq:
  - q: 프리랜서 계약서와 무엇이 다른가요?
    a: 위촉계약서는 업무를 맡기는 위촉 관계를 중심으로 하고, 납품물보다 업무 수행 자체에 초점을 둘 때 씁니다.
  - q: 일한 사실을 증명하는 데 쓸 수 있나요?
    a: 업무 내용과 기간, 보수가 적혀 있어 증빙 자료가 될 수 있습니다. 제출처가 요구하는 형식은 따로 확인하십시오.
  - q: 원천징수는 어떻게 적나요?
    a: 해당 또는 비해당을 고르고 세율은 지급하는 쪽의 세무 처리 기준을 따릅니다.
related: [freelance-contract, career-certificate-request, withholding-request]
blocks:
  - type: doc_title
    text: 위촉계약서
    spaced: true
  - type: para
    text: 위촉자와 수탁자는 다음과 같이 업무 위촉계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 위촉 개요
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [3, 1, 3, 3]
    rows:
      - ["위촉 업무", "", "", ""]
      - ["위촉기간", "20   년  월  일 ~ 20   년  월  일", "업무 장소", ""]
      - ["보수", "금                        원정", "원천징수", "해당 / 비해당"]
      - ["지급 시기", "", "", ""]
    sample_rows:
      - ["", "신입사원 직무교육 강의 및 교안 작성", "", ""]
      - ["", "2026-09-01 ~ 2026-12-31", "", "본사 교육장"]
      - ["", "금 3,000,000원정 (금 삼백만원)", "", "해당"]
      - ["", "매월 말일 수탁자 지정 계좌로 지급", "", ""]
  - type: subtitle
    text: 2. 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["위촉자", "상호(성명)", "", "대표자", ""]
      - ["", "주소", "", "연락처", ""]
      - ["수탁자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "박민준"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "홍길동", "", "1990-03-05"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-9876-5432"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "이 계약은 위촉자가 수탁자에게 위 업무를 위촉하고 수탁자가 이를 수행함에 필요한 사항을 정함을 목적으로 한다."
  - type: article
    heading: 제2조 (업무의 수행)
    lines:
      - "수탁자는 전문성을 바탕으로 위촉 업무를 성실히 수행하며, 업무 수행의 방법과 시간은 수탁자가 스스로 정한다."
      - "위촉자는 업무 수행에 필요한 자료와 장소를 협의하여 제공한다."
  - type: article
    heading: 제3조 (보수의 지급)
    lines:
      - "위촉자는 위 표에 정한 보수를 정해진 시기에 수탁자에게 지급한다."
      - "원천징수 대상인 경우 관련 법령이 정하는 세액을 공제하고 지급한다."
  - type: article
    heading: 제4조 (비밀유지)
    lines:
      - "수탁자는 업무 수행 중 알게 된 위촉자의 영업비밀과 개인정보를 제3자에게 누설하지 아니하며, 이 의무는 계약 종료 후에도 존속한다."
  - type: article
    heading: 제5조 (계약의 해지)
    lines:
      - "당사자 일방이 계약상 의무를 중대하게 위반한 경우 상대방은 상당한 기간을 정해 시정을 요구한 후 계약을 해지할 수 있다."
      - "해지 시 이미 수행한 업무에 대한 보수는 수행 정도에 따라 정산한다."
  - type: article
    heading: 제6조 (기타)
    lines:
      - "이 계약은 위촉 관계로서 근로계약이 아니며, 정하지 아니한 사항은 관계 법령과 상관례에 따른다."
  - type: textbox
    hint: "특약사항 — 계약 연장, 비용 부담, 결과물 이용 범위 등 추가로 합의한 내용을 기재하십시오."
    height_mm: 24
    sample_text: 계약기간 종료 후 양 당사자가 합의하면 같은 조건으로 연장할 수 있으며, 교안의 사내 이용은 위촉자가 할 수 있다.
  - type: date_line
    sample_text: 2026 년    9 월    1 일
  - type: sign_line
    labels: ["위촉자", "수탁자"]
    sample_names: [박민준, 홍길동]
  - type: notice
    text: 근로자성 판단과 세무 처리는 계약 형태에 따라 달라질 수 있으므로 제출처 또는 전문가 기준을 확인하십시오.
