id: contract-termination-agreement
title: 계약 합의해지서
category: legal
subcategory: contract
tags: [합의해지, 계약해지, 계약해지합의서, 해지합의, 계약종료]
summary: 계약 당사자들이 서로 합의해 계약을 끝내고 정산 방법과 책임 범위를 정리하는 계약 합의해지서 양식입니다.
usage: >
  이미 맺은 계약을 양쪽이 동의해 중간에 끝낼 때 해지 날짜와 정산 내용을 문서로 남기는 서식입니다.
  원래 계약의 이름과 체결일, 해지일, 이미 이행한 부분의 정산, 돌려줄 물건과 금액을 적습니다.
  해지 뒤에 서로 더 이상 청구하지 않는지 여부를 분명히 적어 두면 분쟁을 줄일 수 있습니다.
  계약 종류에 따라 정해진 절차가 있을 수 있으니 필요하면 전문가에게 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 원래 계약의 이름과 체결일, 당사자를 적습니다.
  - 해지일과 해지 사유를 적습니다.
  - 정산할 금액과 돌려줄 물건, 지급일을 적습니다.
  - 추가 청구 여부를 정하고 양쪽이 서명합니다.
faq:
  - q: 한쪽이 서명하지 않으면 효력이 있나요?
    a: 합의해지는 양쪽의 동의가 있어야 성립합니다. 한쪽만 서명한 문서는 합의 증거로 약합니다.
  - q: 이미 낸 계약금은 어떻게 하나요?
    a: 돌려줄지, 얼마를 공제할지 정산 칸에 구체적으로 적어야 합니다. 계약서의 위약금 조항도 함께 확인하십시오.
  - q: 해지 후 추가 청구를 막을 수 있나요?
    a: 추가 청구를 하지 않기로 합의한다는 문구를 넣으면 분쟁을 줄이는 데 도움이 됩니다.
related: [settlement-agreement, quitclaim-letter, balance-confirmation, deposit-return-notice]
blocks:
  - type: doc_title
    text: 계약 합의해지서
    spaced: true
  - type: subtitle
    text: 1. 해지할 계약
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["계약명", "", "", ""]
      - ["계약 체결일", "", "계약 기간", ""]
      - ["갑", "", "을", ""]
    sample_rows:
      - ["", "웹사이트 제작 용역계약", "", ""]
      - ["", "2026-08-01", "", "2026-08-01 ~ 2026-12-31"]
      - ["", "(주)한빛커머스", "", "(주)새길데이터"]
  - type: subtitle
    text: 2. 해지 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["해지일", "", "해지 효력", ""]
      - ["해지 사유", "", "", ""]
    sample_rows:
      - ["", "2026-11-10", "", "해지일부터"]
      - ["", "사업 일정 변경으로 양쪽이 합의함", "", ""]
  - type: subtitle
    text: 3. 정산 내역
  - type: table
    widths: [8, 30, 22, 20, 20]
    header: ["No", 정산 항목, 금액(원), 지급 기한, 지급 방법]
    empty_rows: 4
    row_height_mm: 8
    sample_rows:
      - ["1", "이행한 작업분 대금", "2,000,000", "2026-11-20", "계좌이체"]
      - ["2", "선지급금 반환", "1,000,000", "2026-11-20", "계좌이체"]
  - type: textbox
    hint: "돌려줄 물건, 자료 반환, 추가 청구 여부 등 합의한 나머지 사항을 적으십시오."
    height_mm: 24
    sample_text: "제작 중인 자료는 해지일까지 정리해 서로 돌려주고, 위 정산 후에는 이 계약과 관련해 서로 추가로 청구하지 않기로 합니다."
