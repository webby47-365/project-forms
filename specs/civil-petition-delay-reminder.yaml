id: civil-petition-delay-reminder
title: 민원 처리 지연 독촉서
category: public
subcategory: civil
tags: [민원독촉, 민원처리지연, 처리기한 문의, 민원 재촉, 민원처리 요청]
summary: 접수한 민원의 처리기한이 지나도 답이 없을 때 접수번호와 경과 일수를 적어 처리 상황을 묻는 민원 처리 지연 독촉서 양식입니다.
usage: >
  관공서에 낸 민원의 회신 예정일이 지났는데 아무 연락이 없을 때 처리 상황과 앞으로의 일정을 알려 달라고 요청하는 문서입니다.
  접수 기관, 접수일, 접수번호, 회신 예정일을 정확히 적어야 담당 부서가 건을 바로 찾을 수 있습니다.
  감정적인 표현은 빼고 확인하고 싶은 내용만 적는 편이 좋습니다. 처리기간은 민원 종류마다 달라 연장 통지가 이미 와 있을 수도 있으니 보내기 전에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 접수 기관과 접수일, 접수번호를 적습니다.
  - 안내받은 회신 예정일과 지난 일수를 적습니다.
  - 알고 싶은 내용을 체크하고 요청 사항을 적습니다.
  - 날짜를 쓰고 서명해 담당 부서에 냅니다.
faq:
  - q: 접수번호를 잃어버렸어요. 어떻게 하나요?
    a: 접수일과 민원 제목만 적어도 담당 부서가 찾을 수 있는 경우가 많습니다. 접수 확인 문자나 메일이 있으면 번호를 확인하십시오.
  - q: 처리기간이 연장 통지된 경우에도 내나요?
    a: 연장 통지서의 기한이 지났는지 먼저 보십시오. 연장된 기한 안이면 기다려야 할 수 있습니다.
  - q: 독촉서를 내면 처리가 빨라지나요?
    a: 단정할 수 없습니다. 다만 진행 상황을 서면으로 확인하는 기록이 되므로 이후 절차에 도움이 될 수 있습니다.
related: [civil-petition-reply-request, gov-admin-appeal, info-disclosure-request, civil-petition]
blocks:
  - type: doc_title
    text: 민원 처리 지연 독촉서
    spaced: false
  - type: subtitle
    text: 1. 민원인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울특별시 중구 세종대로 110", "", ""]
  - type: subtitle
    text: 2. 접수한 민원
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [3, 1, 3, 3]
    rows:
      - ["접수 기관", "", "접수일", ""]
      - ["접수번호", "", "담당 부서", ""]
      - ["회신 예정일", "", "지난 일수", ""]
      - ["민원 제목", "", "", ""]
    sample_rows:
      - ["", "○○구청 민원실", "", "2026-09-14"]
      - ["", "2026-000456", "", "도로관리과"]
      - ["", "2026-10-05", "", "19일"]
      - ["", "인도 보도블록 파손 보수 요청", "", ""]
  - type: subtitle
    text: 3. 알려 주실 내용
  - type: table
    widths: [12, 88]
    header: ["선택", 요청 내용]
    empty_rows: 4
    row_height_mm: 8
    sample_rows:
      - ["√", "현재 처리 단계와 담당자"]
      - ["√", "회신이 늦어지는 이유"]
      - ["√", "예상 회신일"]
  - type: subtitle
    text: 4. 요청 사항
  - type: textbox
    hint: "기한까지 회신을 받지 못한 경위와 바라는 점을 간단히 적으십시오."
    height_mm: 26
    sample_text: 안내받은 회신 예정일이 지났으나 연락을 받지 못하였습니다. 처리 현황과 앞으로의 일정을 서면 또는 문자로 알려 주시기 바랍니다.
  - type: para
    text: 위와 같이 민원 처리 현황의 확인을 요청하오니 회신해 주시기 바랍니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   24 일
  - type: sign_line
    labels: ["민원인"]
    sample_names: [홍길동]
  - type: notice
    text: 처리기간과 연장 여부는 민원 종류마다 다릅니다. 기관의 안내를 확인하십시오.
