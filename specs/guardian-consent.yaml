id: guardian-consent
title: 보호자 동의서
category: public
subcategory: consent
tags: [보호자, 동의서, 미성년자, 보호자 동의, 학교]
summary: 미성년자 자녀가 활동·행사에 참가할 때 보호자(부모)가 서명하는 동의서 양식입니다.
usage: >
  학교, 학원, 스포츠 클럽, 여행사, 캠프 등이 미성년자 참여자의 보호자로부터 법적 책임 동의를 받기 위해 사용합니다.
  자녀의 기본정보, 보호자의 성명과 연락처, 응급상황 연락처, 건강상 주의사항(알레르기 등)을 반드시 명확히 기재해야 합니다.
  비용 부담, 활동 중 사고 책임, 귀가 방법 등의 특수 사항이 있으면 사전에 고지해야 합니다.
source: original
featured: false
target_pages: 2

howto:
  - 미성년자의 기본정보를 적습니다.
  - 보호자의 성명과 연락처를 적습니다.
  - 응급상황 연락처와 건강상 주의사항을 적습니다.
  - 비용 부담과 사고 책임 등 특수 사항을 확인합니다.
  - 보호자가 서명합니다.

faq:
  - q: 알레르기 정보는 꼭 적어야 하나요?
    a: 네, 응급 상황에 대비할 수 있도록 건강상 주의사항을 빠짐없이 적어야 합니다.
  - q: 보호자가 두 명이면 모두 서명해야 하나요?
    a: 기관 방침에 따라 다르므로 한 명의 서명으로 충분한지 사전에 확인하는 것이 좋습니다.

related: [minor-activity-consent, field-trip-consent, event-application]

