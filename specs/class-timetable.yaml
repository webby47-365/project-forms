id: class-timetable
title: 시간표
category: edu
subcategory: school
tags: [시간표, 주간 시간표, 수업 시간표, 학급 시간표, 학원 시간표]
summary: 교시별·요일별 수업 과목과 담당 교사, 준비물을 한 장에 정리하는 시간표 양식입니다.
usage: >
  학교나 학원의 주간 수업 일정을 정리해 붙여 두고 쓰는 표입니다. 교시별 시작·종료 시각을 먼저
  적고 요일별 과목을 채우면 이동 수업이나 공강을 한눈에 파악할 수 있습니다. 과목별 담당 교사와
  교실을 함께 적어 두면 학기 초에 헷갈리지 않습니다. 요일마다 챙겨야 할 준비물을 따로 표시해
  두면 빠뜨리는 일이 줄어듭니다. 방과 후 활동이나 학원 일정은 아래 칸에 적어 하루 전체 동선을
  정리하십시오. 학기 중 시간표가 변경되면 새로 작성해 사용하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 학교(학원)명과 학년·반, 적용 기간을 적습니다.
  - 교시별 시작·종료 시각을 먼저 채웁니다.
  - 요일별 과목과 담당 교사, 교실을 채웁니다.
  - 요일별 준비물과 방과 후 일정을 적어 마무리합니다.

faq:
  - q: 학기 중 시간표가 바뀌면 어떻게 하나요?
    a: 기존 표를 수정하기보다 새로 작성해 사용하는 것이 헷갈리지 않습니다.
  - q: 학원 수업도 같이 적을 수 있나요?
    a: 네, 방과 후 활동 칸에 학원 일정을 함께 적으면 하루 전체 동선을 파악하기 좋습니다.

related: [weekly-study-plan, academy-attendance, daily-planner]

blocks:
  - type: doc_title
    text: 시간표
  - type: grid
    widths: [16, 22, 14, 20, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["학교(학원)", "", "학년·반", "", "이름", ""]
      - ["학기", "", "적용 기간", "", "담임", ""]
    sample_rows:
      - ["", "한국대학교", "", "2학년 3반", "", "박민준"]
      - ["", "2학기", "", "2026.09~2027.02", "", "이수현"]
  - type: subtitle
    text: 1. 주간 시간표
  - type: table
    widths: [10, 16, 12, 12, 12, 12, 12, 14]
    header: [교시, 시간, 월, 화, 수, 목, 금, 토]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "09:00~09:50", "국어", "수학", "영어", "과학", "체육", "-"]
      - ["2", "10:00~10:50", "수학", "국어", "과학", "영어", "음악", "-"]
  - type: subtitle
    text: 2. 과목별 담당 및 교실
  - type: table
    widths: [8, 24, 22, 20, 26]
    header: ["No", 과목, 담당 교사, 교실, 비고]
    empty_rows: 4
    row_height_mm: 7
    body_align: center
    sample_rows:
      - ["1", "수학", "김서연", "303호", ""]
      - ["2", "영어", "박민준", "201호", "원어민 수업"]
  - type: subtitle
    text: 3. 요일별 준비물 및 방과 후 일정
  - type: table
    widths: [14, 43, 43]
    header: [요일, 준비물, 방과 후·학원 일정]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["월", "체육복", "영어학원 17:00"]
      - ["수", "미술 도구", "수학학원 18:00"]
  - type: textbox
    hint: "메모 — 수행평가 일정, 변경된 수업 등을 기재하십시오."
    height_mm: 18
    sample_text: 10월 둘째 주 수행평가(영어 말하기) 예정, 체육복 매주 월요일 준비.
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    label: 작성자
    sample_names: [박민준]
  - type: notice
    text: 학기 중 시간표가 변경되면 새로 작성해 사용하십시오.
