id: tax-payment-extension-reason-statement
title: 세금 납부기한 연장 사유서
category: public
subcategory: tax
tags: [납부기한연장, 세금납부연장, 체납예방, 납기연장사유, 세금분납]
summary: 세금 납부기한 연장을 요청할 때 세목·금액과 연장이 필요한 사유, 납부 계획을 정리하는 사유서입니다.
usage: >
  사업 부진이나 일시적 자금 사정으로 정해진 기한까지 세금을 내기 어려울 때 세무서 등에 제출할
  사유를 정리하는 서식입니다. 납세자 정보, 세목과 금액, 원래 기한과 희망 기한, 사유와 납부
  계획을 적고 서명합니다. 연장 가능 여부와 요건은 세목과 사정에 따라 달라지므로 신청 방법은
  관할 세무서나 국세청 안내를 확인하십시오. 본 서식은 사유를 정리하는 틀이며 신청서를 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 납세자 성명(상호)과 사업자등록번호를 적습니다.
  - 세목과 납부할 금액, 원래 납부기한을 적습니다.
  - 희망하는 연장 기한과 연장이 필요한 사유를 적습니다.
  - 납부 계획을 적고 서명한 뒤 증빙을 붙입니다.
faq:
  - q: 이 사유서만 내면 연장되나요?
    a: 아닙니다. 연장 승인은 세무서가 판단하니 신청 방법과 요건을 먼저 확인하십시오.
  - q: 어떤 증빙을 붙이나요?
    a: 매출 감소를 보여 주는 자료 등 사유를 뒷받침하는 서류를 붙이면 설명하기 좋습니다.
  - q: 분납 계획도 적나요?
    a: 나누어 낼 계획이 있으면 납부 계획란에 횟수와 시기를 적어 두십시오.
related: [tax-data-inquiry-consent, expense-evidence-explanation, vat-filing-poa, tax-document-handover-receipt]
blocks:
  - type: doc_title
    text: 세금 납부기한 연장 사유서
    spaced: false
  - type: subtitle
    text: 1. 납세자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명(상호)", "", "사업자등록번호", ""]
      - ["연락처", "", "담당 세무서", ""]
    sample_rows:
      - ["", "한빛상회", "", "000-00-00000"]
      - ["", "010-1234-5678", "", "예시세무서"]
  - type: subtitle
    text: 2. 연장 요청 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["세목", "", "납부 금액", ""]
      - ["원래 기한", "", "희망 기한", ""]
    sample_rows:
      - ["", "부가가치세", "", "3,200,000원"]
      - ["", "2026-10-25", "", "2026-12-25"]
  - type: subtitle
    text: 3. 연장 사유
  - type: textbox
    hint: "매출 감소, 자금 사정 등 연장이 필요한 사유와 첨부 증빙을 적으십시오."
    height_mm: 26
    sample_text: "최근 3개월 매출이 줄어 납부 자금 마련이 늦어졌으며, 월별 매출 내역을 첨부함."
  - type: subtitle
    text: 4. 납부 계획
  - type: textbox
    hint: "납부 시기와 방법, 나누어 낼 경우 횟수를 적으십시오."
    height_mm: 20
    sample_text: "희망 기한까지 전액 납부할 계획이며, 어려우면 두 차례로 나누어 납부하겠습니다."
  - type: date_line
    sample_text: 2026 년   10 월    28 일
  - type: sign_line
    label: 작성자
    sample_names: [홍길동]
  - type: notice
    text: 연장 요건과 신청 방법은 관할 세무서 안내를 확인하십시오.
