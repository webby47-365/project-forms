id: family-certificate-issuance-poa
title: 가족관계증명서 발급 위임장
category: public
subcategory: family
tags: [가족관계증명서발급위임장, 기본증명서위임장, 가족관계증명서대리발급, 제적등본위임장, 가족관계등록부위임장]
summary: 본인이 직접 방문하기 어려울 때 가족관계증명서·기본증명서 등의 대리 발급을 위임하는 위임장입니다.
usage: >
  가족관계증명서·기본증명서·혼인관계증명서 등을 본인이 직접 발급받기 어려울 때, 대리인이
  주민센터나 법원 가족관계등록관서를 방문해 발급받도록 위임하는 서류입니다. 필요한 증명서
  종류와 통수를 정확히 적어야 창구에서 바로 처리됩니다. 신분증 외에 위임인의 본인서명사실
  확인서나 인감증명서를 함께 요구하는 경우가 많으니 방문 전 관할 기관에 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 위임인의 인적사항을 적습니다.
  - 대리인의 인적사항을 정확히 적습니다.
  - 발급받을 증명서 종류와 통수를 적습니다.
  - 위임인이 서명 또는 날인합니다.
  - 대리인이 위임장과 신분증을 지참해 방문합니다.

faq:
  - q: 온라인 정부24로도 대리 발급이 되나요?
    a: 정부24는 본인 인증이 필요해 대리 발급이 제한되므로, 대리 발급은 주민센터 방문을 이용하십시오.
  - q: 어떤 신분증을 가져가야 하나요?
    a: 대리인 본인 신분증과 위임인 신분증 사본, 이 위임장을 함께 지참하는 것이 안전합니다.
  - q: 제출처마다 요구 서류가 다른가요?
    a: 기관에 따라 인감증명서나 본인서명사실확인서 첨부를 추가로 요구할 수 있어 방문 전 확인하십시오.

related: [power-of-attorney, seal-certificate-poa, gov-resident-register-copy]

