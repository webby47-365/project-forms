id: partnership-dissolution-agreement
title: 동업 해지 합의서
category: corp
subcategory: startup
tags: [동업해지합의서, 동업해지, 동업정산, 동업탈퇴합의서]
summary: 동업관계를 끝내며 지분 정산 방법과 잔여 채무·자산 처리를 정하는 합의서입니다.
usage: >
  공동사업을 함께 하던 동업자 중 일부 또는 전원이 관계를 정리할 때 씁니다. 탈퇴자의
  지분을 어떻게 평가하고 언제까지 정산하는지, 사업체 명의와 거래처·자산·채무는 누가
  이어받는지를 구체적인 금액과 기한으로 남겨야 나중에 다시 다투지 않습니다. 정산이
  끝난 뒤에는 재청구를 하지 않기로 하는 조항을 넣어 분쟁의 소지를 줄이는 것이 좋습니다.
  본 서식은 참고용이며 개별 사안의 법적 적합성은 이용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2

howto:
  - 동업자 전원의 인적사항과 사업체 정보를 적습니다.
  - 해지 사유와 해지일을 적습니다.
  - 탈퇴자 지분의 정산 금액과 지급 기한을 정합니다.
  - 사업체 명의와 자산·채무의 승계자를 정합니다.
  - 동업자 전원이 서명하고 날인합니다.

faq:
  - q: 지분 정산 금액은 어떻게 정하나요?
    a: 해지일 기준 순자산에 지분율을 곱해 산정하며, 이견이 있으면 합의한 회계사의 평가에 따릅니다.
  - q: 남은 채무는 누가 책임지나요?
    a: 합의서에 승계자를 정하되, 채권자에 대한 책임은 관련 법령과 개별 계약에 따라 달라질 수 있습니다.

blocks:
  - type: doc_title
    text: 동업 해지 합의서
    spaced: false

  - type: para
    text: 아래 당사자는 공동으로 운영하던 사업의 동업관계를 해지하며 다음과 같이 합의한다.
    align: center
    size: 10

  - type: subtitle
    text: 1. 사업체 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사업체명", "", "사업 개시일", ""]
      - ["사업장 소재지", "", "", ""]
    sample_rows:
      - ["", "한빛물산", "", "2023-04-01"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]

  - type: subtitle
    text: 2. 동업자 및 지분 현황

  - type: table
    widths: [16, 14, 16, 18, 18, 18]
    header: [성명, 생년월일, 지분율, 구분, 정산 금액, 지급 기한]
    empty_rows: 3
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["홍길동", "1985-03-11", "60%", "잔존", "-", "-"]
      - ["김서연", "1988-07-22", "40%", "탈퇴", "1,200만원", "2026-11-30"]

  - type: article
    heading: 제1조 (해지)
    lines:
      - "당사자들은      년      월      일자로 위 사업체에 관한 동업관계를 해지한다."
      - "해지 사유:                                                                    "
  - type: article
    heading: 제2조 (지분 정산)
    lines:
      - "탈퇴자의 지분은 해지일 기준 순자산에 지분율을 곱한 금액으로 평가하여 위 표의 정산 금액과 지급 기한에 따라 지급한다."
      - "정산 금액에 이견이 있는 경우 쌍방이 합의한 회계사의 평가에 따른다."
  - type: article
    heading: 제3조 (사업체 명의와 자산·채무의 승계)
    lines:
      - "사업체의 명의, 거래처, 재고자산 및 설비는                    이(가) 승계한다."
      - "해지일 이전에 발생한 채무는                    이(가) 부담하며, 탈퇴자에게 구상하지 않는다."
  - type: article
    heading: 제4조 (경업금지)
    lines:
      - "탈퇴자는 해지일로부터      년간 동일·유사한 사업을 직접 또는 제3자를 통하여 영위하지 않는다."
  - type: article
    heading: 제5조 (청산 확인)
    lines:
      - "당사자들은 위 정산으로 동업관계에 관한 모든 채권·채무가 종결되었음을 확인하며, 이후 서로 추가 청구를 하지 않는다."
  - type: article
    heading: 제6조 (분쟁해결)
    lines:
      - "본 합의에 관한 분쟁은 상호 협의로 해결하되, 협의가 되지 않으면 사업장 소재지 관할법원을 제1심 관할법원으로 한다."

  - type: subtitle
    text: 특약사항

  - type: textbox
    hint: "상표·특허 등 지식재산의 귀속, 재고자산 분배, 거래처 인수인계 방법 등 추가로 합의한 내용을 기재하십시오."
    height_mm: 16
    sample_text: 재고자산은 2026년 10월 말까지 잔존 동업자가 인수하며, 거래처 인수인계는 해지일로부터 2주 내에 완료한다.

  - type: para
    text: 본 합의를 증명하기 위하여 동업자 수만큼 합의서를 작성하여 각자 1부씩 보관한다.
    align: center
    size: 10
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: table
    widths: [22, 30, 26, 22]
    header: [구분, 성명, 주소, 서명 또는 인]
    rows:
      - ["동업자", "", "", ""]
    empty_rows: 2
    row_height_mm: 11
    body_align: center
    sample_rows:
      - ["잔존 동업자", "홍길동", "서울특별시 마포구 월드컵북로 100", ""]
      - ["탈퇴 동업자", "김서연", "서울특별시 강남구 테헤란로 50", ""]

  - type: notice
    text: 본 서식은 참고용이며 개별 사안에 대한 법적 효력과 적합성은 이용자가 확인해야 합니다. 정산 금액이 크거나 채무 관계가 복잡한 경우 반드시 전문가의 검토를 받으십시오.
