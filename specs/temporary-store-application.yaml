id: temporary-store-application
title: 임시 점포 설치 신청서
category: public
subcategory: permit
tags: [임시점포, 임시매장, 팝업스토어, 행사부스, 푸드트럭]
summary: 행사장이나 공간 관리자에게 일정 기간 임시 점포(부스·판매대) 설치를 신청할 때 쓰는 임시 점포 설치 신청서 양식입니다.
usage: >
  축제·시장·상가 공용공간 등에서 팝업 매장이나 행사 부스를 잠깐 운영하려면 공간 관리자의 승낙을 먼저 받아야
  합니다. 신청인 정보와 설치 장소, 운영 기간과 시간, 판매 품목, 점포 규모와 전기·가스 사용 여부를 적어 냅니다.
  영업 신고나 허가가 필요한 품목인지는 관할 기관마다 달라 이 서식으로 대신할 수 없으므로 담당 부서에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신청인 이름과 연락처, 사업자 여부를 적습니다.
  - 설치 장소와 운영 기간, 운영 시간을 적습니다.
  - 판매 품목과 점포 규모, 전기·가스 사용 여부를 적습니다.
  - 철거 책임 확인란에 서명해 관리자에게 냅니다.
faq:
  - q: 이 서식으로 영업 허가가 되나요?
    a: 아닙니다. 공간 사용 신청서이며, 영업 신고나 허가가 필요한 품목은 관할 기관에 따로 확인해야 합니다.
  - q: 사업자가 아니어도 낼 수 있나요?
    a: 관리자 기준에 따라 다르며, 개인 신청이 안 되는 곳도 있으니 사전에 문의하십시오.
  - q: 운영 시간은 어떻게 정하나요?
    a: 행사 운영 시간을 기준으로 적고, 설치와 철거에 필요한 시간은 따로 구분해 적습니다.
related: [event-plan, signboard-installation-consent, business-facility-use-consent, facility-use-application]
blocks:
  - type: doc_title
    text: 임시 점포 설치 신청서
    spaced: false
  - type: subtitle
    text: 1. 신청인 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["신청인", "", "연락처", ""]
      - ["상호(단체)", "", "사업자 여부", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "한빛공방", "", "[√] 사업자  [ ] 개인"]
      - ["", "서울시 ○○구 ○○로 10", "", ""]
  - type: subtitle
    text: 2. 설치 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [3, 1, 3, 3]
    rows:
      - ["설치 장소", "", "", ""]
      - ["운영 기간", "", "운영 시간", ""]
      - ["점포 규모", "", "전기·가스", ""]
      - ["판매 품목", "", "", ""]
    sample_rows:
      - ["", "○○시장 중앙광장 B구역", "", ""]
      - ["", "2026-11-07 ~ 2026-11-08", "", "10:00 ~ 18:00"]
      - ["", "가로 3m × 세로 3m", "", "전기 사용"]
      - ["", "수제 도자기 소품", "", ""]
  - type: subtitle
    text: 3. 추가 설명
  - type: textbox
    hint: "설치·철거 방식, 안전 대책 등 관리자에게 알릴 내용을 적으십시오."
    height_mm: 26
    sample_text: "천막과 진열대를 오전 8시에 설치하고 마감 후 1시간 안에 철거하겠습니다. 소화기를 점포 안에 비치합니다."
  - type: para
    text: 위와 같이 임시 점포 설치를 신청하며, 운영 후 원상복구하고 쓰레기를 직접 처리하겠습니다.
    align: center
  - type: date_line
    sample_text: 2026 년    10 월    14 일
  - type: sign_line
    label: 신청인
    sample_names: [홍길동]
  - type: notice
    text: 영업 신고나 허가가 필요한 품목은 관할 기관과 공간 관리자의 기준을 확인하십시오.
