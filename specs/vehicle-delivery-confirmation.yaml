id: vehicle-delivery-confirmation
title: 자동차 인도확인서
category: public
subcategory: vehicle
tags: [자동차인도확인서, 차량인수확인서, 차량인도증, 중고차인도확인, 차량인수인계서]
summary: 자동차를 사고판 뒤 차량과 열쇠·서류를 넘기고 받았음을 매도인과 매수인이 함께 확인하는 인도확인서입니다.
usage: >
  중고차나 개인 간 차량 거래에서 차를 실제로 넘긴 날짜와 시간, 주행거리, 함께 넘긴 열쇠·서류를 기록해 두는 확인서입니다.
  인도 이후 발생한 사고나 과태료의 시점을 구분하는 자료로 쓸 수 있습니다. 차량 상태는 인도 시점에 두 사람이 같이
  보고 적고, 각자 한 부씩 보관합니다. 이전등록 절차와 책임 범위는 별도로 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 매도인과 매수인의 성명·연락처를 적습니다.
  - 차량번호·차종·차대번호를 등록증과 맞춰 적습니다.
  - 인도 일시와 주행거리를 두 사람이 함께 확인해 적습니다.
  - 넘긴 열쇠·서류에 표시하고 양쪽이 서명하여 한 부씩 보관합니다.

faq:
  - q: 이전등록이 끝나기 전에도 써두면 좋은가요?
    a: 등록 전에 차를 넘기는 경우 인도 시점이 남아 과태료 등을 구분할 때 참고가 됩니다.
  - q: 차량 상태는 어떻게 적나요?
    a: 흠집·고장 등 인도 시점에 눈에 보이는 상태를 구체적으로 적고 사진을 함께 찍어 두십시오.
  - q: 매매계약서를 대신할 수 있나요?
    a: 대신하지 못합니다. 거래 조건은 매매계약서에 따로 적고 이 확인서는 인도 사실만 남깁니다.

related: [used-car-sale-contract, gov-vehicle-transfer-registration, vehicle-registration-poa, gov-vehicle-transfer-cert]

