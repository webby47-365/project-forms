id: year-end-child-tax-credit-confirmation
title: 연말정산 자녀 세액공제 대상 확인서
category: corp
subcategory: hr
tags: [자녀세액공제, 연말정산자녀, 자녀공제확인, 출산입양공제, 연말정산부양가족]
summary: 연말정산에서 자녀 세액공제를 받으려는 직원이 자녀별 출생연도·동거 여부·출산·입양 해당 여부를 적어 회사에 내는 확인서 양식입니다.
usage: >
  직원이 자녀 공제를 신청할 때 자녀별 사항을 정리해 회사 연말정산 담당자에게 내는 서식입니다.
  신청인의 성명과 소속을 적고, 자녀마다 성명·출생연도·동거 여부·출산 또는 입양 해당 연도를 한 줄씩 적습니다.
  맞벌이 부부는 같은 자녀를 중복해 신청하지 않도록 누가 신청하는지 함께 표시합니다.
  공제 요건과 금액은 해마다 달라질 수 있으므로 국세청 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신청인의 성명과 소속 부서를 적습니다.
  - 자녀의 성명과 출생연도를 한 줄씩 적습니다.
  - 동거 여부와 출산·입양 해당 연도를 표시합니다.
  - 배우자가 신청하는 자녀가 아닌지 확인하고 서명합니다.
faq:
  - q: 자녀 주민등록번호를 적어야 하나요?
    a: 이 서식에는 주민등록번호 칸이 없습니다. 증빙이 필요하면 회사 안내에 따라 별도로 제출하십시오.
  - q: 부부가 모두 신청해도 되나요?
    a: 같은 자녀는 한 사람만 공제받을 수 있습니다. 신청자를 미리 정해 한쪽만 내십시오.
  - q: 공제 금액은 이 서식에서 정해지나요?
    a: 아닙니다. 금액과 요건은 국세청 안내와 회사 정산 기준에 따라 정해집니다.
related: [year-end-couple-dependent-allocation, year-end-dependent-duplicate-check, year-end-dependent-change-notice, child-rearing-fact-confirmation]
blocks:
  - type: doc_title
    text: 자녀 세액공제 대상 확인서
    spaced: false
  - type: subtitle
    text: 1. 신청인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "소속 부서", ""]
      - ["연락처", "", "정산 연도", ""]
      - ["배우자 근로 여부", "", "배우자 신청 여부", ""]
    sample_rows:
      - ["", "홍길동", "", "영업지원팀"]
      - ["", "010-1234-5678", "", "2026년 귀속"]
      - ["", "있음 (타사 근무)", "", "신청 안 함"]
  - type: subtitle
    text: 2. 자녀별 확인
  - type: table
    widths: [8, 20, 16, 16, 20, 20]
    header: ["No", 자녀 성명, 출생연도, 동거 여부, 출산·입양 연도, 비고]
    empty_rows: 5
    row_height_mm: 8
    sample_rows:
      - ["1", "홍하늘", "2016", "동거", "해당 없음", ""]
      - ["2", "홍하나", "2026", "동거", "2026 출산", "출생증명 첨부"]
  - type: textbox
    hint: "함께 살지 않는 자녀가 있다면 사유를 적으십시오."
    height_mm: 20
    sample_text: "해당 없음. 자녀 모두 신청인과 함께 거주하고 있습니다."
  - type: date_line
    sample_text: 2026 년   11 월   19 일
  - type: sign_line
    label: 신청인
    sample_names: [홍길동]
  - type: notice
    text: 공제 요건과 제출 서류는 국세청과 회사의 연말정산 안내를 확인하십시오.
