id: hearing-date-change-request
title: 변론기일 변경 신청서
category: legal
subcategory: litigation
tags: [기일변경신청서, 변론기일변경, 재판기일연기, 기일연기신청, 기일변경]
summary: 지정된 재판 기일에 출석하기 어려운 당사자가 사유를 적어 법원에 기일 변경을 요청하는 신청서 양식입니다.
usage: >
  재판 기일에 부득이한 사정이 생겼을 때 법원에 기일을 바꿔 달라고 요청하는 서식입니다.
  사건번호와 사건명, 지정된 기일, 변경을 원하는 사유와 희망 일정을 적고 서명합니다.
  사유를 뒷받침하는 자료가 있으면 함께 내는 것이 좋습니다. 변경 여부는 법원이 판단하므로
  신청했다고 해서 반드시 받아들여지는 것은 아닙니다. 제출 방식과 기한은 담당 재판부에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 사건번호와 사건명, 법원·재판부를 적습니다.
  - 지정된 기일의 날짜와 시각을 적습니다.
  - 변경이 필요한 사유와 희망 일정을 적습니다.
  - 증빙 자료를 붙이고 서명해 제출합니다.
faq:
  - q: 신청하면 기일이 꼭 바뀌나요?
    a: 아닙니다. 변경 여부는 재판부가 판단하므로 신청 후에도 기일이 유지될 수 있습니다.
  - q: 언제까지 내야 하나요?
    a: 사유가 생기면 가능한 한 빨리 냅니다. 구체적인 방식은 담당 재판부에 확인하십시오.
  - q: 증빙 자료가 꼭 필요한가요?
    a: 사유를 뒷받침하는 자료가 있으면 설득력이 높아집니다. 사유에 맞는 자료를 붙이십시오.
related: [preparatory-brief, answer-brief, power-of-attorney, evidence-submission-list]
