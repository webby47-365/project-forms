id: job-application-form
title: 입사지원서
category: personal
subcategory: career
tags: [입사지원서, 지원서, 채용서류, 인적사항, 자격심사, 취업서류]
summary: 지원구분·인적사항·학력·경력·병역과 개인정보 동의까지 갖춘 표준 입사지원서 양식입니다.
usage: >
  채용 공고에 지원할 때 이력서 대신 또는 이력서와 함께 제출하는 회사 양식입니다. 지원구분과
  지원부문, 지원경로를 먼저 밝히고 인적사항·학력·경력을 최종 순부터 역순으로 적습니다.
  병역 및 보훈 사항은 해당 여부를 정확히 표기하고, 개인정보 수집·이용 동의 항목은 반드시
  확인 후 체크합니다. 사진은 3개월 이내 촬영본을 사용하고, 기재 내용이 사실과 다르면 채용이
  취소될 수 있으므로 빠짐없이 정확하게 작성하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

blocks:
  - type: doc_title
    text: 입사지원서

  - type: grid
    widths: [16, 18, 16, 18, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["지원구분", "", "지원부문", "", "지원경로", ""]
    sample_rows:
      - ["", "신입", "", "마케팅", "", "사람인"]

  - type: grid
    widths: [13, 16, 11, 14, 12, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    merges:
      - [0, 6, 2, 6]
      - [1, 3, 1, 5]
      - [2, 1, 2, 5]
    photo_cell: [0, 6]
    photo_mm: [24, 32]
    rows:
      - ["성명", "", "생년월일", "", "성별", "", "사진"]
      - ["연락처", "", "이메일", "", "", "", ""]
      - ["주소", "", "", "", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1998-03-21", "", "남", ""]
      - ["", "010-1234-5678", "", "gildong.hong@example.com", "", "", ""]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "", "", "", ""]

  - type: subtitle
    text: 학력사항
  - type: table
    widths: [22, 30, 20, 16, 12]
    header: [재학기간, 학교명, 전공(학과), 졸업구분, 소재지]
    empty_rows: 2
    row_height_mm: 8
    sample_rows:
      - ["2015.03~2021.02", "한국대학교", "경영학과", "졸업", "서울"]

  - type: subtitle
    text: 경력사항
  - type: table
    widths: [22, 26, 18, 20, 14]
    header: [근무기간, 회사명, 부서/직위, 담당업무, 퇴직사유]
    empty_rows: 2
    row_height_mm: 8
    sample_rows:
      - ["2023.09~2025.03", "(주)한빛커머스", "마케팅팀 사원", "온라인 광고 운영", "이직"]

  - type: subtitle
    text: 병역 및 보훈
  - type: grid
    widths: [16, 18, 16, 18, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["병역구분", "", "복무기간", "", "계급", ""]
      - ["보훈대상", "", "장애여부", "", "", ""]
    sample_rows:
      - ["", "만기전역", "", "2016.05~2018.01", "", "병장"]
      - ["", "해당없음", "", "해당없음", "", ""]

  - type: subtitle
    text: 개인정보 수집·이용 동의
  - type: para
    text: 본인은 채용 전형을 위하여 위 기재한 개인정보를 회사가 수집·이용하는 것에 동의합니다. 수집된 정보는 채용 심사 목적으로만 사용하며, 전형 종료 후 관련 법령에서 정한 기간 동안 보관한 뒤 파기합니다. 동의하지 않을 권리가 있으나, 동의하지 않는 경우 채용 전형 진행이 제한될 수 있습니다.
    size: 10
  - type: table
    widths: [70, 15, 15]
    header: [동의 항목, 동의, 미동의]
    empty_rows: 1
    row_height_mm: 8
    sample_rows:
      - ["위와 같이 개인정보 수집·이용에 동의합니다.", "○", ""]

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    label: 지원자
    sample_names: [홍길동]

  - type: notice
    text: 채용절차의 공정화에 관한 법률에 따라 직무와 무관한 개인정보(가족의 학력·직업, 재산 등)는 요구·기재하지 않습니다.
