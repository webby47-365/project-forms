      - "통장 사본 1부"
      - "신청인 신분증 사본 1부"

  - type: para
    text: 위 신청인은 의료비 지원 신청 및 심사 목적으로 개인정보를 수집·이용하는 데 동의합니다.
    align: center
    size: 10
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    label: 신청인
    sample_names: [김서연]

  - type: notice
    text: 개인정보(건강정보 포함)의 수집 목적은 의료비 지원 신청 심사이며, 보유기간은 관계 법령에 따라 보관한 후 파기합니다.

  - type: notice
    text: 지원 대상·한도·심사 기준은 지원 기관마다 다르므로 담당 기관에 문의하십시오.

  - type: notice
    text: 본 서식은 참고용이며, 의학적 설명과 판단은 담당 의료진이 수행합니다. 기관별 양식이 따로 있는 경우 해당 기관 양식을 사용하십시오.
