id: medical-expense-support
title: 의료비 지원 신청서
category: welfare
subcategory: consent
tags: [의료비지원신청서, 진료비지원신청, 의료비지원신청양식, 병원비지원신청, 의료비지원서류]
summary: 진료비 지원을 신청하기 위해 진료 내역과 본인부담금, 신청 금액을 기재하는 서식입니다.
usage: >
  의료비 지원 제도를 통해 진료비의 일부를 지원받고자 할 때 작성하는 신청서입니다.
  진료기관과 진료 기간, 총 진료비와 본인부담금을 정확히 적고 진료비 영수증 등 증빙
  서류를 함께 제출해야 합니다. 지원금은 신청인이 적은 계좌로 입금되므로 예금주명과
  계좌번호를 다시 한번 확인하십시오. 지원 대상과 한도는 지원 기관의 기준에 따라
  다르므로 세부 사항은 담당 기관에 문의하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 신청인 성명과 연락처를 적습니다.
  - 진료기관과 진료 기간을 적습니다.
  - 총 진료비와 본인부담금을 적습니다.
  - 입금받을 계좌를 적습니다.
  - 진료비 영수증 등 증빙을 첨부합니다.

faq:
  - q: 지원 대상은 누구나 되나요?
    a: 아니요, 지원 대상과 한도는 지원 기관 기준에 따라 다르므로 담당 기관에 문의해야 합니다.
  - q: 계좌 정보는 왜 다시 확인하나요?
    a: 지원금이 잘못된 계좌로 입금되지 않도록 예금주명과 계좌번호를 정확히 맞춰야 합니다.

related: [medical-record-request, welfare-facility-application, long-term-care-application]

