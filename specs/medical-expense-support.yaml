    text: 의료비 지원 신청서
    spaced: false

  - type: subtitle
    text: 1. 신청인 정보

  - type: grid
    widths: [14, 22, 14, 22, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", "", "연락처", ""]
      - ["주소", "", "", "", "", ""]
    sample_rows:
      - ["", "김서연", "", "1985-11-03", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "", "", ""]

  - type: subtitle
    text: 2. 대상자 정보 (신청인과 다른 경우)

  - type: grid
    widths: [14, 22, 14, 22, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
