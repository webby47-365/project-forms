id: business-registration-poa
title: 사업자등록 신청 대리 위임장
category: public
subcategory: tax
tags: [사업자등록위임장, 사업자등록대리신청, 사업자등록신청위임장, 개업신고위임장, 세무서위임장]
summary: 사업자등록 신청을 대리인이 세무서에서 접수할 때 신청인과 대리인 정보·위임 범위를 적는 위임장입니다.
usage: >
  개업하는 사람이 직접 세무서에 갈 수 없어 가족·직원·세무대리인이 대신 사업자등록을 신청할 때
  쓰는 서류입니다. 신청인과 대리인의 인적사항, 사업장 소재지, 업종을 적고 위임 범위를 어디까지로
  하는지 분명히 해야 합니다. 등록증 수령까지 맡길지, 신청서 접수만 맡길지 구분해 적으면 대리인이
  받아 가는 서류의 범위가 정해집니다. 접수 시 대리인의 신분증과 신청인의 신분증 사본 등 필요한
  서류는 관할 세무서 안내를 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 신청인의 성명·연락처와 사업장 정보를 적습니다.
  - 대리인의 성명·연락처와 신청인과의 관계를 적습니다.
  - 위임 범위에서 접수와 등록증 수령 여부를 표시합니다.
  - 신청인이 서명 또는 날인하고 대리인에게 전달합니다.

faq:
  - q: 등록증 수령까지 맡길 수 있나요?
    a: 위임 범위에 등록증 수령을 표시하면 맡길 수 있습니다. 세무서에서 요구하는 확인 서류는 미리 확인하십시오.
  - q: 대리인은 꼭 가족이어야 하나요?
    a: 관계에 제한을 두지 않지만, 세무서가 대리인 신분 확인을 요구할 수 있으니 신분증을 준비합니다.
  - q: 위임장 유효기간이 있나요?
    a: 정해진 기간은 없어 위임 기간을 직접 적어 두는 것이 좋습니다. 접수 후에는 효력이 끝나는 것으로 적습니다.

related: [business-reg-checklist, gov-business-registration-individual, vat-filing-poa, power-of-attorney]

