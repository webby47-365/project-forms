id: traffic-fine-payment-proxy-confirmation
title: 교통 과태료 대납 확인서
category: public
subcategory: vehicle
tags: [과태료대납확인서, 교통과태료 대납, 과태료 납부 확인, 주정차 과태료, 과태료 정산]
summary: 다른 사람의 교통 과태료를 대신 납부했을 때 납부 내역과 상환 약속을 서로 확인해 두는 대납 확인서 양식입니다.
usage: >
  차량을 빌려 쓰다 생긴 주정차·속도위반 과태료를 차량 소유자나 운전자가 대신 낸 경우, 누가 어떤 건을 얼마에 냈는지 남기는 문서입니다.
  부과 일자와 고지서 번호, 납부액, 납부일을 적고 상환 방법을 합의해 둡니다.
  과태료의 부과 대상과 이의 절차는 고지서 안내를 따르며, 이 문서는 당사자 사이의 정산 확인용입니다.
source: original
featured: false
target_pages: 1
howto:
  - 차량번호와 대납한 사람, 상환할 사람의 정보를 적습니다.
  - 고지서의 부과일, 위반 내용, 납부액을 옮겨 적습니다.
  - 상환 금액과 기한, 방법을 합의해 적습니다.
  - 날짜를 쓰고 두 사람이 서명합니다.
faq:
  - q: 대납하면 과태료 부과 대상이 바뀌나요?
    a: 아닙니다. 부과 대상은 고지서 기준이며 이 문서는 당사자 사이의 정산을 확인하는 용도입니다.
  - q: 납부 영수증도 함께 보관해야 하나요?
    a: 납부 영수증이나 이체 내역을 첨부해 두면 금액과 날짜를 다시 확인하기 쉽습니다.
  - q: 이의가 있는 과태료도 대납해도 되나요?
    a: 이의 절차는 고지서 안내를 따르십시오. 이의 중인 건은 납부 전에 당사자끼리 먼저 협의하는 편이 좋습니다.
related: [parking-fine-objection, traffic-violation-driver-confirmation, vehicle-use-consent, payment-pledge]
