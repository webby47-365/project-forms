id: cover-letter-experienced
title: 자기소개서 (경력용)
category: personal
subcategory: career
tags: [자기소개서, 자소서, 경력직, 이직 자기소개서, 경력요약, cover letter]
summary: 경력 요약과 주요 성과, 직무 전문성을 중심으로 구성한 경력직 지원자용 자기소개서 양식입니다.
usage: >
  이직이나 경력직 채용에 지원할 때 이력서·경력기술서와 함께 제출하는 서술형 서류입니다.
  경력 요약은 핵심 역량을 두괄식으로 제시하고, 주요 성과는 가능한 한 수치로 증명합니다.
  직무 전문성에는 보유 도구와 방법론을 구체적으로 쓰고, 이직 사유는 부정적 표현보다
  성장 지향적인 이유로 서술하는 편이 좋습니다. 기여 방안은 단기·중기로 나누어 작성하십시오.
source: original
featured: false
target_pages: 1
series: cover-letter
series_name: 자기소개서
variant: 경력용
variant_rank: 3
version: 1
created_by: agent
status: published

blocks:
  - type: doc_title
    text: 자기소개서

  - type: grid
    widths: [14, 20, 14, 20, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "연락처", "", "이메일", ""]
      - ["총 경력연수", "", "최종직위", "", "희망직무", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678", "", "gildong.hong@example.com"]
      - ["", "5년 2개월", "", "대리", "", "마케팅 기획"]

  - type: subtitle
    text: 1. 경력 요약
  - type: textbox
    hint: "핵심 경력과 보유 역량을 두괄식으로 600자 내외로 작성하십시오."
    height_mm: 26
    sample_text: 전략기획 및 마케팅 분야에서 5년간 근무하며 신규 사업 기획과 광고 예산 운영 경험을 쌓았습니다. (주)한빛커머스에서는 온라인 광고 운영을 맡아 매출 성장을 견인했고, (주)새길데이터에서는 사업계획 수립과 타 부서 협업을 주도했습니다. 데이터 기반 의사결정과 일정 관리 역량을 바탕으로 새로운 조직에서도 빠르게 기여할 수 있습니다.

  - type: subtitle
    text: 2. 주요 성과
  - type: textbox
    hint: "담당 업무에서 낸 성과를 수치로 증명하여 600자 내외로 작성하십시오."
    height_mm: 26
    sample_text: 온라인 광고 운영 담당 시절 채널별 예산 재배분으로 광고 전환율을 18% 개선했고, 분기별 성과 리포트를 체계화해 의사결정 속도를 높였습니다. 사업기획 업무에서는 신규 제휴 채널 3곳을 발굴해 연간 매출 목표의 12%에 해당하는 추가 매출을 확보했습니다. 두 사례 모두 목표 수치를 설정하고 중간 점검을 반복하며 달성한 성과입니다.

  - type: subtitle
    text: 3. 직무 전문성
  - type: textbox
    hint: "보유한 직무 지식과 활용 도구, 방법론을 중심으로 작성하십시오."
    height_mm: 26
    sample_text: 디지털 마케팅 전략 수립, 광고 매체 운영, 데이터 분석 도구를 활용한 성과 측정에 전문성을 갖추고 있습니다. 구글 애널리틱스와 엑셀을 활용한 보고서 작성에 능숙하며, 사업계획서 작성과 예산 편성 경험도 보유하고 있습니다. 직무 전환이 있었던 만큼 마케팅과 기획을 모두 이해하는 점이 강점입니다.

  - type: subtitle
    text: 4. 이직 사유 및 지원 동기
  - type: textbox
    hint: "이전 직장에 대한 불만보다 성장 지향적인 이유로 작성하십시오."
    height_mm: 26
    sample_text: 현재 회사에서도 많은 것을 배웠지만, 보다 큰 규모의 예산과 다양한 채널을 다루며 전문성을 넓히고 싶어 이직을 결심했습니다. 귀사는 데이터 기반 마케팅 조직 문화가 잘 정착되어 있어 제 역량을 발휘하고 함께 성장하기에 적합한 곳이라 판단했습니다. 특히 최근 확장하는 신사업 영역에서 기여하고 싶습니다.

  - type: subtitle
    text: 5. 입사 후 기여 방안
  - type: textbox
    hint: "단기·중기로 나누어 구체적인 기여 계획을 작성하십시오."
    height_mm: 26
    sample_text: 입사 후에는 기존 광고 운영 노하우를 빠르게 적용해 단기간 내 성과 지표를 안정화하겠습니다. 이후에는 팀 내 데이터 분석 체계를 구축해 의사결정에 걸리는 시간을 줄이고, 신규 채널 발굴로 매출 성장에 기여하겠습니다. 축적한 경험을 후배 구성원과 공유해 조직 전체의 역량 향상에도 힘쓰겠습니다.

  - type: para
    text: 위 내용은 사실과 다름이 없음을 확인합니다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    label: 지원자
    sample_names: [홍길동]
