id: lease-termination-notice
title: 임대차계약 해지통보서
category: legal
subcategory: contract
tags: [임대차 해지통보서, 계약해지 통지, 갱신거절 통보, 내용증명 임대차, 계약만료 통보]
summary: 임대차 목적물과 계약 내용을 특정해 해지 의사와 해지일·보증금 반환을 통보하는 서식입니다.
usage: >
  임대인이나 임차인이 임대차계약을 끝내겠다는 뜻을 상대방에게 서면으로 알리는 문서입니다.
  목적물의 소재지와 계약일·기간을 정확히 적어 어떤 계약에 대한 통보인지 특정하십시오. 해지
  사유와 해지 예정일을 명확히 적고, 보증금 반환 계좌와 명도 예정일을 함께 기재하면 정산이
  수월합니다. 통보 기한은 계약서와 관련 법령에 따라 다르므로 반드시 확인한 뒤 발송하고,
  도달 사실을 남기기 위해 내용증명 우편으로 보내는 것이 안전합니다. 발송 전 사본을 보관하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 임대차계약 해지통보서
    spaced: false
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["발신인(통보인)", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["수신인(피통보인)", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "김서연", "", "010-9876-5432"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
  - type: subtitle
    text: 2. 임대차계약의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["목적물 소재지", "", "", ""]
      - ["계약일자", "", "임대차 기간", ""]
      - ["보증금", "", "월 차임", ""]
      - ["통보인 지위", "임대인 / 임차인", "해지 예정일", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100, 202동 1503호", "", ""]
      - ["", "2024-10-01", "", "2024-10-01 ~ 2026-09-30"]
      - ["", "50,000,000원", "", "600,000원"]
      - ["", "임대인", "", "2026-09-30"]
  - type: subtitle
    text: 3. 통보 내용
  - type: para
    text: 본인은 위 임대차계약에 관하여 아래와 같은 사유로 계약을 해지(갱신 거절)하고자 하오니 확인하여 주시기 바랍니다.
    align: left
    size: 10.5
  - type: textbox
    hint: "해지 사유와 경위를 구체적으로 기재하십시오. (예: 계약기간 만료, 갱신 거절, 차임 연체 등)"
    height_mm: 40
    sample_text: 본 임대차계약은 2026년 9월 30일로 계약기간이 만료됩니다. 임대인은 계약을 갱신하지 않고 종료하고자 하며, 명도 및 보증금 반환 절차를 계약기간 만료일에 맞추어 진행하고자 합니다.
  - type: subtitle
    text: 4. 보증금 반환 및 명도
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["명도 예정일", "", "정산 예정일", ""]
      - ["보증금 반환계좌", "", "", ""]
      - ["공제 예정 항목", "미납 차임 / 관리비 / 원상복구비", "기타", ""]
    sample_rows:
      - ["", "2026-09-30", "", "2026-09-30"]
      - ["", "한빛은행 000-000000-00-000 (예금주: 김서연)", "", ""]
      - ["", "미납액 없음", "", "-"]
  - type: para
    text: 위와 같이 통보합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    label: 통보인
    sample_names: [홍길동]
  - type: notice
    text: 해지 통보 기한과 요건은 계약서 및 관련 법령에 따라 다르므로 확인 후 발송하시고, 도달 증거를 남기려면 내용증명 우편을 이용하십시오.
