id: witness-application
title: 증인신청서
category: legal
subcategory: litigation
tags: [증인신청서, 증인신청, 민사소송증인, 증인채택, 증거신청]
summary: 소송에서 증인을 신청할 때 사건 정보, 증인 인적사항, 증명할 사실과 신문 예정 사항을 적는 신청서 양식입니다.
usage: >
  진행 중인 민사 사건에서 사실관계를 아는 사람을 법정에 불러 진술을 듣고 싶을 때 법원에
  제출하는 신청서의 일반 양식입니다. 사건번호와 당사자, 증인의 이름·연락처, 그리고 증인으로
  증명하려는 사실을 분명히 적어야 합니다. 신문할 내용은 사건과 관련된 사실만 간단히 정리하고
  판단이나 주장은 준비서면에 적는 것이 좋습니다. 제출 방식과 서식은 담당 재판부 안내를
  확인하십시오. 본 서식은 틀만 제공하며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 법원, 사건번호, 사건명과 당사자를 적습니다.
  - 증인의 이름과 연락처, 신청인과의 관계를 적습니다.
  - 증인으로 증명하려는 사실을 적습니다.
  - 신문할 내용을 정리하고 날짜와 서명을 적습니다.
faq:
  - q: 증인의 주소를 모르면 어떻게 하나요?
    a: 아는 연락 수단을 모두 적고, 제출 방식은 담당 재판부 안내를 확인하십시오.
  - q: 증인이 꼭 채택되나요?
    a: 아닙니다. 채택 여부는 재판부가 사건 관련성 등을 보고 판단합니다.
  - q: 신문할 내용은 얼마나 자세히 쓰나요?
    a: 질문 순서대로 핵심만 짧게 적습니다. 주장과 판단은 준비서면에 적는 편이 좋습니다.
related: [preparatory-brief, evidence-submission-list, hearing-date-change-request, statement-of-facts]
blocks:
  - type: doc_title
    text: 증 인 신 청 서
    spaced: false
  - type: subtitle
    text: 1. 사건의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["법원", "", "사건번호", ""]
      - ["사건명", "", "재판부", ""]
      - ["원고", "", "피고", ""]
    sample_rows:
      - ["", "○○지방법원", "", "2026가소00000"]
      - ["", "대여금", "", "제○단독"]
      - ["", "김서연", "", "박민준"]
  - type: subtitle
    text: 2. 증인의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["증인 성명", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["신청인과의 관계", "", "직업", ""]
    sample_rows:
      - ["", "이수현", "", "010-1234-5678"]
      - ["", "서울시 ○○구 ○○로 12", "", ""]
      - ["", "전 직장 동료", "", "회사원"]
  - type: subtitle
    text: 3. 증명하려는 사실
  - type: textbox
    hint: "증인으로 증명하려는 사실을 간단명료하게 적으십시오."
    height_mm: 22
    sample_text: "2026년 3월 10일 원고와 피고 사이에 금전 대여에 관한 대화가 있었다는 사실"
  - type: subtitle
    text: 4. 신문할 사항
  - type: textbox
    hint: "증인에게 물어볼 내용을 질문 순서대로 적으십시오."
    height_mm: 34
    sample_text: "1. 증인과 당사자의 관계 2. 당시 대화가 이루어진 장소와 시각 3. 대화에서 들은 내용 4. 그 밖에 기억하는 사정"
  - type: para
    text: 위와 같이 증인의 채택과 신문을 신청합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   16 일
  - type: sign_line
    label: 신청인
    sample_names: [김서연]
  - type: para
    text: ○○지방법원 귀중
    align: center
  - type: notice
    text: 제출 방식과 서식은 담당 재판부 안내를 확인하십시오.
