id: item-storage-confirmation
title: 물품 보관 확인서
category: personal
subcategory: life
tags: [물품보관, 짐보관, 보관확인서, 맡긴물건, 보관증]
summary: 이사나 장기 부재로 지인에게 짐을 맡길 때 품목과 보관 기간, 반환 방법을 적어 서로 확인하는 개인 간 물품 보관 확인서입니다.
usage: >
  이사 사이의 공백이나 해외 체류처럼 일정 기간 짐을 다른 사람에게 맡길 때 쓰는 서식입니다. 맡기는 사람과
  보관하는 사람, 품목과 맡길 당시 상태, 보관 기간과 장소를 적고 양쪽이 서명합니다. 보관 중 파손이나 분실
  때의 처리, 보관료 여부는 합의한 대로 특약란에 적어 둡니다. 귀중품은 사진을 함께 남기면 반환할 때 확인이
  쉽습니다.
source: original
featured: false
target_pages: 1
howto:
  - 맡기는 사람과 보관하는 사람을 적습니다.
  - 품목과 수량, 맡길 당시 상태를 함께 확인해 적습니다.
  - 보관 기간과 보관 장소를 적습니다.
  - 보관료와 파손·분실 때 처리를 적고 양쪽이 서명합니다.
faq:
  - q: 보관 기간이 지나도 못 찾으러 가면요?
    a: 미리 연락해 새 기간을 합의하고 확인서에 날짜를 고쳐 적은 뒤 서명해 두십시오.
  - q: 보관료를 꼭 받아야 하나요?
    a: 아닙니다. 받는다면 금액과 지급 시기를 특약란에 적어 두십시오.
related: [item-loan-confirmation, moving-checklist, secondhand-trade-confirmation, checklist]
blocks:
  - type: doc_title
    text: 물품 보관 확인서
    spaced: false
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["맡기는 사람", "", "연락처", ""]
      - ["보관하는 사람", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "김서연", "", "010-0000-0000"]
  - type: subtitle
    text: 2. 보관 물품
  - type: table
    widths: [32, 12, 56]
    header: [품목, 수량, 맡길 당시 상태]
    empty_rows: 4
    row_height_mm: 9
    sample_rows:
      - ["이삿짐 박스", "8", "테이프 봉합, 겉면 훼손 없음"]
      - ["자전거", "1", "앞바퀴 흠집 있음"]
  - type: subtitle
    text: 3. 기간 및 특약
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["보관 시작일", "", "반환 예정일", ""]
      - ["보관 장소", "", "보관료", ""]
    sample_rows:
      - ["", "2026-11-01", "", "2027-01-31"]
      - ["", "김서연 자택 창고", "", "없음"]
  - type: textbox
    hint: "파손·분실 때 처리 방법 등 합의 내용을 적으십시오."
    height_mm: 22
    sample_text: "보관 중 보관자의 부주의로 파손된 경우 수리비를 보관자가 부담합니다."
  - type: date_line
    sample_text: 2026 년   10 월   31 일
  - type: sign_line
    labels: ["맡기는 사람", "보관하는 사람"]
    sample_names: [홍길동, 김서연]
