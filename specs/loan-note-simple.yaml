id: loan-note-simple
title: 차용증 (간편형)
category: legal
subcategory: contract
tags: [차용증, 간편차용증, 금전차용증, 지불각서, 채무확인서]
summary: 차용금액과 변제기일·이자율을 간단히 정리해 절반 페이지 안에 작성하는 차용증입니다.
usage: >
  개인 간 소액을 빌려주고 받을 때 간단히 서면 증거를 남기기 위한 서식입니다. 차용금액은
  숫자와 한글을 함께 적고, 변제기일과 이자율, 송금계좌를 명확히 기재해야 나중의 분쟁을
  막을 수 있습니다. 실제로 계좌이체 기록을 함께 남겨 두는 것이 좋습니다. 금액이 크거나
  분할 상환이 필요한 경우에는 연대보증인을 포함한 차용증이나 공증을 이용하는 것이
  안전합니다.
source: original
featured: false
series: loan-note
series_name: 차용증
variant: 간편형
variant_rank: 2
target_pages: 1
version: 1
created_by: agent
status: published

variant_use: 소액을 간단히 빌려주고 받을 때 짧게 작성합니다.

howto:
  - 채권자와 채무자의 인적사항을 적습니다.
  - 차용금액을 숫자와 한글로 함께 기재합니다.
  - 변제기일과 이자율을 적습니다.
  - 송금계좌 정보를 기재합니다.
  - 양측이 서명 또는 날인합니다.

faq:
  - q: 이자를 안 받기로 하면 어떻게 적나요?
    a: 이자율 칸에 무이자라고 적으면 됩니다.
  - q: 계좌이체 기록도 함께 남겨야 하나요?
    a: 네, 차용증과 함께 이체 내역을 보관하면 분쟁을 예방하는 데 도움이 됩니다.

blocks:
  - type: doc_title
    text: 차용증
  - type: para
    text: 채권자와 채무자는 다음과 같이 금전소비대차계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["채권자(대여인)", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["채무자(차용인)", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "김서연", "", "1980-02-14"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "홍길동", "", "1990-07-22"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-9876-5432"]
  - type: subtitle
    text: 차용 조건
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["차용금액", "", "차용일", ""]
      - ["변제기일", "", "이자율", ""]
      - ["변제방법", "", "송금계좌", ""]
    sample_rows:
      - ["", "금 10,000,000원 (금 일천만원)", "", "2026-10-05"]
      - ["", "2027-04-05", "", "연 5%"]
      - ["", "변제기일에 일괄 상환", "", "한빛은행 000-000000-00-000"]
  - type: para
    text: 채무자는 위 차용금액을 채권자로부터 현실로 수령하였음을 확인하고, 위 조건에 따라 성실히 변제할 것을 약속한다.
    align: both
    size: 10
  - type: article
    heading: 제1조 (차용금의 수령)
    lines:
      - "채무자는 위 차용금액을 채권자로부터 수령하였음을 확인한다."
  - type: article
    heading: 제2조 (변제)
    lines:
      - "채무자는 위 변제기일까지 차용금액과 이자를 채권자가 지정한 계좌로 송금하여 변제한다."
  - type: article
    heading: 제3조 (이자와 지연손해금)
    lines:
      - "이자는 위 이자율에 따라 계산하며, 변제기일까지 변제하지 않을 경우 그 다음 날부터 완제일까지 지연손해금을 가산한다."
      - "이자율은 이자제한법이 정하는 최고이자율을 초과할 수 없다."
  - type: article
    heading: 제4조 (관할)
    lines:
      - "본 계약에 관한 분쟁은 채권자의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["채권자", "채무자"]
    sample_names: ["김서연", "홍길동"]
  - type: notice
    text: 금액이 크거나 분할 상환이 필요한 경우 연대보증인을 포함한 차용증을 사용하거나 공증·내용증명으로 증거력을 보강하는 것이 안전합니다.
