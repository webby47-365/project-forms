id: freelance-contract
title: 프리랜서 계약서
category: legal
subcategory: contract
tags: [프리랜서 계약서, 용역계약서, 외주 계약서, 업무위탁 계약, 도급계약서]
summary: 업무 범위·산출물·용역대금과 저작권 귀속, 비밀유지를 정하는 프리랜서 용역계약서입니다.
usage: >
  개인 사업자나 프리랜서에게 업무를 위탁할 때 체결하는 계약서입니다. 업무 범위와 산출물,
  납품 기한을 구체적으로 적어야 추가 요청을 둘러싼 다툼을 줄일 수 있습니다. 용역대금은 지급
  시기와 방법, 수정 횟수 포함 여부를 함께 정하고 원천징수 여부를 명시하십시오. 산출물의
  저작권을 누가 갖는지, 포트폴리오 사용이 가능한지 반드시 합의해 기재해야 합니다. 프리랜서
  계약이라도 실질이 근로관계로 판단될 수 있으므로 지휘·감독 관계와 근로자성 여부는 제출처
  또는 전문가 기준을 확인하십시오.
source: original
featured: false
target_pages: 2
howto:
  - 위탁 업무 범위와 산출물, 납품 기한을 정합니다.
  - 용역대금과 지급 시기, 수정 횟수를 정합니다.
  - 저작권 귀속과 포트폴리오 사용 가능 여부를 정합니다.
  - 비밀유지 조항을 확인하고 서명합니다.

faq:
  - q: 원천징수는 누가 처리하나요?
    a: 계약서에 원천징수 여부를 명시하고 통상 위탁자가 세금을 뗀 나머지를 지급합니다.
  - q: 실질이 근로자로 판단될 수도 있나요?
    a: 지휘·감독을 받으며 정해진 시간에 근무하면 근로자로 볼 수 있어 전문가 확인이 필요합니다.

blocks:
  - type: doc_title
    text: 프리랜서 용역계약서
    spaced: false
  - type: para
    text: 위탁자와 수탁자는 다음과 같이 용역계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 계약 개요
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [3, 1, 3, 3]
    rows:
      - ["용역명(프로젝트명)", "", "", ""]
      - ["계약기간", "20   년  월  일 ~ 20   년  월  일", "납품기한", ""]
      - ["용역대금", "금                        원정", "원천징수", "해당 / 비해당"]
      - ["업무 수행 장소", "", "", ""]
    sample_rows:
      - ["", "웹사이트 리뉴얼 개발 용역", "", ""]
      - ["", "2026-09-20 ~ 2026-11-25", "", "2026-11-30"]
      - ["", "금 5,000,000원정 (금 오백만원)", "", "해당"]
      - ["", "(주)한빛커머스 본사 및 재택 병행", "", ""]
  - type: subtitle
    text: 업무 범위 및 산출물
  - type: table
    widths: [8, 30, 28, 18, 16]
    header: ["No", 업무 내용, 산출물(형식), 완료 기한, 비고]
    empty_rows: 6
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "홈페이지 메인·서브 10페이지 디자인", "시안 PDF, 피그마 파일", "2026-10-15", "1차 시안"]
      - ["2", "반응형 웹 퍼블리싱 및 CMS 연동", "HTML/CSS 소스, 관리자 화면", "2026-11-10", "-"]
      - ["3", "검수 및 오류 수정 대응", "수정 반영본 전달", "2026-11-25", "-"]
  - type: article
    heading: 제1조 (목적 및 업무 범위)
    lines:
      - "수탁자는 위 표에 기재된 업무를 수행하고 산출물을 위탁자에게 인도한다."
      - "표에 기재되지 아니한 업무는 당사자가 서면으로 합의한 경우에 한하여 수행하며, 대가는 별도로 정한다."
  - type: article
    heading: 제2조 (용역대금의 지급)
    lines:
      - "위탁자는 용역대금을 착수금       %, 잔금       % 로 나누어 수탁자가 지정한 계좌로 지급한다."
      - "잔금은 산출물 인도 및 검수 완료일로부터        일 이내에 지급한다."
      - "원천징수 대상인 경우 관련 법령이 정하는 세액을 공제하고 지급한다."
  - type: page_break
  - type: article
    heading: 제3조 (수정 및 검수)
    lines:
      - "위탁자는 산출물 수령 후        일 이내에 검수하고 결과를 통지한다."
      - "계약 범위 내 수정은        회까지 포함하며, 이를 초과하는 수정은 별도 대가를 정하여 진행한다."
  - type: article
    heading: 제4조 (지식재산권의 귀속)
    lines:
      - "산출물에 관한 저작권 등 지식재산권은 용역대금 완납 시 위탁자에게 귀속한다. 다만 당사자가 달리 합의한 경우 특약사항에 따른다."
      - "수탁자는 산출물을 본인의 포트폴리오로 사용할 수 있다. 다만 비공개 자료는 위탁자의 사전 동의를 받는다."
      - "수탁자는 제3자의 권리를 침해하지 아니하는 산출물을 제공할 책임을 진다."
  - type: article
    heading: 제5조 (비밀유지)
    lines:
      - "당사자는 업무 수행 중 알게 된 상대방의 영업비밀과 개인정보를 제3자에게 누설하지 아니한다."
      - "본 조의 의무는 계약 종료 후에도 존속한다."
  - type: article
    heading: 제6조 (계약의 해지 및 지체)
    lines:
      - "수탁자가 정당한 사유 없이 납품기한을 지키지 못한 경우 위탁자는 지체일수에 대하여 합의한 지체상금을 청구할 수 있다."
      - "당사자 일방이 계약상 의무를 중대하게 위반한 경우 상대방은 상당한 기간을 정해 시정을 요구한 후 계약을 해지할 수 있다."
  - type: article
    heading: 제7조 (기타)
    lines:
      - "본 계약은 위임 또는 도급 관계로서 근로계약이 아니며, 수탁자는 업무 수행 방법을 스스로 정한다."
      - "본 계약에 정하지 아니한 사항은 관계 법령과 상관례에 따르며, 분쟁은 당사자가 합의한 법원을 관할로 한다."
  - type: textbox
    hint: "특약사항 — 저작권 귀속 범위, 2차적 저작물 이용, 비용 부담, 재위탁 가능 여부 등을 기재하십시오."
    height_mm: 26
    sample_text: 산출물의 2차적 저작물 이용권은 위탁자에게 있으며, 수탁자는 비공개 자료를 제외한 산출물을 본인 포트폴리오에 게재할 수 있다. 재위탁은 위탁자의 사전 서면 동의를 받아야 한다.
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["위탁자", "상호(성명)", "", "대표자", ""]
      - ["", "주소", "", "연락처", ""]
      - ["수탁자", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "박민준"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "홍길동", "", "1990-03-05"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-9876-5432"]
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["위탁자", "수탁자"]
    sample_names: [박민준, 홍길동]
  - type: notice
    text: 계약 형태에 따라 근로자성 판단과 세무 처리가 달라질 수 있으므로 제출처 또는 전문가 기준을 확인하십시오.
