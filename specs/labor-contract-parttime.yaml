id: labor-contract-parttime
title: 단시간 근로계약서
category: corp
subcategory: hr
tags: [단시간 근로계약서, 파트타임 근로계약서, 알바 근로계약서, 시간제 근로계약, 근로계약서]
summary: 주 소정근로시간이 통상근로자보다 짧은 단시간(파트타임) 근로자용 근로계약서입니다.
usage: >
  하루 또는 1주의 소정근로시간이 통상근로자보다 짧은 단시간(파트타임·아르바이트) 근로자를
  채용할 때 사용합니다. 근로기준법과 기간제법은 단시간 근로자에게 근로일별 근로시간을
  서면으로 명시하도록 정하고 있으므로 요일별 시업·종업·휴게시간을 표에 정확히 기재하십시오.
  초과근로 동의와 주휴수당 지급 기준도 함께 확인해 작성하고, 작성 후 2부를 만들어 각각
  보관하십시오.
source: law-standard
source_note: 근로기준법 제17조 및 기간제법 제17조에 따른 필수 기재사항 반영
featured: false
target_pages: 2
series: labor-contract
series_name: 근로계약서
variant: 단시간
variant_rank: 3
version: 1
created_by: agent
status: published
variant_use: 소정근로시간이 짧은 파트타임·아르바이트 채용에 씁니다.

howto:
  - 근로자와 사업주 정보를 적습니다.
  - 근로계약기간과 근무 장소, 업무 내용을 적습니다.
  - 요일별 시업·종업 시간과 휴게시간을 표에 적습니다.
  - 시급 등 임금과 지급일을 적습니다.
  - 양쪽이 서명하고 각각 한 부씩 보관합니다.

faq:
  - q: 요일마다 근무시간이 다르면 어떻게 적나요?
    a: 근로일별 근무표에 요일마다 시업·종업·휴게시간을 따로 적으면 됩니다.
  - q: 초과근로는 시켜도 되나요?
    a: 정해진 근로시간을 넘겨 일하려면 근로자의 동의가 필요하며, 동의 여부를 계약서에 표시해 두십시오.

blocks:
  - type: doc_title
    text: 단시간 근로계약서
    spaced: false
  - type: para
    text: 사업주(이하 "사용자")와 근로자는 다음과 같이 단시간 근로계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 당사자
  - type: grid
