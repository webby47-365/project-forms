  - type: kv_list
    items:
      - "단시간 근로자도 근로조건에 따라 4대 보험 가입 대상에 해당할 수 있으므로 법령이 정하는 바에 따라 가입한다."
      - "연차유급휴가는 근로기준법이 정하는 바에 따라 소정근로시간에 비례하여 부여한다."
      - "사용자는 근로계약 체결과 동시에 본 계약서 1부를 근로자에게 교부한다."
      - "본 계약에 정하지 않은 사항은 근로기준법 및 취업규칙에 따른다."
  - type: para
    text: 위 계약 내용을 확인하고 이에 동의하여 각자 서명·날인한 후 각 1부씩 보관한다.
    align: center
    size: 10
  - type: date_line
