id: academy-attendance
title: 학원 출결 관리표
category: edu
subcategory: school
tags: [학원출결관리표, 학원출결부, 수강생출결, 출결관리, 학원출석부]
summary: 반별 수강생의 회차별 출결을 표시하고 출석률을 관리하는 학원 출결 관리표입니다.
usage: >
  학원이나 교습소에서 반별 수강생의 출결을 회차마다 표시해 관리하는 서식입니다. 반 정보에
  과목과 담당강사, 수업 요일·시간을 먼저 적어 두고, 회차가 진행될 때마다 출결 기호로
  표시합니다. 출석률 칸은 출석 회차를 총 회차로 나누어 계산해 적으면 보호자 상담이나
  환불 처리 때 근거 자료로 활용할 수 있습니다. 출결 기호의 의미는 범례를 참고해 통일해서
  사용하고, 특이사항이 있으면 하단에 간단히 기록해 두십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

howto:
  - 반 정보에 과목과 담당강사, 수업 요일·시간을 적습니다.
  - 수강생 명단을 적습니다.
  - 회차별로 출결 기호로 표시합니다.
  - 출석 회차를 총 회차로 나눠 출석률을 계산합니다.
  - 특이사항이 있으면 하단에 기록합니다.

faq:
  - q: 출결 기호는 정해져 있나요?
    a: 범례에 맞춰 출석·결석·지각 등 기호 의미를 통일해서 사용하면 됩니다.
  - q: 출석률은 상담에도 쓰이나요?
    a: 네, 보호자 상담이나 환불 처리 때 근거 자료로 활용할 수 있습니다.

related: [course-registration, tuition-refund-request, counseling-log]

blocks:
  - type: doc_title
    text: 학원 출결 관리표

  - type: subtitle
    text: 1. 반 정보

  - type: grid
    widths: [14, 22, 14, 14, 14, 22]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["반명", "", "과목", "", "담당강사", ""]
      - ["수업 요일·시간", "", "", "", "기간", ""]
    sample_rows:
      - ["", "중등 수학 종합반", "", "수학", "", "김서연"]
      - ["", "화·목 18:00~19:30", "", "", "", "2026.09"]

  - type: subtitle
    text: 2. 출결 현황

  - type: table
    widths: [6, 16, 8, 8, 8, 8, 8, 8, 8, 10, 12]
    header: ["No", 성명, "1회", "2회", "3회", "4회", "5회", "6회", "7회", "8회", 출석률]
    empty_rows: 10
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "홍길동", "○", "○", "○", "△", "○", "○", "○", "○", "100%"]
      - ["2", "이수현", "○", "○", "×", "○", "○", "○", "○", "○", "88%"]
      - ["3", "박민준", "○", "×", "○", "○", "", "", "", "", ""]

  - type: subtitle
    text: 3. 출결 기호 범례

  - type: kv_list
    items:
      - "○ : 출석"
      - "△ : 지각"
      - "× : 결석"
      - "/ : 보강"

  - type: subtitle
    text: 4. 특이사항

  - type: textbox
    hint: "결석·보강 등 특이사항을 간단히 기록하십시오."
    height_mm: 18
    sample_text: 이수현 학생은 3회차 결석 후 보강 수업으로 진도를 보충함.

  - type: notice
    text: 이 관리표의 출결 정보는 학습 관리 목적으로만 수집하며, 수강 종료 후 학원 규정에서 정한 보유기간이 지나면 파기합니다.
