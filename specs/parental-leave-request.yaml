id: parental-leave-request
title: 육아휴직 신청서
category: corp
subcategory: hr
tags: [육아휴직 신청서, 육아휴직원, 출산휴가, 양육휴직, 모성보호]
summary: 자녀 정보와 육아휴직 기간·분할 사용 여부, 복직 예정일을 기재하는 육아휴직 신청서입니다.
usage: >
  만 8세 이하 또는 초등학교 2학년 이하의 자녀를 양육하기 위해 육아휴직을 신청할 때
  사용하는 서류입니다. 자녀의 성명·생년월일·관계와 희망 휴직기간, 분할 사용 여부를
  기재하고 휴직 중 연락 가능한 연락처와 복직 예정일을 명시합니다. 사업주는 법령상
  정당한 사유가 없으면 육아휴직을 거부할 수 없으므로 신청서는 휴직 예정일 30일 전까지
  제출하는 것을 권장합니다. 세부 요건은 남녀고용평등법과 사내 규정을 확인하십시오.
source: law-standard
source_note: 남녀고용평등과 일·가정 양립 지원에 관한 법률 제19조 반영
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
howto:
  - 신청인의 인적사항과 소속을 적습니다.
  - 자녀의 성명, 생년월일, 관계를 기재합니다.
  - 희망 휴직기간과 분할 사용 여부를 적습니다.
  - 휴직 중 연락처와 복직 예정일을 기재합니다.
  - 휴직 예정일 30일 전까지 제출합니다.

faq:
  - q: 육아휴직을 여러 번 나눠 쓸 수 있나요?
    a: 네, 분할 사용 여부 칸에 희망 횟수를 적어 신청할 수 있습니다.
  - q: 회사가 육아휴직을 거부할 수 있나요?
    a: 법령상 정당한 사유가 없으면 거부할 수 없습니다.

