id: expense-evidence-explanation
title: 경비 증빙 소명서
category: public
subcategory: tax
tags: [증빙소명서, 경비소명, 영수증분실, 증빙누락, 비용소명]
summary: 영수증이나 세금계산서 같은 증빙이 없거나 부족한 지출 내역의 사유와 사용처를 설명해 두는 경비 증빙 소명서 양식입니다.
usage: >
  지출은 했지만 영수증을 잃어버렸거나 받지 못한 경우, 그 사실과 지출 내용을 따로 적어 장부와 함께 보관하는
  문서입니다. 지출일, 금액, 사용처, 사용 목적을 항목별로 적고 증빙이 없는 사유를 설명합니다. 이 문서가 증빙을
  완전히 대신하는 것은 아니며 세무상 인정 여부는 별도로 판단되므로 가능한 한 계좌이체 내역이나 카드 명세 같은
  보조 자료를 함께 붙이고, 세무 처리는 세무 전문가나 관할 세무서에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 작성자와 소명 대상 기간을 적습니다.
  - 지출일, 금액, 사용처, 목적을 항목별로 적습니다.
  - 증빙이 없는 사유와 보조 자료를 적습니다.
  - 작성일과 서명을 적고 장부와 함께 보관합니다.
faq:
  - q: 이 소명서만 있으면 비용 인정이 되나요?
    a: 보장되지 않습니다. 인정 여부는 별도로 판단되므로 이체 내역 같은 보조 자료를 함께 보관하십시오.
  - q: 금액이 작아도 써야 하나요?
    a: 회사 내부 기준에 따릅니다. 소액은 월 단위로 묶어 한 장에 적는 곳도 있습니다.
  - q: 보조 자료는 어떤 것이 좋나요?
    a: 계좌이체 내역, 카드 승인 내역, 거래 상대방의 확인서 등 지출 사실을 보여 주는 자료가 쓰입니다.
related: [expense-report, receipt, payment-confirmation, vat-filing-document-confirmation]
blocks:
  - type: doc_title
    text: 경비 증빙 소명서
    spaced: false
  - type: subtitle
    text: 1. 작성자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["상호(성명)", "", "작성일", ""]
      - ["소명 기간", "", "담당자", ""]
    sample_rows:
      - ["", "한빛공방", "", "2026-10-14"]
      - ["", "2026-09-01 ~ 2026-09-30", "", "홍길동"]
  - type: subtitle
    text: 2. 증빙 미비 지출 내역
  - type: table
    widths: [6, 16, 16, 24, 24, 14]
    header: ["No", 지출일, 금액(원), 사용처, 사용 목적, 보조 자료]
    empty_rows: 7
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["1", "2026-09-05", "45,000", "○○문구", "포장 자재 구입", "이체내역"]
      - ["2", "2026-09-12", "30,000", "○○택배", "물품 발송 운임", "카드내역"]
      - ["3", "2026-09-20", "18,000", "○○주차장", "거래처 방문 주차", "없음"]
  - type: subtitle
    text: 3. 증빙이 없는 사유
  - type: textbox
    hint: "영수증을 받지 못했거나 분실한 경위를 사실대로 적으십시오."
    height_mm: 28
    sample_text: "소규모 가게에서 현금으로 결제하여 영수증을 받지 못했거나 이후 분실했습니다. 가능한 건은 이체 내역과 카드 내역을 함께 보관합니다."
  - type: para
    text: 위 내용은 사실과 다름이 없음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년    10 월    14 일
  - type: sign_line
    label: 작성자
    sample_names: [홍길동]
  - type: notice
    text: 세무상 인정 여부는 별도로 판단됩니다. 세무 처리는 세무 전문가나 관할 세무서에 확인하십시오.
