id: service-fee-refund-request
title: 송달료 환급 신청서
category: legal
subcategory: litigation
tags: [송달료환급, 송달료잔액, 송달료반환, 소송비용환급, 송달료신청]
summary: 소송이 끝난 뒤 쓰고 남은 송달료를 돌려받기 위해 사건 정보와 환급 계좌를 적어 제출하는 신청서입니다.
usage: >
  소송을 진행하며 미리 낸 송달료가 쓰고 남았을 때 잔액을 돌려받으려고 제출하는 서식입니다.
  사건번호와 사건명, 당사자를 적고 환급받을 계좌를 정확히 씁니다. 환급 대상 여부와 금액, 필요한
  서류는 법원 안내에 따르므로 접수 전에 해당 법원에 확인하십시오. 계좌번호는 자리만 확인하여
  적고 신청서 사본을 보관합니다. 신청서는 환급을 요청하는 문서이며 처리는 법원이 합니다.
source: original
featured: false
target_pages: 1
howto:
  - 신청인과 연락처를 적습니다.
  - 사건번호와 사건명, 법원을 적습니다.
  - 환급받을 은행과 계좌번호, 예금주를 적습니다.
  - 신청일을 적고 서명한 뒤 접수합니다.
faq:
  - q: 송달료는 언제 돌려받나요?
    a: 사건이 끝나고 남은 금액이 정해진 뒤입니다. 시기는 법원 안내를 확인하십시오.
  - q: 계좌는 본인 명의여야 하나요?
    a: 대체로 신청인 명의 계좌를 씁니다. 다른 명의가 가능한지는 법원에 확인하십시오.
  - q: 대리인이 신청해도 되나요?
    a: 위임장이 필요한 경우가 있습니다. 접수 법원의 안내를 먼저 확인하십시오.
related: [lawsuit-withdrawal, service-address-change-report, evidence-submission-list, hearing-date-change-request]
