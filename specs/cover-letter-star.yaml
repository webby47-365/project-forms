      - ["", "예선을 통과해 2주 안에 실제 수익모델을 검증할 시제품과 발표자료를 완성해야 했습니다."]
      - ["", "팀원 4명과 역할을 나눠 매일 저녁 모여 시장 조사와 프로토타입 제작을 병행했고, 멘토 피드백을 반영해 발표안을 세 번 수정했습니다."]
      - ["", "본선에 진출해 장려상을 받았고, 짧은 기간에도 목표를 쪼개어 실행하면 성과를 낼 수 있다는 확신을 얻었습니다."]

