id: cover-letter-star
title: 자기소개서 (항목형·STAR)
category: personal
subcategory: career
tags: [자기소개서, 자소서, STAR, 경험 기술, 항목형 자기소개서, cover letter]
summary: 문항별로 상황-과제-행동-결과(STAR)를 나누어 작성하는 경험 기술형 자기소개서 양식입니다.
usage: >
  직무 역량을 경험 중심으로 구체적으로 검증하려는 기업에서 자주 요구하는 항목형 자기소개서
  서식입니다. 문항마다 상황(Situation)-과제(Task)-행동(Action)-결과(Result) 순서로 칸을
  나누어 작성하면 두괄식으로 경험을 정리하기 쉽습니다. 행동 칸에는 본인이 실제로 한 일을
  구체적으로 쓰고, 결과 칸에는 가능한 한 수치나 변화로 마무리하십시오. 문항은 채용 공고의
  요구 역량에 맞게 바꾸어 사용할 수 있습니다.
source: original
featured: false
target_pages: 2
series: cover-letter
series_name: 자기소개서
variant: 항목형
variant_rank: 5
version: 1
created_by: agent
status: published

variant_use: 경험을 상황·과제·행동·결과로 나눠 밝힐 때 씁니다.

howto:
  - 문항이 요구하는 역량을 먼저 파악합니다.
  - 상황 칸에 당시 배경을 간단히 적습니다.
  - 과제 칸에 맡았던 목표나 문제를 적습니다.
  - 행동 칸에 본인이 실제로 한 일을 적습니다.
  - 결과 칸에 수치나 변화로 마무리합니다.

faq:
  - q: 항목 순서를 바꿔도 되나요?
    a: 채용 공고가 요구하는 역량에 맞게 문항 구성과 순서를 자유롭게 바꾸어 사용할 수 있습니다.
  - q: 결과가 수치로 안 나오면 어떻게 쓰나요?
    a: 수치가 없다면 주변의 평가나 이후 달라진 상황을 구체적으로 적어 결과를 보여주면 됩니다.

blocks:
