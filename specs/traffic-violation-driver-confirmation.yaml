id: traffic-violation-driver-confirmation
title: 교통법규 위반 운전자 확인서
category: public
subcategory: vehicle
tags: [운전자확인서, 위반운전자확인서, 과태료운전자확인, 교통위반운전자, 운전자지정서]
summary: 차량 소유자와 실제 운전자가 다를 때 위반 일시·장소와 실제 운전자 정보를 적어 제출하는 운전자 확인서입니다.
usage: >
  단속 카메라 등으로 교통법규 위반 통지를 받았는데 소유자가 아닌 가족·직원 등이 운전했을 때,
  실제 운전자를 밝히는 용도로 쓰는 서류입니다. 통지서의 차량번호와 위반 일시·장소·위반 내용을
  그대로 옮겨 적고 실제 운전자가 확인 서명을 합니다. 제출 방법과 기한, 필요 서류는 통지서에 적힌
  부과 기관의 안내를 따르므로 제출 전에 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 통지서를 보고 차량번호와 위반 일시·장소를 똑같이 옮겨 적습니다.
  - 차량 소유자의 성명과 연락처를 적습니다.
  - 실제 운전자의 성명·연락처와 소유자와의 관계를 적습니다.
  - 소유자와 운전자가 각각 서명하고 통지서의 제출처에 냅니다.

faq:
  - q: 운전자가 누구인지 기억나지 않으면 어떻게 하나요?
    a: 임의로 적지 말고 통지서에 적힌 부과 기관에 안내를 문의하십시오.
  - q: 운전자의 서명이 꼭 필요한가요?
    a: 제출처에 따라 요구가 다릅니다. 통지서의 안내를 확인하고 요구하면 운전자 서명을 받습니다.
  - q: 제출 기한이 있나요?
    a: 통지서에 기한이 적혀 있는 경우가 많으니 기한 안에 제출처 안내에 따라 냅니다.

related: [parking-fine-objection, administrative-objection, traffic-accident-confirmation, vehicle-use-request]

