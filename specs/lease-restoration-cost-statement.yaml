id: lease-restoration-cost-statement
title: 임대차 원상복구 비용 정산서
category: estate
subcategory: lease
tags: [원상복구비용, 보증금공제, 퇴거정산, 임대차정산, 원상복구]
summary: 임차인이 퇴거한 뒤 원상복구가 필요한 항목과 비용을 정리하고 보증금에서 공제할 금액을 임대인과 임차인이 함께 확인하는 정산서 양식입니다.
usage: >
  임대차가 끝나고 퇴거한 뒤 원상복구 비용을 두고 다툼이 생기지 않도록 항목별 금액을 적어 두는 서식입니다.
  목적물과 보증금을 적고, 복구가 필요한 항목마다 내용과 비용을 한 줄씩 적은 다음 보증금에서 공제할 금액과 반환액을 계산합니다.
  임대인과 임차인이 모두 확인하고 서명해 두면 나중에 근거가 됩니다.
  비용의 적정성은 계약서와 실제 견적서를 기준으로 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 목적물 주소와 보증금, 퇴거일을 적습니다.
  - 복구가 필요한 항목과 비용을 한 줄씩 적습니다.
  - 공제 합계와 보증금 반환액을 계산해 적습니다.
  - 양쪽이 내용을 확인하고 서명합니다.
faq:
  - q: 자연스러운 낡음도 복구 비용에 넣나요?
    a: 통상적인 사용에 따른 노후는 별도로 다툼이 될 수 있습니다. 계약서와 사진 자료를 함께 확인하십시오.
  - q: 견적서가 꼭 필요한가요?
    a: 필수는 아니지만 비용 근거가 되므로 있으면 첨부하는 것이 좋습니다.
  - q: 합의가 안 되면 어떻게 하나요?
    a: 합의된 항목만 먼저 정리하고, 남은 부분은 제출처나 관련 기관의 안내를 확인하십시오.
related: [move-out-checklist, lease-deposit-return-schedule-agreement, management-fee-settlement-confirmation, deposit-return-notice]
blocks:
  - type: doc_title
    text: 임대차 원상복구 비용 정산서
    spaced: false
  - type: subtitle
    text: 1. 목적물 및 보증금
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["목적물 주소", "", "", ""]
      - ["보증금", "", "퇴거일", ""]
      - ["임대인", "", "임차인", ""]
    sample_rows:
