id: move-in-report-poa
title: 전입신고 대리 위임장
category: public
subcategory: family
tags: [전입신고위임장, 전입신고대리, 전입신고대리인, 이사위임장, 전입신고대행]
summary: 이사 후 전입신고를 가족이나 다른 사람이 대신 할 때 위임인·대리인과 전입 주소를 적는 위임장입니다.
usage: >
  이사한 뒤 14일 안에 하는 전입신고를 본인이 직접 하지 못해 가족이나 지인이 대신 방문할 때 쓰는
  서류입니다. 세대주와 전입하는 사람, 대리인 정보와 전입 주소를 적고 위임인이 서명 또는 날인합니다.
  주민센터에서는 대리인 신분증과 위임인 신분증 사본을 요구하는 경우가 많으니 함께 준비하십시오.
  같은 세대원끼리 신고할 때는 위임장 없이 가능한 경우도 있어 접수처 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 위임인(전입하는 사람) 정보를 적습니다.
  - 대리인의 성명·관계·연락처를 적습니다.
  - 이전 주소와 새 전입 주소, 이사한 날을 적습니다.
  - 위임인이 서명 또는 날인합니다.
faq:
  - q: 대리인은 어떤 서류를 가져가나요?
    a: 대리인 신분증과 위임인 신분증 사본이 필요한 경우가 많습니다. 접수처에 먼저 확인하십시오.
  - q: 온라인으로 신고하면 위임장이 필요 없나요?
    a: 정부24 등으로 본인이 직접 신고하면 위임장이 필요 없습니다. 방문 대리 신고일 때만 씁니다.
related: [gov-move-in-report, moving-in-report, housing-lease-contract, gov-household-check-request]
blocks:
  - type: doc_title
    text: 전입신고 대리 위임장
    spaced: false
  - type: para
    text: 본인은 아래 대리인에게 전입신고에 관한 권한을 위임합니다.
    align: center
  - type: subtitle
    text: 1. 위임인 (전입하는 사람)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "세대주와 관계", ""]
    sample_rows:
      - ["", "홍길동", "", "1995-01-01"]
      - ["", "010-1234-5678", "", "본인(세대주)"]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "위임인과 관계", ""]
      - ["생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "동생"]
      - ["", "1998-01-01", "", "010-9876-5432"]
  - type: subtitle
    text: 3. 전입 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [1, 1, 1, 3]
    rows:
      - ["이전 주소", "", "", ""]
      - ["전입 주소", "", "", ""]
      - ["이사한 날", "", "전입 인원", ""]
    sample_rows:
      - ["", "서울특별시 관악구 신림로 10", "", ""]
      - ["", "서울특별시 마포구 월드컵북로 100, 101동 202호", "", ""]
      - ["", "2026-09-25", "", "1명"]
  - type: subtitle
    text: 4. 위임 범위
  - type: table
    widths: [70, 30]
    header: [위임 사항, 표시(○)]
    empty_rows: 3
    row_height_mm: 8
    sample_rows:
      - ["전입신고서 작성 및 제출", "○"]
      - ["확정일자 신청", ""]
  - type: para
    text: 위 위임 내용은 본인의 의사에 따른 것임을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년    9 월   28 일
  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 필요 서류는 주민센터 또는 정부24 안내를 확인하십시오.
