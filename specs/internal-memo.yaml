id: internal-memo
title: 내부 보고서
category: corp
subcategory: admin
tags: [내부 보고서, 업무보고서, 사내 보고, 보고서 양식, 업무 리포트]
summary: 보고 목적·현황·문제점·대안과 건의사항을 항목별로 정리해 상신하는 내부 보고서입니다.
usage: >
  업무 진행 상황이나 검토 결과를 상급자에게 보고할 때 쓰는 사내 문서입니다. 첫머리의 보고
  요지에 결론을 먼저 적고 근거를 뒤에 배치하면 읽는 사람이 빠르게 판단할 수 있습니다. 현황은
  수치와 사실 위주로 쓰고, 문제점과 대안은 짝을 이루도록 정리하십시오. 의사결정이 필요한
  사항은 건의사항 칸에 선택지 형태로 명확히 적습니다. 후속조치 표에는 담당자와 기한을 반드시
  지정해 보고가 실행으로 이어지게 하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 보고 요지에 결론을 먼저 한 줄로 적습니다.
  - 현재 상황을 수치와 사실 위주로 정리합니다.
  - 문제점과 대안을 짝지어 적습니다.
  - 건의사항을 선택지 형태로 명확히 적습니다.
  - 후속조치 표에 담당자와 기한을 정합니다.

faq:
  - q: 보고서와 기안서는 다른가요?
    a: 기안서는 결재를 받아 시행하는 문서이고, 보고서는 현황과 의견을 전달하는 문서입니다.
  - q: 결론은 어디에 써야 하나요?
    a: 보고 요지 칸 맨 앞에 결론부터 적어야 상급자가 빠르게 판단할 수 있습니다.

blocks:
  - type: doc_title
    text: 내부 보고서
    spaced: false
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 7
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["수신", "", "보고부서", ""]
      - ["보고일자", "", "문서번호", ""]
      - ["제목", "", "", ""]
      - ["작성자", "", "연락처", ""]
    sample_rows:
      - ["", "영업본부장", "", "전략기획팀"]
      - ["", "2026-09-10", "", "전략-2026-034"]
      - ["", "3분기 매출 현황 및 개선 방안 보고", "", ""]
      - ["", "박민준", "", "010-1234-5678"]
  - type: subtitle
    text: 1. 보고 요지
  - type: textbox
    hint: "결론과 요청사항을 먼저 3줄 이내로 요약하십시오."
    height_mm: 14
    sample_text: 3분기 매출이 전분기 대비 8% 감소하였습니다. 주요 원인은 경쟁사 프로모션 확대이며, 4분기 프로모션 예산 증액을 건의합니다.
  - type: subtitle
    text: 2. 현황
  - type: textbox
    hint: "진행 경과와 관련 수치를 사실 중심으로 기재하십시오."
    height_mm: 14
    sample_text: 3분기 매출 12억 원으로 전분기 13억 원 대비 8% 감소하였고, 온라인 채널 매출은 5% 증가하였으나 오프라인 매출이 15% 감소하였습니다.
  - type: subtitle
    text: 3. 문제점 및 대안
  - type: table
    widths: [8, 32, 32, 28]
    header: ["No", 문제점, 대안, 기대효과]
    empty_rows: 2
    row_height_mm: 7
    sample_rows:
      - ["1", "오프라인 매장 방문객 감소", "주말 프로모션 및 팝업 행사 운영", "방문객 10% 증가 기대"]
  - type: subtitle
    text: 4. 건의사항 및 후속조치
  - type: textbox
    hint: "결정이 필요한 사항을 선택지 형태로 기재하십시오."
    height_mm: 16
    sample_text: 4분기 프로모션 예산 3,000만원 증액 여부를 결정해 주시기 바랍니다. 승인 시 10월 첫째 주부터 집행하겠습니다.
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: subtitle
    text: 결재
  - type: grid
    widths: [16, 21, 21, 21, 21]
    label_cols: [0]
    row_height_mm: 12
    rows:
      - ["결재", "담당", "팀장", "임원", "대표"]
      - ["", "", "", "", ""]
  - type: notice
    text: 대외 공개가 제한된 자료를 인용하는 경우 문서 등급과 배포 범위를 표시하십시오.
