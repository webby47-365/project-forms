id: lease-deposit-return-schedule-agreement
title: 임대차 보증금 반환 일정 합의서
category: estate
subcategory: lease
tags: [보증금반환합의서, 보증금 분할반환, 보증금 반환일정, 임대차종료합의, 보증금 지급 약정]
summary: 임대차 계약이 끝난 뒤 보증금을 언제 얼마씩 돌려줄지 임대인과 임차인이 일정과 방법을 정해 남기는 보증금 반환 일정 합의서 양식입니다.
usage: >
  계약 기간이 끝났지만 임대인이 보증금을 한 번에 돌려주기 어려워 일정을 나눠 정할 때 쓰는 문서입니다.
  계약 정보와 반환할 보증금 총액을 적고, 회차별 지급일과 금액, 계좌를 표에 적어 양쪽이 서명합니다.
  이 합의서가 퇴거 시점이나 확정일자·임차권 관련 권리에 어떤 영향을 주는지는 사안마다 다르므로 서명 전에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 임대인·임차인 정보와 계약 대상 주소를 적습니다.
  - 계약 종료일과 반환할 보증금 총액을 적습니다.
  - 회차별 지급일과 금액을 표에 나눠 적습니다.
  - 지급 계좌를 적고 양쪽이 서명합니다.
faq:
  - q: 합의서를 쓰면 바로 이사해야 하나요?
    a: 퇴거 시점은 합의서에 따로 적어야 합니다. 보증금을 받기 전 이사할지는 신중히 정하십시오.
  - q: 합의한 날짜에 안 주면 어떻게 되나요?
    a: 지연 시 조치는 특약란에 미리 적어 두면 좋습니다. 구체적 대응은 전문가 상담을 권합니다.
  - q: 회차 금액의 합은 어떻게 맞추나요?
    a: 표의 금액을 모두 더해 보증금 총액과 같아지는지 확인합니다.
related: [deposit-return-notice, move-out-checklist, management-fee-settlement-confirmation]
