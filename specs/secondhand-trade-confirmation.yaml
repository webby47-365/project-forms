id: secondhand-trade-confirmation
title: 중고거래 확인서
category: personal
subcategory: life
tags: [중고거래확인서, 중고매매확인서, 개인간거래, 물품인수증, 중고거래영수증]
summary: 개인끼리 중고 물품을 사고팔 때 물품 상태와 대금, 인도 일자를 적어 서로 확인하는 중고거래 확인서 양식입니다.
usage: >
  중고 물품을 직거래할 때 나중에 상태나 대금을 두고 다투지 않도록 거래 내용을 남기는 서류입니다.
  물품명과 상태, 거래 금액, 인도 일시와 장소를 적고 판매자와 구매자가 서명합니다. 물품의 하자나 환불 여부는
  거래 당사자가 정한 조건에 따르므로 합의한 내용을 특이사항란에 함께 적어 두십시오.
source: original
featured: false
target_pages: 1
howto:
  - 판매자와 구매자의 이름과 연락처를 적습니다.
  - 물품명과 모델, 현재 상태를 구체적으로 적습니다.
  - 거래 금액과 지급 방식, 인도 일시를 적습니다.
  - 하자와 환불 조건 등 합의한 내용을 적고 양쪽이 서명합니다.
faq:
  - q: 거래 후 하자가 나오면 환불받을 수 있나요?
    a: 거래 때 합의한 조건에 따릅니다. 특이사항란에 환불 조건을 적어 두면 분쟁을 줄입니다.
  - q: 신분증을 복사해 붙여야 하나요?
    a: 필요하지 않습니다. 이름과 연락처만 적고, 신분증 사본은 주고받지 않는 편이 안전합니다.
  - q: 영수증 대신 쓸 수 있나요?
    a: 대금을 받은 사실을 적는 칸이 있어 간단한 영수 확인용으로 쓸 수 있습니다.
related: [used-car-payment-receipt, written-pledge, monthly-rent-receipt, settlement-agreement]
blocks:
  - type: doc_title
    text: 중고거래 확인서
    spaced: false
  - type: subtitle
    text: 1. 거래 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["판매자", "", "연락처", ""]
      - ["구매자", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "김서연", "", "010-9876-5432"]
  - type: subtitle
    text: 2. 물품과 거래 조건
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["물품명", "", "모델·규격", ""]
      - ["물품 상태", "", "", ""]
      - ["거래 금액", "", "지급 방식", ""]
      - ["인도 일시", "", "인도 장소", ""]
    sample_rows:
      - ["", "전동 킥보드", "", "샘플 S1"]
      - ["", "사용 1년, 외관 스크래치 약간, 정상 작동", "", ""]
      - ["", "250,000원", "", "계좌이체"]
      - ["", "2026-10-18 15:00", "", "서울시 마포구 역 앞"]
  - type: subtitle
    text: 3. 특이사항
  - type: textbox
    hint: "알려진 하자, 구성품, 환불·교환 조건 등 합의한 내용을 적으십시오."
    height_mm: 26
    sample_text: 충전기와 설명서 포함. 인수 후 단순 변심에 의한 환불은 하지 않기로 함.
  - type: para
    text: 위 내용대로 거래하였고 대금과 물품을 서로 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   18 일
  - type: sign_line
    labels: ["판매자", "구매자"]
    sample_names: [홍길동, 김서연]
