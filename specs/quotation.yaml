id: quotation
title: 견적서
category: corp
subcategory: finance
tags: [견적서, 거래견적, 단가표, 견적의뢰, estimate]
summary: 공급자·수신처 정보와 품목별 단가·공급가액·부가세 합계를 기재하는 표준 견적서입니다.
usage: >
  거래 성립 전에 가격과 조건을 제시하는 문서입니다. 유효기간을 반드시 기재해야 원자재
  가격 변동에 대응할 수 있고, 부가세 별도/포함 여부를 명확히 표기해야 분쟁을 막을 수
  있습니다. 견적번호는 발행일 기준으로 일련번호를 부여해 관리하십시오.
source: original
featured: true
featured_rank: 9
blocks:
  - type: doc_title
    text: 견적서
  - type: grid
    widths: [14, 22, 14, 22, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["견적번호", "", "견적일자", "", "유효기간", ""]
      - ["수신(상호)", "", "담당자", "", "연락처", ""]
  - type: subtitle
    text: 공급자
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["사업자등록번호", "", "상호(법인명)", ""]
      - ["소재지", "", "", ""]
      - ["업태", "", "종목", ""]
      - ["대표자", "(직인)", "전화 / 팩스", ""]
  - type: subtitle
    text: 견적 내역
  - type: table
    widths: [7, 25, 16, 8, 8, 12, 12, 12]
    header: ["No", 품명, 규격, 단위, 수량, 단가, 공급가액, 비고]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["공급가액 합계", "", "부가세(10%)", ""]
      - ["총 견적금액", "", "금액(한글)", ""]
  - type: subtitle
    text: 거래조건
  - type: grid
    widths: [14, 24, 14, 22, 12, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["결제조건", "", "납품기일", "", "부가세", "별도 / 포함"]
      - ["납품장소", "", "", "", "", ""]
  - type: textbox
    hint: "특기사항 — 하자보증, 운송비 부담, 추가 비용 발생 조건 등을 기재하십시오."
    height_mm: 16
  - type: para
    text: 위와 같이 견적합니다.
    align: center
    size: 11
    space_after: 2
  - type: date_line
  - type: notice
    text: 본 견적서는 유효기간 내에만 효력이 있으며, 원자재 가격 변동 시 협의 후 조정될 수 있습니다.
