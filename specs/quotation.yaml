id: quotation
title: 견적서
category: corp
subcategory: finance
tags: [견적서, 거래견적, 단가표, 견적의뢰, estimate]
summary: 공급자·수신처 정보와 품목별 단가·공급가액·부가세 합계를 기재하는 표준 견적서입니다.
usage: >
  거래 성립 전에 가격과 조건을 제시하는 문서입니다. 유효기간을 반드시 기재해야 원자재
  가격 변동에 대응할 수 있고, 부가세 별도/포함 여부를 명확히 표기해야 분쟁을 막을 수
  있습니다. 견적번호는 발행일 기준으로 일련번호를 부여해 관리하십시오.
source: original
featured: true
featured_rank: 9
series: quotation
series_name: 견적서
variant: 기본형
variant_rank: 1

variant_use: 단품·소규모 거래에 기본으로 쓰는 표준 견적서입니다.

howto:
  - 견적번호와 견적일자, 유효기간을 적습니다.
  - 수신 상호와 담당자, 연락처를 기재합니다.
  - 품목별 단가와 수량, 공급가액을 채웁니다.
  - 부가세와 합계 금액을 계산해 적습니다.

faq:
  - q: 유효기간이 지나면 어떻게 되나요?
    a: 제시한 가격이 더 이상 보장되지 않으므로 재견적을 요청해야 합니다.
  - q: 부가세는 별도인가요 포함인가요?
    a: 서식 하단에 별도·포함 여부를 표시하는 칸이 있으니 반드시 체크해 분쟁을 막으십시오.

related: [purchase-order, quotation-comparison, transaction-statement, tax-invoice]

