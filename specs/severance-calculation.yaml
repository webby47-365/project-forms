id: severance-calculation
title: 퇴직금 정산서
category: corp
subcategory: hr
tags: [퇴직금 정산서, 퇴직금 계산, 평균임금, 퇴직정산, 퇴직금 지급]
summary: 재직기간과 평균임금 산정내역을 바탕으로 퇴직금과 공제액·실지급액을 정리하는 정산서입니다.
usage: >
  퇴직자에게 지급할 퇴직금 산정 근거를 정리해 전달하는 서류입니다. 평균임금은 퇴직일 이전
  3개월간 지급된 임금총액을 그 기간의 총일수로 나누어 계산하므로 월별 임금내역 칸을 빠짐없이
  채우십시오. 상여금과 연차수당은 산입 비율이 달라 별도 칸에 적고, 원천징수세액과 대여금 공제는
  공제 내역에 표시합니다. 퇴직금은 원칙적으로 퇴직일로부터 14일 이내에 지급하며, 당사자 합의로
  지급기일을 연장할 수 있습니다. 최종 세액과 지급기한은 관할 세무서·고용노동청 기준을 확인하십시오.
source: original
featured: false
target_pages: 1
