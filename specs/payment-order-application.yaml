    text: 채무자가 송달받은 날부터 2주 내에 이의신청을 하면 통상의 소송절차로 이행됩니다. 제출 전 대한민국 법원 전자소송 사이트에서 최신 양식과 인지·송달료 기준을 확인하십시오. 본 서식은 참고용입니다.
