id: payment-order-application
title: 지급명령 신청서 (독촉절차)
category: legal
subcategory: litigation
tags: [지급명령신청서, 독촉절차, 채권추심, 대여금청구, 물품대금]
summary: 금전 채권을 소송 없이 신속하게 집행권원으로 만들기 위한 지급명령 신청서입니다.
usage: >
  대여금·물품대금·용역대금처럼 다툼이 적은 금전 채권을 회수할 때 쓰는 절차입니다. 법정에
  출석하지 않고 서면만으로 진행되며 인지대가 소송의 10분의 1이어서 비용이 적게 듭니다.
  다만 채무자가 송달받은 날부터 2주 내에 이의신청을 하면 통상의 소송으로 넘어갑니다.
  채무자의 주소를 정확히 알아야 하고, 청구금액과 이자 기산일을 명확히 적어야 합니다.
  본 서식은 참고용이며 실제 제출 전 대한민국 법원 전자소송 사이트의 최신 양식과 인지·송달료
  기준을 확인하십시오.
source: law-standard
source_note: 민사소송법 독촉절차(제462조 이하) 규정을 참고하여 자체 제작
featured: false
target_pages: 2
howto:
  - 채권자와 채무자의 인적사항과 주소를 적습니다.
  - 청구금액과 이자 기산일을 기재합니다.
  - 청구 원인이 되는 사실관계를 간단히 적습니다.
  - 첨부서류 목록을 확인해 함께 준비합니다.
  - 관할 법원에 인지대와 함께 제출합니다.

faq:
  - q: 채무자가 이의신청을 하면 어떻게 되나요?
    a: 송달일부터 2주 내 이의신청이 있으면 통상의 소송 절차로 넘어갑니다.
  - q: 채무자 주소를 모르면 신청할 수 없나요?
    a: 정확한 송달 주소가 필요하므로 먼저 주소를 확인한 후 신청하십시오.

related: [certified-notice-loan, complaint-loan-return, loan-agreement, payment-pledge]

blocks:
  - type: doc_title
    text: 지급명령 신청서
    spaced: false
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [14, 26, 14, 20, 26]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 4]
      - [3, 1, 3, 4]
    rows:
      - ["채권자 성명", "", "생년월일", "", "연락처"]
      - ["채권자 주소", "", "", "", ""]
      - ["채무자 성명", "", "생년월일", "", "연락처"]
      - ["채무자 주소", "", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-03-11", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "", ""]
      - ["", "박민준", "", "1987-06-20", "010-9876-5432"]
