id: payment-order-application
title: 지급명령 신청서 (독촉절차)
category: legal
subcategory: litigation
tags: [지급명령신청서, 독촉절차, 채권추심, 대여금청구, 물품대금]
summary: 금전 채권을 소송 없이 신속하게 집행권원으로 만들기 위한 지급명령 신청서입니다.
usage: >
  대여금·물품대금·용역대금처럼 다툼이 적은 금전 채권을 회수할 때 쓰는 절차입니다. 법정에
  출석하지 않고 서면만으로 진행되며 인지대가 소송의 10분의 1이어서 비용이 적게 듭니다.
  다만 채무자가 송달받은 날부터 2주 내에 이의신청을 하면 통상의 소송으로 넘어갑니다.
  채무자의 주소를 정확히 알아야 하고, 청구금액과 이자 기산일을 명확히 적어야 합니다.
  본 서식은 참고용이며 실제 제출 전 대한민국 법원 전자소송 사이트의 최신 양식과 인지·송달료
  기준을 확인하십시오.
source: law-standard
source_note: 민사소송법 독촉절차(제462조 이하) 규정을 참고하여 자체 제작
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 지급명령 신청서
    spaced: false
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [14, 26, 14, 20, 26]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 4]
      - [3, 1, 3, 4]
    rows:
      - ["채권자 성명", "", "생년월일", "", "연락처"]
      - ["채권자 주소", "", "", "", ""]
      - ["채무자 성명", "", "생년월일", "", "연락처"]
      - ["채무자 주소", "", "", "", ""]
  - type: subtitle
    text: 청구 취지
  - type: para
    text: "채무자는 채권자에게 아래 청구금액과 이에 대한 이자 및 독촉절차비용을 지급하라는 지급명령을 구합니다."
    align: both
    size: 10
  - type: grid
    widths: [18, 34, 18, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["청구금액(원금)", "금                      원", "이자율", "연            %"]
      - ["이자 기산일", "", "독촉절차비용", "금                원"]
      - ["청구 총액", "금                      원", "송달료·인지대", "별지 계산서 참조"]
  - type: subtitle
    text: 청구 원인
  - type: textbox
    hint: "채권이 발생한 경위를 시간순으로 기재하십시오. (예: 20  년  월  일 금전을 대여하고 변제기를 20  년  월  일로 약정하였으나 변제하지 않음)"
    height_mm: 46
  - type: subtitle
    text: 입증 방법
  - type: table
    widths: [10, 34, 30, 26]
    header: ["No", 서증명, 내용, 비고]
    rows:
      - ["갑1", "차용증", "", ""]
      - ["갑2", "계좌 이체내역", "", ""]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
  - type: subtitle
    text: 첨부 서류
  - type: kv_list
    items:
      - "위 입증방법 사본 각 1부"
      - "송달료 납부서 1부"
      - "법인인 경우 법인등기부등본 1부"
  - type: para
    text: 위와 같이 지급명령을 신청합니다.
    align: center
    size: 11
    space_after: 2
  - type: date_line
  - type: sign_line
    label: 채권자
  - type: spacer
    height_pt: 6
  - type: para
    text: "                        법원  귀중"
    align: center
    size: 12
    bold: true
  - type: notice
    text: 채무자가 송달받은 날부터 2주 내에 이의신청을 하면 통상의 소송절차로 이행됩니다. 제출 전 대한민국 법원 전자소송 사이트에서 최신 양식과 인지·송달료 기준을 확인하십시오. 본 서식은 참고용입니다.
