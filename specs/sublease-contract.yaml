id: sublease-contract
title: 전대차 계약서
category: estate
subcategory: lease
series: lease
series_name: 임대차계약서
variant: 전대차
variant_rank: 4
tags: [전대차계약서, 재임대계약서, 전대계약, 임차권전대, 전대인전차인]
summary: 임차인이 임대인의 동의를 받아 임차물을 다시 임대할 때 전대인과 전차인 간에 작성하는 계약서입니다.
usage: >
  임차인(전대인)이 빌린 주택이나 사무실을 다른 사람(전차인)에게 다시 임대할 때 사용합니다.
  전대차는 원 임대인의 서면 동의를 받아야 효력이 있으므로 동의란을 별도로 두고 임대인의
  성명과 서명을 받으십시오. 원 임대차계약이 끝나면 전대차도 함께 끝난다는 점과 사용 목적을
  임의로 바꿀 수 없다는 점을 명시합니다. 임대인의 동의 없는 전대는 원 임대차계약의 해지
  사유가 될 수 있으므로 계약 전에 반드시 동의 절차를 거치십시오.
source: original
featured: false
target_pages: 2
created_by: agent
status: published
version: 1
variant_use: 임차인이 임대인 동의를 받아 재임대할 때 씁니다.

howto:
  - 목적물 주소와 전대인·전차인 인적사항을 적습니다.
  - 전대차 기간과 보증금·차임을 정합니다.
  - 원 임대인의 동의 여부를 확인하고 동의란에 서명받습니다.
  - 특약사항을 적은 뒤 양 당사자가 서명 날인합니다.

faq:
  - q: 임대인 동의 없이 전대해도 되나요?
    a: 원칙적으로 안 되며, 동의 없는 전대는 원 임대차계약 해지 사유가 될 수 있습니다.
  - q: 원 임대차계약이 끝나면 전대차는 어떻게 되나요?
    a: 원 임대차계약이 종료되면 전대차 계약도 함께 종료되는 것이 일반적입니다.

related: [lease-transfer-contract, move-in-checklist, monthly-rent-receipt, lease-termination-notice]

blocks:
  - type: doc_title
    text: 전대차 계약서
    spaced: false
  - type: para
    text: 전대인과 전차인은 아래 목적물에 관하여 다음과 같이 전대차계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
