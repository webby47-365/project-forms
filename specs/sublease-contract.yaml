  - type: subtitle
    text: 2. 목적물 및 원 임대차 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["목적물 주소", "", "", ""]
      - ["원 임대차 계약일", "", "원 임대차 기간", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100, 202동 1503호", "", ""]
      - ["", "2025-03-01", "", "2025.03.01~2027.02.28"]
  - type: subtitle
    text: 3. 전대차 조건
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["전대 기간", "", "보증금", ""]
      - ["차임(월세)", "", "관리비", ""]
    sample_rows:
      - ["", "2026.10.01~2027.02.28", "", "금 20,000,000원 (금 이천만원)"]
      - ["", "금 600,000원", "", "금 50,000원"]
  - type: article
    heading: 제1조 (임대인의 동의)
    lines:
      - "이 전대차계약은 임대인의 서면 동의를 얻은 경우에 한하여 유효하며, 전대인은 계약 체결 전 임대인의 동의서를 전차인에게 제시한다."
  - type: article
    heading: 제2조 (원 임대차 종료 시 전대차의 종료)
    lines:
      - "원 임대차계약이 기간만료·해지 등으로 종료되는 경우 이 전대차계약도 함께 종료되며, 전차인은 그 사실을 안 날부터 지체 없이 목적물을 반환한다."
  - type: article
    heading: 제3조 (사용목적의 제한)
    lines:
      - "전차인은 목적물을 주거용으로만 사용하며, 전대인과 임대인의 동의 없이 용도를 변경하거나 재전대할 수 없다."
  - type: article
    heading: 제4조 (원상회복)
    lines:
      - "전대차 종료 시 전차인은 목적물을 원상으로 회복하여 전대인에게 반환하고, 전대인은 보증금에서 미납액을 공제한 나머지를 반환한다."
  - type: article
    heading: 제5조 (해지)
    lines:
      - "전차인이 차임을 2기분 이상 연체하거나 제3조를 위반한 경우 전대인은 이 계약을 해지할 수 있다."
  - type: subtitle
    text: 임대인 동의란
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["임대인 성명", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "010-9999-1111"]
  - type: sign_line
    label: 임대인(동의)
    sample_names: [김서연]
  - type: date_line
  - type: sign_line
    labels: ["전대인", "전차인"]
