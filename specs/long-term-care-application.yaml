id: long-term-care-application
title: 장기요양 급여 신청서
category: welfare
subcategory: consent
tags: [장기요양급여신청서, 장기요양인정신청, 노인장기요양보험신청, 요양등급신청서, 장기요양등급신청]
summary: 노인장기요양보험의 급여를 받기 위해 등급 인정을 신청할 때 작성하는 신청서입니다.
usage: >
  65세 이상 노인이나 노인성 질병이 있는 국민이 장기요양 급여를 받으려면 국민건강보험공단에
  등급 인정을 신청해야 합니다. 본인이 신청하기 어려운 경우 가족 등 대리인이 신청할 수
  있으며, 이 경우 대리 신청인 정보를 함께 적습니다. 이미 등급을 받은 경우에는 갱신이나
  등급 변경 신청에 해당 항목을 표시하십시오. 공단 직원의 방문 조사 후 등급판정위원회가
  등급을 결정합니다.
source: law-standard
source_note: 노인장기요양보험법 제13조에 따른 장기요양인정 신청 기재사항 반영
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 신청인의 인적사항을 적습니다.
  - 대리 신청이면 대리인 정보를 함께 적습니다.
  - 갱신이나 등급 변경이면 해당 항목에 표시합니다.
  - 제출처인 국민건강보험공단 지사를 확인합니다.
  - 방문 조사 일정을 안내받습니다.

faq:
  - q: 신청은 본인만 할 수 있나요?
    a: 본인이 어려우면 가족 등 대리인이 신청할 수 있으며, 이때 대리 신청인 정보를 함께 적어야 합니다.
  - q: 등급 판정은 어떻게 이루어지나요?
    a: 공단 직원이 방문 조사한 뒤 그 결과를 바탕으로 등급판정위원회가 등급을 결정합니다.

related: [care-service-application, welfare-facility-application, caregiver-contract, power-of-attorney]

blocks:
  - type: doc_title
    text: 장기요양 급여 신청서
    spaced: false

  - type: subtitle
    text: 1. 신청인 정보

  - type: grid
    widths: [14, 22, 14, 22, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", "", "연락처", ""]
      - ["주소", "", "", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1945-02-17", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "", "", ""]

  - type: subtitle
    text: 2. 대리 신청인 정보 (본인이 신청하기 어려운 경우)

  - type: grid
    widths: [14, 22, 14, 22, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "관계", "", "연락처", ""]
