  - type: subtitle
    text: 4. 일상생활 수행 정도

  - type: table
    widths: [34, 22, 22, 22]
    header: [항목, 독립 수행, 부분 도움, 전적 도움]
    rows:
      - ["식사하기", "", "", ""]
      - ["세수하기", "", "", ""]
      - ["옷 입기", "", "", ""]
      - ["이동하기", "", "", ""]
      - ["화장실 사용", "", "", ""]
    empty_rows: 0
