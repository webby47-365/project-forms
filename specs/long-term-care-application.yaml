    body_align: center

  - type: subtitle
    text: 5. 현재 돌봄 상황

  - type: textbox
    hint: "현재 돌봄을 제공하는 사람과 돌봄 시간, 생활 환경 등을 간단히 적으십시오."
    height_mm: 24
    sample_text: 배우자가 주간에 돌봄을 제공하고 있으며, 평일 오전에는 자녀가 방문하여 식사와 이동을 돕고 있습니다.

  - type: para
    text: 위와 같이 장기요양 급여를 신청하며, 신청서는 국민건강보험공단에 제출합니다.
    align: center
    size: 10
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    labels: ["신청인", "대리 신청인"]
    sample_names: [홍길동, 김서연]

  - type: notice
    text: 개인정보(건강정보 포함)의 수집 목적은 장기요양인정 조사 및 등급 판정이며, 보유기간은 관계 법령에 따라 보관한 후 파기합니다.

  - type: notice
    text: 등급 판정 기준과 절차는 국민건강보험공단의 공고를 따르십시오. 본 서식은 참고용이며, 의학적 설명과 판단은 담당 의료진이 수행합니다.
