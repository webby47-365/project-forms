id: motorcycle-sale-contract
title: 이륜차(오토바이) 매매계약서
category: public
subcategory: vehicle
tags: [이륜차매매계약서, 오토바이매매계약서, 중고오토바이거래, 이륜차양도계약, 스쿠터매매계약]
summary: 중고 오토바이·스쿠터 등 이륜차를 개인 간에 사고팔 때 차량 정보와 대금 지급 조건을 정하는 매매계약서입니다.
usage: >
  중고 이륜차를 개인 간에 거래할 때 차량번호와 차대번호, 배기량 같은 차량 정보를
  명확히 적고 매매대금과 지급 방법, 하자 책임을 정하는 계약서입니다. 계약 체결
  후에는 관할 구청·시청에 이륜차 사용신고(명의이전)를 별도로 신청해야 합니다.
  인수 전 시동·제동장치 등 성능과 상태를 직접 확인하고, 자동차책임보험 승계
  여부도 매도인·매수인이 함께 협의해 두십시오.
source: original
featured: false
target_pages: 1

howto:
  - 매도인과 매수인의 인적사항을 적습니다.
  - 이륜차의 차량번호와 차대번호, 배기량을 적습니다.
  - 매매대금과 계약금·잔금 지급일을 적습니다.
  - 특약사항을 적고 양측이 서명 또는 날인합니다.

faq:
  - q: 계약 후 명의이전은 어떻게 하나요?
    a: 계약서와 필요 서류를 갖춰 관할 구청·시청에 이륜차 사용신고(명의이전)를 신청합니다.
  - q: 보험은 자동으로 승계되나요?
    a: 자동으로 승계되지 않으므로 매도인·매수인이 보험 해지 또는 재가입 여부를 협의해야 합니다.
  - q: 차대번호는 어디서 확인하나요?
    a: 통상 차체 프레임이나 등록증에 표기되어 있으며, 등록증 원본과 대조해 확인합니다.

related: [vehicle-maintenance-history, receipt]

blocks:
  - type: doc_title
    text: 이륜차 매매계약서
    spaced: true

  - type: para
    text: 매도인과 매수인은 아래 이륜차에 대하여 다음과 같이 매매계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 매도인 / 매수인

  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["매도인", "", "생년월일", "", "연락처", ""]
      - ["매수인", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "1990-05-12", "", "010-1234-5678"]
      - ["", "김서연", "", "1993-11-03", "", "010-9876-5432"]

  - type: subtitle
    text: 이륜차 정보

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["차종(모델명)", "", "차량번호", ""]
      - ["차대번호", "", "배기량", ""]
      - ["연식", "", "주행거리", ""]
      - ["색상", "", "", ""]
    sample_rows:
      - ["", "혼다 PCX125", "", "서울아 1234"]
      - ["", "KMJPCX1250A012345", "", "125cc"]
      - ["", "2023년식", "", "8,200km"]
      - ["", "흰색", "", ""]

  - type: subtitle
    text: 거래 조건

  - type: grid
    widths: [18, 30, 18, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["매매대금", "", "", ""]
      - ["계약금", "", "지급일", ""]
      - ["잔금", "", "지급일", ""]
    sample_rows:
      - ["", "금 1,800,000원 (금 일백팔십만원)", "", ""]
      - ["", "300,000원", "", "2026-09-16 (계약 시)"]
      - ["", "1,500,000원", "", "2026-09-20"]

  - type: textbox
    hint: "인도 시점, 성능 하자 책임 기간, 보험 승계 여부 등 특약사항을 적으십시오."
    height_mm: 22
    sample_text: 매도인은 인도일 현재 시동·제동장치에 이상이 없음을 확인하며, 인도 후 7일 이내 발견된 숨은 하자는 매도인이 책임진다.

  - type: para
    text: 위와 같이 계약을 체결하고 계약서 2부를 작성하여 각자 1부씩 보관한다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월   16 일

  - type: sign_line
    labels: ["매도인", "매수인"]
    sample_names: [홍길동, 김서연]

  - type: notice
    text: 계약 후에는 관할 구청·시청에 이륜차 사용신고(명의이전)를 별도로 신청해야 합니다.
