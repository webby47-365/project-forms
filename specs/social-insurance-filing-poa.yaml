id: social-insurance-filing-poa
title: 4대보험 신고 업무 위임장
category: public
subcategory: insurance
tags: [4대보험신고위임장, 사회보험위임장, 노무사위임장, 취득상실신고위임, 사업장위임장]
summary: 4대 사회보험(국민연금·건강보험·고용보험·산재보험) 신고 업무를 노무사·세무대리인에게 맡길 때 쓰는 위임장입니다.
usage: >
  사업장이 직원의 4대보험 자격취득·상실 신고나 사업장 성립·변경 신고를 노무사·세무대리인에게
  맡길 때 쓰는 서류입니다. 건강보험은 입사일 기준 14일 이내, 국민연금·고용보험·산재보험은
  입사일이 속한 달의 다음 달 15일까지 신고해야 하므로 위임 범위와 위임 기간을 명확히 적어
  신고가 늦어지지 않도록 합니다. 위임 범위에 어느 보험까지 포함할지 구체적으로 적으십시오.
source: original
featured: false
target_pages: 1

howto:
  - 위임인(사업장)의 정보와 사업자등록번호를 적습니다.
  - 수임인(노무사·세무대리인)의 사무소 정보를 적습니다.
  - 위임 대상 보험 종류와 위임 범위를 표시합니다.
  - 위임 기간을 정하고 서명 또는 날인합니다.

faq:
  - q: 네 가지 보험을 모두 위임해야 하나요?
    a: 아닙니다. 위임 범위에서 필요한 보험만 표시해 일부만 위임할 수 있습니다.
  - q: 직원이 바뀔 때마다 새로 작성해야 하나요?
    a: 위임 기간을 사업장 단위로 정해 두면 그 기간 안의 취득·상실 신고는 따로 작성하지 않아도 됩니다.
  - q: EDI 업무대행 신청과 같은 문서인가요?
    a: 아닙니다. 공단 EDI 신청은 기관에 내는 별도 절차이며, 이 위임장은 사업주와 대리인 사이의 확인용 문서입니다.

related: [income-tax-filing-poa, employment-certificate, gov-separation-confirmation]

