      - ["목적물 주소", "", "", ""]
      - ["원 임대차 계약일", "", "원 임대차 기간", ""]
      - ["원 보증금", "", "원 차임", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100, 202동 1503호", "", ""]
      - ["", "2024-05-01", "", "2024.05.01~2027.04.30"]
      - ["", "금 50,000,000원 (금 오천만원)", "", "금 800,000원"]
  - type: subtitle
    text: 3. 양도 조건
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["양도일", "", "보증금 승계액", ""]
      - ["권리금", "", "지급 일정", ""]
    sample_rows:
      - ["", "2026-10-20", "", "금 50,000,000원 (금 오천만원)"]
      - ["", "금 10,000,000원 (금 일천만원)", "", "양도일에 전액 지급"]
  - type: article
    heading: 제1조 (양도의 합의)
    lines:
      - "양도인은 임차권을 양수인에게 양도하고, 양수인은 이를 양수하여 위 원 임대차계약상 임차인의 지위를 승계하기로 합의한다."
  - type: article
    heading: 제2조 (임대인의 동의)
    lines:
      - "이 양도계약은 임대인의 서면 동의를 받은 경우에 한하여 효력이 있다."
  - type: article
    heading: 제3조 (보증금 반환청구권의 이전)
    lines:
      - "원 임대차계약의 보증금 반환청구권은 양도일부터 양수인에게 이전되며, 임대인은 양수인에게 보증금을 반환한다."
  - type: article
    heading: 제4조 (연체 채무의 정산)
    lines:
      - "양도일 이전에 발생한 연체 차임·관리비 등은 양도인이 정산하며, 양도일 이후의 채무는 양수인이 부담한다."
  - type: article
    heading: 제5조 (원상회복 의무의 승계)
    lines:
      - "양수인은 원 임대차계약에 따른 원상회복 의무를 그대로 승계한다."
  - type: article
    heading: 제6조 (해제)
    lines:
      - "당사자 일방이 중대한 사항을 숨기거나 이 계약을 위반한 경우 상대방은 이 계약을 해제할 수 있다."
  - type: subtitle
    text: 임대인 동의란
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["임대인 성명", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "010-1234-5678"]
  - type: sign_line
    label: 임대인(동의)
    sample_names: [김서연]
  - type: date_line
  - type: sign_line
    labels: ["양도인", "양수인"]
    sample_names: [홍길동, 박민준]
  - type: notice
    text: 임대인의 서면 동의 없는 임차권 양도는 원 임대차계약의 해지 사유가 될 수 있으므로 사전에 동의를 받으십시오.
