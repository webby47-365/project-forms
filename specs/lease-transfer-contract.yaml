id: lease-transfer-contract
title: 임차권 양도계약서
category: estate
subcategory: lease
tags: [임차권양도계약서, 임차권양도, 전세권양도, 임대차지위승계, 권리금양도]
summary: 현 임차인이 보증금 반환청구권과 임차인 지위를 새 임차인에게 넘길 때 작성하는 양도계약서입니다.
usage: >
  이사나 사정으로 임차권을 제3자에게 넘길 때 사용합니다. 원 임대차계약의 내역과 보증금
  승계액, 권리금, 지급 일정을 구체적으로 적고 임대인의 서면 동의란을 반드시 둡니다.
  양도일을 기준으로 연체 채무는 양도인이, 그 이후 채무는 양수인이 부담하도록 정리하고
  원상회복 의무도 양수인이 승계한다는 점을 명시하십시오. 임대인의 동의 없는 양도는 원
  임대차계약의 해지 사유가 될 수 있습니다.
source: original
featured: false
target_pages: 2
created_by: agent
status: published
version: 1
howto:
  - 원 임대차계약 내용과 당사자를 적습니다.
  - 양도할 보증금 승계액과 권리금을 적습니다.
  - 권리금 등 지급 일정을 적습니다.
  - 양도일 기준 채무 부담 주체를 정리합니다.
  - 임대인의 서면 동의를 받아 서명·날인합니다.

faq:
  - q: 임대인 동의 없이 양도해도 되나요?
    a: 안 됩니다. 동의 없는 양도는 원 임대차계약의 해지 사유가 될 수 있으므로 서면 동의를 반드시 받으십시오.
  - q: 양도일 이전 연체 관리비는 누가 부담하나요?
    a: 계약서에 정한 대로 양도일 이전 채무는 양도인이, 이후 채무는 양수인이 부담하는 것이 일반적입니다.

related: [commercial-lease-contract, sublease-contract, claim-assignment-notice, move-in-checklist]

blocks:
  - type: doc_title
    text: 임차권 양도계약서
    spaced: false
  - type: para
    text: 양도인과 양수인은 아래 임차권의 양도에 관하여 다음과 같이 계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["양도인(현 임차인)", "", "연락처", ""]
      - ["양수인(신 임차인)", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "010-9876-5432"]
      - ["", "박민준", "", "010-2222-3333"]
