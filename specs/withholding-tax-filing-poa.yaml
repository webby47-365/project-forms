id: withholding-tax-filing-poa
title: 원천세 신고 위임장
category: public
subcategory: tax
tags: [원천세신고위임장, 원천징수신고위임장, 원천세위임장, 세무대리위임장, 지급명세서위임장]
summary: 원천징수 이행상황신고와 지급명세서 제출을 세무대리인에게 맡길 때 지급 월·신고 범위를 적는 위임장입니다.
usage: >
  급여나 용역대가를 지급하는 사업자가 매월 하는 원천징수 이행상황신고와 지급명세서 제출을
  세무대리인에게 맡길 때 쓰는 서류입니다. 원천세는 지급 월마다 신고 대상이 생기므로 어느
  월분부터 어느 월분까지 맡기는지 적어 두어야 대리 범위가 분명해집니다. 신고 대상 소득의
  종류(근로·사업·기타 등)와 자료 수령 방법을 함께 적으면 세무대리인과 주고받는 자료가 줄어듭니다.
  위임 기간이 끝나면 효력이 소멸하도록 기간을 정해 두는 것이 안전합니다.
source: original
featured: false
target_pages: 1

howto:
  - 위임인(원천징수의무자)의 상호와 사업자등록번호를 적습니다.
  - 세무대리인의 사무소명과 세무사등록번호를 적습니다.
  - 신고할 소득 종류와 지급 월 범위를 적습니다.
  - 위임 기간을 정하고 서명 또는 날인합니다.

faq:
  - q: 매달 새로 작성해야 하나요?
    a: 지급 월 범위를 여러 달로 적으면 한 장으로 여러 달을 맡길 수 있습니다. 기간이 끝나면 다시 작성합니다.
  - q: 부가가치세 위임장과 따로 써야 하나요?
    a: 세목이 달라 별도 문서로 작성하는 것이 원칙입니다. 같은 세무대리인이면 함께 전달해도 됩니다.
  - q: 지급명세서 제출도 함께 맡길 수 있나요?
    a: 위임 범위에 지급명세서 작성·제출을 함께 적으면 맡길 수 있습니다.

related: [vat-filing-poa, withholding-request, income-tax-filing-poa, power-of-attorney]

