      - ["", "서울시 한빛구 한빛로 1", "", ""]
      - ["", "어르신 식사 배식 및 정리", "", ""]
  - type: subtitle
    text: 3. 일자별 활동 시간
  - type: table
    widths: [20, 25, 25, 15, 15]
