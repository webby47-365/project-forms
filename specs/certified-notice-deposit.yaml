id: certified-notice-deposit
title: 내용증명 (보증금 반환청구)
category: legal
subcategory: notice
tags: [내용증명, 보증금반환청구, 임대차보증금, 전세금반환, 내용증명서식]
summary: 임대차 계약이 종료되었음에도 보증금을 돌려받지 못한 임차인이 임대인에게 반환을 요구하는 내용증명 양식입니다.
usage: >
  임대차 계약 종료일이나 명도일이 지났는데도 임대인이 보증금을 반환하지 않는 경우 사용하는
  통지서입니다. 임대차 목적물과 계약일, 보증금·차임, 계약 종료일과 명도일을 정확히 기재해야
  합니다. 구체적인 반환 기한을 명시하고 우체국 등기로 발송하면 통지 사실에 대한 증거를 남길
  수 있습니다. 반환이 지연될 경우 지연손해금 청구 등 추가 절차를 검토할 수 있습니다.
source: original
featured: false
target_pages: 1
series: certified-notice
series_name: 내용증명
variant: 보증금 반환
variant_rank: 3
version: 1
created_by: agent
status: published

variant_use: 임대차 종료 후 보증금을 돌려받지 못했을 때 씁니다.

howto:
  - 발신인과 수신인의 인적사항을 적습니다.
  - 임대차 목적물과 계약일, 보증금·차임을 적습니다.
  - 계약 종료일과 명도일을 적습니다.
  - 반환을 요구하는 구체적 기한을 적습니다.
  - 우체국 등기로 발송합니다.

faq:
  - q: 꼭 등기로 보내야 하나요?
    a: 내용증명은 등기우편으로 발송해야 발송 사실과 내용에 대한 증거로 남길 수 있습니다.
  - q: 반환이 계속 지연되면 어떻게 하나요?
    a: 지연손해금 청구 등 추가 절차를 검토할 수 있으니 관련 상담을 받아보는 것이 좋습니다.

blocks:
  - type: doc_title
    text: 내용증명
    spaced: true

  - type: subtitle
    text: 발신인
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]

  - type: subtitle
    text: 수신인
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "김서연", "", "010-9876-5432"]
      - ["", "서울특별시 서대문구 충정로 30", "", ""]

  - type: subtitle
    text: 1. 임대차 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [3, 1, 3, 3]
    rows:
      - ["목적물 주소", "", "", ""]
      - ["계약일", "", "계약 종료일", ""]
      - ["보증금", "", "차임", ""]
      - ["명도일", "", "", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100, 302호", "", ""]
      - ["", "2024-07-01", "", "2026-06-30"]
      - ["", "금 50,000,000원 (금 오천만원)", "", "금 700,000원"]
      - ["", "2026-06-30", "", ""]

  - type: subtitle
    text: 2. 통지 내용
  - type: textbox
    hint: "임대차 경위와 명도 후 보증금을 반환받지 못한 사실을 구체적으로 기재하십시오."
    height_mm: 35
    sample_text: 발신인은 2024년 7월 1일 수신인으로부터 위 주택을 임차하여 거주하였고, 계약 종료일인 2026년 6월 30일 주택을 명도하였습니다. 그러나 수신인은 명도일이 지난 현재까지 보증금을 반환하지 않고 있습니다.

  - type: subtitle
    text: 3. 요구 사항 및 이행 기한
  - type: textbox
    hint: "요구하는 사항과 구체적인 이행 기한을 명시하십시오."
    height_mm: 20
    sample_text: 본 통지서를 수령한 날로부터 7일 이내에 보증금 50,000,000원을 아래 계좌로 반환하여 주시기 바랍니다.

  - type: para
    text: 위 기한까지 보증금이 반환되지 않을 경우 부득이 법적 절차를 진행할 수 있음을 알려드립니다.
    align: center
    size: 10.5

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    label: 발신인
    sample_names: [홍길동]

  - type: notice
    text: 본 내용증명은 우체국 창구에서 발신인용·수신인용·우체국 보관용 3부를 작성하여 제출합니다. 보증금 반환과 관련한 구체적인 법적 절차는 변호사 등 전문가에게 확인하십시오.
