id: construction-work-order
title: 공사발주서
category: corp
subcategory: admin
tags: [공사발주서, 공사발주, 시공발주, 인테리어발주, 공사의뢰서, work-order]
summary: 발주자가 시공업체에 공사를 의뢰할 때 공사명·공사 범위·금액·공사 기간·지급 조건을 적어 보내는 공사발주서 양식입니다.
usage: >
  건물 보수·인테리어·설비 공사처럼 시공업체에 공사를 맡길 때 발주자가 보내는 문서입니다.
  공사명과 현장 위치, 공사 범위, 공사금액, 착공일과 준공일, 대금 지급 조건을 빠짐없이 적어 두면
  나중에 범위나 금액을 두고 생기는 다툼을 줄일 수 있습니다. 금액이 크거나 공사가 복잡하면
  발주서와 별도로 공사계약서를 작성하는 것이 좋습니다. 제출처나 사내 규정에 따라 필요한 항목이
  다를 수 있으니 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 발주번호와 발주일자, 발주자 정보를 적습니다.
  - 시공업체의 상호와 담당자, 연락처를 적습니다.
  - 공사명과 현장 위치, 착공일과 준공일을 적습니다.
  - 공사 항목별 수량과 단가, 금액을 적습니다.
  - 지급 조건을 적고 발주자가 서명 또는 날인합니다.

faq:
  - q: 공사계약서를 따로 써야 하나요?
    a: 금액이 크거나 공사 내용이 복잡하면 계약서를 따로 쓰는 편이 안전합니다. 간단한 공사는 발주서로 갈음하기도 합니다.
  - q: 공사금액에 부가세를 포함해서 적나요?
    a: 공급가액과 부가세를 나누어 적고 합계를 함께 적으면 혼동이 없습니다. 세부 처리는 세무 담당자에게 확인하십시오.
  - q: 추가 공사가 생기면 어떻게 하나요?
    a: 특기사항에 추가 공사는 서면 합의 후 진행한다고 적어 두면 좋습니다. 금액과 기간 변경도 문서로 남기십시오.

related: [quotation, subcontract-agreement, contract-completion-confirmation, tax-invoice]

