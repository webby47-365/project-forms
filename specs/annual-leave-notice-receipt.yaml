id: annual-leave-notice-receipt
title: 연차 사용 촉진 통지 수령 확인서
category: corp
subcategory: hr
tags: [연차촉진수령확인서, 연차사용촉진통지수령, 연차통지수령확인, 연차촉진서면통지, 연차촉진증빙]
summary: 회사가 연차 사용 촉진 통지서를 근로자에게 전달했다는 사실과 받은 날짜를 서명으로 남기는 수령 확인서입니다.
usage: >
  회사가 연차 사용 촉진 통지서(1차)나 사용 시기 지정 통보서(2차)를 근로자에게 전한 뒤, 받았다는
  사실을 기록으로 남기는 서식입니다. 어떤 통지를 언제 어떤 방법으로 전했는지 적고, 근로자가 받은
  날짜를 직접 적어 서명합니다. 통지 자체의 내용과 기한은 통지서에서 확인하고, 이 확인서는 전달 사실을
  입증하는 보조 자료로 보관합니다. 촉진 절차의 요건은 고용노동부 안내와 회사 규정을 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 근로자의 소속, 직위, 성명을 적습니다.
  - 받은 통지의 종류와 통지서에 적힌 작성일을 적습니다.
  - 전달 방법을 고르고 근로자가 받은 날짜를 적습니다.
  - 근로자가 서명하고 회사 담당자가 확인 서명을 합니다.
faq:
  - q: 수령 확인서에 서명하지 않으면 통지가 무효인가요?
    a: 서명 여부만으로 단정할 수 없습니다. 전달 사실을 입증할 다른 기록을 함께 남기고, 판단은 고용노동부 안내를 확인하십시오.
  - q: 이메일로 통지했다면 어떻게 쓰나요?
    a: 전달 방법에 이메일을 표시하고, 발송일과 수신 확인 기록을 비고에 적어 함께 보관합니다.
  - q: 1차와 2차 통지를 한 장에 같이 쓰나요?
    a: 통지마다 따로 작성하는 것이 좋습니다. 통지 종류와 날짜가 섞이면 나중에 확인하기 어렵습니다.
related: [annual-leave-promotion-notice, annual-leave-timing-designation-notice, annual-leave-reply, unused-annual-leave-pay-request]
blocks:
  - type: doc_title
    text: 연차 사용 촉진 통지 수령 확인서
    spaced: false
  - type: subtitle
    text: 1. 수령인(근로자)
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["부서(팀)", "", "직위", ""]
      - ["성명", "", "입사일", ""]
    sample_rows:
      - ["", "영업지원팀", "", "대리"]
      - ["", "홍길동", "", "2022-03-02"]
  - type: subtitle
    text: 2. 통지 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["통지 종류", "", "통지서 작성일", ""]
      - ["전달 방법", "", "수령일", ""]
      - ["미사용 일수", "", "회신 기한", ""]
    sample_rows:
      - ["", "1차 사용 촉진 통지", "", "2026-10-30"]
      - ["", "직접 전달", "", "2026-10-30"]
      - ["", "11일", "", "2026-11-09"]
  - type: textbox
    hint: "전달 경위나 수령 시 특이사항(이메일 발송 기록, 대리 수령 등)이 있으면 적으십시오."
    height_mm: 24
    sample_text: "팀장이 면담 자리에서 통지서를 직접 전달했고, 근로자가 내용을 확인한 뒤 수령일을 적었습니다."
  - type: para
    text: 위 통지서를 위 날짜에 받았음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   30 일
  - type: sign_line
    labels: ["수령인", "회사 담당자"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 촉진 절차의 요건과 기한은 고용노동부 안내와 회사 규정을 확인하십시오. 통지서와 함께 보관하십시오.
