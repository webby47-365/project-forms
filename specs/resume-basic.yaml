id: resume-basic
title: 이력서 (기본형)
category: personal
subcategory: career
tags: [이력서, 입사지원서, 표준이력서, resume, 취업서류]
summary: 사진란·인적사항·학력·경력·자격·병역 항목을 갖춘 표준 1페이지 이력서 양식입니다.
usage: >
  입사지원 시 자기소개서와 함께 제출하는 기본 서식입니다. 학력은 최종학력부터 역순으로,
  경력은 최근 근무지부터 역순으로 작성합니다. 사진은 3개월 이내 촬영본을 사용하고,
  기재사항이 사실과 다를 경우 채용이 취소될 수 있으므로 정확하게 작성합니다.
source: original
featured: true
featured_rank: 1
series: resume
series_name: 이력서
variant: 기본형
variant_rank: 1
variant_use: 항목이 표준형이라 대부분의 채용에 무난합니다.

howto:
  - 사진은 3개월 이내에 찍은 것을 붙입니다.
  - 학력은 최종학력부터 거꾸로 적습니다.
  - 경력은 최근 근무지부터 거꾸로 적습니다.
  - 자격증은 취득일과 발급기관을 함께 적습니다.
  - 마지막에 작성일을 쓰고 이름 옆에 서명합니다.

faq:
  - q: 사진은 꼭 붙여야 하나요?
    a: 채용공고에 요구가 없으면 비워도 됩니다. 사진란이 있는 서식이라면 넣는 쪽이 무난합니다.
  - q: 경력이 없으면 어떻게 적나요?
    a: 경력란에 "해당 없음"이라고 적거나, 인턴·아르바이트 경험을 기간과 함께 적으면 됩니다.
  - q: 한글 파일이 왜 열리지 않나요?
    a: 한글 2010 이상에서 열립니다. 그보다 낮은 버전이라면 PDF나 Word 파일을 받으세요.
version: 1
created_by: manual
status: published

related: [cover-letter, job-application-form, career-description, portfolio-cover]

blocks:
  - type: doc_title
    text: 이력서

  - type: grid
    widths: [13, 16, 11, 14, 12, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 7.5
    merges:
      - [2, 1, 2, 5]   # 이메일 값 칸 병합
      - [3, 1, 3, 5]   # 주소 값 칸 병합
      - [0, 6, 4, 6]   # 사진란 (세로 병합)
    photo_cell: [0, 6]   # 예시 미리보기에서 이 칸에 증명사진 실루엣을 넣는다
    photo_mm: [24, 32]
    rows:
      - ["성명(한글)", "", "성명(한문)", "", "생년월일", "", "사진"]
      - ["성명(영문)", "", "성별", "", "휴대전화", "", ""]
      - ["이메일", "", "", "", "", "", ""]
      - ["주소", "", "", "", "", "", ""]
      - ["비상연락처", "", "관계", "", "전화", "", ""]
    sample_rows:
      - ["", "홍길동", "", "洪吉童", "", "1996-04-12", ""]
      - ["", "HONG GILDONG", "", "남", "", "010-1234-5678", ""]
      - ["", "gildong.hong@example.com", "", "", "", "", ""]
