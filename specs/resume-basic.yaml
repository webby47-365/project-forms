id: resume-basic
title: 이력서 (기본형)
category: personal
subcategory: career
tags: [이력서, 입사지원서, 표준이력서, resume, 취업서류]
summary: 사진란·인적사항·학력·경력·자격·병역 항목을 갖춘 표준 1페이지 이력서 양식입니다.
usage: >
  입사지원 시 자기소개서와 함께 제출하는 기본 서식입니다. 학력은 최종학력부터 역순으로,
  경력은 최근 근무지부터 역순으로 작성합니다. 사진은 3개월 이내 촬영본을 사용하고,
  기재사항이 사실과 다를 경우 채용이 취소될 수 있으므로 정확하게 작성합니다.
source: original
featured: true
featured_rank: 1
version: 1
created_by: manual
status: published

blocks:
  - type: doc_title
    text: 이력서

  - type: grid
    widths: [13, 16, 11, 14, 12, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 7.5
    merges:
      - [2, 1, 2, 5]   # 이메일 값 칸 병합
      - [3, 1, 3, 5]   # 주소 값 칸 병합
      - [0, 6, 4, 6]   # 사진란 (세로 병합)
    rows:
      - ["성명(한글)", "", "성명(한문)", "", "생년월일", "", "사진"]
      - ["성명(영문)", "", "성별", "", "휴대전화", "", ""]
      - ["이메일", "", "", "", "", "", ""]
      - ["주소", "", "", "", "", "", ""]
      - ["비상연락처", "", "관계", "", "전화", "", ""]

  - type: subtitle
    text: 1. 학력사항

  - type: table
    widths: [22, 30, 20, 16, 12]
    header: [재학기간, 학교명, 전공(학과), 졸업구분, 소재지]
    empty_rows: 3
    row_height_mm: 7.5

  - type: subtitle
    text: 2. 경력사항

  - type: table
    widths: [22, 26, 18, 20, 14]
    header: [근무기간, 회사명, 부서/직위, 담당업무, 퇴직사유]
    empty_rows: 3
    row_height_mm: 7.5

  - type: subtitle
    text: 3. 자격·면허 및 어학

  - type: table
    widths: [30, 28, 22, 20]
    header: [자격·면허명, 발급기관, 취득일, 등급/점수]
    empty_rows: 2
    row_height_mm: 7.5

  - type: subtitle
    text: 4. 병역 및 기타

  - type: grid
    widths: [16, 18, 16, 18, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 7.5
    rows:
      - ["병역구분", "", "복무기간", "", "계급", ""]
      - ["보훈대상", "", "장애여부", "", "희망연봉", ""]

  - type: para
    text: 위 기재사항은 사실과 다름이 없음을 확인합니다.
    align: center
    size: 11
    space_after: 2

  - type: date_line

  - type: sign_line
    label: 지원자

  - type: notice
    text: 채용절차의 공정화에 관한 법률에 따라 직무와 무관한 개인정보(가족의 학력·직업, 재산 등)는 요구·기재하지 않습니다.
