id: repayment-plan
title: 채무 변제계획서
category: legal
subcategory: notice
tags: [변제계획서, 채무변제계획, 분할상환계획, 채무이행계획, 변제일정표]
summary: 채무 금액과 분할 변제 일정을 구체적으로 정리하여 채무자의 이행 확약을 받는 변제계획서 양식입니다.
usage: >
  채무자가 일시에 갚기 어려운 금액을 일정 기간에 나누어 갚기로 채권자와 합의할 때 작성하는
  문서입니다. 채무의 발생일과 원금·이자, 현재 잔액을 먼저 특정하고 회차별 변제일과 변제금액,
  잔액을 표로 정리해 계획을 명확히 합니다. 변제를 지체했을 때의 조치를 함께 정해 두면 분쟁을
  줄일 수 있습니다. 작성 후에는 채무자와 채권자가 각각 1부씩 보관하는 것이 좋습니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 채권자와 채무자 정보를 적습니다.
  - 채무 발생일과 원금·이자, 현재 잔액을 적습니다.
  - 회차별 변제일과 변제금액, 남은 잔액을 표로 정리합니다.
  - 변제를 지체했을 때의 조치를 정하고 서명합니다.

faq:
  - q: 변제를 못 지키면 어떻게 되나요?
    a: 지체 시 조치를 미리 정해 두면 되며, 구체적인 절차는 계약 내용에 따라 다릅니다.
  - q: 서류는 누가 보관하나요?
    a: 작성 후 채무자와 채권자가 각각 한 부씩 보관하는 것이 좋습니다.

related: [loan-agreement, payment-pledge, certified-notice-loan, settlement-agreement]

