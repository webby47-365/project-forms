id: monthly-rent-receipt
title: 월세 영수증
category: estate
subcategory: lease
tags: [월세영수증, 차임영수증, 임대료영수증, 월세수령확인서, 관리비영수증]
summary: 해당 월의 차임과 관리비 납부 내역을 정리하고 임대인이 수령을 확인하는 반 페이지 영수증입니다.
usage: >
  매달 월세를 받을 때 임대인이 임차인에게 발급하는 영수증입니다. 임대 목적물과 해당 월,
  차임·관리비·기타 금액을 항목별로 적고 합계가 영수 금액과 일치하는지 확인하십시오.
  임차인은 이 영수증을 소득공제나 분쟁 시 납부 증거로 보관할 수 있으므로 임대인의 서명을
  반드시 받으십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

howto:
  - 임대 목적물과 해당 월을 적습니다.
  - 차임과 관리비, 기타 금액을 적습니다.
  - 합계를 계산해 영수 금액과 맞춥니다.
  - 임대인이 서명해 임차인에게 전달합니다.

faq:
  - q: 소득공제 자료로 쓸 수 있나요?
    a: 네, 임차인이 납부 증거로 보관하면 월세 소득공제 신청 시 참고 자료로 쓸 수 있습니다.
  - q: 관리비도 꼭 적어야 하나요?
    a: 별도로 받는다면 항목을 나눠 적어야 합계와 영수 금액이 맞습니다.

related: [housing-lease-contract, lease-termination-notice, deposit-return-notice]

