  - type: doc_title
    text: 월세 영수증
    spaced: true
  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 1]
    rows:
      - ["영수 금액", ""]
    sample_rows:
      - ["", "금 870,000원 (금 팔십칠만원)"]
  - type: subtitle
    text: 내역
  - type: grid
