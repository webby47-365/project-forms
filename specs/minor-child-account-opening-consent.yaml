id: minor-child-account-opening-consent
title: 미성년 자녀 금융계좌 개설 동의서
category: public
subcategory: family
tags: [미성년자계좌, 자녀통장, 법정대리인동의, 친권자동의, 계좌개설]
summary: 미성년 자녀의 은행·증권 계좌를 만들 때 부모 등 법정대리인이 동의함을 밝히는 미성년 자녀 금융계좌 개설 동의서 양식입니다.
usage: >
  자녀 이름으로 통장이나 증권 계좌를 만들 때 금융회사가 법정대리인의 동의를 확인하는 경우에 쓰는 서식입니다.
  자녀와 법정대리인의 인적사항, 개설할 금융회사와 계좌 종류, 동의하는 범위를 적습니다.
  금융회사마다 요구 서류와 자체 양식이 다르므로 방문 전에 먼저 확인하십시오. 가족관계증명서 등 관계 증빙은 금융회사 안내에 따라 따로 준비합니다.
source: original
featured: false
target_pages: 1
howto:
  - 자녀의 성명과 생년월일을 적습니다.
  - 동의하는 법정대리인의 성명과 관계를 적습니다.
  - 금융회사, 계좌 종류와 동의 범위를 적습니다.
  - 서명하고 금융회사가 요구하는 증빙과 함께 냅니다.
faq:
  - q: 부모 중 한 명만 동의해도 되나요?
    a: 금융회사마다 기준이 다릅니다. 방문 전에 한 명 동의로 충분한지 확인하십시오.
  - q: 이 서식으로 바로 계좌가 만들어지나요?
    a: 아닙니다. 금융회사 자체 양식이 우선일 수 있어, 이 서식은 동의 내용을 정리해 가는 용도입니다.
  - q: 주민등록번호를 적어야 하나요?
    a: 이 서식에는 생년월일만 적습니다. 본인 확인 번호는 금융회사 창구에서 따로 확인합니다.
related: [guardian-consent, minor-activity-consent, family-relationship-confirmation, resident-register-copy-poa]
