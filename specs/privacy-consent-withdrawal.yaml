id: privacy-consent-withdrawal
title: 개인정보 수집·이용 동의 철회서
category: public
subcategory: consent
tags: [개인정보동의철회, 동의철회서, 개인정보삭제요청, 마케팅동의철회, 정보주체]
summary: 이미 낸 개인정보 수집·이용 동의를 거두고 삭제·이용 중지를 요청하는 개인정보 동의 철회서입니다.
usage: >
  회사나 기관에 이전에 제공한 개인정보 수집·이용 동의를 철회하고 보유 정보의 삭제나 이용 중지를 요청할 때
  제출하는 서식입니다. 철회하려는 동의 항목과 당시 동의한 날짜, 요청 조치(삭제·이용 중지)를 분명히 적고,
  처리 결과를 어떻게 받을지 밝힙니다. 법령상 보관 의무가 있는 정보는 삭제되지 않을 수 있으므로 회신 내용을
  확인하고, 개인정보를 알려 주는 칸은 필요한 최소한만 적으십시오.
source: original
featured: false
target_pages: 1
howto:
  - 수신 기관명과 신청인 이름, 연락처를 적습니다.
  - 철회할 동의 항목과 동의했던 시기를 적습니다.
  - 요청 조치(삭제·이용 중지)를 고르고 사유를 적습니다.
  - 처리 결과 회신 방법을 적고 서명해 제출합니다.
faq:
  - q: 철회하면 모든 정보가 바로 삭제되나요?
    a: 법령에 따라 보관해야 하는 정보는 남을 수 있습니다. 어떤 정보가 삭제·보관되는지 회신으로 확인하십시오.
  - q: 철회 사유를 꼭 적어야 하나요?
    a: 필수가 아닌 경우가 많습니다. 다만 적어 두면 처리 담당자가 요청 범위를 파악하기 쉽습니다.
  - q: 회신은 언제까지 받을 수 있나요?
    a: 기관마다 처리 기간이 다릅니다. 제출할 때 희망 회신일을 적고 접수 확인을 받아 두십시오.
related: [privacy-consent, privacy-consent-marketing, privacy-consent-third, civil-petition]
blocks:
  - type: doc_title
    text: 개인정보 수집·이용 동의 철회서
    spaced: false
  - type: subtitle
    text: 1. 신청인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["수신 기관", "", "회신 방법", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "(주)한빛커머스", "", "이메일"]
  - type: subtitle
    text: 2. 철회 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
      - [3, 1, 3, 3]
    rows:
      - ["철회 대상", "", "", ""]
      - ["동의 시기", "", "요청 조치", ""]
      - ["대상 정보", "", "", ""]
      - ["철회 사유", "", "", ""]
    sample_rows:
      - ["", "마케팅 목적 개인정보 수집·이용 동의", "", ""]
      - ["", "2025-03-10", "", "삭제 및 이용 중지"]
      - ["", "이름, 연락처, 구매 이력", "", ""]
      - ["", "더 이상 광고성 정보를 받지 않기 위해", "", ""]
  - type: textbox
    hint: "삭제·이용 중지를 요청하는 정보의 범위와 추가 요청 사항을 적으십시오."
    height_mm: 26
    sample_text: "이름, 연락처, 구매 이력 중 마케팅에 이용되는 정보의 이용 중지와 삭제를 요청하며, 처리 결과를 이메일로 알려 주십시오."
  - type: para
    text: 위와 같이 개인정보 수집·이용 동의를 철회합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   15 일
  - type: sign_line
    labels: ["신청인"]
    sample_names: [홍길동]
  - type: notice
    text: 법령상 보관 의무가 있는 정보는 삭제되지 않을 수 있습니다. 기관의 안내를 확인하십시오.
