    lines:
    - - l
      - 1. 연금보험료 납부 예외 신청의 경우에는 “[ ]납부 예외신청서”란에, 납부 재개신고의 경우에는 “[ ]납부 재개신고서”란에 “√”표시를 하십시오.
    - - l
      - 2. “납부 재개 예정일”란에는 지역가입자는 납부 예외기간이 종료되는 일자를, 사업장가입자의 경우에는 복직발령(예정)일자를 납부 예외 신청 시 적으십시오.
    - - l
      - <납부 예외 신청시>
    - - l
      - 3. “지역가입자 예외사유부호”란 또는 “사업장가입자 예외사유부호”란에는 각각 그 납부 예외사유에 해당하는 번호를 적으십시오.
    - - l
      - 4. “납부 예외일”란에는 납부예외사유의 발생으로 연금보험료 납부가 곤란하게 된 날을 적으십시오.
    - - l
      - 5. 사업장가입자 예외사유 부호 중 “12. 무보수 대표이사”는 2011년 6월 6월까지 신청 가능하고, 2011년 6월 7일부터는 국민연금 사업장가입자 상실사유에 해당합니다.
    - - l
      - <납부 재개 신고시>
    - - l
      - 6. “소득월액”란에는 납부 예외 신청사유가 소멸할 당시 종사하는 업무에서 얻는 소득을 기준으로 소득월액을 적으십시오.
    - - l
      - 7. 재개월의 납부희망여부는 재개일이 1일인 경우를 제외하고 적습니다.
    - - l
      - 8. “특수직종부호”란에는 해당 근로자가 「광업법」 제3조에 따른 광업 종사자 중 갱내근로자인 광원인 경우에는 “1”을, 「선원법」 제2조에 따른 선박 중 어선에서 직접 어로작업에 종사하는 “부원”인 경우에는 “2”를 적으십시오.
    - - l
      - 9. “보험료자동이체신청”란은 지역가입자가 납부 재개 신고를 하는 경우에만 작성하여 주시고, 가입자 본인이 거래하는 은행, 우체국, 농협ㆍ수협 등의 금융기관명과 계좌번호를 적되, 대신 납부할 경우에는 예금주 성명, 주민등록번호, 가입자와의 관계를 적으십시오.
    - - l
      - 10. 「국민연금법」 제100조의4에 따른 지역가입자 연금보험료 지원 신청은 2026년 1월 1일 이후 납부 재개를 신고하는 경우부터 가능하며, 신청 후 지원요건을 별도로 확인하여 개별 통지해드립니다.
    - - l
      - 11. 착오 등으로 잘못 신고한 경우에는 즉시 정정신고 하거나 공단에 문의하시기 바랍니다.
    size: 7.2
