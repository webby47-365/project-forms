id: retirement-application
title: 퇴직원
category: corp
subcategory: hr
tags: [퇴직원, 퇴직신청서, 사직서, 퇴직금 정산, 퇴사서류]
summary: 퇴직 사유와 퇴직일, 퇴직금·연차 정산 및 인수인계 확인란을 갖춘 퇴직원 양식입니다.
usage: >
  퇴직 의사를 정식으로 알리면서 퇴직금·미사용 연차 정산과 업무 인수인계 여부까지 함께
  확인받는 서류입니다. 퇴직 사유를 선택하고 퇴직희망일을 기재한 뒤, 퇴직금과 미사용
  연차수당 정산 확인란, 업무 인수인계 완료 확인란에 표시합니다. 담당·팀장·인사 결재를
  거쳐 처리되므로 퇴직희망일로부터 충분한 여유를 두고 제출하십시오. 정산 기준은
  취업규칙과 근로기준법을 따릅니다.
source: original
featured: false
target_pages: 1
series: resignation
series_name: 사직서
variant: 퇴직원
variant_rank: 3
version: 1
created_by: agent
status: published
variant_use: 퇴직금·연차 정산과 인수인계 확인까지 함께 남길 때 씁니다.

howto:
  - 성명과 소속, 직위를 적습니다.
  - 퇴직 사유와 퇴직희망일을 적습니다.
  - 퇴직금과 미사용 연차수당 정산 확인란에 표시합니다.
  - 업무 인수인계 완료 여부를 표시합니다.
  - 담당·팀장·인사 결재를 받아 제출합니다.

faq:
  - q: 퇴직원과 사직서는 다른 건가요?
    a: 같은 목적의 서류입니다. 이 양식은 정산·인수인계 확인란을 함께 두어 처리 절차를 한 번에 정리합니다.
  - q: 제출은 언제까지 해야 하나요?
    a: 정해진 기한은 없지만 인수인계와 결재에 걸리는 시간을 고려해 퇴직희망일보다 충분히 앞서 제출하십시오.

related: [severance-calculation, handover-report, career-certificate, asset-handover]

