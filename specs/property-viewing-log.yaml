id: property-viewing-log
title: 부동산 임장 기록표
category: estate
subcategory: lease
tags: [부동산임장기록표, 매물비교표, 임장노트, 집보러다니기, 매물체크리스트]
summary: 여러 매물을 직접 둘러보며 조건과 상태를 기록하고 항목별로 비교·평가하는 임장 기록표입니다.
usage: >
  전세·월세나 매매 매물을 여러 곳 둘러볼 때 조건과 느낀 점을 그 자리에서 기록해 두는
  서식입니다. 매물별로 주소·면적·층·보증금 또는 매매가·관리비·입주가능일을 적고 짧은
  평가를 남기면 나중에 비교하기 쉽습니다. 교통·채광·소음·주차처럼 공통 항목을 매물별로
  나란히 적어 비교 평가표를 채우고, 마지막에 종합 의견을 정리해 우선순위를 정하십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

howto:
  - 조사일과 조사자, 지역, 목적을 적습니다.
  - 매물별로 주소·면적·층·보증금(또는 매매가)을 기재합니다.
  - 교통·채광·소음·주차 등 공통 항목을 매물별로 평가합니다.
  - 매물별로 짧은 소감을 남깁니다.
  - 마지막에 종합 의견과 우선순위를 정리합니다.

faq:
  - q: 매물을 몇 곳까지 비교할 수 있나요?
    a: 표 형식이라 여러 매물을 나란히 적어 한 번에 비교할 수 있습니다.
  - q: 관리비도 꼭 확인해야 하나요?
    a: 네, 관리비와 입주가능일까지 함께 확인해야 나중에 비교가 정확해집니다.

related: [housing-lease-contract, real-estate-sale-contract, move-in-checklist, moving-checklist]

blocks:
  - type: doc_title
    text: 부동산 임장 기록표
    spaced: false
  - type: subtitle
    text: 1. 조사 개요
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["조사일", "", "조사자", ""]
      - ["지역", "", "목적", ""]
    sample_rows:
      - ["", "2026-09-20", "", "홍길동"]
      - ["", "서울특별시 마포구 일대", "", "전세 이주 목적 매물 비교"]
  - type: subtitle
    text: 2. 매물별 조사
  - type: table
    widths: [24, 10, 8, 18, 10, 14, 16]
    header: ["매물명·주소", "면적", "층", "보증금·월세/매매가", "관리비", "입주가능일", "평가"]
    empty_rows: 6
    row_height_mm: 8
    sample_rows:
      - ["한빛아파트 101동(월드컵북로 100)", "84㎡", "15/20", "전세 4.5억", "10만원", "즉시", "채광 좋음, 역 도보 5분"]
      - ["새길오피스텔 302호(양화로 50)", "38㎡", "3/10", "월세 80/60", "7만원", "2026-11-01", "주차 협소"]
      - ["한강뷰빌 502호(토정로 20)", "59㎡", "5/12", "전세 3.2억", "8만원", "2026-10-15", "소음 있음"]
  - type: subtitle
    text: 3. 비교 평가
  - type: table
    widths: [25, 25, 25, 25]
    header: ["항목", "A매물", "B매물", "C매물"]
    empty_rows: 6
    row_height_mm: 8
    sample_rows:
      - ["교통", "역 도보 5분, 버스 多", "역 도보 12분", "역 도보 8분"]
      - ["채광", "남향, 우수", "동향, 보통", "남서향, 양호"]
      - ["소음", "도로 인접, 보통", "조용함", "저층, 소음 약간"]
      - ["주차", "1세대 1대", "협소, 추가요금", "1세대 1대"]
  - type: subtitle
    text: 4. 종합 의견
  - type: textbox
    hint: "비교한 매물 중 우선순위와 선택 이유를 정리하십시오."
    height_mm: 26
    sample_text: "교통과 채광을 우선 고려하여 한빛아파트를 1순위로 본다. 전세가가 예산보다 높아 새길오피스텔을 2순위로 두고 임대인과 가격 협의를 진행할 계획이다."
  - type: date_line
    sample_text: 2026 년    9 월   20 일
  - type: sign_line
    label: 작성자
    sample_names: [홍길동]
  - type: notice
    text: 매물 정보는 현장 확인 시점을 기준으로 기록하고, 계약 전 등기부등본 등으로 다시 확인하십시오.
