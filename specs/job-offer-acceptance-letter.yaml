id: job-offer-acceptance-letter
title: 입사 승낙서
category: personal
subcategory: career
tags: [입사승낙, 채용승낙, 입사확약, 합격수락, 오퍼수락]
summary: 채용 제안을 받은 지원자가 입사 의사와 출근일을 회사에 서면으로 알리는 입사 승낙서입니다.
usage: >
  합격 통보와 근로 조건 제안을 받은 지원자가 입사를 확정하며 회사에 제출하는 서식입니다.
  회사명과 직무, 제안받은 조건 요약, 출근 가능일을 적고 서명합니다. 연봉과 근무 조건은 제안서와
  같은지 확인한 뒤 적고, 근로계약서는 별도로 작성합니다. 이 서식은 입사 의사를 알리는 틀이며
  근로계약을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 지원자 성명과 연락처를 적습니다.
  - 회사명과 직무, 제안받은 조건을 적습니다.
  - 출근 가능일을 적습니다.
  - 날짜와 서명을 적어 회사에 제출합니다.
faq:
  - q: 승낙서를 내면 근로계약이 되나요?
    a: 근로계약서는 따로 작성합니다. 승낙서는 입사 의사를 알리는 문서입니다.
  - q: 조건이 다르면 어떻게 하나요?
    a: 제안서와 다른 부분은 승낙 전에 회사와 조율하고, 조율한 내용을 비고에 적으십시오.
  - q: 승낙 후 마음이 바뀌면요?
    a: 가능한 한 빨리 회사에 알리는 것이 좋습니다. 절차는 회사 안내를 확인하십시오.
related: [labor-contract-standard, reference-check-consent, employment-insurance-history-request, resignation-letter]
blocks:
  - type: doc_title
    text: 입사 승낙서
    spaced: true
  - type: subtitle
    text: 1. 지원자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "이메일", ""]
    sample_rows:
      - ["", "이수현", "", "1996-04-12"]
      - ["", "010-1234-5678", "", "user@example.com"]
  - type: subtitle
    text: 2. 제안받은 조건
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["회사명", "", "부서·직무", ""]
      - ["고용 형태", "", "근무지", ""]
      - ["제안 연봉", "", "출근 가능일", ""]
    sample_rows:
      - ["", "(주)새길데이터", "", "데이터팀 · 분석"]
      - ["", "정규직", "", "서울 본사"]
      - ["", "연 4,200만원", "", "2026-12-01"]
  - type: subtitle
    text: 3. 비고
  - type: textbox
    hint: "조율한 내용이나 회사에 전할 말이 있으면 적으십시오."
    height_mm: 20
    sample_text: "제안서의 조건에 동의하며, 입사 전 필요한 서류는 안내에 따라 제출하겠습니다."
  - type: para
    text: 위 조건으로 귀사의 채용 제안을 승낙하며 입사하겠습니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   10 일
  - type: sign_line
    label: 지원자
    sample_names: [이수현]
  - type: notice
    text: 근로 조건은 별도의 근로계약서로 확정합니다.
