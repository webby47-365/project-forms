id: board-minutes
title: 이사회 의사록
category: corp
subcategory: startup
tags: [이사회의사록, 이사회결의서, 법인서류, 의사록]
summary: 이사회의 일시·장소·출석 현황과 안건별 결의 결과를 기록하는 이사회 의사록입니다.
usage: >
  상법에 따라 이사회 결의는 의사록으로 남겨야 하며, 출석 이사와 감사가 기명날인 또는
  서명해야 합니다. 대표이사 선임, 신주 발행, 지점 설치 등 등기가 필요한 사항은 이 의사록이
  등기 첨부서류가 되므로 안건과 결의 내용을 법무사·등기소가 요구하는 문구로 정확히 적어야
  합니다. 결의에 특별한 이해관계가 있는 이사는 의결권이 없으니 출석·의결 인원을 구분해
  기재하십시오.
source: law-standard
source_note: 상법상 이사회 의사록 기재사항을 참고하여 자체 제작
featured: false
target_pages: 1
howto:
  - 회사명과 개최 일시·장소, 소집 절차를 적습니다.
  - 출석한 이사와 감사를 확인해 기재합니다.
  - 안건별로 논의 내용과 결의 결과를 적습니다.
  - 의장과 출석 이사가 기명날인 또는 서명합니다.

faq:
  - q: 특별한 이해관계가 있는 이사는 어떻게 하나요?
    a: 해당 안건에는 의결권이 없으므로 출석 인원과 의결 인원을 구분해 적으십시오.
  - q: 등기에 쓸 의사록은 문구를 조심해야 하나요?
    a: 네, 대표이사 선임 등 등기 사항은 법무사나 등기소가 요구하는 문구를 확인해 작성하십시오.

related: [shareholder-meeting-minutes, director-acceptance, articles-of-incorporation]

blocks:
  - type: doc_title
    text: 이사회 의사록
    spaced: false
  - type: grid
    widths: [14, 26, 14, 20, 26]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [2, 1, 2, 4]
    rows:
      - ["회사명", "", "회차", "", "소집권자"]
      - ["개최일시", "", "개최장소", "", "의장"]
      - ["소집통지", "", "", "", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "제5회", ""]
      - ["", "2026-09-10 10:00", "", "본사 3층 회의실", ""]
      - ["", "개최 7일 전 이메일 통지", "", "", ""]
  - type: subtitle
    text: 출석 현황
  - type: grid
    widths: [20, 13, 20, 13, 20, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["재임 이사 수", "명", "출석 이사 수", "명", "의결권 있는 이사", "명"]
      - ["출석 이사 성명", "", "", "", "", ""]
      - ["출석 감사 성명", "", "", "", "", ""]
    sample_rows:
      - ["", "", "", "", "", ""]
      - ["", "홍길동", "김서연", "박민준", "", ""]
      - ["", "이수현", "", "", "", ""]
  - type: subtitle
    text: 안건 및 결의 사항
  - type: table
    widths: [8, 32, 40, 20]
    header: ["No", 안건, 결의 내용, 결의 결과]
    empty_rows: 4
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["1", "대표이사 선임", "이사 전원 찬성으로 선임 가결", "원안대로 가결"]
      - ["2", "지점 설치 승인", "서울 강남구 지점 설치안 심의", "원안대로 가결"]
  - type: textbox
    hint: "주요 논의 경과와 반대·유보 의견이 있었던 경우 그 내용을 기재하십시오."
    height_mm: 24
    sample_text: 신규 지점 설치에 따른 임대차 계약 조건에 대해 질의가 있었으며, 의장이 충분히 답변한 후 표결을 진행하였다.
  - type: para
    text: 의장은 이상으로 이사회의 모든 안건 심의를 마쳤음을 알리고 폐회를 선언하였다. 위 결의를 명확히 하기 위하여 본 의사록을 작성하고 출석한 이사 및 감사가 기명날인한다.
    align: both
    size: 10
    space_after: 2
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: table
    widths: [25, 30, 45]
    header: [직위, 성명, 서명 또는 인]
    empty_rows: 4
    row_height_mm: 11
    body_align: center
    sample_rows:
      - ["대표이사", "홍길동", ""]
      - ["이사", "김서연", ""]
      - ["감사", "박민준", ""]
  - type: notice
    text: 등기 첨부서류로 사용하는 경우 요구되는 문구와 인감증명·공증 필요 여부를 등기소 또는 법무사에게 먼저 확인하십시오. 결의에 특별한 이해관계가 있는 이사는 의결권이 없습니다.
