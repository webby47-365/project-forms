id: vat-filing-document-confirmation
title: 부가가치세 신고자료 제출확인서
category: public
subcategory: tax
tags: [부가세신고자료제출확인서, 세무대리인제출확인, 부가세신고서류목록, 매입매출자료제출, 세무사자료전달]
summary: 사업자가 부가가치세 신고를 위해 세무대리인에게 넘긴 증빙자료의 종류와 매수를 확인하는 제출확인서입니다.
usage: >
  개인·법인 사업자가 부가가치세 신고를 앞두고 세금계산서·영수증 같은 증빙자료를
  세무대리인(세무사)에게 넘길 때, 넘긴 자료의 종류와 매수를 함께 확인해 분실이나
  누락을 방지하는 문서입니다. 신고 기한 전에 자료를 빠짐없이 전달했는지 서로
  확인하는 용도이며, 세액 계산이나 신고 내용의 적정성을 이 문서가 보장하지는
  않습니다. 신고를 마친 뒤에는 신고서 접수증 사본도 함께 보관해 두십시오.
source: original
featured: false
target_pages: 1

howto:
  - 사업자 정보와 신고 대상 기간을 적습니다.
  - 세무대리인(사무소) 정보를 적습니다.
  - 전달한 자료의 종류와 매수를 표에 적습니다.
  - 사업자와 세무대리인이 함께 확인하고 서명합니다.

faq:
  - q: 이 확인서로 세액까지 확인해 주나요?
    a: 아닙니다. 자료 전달 여부만 확인하는 문서이며 세액 계산은 세무대리인의 검토에 따릅니다.
  - q: 전자 파일로 전달한 자료도 적나요?
    a: 네. 이메일·홈택스 전자자료처럼 실물이 아닌 자료도 종류와 건수를 함께 적습니다.
  - q: 자료가 누락된 채 신고 기한이 지나면 어떻게 하나요?
    a: 수정신고나 경정청구가 가능한 경우가 있으니 세무대리인과 먼저 상담하십시오.

related: [tax-invoice, account-ledger, withholding-request]

blocks:
  - type: doc_title
    text: 부가가치세 신고자료 제출확인서
    spaced: false

  - type: subtitle
    text: 사업자 / 신고 기간

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["상호(성명)", "", "사업자등록번호", ""]
      - ["신고 기간", "", "신고 구분", ""]
      - ["세무대리인(사무소)", "", "담당자 연락처", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "2026년 2기 확정(10~12월)", "", "일반과세자"]
      - ["", "새길세무회계", "", "010-1234-5678"]

  - type: subtitle
    text: 제출 자료 내역

  - type: table
    widths: [7, 24, 12, 15, 42]
    header: ["No", 자료구분, 매수/건수, 제출일, 비고]
    empty_rows: 6
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "매출 세금계산서", "42건", "2026-09-10", "홈택스 전자발급분"]
      - ["2", "매입 세금계산서", "58건", "2026-09-10", "홈택스 전자발급분"]
      - ["3", "카드매출 전표", "1건", "2026-09-10", "여신금융협회 자료 취합본"]
      - ["4", "간이영수증(3만원 초과분)", "6건", "2026-09-12", "실물 스캔본 전달"]

  - type: textbox
    hint: "누락 가능성이 있는 자료나 추가로 확인이 필요한 사항을 적으십시오."
    height_mm: 18
    sample_text: 9월분 일부 카드매출 전표는 10월 초 추가 전달 예정.

  - type: notice
    text: 이 확인서는 자료 전달 여부만 확인하며 세액 계산·신고 내용은 세무대리인의 검토에 따릅니다.

  - type: date_line
    sample_text: 2026 년    9 월   16 일

  - type: sign_line
    labels: ["사업자", "세무대리인(담당자)"]
    sample_names: [홍길동, 김서연]
