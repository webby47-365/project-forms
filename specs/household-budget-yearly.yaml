summary: 한 해의 월별 수입·지출과 저축을 기록하고 항목별 연간 집계와 내년 목표를 정리하는 연간 가계부 양식입니다.
usage: >
  한 해 동안의 가계 흐름을 월 단위로 누적 관리하는 양식입니다. 매월 수입과 고정지출·변동지출·
  저축을 기록하여 월말 잔액을 계산하고, 연말에는 연간 합계와 항목별 집계표로 지출 비중을
  점검합니다. 내년 목표란에는 개선하고 싶은 소비·저축 계획을 적어 두면 다음 해 예산을
  수립할 때 근거 자료로 활용할 수 있습니다. 금액 산출이나 세무 처리가 필요한 경우에는
  별도로 전문가와 상담하십시오.
