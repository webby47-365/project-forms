id: payment-due-extension-request
title: 대금 지급기일 연장 요청서
category: corp
subcategory: sales
tags: [대금지급연장, 결제기일연장, 지급기한연장요청, 외상대금, 거래대금]
summary: 거래 대금을 정해진 날까지 지급하기 어려울 때 새 지급일과 분할 계획을 적어 상대방에게 양해를 구하는 요청서입니다.
usage: >
  납품받은 물품이나 용역의 대금을 약속한 날 안에 주기 어려울 때 상대 거래처에 보내는 서식입니다.
  거래 내역과 원래 지급기일, 미지급 금액, 희망하는 새 지급일을 적고 사정을 간단히 밝힙니다.
  나누어 지급하려면 회차별 금액과 날짜를 함께 적으면 상대방이 판단하기 쉽습니다. 요청서를
  보냈다고 기일이 자동으로 늦춰지는 것은 아니며 상대방이 승낙해야 효력이 있으므로, 회신란을
  받아 보관하십시오. 이 서식은 요청 내용을 기록하는 틀이며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 받는 거래처와 보내는 사람의 상호·담당자를 적습니다.
  - 거래 내역과 원래 지급기일, 미지급 금액을 적습니다.
  - 희망하는 새 지급일이나 분할 지급 계획을 적습니다.
  - 사유를 짧게 적고 서명한 뒤 상대방의 승낙 회신을 받습니다.
faq:
  - q: 보내기만 하면 지급기일이 늦춰지나요?
    a: 아닙니다. 상대방이 승낙해야 합니다. 승낙 여부를 회신란에 받아 보관하십시오.
  - q: 분할해서 갚겠다고 적어도 되나요?
    a: 됩니다. 회차별 금액과 날짜를 표에 적으면 상대방이 검토하기 쉽습니다.
  - q: 지연 이자는 어떻게 되나요?
    a: 거래 계약에 정한 내용을 따릅니다. 이 서식에 정함이 없으면 특약란에 합의 내용을 적으십시오.
related: [payment-confirmation, transaction-statement, settlement-agreement, contract-period-extension-request]
