id: privacy-correction-deletion-request
title: 개인정보 정정·삭제 요구서
category: public
subcategory: consent
tags: [개인정보정정, 개인정보삭제, 정정요구, 삭제요구, 개인정보보호]
summary: 회사나 기관이 보유한 내 개인정보가 틀렸거나 더 이상 필요 없을 때 정정 또는 삭제를 요구하는 개인정보 정정·삭제 요구서 양식입니다.
usage: >
  기관이 가지고 있는 내 개인정보를 바로잡거나 지워 달라고 서면으로 요구할 때 쓰는 서식입니다.
  요구 대상 기관, 정정 또는 삭제할 항목과 현재 내용, 바라는 내용을 한 줄씩 적고 사유를 덧붙입니다.
  본인 확인에 필요한 서류는 기관마다 다르므로 제출 전에 문의하십시오. 법령상 보존 의무가 있는 정보는 삭제되지 않을 수 있습니다.
source: original
featured: false
target_pages: 1
howto:
  - 요구자 성명과 연락처, 요구 대상 기관을 적습니다.
  - 정정 또는 삭제 중 하나를 고르고 대상 항목을 적습니다.
  - 현재 내용과 바라는 내용을 나란히 적습니다.
  - 사유를 적고 서명해 기관의 담당 부서에 냅니다.
faq:
  - q: 정정과 삭제를 한 장에 같이 써도 되나요?
    a: 항목마다 구분란에 정정 또는 삭제를 적으면 한 장에 함께 쓸 수 있습니다.
  - q: 요구하면 바로 지워지나요?
    a: 기관이 법령상 보존해야 하는 정보는 삭제되지 않을 수 있습니다. 처리 결과는 기관 안내를 확인하십시오.
related: [privacy-access-request, privacy-processing-suspension-request, privacy-consent-withdrawal]
blocks:
  - type: doc_title
    text: 개인정보 정정·삭제 요구서
    spaced: false
  - type: subtitle
    text: 1. 요구자와 대상 기관
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["요구자", "", "연락처", ""]
      - ["생년월일", "", "요구일", ""]
      - ["요구 대상 기관", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "1995-03-02", "", "2026-11-12"]
      - ["", "(주)한빛커머스 고객지원팀", "", ""]
  - type: subtitle
    text: 2. 정정·삭제를 요구하는 항목
  - type: table
    widths: [7, 14, 21, 29, 29]
    header: ["No", 구분, 대상 항목, 현재 내용, 바라는 내용]
    empty_rows: 5
    row_height_mm: 8
    sample_rows:
      - ["1", "정정", "휴대전화", "010-0000-0000", "010-1234-5678"]
      - ["2", "삭제", "마케팅 수신 정보", "이메일 수신 등록", "삭제"]
  - type: subtitle
    text: 3. 요구 사유
  - type: textbox
    hint: "정정 또는 삭제가 필요한 이유를 구체적으로 적으십시오."
    height_mm: 28
    sample_text: "연락처가 바뀌었는데 기존 번호로 안내가 계속 가고 있어 정정을 요구합니다. 더 이상 이용하지 않는 서비스의 수신 정보는 삭제를 요구합니다."
  - type: date_line
    sample_text: 2026 년   11 월   12 일
  - type: sign_line
    labels: ["요구자"]
    sample_names: [홍길동]
  - type: notice
    text: 본인 확인 서류와 처리 기한은 기관 안내를 확인하십시오.
