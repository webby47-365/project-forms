id: year-end-donation-submission
title: 연말정산 기부금 제출서
category: corp
subcategory: finance
tags: [연말정산, 기부금, 기부금제출, 기부금영수증, 기부금공제]
summary: 연말정산을 위해 근로자가 한 해 동안 낸 기부금 내역과 영수증 증빙을 회사에 제출할 때 쓰는 기부금 제출서 양식입니다.
usage: >
  연말정산 때 국세청 간소화 자료에 조회되지 않는 기부금을 회사에 알리고 영수증을 내는 서식입니다.
  기부한 사람, 기부처, 기부일과 금액, 영수증 번호를 표에 한 줄씩 적고 기부금 영수증 사본을 붙입니다.
  기부금의 종류에 따라 공제 방식과 한도가 달라지므로 종류 칸을 정확히 고르는 것이 중요합니다.
  공제 대상 여부는 세법과 회사 안내에 따라 달라지니 담당 부서와 국세청 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 제출자의 성명과 소속, 제출일을 적습니다.
  - 기부일과 기부처, 기부금 종류, 금액을 한 줄씩 적습니다.
  - 영수증 번호를 옮겨 적고 합계를 계산합니다.
  - 기부금 영수증 사본을 붙여 담당 부서에 냅니다.
faq:
  - q: 간소화 자료에 있는 기부금도 다시 내야 하나요?
    a: 이미 조회되는 내역은 보통 따로 내지 않습니다. 자료에 빠진 내역만 적는 편이 좋습니다.
  - q: 기부금 종류는 어디서 확인하나요?
    a: 기부금 영수증에 적힌 기부금 구분을 그대로 옮깁니다. 모르면 기부처에 문의하십시오.
  - q: 가족이 낸 기부금도 적을 수 있나요?
    a: 공제 대상 가족인지에 따라 달라집니다. 담당 부서에 확인한 뒤 기부자를 구분해 적으십시오.
related: [year-end-tax-checklist, donation-receipt-request, year-end-medical-expense-submission, year-end-dependent-change-notice]
blocks:
  - type: doc_title
    text: 연말정산 기부금 제출서
    spaced: false
  - type: subtitle
    text: 1. 제출자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "소속", ""]
      - ["직위", "", "제출일", ""]
      - ["귀속 연도", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "(주)한빛커머스 영업팀"]
      - ["", "과장", "", "2026-11-07"]
      - ["", "2026년", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 기부금 내역
  - type: table
    widths: [7, 14, 22, 15, 14, 14, 14]
    header: ["No", 기부일, 기부처, 기부금 종류, 기부자, 금액(원), 영수증 번호]
    empty_rows: 6
    row_height_mm: 8
    sample_rows:
      - ["1", "2026-03-10", "한빛복지재단", "지정기부금", "홍길동", "100,000", "A-0001"]
      - ["2", "2026-08-22", "새길장학회", "지정기부금", "홍길동", "200,000", "B-0042"]
      - ["3", "2026-10-05", "수해 이웃돕기", "특례기부금", "홍길동", "50,000", "C-0107"]
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["기부금 합계", "", "증빙 첨부", ""]
    sample_rows:
      - ["", "350,000원", "", "영수증 3부"]
  - type: textbox
    hint: "기부자가 본인이 아닌 경우 관계와 사유 등 구분이 필요한 내용을 적으십시오."
    height_mm: 20
    sample_text: "모든 기부는 본인 명의로 했고 영수증 사본을 첨부했습니다."
  - type: date_line
    sample_text: 2026 년   11 월    7 일
  - type: sign_line
    labels: ["제출자"]
    sample_names: [홍길동]
  - type: notice
    text: 공제 대상과 한도는 세법과 회사 안내를 확인하십시오.
