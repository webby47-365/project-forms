id: license-contract
title: 상표·저작물 사용허락 계약서
category: legal
subcategory: contract
tags: [상표사용계약서, 저작물이용허락, 라이선스계약서, 사용료계약, 독점사용계약]
summary: 상표·저작물의 사용 범위·기간·사용료와 품질 유지 의무를 정하는 사용허락 계약서입니다.
usage: >
  상표권자·저작권자(갑)가 제3자(을)에게 상표나 저작물을 일정 범위에서 사용하도록 허락할
  때 사용합니다. 허락 대상을 등록번호 등으로 구체적으로 특정하고, 사용 지역·기간·매체와
  독점 여부를 명확히 정해야 합니다. 사용료의 산정 방식과 정산 시기, 품질 유지와 출처 표시
  의무, 재허락(서브라이선스) 가능 여부도 분쟁이 많은 항목이므로 구체적으로 기재하십시오.
  본 서식은 참고용이며 법적 효력은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 2
version: 1
created_by: agent
status: published

howto:
  - 갑과 을의 인적사항과 상표·저작물 등록번호를 적습니다.
  - 사용 범위와 지역, 기간을 정합니다.
  - 사용료 산정 방식과 정산 시기를 기재합니다.
  - 품질 유지 의무를 확인하고 양쪽이 서명 날인합니다.

faq:
  - q: 독점 사용과 비독점 사용은 어떻게 다르나요?
    a: 독점은 을에게만 사용을 허락하는 것이고, 비독점은 갑이 다른 사람에게도 동시에 허락할 수 있습니다.
  - q: 재허락(서브라이선스)은 자유롭게 가능한가요?
    a: 계약서에 별도로 허용하지 않는 한 갑의 사전 동의 없이는 제3자에게 재허락할 수 없습니다.

related: [nda, mou-agreement, franchise-contract, distributor-contract]

blocks:
  - type: doc_title
    text: 상표·저작물 사용허락 계약서
    spaced: false
  - type: para
    text: 갑과 을은 다음과 같이 상표·저작물 사용허락 계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["갑(허락권자)", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["을(사용자)", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "(주)새길데이터", "", "000-00-00000"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-5678-1234"]
  - type: subtitle
    text: 허락 대상의 표시
  - type: table
    widths: [16, 34, 30, 20]
    header: [구분, 명칭, 등록번호/출원번호, 비고]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["상표", "한빛", "40-2025-000000", "포장재·온라인몰 표기용"]
      - ["저작물", "한빛 캐릭터 디자인", "C-2025-000000", "상세페이지 삽입용"]
  - type: subtitle
    text: 사용 조건
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사용지역", "", "독점 여부", ""]
      - ["사용기간", "", "사용매체", ""]
      - ["사용료", "", "정산일", ""]
    sample_rows:
      - ["", "대한민국 전역", "", "비독점"]
      - ["", "2026-10-01 ~ 2029-09-30 (3년)", "", "온라인 쇼핑몰 및 포장재"]
      - ["", "연 5,000,000원", "", "매년 10월 31일"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 갑이 보유한 위 상표·저작물을 을이 위 사용 조건에 따라 사용하도록 허락하는 것을 목적으로 한다."
  - type: article
    heading: 제2조 (허락 대상)
    lines:
      - "허락 대상은 위 표에 기재된 상표 및 저작물에 한하며, 을은 그 외의 갑의 권리를 사용할 수 없다."
  - type: article
    heading: 제3조 (사용 범위)
    lines:
      - "을은 위 사용지역, 사용기간, 사용매체의 범위 내에서만 허락 대상을 사용할 수 있다."
      - "독점 여부가 '독점'인 경우 갑은 동일한 범위에서 제3자에게 중복하여 사용을 허락하지 아니한다."
  - type: article
    heading: 제4조 (사용료와 정산)
    lines:
      - "을은 위 사용료를 위 정산일까지 갑이 지정한 계좌로 지급한다."
      - "사용료를 매출액 기준으로 산정하는 경우 을은 정산 근거자료를 갑에게 제출한다."
  - type: article
    heading: 제5조 (품질 유지와 표시 의무)
    lines:
      - "을은 허락 대상의 품질과 이미지를 훼손하지 않도록 사용하며, 갑이 정하는 표시 기준(로고 규격, 출처 표기 등)을 준수한다."
  - type: article
    heading: 제6조 (제3자 권리 침해)
    lines:
      - "갑은 허락 대상이 제3자의 권리를 침해하지 않음을 보증한다. 을의 사용 방식으로 인하여 발생한 제3자와의 분쟁은 을이 책임진다."
  - type: article
    heading: 제7조 (재허락 금지)
    lines:
      - "을은 갑의 사전 서면 동의 없이 허락 대상의 사용권을 제3자에게 재허락하거나 양도할 수 없다."
  - type: page_break
  - type: article
    heading: 제8조 (계약 종료 후의 처리)
    lines:
      - "계약이 종료된 경우 을은 허락 대상의 사용을 즉시 중단하고, 보유하던 관련 자료·표시물을 갑에게 반환하거나 폐기한다."
  - type: article
    heading: 제9조 (손해배상)
    lines:
      - "당사자 일방이 본 계약을 위반하여 상대방에게 손해를 입힌 경우 그 손해를 배상한다."
  - type: article
    heading: 제10조 (관할)
    lines:
      - "본 계약에 관한 분쟁은 갑의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["갑(허락권자)", "을(사용자)"]
    sample_names: ["(주)한빛커머스 대표 김서연", "(주)새길데이터 대표 박민준"]
  - type: notice
    text: 상표권·저작권의 등록 현황과 침해 여부는 특허청·저작권위원회 등을 통해 사전에 확인하고, 구체적 법률 판단은 관련 법령과 전문가에게 확인하십시오.
