id: illegal-structure-report
title: 불법 건축물 신고서
category: public
subcategory: civil
tags: [불법건축물, 위반건축물, 무단증축, 신고서, 민원]
summary: 허가 없이 증축·개축된 것으로 보이는 건축물을 관할 지자체에 신고해 현장 확인을 요청하는 신고서 양식입니다.
usage: >
  이웃 건물의 무단 증축이나 용도 변경이 의심될 때 관할 구청 건축 관련 부서에 현장 확인을 요청하는 서류입니다.
  신고 대상 건물의 위치, 의심되는 내용, 확인된 시기를 적고 사진을 함께 냅니다.
  위법 여부는 관할 기관이 확인한 뒤 판단하므로 단정하지 말고 보이는 사실 위주로 적으십시오. 신고인 정보 처리 방식은 관할 기관 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신고인의 성명과 연락처를 적습니다.
  - 대상 건축물의 주소와 소유자를 아는 만큼 적습니다.
  - 눈으로 확인한 변경 내용과 시기를 적습니다.
  - 사진을 붙이고 날짜와 서명을 합니다.
faq:
  - q: 위법인지 확실하지 않아도 신고할 수 있나요?
    a: 확인이 필요한 사실을 적어 요청할 수 있습니다. 위법 여부는 관할 기관이 확인한 뒤 판단합니다.
  - q: 소유자를 모르면 어떻게 하나요?
    a: 소유자란은 비워 두고 주소와 위치만 정확히 적으면 됩니다.
  - q: 신고 후 결과를 알 수 있나요?
    a: 처리 결과 통지 여부와 방법은 관할 기관 안내를 확인하십시오.
related: [noise-complaint, civil-petition-reply-request, civil-petition-supplement-submission]
blocks:
  - type: doc_title
    text: 불법 건축물 신고서
    spaced: false
  - type: subtitle
    text: 1. 신고인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울시 한빛구 새길로 10", "", ""]
  - type: subtitle
    text: 2. 대상 건축물
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["대상 주소", "", "", ""]
      - ["소유자(아는 경우)", "", "건물 용도", ""]
    merges:
      - [0, 1, 0, 3]
    sample_rows:
      - ["", "서울시 한빛구 새길로 12", "", ""]
      - ["", "", "", "다세대주택"]
  - type: subtitle
    text: 3. 신고 내용
  - type: textbox
    hint: "눈으로 확인한 변경 내용과 확인한 시기를 적으십시오."
    height_mm: 35
    sample_text: "옥상에 벽체와 지붕이 있는 구조물이 새로 설치된 것을 2026년 10월경 확인하였습니다."
  - type: subtitle
    text: 4. 요청 사항
  - type: textbox
    hint: "원하는 조치를 적으십시오."
    height_mm: 18
    sample_text: "현장 확인을 요청드립니다."
  - type: date_line
    sample_text: 2026 년   11 월   24 일
  - type: sign_line
    label: 신고인
    sample_names: [홍길동]
  - type: notice
    text: 위법 여부는 관할 기관이 확인 후 판단합니다. 사진을 함께 제출하십시오.
