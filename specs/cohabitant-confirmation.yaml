id: cohabitant-confirmation
title: 동거 사실 확인서
category: public
subcategory: family
tags: [동거사실확인서, 동거인확인서, 같이거주확인, 동거확인, 거주사실]
summary: 함께 살고 있는 사람과 동거 기간·거주 주소를 적어 제출처에 사실을 확인해 주는 동거 사실 확인서 양식입니다.
usage: >
  주택 신청, 복지 서비스, 학교·직장 제출 등에서 "함께 살고 있다"는 사실을 문서로 밝혀야 할 때
  쓰는 서식입니다. 확인하는 사람과 동거인의 인적사항, 거주 주소와 동거 시작일, 관계를 적고 각자
  서명합니다. 사실과 다르게 쓰면 제출처에서 불이익이 있을 수 있으므로 실제 거주 기간만 적으십시오.
  증빙 요건은 제출처마다 다르니 필요한 첨부서류를 미리 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 확인하는 사람의 이름과 연락처를 적습니다.
  - 함께 사는 사람과의 관계를 적습니다.
  - 거주 주소와 동거 시작일을 적습니다.
  - 제출 목적을 적고 두 사람이 서명합니다.
faq:
  - q: 이 확인서만 내면 되나요?
    a: 제출처에 따라 주민등록등본이나 공과금 고지서 같은 증빙을 함께 요구할 수 있습니다.
  - q: 가족이 아닌 사람과도 쓸 수 있나요?
    a: 쓸 수 있습니다. 관계란에 실제 관계(지인·룸메이트 등)를 있는 그대로 적습니다.
  - q: 동거 시작일을 정확히 모르면 어떻게 하나요?
    a: 기억나는 시기를 "2025년 3월경"처럼 적고 증빙으로 보완합니다.
related: [residence-fact-confirmation, family-relationship-confirmation, household-head-change-consent, move-in-report-poa]
blocks:
  - type: doc_title
    text: 동거 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 확인인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "동거인과의 관계", ""]
    sample_rows:
      - ["", "홍길동", "", "1985-03-02"]
      - ["", "010-1234-5678", "", "배우자의 부모"]
  - type: subtitle
    text: 2. 동거인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "", ""]
    sample_rows:
      - ["", "김서연", "", "1958-07-21"]
      - ["", "010-9876-5432", "", ""]
  - type: subtitle
    text: 3. 거주 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [3, 1, 3, 3]
    rows:
      - ["거주 주소", "", "", ""]
      - ["동거 시작일", "", "동거 상태", ""]
      - ["주택 구분", "", "세대 인원", ""]
      - ["제출처·목적", "", "", ""]
    sample_rows:
      - ["", "서울시 중구 세종대로 1길 10, 101동 1202호", "", ""]
      - ["", "2025-03-01", "", "현재까지 계속"]
      - ["", "아파트", "", "3명"]
      - ["", "주거 복지 서비스 신청 제출용", "", ""]
  - type: textbox
    hint: "동거 경위나 생활 상황 중 제출처에 알릴 내용을 적으십시오."
    height_mm: 24
    sample_text: "부모님 건강 문제로 2025년 3월부터 함께 거주하고 있으며 현재까지 같은 주소에서 생활하고 있습니다."
  - type: para
    text: 위 내용이 사실임을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   12 일
  - type: sign_line
    labels: ["확인인", "동거인"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 제출처가 요구하는 첨부서류(주민등록등본 등)를 함께 확인하십시오.
