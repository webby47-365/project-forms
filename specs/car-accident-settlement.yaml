id: car-accident-settlement
title: 교통사고 합의서
category: personal
subcategory: life
tags: [교통사고합의서, 교통사고, 합의서, 합의금, 자동차사고, 물적피해]
summary: 경미한 물적 피해 교통사고의 당사자 간 합의 내용과 합의금 지급 조건을 정리하는 합의서입니다.
usage: >
  주차 중 접촉이나 경미한 차량 파손처럼 인적 피해가 없는 교통사고에서 당사자끼리 원만히
  합의할 때 사용하는 서식입니다. 갑(가해자)과 을(피해자)의 인적사항과 사고 경위, 피해
  정도를 구체적으로 적고 합의금액은 숫자와 한글을 함께 기재합니다. 합의 이후 추가
  청구를 제한하는 조항이 있으므로 서명 전에 내용을 꼼꼼히 확인하십시오. 부상이나 인적
  피해가 있는 사고는 본 서식으로 섣불리 합의하지 말고 전문가와 먼저 상담하십시오.
source: original
featured: false
version: 1
created_by: agent
status: published
target_pages: 1

howto:
  - 갑과 을의 인적사항을 적습니다.
  - 사고 일시와 장소, 경위를 적습니다.
  - 피해 정도와 처리 방법을 구체적으로 적습니다.
  - 합의금액을 숫자와 한글로 함께 적습니다.
  - 양측이 서명 또는 날인하고 각 1부씩 보관합니다.

faq:
  - q: 합의 후에는 추가로 돈을 요구할 수 없나요?
    a: 합의서에 추가 청구를 제한하는 조항이 있으므로 서명 전에 내용을 꼼꼼히 확인해야 합니다.
  - q: 사람이 다친 사고도 이 서식을 쓸 수 있나요?
    a: 인적 피해가 있는 사고는 이 서식으로 섣불리 합의하지 말고 전문가와 먼저 상담하십시오.

related: [settlement-agreement, payment-pledge, fact-confirmation]

