  - type: article
    heading: 제4조 (보험 처리와의 관계)
    lines:
      - "본 합의는 당사자 간의 합의이며, 보험회사를 통한 보상 절차가 별도로 진행되는 경우 그 절차와 결과에 따른다."

  - type: notice
    text: 인적 피해가 있는 사고는 합의 전 진단 결과와 보험사·전문가 상담을 거친 후 신중하게 합의하십시오.

