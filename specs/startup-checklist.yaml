id: startup-checklist
title: 창업 준비 체크리스트
category: corp
subcategory: startup
tags: [창업체크리스트, 창업준비, 창업절차, 예비창업자, 창업점검표]
summary: 아이템 검증부터 사업자등록·인허가·자금조달까지 창업 준비 단계를 점검하는 체크리스트입니다.
usage: >
  예비 창업자가 아이템 검증, 사업성 분석, 자금 조달, 사업자등록, 인허가, 회계·세무,
  인력, 마케팅 준비 등 창업 단계별 과제를 빠뜨리지 않도록 정리하는 서식입니다. 단계마다
  준비 항목과 담당자, 기한을 적어두면 진행 상황을 한눈에 확인할 수 있습니다. 완료 여부는
  체크 표시로 관리하고, 비고 란에는 참고한 지원사업이나 특이사항을 간단히 기록하십시오.
source: original
featured: false
created_by: agent
status: published
version: 1
target_pages: 1

howto:
  - 작성자와 작성일을 적습니다.
  - 단계별 준비 항목과 담당자를 확인합니다.
  - 완료된 항목에 체크 표시를 합니다.
  - 비고에 참고한 지원사업이나 특이사항을 적습니다.

faq:
  - q: 업종에 따라 항목이 달라지나요?
    a: 네, 인허가 항목은 업종별로 다르므로 해당 없는 항목은 비워두고 필요한 항목을 추가하십시오.
  - q: 사업자등록은 어느 단계에서 하나요?
    a: 보통 사업성 분석과 자금 조달 이후, 인허가 전에 사업자등록을 진행합니다.

blocks:
  - type: doc_title
    text: 창업 준비 체크리스트
    spaced: false

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["작성자", "", "작성일", ""]
    sample_rows:
      - ["", "홍길동", "", "2026-09-13"]

  - type: table
    widths: [12, 28, 12, 14, 10, 24]
    header: [단계, 준비항목, 담당, 기한, 완료여부, 비고]
    empty_rows: 16
    row_height_mm: 7
    sample_rows:
      - ["아이템 검증", "고객 인터뷰 및 시장 반응 확인", "홍길동", "2026-09-20", "☑", "목표 고객 10명 인터뷰"]
      - ["사업성 분석", "수익 모델 및 손익 추정", "홍길동", "2026-09-27", "☑", ""]
      - ["자금 조달", "정책자금 및 투자 유치 방안 검토", "김서연", "2026-10-10", "□", "청년창업사관학교 지원 검토"]
      - ["사업자등록", "관할 세무서 사업자등록 신청", "김서연", "2026-10-15", "□", ""]

  - type: notice
    text: 완료 여부는 체크(☑)로 표시하고, 진행 중인 항목은 비고에 진행 상황을 간단히 기재하십시오.
