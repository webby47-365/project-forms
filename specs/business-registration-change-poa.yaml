id: business-registration-change-poa
title: 사업자등록 정정 신고 대리 위임장
category: public
subcategory: tax
tags: [사업자등록정정위임장, 사업자정정대리, 정정신고위임장, 사업자등록변경위임장, 세무서정정위임장]
summary: 사업자등록증의 상호·주소·업종 등 변경 사항을 대리인이 세무서에 정정 신고할 때 쓰는 위임장입니다.
usage: >
  상호나 사업장 주소, 업종, 대표자 정보처럼 사업자등록 내용이 바뀌어 정정 신고를 해야 하는데 사업자가 직접
  가지 못할 때 대리인에게 맡기는 서류입니다. 바뀌는 항목의 변경 전과 변경 후 내용을 함께 적어 두면 대리인이
  처리하기 쉽습니다. 신고 가능 항목과 필요한 서류는 관할 세무서 안내를 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 사업자의 상호·대표자·사업자등록번호를 적습니다.
  - 정정할 항목과 변경 전·후 내용을 적습니다.
  - 대리인 정보와 위임 범위를 적습니다.
  - 사업자가 서명 또는 날인합니다.

faq:
  - q: 정정할 때 어떤 서류가 필요한가요?
    a: 변경 항목에 따라 다르므로 관할 세무서나 국세청 안내를 확인하십시오.
  - q: 사업자등록번호도 바뀌나요?
    a: 정정 항목에 따라 다르니 관할 세무서에 문의하십시오.
  - q: 변경 전 내용도 꼭 적어야 하나요?
    a: 대리인이 정정 내용을 틀리지 않도록 변경 전과 후를 함께 적는 편이 안전합니다.

related: [gov-business-registration-individual, business-registration-poa, gov-business-closure-report, power-of-attorney]

blocks:
  - type: doc_title
    text: 사업자등록 정정 신고 대리 위임장
    spaced: false

  - type: para
    text: 본인은 아래 대리인에게 사업자등록 정정 신고에 관한 권한을 위임합니다.
    align: center
    size: 10.5

  - type: subtitle
    text: 1. 사업자 (위임인)

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["상호", "", "대표자", ""]
      - ["사업자등록번호", "", "연락처", ""]
      - ["사업장 주소", "", "", ""]
    sample_rows:
      - ["", "한빛상회", "", "홍길동"]
      - ["", "000-00-00000", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 50 1층", "", ""]

  - type: subtitle
    text: 2. 정정 내용

  - type: table
    widths: [20, 40, 40]
    header: [정정 항목, 변경 전, 변경 후]
    empty_rows: 3
    row_height_mm: 9
    sample_rows:
      - ["상호", "한빛상회", "한빛마켓"]
      - ["업종 추가", "소매업", "소매업, 전자상거래업"]

  - type: subtitle
    text: 3. 대리인 (수임인)

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["생년월일", "", "사업자와의 관계", ""]
    sample_rows:
      - ["", "박민준", "", "010-2345-6789"]
      - ["", "1988-07-21", "", "직원"]

  - type: subtitle
    text: 4. 위임 내용

  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["위임 범위", "사업자등록 정정 신고서 작성·제출 및 정정 사항이 반영된 사업자등록증 수령"]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "사업자등록 정정 신고서 작성·제출 및 정정 사항이 반영된 사업자등록증 수령"]
      - ["", "2026-10-05 ~ 2026-10-16"]

  - type: para
    text: 위 위임 내용은 본인의 의사에 따른 것임을 확인합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년   10 월    2 일

  - type: sign_line
    labels: ["사업자(위임인)", "대리인(수임인)"]
    sample_names: [홍길동, 박민준]

  - type: notice
    text: 정정 가능 항목과 필요 서류는 관할 세무서 안내를 확인하십시오.
