      - ["지출 사유", ""]
      - ["지출 내용", ""]
  - type: table
    widths: [12, 35, 15, 12, 12, 14]
    header: ["No", 내용, 규격, 수량, 단가, 공급가액]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
  - type: grid
    widths: [40, 20, 20, 20]
