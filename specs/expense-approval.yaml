id: expense-approval
title: 지출결의서
category: corp
subcategory: finance
tags: [지출결의서, 지출승인, 경비결의, 결의서, expense]
summary: 지출 사유·금액·결재를 기재하여 지출 승인을 요청하는 지출결의서입니다.
usage: >
  회사의 경비를 지출하기 전에 상급자의 승인을 받기 위한 문서입니다. 지출의 목적·내용·근거
  자료(견적서·송장·영수증)를 명확히 기재해야 결의 심사가 신속하고, 사후 검증할 때도
  필요합니다. 지출액은 공급가액과 부가세를 명확히 분리하여 기재하고, 담당자 → 팀장 → 임원 →
  대표 순서로 결재를 받으며, 제출처 규정에 따른 결재 필수 범위를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 지출 목적과 내용을 적고 공급가액과 부가세를 나눠 씁니다.
  - 견적서·송장·영수증 등 증빙자료를 첨부합니다.
  - 담당자부터 팀장, 임원, 대표 순으로 결재를 받습니다.
  - 승인된 결의서로 지출을 집행하고 결과를 보관합니다.

faq:
  - q: 결재 순서를 꼭 지켜야 하나요?
    a: 회사마다 결재 범위와 순서가 다르므로, 정해진 전결 규정을 확인한 뒤 그 순서대로 받으십시오.
  - q: 증빙자료가 늦게 도착하면 어떻게 하나요?
    a: 우선 예정 금액으로 결의서를 작성하고, 자료가 도착하면 첨부해 정산 내역을 보완하십시오.

related: [quotation, receipt, purchase-order]

