id: checklist
title: 체크리스트 (범용)
category: personal
subcategory: life
tags: [체크리스트, 할일, 항목관리, 일정체크, 과제]
summary: 프로젝트, 행사, 일상 업무의 실행 과제를 항목별로 정리하고 진행 상황을 추적하는 범용 양식입니다.
usage: >
  프로젝트 진행, 행사 준비, 이사, 이직 준비 등 다양한 상황에서 할 일을 체계적으로
  관리합니다. 각 항목마다 담당자, 마감 기한, 완료 여부를 기재하여 누가, 언제까지
  무엇을 해야 하는지 한눈에 파악할 수 있습니다. 비고 란에는 진행 상황이나 주의사항을
  간단히 메모하여 팀 협력 시 소통을 원활하게 합니다.
source: original
featured: false
target_pages: 1

howto:
  - 체크리스트 제목을 적습니다.
  - 해야 할 항목을 번호 순서대로 나열합니다.
  - 항목마다 담당자와 마감 기한을 적습니다.
  - 완료된 항목은 완료 여부에 표시합니다.

faq:
  - q: 담당자가 여러 명이면 어떻게 적나요?
    a: 담당자란에 이름을 함께 적거나 항목을 나눠 각각 담당자를 지정하면 됩니다.
  - q: 비고란은 꼭 채워야 하나요?
    a: 필수는 아니며 진행 상황이나 주의사항이 있을 때만 간단히 메모하면 됩니다.

related: [monthly-schedule, moving-checklist, event-plan]

blocks:
  - type: doc_title
    text: 체크리스트
    spaced: false

  - type: grid
    widths: [100]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["체크리스트 제목: "]

  - type: table
    widths: [8, 30, 18, 18, 10, 16]
    header: ["No", 항목, 담당자, 기한, 완료 여부, 비고]
    empty_rows: 14
    row_height_mm: 7.5
    sample_rows:
      - ["1", "장소 예약", "홍길동", "2026-09-20", "", "계약금 입금 완료"]
      - ["2", "초청장 발송", "김서연", "2026-09-22", "", "참석자 명단 확정 후 발송"]
      - ["3", "다과 준비", "박민준", "2026-09-25", "", ""]

  - type: notice
    text: 완료 여부 열에 체크 표시를 하고, 진행 중인 항목은 진행률을 기재하십시오.
