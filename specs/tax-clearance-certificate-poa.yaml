id: tax-clearance-certificate-poa
title: 납세증명서 발급 위임장
category: public
subcategory: tax
tags: [납세증명서위임장, 납세증명서대리발급, 국세완납증명위임장, 완납증명서위임장, 납세증명위임]
summary: 납세증명서 발급을 대리인에게 맡길 때 위임 범위와 제출 용도를 적는 위임장입니다.
usage: >
  계약 체결이나 입찰, 대출 심사 등에 납세증명서가 필요한데 직접 세무서에 가기 어려울 때 대리인에게
  발급을 맡기는 위임장입니다. 위임인과 대리인 정보, 납세증명서의 용도와 통수, 위임 기간을 적고
  위임인이 서명 또는 날인합니다. 대리 발급에 필요한 신분증·사본 등은 기관마다 다를 수 있으므로
  발급 기관 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 위임인의 성명과 사업자(또는 법인) 정보를 적습니다.
  - 대리인의 성명과 위임인과의 관계를 적습니다.
  - 납세증명서의 용도와 통수, 제출처를 적습니다.
  - 위임 기간을 적고 위임인이 서명 또는 날인합니다.
faq:
  - q: 용도는 꼭 적어야 하나요?
    a: 발급 신청 때 용도를 묻는 경우가 많으므로 제출처와 함께 적어 두는 것이 좋습니다.
  - q: 법인도 이 위임장을 쓸 수 있나요?
    a: 법인명과 대표자 이름을 적고 법인 도장을 찍어 쓰면 됩니다. 기관 요구 서류를 확인하십시오.
  - q: 대리인 신분증이 필요한가요?
    a: 기관에서 대리인 신분증을 요구할 수 있으니 방문 전에 안내를 확인하십시오.
related: [vat-filing-poa, withholding-tax-filing-poa, business-registration-poa, gov-bid-participation]
blocks:
  - type: doc_title
    text: 납세증명서 발급 위임장
    spaced: false
  - type: para
    text: 본인은 아래 대리인에게 납세증명서 발급 신청에 관한 권한을 위임합니다.
    align: center
  - type: subtitle
    text: 1. 위임인
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명(상호)", "", "대표자", ""]
      - ["주소", "", "", ""]
      - ["사업자등록번호", "", "연락처", ""]
    sample_rows:
      - ["", "한빛물산", "", "홍길동"]
      - ["", "서울특별시 마포구 월드컵북로 50", "", ""]
      - ["", "000-00-00000", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처", "", "위임인과의 관계", ""]
    sample_rows:
      - ["", "김서연", "", "1988-04-17"]
      - ["", "010-3456-7890", "", "직원"]
  - type: subtitle
    text: 3. 위임 내용
  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["서류 종류", "납세증명서   통수:      통"]
      - ["용도", ""]
      - ["제출처", ""]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "납세증명서   통수:   1   통"]
      - ["", "공급계약 체결 제출용"]
      - ["", "(주)새길데이터"]
      - ["", "2026-10-06 ~ 2026-10-13"]
  - type: kv_list
    items:
      - "대리인은 위임받은 범위 안에서만 위 서류를 발급받아 사용합니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."
  - type: date_line
    sample_text: 2026 년   10 월    5 일
  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 대리 발급에 필요한 신분증·추가 서류는 발급 기관 안내를 확인하십시오.
