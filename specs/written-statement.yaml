id: written-statement
title: 진술서
category: legal
subcategory: litigation
tags: [진술서, 사건진술서, 목격진술서, 진술서작성, 법원진술서]
summary: 사건과 관련하여 본인이 직접 경험하거나 목격한 사실을 시간순으로 정리하여 제출하는 진술서 양식입니다.
usage: >
  소송이나 수사, 각종 심사 과정에서 본인이 직접 보고 들은 사실을 정리해 제출할 때 사용하는
  문서입니다. 진술인의 인적사항과 사건과의 관계를 먼저 밝히고, 진술 대상 사건의 개요를
  간단히 정리한 뒤 본문에 사실관계를 육하원칙에 따라 서술합니다. 들은 이야기와 직접 경험한
  사실을 구분해 적고 추측이나 의견은 섞지 않아야 신뢰도가 높아집니다. 허위 진술은 법적
  책임이 따를 수 있으므로 사실만 기재하고 제출 전 사본을 보관하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

blocks:
  - type: doc_title
    text: 진술서
    spaced: true

  - type: subtitle
    text: 1. 진술인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "사건과의 관계", ""]
    sample_rows:
      - ["", "홍길동", "", "1990-03-15"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", "목격자"]

  - type: subtitle
    text: 2. 진술 대상 사건
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["사건명", "", "발생일", ""]
      - ["발생장소", "", "", ""]
    sample_rows:
      - ["", "대여금 반환 관련 분쟁", "", "2025-06-10"]
      - ["", "서울특별시 마포구 소재 원고 자택", "", ""]

  - type: subtitle
    text: 3. 진술 내용
  - type: textbox
    hint: "직접 보고 들은 사실을 시간순으로 육하원칙에 따라 기재하십시오. 추측과 사실을 구분해 적으십시오."
    height_mm: 70
    sample_text: 본인은 2025년 6월 10일 홍길동이 김서연에게 현금 10,000,000원을 건네는 것을 직접 목격하였습니다. 당시 홍길동과 김서연은 변제기일을 2026년 6월 10일로 정하고 차용증을 작성하였으며, 본인은 그 자리에 함께 있었습니다. 이후 본인은 김서연으로부터 변제기일이 지나도록 돈을 갚지 못하고 있다는 이야기를 전화로 전달받았습니다.

  - type: para
    text: 위 진술 내용은 본인이 직접 경험하거나 확인한 사실과 다름이 없습니다.
    align: center
    size: 10.5

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    label: 진술인
    sample_names: [홍길동]

  - type: notice
    text: 허위 진술은 추후 법적 책임 문제가 발생할 수 있으므로 사실대로 기재하시고, 제출처가 요구하는 첨부자료를 함께 준비하십시오.
