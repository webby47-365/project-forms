id: goods-sale-contract
title: 매매계약서 (동산)
category: legal
subcategory: contract
tags: [동산 매매계약서, 물품 매매계약, 중고 거래 계약서, 매매계약서 양식, 소유권 이전]
summary: 동산 목적물의 표시·매매대금·인도시기와 하자담보책임을 정한 동산 매매계약서입니다.
usage: >
  차량·기계·장비·중고물품처럼 부동산이 아닌 물건을 사고팔 때 작성하는 계약서입니다. 목적물은
  품명·규격·제조번호처럼 다른 물건과 구별되는 정보로 특정해야 분쟁을 막을 수 있습니다.
  계약금·중도금·잔금의 지급시기와 인도시기를 나누어 적고, 소유권이 언제 이전되는지 명시하십시오.
  중고품은 현상 그대로 인도하는 조건인지 하자담보책임을 지는지 반드시 합의해 기재해야 합니다.
  등록이 필요한 물건은 명의이전 절차와 비용 부담 주체를 함께 정하십시오.
source: original
featured: false
target_pages: 2
blocks:
  - type: doc_title
    text: 동산 매매계약서
    spaced: false
  - type: para
    text: 매도인과 매수인은 아래 목적물에 관하여 다음과 같이 매매계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 목적물의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [3, 1, 3, 3]
    rows:
      - ["품명", "", "제조사/모델", ""]
      - ["규격·사양", "", "제조번호", ""]
      - ["수량", "", "제조(등록)연월", ""]
      - ["보관장소", "", "", ""]
    sample_rows:
      - ["", "냉장고(중고)", "", "한빛전자 RF-500"]
      - ["", "양문형 500L", "", "HB2023-00123"]
      - ["", "1대", "", "2023-05"]
      - ["", "서울특별시 마포구 월드컵북로 100 창고", "", ""]
  - type: subtitle
    text: 매매대금 및 지급일정
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["매매대금", "금                                 원정 (₩                       )", "", ""]
      - ["계약금", "", "지급일", ""]
      - ["중도금", "", "지급일", ""]
      - ["잔금", "", "지급일", ""]
      - ["입금계좌", "", "인도예정일", ""]
    sample_rows:
      - ["", "금 3,000,000원정 (₩3,000,000)", "", ""]
      - ["", "300,000원", "", "계약 시"]
      - ["", "해당없음", "", "-"]
      - ["", "2,700,000원", "", "2026-10-05"]
      - ["", "한빛은행 000-000000-00-000", "", "2026-10-05"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "매도인은 위 목적물을 매수인에게 매도하고, 매수인은 이를 매수하며 매매대금을 지급한다."
  - type: article
    heading: 제2조 (대금의 지급)
    lines:
      - "매수인은 위 지급일정에 따라 매도인이 지정한 계좌로 매매대금을 지급한다."
      - "매수인이 지급을 지체한 경우 지체일수에 대하여 당사자가 합의한 지연이자를 가산할 수 있다."
  - type: article
    heading: 제3조 (목적물의 인도)
    lines:
      - "매도인은 잔금 수령과 동시에 위 인도예정일까지 목적물을 매수인에게 인도한다."
      - "인도에 소요되는 운송비와 부대비용의 부담 주체는 특약사항에서 정한 바에 따른다."
  - type: page_break
  - type: article
    heading: 제4조 (소유권의 이전 및 위험부담)
    lines:
      - "목적물의 소유권은 매매대금 완납과 인도가 모두 완료된 때에 매수인에게 이전한다."
      - "인도 전 발생한 멸실·훼손의 위험은 매도인이, 인도 후의 위험은 매수인이 부담한다."
      - "등록이 필요한 목적물은 인도 후 지체 없이 명의이전 절차를 진행한다."
  - type: article
    heading: 제5조 (하자담보책임)
    lines:
      - "매도인은 목적물이 계약 내용에 적합함을 보증한다. 다만 당사자가 현상 그대로 인도하기로 합의한 경우 그 범위를 특약사항에 명시한다."
      - "매수인은 인도 후 하자를 발견한 때에는 지체 없이 매도인에게 통지한다."
  - type: article
    heading: 제6조 (계약의 해제)
    lines:
      - "매수인이 중도금 또는 잔금 지급을 지체한 경우 매도인은 상당한 기간을 정하여 이행을 최고하고 계약을 해제할 수 있다."
      - "계약이 해제된 경우 당사자는 원상회복 의무를 부담하며, 손해배상에 관하여는 별도로 정한다."
  - type: article
    heading: 제7조 (특약사항 및 관할)
    lines:
      - "본 계약에 정하지 아니한 사항은 관계 법령과 상관례에 따른다."
      - "본 계약과 관련한 분쟁은 당사자가 합의하여 정한 법원을 관할법원으로 한다."
  - type: textbox
    hint: "특약사항 — 현상 인도 여부, 운송비 부담, 부속품 범위, 명의이전 비용 등을 기재하십시오."
    height_mm: 28
    sample_text: 중고품은 현상 그대로 인도하며 운송비는 매수인이 부담한다. 부속품은 리모컨 1개를 포함하고, 등록 대상이 아니므로 명의이전 절차는 해당하지 않는다.
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["매도인", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["매수인", "성명(상호)", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "이수현", "", "1985-11-02"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "박민준", "", "1992-07-20"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-9876-5432"]
  - type: para
    text: 본 계약을 증명하기 위하여 계약서 2통을 작성하고 각자 서명·날인한 후 각 1통씩 보관한다.
    align: center
    size: 10
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["매도인", "매수인"]
    sample_names: [이수현, 박민준]
  - type: notice
    text: 본 서식은 참고용입니다. 등록이 필요한 물건이나 고액 거래는 관련 법령과 제출처 기준을 확인하십시오.
