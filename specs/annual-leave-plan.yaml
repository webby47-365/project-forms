    sample_rows:
      - ["2일", "-", "3일", "-", "-", "1일", "-", ""]

  - type: table
    widths: [15, 15, 15, 15, 15, 15, 10]
    header: [8월, 9월, 10월, 11월, 12월, 소계, 일]
    empty_rows: 2
    row_height_mm: 9
    sample_rows:
      - ["1일", "-", "2일", "-", "3일", "6", ""]

  - type: subtitle
    text: 특별휴가 현황

  - type: table
    widths: [25, 25, 25, 25]
    header: [휴가 종류, 보유 일수, 사용 예정 일수, 잔여 일수]
