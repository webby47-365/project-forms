id: annual-leave-plan
title: 연차사용계획서
category: corp
subcategory: hr
tags: [연차사용계획서, 연차계획, 연차사용일정, 휴가계획, 근로자연차]
summary: 근로자의 당해 연차 사용 예정을 월별로 계획하는 서식입니다.
usage: >
  「근로기준법」 제60조에 따라 사용자가 근로자의 휴가를 일방적으로 결정하는 경우 작성하거나,
  근로자가 자발적으로 연차사용 계획을 수립할 때 사용합니다. 월별 사용 예정 일자와 일수를
  체계적으로 기록하고 부서장과 대표의 승인을 받아 보관하십시오.
source: law-standard
source_note: "근로기준법 제60조(휴가)"
featured: false
target_pages: 1

howto:
  - 부서, 직위, 성명 등 인적사항을 적습니다.
  - 연차 총 일수와 월별 사용 예정일을 채웁니다.
  - 사용 사유가 있으면 간단히 적습니다.
  - 부서장과 대표 결재를 받아 보관합니다.

faq:
  - q: 계획대로 연차를 못 쓰면 어떻게 되나요?
    a: 계획은 예정일 뿐이므로 사정이 바뀌면 부서장과 협의해 사용일을 조정하면 됩니다.
  - q: 회사가 연차 사용일을 임의로 정해도 되나요?
    a: 근로기준법에 정한 절차를 거치면 회사가 사용 시기를 지정할 수 있습니다.

related: [leave-request, overtime-application, employee-roster]

blocks:
  - type: doc_title
    text: 연차사용계획서

  - type: grid
    widths: [16, 18, 16, 18, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 9
    rows:
      - ["부서(팀)", "", "직위", "", "성명", ""]
      - ["사번", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "마케팅팀", "", "대리", "", "홍길동"]
      - ["", "A1234", "", "1993-02-10", "", "010-1234-5678"]

  - type: subtitle
    text: 연차사용 계획

  - type: table
    widths: [13, 13, 13, 13, 13, 13, 13, 9]
