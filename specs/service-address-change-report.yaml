id: service-address-change-report
title: 송달장소 변경 신고서
category: legal
subcategory: litigation
tags: [송달장소변경신고서, 송달주소변경, 주소변경신고서, 소송서류송달, 송달장소신고]
summary: 진행 중인 소송에서 이사 등으로 소송서류를 받을 주소가 바뀌었을 때 법원에 내는 송달장소 변경 신고서 양식입니다.
usage: >
  소송 중 이사나 사무실 이전으로 서류를 받을 곳이 바뀌었을 때 재판부에 알리는 서류입니다. 사건번호와
  사건명, 당사자를 정확히 적고 변경 전·후 주소와 변경 사유를 함께 적습니다. 신고하지 않으면 법원 서류가
  이전 주소로 발송될 수 있으므로 바뀐 즉시 내는 것이 좋습니다. 제출 방식과 필요한 첨부는 담당 재판부의
  안내를 확인하십시오. 본 서식은 참고용이며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 법원 이름과 사건번호, 사건명을 기록대로 적습니다.
  - 신고하는 당사자의 이름과 지위(원고·피고)를 적습니다.
  - 변경 전 주소와 변경 후 주소, 변경일을 적습니다.
  - 날짜를 적고 신고인이 서명하여 재판부에 냅니다.
faq:
  - q: 신고하지 않으면 어떻게 되나요?
    a: 이전 주소로 서류가 발송될 수 있습니다. 불이익 여부는 사안마다 다르니 재판부 안내를 확인하십시오.
  - q: 전화번호도 함께 바꿔 적나요?
    a: 연락처가 바뀌었다면 함께 적어 두면 연락이 수월합니다.
  - q: 변경 사실을 증명하는 서류가 필요한가요?
    a: 재판부에 따라 다릅니다. 제출 전에 담당 재판부나 법원 민원실에 확인하십시오.
related: [preparatory-brief, answer-brief, written-statement, lawsuit-withdrawal]
blocks:
  - type: doc_title
    text: 송달장소 변경 신고서
    spaced: false
  - type: subtitle
    text: 1. 사건 표시
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["법원", "", "", ""]
      - ["사건번호", "", "사건명", ""]
      - ["원고", "", "피고", ""]
    sample_rows:
      - ["", "서울중앙지방법원 제12민사부", "", ""]
      - ["", "2026가소123456", "", "대여금"]
      - ["", "홍길동", "", "박민준"]
  - type: subtitle
    text: 2. 신고인과 변경 내용
  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["신고인", "(   ) 원고   (   ) 피고   성명:"]
      - ["변경 전 주소", ""]
      - ["변경 후 주소", ""]
      - ["변경일", ""]
      - ["연락처", ""]
    sample_rows:
