id: career-certificate
title: 경력증명서
category: corp
subcategory: hr
tags: [경력증명서, 경력확인서, 근무경력, 퇴직증명서]
summary: 근무기간·부서·직위·담당업무 이력을 회사가 증명하는 경력증명서 양식입니다.
usage: >
  이직·자격취득·경력인정 시 제출하는 서류로 회사 인사부서가 발급합니다. 재직자·퇴직자
  모두 발급 가능하며, 경력 인정 기관이 요구하는 항목(직급 변동 이력, 근무형태 등)이
  있는지 먼저 확인한 뒤 발급받는 것이 안전합니다.
source: original
featured: true
featured_rank: 5
howto:
  - 발급 대상자의 성명과 생년월일을 적습니다.
  - 재직 여부와 입사일, 퇴사일(해당 시)을 적습니다.
  - 부서와 직위, 담당 업무를 근무 기간별로 적습니다.
  - 발급 목적을 적습니다.
  - 회사 직인을 날인해 발급합니다.

faq:
  - q: 퇴사자도 발급받을 수 있나요?
    a: 가능합니다. 재직구분에 퇴직자로 표시하고 최종 근무일까지의 경력을 적으면 됩니다.
  - q: 직급 변동 이력도 적어야 하나요?
    a: 제출 기관이 요구하면 근무 기간을 나눠 직급별로 적으십시오. 요구가 없으면 최종 직위만 적어도 됩니다.

