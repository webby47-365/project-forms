id: student-absence-notice
title: 결석계 (학부모 확인서)
category: edu
subcategory: school
tags: [결석계, 결석신고서, 학생결석계, 결석사유서, 학부모확인서, 지각결과계]
summary: 질병·경조사 등으로 결석한 학생의 결석 기간과 사유를 보호자가 확인해 학교에 내는 결석계 양식입니다.
usage: >
  학생이 질병이나 가정 사정, 경조사 등으로 학교에 나오지 못했을 때 담임교사에게 제출하는 결석계입니다.
  결석한 기간과 사유를 구체적으로 적고 보호자가 확인 서명을 하면 됩니다. 결석 사유에 따라 결석이
  출석으로 인정되는지, 진단서나 증빙 서류가 필요한지는 학교 규정마다 달라 학사 안내를 확인해야
  합니다. 증빙 서류를 첨부할 때는 사본을 붙이고 원본은 보호자가 보관합니다.
source: original
featured: false
target_pages: 1

howto:
  - 학년·반·번호와 학생 성명을 적습니다.
  - 결석한 기간과 결석 일수를 적습니다.
  - 결석 사유를 고르고 구체적인 내용을 적습니다.
  - 보호자가 서명하고 증빙 서류가 있으면 붙여 담임에게 냅니다.

faq:
  - q: 진단서나 증빙 서류는 꼭 붙여야 하나요?
    a: 학교마다 기준이 달라 결석 사유와 일수에 따라 요구될 수 있으니 담임교사에게 확인하십시오.
  - q: 결석하기 전에 미리 낼 수 있나요?
    a: 미리 알 수 있는 사유라면 사전에 담임에게 알리고, 결석 후 결석계로 확인받는 경우가 많습니다.
  - q: 교외체험학습 신청서와 무엇이 다른가요?
    a: 체험학습은 사전에 신청해 출석을 인정받는 절차이고, 결석계는 결석 사실과 사유를 확인하는 서류입니다.

related: [field-trip-application, guardian-consent, attendance-sheet, student-record-card]

blocks:
  - type: doc_title
    text: 결석계
    spaced: true

  - type: subtitle
    text: 1. 학생 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["학교", "", "학년-반-번호", ""]
      - ["학생 성명", "", "보호자 연락처", ""]
    sample_rows:
      - ["", "한빛중학교", "", "2학년 3반 15번"]
      - ["", "이수현", "", "010-1234-5678"]

  - type: subtitle
    text: 2. 결석 내용

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [1, 1, 1, 3]
    rows:
      - ["결석 기간", "20   년  월  일 ~ 20   년  월  일", "", ""]
      - ["결석 사유", "(   ) 질병   (   ) 경조사   (   ) 가정 사정   (   ) 기타", "", ""]
      - ["결석 일수", "", "증빙 서류", ""]
    sample_rows:
      - ["", "2026년 9월 21일 ~ 2026년 9월 22일", "", ""]
      - ["", "( ✓ ) 질병   (   ) 경조사   (   ) 가정 사정   (   ) 기타", "", ""]
      - ["", "2일", "", "진료확인서 사본"]

  - type: subtitle
    text: 3. 결석 사유 상세

  - type: textbox
    hint: "결석하게 된 경위와 사유를 구체적으로 적으십시오. 증빙 서류가 있으면 종류를 함께 적습니다."
    height_mm: 30
    sample_text: 감기 증상과 고열로 병원 진료를 받고 이틀간 안정이 필요해 등교하지 못했습니다. 진료확인서 사본을 첨부합니다.

  - type: para
    text: 위와 같이 결석하였음을 확인하고 이에 제출합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년    9 월   23 일

  - type: sign_line
    labels: ["보호자", "학생"]
    sample_names: [박민준, 이수현]

  - type: para
    text: ○○학교 담임교사 귀하
    align: center
    size: 11

  - type: subtitle
    text: 4. 학교 확인

  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["담임 확인", "", "결석 처리", ""]
    sample_rows:
      - ["", "확인", "", "질병 결석"]

  - type: notice
    text: 결석 인정 여부와 증빙 서류 기준은 학교 학업성적관리규정·학사 안내를 확인하십시오.
