id: year-end-couple-dependent-allocation
title: 연말정산 맞벌이 부부 부양가족 공제 배분 확인서
category: public
subcategory: tax
tags: [맞벌이부부공제, 부양가족공제배분, 연말정산부양가족, 공제대상자확인, 연말정산서류]
summary: 맞벌이 부부가 자녀·부모 등 부양가족을 누가 공제받을지 정해 각자의 회사에 제출하는 연말정산 공제 배분 확인서 양식입니다.
usage: >
  부부가 모두 근로소득이 있을 때 같은 부양가족을 두 사람이 중복해서 공제받지 않도록, 부양가족별로 누가 공제받을지 미리 정해 두는 서식입니다.
  부부의 성명과 소속을 적고, 부양가족마다 관계와 공제받을 사람을 표시한 뒤 두 사람이 함께 서명합니다.
  각자의 회사 연말정산 담당자에게 사본을 내면 중복 공제 확인이 수월합니다. 공제 요건과 유리한 배분은 국세청 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 부부 각자의 성명과 근무처를 적습니다.
  - 부양가족의 성명과 관계를 한 줄씩 적습니다.
  - 가족마다 공제받을 사람을 한 명만 표시합니다.
  - 날짜를 적고 부부가 함께 서명합니다.
faq:
  - q: 같은 가족을 부부가 둘 다 공제받아도 되나요?
    a: 한 부양가족은 한 사람만 공제받을 수 있습니다. 중복되면 나중에 추가 납부가 생길 수 있습니다.
  - q: 이 확인서를 국세청에 내야 하나요?
    a: 보통 각자의 회사에 내는 내부 확인용입니다. 제출 여부는 회사 안내를 확인하십시오.
  - q: 배분은 해마다 바꿀 수 있나요?
    a: 해마다 요건을 다시 확인해 정합니다. 어느 쪽이 유리한지는 국세청 안내를 참고하십시오.
related: [year-end-dependent-duplicate-check, year-end-dependent-income-statement, dependent-support-fact-confirmation, year-end-tax-checklist]
blocks:
  - type: doc_title
    text: 맞벌이 부부 부양가족 공제 배분 확인서
    spaced: false
  - type: subtitle
    text: 1. 부부 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["구분", "본인", "구분", "배우자"]
      - ["성명", "", "성명", ""]
      - ["근무처", "", "근무처", ""]
      - ["연락처", "", "연락처", ""]
    sample_rows:
      - ["", "", "", ""]
      - ["", "홍길동", "", "김서연"]
      - ["", "(주)한빛커머스", "", "(주)새길데이터"]
      - ["", "010-1234-5678", "", "010-2345-6789"]
  - type: subtitle
    text: 2. 부양가족별 공제 배분
  - type: table
    widths: [8, 22, 18, 26, 26]
    header: ["No", 부양가족 성명, 관계, 공제받을 사람, 비고]
    empty_rows: 6
    row_height_mm: 8
    sample_rows:
      - ["1", "홍하늘", "자녀", "본인", "초등학생"]
      - ["2", "홍하나", "자녀", "배우자", ""]
      - ["3", "홍정수", "부(父)", "본인", "별거"]
  - type: textbox
    hint: "배분 사유나 회사에 전달할 내용이 있으면 적으십시오."
    height_mm: 20
    sample_text: "부양가족 공제는 위 표와 같이 한 사람만 받기로 했으며, 중복 공제를 하지 않을 것을 확인합니다."
  - type: date_line
    sample_text: 2026 년   11 월   18 일
  - type: sign_line
    labels: ["본인", "배우자"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 공제 요건과 제출 방법은 국세청과 각 회사의 연말정산 안내를 확인하십시오.
