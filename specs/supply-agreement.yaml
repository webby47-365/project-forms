id: supply-agreement
title: 물품 공급계약서
category: legal
subcategory: contract
tags: [물품공급, 공급계약, 납품계약, 정기납품, 발주]
summary: 일정 기간 동안 물품을 반복해서 납품할 때 발주 방식·납품 일정·검수·대금 지급 조건을 정하는 공급계약서입니다.
usage: >
  한 번 파는 매매와 달리, 정해진 기간 동안 발주에 따라 물품을 여러 차례 납품하는 거래에서 쓰는 계약서입니다.
  공급 품목과 단가, 발주 절차, 납품·검수 방법, 대금 지급일을 정해 두면 분쟁을 줄일 수 있습니다.
  각 조항은 거래 사정에 맞게 고쳐 쓰고, 중요한 거래는 전문가 검토를 받으십시오. 이 서식은 틀만 제공하며
  법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 2
howto:
  - 공급자와 수요자 정보, 계약 기간을 적습니다.
  - 공급 품목과 규격, 단가를 표에 적습니다.
  - 발주·납품·검수 방법과 대금 지급일을 확인해 고칩니다.
  - 날짜를 적고 양쪽이 서명해 한 부씩 보관합니다.
faq:
  - q: 단가는 계약 기간 중 바꿀 수 있나요?
    a: 양쪽이 서면으로 합의하면 바꿀 수 있습니다. 변경 방법을 조항에 미리 적어 두는 편이 좋습니다.
  - q: 최소 발주량을 정해야 하나요?
    a: 필수는 아닙니다. 공급자가 재고를 준비해야 한다면 최소 발주량을 정해 두면 분쟁을 줄입니다.
  - q: 일반 판매계약서와 무엇이 다른가요?
    a: 한 번의 매매가 아니라 기간 동안 반복되는 발주와 납품을 전제로 합니다.
related: [purchase-order, delivery-confirmation, goods-inspection-report, transaction-statement]
blocks:
  - type: doc_title
    text: 물품 공급계약서
    spaced: false
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["공급자(갑)", "", "수요자(을)", ""]
      - ["대표자", "", "대표자", ""]
      - ["주소", "", "주소", ""]
      - ["계약 기간", "", "", ""]
    merges:
      - [3, 1, 3, 3]
    sample_rows:
      - ["", "(주)한빛커머스", "", "(주)새길데이터"]
      - ["", "홍길동", "", "김서연"]
      - ["", "서울시 ○○구 ○○로 1", "", "경기도 ○○시 ○○로 2"]
      - ["", "2026-12-01 ~ 2027-11-30", "", ""]
  - type: subtitle
    text: 공급 품목
  - type: table
    widths: [8, 30, 22, 12, 14, 14]
    header: ["No", 품목, 규격, 단위, 단가, 비고]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "A4 복사용지", "80g 500매", "박스", "18,000", ""]
      - ["2", "토너 카트리지", "정품 대용량", "개", "65,000", ""]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 갑이 을에게 위 품목을 계약 기간 동안 공급하고 을이 그 대금을 지급하는 데 필요한 사항을 정함을 목적으로 한다."
  - type: article
    heading: 제2조 (발주)
    lines:
      - "을은 필요한 품목과 수량, 납품 희망일을 서면 또는 전자적 방법으로 갑에게 알려 발주한다."
      - "갑은 발주를 받은 날로부터 영업일 기준 2일 이내에 수락 여부를 알린다."
  - type: article
    heading: 제3조 (납품과 검수)
    lines:
      - "갑은 약정한 일시와 장소에 물품을 납품하고, 을은 납품 즉시 수량과 상태를 확인한다."
      - "을은 하자나 수량 부족을 발견한 날로부터 영업일 기준 3일 이내에 갑에게 알리고, 갑은 교환 또는 보충한다."
  - type: article
    heading: 제4조 (대금 지급)
    lines:
      - "을은 매월 말일까지 납품된 물품의 대금을 정산하고, 다음 달 10일까지 갑이 지정한 계좌로 지급한다."
      - "지급일이 휴일인 경우 그 다음 영업일에 지급한다."
  - type: article
    heading: 제5조 (단가 변경)
    lines:
      - "단가를 바꾸려면 갑과 을이 서면으로 합의해야 하며, 합의 전 발주분에는 기존 단가를 적용한다."
  - type: article
    heading: 제6조 (계약의 해지)
    lines:
      - "어느 한쪽이 계약을 위반하고 상당한 기간을 정해 시정을 요구받고도 따르지 않으면 상대방은 서면으로 계약을 해지할 수 있다."
  - type: article
    heading: 제7조 (비밀유지와 분쟁)
    lines:
      - "양쪽은 계약 이행 중 알게 된 상대방의 영업상 비밀을 제3자에게 알리지 않는다."
      - "이 계약에서 정하지 않은 사항은 상관례와 관계 법령에 따르고, 분쟁은 협의로 해결하되 합의가 되지 않으면 갑의 소재지 관할 법원에서 다룬다."
  - type: para
    text: 위 계약을 증명하기 위해 계약서 2부를 작성하고 갑과 을이 서명한 뒤 각 1부씩 보관한다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   14 일
  - type: sign_line
    labels: ["공급자(갑)", "수요자(을)"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 거래 사정에 맞게 조항을 고쳐 쓰고, 중요한 거래는 전문가 검토를 받으십시오.
