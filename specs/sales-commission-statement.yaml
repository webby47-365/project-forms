id: sales-commission-statement
title: 영업 수수료 정산서
category: corp
subcategory: sales
tags: [영업수수료, 정산서, 판매수수료, 인센티브, 영업정산]
summary: 영업 담당자나 판매 대행자에게 지급할 건별 매출과 수수료율, 수수료 금액을 정리해 확인받는 영업 수수료 정산서 양식입니다.
usage: >
  영업 실적에 따라 수수료를 지급할 때 정산 기간의 거래 건과 매출액, 수수료율, 지급액을 한 장에 정리하는 서식입니다.
  거래처명과 매출액, 적용 수수료율을 건별로 적고 합계를 낸 뒤 지급 계좌와 지급 예정일을 확인합니다.
  수수료율은 사전에 합의한 계약 또는 내부 기준을 따르며, 세금 처리는 회사 회계 기준을 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 정산 기간과 수령자, 작성일을 적습니다.
  - 거래 건마다 거래처와 매출액, 수수료율을 적습니다.
  - 건별 수수료와 합계를 계산해 적습니다.
  - 지급 예정일을 적고 양쪽이 서명합니다.
faq:
  - q: 수수료율은 어떻게 정하나요?
    a: 사전에 합의한 계약이나 내부 규정의 요율을 적습니다. 건별로 다르면 건마다 적습니다.
  - q: 반품된 거래는 어떻게 적나요?
    a: 비고란에 반품 사실을 적고 해당 건의 수수료를 제외하거나 차감합니다. 기준은 사전 합의를 따릅니다.
related: [sales-contract, invoice-request, payment-confirmation, transaction-statement]
blocks:
  - type: doc_title
    text: 영업 수수료 정산서
    spaced: false
  - type: subtitle
    text: 1. 정산 개요
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["정산 기간", "", "작성일", ""]
      - ["수령자", "", "소속", ""]
      - ["지급처", "", "담당자", ""]
    sample_rows:
      - ["", "2026.10.01 ~ 10.31", "", "2026-11-05"]
      - ["", "박민준", "", "영업1팀"]
      - ["", "(주)한빛커머스", "", "김서연"]
  - type: subtitle
    text: 2. 건별 정산 내역
  - type: table
    widths: [7, 24, 17, 12, 17, 23]
    header: ["No", 거래처, 매출액(원), 요율(%), 수수료(원), 비고]
    empty_rows: 6
    row_height_mm: 8
    sample_rows:
      - ["1", "새길데이터", "5,000,000", "5", "250,000", ""]
      - ["2", "한빛물산", "3,200,000", "5", "160,000", ""]
      - ["3", "(주)가람상사", "1,800,000", "3", "54,000", "일부 반품 제외"]
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["매출 합계", "", "수수료 합계", ""]
      - ["지급 계좌", "", "지급 예정일", ""]
    sample_rows:
      - ["", "10,000,000원", "", "464,000원"]
      - ["", "한빛은행 000-00-0000", "", "2026-11-15"]
  - type: textbox
    hint: "정산 기준이나 조정 사항(반품·취소·이월 등)이 있으면 적으십시오."
    height_mm: 18
    sample_text: "가람상사 건은 일부 반품분을 제외하고 정산했으며, 이월 건은 없습니다."
  - type: date_line
    sample_text: 2026 년   11 월    5 일
  - type: sign_line
    labels: ["수령자", "지급처"]
    sample_names: [박민준, 김서연]
  - type: notice
    text: 수수료율과 세금 처리는 계약 및 회사 기준을 확인하십시오.
