id: household-member-move-in-consent
title: 동거인 전입 동의서
category: public
subcategory: family
tags: [동거인전입, 전입동의서, 세대주동의, 세대원전입, 전입신고동의]
summary: 세대주가 다른 사람이 자기 주소로 들어와 살며 전입하는 데 동의함을 적는 동거인 전입 동의서 양식입니다.
usage: >
  가족이 아닌 사람이나 친척이 세대주의 집에 함께 살면서 전입신고를 해야 할 때, 세대주가 그 사실에 동의했음을 남기는
  문서입니다. 세대주 정보와 주소, 전입하는 사람의 이름과 생년월일, 관계, 전입 예정일을 적고 세대주가 서명합니다.
  전입신고는 별도로 해야 하며 이 문서가 신고를 대신하지 않습니다. 제출처가 요구하는 양식이 따로 있으면 그 기준을
  먼저 확인하십시오. 주민등록번호는 적지 않고 생년월일로 구분합니다.
source: original
featured: false
target_pages: 1
howto:
  - 세대주의 이름과 현재 주소를 적습니다.
  - 전입하는 사람의 이름, 생년월일, 관계를 적습니다.
  - 전입 예정일과 거주 사유를 적습니다.
  - 세대주가 날짜를 적고 서명합니다.
faq:
  - q: 이 동의서만 있으면 전입이 되나요?
    a: 아닙니다. 전입신고는 별도로 해야 하며, 이 문서는 세대주의 동의를 남기는 용도입니다.
  - q: 세대주 신분증 사본이 필요한가요?
    a: 제출처마다 다릅니다. 요구 서류는 제출처 안내를 먼저 확인하십시오.
  - q: 전입하는 사람이 여러 명이면 어떻게 하나요?
    a: 표에 한 줄씩 적고, 칸이 모자라면 같은 서식을 한 장 더 사용합니다.
related: [moving-in-report, move-in-report-poa, residence-fact-confirmation, cohabitant-confirmation]
blocks:
  - type: doc_title
    text: 동거인 전입 동의서
    spaced: false
  - type: subtitle
    text: 1. 세대주 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["세대주", "", "연락처", ""]
      - ["전입 주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울시 ○○구 ○○로 10, 101동 202호", "", ""]
  - type: subtitle
    text: 2. 전입하는 사람
  - type: table
    widths: [8, 20, 22, 20, 30]
    header: ["No", 성명, 생년월일, 세대주와 관계, 전입 예정일]
    empty_rows: 4
    row_height_mm: 9
    body_align: center
    sample_rows:
      - ["1", "김서연", "1995-05-12", "조카", "2026-11-01"]
  - type: subtitle
    text: 3. 거주 사유
  - type: textbox
    hint: "함께 거주하게 된 사유를 간단히 적으십시오."
    height_mm: 22
    sample_text: 직장 근처에서 생활하기 위해 세대주 주소에서 함께 거주하기로 하였습니다.
  - type: para
    text: 본인은 위 사람이 위 주소에 전입하여 함께 거주하는 데 동의합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   20 일
  - type: sign_line
    labels: ["세대주"]
    sample_names: [홍길동]
  - type: notice
    text: 전입신고는 별도 절차로 해야 하며, 제출처 요구 서류를 확인하십시오.
