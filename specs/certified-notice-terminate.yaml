id: certified-notice-terminate
title: 내용증명 (계약 해지 통보)
category: legal
subcategory: notice
tags: [내용증명, 계약해지통보, 계약해지, 계약해지통지서, 내용증명서식]
summary: 상대방에게 계약 해지 의사와 사유를 공식적으로 통보하고 해지 효력 발생일을 명시하는 내용증명 양식입니다.
usage: >
  계약 상대방의 의무 위반이나 기타 사유로 계약을 더 이상 유지하기 어려울 때 해지 의사를
  공식적으로 알리기 위해 사용합니다. 계약명과 계약일, 계약기간, 계약금액 등 원 계약 내용을
  먼저 특정하고 해지 사유와 근거가 되는 계약 조항을 구체적으로 기재합니다. 해지의 효력이
  발생하는 날짜를 명확히 밝히고 필요한 조치를 함께 요구합니다. 우체국 등기로 발송해 통지
  사실과 도달 시점의 증거를 남겨 두는 것이 좋습니다.
source: original
featured: false
target_pages: 1
series: certified-notice
series_name: 내용증명
variant: 계약 해지
variant_rank: 4
version: 1
created_by: agent
status: published

blocks:
  - type: doc_title
    text: 내용증명
    spaced: true

  - type: subtitle
    text: 발신인
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]

  - type: subtitle
    text: 수신인
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "(주)새길데이터", "", "010-9876-5432"]
      - ["", "서울특별시 서대문구 충정로 30", "", ""]

  - type: subtitle
    text: 1. 계약 내역
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["계약명", "", "계약일", ""]
      - ["계약기간", "", "계약금액", ""]
    sample_rows:
      - ["", "사무용품 공급계약", "", "2025-09-01"]
      - ["", "2025-09-01 ~ 2026-08-31", "", "금 12,000,000원 (금 일천이백만원)"]

  - type: subtitle
    text: 2. 해지 사유 및 근거 조항
  - type: textbox
    hint: "해지 사유와 근거가 되는 계약 조항을 구체적으로 기재하십시오."
    height_mm: 30
    sample_text: 수신인은 위 계약 제5조에서 정한 월별 대금 지급 의무를 2026년 7월분부터 이행하지 않고 있습니다. 이에 발신인은 위 계약 제10조(계약 해지)에 따라 본 계약을 해지합니다.

  - type: subtitle
    text: 3. 해지 효력 발생일
  - type: grid
    widths: [30, 70]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["해지 효력 발생일", ""]
    sample_rows:
      - ["", "2026-09-27"]

  - type: subtitle
    text: 4. 요청 사항
  - type: textbox
    hint: "해지에 따라 상대방에게 요구하는 조치(원상회복, 반환 등)를 기재하십시오."
    height_mm: 20
    sample_text: 수신인은 해지일까지 공급받은 물품에 대한 미지급 대금을 정산하여 주시기 바랍니다.

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    label: 발신인
    sample_names: [홍길동]

  - type: notice
    text: 본 내용증명은 우체국 창구에서 발신인용·수신인용·우체국 보관용 3부를 작성하여 제출합니다. 계약 해지의 효력과 범위에 관한 구체적인 판단은 변호사 등 전문가에게 확인하십시오.
