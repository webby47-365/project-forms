id: cover-letter-newcomer
title: 자기소개서 (신입용)
category: personal
subcategory: career
tags: [자기소개서, 자소서, 신입, 신입사원 자기소개서, 취업서류, cover letter]
summary: 성장과정·성격·대외활동·지원동기를 중심으로 구성한 신입 지원자용 자기소개서 양식입니다.
usage: >
  경력이 없는 신입 지원자가 이력서와 함께 제출하는 서술형 서류입니다. 성장과정과 성격은
  구체적인 경험을 근거로 쓰고, 학교생활·대외활동은 직무와 연결되는 경험을 우선 배치합니다.
  지원동기와 입사 후 포부는 해당 회사를 지원한 이유와 단기·중장기 목표를 구분해 작성하면
  설득력이 높아집니다. 항목별 글자 수 안내를 참고해 분량을 조절하십시오.
source: original
featured: false
target_pages: 1
series: cover-letter
series_name: 자기소개서
variant: 신입용
variant_rank: 2
version: 1
created_by: agent
status: published

blocks:
  - type: doc_title
    text: 자기소개서

  - type: grid
    widths: [14, 20, 12, 18, 14, 22]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["성명", "", "지원분야", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "마케팅 직무", "", "010-1234-5678"]

  - type: subtitle
    text: 1. 성장과정 및 가치관
  - type: textbox
    hint: "가정환경과 성장 과정에서 형성된 가치관을 중심으로 800자 내외로 작성하십시오."
    height_mm: 35
    sample_text: 유년 시절 부모님께서 자율성과 책임감을 함께 강조해 주신 덕분에 스스로 계획을 세우고 끝까지 실행하는 습관을 길렀습니다. 중학교 때는 학급 반장을 맡아 친구들의 의견을 조율했고, 고등학교에서는 동아리 회장으로 축제 기획을 주도하며 목표를 세우고 추진하는 법을 배웠습니다. 대학에서는 전공 수업의 팀 프로젝트마다 자료 조사와 발표를 맡아 역할에 책임을 다하는 태도를 키웠고, 이러한 경험이 성실하고 협력적인 지금의 모습을 만들었습니다.

  - type: subtitle
    text: 2. 성격의 장단점
  - type: textbox
    hint: "장점은 근거가 되는 경험과 함께, 단점은 보완 노력과 함께 700자 내외로 작성하십시오."
    height_mm: 33
    sample_text: 저의 장점은 맡은 일을 끝까지 완수하는 꾸준함입니다. 대학 시절 학과 홍보 프로젝트를 6개월간 담당하며 중간에 어려움이 있어도 계획을 수정해 목표를 달성한 경험이 있습니다. 다만 완벽을 추구하다 보니 혼자 일을 떠안는 경향이 있었는데, 동아리 활동을 통해 업무를 미리 나누고 진행 상황을 주기적으로 공유하는 방식으로 보완하고 있습니다. 입사 후에도 이러한 습관을 바탕으로 꾸준하고 믑음직한 팀원이 되겠습니다.

  - type: subtitle
    text: 3. 학교생활 및 대외활동
  - type: textbox
    hint: "직무와 연관된 동아리·프로젝트·봉사 경험을 중심으로 800자 내외로 작성하십시오."
    height_mm: 35
    sample_text: 대학 3년간 마케팅 동아리에서 활동하며 매 학기 기업 연계 프로젝트에 참여해 시장 조사부터 제안서 작성까지 전 과정을 경험했습니다. 특히 지역 소상공인 홍보 프로젝트에서는 팀장을 맡아 예산 내에서 SNS 콘텐츠를 제작해 매출 증가에 기여했습니다. 교내 봉사동아리 활동을 통해 꾸준히 지역사회와 소통하는 법도 배웠으며, 이러한 대외활동을 통해 얻은 기획력과 실행력을 직무에서도 적극 활용하겠습니다.

  - type: subtitle
    text: 4. 지원동기 및 입사 후 포부
  - type: textbox
    hint: "회사를 선택한 이유와 단기·중장기 목표를 구분하여 800자 내외로 작성하십시오."
    height_mm: 35
    sample_text: 귀사의 제품이 실제 소비자 생활에 주는 변화를 직접 체감하며 이 분야에서 성장하고 싶다는 확신을 갖게 되었습니다. 대학에서 쌓은 마케팅 기획 경험과 데이터 분석 역량을 바탕으로 입사 후 1년간은 실무 프로세스를 빠르게 익히는 데 집중하겠습니다. 이후 3년 내에는 담당 분야의 캠페인을 직접 기획하고 성과를 수치로 증명할 수 있는 실무자로 성장해 귀사의 성장에 기여하겠습니다.

  - type: para
    text: 위 내용은 사실과 다름이 없음을 확인합니다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    label: 지원자
    sample_names: [홍길동]
