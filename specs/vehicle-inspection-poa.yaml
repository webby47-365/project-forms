id: vehicle-inspection-poa
title: 자동차 검사 대행 위임장
category: public
subcategory: vehicle
tags: [자동차검사위임장, 정기검사대행, 차량검사대리, 검사대행위임장, 종합검사위임장]
summary: 자동차 정기검사·종합검사를 가족이나 정비업체에 맡길 때 차량 정보와 검사 종류·위임 범위를 적는 위임장입니다.
usage: >
  바빠서 직접 검사소에 가지 못할 때 가족이나 정비업체, 대행업체에 자동차 검사를 맡기면서 쓰는 서류입니다.
  차량번호와 차대번호를 자동차등록증과 똑같이 옮겨 적고, 검사 종류와 맡기는 범위를 표시합니다.
  검사 기간, 필요한 서류와 수수료는 차종과 지역에 따라 다르므로 검사소 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 소유자의 성명·연락처를 적습니다.
  - 차량번호·차종·차대번호를 등록증과 맞춰 적습니다.
  - 검사 종류와 맡기는 범위를 표시합니다.
  - 대리인 정보를 적고 소유자가 서명 또는 날인합니다.

faq:
  - q: 대리인이 검사를 받을 때 위임장이 꼭 필요한가요?
    a: 소유자가 아닌 사람이 접수할 때는 요구하는 경우가 많으니 검사소나 업체 안내를 먼저 확인하십시오.
  - q: 검사 기간이 지나면 어떻게 하나요?
    a: 기간을 넘기면 과태료가 부과될 수 있으니 검사소 또는 관할 기관에 문의하십시오.
  - q: 검사 결과 부적합이면 재검사도 맡길 수 있나요?
    a: 위임 범위에 재검사를 넣어 두면 같은 위임장으로 맡기기 편합니다.

related: [vehicle-registration-poa, vehicle-maintenance-history, power-of-attorney]

blocks:
