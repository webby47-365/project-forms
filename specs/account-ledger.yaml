id: account-ledger
title: 거래처 원장
category: corp
subcategory: finance
tags: [거래처원장, 거래원장, 거래내역관리, 매출매입관리, ledger]
summary: 거래처별 거래일자·매출·입금 내역과 잔액을 누적 기록해 관리하는 거래처 원장입니다.
usage: >
  특정 거래처와의 거래 내역을 날짜순으로 누적 기록해 미수금과 잔액을 관리하는 서식입니다.
  차변(매출)은 청구가 발생한 금액, 대변(입금)은 실제 수령한 금액으로 구분해 적고, 매
  거래 후 잔액을 갱신합니다. 전월 이월액을 첫 행에 반영해야 잔액이 맞으며, 세금계산서
  발행 여부 등은 비고란에 기재해 세무 처리 시 참고하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
blocks:
