id: withholding-request
title: 원천징수영수증 발급 요청서
category: corp
subcategory: finance
tags: [원천징수영수증, 발급요청서, 근로소득원천징수, 소득증명요청, withholding]
summary: 원천징수영수증 발급을 위해 신청자 정보와 귀속연도·사용 용도를 기재하는 요청서입니다.
usage: >
  대출·비자·소득증명 등 제출 목적으로 원천징수영수증이 필요할 때 회사(급여 담당 부서)에
  발급을 요청하는 문서입니다. 귀속연도와 필요한 발급 부수, 사용 용도를 명확히 적어야
  발급 담당자가 정확한 연도분을 찾아 처리할 수 있습니다. 개인정보 수집·이용에 동의해야
  처리가 진행되며, 발급 처리 기간은 부서 규정에 따라 다를 수 있으니 미리 확인하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
howto:
  - 신청인의 성명과 사번, 연락처를 적습니다.
  - 발급이 필요한 귀속연도와 부수를 적습니다.
  - 제출할 사용 용도를 적습니다.
  - 개인정보 수집·이용 동의란에 표시합니다.
  - 담당 부서에 제출하고 처리 기간을 확인합니다.

faq:
  - q: 여러 해의 영수증을 한 번에 요청할 수 있나요?
    a: 귀속연도별로 나누어 적으면 한 번에 여러 해분을 함께 요청할 수 있습니다.
  - q: 발급까지 며칠 걸리나요?
    a: 부서 규정에 따라 처리 기간이 다르므로 담당 부서에 미리 확인하는 것이 좋습니다.

related: [employment-certificate, payslip, year-end-tax-checklist]

