  - type: para
    text: 본인은 원천징수영수증 발급을 위해 성명, 생년월일, 사번, 부서, 연락처 등 개인정보를 회사가 수집·이용하는 것에 동의합니다. 수집된 정보는 발급 목적 외에는 사용하지 않으며, 발급 처리가 완료된 후 관련 규정에 따라 폐기됩니다.
