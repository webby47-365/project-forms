id: household-budget
title: 가계부 (월간)
category: personal
subcategory: life
tags: [가계부, 월간지출관리, 가계관리, 생활비, 예산]
summary: 월별 수입·지출을 항목별·분류별로 기록하고 월말 수지를 정산하는 가계부 양식입니다.
usage: >
  가정의 월간 재정 상황을 체계적으로 관리하는 양식입니다. 수입란에는 급여·용돈·기타수입을,
  지출란에는 날짜·항목·분류·결제수단·금액을 기재합니다. 분류는 식비·교육·주거·건강·오락·교통 등
  생활 패턴에 맞게 작성하고, 월말에 총 수입·총 지출·잔액을 계산하여 다음달 예산 수립의 근거로 삼습니다.
source: original
featured: false
target_pages: 2
series: household-budget
series_name: 가계부
variant: 월간
variant_rank: 1
variant_use: 매달 수입·지출을 자세히 기록할 때 씁니다.

howto:
  - 작성월과 기간을 적습니다.
  - 급여·용돈 등 수입을 적습니다.
  - 날짜별 지출을 항목·분류로 적습니다.
  - 결제수단과 금액을 적습니다.
  - 월말에 총수입·총지출·잔액을 계산합니다.

faq:
  - q: 주간·연간 가계부와 무엇이 다른가요?
    a: 이 서식은 한 달 단위로 자세히 기록하며, 주간은 짧은 주기로, 연간은 한 해 흐름을 봅니다.
  - q: 분류는 어떻게 나눠야 하나요?
    a: 식비·주거·교통 등 생활 패턴에 맞게 나누면 됩니다. 항목 수가 적어도 상관없습니다.

related: [monthly-schedule, daily-planner, year-end-tax-checklist]

blocks:
  - type: doc_title
    text: 가계부
    spaced: false

  - type: grid
    widths: [30, 35, 35]
    label_cols: [0]
    row_height_mm: 7
    rows:
      - ["작성월", "", ""]
      - ["기간", "~", ""]
    sample_rows:
      - ["", "2026년 9월", ""]
      - ["", "", "2026-09-01 ~ 2026-09-30"]

  - type: subtitle
    text: 1. 월간 수입

  - type: table
    widths: [15, 40, 25, 20]
    header: ["No", 항목, 금액(원), 비고]
    empty_rows: 5
    row_height_mm: 7.5
    sample_rows:
      - ["1", "급여", "3,200,000", "본사 급여"]
      - ["2", "부수입", "300,000", "프리랜서 작업"]

  - type: grid
    widths: [60, 40]
