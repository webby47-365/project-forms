id: unused-annual-leave-pay-request
title: 미사용 연차수당 지급 요청서
category: corp
subcategory: hr
tags: [미사용연차수당, 연차수당청구, 연차수당요청서, 연차수당지급, 연차보상]
summary: 쓰지 못한 연차의 일수와 지급 요청 금액을 적어 회사에 연차수당 지급을 요청하는 서식입니다.
usage: >
  연차휴가를 쓰지 못한 채 연도가 끝나거나 퇴사할 때, 남은 연차에 대한 수당을 회사에 요청하는
  서식입니다. 연차 발생·사용·미사용 일수와 산정 기준이 되는 일급을 적고, 요청 금액은 담당자와
  확인한 값으로 적습니다. 산정 방식과 지급 시기는 회사 규정과 고용노동부 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 소속, 성명, 입사일을 적습니다.
  - 연차 발생 일수, 사용 일수, 미사용 일수를 적습니다.
  - 확인한 일급과 요청 금액, 지급 희망일을 적습니다.
  - 서명 후 급여 담당자에게 제출합니다.
faq:
  - q: 요청 금액은 어떻게 정하나요?
    a: 미사용 일수에 일급을 곱해 계산하는 것이 일반적입니다. 정확한 산정은 급여 담당자와 확인하십시오.
  - q: 퇴사할 때도 쓸 수 있나요?
    a: 쓸 수 있습니다. 퇴사일을 비고에 적고 마지막 급여 정산 전에 제출하십시오.
  - q: 회사가 거절하면 어떻게 하나요?
    a: 사유를 서면으로 받아 두고 고용노동부 상담 등 공식 안내를 확인하십시오.
related: [annual-leave-reply, annual-leave-plan, severance-calculation, leave-request]
blocks:
  - type: doc_title
    text: 미사용 연차수당 지급 요청서
    spaced: false
  - type: subtitle
    text: 1. 요청인
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["부서(팀)", "", "직위", ""]
      - ["성명", "", "입사일", ""]
    sample_rows:
      - ["", "영업지원팀", "", "대리"]
      - ["", "홍길동", "", "2021-03-02"]
  - type: subtitle
    text: 2. 연차 현황
  - type: table
    widths: [20, 20, 20, 20, 20]
    header: [기준 기간, 발생 일수, 사용 일수, 미사용 일수, 일급]
    empty_rows: 2
    row_height_mm: 9
    sample_rows:
      - ["2026년", "15일", "11일", "4일", "00,000원"]
  - type: subtitle
    text: 3. 지급 요청
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["요청 금액", "", "지급 희망일", ""]
      - ["비고", "", "", ""]
    merges:
      - [1, 1, 1, 3]
    sample_rows:
      - ["", "000,000원", "", "2026-12-25"]
      - ["", "연말 기준 미사용분", "", ""]
  - type: textbox
    hint: "요청 사유나 회사에 전달할 사항이 있으면 적으십시오."
    height_mm: 22
    sample_text: "업무 일정으로 쓰지 못한 연차 4일에 대한 수당 지급을 요청합니다. 산정 내역은 급여 담당자와 확인하겠습니다."
  - type: date_line
    sample_text: 2026 년   12 월   10 일
  - type: sign_line
    labels: ["요청인", "접수 담당자"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 산정 방식과 지급 시기는 회사 규정과 고용노동부 안내를 확인하십시오.
