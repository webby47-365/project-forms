id: petition-letter
title: 탄원서
category: legal
subcategory: litigation
tags: [탄원서, 선처탄원서, 반성문, 진정서, 정상참작]
summary: 사건 관계자나 지인이 선처를 요청하는 사정을 기재해 제출하는 탄원서입니다.
usage: >
  수사기관이나 법원에 정상 참작을 요청할 때 제출하는 서면입니다. 작성자와 당사자의 관계를
  분명히 밝히고, 당사자의 평소 생활과 사건 이후의 태도를 구체적인 사실로 적는 편이 설득력이
  있습니다. 감정적 호소만 나열하거나 사건 자체를 부정하는 내용은 오히려 불리하게 작용할 수
  있습니다. 서명과 연락처를 반드시 기재해야 진정성이 인정되며, 신분증 사본을 함께 제출하는
  경우도 있습니다. 본 서식은 참고용이며 제출처의 요구 사항을 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 사건번호와 당사자, 작성자와의 관계를 적습니다.
  - 당사자의 평소 생활과 사건 이후 태도를 사실대로 적습니다.
  - 선처를 바라는 이유를 구체적으로 서술합니다.
  - 서명과 연락처를 적고 제출처에 맞게 제출합니다.

faq:
  - q: 신분증 사본도 함께 내야 하나요?
    a: 제출처에 따라 요구하는 경우가 있으니 제출 전에 미리 확인하는 것이 좋습니다.
  - q: 감정적인 내용만 적어도 되나요?
    a: 감정적 호소만 나열하기보다 구체적인 사실을 근거로 적어야 설득력이 있습니다.

blocks:
  - type: doc_title
    text: 탄원서
  - type: subtitle
    text: 사건 및 당사자
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사건번호", "", "담당 재판부 / 수사관", ""]
      - ["당사자 성명", "", "작성자와의 관계", ""]
    sample_rows:
      - ["", "2026민단12345", "", "민사3단독"]
      - ["", "박민준", "", "직장 동료"]
  - type: subtitle
    text: 작성자
  - type: grid
    widths: [14, 26, 14, 20, 26]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 4]
    rows:
      - ["성명", "", "생년월일", "", "연락처"]
      - ["주소", "", "", "", ""]
      - ["직업", "", "당사자와 알게 된 기간", "", "년"]
    sample_rows:
      - ["", "이수현", "", "1990-02-10", ""]
      - ["", "서울특별시 마포구 월드컵북로 100", "", "", ""]
      - ["", "회사원", "", "5", ""]
  - type: subtitle
    text: 탄원 내용
  - type: textbox
    hint: "당사자의 평소 생활, 사건 이후의 태도, 선처를 구하는 사정을 구체적인 사실로 기재하십시오. 사건 자체를 부정하는 내용은 피하십시오."
    height_mm: 78
    sample_text: 본인은 박민준 씨와 5년간 같은 부서에서 근무한 동료입니다. 박민준 씨는 평소 성실하게 근무하였고, 금전 문제가 해결되지 않아 어려움을 겪고 있는 것으로 알고 있습니다. 원만히 해결하려 노력하는 모습을 보아 선처하여 주시기를 부탁드립니다.
  - type: para
    text: 위와 같은 사정을 참작하여 선처해 주시기를 간곡히 부탁드립니다.
    align: center
    size: 11
    space_after: 2
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    label: 작성자
    sample_names: [이수현]
  - type: spacer
    height_pt: 4
  - type: para
    text: "                        귀중"
    align: center
    size: 12
    bold: true
  - type: notice
    text: 작성자의 서명과 연락처가 없으면 진정성이 인정되지 않을 수 있습니다. 제출처가 신분증 사본이나 인감을 요구하는지 미리 확인하십시오. 본 서식은 참고용입니다.
