id: administrative-objection
title: 이의신청서 (행정처분)
category: legal
subcategory: litigation
tags: [이의신청서, 행정심판청구, 과태료이의신청, 처분불복]
summary: 행정기관의 처분이나 과태료 부과에 불복해 재심사를 요구하는 이의신청서입니다.
usage: >
  과태료 부과, 각종 인허가 거부, 지원금 환수 등 행정처분에 불복할 때 처분청에 제출합니다.
  이의신청 기간은 법령마다 다르고 대체로 처분을 통지받은 날부터 30일 또는 60일이며,
  기간을 넘기면 내용과 무관하게 각하되므로 통지서에 적힌 기간을 먼저 확인하십시오.
  이의신청과 행정심판·행정소송은 별개 절차이므로 어느 절차를 택할지 판단이 필요합니다.
  본 서식은 참고용이며 처분청이 지정한 양식이 있으면 그 양식을 우선 사용하십시오.
source: original
featured: false
target_pages: 2
howto:
  - 신청인 정보와 처분 내용을 적습니다.
  - 처분청과 처분일, 처분번호를 적습니다.
  - 이의신청 취지와 이유를 적습니다.
  - 증거 자료를 첨부합니다.
  - 처분을 통지받은 기관에 기한 내 제출합니다.

faq:
  - q: 이의신청 기간은 며칠인가요?
    a: 법령마다 다르며 대체로 통지받은 날부터 30일 또는 60일입니다. 처분 통지서에 적힌 기간을 먼저 확인하십시오.
  - q: 이의신청과 행정심판은 같이 할 수 있나요?
    a: 별개 절차이므로 함께 진행할 수도 있습니다. 다만 처분 근거 법령에 정해진 절차와 기한을 각각 확인해야 합니다.

related: [info-disclosure-request, parking-fine-objection, civil-petition]

