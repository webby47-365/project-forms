id: counseling-log
title: 상담일지
category: edu
subcategory: school
tags: [상담일지, 학생상담, 상담기록, 학교상담, 상담일기]
summary: 학생 상담의 일시, 참석자, 상담 내용, 조치 사항을 기록하는 상담 기록 양식입니다.
usage: >
  학생 개인 상담, 학부모 상담, 진로 지도 등 상담 업무를 기록합니다. 상담 일시와 참석자,
  상담의 주제·유형을 명확히 기입하고, 상담 내용은 자유기술란에 구체적으로 작성합니다.
  상담을 통해 실시한 조치와 후속 지도 방안을 함께 기재하여 일관성 있는 학생 지도가
  이루어지도록 합니다. 학생의 개인 건강정보나 진단명은 기재하지 않습니다.
source: original
featured: false
target_pages: 1

howto:
  - 상담 일시와 상담자, 대상 학생을 적습니다.
  - 상담 유형과 면담 시간을 적습니다.
  - 상담 내용을 자유기술란에 구체적으로 적습니다.
  - 실시한 조치와 후속 지도 방안을 적습니다.

faq:
  - q: 학생의 건강 정보도 적어야 하나요?
    a: 개인 건강정보나 진단명은 적지 않고 상담 내용과 지도 방안 위주로 기록합니다.
  - q: 학부모 상담도 같은 양식을 쓰나요?
    a: 대상자란에 학부모임을 표시하고 나머지 항목은 동일하게 작성하면 됩니다.

blocks:
  - type: doc_title
    text: 상담일지
    spaced: false

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["상담 일시", "", "상담자(교사명)", ""]
      - ["대상자(학생명)", "", "학년·반", ""]
      - ["상담 유형", "", "면담 시간", "분"]
    sample_rows:
      - ["", "2026-09-10 15:00", "", "박민준"]
      - ["", "이수현", "", "2학년 3반"]
      - ["", "진로 상담", "", "30분"]

  - type: subtitle
    text: 상담 내용

  - type: textbox
    hint: "상담의 주요 내용, 학생이 제시한 고민이나 문제 상황, 상담 과정을 구체적으로 기재하십시오."
    height_mm: 40
    sample_text: 이수현 학생이 희망 진로와 관련해 학과 선택을 고민한다고 이야기했습니다. 희망 전공 관련 교과 성적과 동아리 활동 경험을 함께 점검하고, 진로 검사 결과를 참고해 후보 학과를 정리했습니다. 학생은 학과 탐방 프로그램에 참여해 보고 싶다는 의견을 밝혔습니다.

  - type: subtitle
    text: 조치 사항 및 후속 계획

  - type: grid
    widths: [50, 50]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["조치 사항", ""]
      - ["후속 계획", ""]
    sample_rows:
      - ["", "학과 탐방 프로그램 신청 안내, 진로검사 결과지 학부모 전달"]
      - ["", "2주 후 재상담하여 학과 선택 진행 상황 점검"]

  - type: spacer
    height_pt: 8

  - type: para
    text: 상담자 (서명 또는 인)
    align: center
    size: 11

  - type: notice
    text: 상담 기록은 학교 운영위원회 규정에 따라 적절히 보관·관리하시고, 학생의 민감한 개인정보는 기재하지 않습니다.
