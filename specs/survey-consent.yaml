id: survey-consent
title: 설문조사 동의서
category: public
subcategory: consent
tags: [설문조사 동의서, 조사 참여 동의, 개인정보 수집 동의, 연구 참여 동의서, 설문 안내문]
summary: 설문의 목적·수집 항목·보유기간과 참여자 권리를 안내하고 동의를 받는 서식입니다.
usage: >
  설문이나 조사를 시작하기 전에 참여자에게 목적과 개인정보 처리 방법을 알리고 동의를 받는
  서류입니다. 수집 항목과 이용 목적, 보유기간을 항목별로 나누어 적어야 하며, 불필요한 항목은
  수집하지 않는 것이 원칙입니다. 참여는 자발적이고 언제든지 중단할 수 있다는 점과 중단해도
  불이익이 없다는 점을 명확히 안내하십시오. 제3자 제공이나 위탁이 있으면 대상과 범위를 따로
  표시해 선택적으로 동의받아야 합니다. 미성년자가 참여하는 경우 보호자 동의란을 작성하고,
  문의처와 결과 활용 계획도 함께 안내하십시오.
source: original
featured: false
target_pages: 2
howto:
  - 조사 목적과 수집 항목을 항목별로 적습니다.
  - 보유기간과 참여자 권리를 안내합니다.
  - 제3자 제공이나 위탁이 있으면 별도로 표시합니다.
  - 미성년자는 보호자 동의를 받아 제출합니다.

faq:
  - q: 동의하지 않으면 참여할 수 없나요?
    a: 참여는 자발적이며 동의하지 않아도 되고, 동의 후에도 언제든지 중단할 수 있고 불이익이 없어야 합니다.
  - q: 수집 항목은 최대한 많이 적나요?
    a: 조사 목적에 꼭 필요한 항목만 적어야 하며, 불필요한 개인정보는 수집하지 않는 것이 원칙입니다.

blocks:
  - type: doc_title
    text: 설문조사 참여 동의서
    spaced: false
  - type: subtitle
    text: 1. 조사 개요
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [2, 1, 2, 3]
    rows:
      - ["조사명", "", "", ""]
      - ["주관기관", "", "조사기간", ""]
      - ["조사 목적", "", "", ""]
      - ["조사 방법", "온라인 / 서면 / 면접", "소요 시간", "약        분"]
    sample_rows:
      - ["", "2026년 고객만족도 조사", "", ""]
      - ["", "(주)한빛커머스 경영기획팀", "", "2026-09-15 ~ 2026-09-30"]
      - ["", "서비스 개선을 위한 고객 의견 수렴", "", ""]
      - ["", "", "", "약 30분"]
  - type: subtitle
    text: 2. 개인정보 수집·이용 안내
  - type: table
    widths: [28, 28, 20, 24]
    header: [수집 항목, 이용 목적, 보유기간, 동의 여부]
    empty_rows: 3
    row_height_mm: 9
    sample_rows:
      - ["연령대·직업군", "서비스 이용 현황 분석", "조사 종료 후 6개월", "동의"]
      - ["이용 의견(주관식 응답)", "서비스 개선 자료 활용", "조사 종료 후 6개월", "동의"]
  - type: subtitle
    text: 3. 제3자 제공 및 위탁 (해당 시)
  - type: table
    widths: [24, 26, 26, 24]
    header: [제공(위탁) 대상, 제공 항목, 이용 목적, 동의 여부]
    empty_rows: 3
    row_height_mm: 9
  - type: subtitle
    text: 4. 참여자 안내
  - type: kv_list
    items:
      - "설문 참여는 자발적이며, 참여하지 않거나 중간에 중단하더라도 어떠한 불이익도 없습니다."
      - "응답 내용은 통계 목적으로만 이용하며, 개인을 식별할 수 있는 형태로 공개하지 않습니다."
      - "보유기간이 지나면 수집한 개인정보는 지체 없이 파기합니다."
      - "필수 항목에 동의하지 않는 경우 설문 참여가 제한될 수 있습니다."
  - type: grid
    widths: [22, 28, 22, 28]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["문의처(담당자)", "", "연락처", ""]
      - ["결과 활용 계획", "", "결과 공개 방식", ""]
    sample_rows:
      - ["", "박민준(경영기획팀)", "", "010-1234-5678"]
      - ["", "내부 보고 및 서비스 개선 자료로 활용", "", "요약 통계만 공개"]
  - type: subtitle
    text: 5. 동의
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["참여자 성명", "", "생년월일", ""]
      - ["필수항목 동의", "동의 / 미동의", "선택항목 동의", "동의 / 미동의"]
      - ["보호자 성명 (미성년자)", "", "보호자 연락처", ""]
    sample_rows:
      - ["", "이수현", "", "1994-02-11"]
      - ["", "", "", ""]
      - ["", "", "", ""]
  - type: para
    text: 위 안내 내용을 충분히 이해하였으며, 설문조사 참여에 동의합니다.
    align: center
    size: 10.5
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["참여자", "보호자(미성년자)"]
    sample_names: [이수현, ""]
  - type: notice
    text: 개인정보 처리 기준은 관련 법령과 기관의 개인정보 처리방침을 확인하십시오. 조사 목적에 필요하지 않은 민감한 항목은 수집하지 마십시오.
