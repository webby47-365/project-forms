id: parking-lease-contract
title: 주차장 임대차계약서
category: estate
subcategory: lease
series: lease
series_name: 임대차계약서
variant: 주차장
variant_rank: 5
tags: [주차장임대차계약서, 주차구획계약서, 주차장임대계약, 주차장계약서, 주차공간임대]
summary: 주차 구획의 위치와 차량번호, 사용료와 보증금을 정해 주차장을 임대할 때 작성하는 계약서입니다.
usage: >
  건물이나 공용 주차장의 구획 1개를 임대할 때 사용합니다. 구획번호와 주차 가능 차량의 규격,
  등록 차량번호를 정확히 적어 다른 차량이 주차하는 분쟁을 막으십시오. 월 사용료와 보증금,
  납부일을 명시하고 차량을 변경할 때는 임대인에게 미리 통지하도록 정합니다. 주차장 내
  차량 손해에 대한 관리책임 범위를 명확히 해 두면 사고 발생 시 다툼을 줄일 수 있습니다.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1
variant_use: 주차 구획 1개만 별도로 빌릴 때 씁니다.

howto:
  - 임대인과 임차인의 인적사항을 적습니다.
  - 주차 구획번호와 차량 규격을 기재합니다.
  - 등록 차량번호와 사용기간을 적습니다.
  - 월 사용료와 보증금, 납부일을 정합니다.
  - 관리책임 범위를 확인하고 서명 날인합니다.

faq:
  - q: 차량을 바꾸면 어떻게 하나요?
    a: 차량을 변경할 때는 미리 임대인에게 통지하도록 계약서에 정해 두시면 됩니다.
  - q: 주차 중 사고 책임은 누가 지나요?
    a: 계약서에 관리책임 범위를 명확히 적어 두면 사고 발생 시 다툼을 줄일 수 있습니다.

blocks:
  - type: doc_title
    text: 주차장 임대차계약서
    spaced: false
  - type: para
    text: 임대인과 임차인은 아래 주차장에 관하여 다음과 같이 임대차계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["임대인", "", "연락처", ""]
      - ["임차인", "", "연락처", ""]
    sample_rows:
      - ["", "김서연", "", "010-1234-5678"]
      - ["", "홍길동", "", "010-9876-5432"]
  - type: subtitle
    text: 2. 주차 구획의 표시
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["주차장 주소", "", "", ""]
      - ["구획번호", "", "주차 가능 차량", ""]
      - ["차량번호", "", "", ""]
    sample_rows:
      - ["", "서울특별시 마포구 월드컵북로 100 지하주차장", "", ""]
      - ["", "B2-15", "", "중형 이하"]
      - ["", "12가 3456", "", ""]
  - type: subtitle
    text: 3. 임대차 조건
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사용 기간", "", "월 사용료", ""]
      - ["보증금", "", "납부일", ""]
    sample_rows:
      - ["", "2026.10.01~2027.09.30", "", "금 100,000원"]
      - ["", "금 200,000원", "", "매월 1일"]
  - type: article
    heading: 제1조 (사용 범위)
    lines:
      - "임차인은 위 구획에 등록한 차량 1대만 주차할 수 있으며, 다른 목적으로 사용할 수 없다."
  - type: article
    heading: 제2조 (차량 변경 통지)
    lines:
      - "임차인은 주차 차량을 변경하는 경우 사전에 임대인에게 차량번호를 통지해야 한다."
  - type: article
    heading: 제3조 (관리책임과 손해)
    lines:
      - "임차인은 본인 차량의 관리를 책임지며, 주차장 내에서 발생한 차량 손해에 대하여 임대인은 고의·과실이 없는 한 책임을 지지 않는다."
  - type: article
    heading: 제4조 (해지)
    lines:
      - "임차인이 월 사용료를 2개월 이상 연체하거나 제1조를 위반한 경우 임대인은 이 계약을 해지할 수 있다."
  - type: article
    heading: 제5조 (원상회복)
    lines:
      - "계약 종료 시 임차인은 구획 내 시설물을 철거하고 원상으로 회복하여 인도한다."
  - type: para
    text: 본 계약을 증명하기 위하여 계약 당사자가 이의 없음을 확인하고 각각 서명·날인 후 각 1부씩 보관한다.
    align: both
    size: 9
