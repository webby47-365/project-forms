id: seal-usage-log
title: 법인인감 사용대장
category: corp
subcategory: admin
version: 1
created_by: agent
status: published
tags: [법인인감사용대장, 인감관리대장, 인감사용대장, 법인인감관리, seal log]
summary: 법인인감의 사용일자·목적·사용처와 신청자·승인자를 기록해 인감 사용 내역을 관리하는 대장입니다.
usage: >
  법인인감을 사용할 때마다 사용목적과 사용처, 매수를 기록하여 오·남용을 방지하는
  관리대장입니다. 사용 신청 시 신청자와 승인자를 함께 기재해 책임 소재를 명확히
  하고, 계약서나 금융기관 제출용처럼 중요도가 높은 사용 건은 사유를 구체적으로
  적으십시오. 보관 책임자 외에는 임의로 사용할 수 없습니다.
source: original
featured: false
target_pages: 1

howto:
  - 보관부서와 인감 종류를 적습니다.
  - 사용일자와 사용목적, 사용처를 기재합니다.
  - 사용 매수를 적고 신청자·승인자 서명을 받습니다.
  - 사용 후 인감을 즉시 반납하고 대장을 마감합니다.

faq:
  - q: 사용목적은 얼마나 구체적으로 적나요?
    a: 어떤 서류에 사용했는지 알 수 있도록 계약서명이나 제출처를 구체적으로 적으십시오.
  - q: 승인자 없이 사용해도 되나요?
    a: 오·남용을 막기 위해 승인자 확인을 받은 뒤 사용하는 것이 원칙입니다.

related: [document-register, proposal-draft, power-of-attorney]

blocks:
  - type: doc_title
    text: 법인인감 사용대장
    spaced: true

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["보관부서", "", "인감 종류", ""]
    sample_rows:
      - ["", "총무팀", "", "법인 인감"]

  - type: subtitle
    text: 사용 현황

  - type: table
    widths: [5, 12, 20, 18, 15, 8, 11, 11]
    header: ["No", 사용일자, 문서명, 사용목적, 사용처, 매수, 신청자, 승인자]
    empty_rows: 13
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2026-09-02", "물품 구매 계약서", "계약 체결", "㈜한빛물산", "2", "김서연", "대표이사"]
      - ["2", "2026-09-05", "금융기관 제출서류", "대출 신청", "국민은행 강남지점", "1", "박민준", "대표이사"]
      - ["3", "2026-09-09", "부동산 임대차계약서", "사무실 임차", "㈜새길데이터", "3", "이수현", "대표이사"]
      - ["4", "2026-09-11", "관공서 제출서류", "사업자등록 정정", "강남세무서", "1", "홍길동", "대표이사"]

  - type: notice
    text: 법인인감은 보관 책임자 외 임의로 반출하거나 사용할 수 없으며, 사용 후 즉시 보관함에 반납하고 본 대장에 기록하십시오.
