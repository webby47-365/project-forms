id: integrity-pledge-bidding
title: 청렴계약 이행서약서
category: public
subcategory: procure
tags: [청렴서약서, 청렴계약이행서약서, 입찰청렴서약, 부정청탁금지서약, 계약청렴서약]
summary: 입찰·계약 과정에서 금품·향응을 주고받거나 부당한 청탁을 하지 않겠다고 다짐하는 청렴계약 이행서약서입니다.
usage: >
  공공기관 입찰이나 수의계약을 체결할 때 입찰 참가자(계약상대자)가 계약 담당자에게
  부정한 청탁이나 금품·향응을 제공하지 않고, 담합·특혜를 요구하지 않겠다고 약속하는
  서약서입니다. 발주기관 담당자와 참가업체 대표자가 각각 서명하며, 서약 위반이
  확인되면 입찰 참가 제한 등 불이익을 받을 수 있음을 함께 명시합니다. 발주기관마다
  세부 문구가 정해져 있는 경우가 많으므로 입찰 공고문에 지정 서식이 있으면 그것을
  우선 따르십시오.
source: original
featured: false
target_pages: 1

howto:
  - 입찰(계약) 건명과 입찰번호, 발주기관을 적습니다.
  - 서약 내용을 확인합니다.
  - 참가업체 대표자가 서명하거나 직인을 찍습니다.
  - 발주기관 담당자가 서명하고 1부씩 나눠 보관합니다.

faq:
  - q: 서약서 문구를 발주기관이 지정하기도 하나요?
    a: 네. 입찰 공고문에 지정 서식이 있으면 그 서식을 우선 사용해야 합니다.
  - q: 서약을 어기면 어떻게 되나요?
    a: 위반 사실이 확인되면 입찰 참가 제한이나 계약 해지 등 불이익을 받을 수 있습니다.
  - q: 공동수급체로 참가할 때는 누가 서명하나요?
    a: 공동수급체 구성원 각자의 대표자가 모두 서명하는 것이 일반적입니다.

related: [gov-bid-participation, gov-bid-form, bid-performance-certificate]

blocks:
  - type: doc_title
    text: 청렴계약 이행서약서
    spaced: true

  - type: subtitle
    text: 대상 계약

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["입찰(계약)건명", "", "입찰번호", ""]
      - ["발주기관", "", "참가업체", ""]
    sample_rows:
      - ["", "청사 사무기기 공급 계약", "", "2026-물품-0142"]
      - ["", "○○시청", "", "(주)한빛커머스"]

  - type: subtitle
    text: 서약 내용

  - type: kv_list
    items:
      - "입찰·계약과 관련하여 발주기관 임직원에게 금품이나 향응을 제공하지 않는다."
      - "다른 입찰 참가자와 담합하거나 사전에 가격·조건을 협의하지 않는다."
      - "계약 조건 이외의 특혜나 부당한 편의 제공을 요구하지 않는다."
      - "서약을 위반한 사실이 확인되면 입찰 참가 제한 등 불이익을 감수한다."

  - type: para
    text: 위 사항을 성실히 이행할 것을 서약합니다.
    align: center
    size: 11
    space_after: 2

  - type: date_line
    sample_text: 2026 년    9 월   16 일

  - type: sign_line
    labels: ["참가업체 대표자", "발주기관 담당자"]
    sample_names: [홍길동, 김서연]

  - type: notice
    text: 발주기관이 지정한 서약서 서식이 있으면 그 서식을 우선 사용하십시오.
