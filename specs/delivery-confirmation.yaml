id: delivery-confirmation
title: 납품확인서
category: corp
subcategory: sales
tags: [납품확인서, 물품인수증, 검수확인서, 납품서]
summary: 납품한 품목의 수량과 검수 결과를 수령자가 확인·서명하는 납품확인서입니다.
usage: >
  물품이나 용역을 인도한 사실을 문서로 남겨 대금 청구의 근거로 삼는 서식입니다. 수령자의
  서명 또는 날인을 반드시 받아야 하며, 검수 결과에 이상이 있으면 비고란에 구체적으로 적고
  재납품 기한을 함께 기재합니다. 공급자와 수령자가 각각 1부를 보관하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 납품확인서
  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["납품번호", "", "납품일자", "", "발주번호", ""]
    sample_rows:
      - ["", "DV-2026-014", "", "2026-09-10", "", "PO-2026-031"]
  - type: subtitle
    text: 공급자 / 수령자
  - type: grid
    widths: [14, 26, 14, 22, 24]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["공급자 상호", "", "대표자", "", "연락처"]
      - ["수령자 상호", "", "담당자", "", "연락처"]
      - ["납품 장소", "", "", "", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "홍길동", ""]
      - ["", "(주)새길데이터", "", "김서연", ""]
      - ["", "본사 물류센터 (서울 마포구)", "", "", ""]
  - type: subtitle
    text: 납품 내역
  - type: table
    widths: [7, 24, 15, 8, 9, 10, 12, 15]
    header: ["No", 품명, 규격, 단위, 발주수량, 납품수량, 검수결과, 비고]
    empty_rows: 7
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "A4 복사용지", "A4 80g", "BOX", "20", "20", "합격", "-"]
      - ["2", "토너 카트리지", "HP 26A", "EA", "10", "10", "합격", "-"]
      - ["3", "사무용 의자", "메쉬형", "EA", "5", "5", "합격", "-"]
      - ["4", "화이트보드", "120x90", "EA", "2", "2", "합격", "-"]
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["검수 결과", "합격 / 부분합격 / 불합격", "재납품 기한", ""]
    sample_rows:
      - ["", "합격", "", ""]
  - type: textbox
    hint: "불합격·부분합격 시 사유와 조치사항을 구체적으로 기재하십시오."
    height_mm: 18
    sample_text: 해당 없음 (전 품목 합격)
  - type: para
    text: 위와 같이 납품하였으며 수령자는 이를 확인합니다.
    align: center
    size: 11
    space_after: 2
  - type: date_line
    sample_text: 2026 년    9 월   10 일
  - type: sign_line
    labels: ["공급자", "수령자"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 본 확인서는 대금 청구의 근거가 되므로 수령자의 서명 또는 날인을 반드시 받고 공급자·수령자가 각각 1부를 보관하십시오.
