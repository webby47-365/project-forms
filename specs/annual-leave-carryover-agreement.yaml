id: annual-leave-carryover-agreement
title: 연차 이월 합의서
category: corp
subcategory: hr
tags: [연차이월합의서, 연차이월, 연차휴가이월, 미사용연차이월, 연차사용기한연장]
summary: 남은 연차를 다음 해로 넘겨 쓰기로 회사와 근로자가 합의할 때 일수·사용 기한·조건을 적는 합의서입니다.
usage: >
  연말까지 다 쓰지 못한 연차를 금전으로 정산하지 않고 다음 해에 쓰기로 회사와 근로자가 합의할 때
  사용하는 서식입니다. 이월할 연차 일수와 사용 기한, 기한 안에 쓰지 못한 경우의 처리 방법을
  함께 적어 두면 나중에 다툼이 줄어듭니다. 이월 가능 여부와 수당 정산 기준은 취업규칙과
  근로계약, 고용노동부 안내에 따라 달라지므로 제출 전 확인하십시오. 본 서식은 합의 내용을
  기록하는 틀이며 법률 판단을 대신하지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 근로자와 회사의 정보, 합의일을 적습니다.
  - 발생 연차와 사용한 연차, 이월할 일수를 적습니다.
  - 이월 연차의 사용 기한과 미사용 시 처리 방법을 적습니다.
  - 회사와 근로자가 각각 서명합니다.
faq:
  - q: 이월 합의를 하면 연차수당은 어떻게 되나요?
    a: 합의 내용에 따라 달라집니다. 정산 방식은 취업규칙과 고용노동부 안내를 확인하십시오.
  - q: 합의서는 누가 보관하나요?
    a: 회사와 근로자가 각각 한 부씩 보관하는 것이 좋습니다.
  - q: 이월 연차도 사용 기한을 정해야 하나요?
    a: 기한을 적어 두면 분쟁을 줄일 수 있습니다. 기한은 당사자가 합의해 정합니다.
related: [annual-leave-plan, unused-annual-leave-pay-request, leave-request, annual-leave-schedule-change-request]
blocks:
  - type: doc_title
    text: 연차 이월 합의서
    spaced: false
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["회사명", "", "대표자", ""]
      - ["부서(팀)", "", "직위", ""]
      - ["근로자 성명", "", "입사일", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "박민준"]
      - ["", "영업지원팀", "", "대리"]
      - ["", "김서연", "", "2022-03-02"]
  - type: subtitle
    text: 2. 이월 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["해당 연도", "", "발생 연차", ""]
      - ["사용 연차", "", "이월 일수", ""]
      - ["사용 기한", "", "합의일", ""]
    sample_rows:
      - ["", "2026년", "", "17일"]
      - ["", "14일", "", "3일"]
      - ["", "2027-03-31", "", "2026-10-08"]
  - type: subtitle
    text: 3. 특약
  - type: textbox
    hint: "기한 안에 쓰지 못한 경우의 처리 방법 등 합의한 내용을 적으십시오."
    height_mm: 28
    sample_text: "이월 연차는 사용 기한 안에 부서장과 협의하여 사용한다. 기한 안에 사용하지 못한 일수의 처리는 회사 취업규칙에 따른다."
  - type: para
    text: 위 내용을 회사와 근로자가 합의하였음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월    8 일
  - type: sign_line
    labels: ["회사", "근로자"]
    sample_names: [박민준, 김서연]
  - type: notice
    text: 이월 가능 여부와 수당 정산은 취업규칙과 근로계약을 확인하십시오.
