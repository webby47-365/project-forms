id: fixed-term-labor-contract
title: 근로계약서 (기간제)
category: corp
subcategory: hr
tags: [기간제 근로계약서, 계약직 근로계약서, 표준근로계약서, 단기계약, 계약서 양식]
summary: 계약기간·근무장소·업무내용·근로시간·임금 등 기간제 근로자의 필수 기재사항을 담은 근로계약서입니다.
usage: >
  계약기간을 정해 채용하는 계약직·단기 근로자와 체결하는 근로계약서입니다. 기간제 근로자에게는
  근로계약기간과 근로일별 근로시간을 서면으로 명시하고 교부해야 하므로 해당 칸을 반드시 채우십시오.
  임금은 구성항목·계산방법·지급방법을 나누어 적고, 수습기간을 두는 경우 기간과 수습 중 임금 비율을
  함께 기재합니다. 작성 후 2부를 만들어 사용자와 근로자가 각각 1부씩 보관하십시오.
  세부 적용 기준은 사업장 취업규칙과 관할 고용노동청 안내를 확인하십시오.
source: law-standard
source_note: 근로기준법 제17조 및 기간제 및 단시간근로자 보호 등에 관한 법률 제17조의 서면 명시사항을 반영했습니다.
featured: false
series: labor-contract
series_name: 근로계약서
variant: 기간제
variant_rank: 2
target_pages: 3
