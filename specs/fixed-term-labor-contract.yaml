      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "이수현", "", "1998-02-17"]
      - ["", "서울특별시 강남구 테헤란로 200", "", ""]
      - ["", "010-1234-5678", "", "suhyun.lee@example.com"]
  - type: subtitle
    text: 2. 계약기간 및 근무조건
  - type: grid
    widths: [18, 32, 18, 32]
