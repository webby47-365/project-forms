      - ["", "본사 물류센터", "", "창고 재고 관리"]
      - ["", "09 시 00 분 ~ 18 시 00 분 (휴게시간 12 시 00 분 ~ 13 시 00 분)", "", ""]
      - ["", "매주 5일 근무", "", "매주 일요일"]
      - ["", "있음(3개월)", "", "통상임금의 90%"]
  - type: subtitle
