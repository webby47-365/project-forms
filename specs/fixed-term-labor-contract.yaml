  - type: page_break
  - type: subtitle
    text: 4. 임금
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["임금 형태", "월급 / 일급 / 시급", "기본급", "금                 원"]
      - ["제수당", "", "", ""]
      - ["상여금", "있음(         원) / 없음", "임금 지급일", "매월        일"]
      - ["지급 방법", "근로자 명의 예금통장 입금 / 직접 지급", "계좌", ""]
    sample_rows:
      - ["", "월급", "", "금 2,200,000 원"]
      - ["", "식대 100,000원, 교통비 50,000원", "", ""]
      - ["", "없음", "", "매월 25일"]
      - ["", "근로자 명의 예금통장 입금", "", "한빛은행 000-000000-00-000"]
  - type: subtitle
    text: 5. 연차·사회보험·기타
  - type: kv_list
    items:
      - "연차유급휴가는 근로기준법이 정하는 바에 따라 부여한다."
      - "고용보험·산재보험·국민연금·건강보험은 법령이 정하는 바에 따라 가입한다."
      - "사용자는 근로계약 체결과 동시에 본 계약서 1부를 근로자에게 교부한다."
      - "본 계약에 정하지 않은 사항은 근로기준법 및 취업규칙에 따른다."
  - type: article
    heading: 제1조 (계약의 갱신)
    lines:
      - "계약기간 만료 시 당사자가 서면으로 합의하는 경우 계약을 갱신할 수 있다."
      - "갱신하지 않는 경우 사용자는 계약기간 만료 전 그 사실을 근로자에게 통보하도록 한다."
  - type: article
    heading: 제2조 (비밀유지 및 성실의무)
    lines:
      - "근로자는 업무상 알게 된 회사의 영업비밀을 재직 중은 물론 퇴직 후에도 누설하지 아니한다."
      - "근로자는 회사의 제규정을 준수하고 맡은 업무를 성실히 수행한다."
  - type: article
    heading: 제3조 (계약의 해지)
    lines:
      - "당사자는 법령과 취업규칙이 정하는 사유가 있는 경우 본 계약을 해지할 수 있다."
      - "근로자가 자진 퇴직하고자 할 때에는 취업규칙이 정한 기간 전에 사용자에게 통보한다."
  - type: para
    text: 위 계약 내용을 확인하고 이에 동의하여 각자 서명·날인한 후 각 1부씩 보관한다.
    align: center
    size: 10
  - type: date_line
    sample_text: 2026 년    9 월   20 일
  - type: sign_line
    labels: ["사용자", "근로자"]
    sample_names: [홍길동, 이수현]
  - type: notice
    text: 본 서식은 참고용입니다. 업종·근무형태에 따라 추가로 명시해야 할 사항이 있을 수 있으므로 관할 고용노동청 기준을 확인하십시오.
