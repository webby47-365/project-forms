    text: 기간제 근로계약서
    spaced: false
  - type: para
    text: 사업주(이하 "사용자")와 근로자는 다음과 같이 근로계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
