      - ["근무장소", "", "담당업무", ""]
      - ["소정근로시간", "    시    분 ~     시    분 (휴게시간     시    분 ~     시    분)", "", ""]
      - ["근무일 / 주휴일", "매주       일 근무", "주휴일", "매주       요일"]
      - ["수습기간", "있음(     개월) / 없음", "수습 중 임금", "통상임금의        %"]
    sample_rows:
