id: weekly-study-plan
title: 주간 학습계획표
category: edu
subcategory: school
tags: [주간학습계획표, 학습계획, 공부계획표, 주간계획, 자기주도학습]
summary: 주차별 목표와 시간대별 학습 일정, 과목별 분량을 계획하고 주간 성찰을 기록하는 학습계획표입니다.
usage: >
  한 주를 시작하기 전에 이번 주 학습 목표를 정하고 요일·시간대별로 공부할 내용을 미리
  배치해 두는 서식입니다. 과목별 학습 목표 표에는 이번 주에 끝낼 분량과 완료 여부를
  함께 적어 진도를 점검하십시오. 시간표 칸은 과목명만 간단히 적어야 한눈에 들어오며,
  주말에는 주간 성찰란에 실제 진행 상황과 다음 주 보완할 점을 적어 스스로 관리하는
  습관을 기르는 데 활용하십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

howto:
  - 이번 주 학습 목표를 먼저 정합니다.
  - 과목별로 이번 주에 끝낼 분량을 적습니다.
  - 요일·시간대별로 공부할 내용을 배치합니다.
  - 주말에 진행 상황과 다음 주 계획을 적습니다.

faq:
  - q: 시간표는 얼마나 자세히 적나요?
    a: 시간대별 칸에는 과목명만 간단히 적어야 한눈에 들어오며, 세부 내용은 따로 메모하는 것이 좋습니다.
  - q: 목표를 못 지키면 어떻게 하나요?
    a: 주간 성찰란에 실제 진행 상황을 그대로 적고, 다음 주 계획에 남은 분량을 반영해 조정하십시오.

related: [class-timetable, reading-log, daily-planner]

blocks:
  - type: doc_title
    text: 주간 학습계획표

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["주차", "", "기간", ""]
      - ["이번 주 목표", "", "", ""]
    sample_rows:
      - ["", "3주차", "", "2026-09-21 ~ 2026-09-27"]
      - ["", "수학 2단원 개념 정리", "", ""]

  - type: subtitle
    text: 1. 시간대별 학습 일정

  - type: grid
    widths: [12, 13, 13, 13, 13, 13, 13, 10]
    label_cols: [0]
    row_height_mm: 7
    rows:
      - ["시간대", "월", "화", "수", "목", "금", "토", "일"]
      - ["16~17시", "", "", "", "", "", "", ""]
      - ["17~18시", "", "", "", "", "", "", ""]
      - ["19~20시", "", "", "", "", "", "", ""]
      - ["20~21시", "", "", "", "", "", "", ""]
    sample_rows:
      - ["", "", "", "", "", "", "", ""]
      - ["", "수학", "영어", "수학", "영어", "과학", "", "국어"]
      - ["", "국어", "과학", "국어", "과학", "", "", ""]
      - ["", "영어", "", "영어", "", "독서", "", ""]
      - ["", "", "", "", "", "", "", ""]

  - type: subtitle
    text: 2. 과목별 학습 목표

  - type: table
    widths: [18, 44, 18, 20]
    header: [과목, 이번 주 목표, 분량, 완료여부]
    empty_rows: 5
    row_height_mm: 8
    sample_rows:
      - ["수학", "2단원 일차방정식 개념·연습문제", "문제집 20p", "완료"]
      - ["영어", "단원 5 단어 암기 및 독해", "단어 50개", "진행중"]
      - ["국어", "문학 작품 1편 읽고 요약", "교과서 1단원", ""]

  - type: subtitle
    text: 3. 주간 성찰

  - type: textbox
    hint: "실제 진행 상황, 어려웠던 점, 다음 주 계획을 작성하십시오."
    height_mm: 22
    sample_text: 수학 진도는 계획대로 마쳤고 영어 단어 암기가 더뎌 다음 주에 분량을 나눠 반복할 계획임.

  - type: notice
    text: 계획대로 진행되지 않은 부분은 이유를 적어 두면 다음 주 계획을 세울 때 참고할 수 있습니다.
