id: event-application
title: 참가신청서
category: public
subcategory: consent
tags: [참가신청, 신청서, 행사신청, 이벤트, 접수]
summary: 각종 행사·행동·프로그램에 참가 신청할 때 작성하는 신청서 양식입니다.
usage: >
  학교 활동, 학원 프로그램, 기업 행사, 공개 모집 이벤트, 경진대회 등에 참가 신청할 때 제출합니다.
  신청자의 기본 정보(성명, 연락처), 신청 행사명, 참가 이유나 동기를 기재합니다.
  미성년자는 보호자 동의가 필요할 수 있으므로 사전에 확인하고, 참가비가 있으면 납부 방법도 명시해야 합니다.
source: original
featured: false
target_pages: 1
howto:
  - 신청자 성명과 연락처를 적습니다.
  - 신청할 행사명을 적습니다.
  - 참가 이유나 동기를 간단히 적습니다.
  - 참가비가 있으면 납부 방법을 확인하고 제출합니다.

faq:
  - q: 미성년자도 신청할 수 있나요?
    a: 가능하지만 보호자 동의가 필요할 수 있으니 사전에 주최 측에 확인하십시오.
  - q: 참가비는 언제 내나요?
    a: 행사마다 다르므로 신청서 제출 시 안내되는 납부 방법과 기한을 따르면 됩니다.

related: [privacy-consent, guardian-consent, event-photo-consent]

blocks:
  - type: doc_title
    text: 참가신청서
    spaced: false
  - type: spacer
    height_pt: 4
  - type: subtitle
    text: 신청자 정보
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "생년월일", ""]
      - ["연락처(휴대폰)", "", "이메일", ""]
      - ["소속·직책", "", "주소", ""]
    sample_rows:
      - ["", "박민준", "", "2001-05-20"]
      - ["", "010-1234-5678", "", "minjun.park@example.com"]
      - ["", "한국대학교 경영학과", "", "서울특별시 마포구 월드컵북로 100"]
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 신청 내용
  - type: grid
    widths: [20, 80]
    label_cols: [0]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 1]
    rows:
      - ["행사명", ""]
      - ["행사 기간", ""]
      - ["참가 분야/직무", ""]
    sample_rows:
      - ["", "2026 청년 취업박람회"]
      - ["", "2026-10-05 ~ 2026-10-06"]
      - ["", "마케팅·영업 직군"]
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 참가 동기 및 특이사항
  - type: textbox
    hint: "행사 참가 이유, 관심 분야, 특별히 참고할 사항이 있으면 기재하십시오."
    height_mm: 20
    sample_text: 마케팅 직군 채용 정보를 얻고 현직자와 네트워킹하기 위해 참가를 신청합니다. 특별히 참고할 사항은 없습니다.
  - type: spacer
    height_pt: 2
  - type: subtitle
    text: 보호자 동의 (미성년자인 경우)
  - type: table
    widths: [50, 25, 25]
    header: ["동의 여부", "동의", "미동의"]
    empty_rows: 0
    row_height_mm: 8
    body_align: left
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["보호자 성명", "", "관계", ""]
      - ["보호자 연락처", "", "", ""]
  - type: spacer
    height_pt: 4
  - type: para
    text: "본인은 위 행사에 참가 신청하며, 기재 내용이 사실임을 확인합니다."
    align: center
    size: 11
    space_after: 2
  - type: date_line
    sample_text: 2026 년    9 월   25 일
  - type: spacer
    height_pt: 2
  - type: sign_line
    label: 신청자
    sample_names: [박민준]
  - type: notice
    text: 참가비 납부 기일, 필요한 서류, 유의사항은 안내문을 참고하십시오. 미성년자는 보호자 동의가 필수입니다.
