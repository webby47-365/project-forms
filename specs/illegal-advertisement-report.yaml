id: illegal-advertisement-report
title: 불법 광고물 신고서
category: public
subcategory: civil
tags: [불법광고물신고, 불법현수막, 불법전단지, 벽보신고, 옥외광고물]
summary: 허가 없이 붙은 현수막·전단·벽보 등 불법 광고물의 위치와 내용을 적어 관할 구청에 신고하는 신고서입니다.
usage: >
  길거리 전봇대나 건물 외벽에 무단으로 붙은 현수막, 전단, 벽보를 발견했을 때 관할 시·군·구청 담당 부서에
  제출하는 서식입니다. 광고물의 종류와 발견 장소, 발견 일시, 광고 내용을 구체적으로 적고 사진을 함께 첨부하면
  확인이 빨라집니다. 신고자 연락처는 처리 결과 회신용으로만 적으며, 광고물이 합법적으로 허가받은 것인지는 담당
  부서가 판단하므로 신고 전 단정하지 말고 사실만 적으십시오.
source: original
featured: false
target_pages: 1
howto:
  - 신고자 이름과 연락처, 회신 방법을 적습니다.
  - 광고물 종류와 발견 장소를 최대한 자세히 적습니다.
  - 발견 일시와 광고 내용을 적고 사진을 첨부합니다.
  - 신고 날짜를 적고 서명해 구청에 제출합니다.
faq:
  - q: 광고주 연락처가 보이면 같이 적나요?
    a: 광고물에 적힌 전화번호나 업체명이 보이면 그대로 적습니다. 판단은 담당 부서가 하므로 본 대로만 적으면 됩니다.
  - q: 어느 기관에 내야 하나요?
    a: 광고물이 붙은 곳을 관할하는 시·군·구청의 광고물 담당 부서가 일반적입니다. 도로는 도로관리청일 수 있으니 확인하십시오.
  - q: 사진은 꼭 첨부해야 하나요?
    a: 필수는 아니지만 위치와 광고 내용이 보이는 사진이 있으면 현장 확인과 처리가 훨씬 빨라집니다.
related: [noise-complaint, civil-petition, road-repair-request, illegal-dumping-report]
blocks:
  - type: doc_title
    text: 불법 광고물 신고서
    spaced: true
  - type: subtitle
    text: 1. 신고인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "연락처", ""]
      - ["회신 방법", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "문자 메시지로 처리 결과 회신 희망", "", ""]
  - type: subtitle
    text: 2. 광고물 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["광고물 종류", "", "수량", ""]
      - ["발견 장소", "", "", ""]
      - ["발견 일시", "", "광고주 연락처", ""]
      - ["광고 내용", "", "", ""]
    sample_rows:
      - ["", "현수막", "", "3개"]
      - ["", "서울시 ○○구 ○○로 12 앞 가로등 및 전봇대", "", ""]
      - ["", "2026-10-14 18:30", "", "02-000-0000"]
      - ["", "학원 신규 등록 안내 현수막", "", ""]
  - type: textbox
    hint: "광고물이 붙은 상태와 주변 상황, 첨부한 사진 설명을 적으십시오."
    height_mm: 30
    sample_text: "횡단보도 옆 가로등 2곳과 전봇대 1곳에 끈으로 묶여 있고 보행자 시야를 가립니다. 현장 사진 3장을 첨부합니다."
  - type: para
    text: 위와 같이 불법 광고물을 신고하오니 확인하여 조치해 주시기 바랍니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   15 일
  - type: sign_line
    labels: ["신고인"]
    sample_names: [홍길동]
  - type: notice
    text: 허가 여부는 관할 기관이 확인합니다. 제출처 안내를 확인하십시오.
