id: sole-source-contract-report
title: 수의계약 사유서
category: public
subcategory: procure
tags: [수의계약사유서, 수의계약품의서, 수의계약체결서, 계약방법결정서, 소액수의계약]
summary: 경쟁입찰 없이 수의계약으로 계약을 진행하려는 사유와 계약 개요를 정리해 결재를 받는 수의계약 사유서입니다.
usage: >
  공공기관·학교·공기업 등에서 경쟁입찰 대신 수의계약으로 계약을 체결하려 할 때 그 사유와
  계약 개요를 내부 결재선에 보고하기 위해 작성하는 문서입니다. 수의계약 사유는 소액계약·
  특정 자격자와의 계약·긴급한 필요 등 해당하는 항목을 구체적으로 적어야 하며, 통상 2인
  이상의 견적서를 함께 받아 가격의 적정성을 소명합니다. 수의계약이 허용되는 금액 기준과
  절차는 소속 기관의 계약 사무 규정과 관련 법령을 먼저 확인한 뒤 적용하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 계약명과 계약상대자, 계약금액·계약기간을 적습니다.
  - 수의계약으로 진행하는 사유를 해당 항목에서 확인합니다.
  - 확보한 견적서 현황을 표에 정리합니다.
  - 기안자·검토자·결재권자가 순서대로 서명합니다.

faq:
  - q: 수의계약도 견적서가 필요한가요?
    a: 대부분 2인 이상의 견적서를 받아 비교한 자료를 첨부합니다. 소속 기관의 계약 규정을 확인하십시오.
  - q: 사유가 여러 개 해당하면 어떻게 적나요?
    a: 가장 핵심적인 사유 하나를 주된 근거로 적고 나머지는 비고에 보충해서 적습니다.
  - q: 결재 순서는 정해져 있나요?
    a: 기관마다 다르므로 내부 위임전결규정에 정한 결재 순서를 따르면 됩니다.

related: [quotation-comparison, goods-purchase-contract, integrity-pledge-bidding]

blocks:
  - type: doc_title
    text: 수의계약 사유서
    spaced: true

  - type: para
    text: 아래 계약을 다음과 같은 사유로 수의계약으로 체결하고자 합니다.
    align: center
    size: 10

  - type: subtitle
    text: 계약 개요

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["계약명", "", "계약금액", ""]
      - ["계약상대자", "", "계약기간", ""]
      - ["계약방법", "수의계약", "작성부서", ""]
    sample_rows:
      - ["", "청사 소방설비 유지보수 용역", "", "금 8,000,000원 (부가세 포함)"]
      - ["", "(주)한빛설비", "", "2026-10-01 ~ 2027-09-30"]
      - ["", "", "", "총무과"]

  - type: subtitle
    text: 수의계약 사유 (해당 항목 표시)

  - type: kv_list
    items:
      - "추정가격이 소액이어서 견적 비교만으로 계약이 가능한 경우"
      - "특정인의 기술·자격·설비가 아니면 계약 목적을 달성할 수 없는 경우"
      - "긴급한 사유로 경쟁입찰에 부칠 여유가 없는 경우"
      - "기존 계약을 계속하여 이행하게 할 필요가 있는 경우"

  - type: textbox
    hint: "위 사유 중 해당 항목과 구체적인 사정을 적으십시오."
    height_mm: 20
    sample_text: 해당 설비의 유지보수는 최초 설치업체인 (주)한빛설비만 부품 호환과 이력 관리가 가능해 특정인 계약 사유에 해당함.

  - type: subtitle
    text: 견적서 확보 현황

  - type: table
    widths: [8, 30, 24, 22, 16]
    header: ["No", 업체명, 사업자번호, 견적금액, 비고]
    empty_rows: 3
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "(주)한빛설비", "000-00-00000", "8,000,000원", "선정업체"]
      - ["2", "(주)새길엔지니어링", "000-00-00000", "8,800,000원", "-"]

  - type: date_line
    sample_text: 2026 년    9 월   20 일

  - type: sign_line
    labels: ["기안자", "검토자", "결재권자"]
    sample_names: [홍길동, 김서연, 박민준]

  - type: notice
    text: 수의계약이 허용되는 사유와 금액 기준은 소속 기관의 계약 사무 규정과 관련 법령을 먼저 확인하십시오.
