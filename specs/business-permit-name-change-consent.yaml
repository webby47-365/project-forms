id: business-permit-name-change-consent
title: 영업허가(신고) 명의변경 동의서
category: public
subcategory: permit
tags: [영업허가명의변경동의서, 영업신고명의변경동의서, 영업자지위승계동의서, 인허가명의변경, 사업자지위승계]
summary: 영업양수도 후 영업허가·신고의 명의를 양수인으로 바꾸는 데 양도인이 동의함을 확인하는 명의변경 동의서입니다.
usage: >
  식당·미용실 등 인허가·신고가 필요한 업종을 인수했을 때, 영업양도양수계약과 별도로
  관할 관청에 영업자 지위승계신고를 하면서 양도인의 동의 사실을 함께 제출하기 위해
  쓰는 서류입니다. 기존 인허가번호와 양도일을 정확히 적어야 담당 부서에서 승계 대상을
  바로 확인할 수 있습니다. 업종별로 첨부서류와 신고 기한이 다르므로 관할 관청에 미리
  확인한 뒤 제출하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 양도인과 양수인의 인적사항을 적습니다.
  - 영업장 상호·소재지와 기존 인허가·신고번호를 적습니다.
  - 양도일과 명의변경 동의 범위를 확인합니다.
  - 양도인이 서명 또는 날인하고 인감증명서 등 첨부서류를 갖춥니다.

faq:
  - q: 영업양도양수계약서와 함께 내야 하나요?
    a: 계약서만으로는 승계 사실 확인이 부족해, 대부분 관할 관청이 이 동의서나 인감증명서 첨부를 함께 요구합니다.
  - q: 업종에 따라 서류가 다른가요?
    a: 식품·위생 업종 등은 시설 기준 재확인이 추가될 수 있어 관할 관청에 필요 서류를 먼저 확인하십시오.
  - q: 양도인이 연락되지 않으면 어떻게 하나요?
    a: 동의를 받지 못하면 승계신고가 지연될 수 있어, 양도양수계약 단계에서 미리 일정을 맞추는 것이 안전합니다.

related: [business-transfer-contract, gov-business-closure-report, power-of-attorney]

blocks:
  - type: doc_title
    text: 영업허가(신고) 명의변경 동의서
    spaced: false

  - type: para
    text: 양도인은 아래 영업의 허가(신고) 명의를 양수인으로 변경하는 데 동의합니다.
    align: center
    size: 10.5

  - type: subtitle
    text: 1. 양도인 / 양수인

  - type: grid
    widths: [14, 20, 14, 18, 16, 18]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["양도인", "", "생년월일", "", "연락처", ""]
      - ["양수인", "", "생년월일", "", "연락처", ""]
    sample_rows:
      - ["", "홍길동", "", "1978-04-02", "", "010-1234-5678"]
      - ["", "이수현", "", "1990-08-21", "", "010-9876-5432"]

  - type: subtitle
    text: 2. 영업장 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["상호", "", "업종", ""]
      - ["소재지", "", "", ""]
      - ["기존 인허가(신고)번호", "", "양도일", ""]
    sample_rows:
      - ["", "한빛분식", "", "일반음식점"]
      - ["", "서울특별시 마포구 월드컵북로 100 1층", "", ""]
      - ["", "제2024-000123호", "", "2026-10-05"]

  - type: subtitle
    text: 3. 동의 내용

  - type: kv_list
    items:
      - "양도인은 위 영업장의 허가(신고) 명의를 양수인으로 변경하는 데 동의한다."
      - "양도인은 명의변경 신고에 필요한 서류(인감증명서 등)를 제출하는 데 협조한다."
      - "명의변경 이후 발생하는 영업상 권리·의무는 양수인에게 귀속된다."

  - type: textbox
    hint: "그 밖에 확인이 필요한 사항이 있으면 적으십시오."
    height_mm: 18
    sample_text: 양도일 이전 발생한 위생·안전 관련 행정처분 이력이 없음을 양도인이 확인함.

  - type: para
    text: 위와 같이 명의변경에 동의하며 본 동의서를 관할 관청에 제출합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년    10 월    5 일

  - type: sign_line
    labels: ["양도인", "양수인"]
    sample_names: [홍길동, 이수현]

  - type: notice
    text: 업종별 첨부서류와 신고 기한은 관할 관청(시·군·구청) 인허가 담당 부서에 확인하십시오.
