id: gov-maternity-leave-benefit
title: 출산전후휴가 급여 등 신청서
category: public
subcategory: insurance
tags:
- 출산휴가
- 유산휴가
- 모성보호
- 고용보험급여
- 배우자출산휴가
summary: 출산 전후휴가나 유산·사산휴가, 배우자 출산휴가 급여를 신청하는 고용보험 법정 신청서입니다.
usage: '근로자가 출산 전후휴가, 유산·사산휴가, 배우자 출산휴가, 난임치료휴가를 받은 후 고용보험 급여를 신청할 때 지방고용노동관서에 제출합니다. 휴가 종료 또는 유산·사산일부터 12개월 이내에 신청해야 하며, 여러 회차에 나누어 신청하는 경우 회차별로 작성합니다. 신청인의 성명, 주민등록번호, 주소, 출산(예정)일 또는 유산·사산일을 기입하고, 신청
  기간과 급여를 받을 계좌번호를 명기합니다. 휴가 기간 중 사업주로부터 받은 임금, 조기 복직·퇴사 여부, 다른 일자리에서의 소득 등을 확인하는 항목들을 정확히 응답합니다. 첨부서류는 출산 확인서, 통상임금 확인 자료, 미숙아 또는 난임치료 진단서 등입니다. 처리기간은 14일입니다.

  '
source: law-standard
source_note: 고용보험법 시행규칙 별지 제105호서식
law_ref:
  law: 고용보험법 시행규칙
  form_no: 별지 제105호서식
  amended: '2025-02-21'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EA%B3%A0%EC%9A%A9%EB%B3%B4%ED%97%98%EB%B2%95+%EC%8B%9C%ED%96%89%EA%B7%9C%EC%B9%99&bylNo=0105&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 고용노동부
  checked: '2026-09-16'
featured: false
target_pages: 2
created_by: gov-batch
howto:
- 신청인의 성명, 주민등록번호, 주소, 연락처와 출산일을 적습니다.
- 신청 기간과 급여를 받을 계좌 정보를 명기합니다.
- 휴가 기간 중 임금 수령, 조기 복직·퇴사, 다른 소득 활동 여부를 확인 항목에 응답합니다.
- 신청인이 서명하고 출산 확인서 등 필요한 서류를 첨부하여 제출합니다.
faq:
- q: 휴가를 모두 받은 후 급여를 신청해야 하나요?
  a: 회차별(1~4회차)로 나누어 신청할 수 있습니다. 회차마다 신청 기간을 구분해 적습니다.
- q: 미숙아를 출산했으면 무엇을 더 내나요?
  a: 미숙아 여부에 "예"로 표시하고, 미숙아 출산 사실을 증명하는 의료기관 진단서 1부를 첨부합니다.
- q: 휴가 기간 중 월급을 받았는데 신청할 수 있나요?
  a: 예. 신청이 가능하지만 사업주로부터 받은 금액과 기간을 정확히 기입해야 합니다.
related:
- parental-leave-request
