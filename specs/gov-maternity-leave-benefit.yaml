      - ◎ 고용보험에서 지급하는 출산전후휴가 급여, 유산ㆍ사산휴가 급여, 배우자 출산휴가 급여 및 난임치료휴가 급여는 출 산전후휴가, 유산ㆍ사산휴가, 배우자 출산휴가 또는 난임치료휴가 종료일부터 12개월 이내에 신청해야 합니다.
    - - l
      - ※ 다만, 천재지변 등의 사유로 출산전후휴가, 유산ㆍ사산휴가, 배우자 출산휴가 또는 난임치료휴가 급여를 신 청할 수 없었던 사람은 그 사유가 끝난 후 30일 이내에 신청해야 합니다.
    - - l
      - 1. 출산전후휴가 급여등의 신청은 회차별(1, 2, 3, 4회차)로 구분하여 적습니다(단, 배우자 출산휴가 급여와 난임치료휴 가 급여는 회차를 기재하지 않습니다).
    - - l
      - 2. ④란에는 출산(예정)일 또는 유산ㆍ사산일을 적습니다.(난임치료휴가의 경우에는 ④란을 작성하지 않습니다)
    - - l
      - 3. ⑤란에는 영아의 주민등록번호를 적되, 2명 이상 출산한 경우에도 1명의 주민등록번호를 적습니다. 태아, 외국인인 경우에는 ⑤란에 111111-1111111로 적습니다.(유산ㆍ사산휴가 또는 난임치료휴가의 경우에는 ⑤란을 작성하지 않습니다)
    - - l
      - 4. ⑥란은 다태아(2명 이상) 출산한 경우 ‘[ ] 예’ 부분에 표시합니다(출산전후휴가 부여일 및 급여지급기간이 늘어납니다).
    - - l
      - 5. ⑦란은 미숙아를 출산한 경우 ‘[ ] 예’ 부분에 표시합니다(출산전후휴가 부여일 및 급여지급기간이 늘어납니다).
    - - l
      - 6. ⑧란에는 사업주로부터 부여 받은 총 휴가기간 중 이번 급여 신청에 해당하는 기간을 적습니다.
    - - l
      - 7. ⑨란에는 반드시 신청인 본인의 계좌번호를 적어야 합니다.
    - - l
      - 8. ⑩란에는 출산전후휴가 급여등을 신청하는 기간 중 사업주로부터 통상임금에 해당하는 금품을 지급받은 경우(지급 예정인 경우 포함) 그 기간과 금액을 적습니다.
    - - l
      - 9. ⑪란은 출산전후휴가, 유산ㆍ사산휴가, 배우자 출산휴가, 난임치료휴가 중 조기에 복직 또는 퇴사한 경우에만 적습니다.
    - - l
      - 10. ⑫란은 출산전후휴가, 유산ㆍ사산휴가 중 다른 사업장에서 근로소득 또는 자영업을 통한 소득이 있었던 경우에만 적습니다. 급여신청기간 중 근로소득 및 사업소득이 있었던 경우에는 해당 소득활동 기간과 소득금액을 적되, 근 로소득이 있었던 경우에는 주당 근로시간까지 적습니다(배우자 출산휴가 또는 난임치료휴가의 경우에는 ⑫란을 작성하지 않습니다).
    - - l
      - 11. ⑩란부터 ⑫란까지를 사실대로 적지 않으면 부정수급으로 결정되어 수급한 급여액을 반환해야 하고, 그 급여액의 2배에 해당하는 금액을 추징당하는 등의 불이익을 받을 수 있습니다.
    - - l
      - 12. ⑬란 작성 시 연장사유는 천재지변, 본인ㆍ배우자 또는 그 직계존속ㆍ직계비속의 질병ㆍ부상, 「병역법」에 따른 의무복무, 범죄혐의로 인한 구속 또는 형의 집행 등이 발생한 경우를 말합니다.
