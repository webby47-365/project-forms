id: year-end-rent-tax-credit-submission
title: 연말정산 월세 세액공제 자료 제출서
category: corp
subcategory: finance
tags: [연말정산, 월세, 월세세액공제, 임대차자료, 월세제출]
summary: 연말정산에서 월세 세액공제를 받으려는 근로자가 임대차 계약 내용과 월별 납부 내역을 회사에 내는 월세 세액공제 자료 제출서 양식입니다.
usage: >
  연말정산 때 월세 지출분을 공제받으려는 근로자가 임대인·주택·계약기간·월세 납부 내역을 정리해 회사 담당 부서에 내는 서식입니다.
  임대차계약서 사본과 계좌이체 내역 같은 증빙을 함께 붙이고, 월별 납부액을 표에 적습니다.
  공제를 받을 수 있는지와 한도는 소득 수준·주택 요건 등 세법 기준에 따라 달라지므로 국세청 안내와 회사 담당 부서의 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 제출자의 소속과 성명, 귀속 연도를 적습니다.
  - 임대인 이름과 주택 주소, 계약기간, 월세 금액을 적습니다.
  - 월별 납부일과 금액을 표에 한 줄씩 적습니다.
  - 임대차계약서와 이체 내역 사본을 붙여 냅니다.
faq:
  - q: 계약서 사본은 꼭 붙여야 하나요?
    a: 보통 계약 내용을 확인하려고 요구합니다. 제출 서류 범위는 회사 담당 부서 안내를 따르십시오.
  - q: 월세를 현금으로 냈으면 어떻게 하나요?
    a: 지급 사실을 보여 줄 영수증이나 이체 기록이 필요할 수 있습니다. 증빙 기준은 담당 부서와 국세청 안내를 확인하십시오.
  - q: 중간에 이사했다면 어떻게 적나요?
    a: 주택별로 서식을 나누어 적고 각각의 계약기간을 구분해 적는 편이 안전합니다.
related: [year-end-tax-checklist, monthly-rent-receipt, year-end-dependent-change-notice, prior-employer-withholding-submission]
