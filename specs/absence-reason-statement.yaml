id: absence-reason-statement
title: 지각·결근 사유서
category: corp
subcategory: hr
tags: [지각사유서, 결근사유서, 근태사유서, 조퇴사유서, 근태]
summary: 지각·조퇴·결근이 생겼을 때 일시와 사유, 사후 조치를 적어 상급자에게 내는 지각·결근 사유서 양식입니다.
usage: >
  출근 시각을 넘겼거나 조퇴·결근을 한 뒤 회사에 사유를 알리는 문서입니다. 근태 구분(지각·조퇴·결근)을 고르고
  해당 일시와 사유를 사실대로 적은 다음 앞으로의 조치를 한두 줄 덧붙입니다. 병원 진료확인서 등 증빙이 있으면
  첨부 여부만 표시하고, 진단명과 같은 건강 정보는 적지 않습니다. 인정 여부와 처리 방식은 회사 규정에 따르므로
  제출처 기준을 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 근태 구분과 해당 날짜, 시각을 적습니다.
  - 사유를 사실대로 간단히 적습니다.
  - 증빙이 있으면 첨부 여부에 표시합니다.
  - 앞으로의 조치를 적고 서명해 상급자에게 냅니다.
faq:
  - q: 사유서에 진단명까지 적어야 하나요?
    a: 아닙니다. 건강 정보는 적지 않고 "몸이 좋지 않아 진료를 받았다" 정도로 쓰고 증빙은 따로 냅니다.
  - q: 미리 알린 결근도 사유서가 필요한가요?
    a: 회사마다 다릅니다. 휴가 신청으로 처리되는 경우도 있으니 인사 담당자에게 확인하십시오.
  - q: 지각이 반복되면 어떻게 적나요?
    a: 날짜별로 한 장씩 쓰는 것이 원칙이며, 같은 사유라도 일시는 따로 적어야 합니다.
related: [leave-request, attendance-sheet, written-apology, disciplinary-notice]
blocks:
  - type: doc_title
    text: 지각·결근 사유서
    spaced: false
  - type: subtitle
    text: 1. 작성자 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["소속", "", "직위", ""]
      - ["성명", "", "작성일", ""]
    sample_rows:
      - ["", "영업지원팀", "", "대리"]
      - ["", "김서연", "", "2026-10-14"]
  - type: subtitle
    text: 2. 근태 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["근태 구분", "", "", ""]
      - ["해당 일시", "", "", ""]
      - ["증빙 첨부", "", "", ""]
    sample_rows:
      - ["", "[√] 지각  [ ] 조퇴  [ ] 결근", "", ""]
      - ["", "2026-10-13 09:00 출근 예정 → 09:40 도착", "", ""]
      - ["", "[ ] 있음  [√] 없음", "", ""]
  - type: subtitle
    text: 3. 사유
  - type: textbox
    hint: "근태가 생긴 경위를 사실대로 적으십시오. 건강 정보는 자세히 쓰지 않아도 됩니다."
    height_mm: 34
    sample_text: "출근길 지하철 운행이 지연되어 평소보다 40분 늦게 도착했습니다. 지연 안내 문자를 받은 즉시 팀장님께 전화로 알렸습니다."
  - type: subtitle
    text: 4. 앞으로의 조치
  - type: textbox
    hint: "같은 일이 생기지 않도록 할 방법을 적으십시오."
    height_mm: 22
    sample_text: "앞으로는 지연이 예상되면 출발 전에 대체 경로를 확인하고 더 일찍 출발하겠습니다."
  - type: date_line
    sample_text: 2026 년    10 월    14 일
  - type: sign_line
    labels: ["작성자", "확인자"]
    sample_names: [김서연, 박민준]
  - type: notice
    text: 근태 인정 여부와 처리 방식은 회사 규정에 따릅니다. 제출처 기준을 확인하십시오.
