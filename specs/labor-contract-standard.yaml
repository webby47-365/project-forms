id: labor-contract-standard
title: 표준근로계약서 (기간의 정함이 없는 경우)
category: corp
subcategory: hr
tags: [표준근로계약서, 근로계약서, 고용계약서, 정규직 근로계약, 근로기준법]
summary: 근로기준법 제17조의 필수 명시사항을 모두 담은 정규직(기간의 정함이 없는) 표준근로계약서입니다.
usage: >
  근로자를 채용하면 반드시 서면으로 작성하여 1부를 근로자에게 교부해야 하며, 미교부 시
  과태료가 부과됩니다. 임금은 구성항목·계산방법·지급방법을 모두 적어야 하고, 소정근로시간과
  휴게시간을 명확히 기재해야 합니다. 기간제·단시간 근로자는 계약기간과 근로일별 근로시간을
  추가로 명시해야 하므로 해당 전용 서식을 사용하십시오.
source: law-standard
source_note: 근로기준법 제17조 및 고용노동부 표준근로계약서 양식을 참고하여 자체 제작
featured: true
featured_rank: 7
series: labor-contract
series_name: 근로계약서
variant: 표준
variant_rank: 1
target_pages: 2
variant_use: 정규직처럼 계약기간을 정하지 않을 때 씁니다.

howto:
  - 근로자와 사용자의 인적사항을 적습니다.
  - 근무 장소와 담당 업무를 적습니다.
  - 소정근로시간과 휴게시간을 적습니다.
  - 임금 구성항목과 계산·지급방법을 적습니다.
  - 양측이 서명하고 계약서 1부를 교부합니다.

faq:
  - q: 근로자에게 꼭 1부를 줘야 하나요?
    a: 네, 서면으로 작성해 근로자에게 교부해야 하며, 주지 않으면 과태료가 부과될 수 있습니다.
  - q: 기간제 근로자도 이 서식을 쓰나요?
    a: 아니요, 기간제·단시간 근로자는 계약기간과 근로일별 근로시간을 담은 전용 서식을 써야 합니다.

related: [employee-roster, payslip, job-description, employment-certificate]

blocks:
  - type: doc_title
    text: 표준근로계약서
    spaced: false
  - type: para
    text: 아래 당사자는 다음과 같이 근로계약을 체결하고 이를 성실히 이행할 것을 약정한다.
    align: center
    size: 10
  - type: subtitle
    text: 계약 당사자
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [4, 1, 4, 3]
    rows:
      - ["사업체명", "", "대표자", ""]
      - ["소재지", "", "", ""]
      - ["연락처", "", "사업자등록번호", ""]
      - ["근로자 성명", "", "생년월일", ""]
      - ["근로자 주소", "", "", ""]
      - ["연락처", "", "이메일", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "박민준"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "02-1234-5678", "", "000-00-00000"]
      - ["", "홍길동", "", "1998-02-17"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", "gildong@example.com"]
  - type: article
    heading: 제1조 (근로계약기간)
    lines:
      - "근로개시일은 20    년    월    일로 하고, 근로계약기간은 기간의 정함을 두지 않는다."
      - "수습기간은 근로개시일부터      개월로 하며, 수습기간 중 임금은 통상임금의      %로 한다. (수습기간을 두지 않는 경우 기재 생략)"
  - type: article
    heading: 제2조 (근무장소 및 업무내용)
    lines:
      - "근무장소 :"
      - "업무내용 :"
      - "사업주는 업무상 필요에 따라 근로자의 동의를 얻어 근무장소 또는 업무내용을 변경할 수 있다."
  - type: article
    heading: 제3조 (소정근로시간 및 휴게시간)
    lines:
      - "소정근로시간은 1일      시간, 1주      시간으로 하며, 시작시각은      시      분, 종료시각은      시      분으로 한다."
      - "휴게시간은 근로시간 중      시      분부터      시      분까지로 한다."
      - "연장·야간·휴일근로는 근로자의 동의를 받아 실시하며, 1주 12시간을 초과하지 않는다."
  - type: article
    heading: 제4조 (근무일 및 주휴일)
    lines:
      - "근무일은 매주      일(      요일 ~      요일)로 하고, 주휴일은 매주      요일로 한다."
  - type: subtitle
    text: 제5조 (임금)
  - type: grid
    widths: [22, 28, 22, 28]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["기본급(월/일/시간)", "", "상여금", ""]
      - ["연장근로수당", "", "야간근로수당", ""]
      - ["휴일근로수당", "", "기타 수당", ""]
      - ["임금 지급일", "매월(매주)     일", "지급방법", "근로자 명의 예금계좌 입금"]
    sample_rows:
      - ["", "월 2,500,000원", "", "해당없음"]
      - ["", "시급의 150%", "", "시급의 150%"]
      - ["", "시급의 150%", "", "식대 100,000원"]
      - ["", "매월 25일", "", ""]
  - type: kv_list
    items:
      - "임금은 근로자에게 직접 지급하며, 근로자가 동의한 경우 본인 명의 예금계좌로 입금한다."
      - "지급일이 휴일인 경우 그 전일에 지급한다."
  - type: article
    heading: 제6조 (연차유급휴가)
    lines:
      - "연차유급휴가는 근로기준법이 정하는 바에 따라 부여한다."
  - type: article
    heading: 제7조 (사회보험 적용)
    lines:
      - "고용보험, 산재보험, 국민연금, 건강보험에 모두 가입한다. (해당 없는 항목은 삭선 처리)"
  - type: article
    heading: 제8조 (근로계약서 교부)
    lines:
      - "사업주는 본 근로계약을 체결함과 동시에 본 계약서 1부를 근로자에게 교부한다."
  - type: article
    heading: 제9조 (기타)
    lines:
      - "본 계약에 정하지 않은 사항은 근로기준법 및 취업규칙에 따른다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["사업주", "(서명 또는 인)", "근로자", "(서명 또는 인)"]
  - type: notice
    text: 기간제·단시간 근로자는 계약기간과 근로일별 근로시간을 반드시 별도로 명시해야 하며, 연소근로자(18세 미만)는 친권자 동의서와 가족관계증명서가 필요합니다.
