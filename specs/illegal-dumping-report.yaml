id: illegal-dumping-report
title: 불법투기 신고서
category: public
subcategory: civil
tags: [불법투기신고서, 쓰레기불법투기, 무단투기신고, 폐기물투기신고, 환경민원]
summary: 생활폐기물 등의 불법 투기 현장을 관할 지자체에 신고하는 서식입니다.
usage: >
  쓰레기나 폐기물을 허가 없이 무단으로 버린 현장을 발견했을 때 관할 지자체 환경관리부서에
  신고하는 서식입니다. 발생 장소와 일시, 투기된 폐기물의 종류와 수량을 구체적으로 적고,
  차량번호나 인적 정보가 확인된 경우에만 기재합니다. 현장과 폐기물 상태를 보여주는 사진을
  함께 제출하면 처리에 도움이 되며, 신고포상금 지급 여부와 기준은 지자체 조례에 따라
  다릅니다.
source: original
featured: false
created_by: agent
status: published
version: 1
target_pages: 1

howto:
  - 발생 장소와 일시를 적습니다.
  - 투기된 폐기물의 종류와 수량을 적습니다.
  - 확인된 경우에만 차량번호를 적습니다.
  - 현장 사진을 첨부합니다.
  - 신고인 연락처를 적고 제출합니다.

faq:
  - q: 신고자 정보를 꼭 밝혀야 하나요?
    a: 처리 결과 안내가 필요하면 연락처를 적고, 비공개를 원하면 담당 부서에 문의하십시오.
  - q: 신고포상금은 항상 받을 수 있나요?
    a: 아니요, 지급 여부와 기준은 지자체 조례에 따라 다르므로 관할 부서에 확인해야 합니다.

related: [civil-petition, noise-complaint, road-repair-request]

