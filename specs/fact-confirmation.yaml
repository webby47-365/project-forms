id: fact-confirmation
title: 사실확인서
category: legal
subcategory: notice
tags: [사실확인서, 사실인정, 확인서, 사실증명, 재해증명]
summary: 특정 사실의 존재 여부를 당사자들이 공동으로 확인하는 사실확인서 양식입니다.
usage: >
  계약 이행 여부, 금전 거래 사실, 재해나 사건 발생 등의 사실을 문서로 남기고 싶을 때
  당사자들이 함께 작성합니다. 사실확인서는 법적 분쟁 시 증거로 활용될 수 있으므로
  가능한 한 구체적이고 정확하게 기재해야 합니다. 향후 분쟁을 방지하려면 확인하는
  사실의 범위를 명확히 하고 양 당사자가 모두 서명하는 것이 중요합니다.
  본 서식은 참고용이며 법적 효력과 적합성은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 1
howto:
  - 일방 당사자와 타방 당사자의 인적사항을 적습니다.
  - 확인하려는 사실을 육하원칙에 따라 구체적으로 적습니다.
  - 사실의 범위와 시점을 명확히 기재합니다.
  - 작성일을 적고 양 당사자가 서명합니다.

faq:
  - q: 한쪽만 서명해도 효력이 있나요?
    a: 사실확인서는 양 당사자가 함께 서명해야 증거력이 높아집니다.
  - q: 나중에 내용을 수정할 수 있나요?
    a: 이미 서명한 문서는 임의로 고칠 수 없으니 새로 작성해 다시 서명받으십시오.

related: [statement-of-facts, settlement-agreement, certified-notice]

blocks:
  - type: doc_title
    text: 사실확인서
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["일방당사자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["타방당사자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "홍길동", "", "1985-03-15"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "김서연", "", "1990-07-22"]
      - ["", "", "서울특별시 강남구 테헤란로 200", "", "010-2345-6789"]
  - type: subtitle
    text: 확인 내용
  - type: textbox
    hint: "확인하는 사실(계약 이행, 금전 거래, 서비스 제공, 물품 인수 등)의 구체적 내용과 일시·장소를 명확하게 기재하십시오."
    height_mm: 38
    sample_text: 2026년 8월 20일, 일방당사자 홍길동은 타방당사자 김서연에게 중고 노트북 1대를 매매대금 800,000원에 판매하였고, 김서연은 당일 현금으로 대금 전액을 지급하였음을 상호 확인한다.
  - type: article
    heading: 제1조 (사실의 확인)
    lines:
      - "당사자들은 위 사실이 사실임을 공동으로 확인한다."
  - type: article
    heading: 제2조 (효력)
    lines:
      - "본 확인서는 위 사실에 관한 증거로 사용될 수 있으며, 당사자들은 추후 동일 사실을 부인할 수 없다."
  - type: date_line
    sample_text: 2026 년    8 월   20 일
  - type: sign_line
    labels: ["일방당사자", "타방당사자"]
    sample_names: [홍길동, 김서연]
  - type: notice
    text: 사실확인서는 법적 분쟁에서 중요한 증거가 될 수 있으므로 확인 내용을 매우 신중하게 기재하시기 바랍니다. 서명 후 추후 부인할 수 없습니다.
