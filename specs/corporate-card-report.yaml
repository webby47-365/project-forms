id: corporate-card-report
title: 법인카드 사용내역서
category: corp
subcategory: finance
tags: [법인카드 사용내역서, 법인카드 정산, 카드 사용보고, 접대비 정산, 경비 증빙]
summary: 법인카드 사용일자·가맹점·금액과 사용목적을 항목별로 정리해 결재를 받는 내역서입니다.
usage: >
  월 단위 또는 사용 건별로 법인카드 지출을 정리해 보고하는 서식입니다. 사용일자와 가맹점명,
  금액은 카드사 명세서와 일치해야 하며, 사용목적은 업무 관련성이 드러나도록 구체적으로 적으십시오.
  식대나 접대성 지출은 참석자 수와 대상을 함께 기재해야 증빙이 인정되기 쉽습니다. 계정과목을
  미리 분류해 두면 회계 처리가 빨라집니다. 영수증은 순번과 맞추어 첨부하고, 사적 사용분이 있으면
  반납 예정액에 표시하십시오. 증빙 요건은 사내 경비규정과 세무 기준을 확인하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 법인카드 사용내역서
    spaced: false
  - type: grid
    widths: [16, 22, 14, 20, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["소속(부서)", "", "직위", "", "성명", ""]
      - ["카드번호(끝 4자리)", "", "사용월", "", "작성일자", ""]
  - type: subtitle
    text: 1. 사용 내역
  - type: table
    widths: [7, 12, 20, 13, 12, 22, 14]
    header: ["No", 사용일자, 가맹점명, 금액, 계정과목, 사용목적, 비고]
    empty_rows: 8
    row_height_mm: 7
    body_align: center
  - type: subtitle
    text: 2. 집계
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["사용 건수", "         건", "사용 합계", ""]
      - ["업무 사용액", "", "반납 예정액(사적 사용)", ""]
  - type: textbox
    hint: "특이사항 — 접대성 지출의 참석자·대상, 증빙 누락 사유 등을 기재하십시오."
    height_mm: 20
  - type: para
    text: 위 사용내역이 사실과 다름이 없음을 확인하며 정산을 요청합니다.
    align: center
    size: 10.5
  - type: date_line
  - type: sign_line
    label: 사용자
  - type: subtitle
    text: 결재
  - type: grid
    widths: [16, 21, 21, 21, 21]
    label_cols: [0]
    row_height_mm: 15
    rows:
      - ["결재", "담당", "팀장", "임원", "대표"]
      - ["", "", "", "", ""]
  - type: notice
    text: 영수증은 순번에 맞추어 첨부하고, 증빙 요건은 사내 경비규정과 세무 기준을 확인하십시오.
