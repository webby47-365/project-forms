id: corporate-card-report
title: 법인카드 사용내역서
category: corp
subcategory: finance
tags: [법인카드 사용내역서, 법인카드 정산, 카드 사용보고, 접대비 정산, 경비 증빙]
summary: 법인카드 사용일자·가맹점·금액과 사용목적을 항목별로 정리해 결재를 받는 내역서입니다.
usage: >
  월 단위 또는 사용 건별로 법인카드 지출을 정리해 보고하는 서식입니다. 사용일자와 가맹점명,
  금액은 카드사 명세서와 일치해야 하며, 사용목적은 업무 관련성이 드러나도록 구체적으로 적으십시오.
  식대나 접대성 지출은 참석자 수와 대상을 함께 기재해야 증빙이 인정되기 쉽습니다. 계정과목을
  미리 분류해 두면 회계 처리가 빨라집니다. 영수증은 순번과 맞추어 첨부하고, 사적 사용분이 있으면
  반납 예정액에 표시하십시오. 증빙 요건은 사내 경비규정과 세무 기준을 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 소속·직위·성명과 카드번호 뒤 4자리를 적습니다.
  - 사용일자별로 가맹점명과 금액을 기재합니다.
  - 사용목적과 계정과목을 항목별로 구분해 적습니다.
  - 영수증을 순번에 맞춰 첨부합니다.
  - 작성 후 결재선에 따라 제출합니다.

faq:
  - q: 사적 사용분이 섞였으면 어떻게 하나요?
    a: 반납 예정액 칸에 금액을 적고 회사 규정에 따라 반환 절차를 진행하십시오.
  - q: 식대는 참석자를 다 적어야 하나요?
    a: 접대성 지출은 참석자 수와 대상을 함께 적어야 증빙으로 인정되기 쉽습니다.

blocks:
  - type: doc_title
    text: 법인카드 사용내역서
    spaced: false
  - type: grid
    widths: [16, 22, 14, 20, 14, 14]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["소속(부서)", "", "직위", "", "성명", ""]
      - ["카드번호(끝 4자리)", "", "사용월", "", "작성일자", ""]
    sample_rows:
      - ["", "영업팀", "", "대리", "", "김서연"]
