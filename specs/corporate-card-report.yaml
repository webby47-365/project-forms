      - ["3", "2026-08-10", "한빛호텔", "280,000", "접대비", "거래처 미팅 식사", "참석 4명"]
      - ["4", "2026-08-18", "KTX", "88,000", "여비교통비", "지방 출장 이동", "-"]
      - ["5", "2026-08-22", "(주)한빛커머스", "223,500", "광고비", "온라인 광고 집행", "-"]
