tags: [사직서, 간편사직서, 퇴사서류, 사표, 사직서 양식]
summary: 인적사항과 사직 사유 한 줄, 사직 희망일만 간단히 적는 반 페이지 분량의 사직서입니다.
usage: >
  긴 사유 설명 없이 빠르게 제출하는 간단한 사직서입니다. 소속·성명 등 인적사항을 적고
  사직 사유는 한 줄로 간략히 밝힌 뒤 사직을 희망하는 날짜를 기재합니다. 인수인계나
  퇴직금 정산 등 상세 절차가 필요한 경우에는 퇴직원 서식을 사용하는 것이 더 적합합니다.
  제출 전 사본을 보관하고 사직일자는 회사와 사전에 협의하십시오.
