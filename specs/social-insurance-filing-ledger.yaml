id: social-insurance-filing-ledger
title: 4대보험 취득·상실 신고 접수 대장
category: public
subcategory: insurance
tags: [4대보험, 취득신고, 상실신고, 신고 대장, 사회보험]
summary: 직원의 4대보험 취득·상실 신고 내역과 접수 상태를 한 곳에 기록해 두는 관리 대장입니다.
usage: >
  입사자와 퇴사자가 생길 때마다 4대보험 신고를 했는지, 언제 접수됐는지 놓치지 않으려고 쓰는 사내
  관리 대장입니다. 직원 이름과 취득·상실 구분, 사유 발생일, 신고일, 접수 확인 여부를 한 줄씩 적습니다.
  신고 기한은 보험별로 다르니 각 공단의 안내를 확인하십시오. 주민등록번호는 적지 않고 사번이나 생년월일만
  적습니다.
source: original
featured: false
target_pages: 1
howto:
  - 대장 기간과 작성 담당자를 적습니다.
  - 입사·퇴사가 생기면 직원 이름과 구분을 한 줄에 적습니다.
  - 사유 발생일과 신고일을 적고 접수 여부를 표시합니다.
  - 월말에 빠진 신고가 없는지 확인하고 서명합니다.
faq:
  - q: 주민등록번호를 적어야 하나요?
    a: 이 대장에는 적지 않습니다. 사번이나 생년월일로 직원을 구분하십시오.
  - q: 신고 기한은 며칠인가요?
    a: 보험별로 다릅니다. 국민연금·건강보험·고용·산재 각 공단의 안내를 확인하십시오.
  - q: 월마다 새로 만들어야 하나요?
    a: 기간을 달리해 월별이나 분기별로 새로 작성하면 관리하기 쉽습니다.
related: [social-insurance-filing-poa, insurance-enrollment-confirmation-request, social-insurance-correction-request, labor-contract-standard]
blocks:
  - type: doc_title
    text: 4대보험 취득·상실 신고 접수 대장
    spaced: false
  - type: subtitle
    text: 1. 대장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["사업장명", "", "기간", ""]
      - ["작성 담당자", "", "연락처", ""]
    sample_rows:
      - ["", "(주)새길데이터", "", "2026-11-01 ~ 11-30"]
      - ["", "김서연", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 신고 접수 내역
  - type: table
    widths: [5, 11, 10, 8, 18, 18, 12, 18]
    header: ["No", 직원명, 사번, 구분, 사유 발생일, 신고일, 접수 확인, 비고]
    empty_rows: 9
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "박민준", "A-1024", "취득", "11-03", "11-04", "접수", ""]
      - ["2", "이수현", "A-0871", "상실", "11-14", "11-17", "접수", "퇴사"]
      - ["3", "홍길동", "A-1031", "취득", "11-17", "", "미신고", "확인 필요"]
  - type: subtitle
    text: 3. 월말 점검
  - type: textbox
    hint: "빠진 신고나 보완이 필요한 내용을 적으십시오."
    height_mm: 16
    sample_text: "홍길동 취득 신고가 남아 있어 다음 영업일에 접수할 예정입니다."
  - type: sign_line
    labels: ["작성자", "확인자"]
    sample_names: [김서연, 박민준]
  - type: notice
    text: 신고 기한과 방법은 각 공단의 안내를 확인하십시오.
