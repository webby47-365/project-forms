      - ["포트폴리오 링크", "", "", ""]
      - ["지원 직무", "", "제출처", ""]
    sample_rows:
      - ["", "김서연", "", "한국대학교"]
      - ["", "010-1234-5678", "", "seoyeon.kim@example.com"]
      - ["", "portfolio.example.com/seoyeon", "", ""]
      - ["", "브랜드 디자이너", "", "(주)한빛커머스"]
