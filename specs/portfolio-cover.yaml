id: portfolio-cover
title: 포트폴리오 표지
category: personal
subcategory: career
tags: [포트폴리오 표지, 포트폴리오 커버, 작품집 표지, 제출용 표지, 포트폴리오 양식]
summary: 포트폴리오 제목과 작성자 정보, 수록 작품 목록을 정리해 첫 장에 두는 표지 서식입니다.
usage: >
  취업이나 입시, 제안용 포트폴리오의 첫 장에 붙이는 표지입니다. 제목은 어떤 분야의 작업물인지
  드러나게 짓고, 지원 직무나 제출처를 함께 적어 용도를 분명히 하십시오. 수록 작품 목록에 순번과
  작품명·제작기간·역할을 적어 두면 읽는 사람이 원하는 작업을 바로 찾을 수 있습니다. 연락처와
  포트폴리오 링크는 오탈자가 없는지 꼭 확인하고, 공동 작업물은 본인의 기여 범위를 표시하십시오.
  비공개 자료가 포함된 경우 열람 제한 안내를 함께 적는 것이 좋습니다.
source: original
featured: false
target_pages: 1

howto:
  - 포트폴리오 제목과 부제를 적습니다.
  - 지원 분야나 제출처를 적습니다.
  - 수록 작품 목록에 순번과 작품명, 제작기간을 적습니다.
  - 공동 작업물은 본인의 기여 범위를 표시합니다.
  - 연락처와 링크에 오탈자가 없는지 확인합니다.

faq:
  - q: 비공개 자료가 있으면 어떻게 하나요?
    a: 열람 제한 안내 문구를 표지에 함께 적어두는 것이 좋습니다.
  - q: 공동 작업물은 어떻게 표시하나요?
    a: 작품 목록에 본인이 맡은 역할과 기여 범위를 구체적으로 적어야 합니다.

related: [resume-basic, cover-letter, career-description, job-application-form]

blocks:
  - type: doc_title
    text: 포트폴리오
  - type: spacer
    height_pt: 10
  - type: grid
    widths: [22, 78]
    label_cols: [0]
    row_height_mm: 12
    rows:
      - ["제목", ""]
      - ["부제", ""]
      - ["분야", ""]
    sample_rows:
      - ["", "브랜드 아이덴티티 디자인 작업"]
      - ["", "2024-2026 작업 모음"]
      - ["", "브랜드·그래픽 디자인"]
  - type: spacer
