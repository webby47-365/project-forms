id: seal-certificate-poa
title: 인감증명 발급 위임장
category: public
subcategory: civil
tags: [인감증명 위임장, 인감증명서 대리발급, 위임장 양식, 인감 발급 위임, 대리인 위임장]
summary: 인감증명서 발급을 대리인에게 맡기기 위해 위임 내용과 용도를 기재하는 위임장입니다.
usage: >
  본인이 직접 방문하기 어려울 때 인감증명서 발급을 다른 사람에게 맡기는 서류입니다. 위임인과
  대리인의 인적사항을 정확히 적고, 위임인의 인감을 날인해야 합니다. 발급 용도와 통수를 구체적으로
  적어 위임 범위를 한정하는 것이 안전하며, 부동산 매도용처럼 용도가 특정된 경우 상대방 정보가
  필요할 수 있습니다. 위임 기간을 정해 두면 남용을 막을 수 있습니다. 인감증명서는 재산 처분에
  쓰일 수 있는 중요한 서류이므로 신뢰할 수 있는 사람에게만 위임하고, 필요 서류와 절차는 관할
  주민센터 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 위임인의 인적사항을 적고 인감을 날인합니다.
  - 대리인의 인적사항을 정확히 적습니다.
  - 발급 용도와 필요한 통수를 적습니다.
  - 위임 기간을 정해 적습니다.
  - 대리인이 위임장을 지참해 주민센터를 방문합니다.

faq:
  - q: 위임 기간을 정하지 않으면 어떻게 되나요?
    a: 기간을 정해 두지 않으면 남용될 위험이 있으므로 목적에 맞는 기간을 적어 두는 것이 안전합니다.
  - q: 부동산 매도용은 무엇이 다른가요?
    a: 용도가 특정된 경우 상대방 정보가 추가로 필요할 수 있어 미리 확인해야 합니다.

related: [power-of-attorney, resident-registration-request, delegation-revocation, real-estate-sale-contract]

blocks:
  - type: doc_title
    text: 위임장
  - type: para
    text: 본인은 아래 사람을 대리인으로 정하여 인감증명서 발급에 관한 권한을 위임합니다.
    align: center
    size: 10.5
  - type: subtitle
    text: 1. 위임인 (본인)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "인감 날인", "(인감)"]
    sample_rows:
      - ["", "홍길동", "", "1975-02-10"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "010-1234-5678", "", ""]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "위임인과의 관계", ""]
    sample_rows:
      - ["", "박민준", "", "1988-11-02"]
      - ["", "서울특별시 마포구 월드컵북로 120", "", ""]
      - ["", "010-9876-5432", "", "동생"]
  - type: subtitle
    text: 3. 위임 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [2, 1, 2, 3]
    rows:
      - ["발급 서류", "인감증명서", "통수", "        통"]
      - ["사용 용도", "", "", ""]
      - ["용도 관련 상대방 (해당 시)", "", "", ""]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일", "위임 범위", "발급 신청 및 수령"]
    sample_rows:
      - ["", "", "", "2통"]
      - ["", "부동산 매도 계약 체결용", "", ""]
      - ["", "", "", ""]
      - ["", "2026년 9월 13일 ~ 2026년 12월 13일", "", ""]
  - type: kv_list
    items:
      - "대리인은 위임 범위를 넘어 인감증명서를 사용하거나 제3자에게 교부하지 않습니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."
  - type: textbox
    hint: "특기사항 — 발급 제한 조건이나 추가 위임 사항이 있으면 기재하십시오."
    height_mm: 18
    sample_text: 발급 즉시 매도 계약 체결 용도로만 사용하며, 용도 외 재발급은 요청하지 않습니다.
  - type: para
    text: 위 위임 내용은 본인의 의사에 따른 것임을 확인합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 박민준]
  - type: notice
    text: 인감증명서는 재산 처분에 사용될 수 있는 중요한 서류입니다. 필요 서류와 대리 발급 절차는 관할 주민센터 안내를 확인하십시오.
