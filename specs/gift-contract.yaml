id: gift-contract
title: 증여계약서
category: personal
subcategory: life
tags: [증여계약서, 증여서, 재산증여, 증여증서, gift contract]
summary: 증여자와 수증자가 재산을 무상으로 넘기는 내용과 인도 방법·해제 사유를 정하는 증여계약서입니다.
usage: >
  부동산·예금·동산 등 재산을 가족이나 지인에게 무상으로 넘길 때 증여자와 수증자의
  합의 내용을 남기기 위해 작성합니다. 증여할 재산의 종류와 수량·금액을 구체적으로
  적고, 인도 시기와 방법, 부담부 증여 여부를 명확히 기재합니다. 증여일이 속하는 달의
  말일부터 3개월 이내에 수증자가 증여세를 신고해야 하므로 세액과 공제 여부는 반드시
  관할 세무서나 세무대리인에게 확인한 뒤 신고 기한을 넘기지 않도록 하십시오.
source: original
featured: false
version: 1
created_by: agent
status: published
target_pages: 1

howto:
  - 증여자와 수증자 정보를 적습니다.
  - 증여할 재산의 종류와 수량·금액을 적습니다.
  - 인도 시기와 방법을 적습니다.
  - 부담부 증여 여부와 조건을 적습니다.
  - 양쪽이 서명·날인하고 증여세 신고를 준비합니다.

faq:
  - q: 증여세는 언제까지 신고해야 하나요?
    a: 증여일이 속한 달의 말일부터 3개월 이내에 수증자가 신고해야 합니다.
  - q: 부담부 증여는 무엇인가요?
    a: 대출금 등 채무를 함께 넘기는 증여를 말하며, 채무 부분은 증여세 계산에서 별도로 취급됩니다.

blocks:
  - type: doc_title
    text: 증여계약서

  - type: para
    text: 증여자와 수증자는 아래와 같이 증여계약을 체결한다.
    align: center
    size: 10

  - type: subtitle
    text: 당사자

  - type: grid
    widths: [16, 21, 17, 21, 25]
    label_cols: [0, 1, 3]
    row_height_mm: 8
    rows:
      - ["증여자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "관계", ""]
      - ["수증자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "관계", ""]
    sample_rows:
      - ["", "", "홍길동", "", "1958-02-20"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "부"]
      - ["", "", "홍서연", "", "1990-06-11"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "자녀"]

  - type: subtitle
    text: 증여 재산의 표시

  - type: table
    widths: [20, 34, 26, 20]
    header: [재산 종류, "소재지 또는 내역", "수량·금액", 비고]
    empty_rows: 4
    row_height_mm: 8
    sample_rows:
      - ["예금", "한빛은행 000-000000-00-000", "15,000,000원", "일괄 이전"]
      - ["동산", "○○ 브랜드 승용차 1대", "1대", "차량등록 이전 예정"]

  - type: article
    heading: 제1조 (증여의 의사)
    lines:
      - "증여자는 위 재산을 수증자에게 무상으로 증여할 것을 약정하고, 수증자는 이를 수락한다."

  - type: article
    heading: 제2조 (인도 시기와 방법)
    lines:
      - "증여자는 20        년        월        일까지 위 재산을 수증자에게 인도하거나 필요한 권리이전 절차(명의변경, 계좌이체 등)를 완료한다."

  - type: article
    heading: 제3조 (부담부 증여 여부)
    lines:
      - "본 증여에 수증자가 부담할 채무나 조건이 있는 경우 다음과 같이 정하며, 없는 경우 해당 없음으로 한다. (해당 없음 / 부담 내용:                    )"

  - type: article
    heading: 제4조 (증여자의 담보책임)
    lines:
      - "증여자는 증여한 재산에 하자가 있음을 알고 수증자에게 고지하지 않은 경우를 제외하고 그 하자에 대하여 책임을 지지 않는다."

  - type: article
    heading: 제5조 (해제 사유)
    lines:
      - "수증자가 증여자 또는 그 가까운 친족에게 범죄행위를 하거나 부양의무를 이행하지 않는 경우 증여자는 증여를 해제할 수 있다."

  - type: notice
    text: 증여일이 속하는 달의 말일부터 3개월 이내에 수증자가 증여세를 신고·납부하여야 하며, 세액과 공제 여부는 관할 세무서 또는 세무대리인에게 확인하십시오.

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: sign_line
    labels: ["증여자", "수증자"]
    sample_names: [홍길동, 홍서연]
