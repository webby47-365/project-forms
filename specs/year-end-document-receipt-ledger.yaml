id: year-end-document-receipt-ledger
title: 연말정산 서류 접수 대장
category: corp
subcategory: finance
tags: [연말정산접수대장, 연말정산서류, 공제서류접수, 연말정산담당자, 서류수합]
summary: 직원들이 낸 연말정산 공제 증빙 서류를 제출일·제출자·서류 종류별로 기록하고 누락을 확인하는 접수 대장 양식입니다.
usage: >
  연말정산 담당자가 직원별로 공제 증빙 서류를 받을 때마다 한 줄씩 적어 두는 대장입니다.
  제출일, 제출자의 성명과 부서, 받은 서류 종류와 매수, 접수자를 적고 보완이 필요하면 비고에 남깁니다.
  마감 뒤에는 미제출자와 보완 요청 대상을 한눈에 골라낼 수 있습니다.
  서류는 연말정산 목적 외에 쓰지 않도록 보관·파기 기준을 회사 방침에 맞추십시오.
source: original
featured: false
target_pages: 1
howto:
  - 대장 위쪽에 정산 연도와 담당자를 적습니다.
  - 서류를 받는 즉시 제출일과 제출자를 적습니다.
  - 받은 서류 종류와 매수를 적고 접수자가 확인합니다.
  - 보완이 필요한 서류는 비고에 사유를 남깁니다.
faq:
  - q: 서류 사본을 따로 보관해야 하나요?
    a: 보관 기간과 방법은 회사 방침과 관련 규정에 따릅니다. 필요 이상으로 오래 두지 않는 것이 좋습니다.
  - q: 간소화 자료는 어떻게 적나요?
    a: 제출 형태(출력본·파일)를 서류 종류 칸에 함께 적어 두면 나중에 찾기 쉽습니다.
  - q: 늦게 낸 서류는 어떻게 하나요?
    a: 제출일 그대로 적고 비고에 "마감 후 제출"이라고 남겨 처리 기준을 확인합니다.
related: [year-end-tax-checklist, year-end-correction-request, year-end-simplified-data-consent, document-register]
blocks:
  - type: doc_title
    text: 연말정산 서류 접수 대장
    spaced: false
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["정산 연도", "", "담당자", ""]
      - ["접수 기간", "", "소속 부서", ""]
    sample_rows:
      - ["", "2026년 귀속", "", "박민준"]
      - ["", "2026-11-24 ~ 2026-12-12", "", "경영지원팀"]
  - type: subtitle
    text: 1. 접수 내역
  - type: table
    widths: [6, 14, 16, 28, 8, 14, 14]
    header: ["No", 제출일, 제출자, 서류 종류, 매수, 접수자, 비고]
    empty_rows: 11
    row_height_mm: 8
    sample_rows:
      - ["1", "2026-11-24", "홍길동", "의료비 지출 내역", "2", "박민준", ""]
      - ["2", "2026-11-25", "김서연", "기부금 영수증", "1", "박민준", "원본 확인"]
      - ["3", "2026-11-26", "이수현", "전 근무지 원천징수영수증", "1", "박민준", "보완 요청"]
  - type: textbox
    hint: "미제출자·보완 요청 현황 등 마감 후 확인 사항을 적으십시오."
    height_mm: 18
    sample_text: "마감일 기준 미제출자 2명에게 안내 메일을 보냈으며, 보완 요청 1건은 다음 주 수요일까지 회신받기로 했습니다."
  - type: sign_line
    label: 담당자
    sample_names: [박민준]
  - type: notice
    text: 접수한 서류는 연말정산 목적으로만 쓰고 회사 보관·파기 기준을 확인하십시오.
