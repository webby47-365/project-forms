id: contract-performance-deposit-refund-request
title: 계약이행보증금 반환 청구서
category: public
subcategory: procure
tags: [계약이행보증금반환, 이행보증금반환청구, 계약보증금반환, 보증금반환청구서, 계약이행완료]
summary: 계약을 모두 이행한 업체가 발주기관에 맡긴 계약이행보증금의 반환을 청구하는 서식입니다.
usage: >
  공사·용역·물품 계약을 마친 업체가 계약 체결 때 낸 이행보증금을 돌려달라고 발주기관에 청구하는
  서식입니다. 계약명, 계약번호, 계약일과 완료일, 보증금액, 보증 방법과 환급받을 계좌를 적습니다.
  준공·검수 확인서 등 첨부 서류와 청구 시기는 발주기관 규정마다 다르므로 계약 담당자에게 확인하십시오.
  계좌번호는 자리만 표시한 예시이며 실제 값은 직접 적습니다.
source: original
featured: false
target_pages: 1
howto:
  - 발주기관, 계약명, 계약번호를 적습니다.
  - 계약일, 이행 완료일과 보증금액, 보증 방법을 적습니다.
  - 반환받을 계좌와 첨부 서류를 적습니다.
  - 청구일을 적고 서명 또는 날인하여 제출합니다.
faq:
  - q: 보증금은 계약이 끝나면 바로 돌려받나요?
    a: 준공·검수 확인 등 발주기관 절차를 거친 뒤 반환됩니다. 시기는 계약 조건과 기관 규정을 확인하십시오.
  - q: 보증서로 낸 경우에도 쓰나요?
    a: 보증 방법을 보증서로 표시하고, 보증서 반환이나 해지 절차는 발급 기관과 발주기관에 문의하십시오.
  - q: 어떤 서류를 첨부하나요?
    a: 준공계, 검수 확인서, 통장 사본 등을 요구하는 경우가 많습니다. 계약 담당자의 안내를 따르십시오.
related: [bid-deposit-refund-request, bid-guarantee-pledge, goods-purchase-contract, bid-performance-certificate]
