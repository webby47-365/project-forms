id: business-self-inspection-checklist
title: 영업장 자체 점검표
category: public
subcategory: permit
tags: [영업장점검, 자체점검, 위생점검, 영업시설, 점검표]
summary: 영업자가 영업장의 시설·위생·서류 상태를 스스로 점검하고 조치 내용을 남기는 자체 점검표입니다.
usage: >
  식당·카페·매장처럼 신고 또는 허가를 받아 영업하는 곳에서 점검을 앞두거나 정기적으로 상태를 확인할 때
  쓰는 서식입니다. 점검 항목별로 이상 여부를 표시하고, 미비한 곳은 조치 계획과 완료일을 적습니다. 실제
  점검 기준은 업종과 관할 기관 안내에 따르므로 이 표는 스스로 확인하기 위한 기록용으로 쓰십시오.
  기관 제출용 법정 서식이 아닙니다.
source: original
featured: false
target_pages: 1
howto:
  - 영업장 이름과 점검일, 점검자를 적습니다.
  - 항목마다 양호·미흡 중 하나를 표시합니다.
  - 미흡한 항목은 조치 내용과 완료 예정일을 적습니다.
  - 점검자가 서명하고 일정 기간 보관합니다.
faq:
  - q: 이 점검표를 기관에 제출하나요?
    a: 제출 서식이 아니라 자체 기록용입니다. 제출이 필요한지는 관할 기관 안내를 확인하십시오.
  - q: 얼마나 자주 점검하나요?
    a: 정해진 주기는 업종마다 다릅니다. 월 1회처럼 스스로 정해 꾸준히 기록하는 방식이 무난합니다.
  - q: 항목을 더 추가해도 되나요?
    a: 네, 업종 특성에 맞는 항목을 아래 빈 줄에 추가해 쓰십시오.
related: [business-facility-improvement-confirmation, business-license-reissue-request, business-closure-confirmation, business-premises-area-change-confirmation]
blocks:
  - type: doc_title
    text: 영업장 자체 점검표
    spaced: false
  - type: subtitle
    text: 1. 점검 개요
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["영업장명", "", "업종", ""]
      - ["점검일", "", "점검자", ""]
    sample_rows:
      - ["", "한빛식당", "", "일반음식점"]
      - ["", "2026-11-14", "", "박민준"]
  - type: subtitle
    text: 2. 점검 항목
  - type: table
    widths: [8, 36, 12, 12, 32]
    header: ["No", 점검 항목, 양호, 미흡, 조치 내용·완료 예정일]
    empty_rows: 9
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "영업신고(허가)증 게시", "○", "", ""]
      - ["2", "조리·작업 공간 청결", "○", "", ""]
      - ["3", "냉장·냉동 설비 온도", "", "○", "온도계 교체 / 11-20"]
      - ["4", "소화기·비상구 상태", "○", "", ""]
      - ["5", "종사자 보건 서류 보관", "○", "", ""]
  - type: subtitle
    text: 3. 종합 의견
  - type: textbox
    hint: "미흡 사항의 후속 조치와 다음 점검 계획을 적으십시오."
    height_mm: 20
    sample_text: "온도계를 교체하고 다음 점검에서 재확인한다."
  - type: date_line
    sample_text: 2026 년   11 월   14 일
  - type: sign_line
    label: 점검자
    sample_names: [박민준]
  - type: notice
    text: 업종별 점검 기준은 관할 기관 안내를 확인하십시오.
