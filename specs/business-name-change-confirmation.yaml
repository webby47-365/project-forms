id: business-name-change-confirmation
title: 영업 상호 변경 사실 확인서
category: public
subcategory: permit
tags: [상호변경, 영업상호, 상호변경확인서, 영업신고, 간판상호]
summary: 영업장의 상호가 바뀐 사실과 변경 전후 상호·변경일을 확인해 제출처에 내는 영업 상호 변경 사실 확인서 양식입니다.
usage: >
  식당·가게·사업장의 상호를 바꾼 뒤 관청·거래처·금융기관에 변경 사실을 알릴 때 쓰는 서식입니다.
  변경 전 상호와 변경 후 상호, 변경일, 영업장 주소와 대표자 정보를 적고 서명합니다.
  영업 신고 사항의 변경은 별도 신고 절차가 있을 수 있으므로 관할 기관 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 영업장 주소와 대표자 성명을 적습니다.
  - 변경 전 상호와 변경 후 상호를 적습니다.
  - 상호를 바꾼 날짜와 사유를 적습니다.
  - 제출처와 날짜를 적고 서명합니다.
faq:
  - q: 이 확인서로 상호 변경 신고가 끝나나요?
    a: 아닙니다. 관청 신고나 사업자등록 정정은 별도 절차입니다. 관할 기관 안내를 확인하십시오.
  - q: 변경일은 간판을 바꾼 날인가요?
    a: 실제로 새 상호를 쓰기 시작한 날을 적는 것이 일반적입니다. 제출처 기준이 있으면 그에 따릅니다.
related: [business-license-reissue-request, business-representative-change-confirmation, business-report-agent-poa, business-premises-area-change-confirmation]
blocks:
  - type: doc_title
    text: 영업 상호 변경 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 영업장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
    rows:
      - ["영업장 주소", "", "", ""]
      - ["대표자", "", "연락처", ""]
    sample_rows:
      - ["", "서울특별시 중구 세종대로 000", "", ""]
      - ["", "박민준", "", "010-1234-5678"]
  - type: subtitle
    text: 2. 상호 변경 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["변경 전 상호", "", "변경 후 상호", ""]
      - ["변경일", "", "제출처", ""]
    sample_rows:
      - ["", "한빛식당", "", "새길한식당"]
      - ["", "2026-11-01", "", "중구청 위생과"]
  - type: textbox
    hint: "상호를 바꾼 사유와 함께 첨부하는 서류(간판 사진 등)를 적으십시오."
    height_mm: 24
    sample_text: "대표자 변경 없이 브랜드명을 바꾸었으며 간판 교체 사진을 첨부합니다."
  - type: para
    text: 위와 같이 영업 상호가 변경되었음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   23 일
  - type: sign_line
    label: 대표자
    sample_names: [박민준]
  - type: notice
    text: 영업 신고 사항 변경은 관할 기관의 별도 절차를 확인하십시오.
