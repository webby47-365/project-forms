id: business-closure-poa
title: 폐업 신고 대리 위임장
category: public
subcategory: tax
tags: [폐업신고위임장, 폐업위임장, 사업자폐업대리, 휴폐업신고위임, 폐업신고대리]
summary: 사업자 폐업 신고를 세무사·가족 등 대리인에게 맡길 때 위임 범위와 기간을 적는 위임장입니다.
usage: >
  사업을 접으면서 폐업 신고를 직접 하기 어려워 세무대리인이나 가족에게 맡길 때 쓰는 위임장입니다.
  위임인(사업자)과 대리인 정보, 폐업 예정일, 위임 범위를 적고 위임인이 서명 또는 날인합니다.
  법정 폐업 신고서는 별도로 작성하며 이 서식은 대리 권한만 증명합니다. 접수처가 요구하는
  첨부 서류는 안내를 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 위임인의 상호와 사업자 정보를 적습니다.
  - 대리인의 성명과 연락처를 적습니다.
  - 폐업 예정일과 위임할 범위를 표시합니다.
  - 날짜를 적고 위임인이 서명 또는 날인합니다.
faq:
  - q: 폐업 신고서도 이 위임장에 같이 적나요?
    a: 아닙니다. 신고서는 별도 서식으로 작성하고, 위임장에는 대리 권한과 범위만 적습니다.
  - q: 세무사 사무소에 맡기면 위임장이 필요한가요?
    a: 대리인 확인을 위해 요구할 수 있습니다. 맡기는 곳의 안내를 먼저 확인하십시오.
  - q: 위임 범위에 무엇을 넣나요?
    a: 신고서 작성·제출, 부속 서류 수령 등 맡길 일만 표시하고 나머지는 비워 둡니다.
related: [gov-business-closure-report, business-registration-poa, vat-filing-poa, income-tax-filing-poa]
blocks:
  - type: doc_title
    text: 폐업 신고 대리 위임장
    spaced: false
  - type: para
    text: 본인은 아래 대리인에게 사업자 폐업 신고에 관한 권한을 위임합니다.
    align: center
  - type: subtitle
    text: 1. 위임인 (사업자)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["대표자", "", "연락처", ""]
      - ["상호", "", "사업자등록번호", ""]
      - ["사업장 주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "한빛상회", "", "000-00-00000"]
      - ["", "서울특별시 마포구 월드컵북로 50 1층", "", ""]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["성명", "", "연락처", ""]
      - ["소속", "", "위임인과의 관계", ""]
    sample_rows:
      - ["", "이수현", "", "010-4567-8901"]
      - ["", "새길세무회계", "", "세무대리인"]
  - type: subtitle
    text: 3. 위임 내용
  - type: grid
    widths: [18, 82]
    label_cols: [0]
    row_height_mm: 9
    rows:
      - ["폐업 예정일", "20   년  월  일"]
      - ["위임 사항", "(   ) 신고서 작성·제출   (   ) 부속 서류 수령   (   ) 결과 수령"]
      - ["위임 기간", "20   년  월  일 ~ 20   년  월  일"]
    sample_rows:
      - ["", "2026-10-31"]
      - ["", "( ✓ ) 신고서 작성·제출   ( ✓ ) 부속 서류 수령   ( ✓ ) 결과 수령"]
      - ["", "2026-10-01 ~ 2026-11-30"]
  - type: kv_list
    items:
      - "대리인은 위임받은 범위 안에서만 폐업 신고 관련 서류를 사용합니다."
      - "위임 기간이 끝나면 본 위임장의 효력은 소멸합니다."
  - type: date_line
    sample_text: 2026 년   10 월    1 일
  - type: sign_line
    labels: ["위임인", "대리인"]
    sample_names: [홍길동, 이수현]
  - type: notice
    text: 폐업 신고서와 첨부 서류는 접수처 안내를 확인하십시오.
