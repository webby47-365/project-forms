id: field-trip-application
title: 교외체험학습 신청서
category: edu
subcategory: school
tags: [교외체험학습신청서, 가정학습신청서, 현장체험학습신청서, 체험학습계획서, 교외체험학습허가원]
summary: 가족여행·친인척 방문 등으로 학교 밖에서 체험학습을 하는 동안 출석 인정을 신청하는 서식입니다.
usage: >
  학생이 가정 사정이나 여행 등으로 등교하지 못하는 기간에 학교 밖 체험학습으로 출석을
  인정받으려 할 때 사전에 제출하는 신청서입니다. 체험학습의 종류와 기간, 목적지, 학습계획을
  구체적으로 적어야 담임교사가 승인 여부를 판단할 수 있습니다. 허용 일수와 제출 기한,
  복귀 후 결과보고서 제출 여부는 학교마다 다르므로 학사일정이나 가정통신문을 확인하십시오.
source: original
featured: false
target_pages: 1

howto:
  - 체험학습 종류와 기간, 목적지를 적습니다.
  - 학습계획을 구체적으로 적습니다.
  - 보호자 서약 사항을 확인하고 서명합니다.
  - 담임교사에게 제출해 사전 승인을 받습니다.

faq:
  - q: 신청은 며칠 전에 해야 하나요?
    a: 학교마다 기준이 다르므로 학사일정이나 가정통신문의 제출 기한을 확인하십시오.
  - q: 허용 일수를 넘기면 어떻게 되나요?
    a: 초과한 일수는 결석으로 처리될 수 있어 담임교사와 미리 상담하는 것이 안전합니다.
  - q: 복귀한 뒤 결과보고서도 내야 하나요?
    a: 대부분 학교가 복귀 후 결과보고서 제출을 요구하므로 학교 안내를 확인하십시오.

related: [guardian-consent, field-trip-consent, attendance-sheet]

blocks:
  - type: doc_title
    text: 교외체험학습 신청서
    spaced: false

  - type: subtitle
    text: 1. 학생 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["학교/학년-반-번호", "", "성명", ""]
      - ["생년월일", "", "보호자 연락처", ""]
    sample_rows:
      - ["", "한빛초등학교 4-2-11", "", "이수현"]
      - ["", "2016-05-03", "", "010-1234-5678"]

  - type: subtitle
    text: 2. 체험학습 정보

  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["체험학습 종류", "가정학습 / 친인척 방문 / 현장체험 / 기타", "", ""]
      - ["기간", "20   년  월  일 ~ 20   년  월  일 (   일간)", "", ""]
      - ["목적지", "", "동반자", ""]
      - ["신청 사유", "", "", ""]
    sample_rows:
      - ["", "가정학습(가족여행)", "", ""]
      - ["", "2026년 9월 28일 ~ 2026년 9월 30일 (3일간)", "", ""]
      - ["", "강원도 강릉시", "", "부모"]
      - ["", "가족 여행을 통한 견문 확대", "", ""]

  - type: subtitle
    text: 3. 학습계획

  - type: textbox
    hint: "체험학습 기간 중 실제로 할 활동과 학습 내용을 구체적으로 적으십시오."
    height_mm: 24
    sample_text: 오죽헌·경포호 일대를 방문해 지역 역사와 자연환경을 조사하고, 매일 활동 내용을 사진과 함께 학습일지로 정리한다.

  - type: subtitle
    text: 4. 보호자 서약

  - type: kv_list
    items:
      - "체험학습 기간 중 학생의 안전 관리는 보호자가 책임집니다."
      - "학교의 안내에 따라 정해진 기한 안에 결과보고서를 제출하겠습니다."

  - type: date_line
    sample_text: 2026 년    9 월   18 일

  - type: sign_line
    label: 보호자
    sample_names: [박민준]

  - type: spacer
    height_pt: 4

  - type: para
    text: ○○학교장 귀하
    align: center
    size: 11

  - type: subtitle
    text: 5. 학교 확인

  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["담임 의견", "", "학교장 승인", ""]
    sample_rows:
      - ["", "이상 없음", "", "승인"]

  - type: notice
    text: 신청 기한·허용 일수·결과보고서 제출 여부는 학교 학사일정과 가정통신문 안내를 확인하십시오.
