id: depreciation-schedule
title: 감가상각 내역서
category: corp
subcategory: finance
tags: [감가상각내역서, 감가상각표, 고정자산관리, 상각비계산, depreciation]
summary: 고정자산별 취득가액과 당기상각비·누계액·장부가액을 정리하는 감가상각 내역서입니다.
usage: >
  회계연도별로 고정자산의 감가상각 현황을 정리해 결산에 반영하기 위한 문서입니다.
  자산별로 취득가액, 내용연수, 상각방법을 적고 당기상각비와 감가상각누계액을 누적해
  장부가액을 계산합니다. 장부가액은 취득가액에서 감가상각누계액을 뺀 값과 일치해야
  하며, 상각방법 변경이나 세무상 처리 기준은 회계팀 또는 세무대리인에게 확인하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
blocks:
  - type: doc_title
    text: 감가상각 내역서
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["회계연도", "", "작성부서", ""]
      - ["작성자", "", "작성일자", ""]
    sample_rows:
      - ["", "2026년", "", "재무회계팀"]
      - ["", "박민준", "", "2026-09-13"]
  - type: subtitle
    text: 자산 현황
  - type: table
    widths: [14, 10, 14, 8, 10, 14, 16, 14]
    header: [자산명, 취득일, 취득가액, 내용연수, 상각방법, 당기상각비, "감가상각누계액", 장부가액]
    empty_rows: 10
    row_height_mm: 7.5
    body_align: center
    sample_rows:
      - ["업무용 차량", "2022-03-15", "35,000,000", "5년", "정액법", "7,000,000", "21,000,000", "14,000,000"]
      - ["사무용 복합기", "2023-07-01", "3,000,000", "5년", "정액법", "600,000", "1,500,000", "1,500,000"]
      - ["노트북 15대", "2024-01-10", "15,000,000", "4년", "정액법", "3,750,000", "7,125,000", "7,875,000"]
      - ["사무실 인테리어", "2021-09-01", "40,000,000", "5년", "정액법", "8,000,000", "40,000,000", "0"]
  - type: grid
    widths: [25, 25, 25, 25]
