    row_height_mm: 8
    rows:
      - ["취득가액 합계", "", "당기상각비 합계", ""]
      - ["감가상각누계액 합계", "", "장부가액 합계", ""]
    sample_rows:
      - ["", "93,000,000", "", "19,350,000"]
      - ["", "69,625,000", "", "23,375,000"]
  - type: date_line
