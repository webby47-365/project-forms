    labels: ["작성자", "검토자"]
    sample_names: [박민준, 김서연]
  - type: notice
    text: 장부가액은 취득가액에서 감가상각누계액을 차감한 값과 일치해야 하며, 세무상 처리 기준은 세무대리인에게 확인하십시오.
