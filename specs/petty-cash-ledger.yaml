id: petty-cash-ledger
title: 소액현금 출납장
category: corp
subcategory: finance
tags: [소액현금출납장, 현금출납부, 소액현금관리, 가지급금관리, petty-cash]
summary: 부서에서 보관하는 소액현금의 수입·지출 내역을 일자별로 기록하는 출납장입니다.
usage: >
  부서 운영에 필요한 소액 경비를 현금으로 지급·수령할 때 거래를 일자순으로 기록하는
  서식입니다. 전기이월액에서 시작해 수입과 지출을 반영하며 매 거래 후 잔액을 즉시
  갱신하고, 증빙번호에는 영수증이나 지출결의서 번호를 적어 추적이 가능하게 합니다.
  월말에는 합계와 차기이월액을 계산해 출납담당과 책임자가 함께 확인·서명합니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
