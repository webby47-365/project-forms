id: corporate-seal-report-poa
title: 법인인감 신고 위임장
category: corp
subcategory: startup
tags: [법인인감신고위임장, 법인인감신고, 인감신고대리, 등기소위임, 대표이사위임장]
summary: 법인 대표이사가 법인인감 신고 절차를 직원이나 대리인에게 맡길 때 쓰는 위임장 양식입니다.
usage: >
  법인인감을 새로 신고하거나 바꿀 때 대표이사가 직접 등기소에 가기 어려운 경우 대리인에게
  절차를 맡기는 서식입니다. 법인 정보와 대리인 정보, 위임하는 내용과 신고할 인감의 종류를 적고
  대표이사가 서명 또는 날인합니다. 필요한 첨부서류와 본인 확인 방식은 관할 등기소 안내에 따라
  달라질 수 있으므로 방문 전에 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 법인명과 본점 주소, 대표이사 이름을 적습니다.
  - 대리인의 성명과 연락처를 적습니다.
  - 위임할 내용과 신고 사유를 적습니다.
  - 대표이사가 서명 또는 날인합니다.
faq:
  - q: 직원이 대신 신고할 수 있나요?
    a: 위임장이 있으면 대리가 가능한 경우가 많습니다. 필요 서류는 관할 등기소 안내를 확인하십시오.
  - q: 위임장에 어떤 도장을 찍나요?
    a: 신고하려는 인감과 같은 도장을 쓰는지 등 방식은 등기소 안내를 확인하십시오.
  - q: 위임 기간을 적어야 하나요?
    a: 위임 범위를 분명히 하려면 기간을 적어 두는 편이 좋습니다.
related: [seal-usage-log, power-of-attorney, business-registration-poa, shareholder-meeting-minutes]
blocks:
  - type: doc_title
    text: 법인인감 신고 위임장
    spaced: false
  - type: subtitle
    text: 1. 위임하는 법인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["법인명", "", "대표이사", ""]
      - ["본점 주소", "", "", ""]
      - ["법인등록번호", "", "연락처", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "홍길동"]
      - ["", "서울시 마포구 예시로 1", "", ""]
      - ["", "000000-0000000", "", "02-1234-5678"]
  - type: subtitle
    text: 2. 대리인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["성명", "", "직위", ""]
      - ["연락처", "", "생년월일", ""]
    sample_rows:
      - ["", "김서연", "", "총무팀 과장"]
      - ["", "010-1234-5678", "", "1988-05-20"]
  - type: subtitle
    text: 3. 위임 내용
  - type: textbox
    hint: "위임할 업무와 신고 사유, 위임 기간을 적으십시오."
    height_mm: 34
    sample_text: "법인인감 신고(변경) 절차 전반을 위임합니다. 위임 기간은 2026-10-13부터 2026-10-31까지입니다."
  - type: para
    text: 위 사람을 대리인으로 정하고 법인인감 신고에 관한 권한을 위임합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   13 일
  - type: sign_line
    labels: ["위임인(대표이사)", "대리인"]
    sample_names: [홍길동, 김서연]
  - type: para
    text: "○○등기소 귀중"
    align: center
  - type: notice
    text: 첨부서류와 본인 확인 방식은 관할 등기소 안내를 확인하십시오.
