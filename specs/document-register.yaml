id: document-register
title: 문서 수발대장
category: corp
subcategory: admin
version: 1
created_by: agent
status: published
tags: [문서수발대장, 문서관리대장, 수발문서, 공문관리, document register]
summary: 부서에서 주고받은 공문·서류를 일자별로 기록해 문서의 발신·수신 현황을 관리하는 대장입니다.
usage: >
  부서 간 또는 외부와 주고받는 공문·서류를 빠짐없이 기록하기 위한 대장입니다. 수신과
  발신을 구분하여 문서번호와 제목, 발신처·수신처, 담당자를 적고 처리결과까지 남겨
  분실이나 처리 지연을 막습니다. 문서는 접수·발송 즉시 기록하고, 보존기간이 지난
  문서는 규정에 따라 폐기 여부를 결정하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 문서 수발대장
    spaced: true

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["관리부서", "", "작성일자", ""]
    sample_rows:
      - ["", "총무팀", "", "2026-09-13"]

  - type: subtitle
    text: 수발 현황

  - type: table
    widths: [5, 11, 10, 14, 24, 16, 10, 10]
    header: ["No", 일자, "구분(수신/발신)", 문서번호, 제목, "발신처/수신처", 담당자, 처리결과]
    empty_rows: 13
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2026-09-01", "수신", "한빛-2026-091", "3분기 협력사 계약서", "㈜한빛물산", "김서연", "계약팀 전달"]
      - ["2", "2026-09-03", "발신", "총무-2026-045", "사내 공지문 발송", "전 부서", "박민준", "발송 완료"]
      - ["3", "2026-09-05", "수신", "새길-2026-112", "견적서 제출 요청", "㈜새길데이터", "이수현", "검토 중"]
      - ["4", "2026-09-08", "발신", "총무-2026-046", "행사 초청장 발송", "협력업체 일괄", "홍길동", "발송 완료"]

  - type: notice
    text: 수발 문서는 발생 즉시 기록하고, 보존기간이 지난 문서는 규정에 따라 폐기 여부를 결정하십시오.
