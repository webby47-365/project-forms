id: club-activity-record
title: 동아리 활동 기록부
category: edu
subcategory: school
tags: [동아리활동기록부, 동아리일지, 동아리보고서, 창체동아리, 동아리활동보고]
summary: 동아리 개요와 부원 명단, 회차별 활동 일지, 성과와 지도교사 의견을 정리하는 기록부입니다.
usage: >
  학기 초 동아리 개요와 부원 명단을 먼저 정리한 뒤, 매 모임마다 활동 일지에 일자와 활동
  내용, 참여 인원을 기록해 누적 관리하는 서식입니다. 활동 일지는 모임 직후 간단히 적어
  두면 학기말 성과 정리가 쉬워집니다. 주요 성과란에는 대회 참가나 발표 같은 눈에 보이는
  결과를 적고, 지도교사 의견에는 관찰한 활동 태도와 발전 사항을 간결하게 기재하십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

howto:
  - 학기 초 동아리 개요와 부원 명단을 적습니다.
  - 모임마다 활동 일지에 일자와 내용을 기록합니다.
  - 참여 인원과 주요 성과를 함께 남깁니다.
  - 학기말에 지도교사 의견을 받아 마무리합니다.

faq:
  - q: 매 모임마다 꼭 작성해야 하나요?
    a: 모임 직후 간단히 기록해 두어야 나중에 성과 정리를 할 때 빠짐없이 반영할 수 있습니다.
  - q: 사진 자료도 첨부하나요?
    a: 필수는 아니지만, 활동 사진을 함께 보관하면 발표나 생활기록부 작성에 참고 자료로 쓰기 좋습니다.

blocks:
  - type: doc_title
    text: 동아리 활동 기록부

  - type: subtitle
    text: 1. 동아리 개요

  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["동아리명", "", "지도교사", ""]
      - ["활동 분야", "", "구성 인원", ""]
      - ["활동 기간", "", "", ""]
    sample_rows:
      - ["", "과학탐구반", "", "김서연"]
      - ["", "과학실험·탐구", "", "12명"]
      - ["", "2026-03-02 ~ 2027-02-28", "", ""]

  - type: subtitle
    text: 2. 부원 명단

  - type: table
    widths: [10, 24, 26, 40]
    header: ["No", 학년반, 성명, 역할]
    empty_rows: 6
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2학년 3반", "홍길동", "부장"]
      - ["2", "2학년 5반", "이수현", "서기"]
      - ["3", "2학년 1반", "박민준", "부원"]

  - type: subtitle
    text: 3. 활동 일지

  - type: table
    widths: [14, 38, 14, 16, 18]
    header: [일자, 활동 내용, 참여 인원, 장소, 비고]
    empty_rows: 8
    row_height_mm: 8
    sample_rows:
      - ["2026-04-03", "태양광 전지 모형 제작 실험", "12명", "과학실", "-"]
      - ["2026-05-08", "교내 과학 탐구대회 출품작 준비", "10명", "과학실", ""]
      - ["2026-06-12", "탐구 결과 발표 및 토의", "11명", "과학실", ""]

  - type: subtitle
    text: 4. 주요 성과

  - type: textbox
    hint: "대회 참가, 발표, 전시 등 눈에 보이는 활동 성과를 기재하십시오."
    height_mm: 20
    sample_text: 교내 과학 탐구대회에서 태양광 전지 모형으로 우수상을 수상하고 학교 축제에서 전시함.

  - type: subtitle
    text: 5. 지도교사 의견

  - type: textbox
    hint: "관찰한 활동 태도와 성장한 부분을 간결하게 기재하십시오."
    height_mm: 20
    sample_text: 부원들이 역할을 나누어 협력하며 실험 과정을 꾸준히 기록하는 태도가 돋보임.

  - type: notice
    text: 활동 일지는 모임 직후 작성해 두면 학기말 정리와 생활기록부 작성 자료로 활용하기 좋습니다.
