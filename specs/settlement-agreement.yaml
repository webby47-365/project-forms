id: settlement-agreement
title: 합의서
category: legal
subcategory: notice
tags: [합의서, 분쟁합의, 분쟁해결, 합의금, 민사합의]
summary: 분쟁당사자 간 분쟁의 해결 내용과 조건을 정하는 합의서 양식입니다.
usage: >
  민사 분쟁이나 금전 문제, 계약 해지 등을 당사자 간 합의로 해결할 때 작성합니다.
  분쟁의 구체적 내용, 합의 조건, 지급액이나 이행 방법을 명확히 기재해야 나중에
  재분쟁을 막을 수 있습니다. 합의 체결 후에도 일방이 이행하지 않으면 강제집행을
  신청할 수 있으므로 양 당사자가 모두 서명하고 인감을 날인하는 것이 안전합니다.
  본 서식은 참고용이며 법적 효력과 적합성은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 1
howto:
  - 양 당사자의 인적사항을 적습니다.
  - 분쟁의 구체적 내용을 정리합니다.
  - 합의 조건과 지급액, 이행 방법을 적습니다.
  - 양 당사자가 서명하고 날인합니다.

faq:
  - q: 합의서에 서명하면 다시 소송할 수 없나요?
    a: 합의에 포함된 사항은 원칙적으로 다시 다투기 어려우므로 조건을 꼼꼼히 확인해야 합니다.
  - q: 상대방이 합의금을 주지 않으면 어떻게 하나요?
    a: 공증을 받아두면 별도 소송 없이 강제집행을 신청할 수 있어 이행을 확보하기 유리합니다.

related: [payment-pledge, repayment-plan, quitclaim-letter, written-pledge]

blocks:
  - type: doc_title
    text: 합의서
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["일방당사자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["타방당사자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "홍길동", "", "1990-05-20"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "박민준", "", "1988-11-02"]
      - ["", "", "서울특별시 마포구 월드컵북로 120", "", "010-9876-5432"]
  - type: subtitle
    text: 분쟁 내용 및 합의 조건
  - type: textbox
    hint: "분쟁의 원인이 된 사건, 당사자 간의 분쟁 내용, 분쟁 해결 조건(금전 지급, 물품 인수, 이용 제한 등)을 상세히 기재하십시오."
    height_mm: 35
    sample_text: 일방당사자는 2026년 5월 10일 타방당사자에게 사무용 가구 500만원 상당을 판매하였으나 타방당사자가 대금 일부를 지급하지 못한 상태입니다. 양 당사자는 협의를 통해 타방당사자가 2026년 10월 말까지 미지급 대금 300만원을 분할하여 지급하고, 이로써 위 거래에 관한 모든 분쟁을 종결하기로 합의합니다.
  - type: article
    heading: 제1조 (분쟁의 해결)
    lines:
      - "당사자들은 위 분쟁 내용에 관하여 합의하며, 본 합의서에 정한 조건에 따라 분쟁을 종료한다."
  - type: article
    heading: 제2조 (기밀유지)
    lines:
      - "당사자들은 본 합의 내용을 제3자에게 공개하지 않기로 합의한다."
  - type: article
    heading: 제3조 (재분쟁 금지)
    lines:
      - "당사자들은 본 합의로 모든 분쟁이 완전히 해결되었음을 확인하며, 추후 동일 사건으로 재분쟁을 제기하지 않기로 합의한다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["일방당사자", "타방당사자"]
    sample_names: [홍길동, 박민준]
  - type: notice
    text: 양 당사자가 모두 서명한 후 인감으로 날인하면 강제집행 대상이 될 수 있으므로 신중하게 체결하십시오.
