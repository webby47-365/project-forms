id: settlement-agreement
title: 합의서
category: legal
subcategory: notice
tags: [합의서, 분쟁합의, 분쟁해결, 합의금, 민사합의]
summary: 분쟁당사자 간 분쟁의 해결 내용과 조건을 정하는 합의서 양식입니다.
usage: >
  민사 분쟁이나 금전 문제, 계약 해지 등을 당사자 간 합의로 해결할 때 작성합니다.
  분쟁의 구체적 내용, 합의 조건, 지급액이나 이행 방법을 명확히 기재해야 나중에
  재분쟁을 막을 수 있습니다. 합의 체결 후에도 일방이 이행하지 않으면 강제집행을
  신청할 수 있으므로 양 당사자가 모두 서명하고 인감을 날인하는 것이 안전합니다.
  본 서식은 참고용이며 법적 효력과 적합성은 사용자가 확인해야 합니다.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 합의서
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["일방당사자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["타방당사자", "성명", "", "생년월일", ""]
      - ["", "주소", "", "연락처", ""]
  - type: subtitle
    text: 분쟁 내용 및 합의 조건
  - type: textbox
    hint: "분쟁의 원인이 된 사건, 당사자 간의 분쟁 내용, 분쟁 해결 조건(금전 지급, 물품 인수, 이용 제한 등)을 상세히 기재하십시오."
    height_mm: 35
  - type: article
    heading: 제1조 (분쟁의 해결)
    lines:
      - "당사자들은 위 분쟁 내용에 관하여 합의하며, 본 합의서에 정한 조건에 따라 분쟁을 종료한다."
  - type: article
    heading: 제2조 (기밀유지)
    lines:
      - "당사자들은 본 합의 내용을 제3자에게 공개하지 않기로 합의한다."
  - type: article
    heading: 제3조 (재분쟁 금지)
    lines:
      - "당사자들은 본 합의로 모든 분쟁이 완전히 해결되었음을 확인하며, 추후 동일 사건으로 재분쟁을 제기하지 않기로 합의한다."
  - type: date_line
  - type: sign_line
    labels: ["일방당사자", "타방당사자"]
  - type: notice
    text: 양 당사자가 모두 서명한 후 인감으로 날인하면 강제집행 대상이 될 수 있으므로 신중하게 체결하십시오.
