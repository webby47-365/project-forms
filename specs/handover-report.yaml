id: handover-report
title: 업무 인수인계서
category: corp
subcategory: hr
tags: [인수인계서, 업무인수인계서, 퇴사 인수인계, 부서이동 인수인계, 업무이관]
summary: 퇴사·부서이동 시 담당 업무와 미결 사항, 보관 문서·계정을 인계자가 인수자에게 넘기는 인수인계서입니다.
usage: >
  퇴사, 휴직, 부서이동 등으로 담당 업무를 다른 사람에게 넘길 때 작성하는 서류입니다.
  담당 업무별 진행상태와 인수인계 내용을 표로 정리하고, 아직 끝나지 않은 미결 사항과
  보관 문서·계정 정보의 이관 여부를 빠짐없이 기재합니다. 인계자와 인수자가 함께 내용을
  확인한 뒤 서명하고, 필요한 경우 입회자(부서장 등)가 함께 확인하면 분쟁을 예방할 수
  있습니다. 계정 비밀번호는 본 문서에 직접 기재하지 말고 별도 보안 절차로 전달하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
howto:
  - 인계자와 인수자, 인계일·인계사유를 적습니다.
  - 담당 업무별 진행 상태와 인계 내용을 표로 정리합니다.
  - 아직 끝나지 않은 미결 사항을 빠짐없이 기재합니다.
  - 인계자와 인수자가 함께 확인하고 서명합니다.

faq:
  - q: 계정 비밀번호도 여기에 적나요?
    a: 아니요, 비밀번호는 문서에 직접 적지 말고 별도의 보안 절차로 전달하십시오.
  - q: 입회자는 꼭 필요한가요?
    a: 필수는 아니지만 부서장 등이 함께 확인하면 이후 분쟁을 예방하는 데 도움이 됩니다.

related: [resignation-letter, asset-handover, personnel-order]

blocks:
  - type: doc_title
    text: 업무 인수인계서
    spaced: true
  - type: grid
    widths: [14, 19, 14, 19, 14, 20]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["인계자", "", "소속(부서)", "", "직위", ""]
      - ["인수자", "", "소속(부서)", "", "직위", ""]
      - ["인계일", "", "인계 사유", "", "", ""]
