id: vehicle-use-request
title: 업무용 차량 사용 신청서
category: corp
subcategory: admin
version: 1
created_by: agent
status: published
tags: [차량사용신청서, 업무용차량신청, 차량운행신청, 법인차량사용, vehicle request]
summary: 업무용 차량의 사용일시·목적지·동승자를 적어 사전 승인을 받고 운행 기록을 남기는 신청서입니다.
usage: >
  회사 소유 차량을 업무상 사용하기 전에 사용일시와 목적지, 사용목적을 기재해 승인을
  받는 서류입니다. 동승자와 운행 기록을 함께 적어 두면 차량 배정이 겹치지 않도록
  관리할 수 있습니다. 사용 후에는 주행거리와 유류비·통행료를 기재하고 영수증을
  첨부하여 차량관리자에게 제출하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 사용일시와 목적지, 사용목적을 적어 신청합니다.
  - 동승자와 예상 주행거리를 함께 기재합니다.
  - 차량관리자의 승인을 받아 차량을 배정받습니다.
  - 사용 후 주행거리와 유류비를 적고 영수증을 첨부합니다.

faq:
  - q: 개인 차량으로 업무를 볼 때도 쓰나요?
    a: 이 서식은 회사 소유 차량 신청용이며, 개인 차량은 별도의 유류비 정산 서식을 쓰는 것이 일반적입니다.
  - q: 사용 도중 목적지가 바뀌면 어떻게 하나요?
    a: 변경 사유를 차량관리자에게 알리고, 가능하면 신청서 비고란에 실제 이동 경로를 남겨 두십시오.

related: [vehicle-log, business-trip-request, expense-report]

