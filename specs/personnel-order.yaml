id: personnel-order
title: 인사발령통지서
category: corp
subcategory: hr
tags: [인사발령통지서, 발령장, 인사발령, 직위발령, 부서이동]
summary: 인사발령의 대상·내용·발령일자를 공식적으로 통지하는 서식입니다.
usage: >
  신입사원 입사, 직위 승진, 부서 이동, 전직 등 인사 발령을 공식적으로 통지하는 문서입니다.
  발령 대상자의 인적사항과 함께 변경 전·후의 부서·직위·급여를 명확하게 기재하고,
  회사 대표이사의 서명·날인을 받아 본인과 인사담당자에게 교부합니다.
source: original
featured: false
target_pages: 1

howto:
  - 발령 대상자의 인적사항을 적습니다.
  - 변경 전과 변경 후의 부서·직위를 나란히 적습니다.
  - 발령일자와 발령 사유를 명시합니다.
  - 대표이사 서명을 받아 본인에게 교부합니다.

faq:
  - q: 급여 변경도 반드시 적어야 하나요?
    a: 급여가 바뀌는 발령이면 변경 전후 금액을 함께 적어야 나중에 근로조건 관련 다툼을 줄일 수 있습니다.
  - q: 본인에게 언제 전달해야 하나요?
    a: 발령일 전에 미리 통지해 대상자가 변경 사항을 충분히 인지하고 준비할 시간을 주는 것이 좋습니다.

related: [handover-report, employee-roster, job-description, performance-evaluation]

blocks:
  - type: doc_title
    text: 인사발령통지서

  - type: subtitle
    text: 발령 대상자

  - type: grid
    widths: [16, 18, 16, 18, 16, 16]
    label_cols: [0, 2, 4]
    row_height_mm: 9
    rows:
      - ["성명", "", "생년월일", "", "성별", ""]
      - ["사번", "", "입사일", "", "현 직급", ""]
    sample_rows:
      - ["", "홍길동", "", "1990-05-14", "", "남"]
      - ["", "E2022031", "", "2022-03-02", "", "대리"]

  - type: subtitle
    text: 발령 내용

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 10
    rows:
      - ["발령 구분", "", "발령 사유", ""]
      - ["현 부서", "", "발령 부서", ""]
      - ["현 직위", "", "발령 직위", ""]
      - ["현 급여", "", "발령 급여", ""]
    sample_rows:
      - ["", "승진", "", "정기 인사평가 결과"]
      - ["", "영업1팀", "", "영업1팀"]
      - ["", "대리", "", "과장"]
      - ["", "3,800,000원", "", "4,200,000원"]

  - type: subtitle
    text: 발령 사항

  - type: grid
    widths: [25, 25, 25, 25]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["발령 일자", "", "근무 시작일", ""]
      - ["보직명(있는 경우)", "", "발령 권자", ""]
    sample_rows:
      - ["", "2026-10-01", "", "2026-10-01"]
      - ["", "해당없음", "", "대표이사"]

  - type: spacer
    height_pt: 8

  - type: para
    text: 위와 같이 인사발령하기로 결정하고 아래와 같이 통지합니다.
    align: center
    size: 11
    space_after: 4

  - type: date_line
    sample_text: 2026 년    9 월    13 일

  - type: para
    text: 대표이사
    align: center
    size: 12

  - type: sign_line
    label: 대표이사
    sample_names: [박민준]

  - type: spacer
    height_pt: 6

  - type: notice
    text: 본 발령은 법정 취업규칙의 규정에 따라 발령되었으며, 발령일자부터 효력이 발생합니다.
