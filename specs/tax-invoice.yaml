id: tax-invoice
title: 세금계산서 (수기)
category: corp
subcategory: finance
tags: [세금계산서, 수기 세금계산서, 계산서 양식, 공급가액 부가세, 거래명세]
summary: 공급자와 공급받는자 정보·품목별 공급가액과 세액을 기재하는 수기 세금계산서 양식입니다.
usage: >
  전자세금계산서를 발행하기 어려운 상황에서 임시로 작성하거나 거래 내용을 정리할 때 사용하는
  서식입니다. 공급자와 공급받는자의 등록번호·상호·성명·사업장 주소·업태·종목을 빠짐없이 적고,
  작성일자와 공급가액·세액을 정확히 기재하십시오. 품목은 일자별로 나누어 적고 단가와 수량이
  합계와 맞는지 확인합니다. 영수 또는 청구 여부를 반드시 표시하고, 발행 후에는 공급자와
  공급받는자가 각각 1부씩 보관하십시오. 전자발행 의무 대상 여부와 세액 처리는 관할 세무서
  기준을 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 공급자와 공급받는자의 등록번호·상호·주소를 적습니다.
  - 작성일자와 품목별 공급가액을 일자순으로 적습니다.
  - 공급가액 합계와 세액을 계산해 기재합니다.
  - 영수 또는 청구 여부를 표시하고 서명 후 각자 보관합니다.

faq:
  - q: 수기 세금계산서도 효력이 있나요?
    a: 네, 다만 전자발행 의무 대상 사업자는 원칙적으로 전자 방식으로 발행해야 합니다.
  - q: 세액은 어떻게 계산하나요?
    a: 공급가액의 10%를 세액으로 적고, 공급가액과 세액을 더한 금액이 합계금액이 됩니다.

