id: payslip
title: 급여명세서
category: corp
subcategory: finance
tags: [급여명세서, 임금명세서, 월급명세서, 급여지급명세서, 임금대장]
summary: 임금 구성항목과 4대보험·세금 공제내역, 실지급액을 한 장에 정리하는 급여(임금)명세서입니다.
usage: >
  근로기준법에 따라 사용자는 임금을 지급할 때마다 근로자에게 임금명세서를 교부해야 합니다.
  임금의 구성항목별 금액, 공제항목별 금액과 산출내역을 반드시 적어야 하며, 연장·야간·휴일근로가
  있으면 해당 시간 수까지 알 수 있게 기재해야 합니다. 서면 외에 전자문서(메일·사내 시스템)로도
  교부할 수 있습니다. 구체적인 공제 요율과 세액 기준은 매년 달라지므로 해당 연도 기준을 확인하십시오.
source: law-standard
source_note: 근로기준법 제48조(임금대장 및 임금명세서) 취지를 반영하여 자체 제작
featured: false
target_pages: 1

howto:
  - 지급일과 귀속 기간을 먼저 확인해 적습니다.
  - 기본급과 각종 수당을 항목별로 나눠 적습니다.
  - 4대보험과 세금 공제액을 항목별로 계산해 적습니다.
  - 지급액 합계에서 공제액 합계를 빼 실지급액을 적습니다.

faq:
  - q: 매달 새로 작성해야 하나요?
    a: 네, 급여를 지급할 때마다 그 달의 항목과 금액을 새로 기재해 교부해야 합니다.
  - q: 공제 요율은 어디서 확인하나요?
    a: 국민연금공단, 건강보험공단 등 관련 기관의 해당 연도 고시 요율을 확인하십시오.

related: [labor-contract-standard, year-end-tax-checklist, severance-calculation, employee-roster]

