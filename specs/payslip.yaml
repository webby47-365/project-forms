  - type: notice
    text: 임금명세서는 임금을 지급할 때마다 교부해야 하며, 임금의 구성항목별·공제항목별 금액과 산출내역을 근로자가 확인할 수 있도록 기재해야 합니다. 공제 요율과 세액 기준은 해당 연도 기준을 확인하십시오.
