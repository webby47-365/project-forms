id: business-relocation-confirmation
title: 영업장 소재지 이전 사실 확인서
category: public
subcategory: permit
tags: [영업장이전, 소재지변경, 사업장이전, 이전확인서, 영업신고]
summary: 영업장을 새 주소로 옮긴 사실과 이전 전후 주소·이전일을 확인해 제출처에 내는 영업장 소재지 이전 사실 확인서 양식입니다.
usage: >
  가게나 사업장을 다른 곳으로 옮긴 뒤 관청·거래처·금융기관에 이전 사실을 알릴 때 쓰는 서식입니다.
  이전 전 주소와 이전 후 주소, 이전일, 영업 재개일, 대표자 정보를 적고 서명합니다.
  영업 신고와 사업자등록의 주소 변경은 별도 절차가 있으므로 관할 기관 안내를 먼저 확인하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 상호와 대표자 성명, 연락처를 적습니다.
  - 이전 전 주소와 이전 후 주소를 적습니다.
  - 이전일과 영업 재개일을 적습니다.
  - 제출처와 날짜를 적고 서명합니다.
faq:
  - q: 이 확인서로 주소 변경 신고가 되나요?
    a: 아닙니다. 영업 신고와 사업자등록 주소 변경은 별도 절차입니다. 관할 기관 안내를 확인하십시오.
  - q: 이전일과 영업 재개일은 다른가요?
    a: 짐을 옮긴 날과 실제로 영업을 다시 시작한 날이 다를 수 있어 각각 적습니다.
related: [business-name-change-confirmation, business-premises-area-change-confirmation, business-registration-change-poa, business-resumption-confirmation]
blocks:
  - type: doc_title
    text: 영업장 소재지 이전 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 영업장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["상호", "", "대표자", ""]
      - ["연락처", "", "제출처", ""]
    sample_rows:
      - ["", "새길한식당", "", "박민준"]
      - ["", "010-1234-5678", "", "중구청 위생과"]
  - type: subtitle
    text: 2. 소재지 이전 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [0, 1, 0, 3]
      - [1, 1, 1, 3]
    rows:
      - ["이전 전 주소", "", "", ""]
      - ["이전 후 주소", "", "", ""]
      - ["이전일", "", "영업 재개일", ""]
    sample_rows:
      - ["", "서울특별시 중구 세종대로 000", "", ""]
      - ["", "서울특별시 종로구 종로 000", "", ""]
      - ["", "2026-11-10", "", "2026-11-15"]
  - type: textbox
    hint: "이전 사유와 함께 첨부하는 서류(임대차계약서 사본 등)를 적으십시오."
    height_mm: 24
    sample_text: "임대 기간 만료로 같은 업종을 유지한 채 이전했으며 새 임대차계약서 사본을 첨부합니다."
  - type: para
    text: 위와 같이 영업장 소재지가 이전되었음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   16 일
  - type: sign_line
    labels: ["대표자"]
    sample_names: [박민준]
  - type: notice
    text: 신고 절차는 관할 기관의 안내를 확인하십시오.
