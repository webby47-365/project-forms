    lines:
    - - l
      - 1. 위임장 또는 미성년자의 법정대리인, 한정후견인 및 성년후견인의 동의서 위임한 연월일을 적습니다. 위임장의 유효기간은 위임 또는 동의일부터 6개월까지 입니다.
    - - l
      - 2. 인감증명서를 2부 이상 발급받으려는 경우에는 위임장 또는 동의서의 발급 통수란에 필요한 수량을 적어야 하며, 기재되어 있지 않을 경우에는 1부가 발급됩니다.
    - - l
      - '3. 위임장의 용도란은 인감증명서를 제출할 곳에서 필요로 하는 내용(예시: 부동산 매매용, 근저당 설정용, 자동차 매매용 등)을 적고, 위임자란의 서명은 사인의 형태로도 할 수 있으며, 날인은 인감도장이 아니라도 관계없습니다.'
    - - l
      - ※ 용도란에 "부동산 매매에 관한 모든 권한 위임" 등과 같은 내용으로 적지 않아야 합니다.
    - - l
      - 4. 미성년자, 피한정후견인 또는 피성년후견인의 인감증명서를 위임받아 발급받으려는 경우에는 위임장과 미성년자의 법정대리인, 한 정후견인 또는 성년후견인의 동의서를 모두 작성해야 합니다.
    - - l
      - 5. 주민등록 말소자(국외이주로 인한 주민등록말소자 제외) 또는 거주불명등록자에게는 위임을 할 수 없으며, 위임장의 기재내 용을 확인하기 위하여 위임자의 신분증을 지참해야 하고, 대리인 및 위임자가 제출하는 신분증은 주민등록증, 자동차운전면 허증, 여권, 장애인등록증[(복지카드), 주민등록번호와 주소가 기재되어 있지 않은 장애인등록증ㆍ복지카드는
        제외합니다] 중 하나를 선택하여 제출합니다.
    - - l
      - 6. 주민등록번호란에 미주민등록 재외국민은 여권번호를, 국내거소신고자는 국내거소신고번호를, 외국인은 외국인등록번호를 적습니다.
    - - l
      - 7. 재외국민, 해외거주(체류)자, 수감자가 인감증명서 발급을 위임하여 신청하는 경우에는 다음 구분에 따라 해당 기관의 확인을 받아 제출해야 합니다. 이 경우 재외국민은 해외에 체류하는 경우로 한정하고, 재외국민의 부동산 권리 이전용인 경우에는 부동산의 종류와 소재지를 적어 소관 증명청의 소재지 또는 부동산 소재지를 관할하는 세무서장의 확인을 받아야
        합니다.
    - - l
      - '가. 재외국민, 해외거주(체류)자: 재외공관(영사관)'
    - - l
      - '나. 수감자: 수감기관(교도관)'
    - - l
      - '8. 다른 사람의 도장이나 서명을 위조하거나 부정하게 사용한 자(예: 다른 사람이나 사망한 사람의 위임장을 허위로 작성하여 인 감증명서를 신청하거나 발급받은 자 등)는「형법」 제231조부터 제240조까지의 규정에 따라 처벌을 받게 됩니다.'
    size: 7.2
