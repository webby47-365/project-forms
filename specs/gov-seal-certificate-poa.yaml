id: gov-seal-certificate-poa
title: 인감증명서 발급 위임장 (법정서식)
category: public
subcategory: family
tags:
- 인감증명
- 위임장
- 부동산
- 계약
- 권리이전
summary: 인감증명서 발급을 받기 위해 다른 사람에게 권한을 위임하는 법정 위임장입니다.
usage: 본인이 직접 주민센터를 방문하기 어려울 때 대리인에게 인감증명서 발급을 맡기며 쓰는 위임장입니다. 위임자의 인적사항, 용도, 발급 통수와 대리인의 인적사항·관계를 적고 위임자가 서명 또는 인감을 찍습니다. 원문에 따르면 위임(동의) 효력은 위임일부터 6개월입니다. 대리인은 신분증을 지참합니다.
source: law-standard
source_note: 인감증명법 시행령 별지 제13호서식
law_ref:
  law: 인감증명법 시행령
  form_no: 별지 제13호서식
  amended: '2020-02-18'
  url: https://www.law.go.kr/LSW/lsBylInfoPLinkR.do?lsNm=%EC%9D%B8%EA%B0%90%EC%A6%9D%EB%AA%85%EB%B2%95+%EC%8B%9C%ED%96%89%EB%A0%B9&bylNo=0013&bylBrNo=00&bylCls=BF&bylEfYdYn=Y
  agency: 행정안전부·읍면동
  checked: '2026-09-16'
featured: false
target_pages: 2
created_by: gov-batch
series: seal-certificate-poa
series_name: 인감증명 발급 위임장
variant: 법정서식
variant_rank: 2
variant_use: 인감증명서 발급 위임용 법정 양식입니다.
howto:
- 위임자의 성명·주민등록번호·주소·신분증 종류를 적습니다.
- 용도와 발급 통수를 기입합니다.
- 대리인의 성명·주민등록번호·주소와 위임자와의 관계를 적습니다.
- 위임자가 자필로 서명하거나 인감으로 날인합니다.
faq:
- q: 용도는 구체적으로 뭐라고 적나요?
  a: 부동산 매매용, 근저당 설정용 같이 구체적으로 적습니다. 포괄적 표현은 피해야 합니다.
- q: 유효기간이 있나요?
  a: 위임 또는 동의일부터 6개월까지 유효합니다. 기간 내에 인감증명서를 받아야 합니다.
related:
- power-of-attorney
- gov-seal-report
