id: wedding-gift-ledger
title: 경조사비 기록 장부
category: personal
subcategory: life
tags: [경조사비, 축의금, 부의금, 경조사장부, 기록]
summary: 결혼·장례·돌잔치 등에서 주고받은 경조사비의 날짜와 대상, 금액, 답례 여부를 한눈에 기록하는 경조사비 기록 장부 양식입니다.
usage: >
  축의금과 부의금을 누구에게 얼마를 냈고 받았는지 잊지 않도록 정리하는 개인용 장부입니다.
  날짜와 경조사 종류, 상대 이름과 관계, 낸 금액 또는 받은 금액을 한 줄씩 적고 답례 여부를 표시합니다.
  연락처 등 불필요한 개인정보는 적지 말고 이름과 관계 정도만 적어 보관하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 장부의 기록 연도와 작성자를 적습니다.
  - 경조사 날짜와 종류, 상대 이름과 관계를 적습니다.
  - 낸 금액과 받은 금액을 구분해서 적습니다.
  - 답례를 했는지 표시하고 연말에 합계를 냅니다.
faq:
  - q: 낸 금액과 받은 금액을 같이 적나요?
    a: 한 표에 두 칸을 나눠 적으면 오간 금액을 비교하기 쉽습니다. 해당하는 칸에만 적습니다.
  - q: 상대방의 연락처도 적어야 하나요?
    a: 꼭 필요하지 않습니다. 개인정보 보관을 줄이려면 이름과 관계만 적는 것이 좋습니다.
related: [family-event-notice, invitation-card, household-budget, thank-you-letter]
blocks:
  - type: doc_title
    text: 경조사비 기록 장부
    spaced: false
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["기록 연도", "", "작성자", ""]
    sample_rows:
      - ["", "2026년", "", "홍길동"]
  - type: subtitle
    text: 1. 경조사비 내역
  - type: table
    widths: [5, 18, 12, 14, 11, 14, 14, 12]
    header: ["No", 날짜, 경조사 종류, 상대 이름, 관계, 낸 금액, 받은 금액, 답례]
    empty_rows: 12
    row_height_mm: 8
    sample_rows:
      - ["1", "2026-03-14", "결혼", "박민준", "직장동료", "100,000", "", "해당 없음"]
      - ["2", "2026-06-02", "돌잔치", "이수현", "친구", "50,000", "", "해당 없음"]
      - ["3", "2026-09-20", "결혼", "홍길동", "본인", "", "200,000", "완료"]
      - ["4", "2026-10-11", "부의", "김서연", "지인", "50,000", "", "해당 없음"]
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["낸 금액 합계", "", "받은 금액 합계", ""]
    sample_rows:
      - ["", "200,000원", "", "200,000원"]
  - type: textbox
    hint: "답례 계획이나 기억해 둘 사항을 적으십시오."
    height_mm: 16
    sample_text: "11월 중 답례품을 보낼 예정입니다."
  - type: notice
    text: 상대방의 연락처 등 불필요한 개인정보는 적지 않는 것이 좋습니다.
