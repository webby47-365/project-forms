id: lease-renewal-contract
title: 임대차 계약 갱신계약서
category: estate
subcategory: lease
series: lease
series_name: 임대차계약서
variant: 갱신
variant_rank: 3
tags: [임대차갱신계약서, 재계약서, 전세갱신계약, 월세갱신계약, 계약갱신]
summary: 기존 임대차계약의 보증금·차임을 조정하며 계약기간을 연장할 때 작성하는 갱신계약서입니다.
usage: >
  임대차기간이 끝나갈 때 같은 당사자끼리 계약을 연장하면서 보증금이나 차임을 조정하는 경우
  사용합니다. 원 계약의 체결일과 기간, 종전 보증금·차임을 먼저 확인한 뒤 갱신 기간과 변경된
  금액, 증액분 지급일을 명확히 적으십시오. 원 계약에서 정한 사항은 이 갱신계약에서 달리
  정하지 않으면 그대로 유지됩니다. 계약갱신요구권 인정 여부와 증액 상한은 계약 형태와
  개별 사안에 따라 다르므로 작성 전에 관련 법령을 확인하십시오.
source: original
featured: false
target_pages: 1
created_by: agent
status: published
version: 1

variant_use: 기존 계약을 연장하며 보증금·차임을 조정할 때 씁니다.

howto:
  - 원 계약의 체결일과 기간, 종전 보증금·차임을 확인합니다.
  - 갱신 기간을 적습니다.
  - 변경된 보증금과 차임을 적습니다.
  - 증액분이 있으면 지급일을 정해 적습니다.
  - 임대인과 임차인이 서명 날인합니다.

faq:
  - q: 원 계약 내용은 다시 적어야 하나요?
    a: 아니요, 이 갱신계약에서 달리 정하지 않은 사항은 원 계약대로 유지됩니다.
  - q: 보증금을 올릴 수 있는 한도가 있나요?
    a: 계약 형태와 개별 사안에 따라 다르므로 작성 전 관련 법령과 상한 기준을 확인하십시오.

blocks:
  - type: doc_title
    text: 임대차 계약 갱신계약서
    spaced: false
  - type: para
    text: 임대인과 임차인은 아래 임대차계약의 갱신에 관하여 다음과 같이 합의한다.
    align: center
    size: 10
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
