id: invoice-request
title: 청구서
category: corp
subcategory: finance
tags: [청구서, 대금청구서, 세금계산서청구, 청구내역서, invoice]
summary: 거래 내역별 공급가액과 세액을 정리하고 입금 계좌와 지급 기한을 안내하는 청구서입니다.
usage: >
  용역이나 물품을 공급한 뒤 대금 지급을 요청할 때 사용하는 문서입니다. 거래일자별로
  품목·내용과 공급가액·세액을 구분해 적고 총 청구금액은 숫자와 한글을 함께 표기해
  오기를 방지합니다. 입금 계좌와 예금주명을 정확히 기재하고, 지급 기한을 명시해야
  미수금 관리가 쉬워지며, 세금계산서 발행 여부는 거래처와 사전에 협의하십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published
howto:
  - 청구번호와 청구일자, 공급자·수신처 정보를 적습니다.
  - 거래일자별 품목과 공급가액, 세액을 표에 채웁니다.
  - 총 청구금액을 숫자와 한글로 함께 적습니다.
  - 입금 계좌와 지급 기한을 적어 발송합니다.

faq:
  - q: 세금계산서와 같이 보내야 하나요?
    a: 거래처와 사전에 협의한 방식에 따라 세금계산서를 별도로 발행해 함께 보내면 됩니다.
  - q: 청구금액에 부가세를 포함하나요?
    a: 공급가액과 세액을 나눠 적고 합계에 부가세 포함 총액을 표시하면 됩니다.

related: [transaction-statement, tax-invoice, payment-confirmation, balance-confirmation]

