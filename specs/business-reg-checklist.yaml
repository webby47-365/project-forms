id: business-reg-checklist
title: 사업자등록 준비 체크리스트
category: corp
subcategory: startup
tags: [사업자등록체크리스트, 사업자등록준비, 사업자등록구비서류, 홈택스, 창업준비]
summary: 업종·과세유형 선택과 사업자등록에 필요한 구비서류를 점검하는 체크리스트입니다.
usage: >
  사업자등록 신청 전에 업종과 과세유형(일반·간이·면세)을 정하고, 개인사업자와 법인사업자가
  각각 준비해야 하는 서류를 빠짐없이 확인하는 서식입니다. 임대차계약서, 인허가증, 법인이라면
  법인등기부등본·정관처럼 업종과 사업 형태에 따라 필요한 서류가 다르므로 준비여부를 표시하며
  점검하십시오. 업종별 인허가 요건과 과세유형 적용 기준은 홈택스 또는 관할 세무서에 문의해
  사전에 확인하는 것이 안전합니다.
source: original
featured: false
created_by: agent
status: published
version: 1
target_pages: 1
howto:
  - 업종과 과세유형을 먼저 정합니다.
  - 개인사업자인지 법인사업자인지에 따라 필요 서류를 확인합니다.
  - 임대차계약서, 인허가증 등 서류를 준비여부와 함께 표시합니다.
  - 준비된 서류를 챙겨 관할 세무서나 홈택스에서 신청합니다.

faq:
  - q: 과세유형은 어떻게 정하나요?
    a: 예상 매출과 업종에 따라 다르므로 홈택스나 관할 세무서에 문의해 정하는 것이 안전합니다.
  - q: 법인은 어떤 서류가 더 필요한가요?
    a: 법인등기부등본과 정관처럼 법인 관련 서류가 추가로 필요하니 목록에서 확인하십시오.

related: [startup-checklist, business-plan-simple, articles-of-incorporation]

