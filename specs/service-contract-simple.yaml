id: service-contract-simple
title: 용역계약서 (간편형)
category: legal
subcategory: contract
tags: [용역계약서, 간편계약서, 프리랜서계약, 용역대금, 서비스계약서]
summary: 목적·용역 내용과 기간·대금·비밀유지 등 핵심 조항만 담은 1페이지 간편 용역계약서입니다.
usage: >
  소규모·단기 용역이나 프리랜서 업무를 의뢰할 때 핵심 조항만 간단히 정리해 빠르게 체결하는
  서식입니다. 용역 내용과 기간, 대금과 지급방법을 구체적으로 적어야 추후 대금 분쟁을 줄일 수
  있습니다. 규모가 크거나 기간이 길고 검수·지식재산권 조항을 상세히 정할 필요가 있는 용역은
  일반 용역계약서를 사용하는 것이 좋습니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 갑과 을의 정보를 적습니다.
  - 용역 내용과 수행 기간을 적습니다.
  - 대금과 지급방법, 지급일을 적습니다.
  - 비밀유지 등 핵심 조항을 확인하고 서명합니다.

faq:
  - q: 규모가 큰 용역에도 쓸 수 있나요?
    a: 검수나 지식재산권 조항을 상세히 정해야 한다면 일반 용역계약서를 사용하는 것이 좋습니다.
  - q: 대금은 나눠서 지급해도 되나요?
    a: 네, 지급방법란에 분할 지급 일정과 금액을 구체적으로 적으면 됩니다.

related: [nda, invoice-request, payment-confirmation]

blocks:
  - type: doc_title
    text: 용역계약서
  - type: para
    text: 갑과 을은 다음과 같이 용역계약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 당사자
  - type: grid
    widths: [18, 22, 18, 22, 20]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["갑(발주자)", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
      - ["을(수급인)", "상호(성명)", "", "사업자번호/생년월일", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "000-00-00000"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "홍길동", "", "1985-03-11"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-9876-5432"]
  - type: subtitle
    text: 계약 조건
  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["용역명", "", "용역기간", ""]
      - ["용역대금", "", "지급방법", ""]
    sample_rows:
      - ["", "홈페이지 리뉴얼 디자인", "", "2026-10-01 ~ 2026-11-15"]
      - ["", "금 5,000,000원 (금 오백만원)", "", "계약 시 50%, 완료 시 50%"]
  - type: article
    heading: 제1조 (목적)
    lines:
      - "본 계약은 갑이 을에게 위 용역명의 업무를 의뢰하고, 을이 이를 수행하기로 합의하는 것을 목적으로 한다."
  - type: article
    heading: 제2조 (용역 내용과 기간)
    lines:
      - "을은 위 용역명에 따른 업무를 위 용역기간 내에 성실히 수행한다."
      - "용역 내용을 변경하거나 기간을 연장할 필요가 있는 경우 갑과 을이 서면으로 협의하여 정한다."
  - type: article
    heading: 제3조 (대금과 지급)
    lines:
      - "갑은 을에게 위 용역대금을 위 지급방법에 따라 을이 지정한 계좌로 지급한다."
      - "갑이 지급을 지체하는 경우 지체일수에 대하여 당사자가 합의한 지연이자를 지급한다."
  - type: article
    heading: 제4조 (성과물의 귀속)
    lines:
      - "본 용역의 결과로 생성된 성과물에 관한 권리는 용역대금이 완납된 때 갑에게 귀속한다. 다만 을이 기존에 보유하던 권리는 을에게 귀속한다."
  - type: article
    heading: 제5조 (비밀유지)
    lines:
      - "갑과 을은 계약 수행 중 알게 된 상대방의 영업비밀과 개인정보를 제3자에게 누설하지 아니하며, 이 의무는 계약 종료 후에도 유지된다."
  - type: article
    heading: 제6조 (해지와 분쟁)
    lines:
      - "당사자 일방이 계약상 의무를 중대하게 위반한 경우 상대방은 상당한 기간을 정하여 시정을 요구한 후 계약을 해지할 수 있다."
      - "본 계약에 관한 분쟁은 갑의 주소지 관할법원을 제1심 관할법원으로 한다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["갑(발주자)", "을(수급인)"]
    sample_names: ["(주)한빛커머스 대표 김서연", "홍길동"]
  - type: notice
    text: 본 계약은 참고용이며 용역의 규모와 특성에 맞게 조정하여 사용하시고, 법적 효력은 관련 법령과 개별 사안을 확인하십시오.
