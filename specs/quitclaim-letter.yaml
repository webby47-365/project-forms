id: quitclaim-letter
title: 권리포기 각서
category: legal
subcategory: notice
tags: [권리포기각서, 권리포기서, 포기각서, 청구권포기, 권리포기확약서]
summary: 특정 권리를 포기하고 향후 이와 관련한 이의나 청구를 제기하지 않겠다는 의사를 밝히는 각서 양식입니다.
usage: >
  채권 등 특정 권리를 보유한 사람이 이를 포기하고자 할 때 그 의사를 명확히 밝히기 위해
  작성합니다. 포기하는 권리의 종류와 대상, 발생 원인, 금액 등을 구체적으로 특정해야 나중에
  다툼이 생기지 않습니다. 포기 의사와 함께 향후 이의나 청구를 제기하지 않겠다는 확약을 함께
  기재합니다. 포기의 효력 범위는 개별 사안에 따라 달라질 수 있으므로 서명 전 전문가 확인을
  받는 것이 안전합니다.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

blocks:
  - type: doc_title
    text: 권리포기 각서
    spaced: false

  - type: subtitle
    text: 1. 작성자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "1990-03-15"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]

  - type: subtitle
    text: 2. 포기 대상 권리의 표시
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["권리 종류", "", "대상", ""]
      - ["발생 원인", "", "금액", ""]
    sample_rows:
      - ["", "대여금 채권", "", "김서연에 대한 대여금 반환청구권"]
      - ["", "2025-06-10 금전대여", "", "금 10,000,000원(금 일천만원)"]

  - type: subtitle
    text: 3. 포기 의사
  - type: para
    text: 본인(작성자)은 위에 표시된 권리를 포기합니다.
    align: center
    size: 11
    space_after: 2
  - type: para
    text: 본인은 위 권리 포기와 관련하여 앞으로 상대방에게 어떠한 이의나 청구도 제기하지 않을 것을 확약합니다.
    align: center
    size: 11

  - type: date_line
    sample_text: 2026 년    9 월   13 일

  - type: sign_line
    label: 작성자
    sample_names: [홍길동]

  - type: notice
    text: 권리 포기의 효력 범위는 개별 사안에 따라 다르므로 서명 전 법률 전문가의 확인을 받으시기 바랍니다.
