tags: [공문, 대외공문, 공식문서, 공식서신, 업무공문]
summary: 회사가 대외기관이나 거래처에 공식적으로 발송하는 공문 양식입니다.
usage: >
  회사를 대표하여 대외기관이나 거래처에 공식 입장이나 안내를 전달하는 문서입니다.
  수신자, 참조자, 제목, 본문, 발신명의를 명확히 기재하고 문서번호·시행일자·직인을
  반드시 표기해야 효력이 있습니다. 공식 문서이므로 높은 존경성과 명확한 표현이 필요합니다.
source: original
featured: false
target_pages: 1
