id: official-letter
title: 공문
category: corp
subcategory: admin
tags: [공문, 대외공문, 공식문서, 공식서신, 업무공문]
summary: 회사가 대외기관이나 거래처에 공식적으로 발송하는 공문 양식입니다.
usage: >
  회사를 대표하여 대외기관이나 거래처에 공식 입장이나 안내를 전달하는 문서입니다.
  수신자, 참조자, 제목, 본문, 발신명의를 명확히 기재하고 문서번호·시행일자·직인을
  반드시 표기해야 효력이 있습니다. 공식 문서이므로 높은 존경성과 명확한 표현이 필요합니다.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 공 문
  - type: grid
    widths: [10, 20, 10, 20, 10, 30]
    label_cols: [0, 2, 4]
    row_height_mm: 8
    rows:
      - ["문서번호", "", "시행일자", "", "부서", ""]
    sample_rows:
      - ["", "총무2026-045", "", "2026-09-13", "", "총무팀"]
  - type: grid
    widths: [15, 85]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["수신(기관명)", ""]
      - ["참조(기관명)", ""]
    sample_rows:
      - ["", "서울특별시 마포구청"]
      - ["", "(주)한빛커머스 총무팀"]
  - type: grid
    widths: [15, 85]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["제목", ""]
    sample_rows:
      - ["", "2026년 하반기 정기점검 일정 안내"]
  - type: subtitle
    text: 본문
  - type: textbox
    hint: "공문 내용을 간명하고 정중하게 기재하십시오."
    height_mm: 40
    sample_text: 귀 기관의 무궁한 발전을 기원합니다. 당사는 2026년 하반기 정기점검을 10월 중 실시할 예정이며, 세부 일정은 별첨 계획서를 참고하여 협조하여 주시기 바랍니다.
  - type: spacer
    height_pt: 8
  - type: grid
    widths: [15, 35, 15, 35]
    label_cols: [0, 2]
    row_height_mm: 10
    rows:
      - ["발신처", "", "직인", ""]
      - ["발신자(직위)", "", "성명", ""]
    sample_rows:
      - ["", "(주)한빛커머스", "", "(직인)"]
      - ["", "대표이사", "", "홍길동"]
