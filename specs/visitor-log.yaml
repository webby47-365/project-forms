id: visitor-log
title: 방문자 기록대장
category: corp
subcategory: admin
version: 1
created_by: agent
status: published
tags: [방문자기록대장, 방문자대장, 출입관리, 방문객명부, visitor log]
summary: 외부 방문자의 방문일자·소속·연락처와 방문목적, 입실·퇴실 시각을 기록하는 방문자 기록대장입니다.
usage: >
  사무실을 방문하는 외부인의 출입 현황을 기록하여 보안과 안전을 관리하는 대장입니다.
  방문목적과 피방문자를 함께 적어 누구를 만나러 왔는지 추적할 수 있게 하고, 입실과
  퇴실 시각을 기록해 체류 시간을 확인합니다. 수집한 개인정보는 출입 관리 목적 외에는
  사용하지 않으며 정해진 보관기간이 지나면 파기합니다.
source: original
featured: false
target_pages: 1
howto:
  - 방문일자와 방문자 성명, 소속을 적습니다.
  - 방문 목적과 만나려는 담당자를 적습니다.
  - 입실 시각을 기록하고 출입증을 지급합니다.
  - 퇴실 시 시각을 기록하고 출입증을 회수합니다.

faq:
  - q: 방문자 연락처는 꼭 받아야 하나요?
    a: 비상 연락과 사후 확인을 위해 받는 것이 안전하지만 방침에 따라 생략할 수 있습니다.
  - q: 기록은 얼마나 보관해야 하나요?
    a: 회사가 정한 보관기간이 지나면 개인정보 보호를 위해 파기하는 것이 원칙입니다.

blocks:
  - type: doc_title
    text: 방문자 기록대장
    spaced: true

  - type: grid
    widths: [20, 30, 20, 30]
    label_cols: [0, 2]
    row_height_mm: 8
    rows:
      - ["관리부서", "", "작성월", ""]
    sample_rows:
      - ["", "총무팀", "", "2026년 9월"]

  - type: subtitle
    text: 방문 현황

  - type: table
    widths: [5, 11, 12, 14, 13, 17, 11, 9, 8]
    header: ["No", 방문일자, 방문자명, 소속, 연락처, 방문목적, 피방문자, 입실시각, 퇴실시각]
    empty_rows: 13
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2026-09-02", "김도현", "㈜새길데이터", "010-2345-6789", "업무 협의", "박민준", "10:00", "11:30"]
      - ["2", "2026-09-03", "이수현", "한빛물산", "010-3456-7890", "계약서 전달", "김서연", "14:00", "14:40"]
      - ["3", "2026-09-08", "최유진", "우체국 택배", "010-4567-8901", "물품 배송", "총무팀", "09:30", "09:45"]
      - ["4", "2026-09-10", "박지훈", "㈜새길데이터", "010-5678-9012", "시설 점검", "홍길동", "13:00", "15:00"]

  - type: notice
    text: 본 대장에 기재된 방문자 개인정보(성명·연락처)는 출입 관리 목적으로만 수집하며, 수집일로부터 1년간 보관 후 파기합니다.
