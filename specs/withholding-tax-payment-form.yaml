id: withholding-tax-payment-form
title: 원천세 납부서
category: corp
subcategory: finance
tags: [원천세납부서, 원천징수세액납부, 근로소득세납부, 지급명세서, 원천세]
summary: 근로소득 지급명세서 신고 후 원천징수한 소득세와 지방소득세의 납부 내역을 정리해 기록하는 납부서 양식입니다.
usage: >
  근로소득 지급명세서를 신고한 뒤 원천징수한 소득세와 지방소득세를 납부할 때, 귀속연월과
  지급연월, 인원과 총지급액, 납부세액을 한 장에 정리해 두는 사내 납부 기록서입니다.
  납부 금액은 신고서의 세액과 같은지 대조하며 적고, 납부일과 납부 방법, 영수증 번호도 함께
  남겨야 나중에 확인하기 쉽습니다. 실제 신고·납부 서식과 기한은 관할 세무서 또는 홈택스
  안내를 확인하십시오.
source: original
featured: false
from_request: true
target_pages: 1
howto:
  - 사업장 정보와 담당자를 적습니다.
  - 귀속연월과 지급연월, 지급 인원을 적습니다.
  - 총지급액과 소득세·지방소득세 납부세액을 적습니다.
  - 납부일과 납부 방법, 영수증 번호를 적습니다.
  - 신고서 세액과 대조한 뒤 담당자와 확인자가 서명합니다.
faq:
  - q: 납부 금액은 어디서 확인하나요?
    a: 지급명세서 신고서 또는 원천징수이행상황신고서의 세액과 같은지 대조해 적습니다. 기준은 제출처 안내를 확인하십시오.
  - q: 지방소득세도 함께 적나요?
    a: 소득세와 지방소득세를 나누어 적도록 칸을 두었습니다. 납부 방법과 기한은 관할 기관 안내를 확인하십시오.
  - q: 납부 후 영수증은 어떻게 하나요?
    a: 영수증 번호를 이 서식에 적고 영수증 사본과 함께 보관하면 나중에 대조하기 쉽습니다.
related: [withholding-tax-filing-poa, payslip, year-end-tax-checklist]
