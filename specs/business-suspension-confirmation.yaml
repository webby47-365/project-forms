id: business-suspension-confirmation
title: 영업 휴업 사실 확인서
category: public
subcategory: permit
tags: [휴업확인서, 영업휴업, 휴업사실확인, 휴업사유서, 사업휴업]
summary: 영업을 일정 기간 쉬고 있다는 사실과 휴업 기간·사유를 밝혀 제출처에 확인해 주는 양식입니다.
usage: >
  임대료 조정 요청, 보험·대출 심사, 거래처 안내 등에서 영업을 잠시 쉬고 있다는 사실을 문서로 보여
  줘야 할 때 쓰는 서식입니다. 상호와 사업장 주소, 휴업 시작일과 재개 예정일, 휴업 사유를 적고
  대표자가 서명합니다. 관청에 하는 휴업 신고를 대신하는 서류가 아니므로 신고가 필요한 업종은
  해당 기관에서 따로 확인하십시오. 폐업은 폐업 사실 확인서를 쓰십시오.
source: original
featured: false
target_pages: 1
howto:
  - 상호와 대표자, 사업장 주소를 적습니다.
  - 휴업 시작일과 재개 예정일을 적습니다.
  - 휴업 사유를 간단히 적습니다.
  - 제출처를 적고 대표자가 서명합니다.
faq:
  - q: 이 확인서가 휴업 신고를 대신하나요?
    a: 아닙니다. 관청 신고가 필요한 업종이면 해당 기관에 따로 신고하십시오.
  - q: 재개 예정일이 정해지지 않았으면요?
    a: 미정이라고 적고, 사유란에 재개 조건(공사 종료 등)을 함께 적으면 됩니다.
  - q: 폐업했을 때도 쓰나요?
    a: 폐업이면 영업 폐업 사실 확인서를 쓰는 편이 맞습니다.
related: [business-closure-confirmation, gov-business-closure-report, business-closure-poa, business-registration-change-poa]
blocks:
  - type: doc_title
    text: 영업 휴업 사실 확인서
    spaced: false
  - type: subtitle
    text: 1. 사업장 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["상호", "", "대표자", ""]
      - ["업종", "", "연락처", ""]
      - ["사업장 주소", "", "", ""]
    sample_rows:
      - ["", "한빛식당", "", "홍길동"]
      - ["", "음식점업", "", "010-1234-5678"]
      - ["", "서울시 중구 세종대로 1길 10 1층", "", ""]
  - type: subtitle
    text: 2. 휴업 내용
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [2, 1, 2, 3]
    rows:
      - ["휴업 시작일", "", "재개 예정일", ""]
      - ["휴업 구분", "", "제출처", ""]
      - ["제출 목적", "", "", ""]
    sample_rows:
      - ["", "2026-10-01", "", "2026-12-01"]
      - ["", "전체 휴업", "", "임대인"]
      - ["", "임대료 조정 협의 참고용", "", ""]
  - type: textbox
    hint: "휴업하게 된 사유와 재개 조건을 사실대로 적으십시오."
    height_mm: 28
    sample_text: "주방 설비 교체 공사로 영업이 어려워 10월 1일부터 휴업 중이며 공사가 끝나는 12월 초에 영업을 재개할 예정입니다."
  - type: para
    text: 위 사업장이 위 기간 동안 영업을 하지 않고 있음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   10 월   12 일
  - type: sign_line
    labels: ["확인인(대표자)"]
    sample_names: [홍길동]
  - type: notice
    text: 관청 휴업 신고가 필요한 업종은 해당 기관에 따로 신고하십시오.
