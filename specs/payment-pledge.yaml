id: payment-pledge
title: 지급각서
category: legal
subcategory: notice
tags: [지급각서, 지불각서, 변제각서, 채무 이행각서, 분할상환 약정]
summary: 채무 금액과 변제 일정·지연 시 조치를 약속하는 지급각서 양식입니다.
usage: >
  기한 내에 갚지 못한 금전이나 손해배상금을 언제까지 어떻게 지급할지 약속하는 문서입니다.
  채무의 원인과 금액을 특정하고, 금액은 한글과 숫자를 함께 적어 변조를 막으십시오. 분할 지급인
  경우 회차별 금액과 지급일을 표에 빠짐없이 적고, 입금계좌를 명시합니다. 지급을 지체했을 때
  어떻게 되는지(기한이익 상실, 지연손해금 등)를 미리 정해 두면 분쟁을 줄일 수 있습니다.
  작성 후에는 각서인과 채권자가 각각 1부씩 보관하고, 필요하면 공증으로 증거력을 보강하십시오.
source: original
featured: false
target_pages: 1
blocks:
  - type: doc_title
    text: 지급각서
  - type: subtitle
    text: 1. 당사자
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [1, 1, 1, 3]
      - [3, 1, 3, 3]
    rows:
      - ["채권자(수령인)", "", "연락처", ""]
      - ["주소", "", "", ""]
      - ["채무자(각서인)", "", "생년월일", ""]
      - ["주소", "", "", ""]
    sample_rows:
      - ["", "홍길동", "", "010-1234-5678"]
      - ["", "서울특별시 마포구 월드컵북로 100", "", ""]
      - ["", "박민준", "", "1987-06-20"]
      - ["", "서울특별시 강남구 테헤란로 50", "", ""]
  - type: subtitle
    text: 2. 채무 내용
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 8
    merges:
      - [0, 1, 0, 3]
      - [3, 1, 3, 3]
    rows:
      - ["채무 금액", "금                                 원정 (₩                       )", "", ""]
      - ["채무 발생원인", "", "발생일자", ""]
      - ["기지급액", "", "잔여 채무액", ""]
      - ["입금계좌", "", "", ""]
    sample_rows:
      - ["", "금 삼백만원정 (₩3,000,000)", "", ""]
      - ["", "대여금 미변제", "", "2026-03-10"]
      - ["", "0원", "", "3,000,000원"]
      - ["", "한빛은행 000-000000-00-000", "", ""]
  - type: subtitle
    text: 3. 변제 일정
  - type: table
    widths: [12, 22, 22, 22, 22]
    header: [회차, 지급일, 지급금액, 잔액, 비고]
    empty_rows: 2
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "2026-10-31", "1,500,000원", "1,500,000원", "-"]
  - type: subtitle
    text: 4. 약정 사항
  - type: kv_list
    items:
      - "본인은 위 채무가 존재함을 인정하고, 위 일정에 따라 성실히 변제할 것을 약속합니다."
      - "변제를 2회 이상 지체한 경우 기한의 이익을 상실하고 잔액 전부를 즉시 지급합니다."
      - "지체한 금액에 대하여는 당사자가 합의한 지연손해금을 가산하여 지급합니다."
      - "주소나 연락처가 변경된 경우 지체 없이 채권자에게 알립니다."
  - type: textbox
    hint: "특약사항 — 담보 제공, 연대보증, 변제 순서 등 추가로 합의한 내용을 기재하십시오."
    height_mm: 20
    sample_text: 연대보증인은 채무자와 동일한 책임을 지며, 변제 순서는 회차 순으로 한다.
  - type: para
    text: 위 내용을 확인하고 이에 동의하여 본 각서를 작성합니다.
    align: center
    size: 11
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["각서인(채무자)", "연대보증인"]
    sample_names: [박민준, 이수현]
  - type: notice
    text: 본 서식은 참고용입니다. 금액이 큰 경우 공증이나 내용증명 발송으로 증거력을 보강할 수 있으며, 구체적 법률 판단은 전문가에게 확인하십시오.
