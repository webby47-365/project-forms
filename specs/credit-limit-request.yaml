id: credit-limit-request
title: 거래처 여신한도 신청서
category: corp
subcategory: sales
tags: [여신한도, 외상거래, 신용한도, 거래한도, 거래처신용]
summary: 외상 거래를 하는 거래처에 신용 한도와 결제 조건을 정하기 위해 영업 담당이 작성하는 거래처 여신한도 신청서 양식입니다.
usage: >
  외상으로 물건을 공급하기 전에 거래처별로 어디까지 외상을 줄지 정해 두는 서식입니다.
  거래처 정보와 거래 품목, 예상 월 거래액, 신청하는 한도와 결제 조건, 신청 사유를 적어 내부 결재를 받습니다.
  한도는 거래 이력과 대금 회수 실적을 보고 정하고, 한도에 가까워지면 다시 검토하십시오. 신용 조사 결과는 회사 규정에 따라 별도로 관리합니다.
source: original
featured: false
target_pages: 1
howto:
  - 거래처 상호와 담당자, 거래 시작일을 적습니다.
  - 주요 거래 품목과 예상 월 거래액을 적습니다.
  - 신청 한도, 결제 조건과 신청 사유를 적습니다.
  - 담당자 서명 후 결재란에 순서대로 받습니다.
faq:
  - q: 한도는 어떻게 정하나요?
    a: 정해진 공식은 없습니다. 예상 월 거래액과 결제 주기, 과거 대금 회수 실적을 함께 보고 회사 규정에 맞춰 정합니다.
  - q: 신규 거래처에도 한도를 주나요?
    a: 거래 이력이 없으면 낮게 시작하고 실적에 따라 올리는 방식이 흔합니다.
  - q: 담보나 보증이 필요한가요?
    a: 회사 규정에 따라 다릅니다. 필요하면 사유란에 보증 방법을 함께 적으십시오.
related: [vendor-registration, sales-contract, payment-due-extension-request, balance-confirmation]
blocks:
  - type: doc_title
    text: 거래처 여신한도 신청서
    spaced: false
  - type: subtitle
    text: 1. 거래처 정보
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["거래처 상호", "", "대표자", ""]
      - ["담당자", "", "연락처", ""]
      - ["거래 시작일", "", "주요 품목", ""]
    sample_rows:
      - ["", "한빛물산", "", "박민준"]
      - ["", "이수현", "", "010-2345-6789"]
      - ["", "2026-09-01", "", "포장 박스·완충재"]
  - type: subtitle
    text: 2. 신청 한도와 결제 조건
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["예상 월 거래액", "", "신청 한도", ""]
      - ["결제 조건", "", "적용 기간", ""]
    sample_rows:
      - ["", "12,000,000원", "", "20,000,000원"]
      - ["", "월말 마감 후 30일", "", "2026-12-01~2027-11-30"]
  - type: subtitle
    text: 3. 신청 사유
  - type: textbox
    hint: "거래 실적, 대금 회수 이력, 한도가 필요한 이유를 적으십시오."
    height_mm: 35
    sample_text: "9월부터 월 1,000만원 수준으로 거래했고 대금은 약정일에 모두 입금되었습니다. 연말 물량 증가로 한도 상향이 필요합니다."
  - type: table
    widths: [20, 40, 40]
    header: [결재, 직위·성명, 의견]
    empty_rows: 3
    row_height_mm: 9
  - type: date_line
    sample_text: 2026 년   11 월   16 일
  - type: sign_line
    labels: ["신청 담당자"]
    sample_names: [김서연]
  - type: notice
    text: 한도 승인 기준과 결재선은 회사 규정을 따릅니다.
