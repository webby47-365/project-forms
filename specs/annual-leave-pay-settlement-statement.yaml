id: annual-leave-pay-settlement-statement
title: 연차수당 정산 내역서
category: corp
subcategory: hr
tags: [연차수당정산, 미사용연차, 연차수당계산, 연차정산내역, 연차보상]
summary: 연차 발생일수·사용일수·미사용일수와 일급 기준 지급액을 한 장에 정리해 근로자에게 확인받는 정산 내역서입니다.
usage: >
  연차 사용 기간이 끝나거나 퇴직할 때 미사용 연차에 대한 수당을 정산하고 그 내역을 남기는 서식입니다.
  연차 발생일수와 사용일수, 남은 일수를 먼저 적고 일급 산정 기준과 지급액을 숫자로 분명히 씁니다.
  일급 산정 방식은 회사 규정과 근로계약에 따르므로 적용한 기준을 비고에 함께 적어 두면 분쟁을 줄입니다.
  작성 후 근로자가 확인 서명을 하고 양쪽이 한 부씩 보관합니다. 지급 의무나 금액에 대한 판단은 관련 규정과 전문가 확인이 필요합니다.
source: original
featured: false
target_pages: 1
howto:
  - 근로자 이름과 소속, 정산 기준 기간을 적습니다.
  - 연차 발생일수, 사용일수, 미사용일수를 차례로 적습니다.
  - 일급과 지급액, 지급 예정일을 적고 산정 기준을 비고에 남깁니다.
  - 근로자 확인 서명을 받고 한 부씩 보관합니다.
faq:
  - q: 일급은 어떻게 정하나요?
    a: 회사 규정과 근로계약에 따릅니다. 적용한 방식을 비고에 적어 두면 나중에 확인하기 쉽습니다.
  - q: 정산 내역서가 지급 확인서도 되나요?
    a: 아닙니다. 계산 내역을 확인하는 문서이며, 실제 지급 사실은 수령 확인서로 따로 남기는 편이 좋습니다.
  - q: 근로자 서명이 꼭 필요한가요?
    a: 법정 요건은 아니지만 내용을 확인받았다는 기록이 되므로 받아 두는 것이 안전합니다.
related: [unused-annual-leave-pay-receipt, unused-annual-leave-pay-request, annual-leave-usage-status-confirmation, payslip]
