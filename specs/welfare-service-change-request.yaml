id: welfare-service-change-request
title: 복지서비스 이용 변경 신청서
category: welfare
subcategory: consent
tags: [복지서비스변경신청서, 서비스이용변경, 이용시간변경, 서비스중단신청, 이용계획변경]
summary: 이용 중인 복지서비스의 시간·횟수·장소 등을 바꾸거나 일시 중단할 때 변경 내용과 사유를 적는 신청서입니다.
usage: >
  요양·돌봄·복지시설 등 이미 이용 중인 서비스를 조정하고 싶을 때 제공 기관에 내는 서식입니다.
  이용자와 신청인 관계, 현재 이용 내용과 바꾸고 싶은 내용, 적용 시작일을 적습니다. 일시 중단이나
  내용 변경 사유도 간단히 남깁니다. 변경 가능 여부와 본인부담금 변동은 기관과 제도 기준에 따라
  다르므로 담당자와 상담한 뒤 확정하십시오.
source: original
featured: false
target_pages: 1
howto:
  - 이용자 이름과 신청인 관계를 적습니다.
  - 현재 이용 중인 서비스 내용을 적습니다.
  - 바꾸려는 내용과 적용 시작일을 적습니다.
  - 변경 사유를 적고 신청인이 서명합니다.
faq:
  - q: 이용자 본인이 아니어도 신청할 수 있나요?
    a: 보호자나 가족이 신청할 수 있습니다. 기관이 위임 서류를 요구하는지 미리 확인하십시오.
  - q: 변경하면 본인부담금도 달라지나요?
    a: 서비스 종류와 횟수에 따라 달라질 수 있습니다. 담당자에게 변경 전에 문의하십시오.
  - q: 변경 신청 즉시 적용되나요?
    a: 기관 일정과 내부 검토 후 적용됩니다. 적용 시작일은 담당자와 협의해 정합니다.
related: [care-service-application, welfare-facility-application, welfare-facility-withdrawal-request, long-term-care-application]
blocks:
  - type: doc_title
    text: 복지서비스 이용 변경 신청서
    spaced: false
  - type: subtitle
    text: 1. 이용자와 신청인
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["이용자", "", "생년월일", ""]
      - ["신청인", "", "이용자와 관계", ""]
      - ["연락처", "", "이용 기관", ""]
    sample_rows:
      - ["", "박민준", "", "1948-03-02"]
      - ["", "홍길동", "", "자녀"]
      - ["", "010-1234-5678", "", "한빛주간보호센터"]
  - type: subtitle
    text: 2. 변경 내용
  - type: table
    widths: [22, 26, 26, 26]
    header: ["항목", "현재", "변경 후", "적용 시작일"]
    empty_rows: 4
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["이용 요일", "월·수·금", "월·목", "2026-11-02"]
      - ["이용 시간", "09:00~16:00", "09:00~14:00", "2026-11-02"]
  - type: subtitle
    text: 3. 변경 사유
  - type: textbox
    hint: "변경하려는 이유와 기관에 요청할 사항을 적으십시오."
    height_mm: 28
    sample_text: "보호자의 근무 일정이 바뀌어 이용 요일과 시간을 조정하고자 합니다. 변경 가능한 시간대를 안내해 주시기 바랍니다."
  - type: date_line
    sample_text: 2026 년   10 월    9 일
  - type: sign_line
    labels: ["신청인", "이용자"]
    sample_names: [홍길동, 박민준]
  - type: notice
    text: 변경 가능 여부와 본인부담금은 기관과 제도 기준을 확인하십시오.
