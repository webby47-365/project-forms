id: year-end-spouse-income-confirmation
title: 연말정산 배우자 소득 확인서
category: public
subcategory: family
tags: [연말정산, 배우자, 소득확인, 인적공제, 배우자공제]
summary: 연말정산에서 배우자를 부양가족으로 올릴 때 배우자의 올해 소득 내역을 직접 적어 확인하는 서식입니다.
usage: >
  배우자 공제를 받으려는 근로자가 배우자의 올해 소득 종류와 금액을 적어 담당자에게 내는 서식입니다.
  배우자 성명과 생년월일, 소득 종류별 금액을 적고 배우자가 서명합니다.
  공제 가능 여부는 소득 기준 등 요건에 따라 달라지므로 국세청 기준과 회사 안내를 확인하십시오.
  금액은 본인이 아는 범위에서 적고 주민등록번호는 적지 않습니다.
source: original
featured: false
target_pages: 1
howto:
  - 근로자와 배우자의 성명을 적습니다.
  - 배우자의 생년월일을 적습니다.
  - 소득 종류별로 올해 금액을 표에 적습니다.
  - 날짜를 적고 근로자와 배우자가 서명합니다.
faq:
  - q: 소득이 없으면 어떻게 적나요?
    a: 금액란에 0 또는 "없음"이라고 적습니다.
  - q: 정확한 금액을 모르면 어떻게 하나요?
    a: 증빙 자료로 확인한 뒤 적는 것이 안전합니다. 제출 서류는 회사 안내를 확인하십시오.
  - q: 이 서식으로 공제가 확정되나요?
    a: 아닙니다. 공제 여부는 요건에 따라 정해지니 국세청 기준과 회사 안내를 확인하십시오.
related: [year-end-dependent-income-statement, year-end-couple-dependent-allocation, year-end-tax-checklist, year-end-dependent-duplicate-check]
blocks:
  - type: doc_title
    text: 연말정산 배우자 소득 확인서
    spaced: false
  - type: subtitle
    text: 1. 인적사항
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["근로자 성명", "", "소속 부서", ""]
      - ["배우자 성명", "", "생년월일", ""]
    sample_rows:
      - ["", "박민준", "", "영업지원팀"]
      - ["", "김서연", "", "1992-04-08"]
  - type: subtitle
    text: 2. 올해 소득 내역
  - type: table
    widths: [8, 32, 30, 30]
    header: ["No", 소득 종류, 금액(원), 비고]
    empty_rows: 5
    row_height_mm: 8
    body_align: center
    sample_rows:
      - ["1", "근로소득", "0", "없음"]
      - ["2", "사업소득", "0", "없음"]
      - ["3", "기타소득", "300,000", "강연료"]
  - type: subtitle
    text: 3. 전달 사항
  - type: textbox
    hint: "소득 관련하여 알릴 내용이 있으면 적으십시오."
    height_mm: 16
    sample_text: "위 금액은 배우자가 직접 확인한 올해 소득 내역입니다."
  - type: para
    text: 위 소득 내용이 사실과 다름이 없음을 확인합니다.
    align: center
  - type: date_line
    sample_text: 2026 년   11 월   28 일
  - type: sign_line
    labels: ["근로자", "배우자"]
    sample_names: [박민준, 김서연]
  - type: notice
    text: 공제 가능 여부는 국세청 기준과 회사 안내를 확인하십시오.
