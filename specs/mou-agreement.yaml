id: mou-agreement
title: 업무협약서 (MOU)
category: legal
subcategory: contract
tags: [업무협약서, MOU, 상호협력협약, 업무제휴, 협약서]
summary: 협력 분야와 각 기관의 역할, 법적 구속력의 범위를 정하는 업무협약서(MOU) 양식입니다.
usage: >
  두 기관이나 회사가 특정 분야에서 협력하기로 뜻을 모을 때 작성하는 협약서입니다. 협력
  분야와 각 기관이 맡을 역할, 협약 기간을 구체적으로 적어야 실행 단계에서 혼선을 줄일 수
  있습니다. MOU는 일반적으로 구체적인 법적 구속력보다는 협력의 의지를 확인하는 성격이
  강하므로 본 계약이 필요한 사항은 별도의 계약서로 정하는 것이 좋습니다. 협약 과정에서
  공유한 정보의 비밀유지 범위도 함께 정해 두십시오.
source: original
featured: false
target_pages: 1
version: 1
created_by: agent
status: published

howto:
  - 협약 당사자의 명칭과 대표자를 적습니다.
  - 협력 분야와 각자가 맡을 역할을 정합니다.
  - 협약 기간과 비밀유지 범위를 정합니다.
  - 양측 대표자가 서명하고 각자 1부씩 보관합니다.

faq:
  - q: MOU도 법적 구속력이 있나요?
    a: 대체로 협력 의지를 확인하는 성격이 강하며, 구체적인 의무는 별도 계약서로 정하는 것이 좋습니다.
  - q: 협력 분야는 여러 개 적어도 되나요?
    a: 네, 협력할 분야가 여러 가지라면 항목을 나누어 구체적으로 적으면 됩니다.

blocks:
  - type: doc_title
    text: 업무협약서
  - type: para
    text: 아래 협약 당사자는 상호 협력을 위하여 다음과 같이 업무협약을 체결한다.
    align: center
    size: 10
  - type: subtitle
    text: 협약 당사자
  - type: grid
    widths: [16, 22, 18, 22, 22]
    label_cols: [0]
    row_height_mm: 8
    rows:
      - ["갑", "기관명(상호)", "", "대표자", ""]
      - ["", "주소", "", "연락처", ""]
      - ["을", "기관명(상호)", "", "대표자", ""]
      - ["", "주소", "", "연락처", ""]
    sample_rows:
      - ["", "", "(주)한빛커머스", "", "김서연"]
      - ["", "", "서울특별시 마포구 월드컵북로 100", "", "010-1234-5678"]
      - ["", "", "(주)새길데이터", "", "박민준"]
      - ["", "", "서울특별시 강남구 테헤란로 201", "", "010-5678-1234"]
  - type: article
    heading: 제1조 (협약의 목적)
    lines:
      - "본 협약은 갑과 을이 상호 보유한 자원과 역량을 바탕으로 협력 관계를 구축하여 상생 발전을 도모하는 것을 목적으로 한다."
  - type: article
    heading: 제2조 (협력 분야)
    lines:
      - "갑과 을은 다음 분야에서 협력한다: 공동 마케팅 및 판로 확대, 상품·서비스 공동 개발, 인력 및 정보 교류"
      - "협력 분야를 추가하거나 변경할 필요가 있는 경우 양측이 협의하여 정한다."
  - type: article
    heading: 제3조 (각 기관의 역할)
    lines:
      - "갑은 협력 분야에 필요한 유통망과 마케팅 자원을 제공하고, 을은 상품·기술 역량과 실무 인력을 제공한다."
      - "세부 역할과 추진 일정은 별도의 실행계획서로 정할 수 있다."
  - type: article
    heading: 제4조 (협약 기간)
    lines:
      - "본 협약의 기간은 체결일로부터 1년으로 하며, 양측이 별도의 이의가 없으면 동일한 조건으로 1년씩 자동 연장된다."
  - type: article
    heading: 제5조 (법적 구속력의 범위)
    lines:
      - "본 협약은 원칙적으로 상호 협력의 의지를 확인하는 것으로서 법적 구속력을 갖지 아니하며, 구체적인 권리의무는 당사자가 별도로 체결하는 계약서에 따른다."
      - "다만 제6조(비밀유지)는 본 협약 자체로 당사자를 구속한다."
  - type: article
    heading: 제6조 (비밀유지)
    lines:
      - "당사자는 협약 수행 중 알게 된 상대방의 영업비밀과 경영정보를 제3자에게 누설하지 아니하며, 이 의무는 협약 종료 후에도 존속한다."
  - type: article
    heading: 제7조 (협약의 변경과 해지)
    lines:
      - "본 협약의 내용은 당사자가 서면으로 합의하여 변경할 수 있으며, 어느 일방이 협약의 목적을 달성하기 어렵다고 판단하는 경우 상대방에게 서면으로 통지하여 해지할 수 있다."
  - type: date_line
    sample_text: 2026 년    9 월    13 일
  - type: sign_line
    labels: ["갑", "을"]
    sample_names: ["(주)한빛커머스 대표 김서연", "(주)새길데이터 대표 박민준"]
  - type: notice
    text: 본 협약은 상호 협력의 의지를 확인하는 것으로서 구체적 권리의무가 필요한 사항은 별도의 계약서로 정하는 것이 안전합니다.
