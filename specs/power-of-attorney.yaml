id: power-of-attorney
title: 위임장
category: legal
subcategory: notice
tags: [위임장, 대리인, 위임, 대리권, 인감위임]
summary: 위임인·수임인 정보와 위임 범위를 명시하는 범용 위임장 양식입니다.
usage: >
  관공서 민원, 금융기관 업무, 계약 체결 등을 타인에게 대리하게 할 때 사용합니다. 위임
  사항은 '일체' 같은 포괄적 표현 대신 구체적으로 특정해야 분쟁을 막을 수 있습니다.
  제출처에 따라 위임인의 인감증명서·본인서명사실확인서 첨부를 요구하므로 사전 확인이 필요합니다.
source: original
featured: true
featured_rank: 6
blocks:
  - type: doc_title
    text: 위임장
  - type: spacer
    height_pt: 4
  - type: subtitle
    text: 위임인 (본인)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "본인과의 관계", ""]
  - type: subtitle
    text: 수임인 (대리인)
  - type: grid
    widths: [16, 34, 16, 34]
    label_cols: [0, 2]
    row_height_mm: 9
    merges:
      - [1, 1, 1, 3]
    rows:
      - ["성명", "", "생년월일", ""]
      - ["주소", "", "", ""]
      - ["연락처", "", "위임인과의 관계", ""]
  - type: subtitle
    text: 위임 사항
  - type: textbox
    hint: "위임하는 업무를 구체적으로 특정하여 기재하십시오. (예: OO은행 OO지점 예금계좌 해지 신청 및 잔액 수령)"
    height_mm: 28
  - type: grid
    widths: [18, 32, 18, 32]
    label_cols: [0, 2]
    row_height_mm: 9
    rows:
      - ["위임 기간", "", "제출처", ""]
  - type: spacer
    height_pt: 4
  - type: para
    text: 본인은 위 수임인에게 위 사항에 관한 권한을 위임합니다.
    align: center
    size: 11.5
    space_after: 2
  - type: date_line
  - type: sign_line
    labels: ["위임인", "수임인"]
  - type: notice
    text: 제출처에 따라 위임인의 인감증명서 또는 본인서명사실확인서, 신분증 사본 첨부가 필요할 수 있습니다.
