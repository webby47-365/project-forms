# =====================================================================
#  [서버 작업 - GitHub Actions]  무료서식 다운로드 — 일일 서식 자동 추가
#
#  매일 08:00(KST)에 GitHub가 이 작업을 깨운다. 컴퓨터가 꺼져 있어도 동작한다.
#  Claude가 저장소 안에서 실행되므로 생성 → 검수 → 빌드 → 커밋 → 푸시가 한 번에 끝나고,
#  푸시가 deploy-pages 워크플로를 깨워 사이트에 반영된다.
#
#  절차의 정본은 scripts/agent/daily_forms_agent.md 이다. 내용을 바꿀 때는 그 문서를 고친다.
# =====================================================================
name: 일일 서식 추가

on:
  schedule:
    # cron은 UTC 기준이다. 08:00 KST = 전날 23:00 UTC.
    - cron: "0 23 * * *"
  # 시험 실행용. Actions 탭에서 [Run workflow] 로 즉시 돌려볼 수 있다.
  workflow_dispatch:

# 앞 실행이 남아 있으면 기다린다. 요청 즉시 제작(request-form.yml)과 같은 그룹이라
# 두 작업이 동시에 main에 밀어넣는 일이 없다.
concurrency:
  group: forms-pipeline
  cancel-in-progress: false

jobs:
  add-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # Claude가 커밋·푸시한다
      id-token: write   # claude-code-action의 GitHub App 인증에 필요

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 서식 생성 도구 설치
        run: |
          sudo apt-get update -qq
          # LibreOffice = DOCX→PDF 변환, poppler = 미리보기 이미지·본문 추출,
          # fonts-noto-cjk = 한글 글꼴 (없으면 PDF에서 한글이 네모로 깨진다)
          sudo apt-get install -y -qq libreoffice-writer poppler-utils fonts-noto-cjk
          pip install --quiet python-docx python-hwpx jinja2 pyyaml pillow

      - name: 한글 글꼴 대체 설정
        # 명세는 맑은 고딕(Windows 기본)을 지정한다. 리눅스에는 없으므로
        # Noto Sans CJK KR로 대체하도록 fontconfig에 알려준다.
        run: |
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <match target="pattern">
              <test name="family"><string>Malgun Gothic</string></test>
              <edit name="family" mode="assign" binding="strong">
                <string>Noto Sans CJK KR</string>
              </edit>
            </match>
            <match target="pattern">
              <test name="family"><string>맑은 고딕</string></test>
              <edit name="family" mode="assign" binding="strong">
                <string>Noto Sans CJK KR</string>
              </edit>
            </match>
          </fontconfig>
          EOF
          fc-cache -f

      - name: 설치 확인
        run: |
          soffice --version
          pdftoppm -v
          fc-list :lang=ko family | head -3

      - uses: anthropics/claude-code-action@v1
        with:
          # 구독 토큰으로 인증한다 (API 별도 과금 없음).
          # github_token을 넘기지 않아야 Claude GitHub App으로 푸시되고,
          # 그래야 deploy-pages 워크플로가 이어서 깨어난다.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 실행 로그에 Claude의 작업 내용을 전부 남긴다. 시범 운영 동안 문제를 잡기 위한 것으로,
          # 안정되면 이 줄을 지워도 된다. 비밀값(Secrets)은 이 설정과 무관하게 가려진다.
          show_full_output: true
          prompt: |
            저장소의 scripts/agent/daily_forms_agent.md 를 먼저 읽고, 그 절차를 그대로 수행하라.
            오늘 날짜(KST) 기준으로 신규 서식을 추가하고, 검증까지 통과시킨 뒤 커밋·푸시로 마무리한다.
            작업 요약은 한국어로 남긴다.
          claude_args: |
            --max-turns 120
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

  # 워크플로 안에서 만든 푸시로는 GitHub가 다른 워크플로(deploy-pages)를 깨우지 않는다.
  # 그래서 배포를 여기서 직접 끝낸다. deploy-pages.yml과 같은 내용이며,
  # 사람이 푸시했을 때는 지금처럼 deploy-pages.yml이 맡는다.
  deploy:
    needs: add-forms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Pages 배포는 저장소 전체에서 한 번에 하나만 돈다 — deploy-pages.yml과 같은 그룹을 쓴다
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # add-forms가 방금 푸시한 커밋을 받아야 하므로 SHA가 아닌 main을 지정한다
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 사이트 생성
        run: python scripts/build_site.py

      - name: 커스텀 도메인 지정 (CNAME)
        run: if [ -f CNAME ]; then cp CNAME public/CNAME; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
