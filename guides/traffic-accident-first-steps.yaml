faq:
  - q: 차량만 파손된 경미한 사고도 경찰에 꼭 신고해야 하나요?
    a: 도로에서의 위험 방지를 위한 조치를 이미 마쳤다면 신고를 생략할 수 있지만, 상대방과 다툼의 소지가 있으면 신고해 두는 편이 안전합니다.
  - q: 과실비율에 동의하지 않으면 어떻게 하나요?
    a: 서둘러 합의하지 말고 블랙박스 영상 등 근거자료를 정리해 보험사에 이의를 제기하거나 관련 분쟁심의 절차를 알아볼 수 있습니다.
  - q: 대물배상 한도를 넘는 수리비는 누가 부담하나요?
    a: 가입한 보험의 대물배상 한도를 넘는 손해는 가해자가 추가로 부담해야 할 수 있습니다.
  - q: 합의 후에 다친 곳이 새로 발견되면 어떻게 하나요?
    a: 합의 당시 예상하지 못한 후유증이 새로 확인되면 추가 배상을 다시 논의할 수 있는 경우가 있으므로 진료 기록을 보관해 두어야 합니다.

