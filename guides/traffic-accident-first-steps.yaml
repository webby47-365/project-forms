slug: traffic-accident-first-steps
status: published
group: life
title: 교통사고 났을 때 처음 해야 할 일 순서
description: 교통사고 직후 현장에서 확인할 것부터 신고·보험 접수·합의까지 순서대로 정리합니다. 대인·대물 보상 한도와 과실비율이 정해지는 방식도 함께 안내합니다.
summary: >
  교통사고가 나면 **정차해 사상자를 구호하고 인적사항을 교환한 뒤 신고하는 것**이
  우선입니다(도로교통법 제54조). 대물배상은 사고 1건당 **2천만원**, 대인배상(사망)은
  **1억5천만원 범위**(최소 2천만원)에서 보상되며, 과실비율은 보험사 협의나 법원
  판단으로 정해집니다.
keywords: [교통사고 대처, 교통사고 신고, 교통사고 현장확인서, 과실비율, 대인배상, 대물배상, 교통사고 합의서]
created_at: 2026-09-17
updated_at: 2026-09-17
basis_date: 2026-09-17
show_on: [traffic-accident-confirmation, car-accident-settlement]

sections:
  - h: 1. 사고 직후 가장 먼저 할 일
    body: |
      교통사고가 나면 가장 먼저 할 일은 **정차하여 다친 사람이 있는지 확인하고 구호하는
      것**입니다. 도로교통법 제54조는 교통사고를 낸 운전자에게 즉시 정차해 사상자를
      구호하고, 상대방에게 성명·전화번호·주소 같은 인적사항을 알려주도록 정하고 있습니다.

      이어서 경찰공무원이 현장에 있으면 그 경찰관에게, 없으면 가장 가까운 경찰관서에
      사고 장소와 사상자 수·부상 정도, 손괴한 물건과 정도를 지체 없이 신고해야 합니다.
      다만 차량만 손괴되고 도로에서의 위험 방지를 위한 조치를 이미 마쳤다면 신고를
      생략할 수 있습니다.

  - h: 2. 상대방과 현장에서 확인할 것
    body: |
      신고와 구호 조치를 마쳤다면 상대방과 함께 사고의 사실관계를 기록해 둡니다.
      차량번호와 보험사·증권번호, 운전자 연락처를 서로 확인하고, 사고 일시와 장소,
      진행 방향과 충돌 지점을 적어 둡니다. 이때 [교통사고 현장확인서](/form/traffic-accident-confirmation/)를
      쓰면 나중에 기억이 엇갈리는 것을 줄일 수 있습니다.

      목격자가 있으면 연락처를 받아 두고, 현장 사진과 블랙박스 영상도 함께 남겨 둡니다.
      이 서식은 사실관계만 기록하는 용도이며, 과실비율이나 책임 소재를 현장에서
      단정하지 않는 것이 원칙입니다.

  - h: 3. 보험 접수와 대인·대물 보상 한도
    body: |
      자동차를 운행하려면 자동차손해배상 보장법에 따라 대인배상·대물배상 책임보험에
      반드시 가입해야 하며, 미가입 차량은 도로를 운행할 수 없습니다. 사고가 나면
      각자 가입한 보험사에 접수하고, 접수 번호와 담당자 연락처를 받아 둡니다.
    table:
      head: [구분, 보상 한도]
      rows:
        - ["대인배상(사망)", "1억5천만원 범위(최소 2천만원)"]
        - ["대인배상(부상·후유장해)", "시행령 별표 1·2가 정하는 금액 범위"]
        - ["대물배상", "사고 1건당 2천만원 범위"]
    list:
      - 대물배상 한도를 넘는 손해는 가해자가 추가로 부담해야 할 수 있습니다.
      - 렌트비·수리비 등 세부 지급 기준은 보험사 약관에 따라 다릅니다.
      - 대인배상Ⅰ(책임보험) 한도를 넘는 손해는 대인배상Ⅱ(임의보험)에 가입되어 있어야 추가로 보상됩니다.
      - 내 차량의 수리비는 별도로 가입한 자기차량손해(자차) 담보가 있어야 보상됩니다.

  - h: 4. 과실비율은 누가, 어떻게 정하나
    body: |
      과실비율은 사고 당사자가 그 자리에서 임의로 정하는 것이 아니라 보험사 간 협의나
      법원의 판단으로 정해지는 것이 일반적입니다. 손해보험업계는 사고 유형별 과실비율
      인정기준을 마련해 두고 있어 비슷한 사고 사례를 참고할 수 있지만, 실제 비율은
      사고 당시의 구체적인 정황에 따라 달라질 수 있습니다.

      보험사가 제시한 과실비율에 동의하기 어렵다면 서둘러 합의하지 말고, 블랙박스
      영상 같은 자료를 근거로 이의를 제기하거나 손해보험협회의 과실비율 분쟁심의
      절차를 알아보는 방법을 검토할 수 있습니다.

  - h: 5. 합의서를 쓰기 전에 확인할 점
    body: |
      경미한 물적 사고는 당사자끼리 합의로 마무리하는 경우가 많습니다. 합의서에는
      사고 경위와 피해 정도, 합의금액과 지급 방법을 구체적으로 적고, 합의 이후에는
      추가 청구를 하지 않는다는 조항이 들어가는 경우가 일반적이므로 서명 전에 금액과
      조건을 다시 한번 확인해야 합니다. [교통사고 합의서](/form/car-accident-settlement/)
      서식에 필요한 항목이 정리되어 있습니다.

      다만 사람이 다친 사고라면 이 단계에서 서둘러 합의하지 않는 것이 좋습니다.
      치료가 끝나기 전에 합의하면 이후 확인되는 후유증에 대한 배상을 받기 어려울
      수 있습니다.

  - h: 6. 수리비 견적과 렌트 처리
    body: |
      차량 손상이 있다면 정비업체 두세 곳에서 수리비 견적을 받아 비교하는 것이
      좋습니다. [견적서](/form/quotation/) 서식으로 업체별 금액과 수리 항목을 정리해
      두면 보험사와 협의할 때 근거 자료로 쓸 수 있습니다.

      렌트카가 필요한 기간에는 상대방 보험사의 대차료 지급 기준(차종·기간)을 미리
      확인해 두면 나중에 정산 과정에서 불필요한 다툼을 줄일 수 있습니다.

  - h: 7. 인적 피해가 있는 사고라면
    body: |
      사람이 다친 사고는 물적 사고와 다르게 처리해야 합니다. 부상 정도와 관계없이
      즉시 병원 진료를 받고 진단서를 보관하며, 치료가 끝나기 전까지는 최종 합의를
      미루는 것이 안전합니다. 필요하다면 손해사정사나 변호사 등 전문가의 상담을
      먼저 받아 보십시오.

      치료가 길어지면 보험사에서 먼저 합의를 제안하는 경우가 있는데, 향후치료비나
      휴업손해 등 추가로 발생할 수 있는 손해 항목을 진단서와 함께 확인한 뒤 합의
      여부를 결정하는 것이 좋습니다. 진단서·영수증·통원확인서 같은 서류는 사본을
      만들어 원본과 따로 보관해 두면 분실을 막을 수 있습니다.

