slug: gift-limit-compliance
status: draft
group: life
title: 청탁금지법 선물 가액기준과 거래처 선물 신고 기준
description: 명절이나 행사 때 거래처·이해관계자에게서 받은 선물을 얼마까지 받아도 되는지, 청탁금지법 가액기준과 회사 신고 절차를 정리합니다.
summary: 청탁금지법상 허용되는 가액기준은 음식물 **5만원**, 선물 **5만원**(농수산물·농수산가공품은 설·추석 전후 **30만원**, 평시 **15만원**), 경조사비 **5만원**(화환·조화 **10만원**)입니다. 이 법은 공무원 등 **공직자등**에게 적용되지만, 많은 민간기업도 같은 기준을 사내 신고 기준으로 준용합니다.
keywords: [청탁금지법 선물, 청탁금지법 가액기준, 김영란법 선물 한도, 거래처 선물 신고, 선물 수령 신고서, 청탁금지법 적용대상]
created_at: 2026-09-23
updated_at: 2026-09-23
basis_date: 2026-09-23
show_on: [gift-receipt-report]
sections:
  - h: 1. 청탁금지법, 우리 회사에도 적용될까요
    body: |
      청탁금지법(부정청탁 및 금품등 수수의 금지에 관한 법률)은 공무원, 공직유관단체·공공기관
      임직원, 각급 학교와 학교법인 임직원, 언론사 임직원 등 **공직자등**에게 적용됩니다.
      순수하게 사기업과 사기업 사이에서 오가는 선물은 이 법의 직접 적용 대상이 아닙니다.

      다만 거래처 담당자가 공공기관이나 학교, 언론사 소속이라면 이야기가 다릅니다. 가액기준을
      넘는 선물을 주고받으면 제공자·수령자 모두 법 위반이 될 수 있으므로, 명절 선물을
      준비하거나 받았을 때는 상대방의 소속부터 확인하는 것이 순서입니다.

      상대가 순수 민간기업 소속이라 법이 직접 적용되지 않더라도, 많은 회사가 내부 윤리규정에
      이 법의 가액기준을 그대로 준용해 임직원의 선물 수수 신고 기준으로 삼고 있습니다.
      부패 리스크를 관리하고 특정 거래처와의 유착 오해를 예방하기 위해서입니다.
  - h: 2. 가액기준 — 얼마까지 받아도 되나요
    body: |
      청탁금지법 시행령은 원활한 직무수행, 사교·의례, 부조 목적으로 제공되는 금품에 한해
      아래 금액 이내는 허용되는 것으로 정하고 있습니다. 목적이 이를 벗어나거나(예: 계약·인허가를
      잘 봐달라는 취지) 금액이 기준을 넘으면, 기준 이하라도 허용되지 않을 수 있습니다.
    table:
      head: [구분, 가액기준]
      rows:
        - ["음식물", "5만원"]
        - ["선물(일반)", "5만원"]
        - ["선물(농수산물·농수산가공품, 설·추석 전후 기간)", "30만원"]
        - ["선물(농수산물·농수산가공품, 그 외 기간)", "15만원"]
        - ["경조사비(축의금·조의금)", "5만원"]
        - ["경조사비(화환·조화)", "10만원"]
  - h: 3. 기준을 넘는 선물을 받았다면
    body: |
      가액기준을 넘거나 목적이 불분명한 선물을 받았다면 반환하는 것이 원칙입니다. 상대와의
      관계 때문에 그 자리에서 돌려주기 어려웠다면, 회사(또는 소속 기관)의 감사·윤리 담당
      부서에 그 사실을 알리고 처리 방법을 안내받아야 합니다.

      민간기업 임직원이라도 사내 윤리규정에 신고 절차가 있다면 총무·감사 부서에
      [금품 등 수령신고서](/form/gift-receipt-report/)를 작성해 제출하는 것이 안전합니다.
      신고 기록을 남겨 두면 나중에 특정 거래처와의 유착 의혹이 제기되더라도 정상적으로
      처리했음을 소명할 수 있습니다.

      신고를 미루다가 시일이 지나면 수령 경위가 기억나지 않아 소명이 어려워지므로,
      선물을 받은 그 주 안에 신고서를 작성해 두는 것이 좋습니다. 여러 명이 함께 받은
      선물이라면 대표로 받은 사람 1명이 신고하고 나머지는 처리 방안에만 참여해도 됩니다.
  - h: 4. 신고서 작성 순서
    body: |
      신고서를 쓸 때는 먼저 선물을 준 사람(거래처 담당자 등)의 소속과 관계를 적고, 언제
      어떤 품목을 얼마만큼 받았는지 수령 내역을 정리합니다. 정확한 구매가를 모르면 통상
      거래가격을 기준으로 대략적인 금액을 적으면 됩니다.

      이어서 반환·공용 사용·기증 중 어떤 방식으로 처리할지 정하고, 처리일자와 사유를
      함께 남깁니다. 마지막으로 부서장 등 확인자의 서명을 받아 제출하면 신고 절차가
      끝납니다.
  - h: 5. 처리 방안은 이렇게 정합니다
    body: |
      돌려주기 어려운 선물은 무조건 개인이 갖기보다 처리 방안을 정해 두는 편이 뒤탈이
      없습니다. 실무에서 흔히 쓰는 방식은 다음과 같습니다.
    list:
      - 반환 — 상대방에게 사유를 설명하고 돌려줍니다.
      - 공용 사용 — 다과·생활용품처럼 나눠 쓸 수 있는 품목은 부서 공용으로 사용합니다.
      - 기증 — 사회복지시설 등에 기증하고 기증확인서를 보관합니다.
      - 폐기 — 부패하기 쉬운 음식물 등은 처리 경위를 기록한 뒤 폐기합니다.
  - h: 6. 사내 신고 기준을 정할 때 고려할 점
    body: |
      민간기업은 청탁금지법의 적용을 직접 받지 않더라도, 거래처와의 유착을 막고 임직원을
      보호하기 위해 자체 윤리규정에 신고 기준을 두는 경우가 많습니다. 이때 청탁금지법의
      가액기준을 그대로 가져오면 별도로 금액을 정하는 논의 없이 실무에 바로 적용할 수
      있다는 장점이 있습니다.

      다만 업종에 따라 관행이 다를 수 있으므로, 기준을 정할 때는 구매·영업 등 거래처
      접촉이 잦은 부서의 의견을 함께 들어 현실적인 수준으로 정하는 것이 좋습니다. 기준을
      정했다면 임직원 모두가 알 수 있도록 사내 공지나 취업규칙에 명시해 두어야 신고
      누락을 줄일 수 있습니다.

      기준 금액 자체보다 더 중요한 것은 **일관된 적용**입니다. 특정 부서나 직급만
      예외를 두면 신고 제도에 대한 신뢰가 떨어지므로, 기준은 전 임직원에게 동일하게
      적용하는 것이 원칙입니다. 신고 대상과 예외를 명확히 정해 두어야 담당자가
      매번 판단을 고민하지 않고 신고서를 작성할 수 있습니다.
