faq:
  - q: 거래처가 민간기업이면 신고 안 해도 되나요?
    a: 청탁금지법상 신고 의무는 없지만, 사내 윤리규정에 신고 절차가 있다면 그 규정에 따라 신고하는 것이 안전합니다.
  - q: 명절에 여러 거래처에서 선물을 받으면 어떻게 하나요?
    a: 제공자별로 나누어 각각 신고서를 작성하는 것이 원칙입니다.
  - q: 금액을 정확히 모르면 어떻게 적나요?
    a: 영수증이 없다면 구매가나 통상 거래가격을 기준으로 대략적인 금액을 적으면 됩니다.
  - q: 화환은 선물과 같은 기준이 적용되나요?
    a: 화환·조화는 경조사비 항목으로 분류되어 10만원까지 허용됩니다.
