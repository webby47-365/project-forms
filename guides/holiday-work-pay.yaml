title: 명절 연휴 근무 시 휴일근로수당 계산법과 대체휴무
description: 설날·추석 당일 출근하면 얼마를 더 받는지, 우리 회사에도 적용되는지, 대신 쉬기로 하는 휴일대체는 어떻게 하는지 근로기준법 기준으로 정리했습니다.
summary: >-
  상시 5인 이상 사업장에서 관공서 공휴일(설날·추석 포함)에 근무하면 **8시간 이내는 통상임금의
  50%, 초과분은 100%를 가산**해 받습니다. 시급제는 하루 8시간 근무 시 통상 **시급의 250%**,
  월급제는 월급 외에 **150%를 추가로** 받는 것이 일반적입니다. 5인 미만 사업장은 이 가산 규정이
  적용되지 않습니다.
keywords: [휴일근로수당, 명절 연휴 근무, 공휴일 가산수당, 대체휴무, 휴일대체, 관공서의 공휴일에 관한 규정, 추석 근무수당]
created_at: 2026-09-17
updated_at: 2026-09-21
basis_date: 2026-09-21
show_on: [overtime-application, leave-request]

sections:
  - h: 1. 명절에 근무하면 얼마를 더 받나
    body: |
      설날·추석 당일이 유급휴일로 지정된 사업장에서 근무했다면, **근로기준법 제56조 제2항**에
      따라 8시간 이내 근무는 통상임금의 50%를, 8시간을 초과하는 근무는 100%를 가산해서 받습니다.
      다만 실제로 손에 쥐는 금액은 임금 지급 방식에 따라 다릅니다. 시급제·일급제 근로자는 원래
      쉬어도 받는 유급휴일수당(100%)에 실제 근로 대가(100%)와 가산분(50%)이 더해져, 하루
      8시간을 일하면 통상 시급의 250%를 받습니다. 월급제 근로자는 월급 안에 유급휴일분이 이미
      포함되어 있으므로, 근로 대가와 가산분을 더한 150%만 별도로 추가 지급받는 것이 일반적입니다.

  - h: 2. 우리 회사도 명절 연휴가 유급휴일인가
    body: |
      모든 회사가 처음부터 명절 연휴를 유급휴일로 챙겨준 것은 아닙니다. **근로기준법 제55조
      제2항**과 **시행령 제30조 제2항**에 따라 설날·추석 등 「관공서의 공휴일에 관한 규정」의
      공휴일과 대체공휴일이 민간기업에도 유급휴일로 확대 적용됐고, 사업장 규모별로 시행 시기가
      달랐습니다. 상시근로자 5인 미만 사업장은 이 규정 자체가 적용되지 않아 명절 근무를 해도
      법적으로 가산수당을 받을 권리는 없고, 회사 내규나 근로계약으로 별도로 정한 경우에만
      지급됩니다.
    table:
      head: [사업장 규모, 유급휴일 적용 시작]
      rows:
        - ["300인 이상·공공기관", "2020-01-01"]
        - ["30인~299인", "2021-01-01"]
        - ["5인~29인", "2022-01-01"]
        - ["5인 미만", "적용 제외(법정 가산수당 의무 없음)"]

  - h: 3. 시급제·월급제 계산 예시
    body: |
      2026년 최저임금인 시간급 10,320원을 받는 근로자가 추석 당일 8시간을 근무했다면,
      10,320원 × 8시간 × 250% = **206,400원**을 그날 근로의 대가로 받습니다. 통상시급이
      15,000원인 월급제 근로자가 같은 조건으로 8시간을 근무했다면, 월급과 별도로
      15,000원 × 8시간 × 150% = **180,000원**을 추가로 받는 것이 일반적입니다. 8시간을
      넘겨 일했다면 넘는 시간에 대해서는 가산율이 100%로 올라가므로 초과분은 나눠서
      계산해야 합니다. 근무 시간이 밤 10시부터 다음 날 오전 6시 사이에 걸쳐 있다면
      야간근로 가산(통상임금의 50%)이 휴일근로 가산과 별도로 함께 붙습니다(근로기준법
      제56조 제3항). 명절 당일 저녁까지 이어지는 근무라면 이 부분도 빠뜨리지 말고
      확인해야 합니다.
    list:
      - "시급제·일급제: 시급 × 근로시간 × 250%(8시간 이내)"
      - "월급제: 시급 × 근로시간 × 150%(8시간 이내, 월급과 별도 추가분)"
      - "8시간 초과분: 시급 × 초과시간 × 200%(월급제는 100%만 추가)"
      - "밤 10시~오전 6시 근무: 위 가산에 야간근로 가산 50%를 별도로 더함"

  - h: 4. 근무 대신 다른 날 쉬기로 했다면 — 휴일대체
    body: |
      회사 사정으로 명절에 근무해야 한다면 **근로자대표와 서면으로 합의**해 다른 근로일을
      대체휴일로 지정할 수 있습니다(시행령 제30조 제2항). 이 경우 대체된 날에 정상적으로
      쉬면 별도의 휴일근로 가산수당 없이 통상 근무로 처리되는 것이 일반적이지만, 사전에
      특정한 근로일을 정해 서면으로 합의해 두지 않았다면 휴일대체로 인정받기 어려울 수
      있습니다. 개인 연차를 당겨 쓰는 것과는 다른 제도이므로 [휴가신청서](/form/leave-request/)로
      개인 연차를 쓰는 것인지, 회사 차원의 휴일대체인지 먼저 구분해서 안내받는 것이 좋습니다.

  - h: 5. 수당을 못 받았다면
    body: |
      명절에 근무하고도 가산수당을 받지 못했다면 사업장 관할 노동청에 임금체불 진정을 제기할
      수 있습니다. 진정 전에 근무 사실을 남겨 두는 것이 중요하므로, 근무 전에
      [연장·휴일근로 신청서](/form/overtime-application/)로 근무 일시와 시간을 기록해 두면
      나중에 실제 근무 여부를 다투는 상황을 줄일 수 있습니다. 급여명세서에 가산수당이
      제대로 반영됐는지도 함께 확인하십시오. 근무 지시 문자나 메신저 대화, 출입 기록처럼
      실제로 일했다는 사실을 뒷받침할 자료를 함께 모아 두면 진정 절차에서 근무 사실을
      다시 증명해야 하는 수고를 줄일 수 있습니다.

  - h: 6. 이번 명절, 미리 챙겨야 할 서류
    body: |
      명절 근무가 예정돼 있다면 근무 전에 [연장·휴일근로 신청서](/form/overtime-application/)로
      결재를 받아 두고, 대체휴무나 개인 연차로 쉬기로 했다면
      [연차사용계획서](/form/annual-leave-plan/)나 [휴가신청서](/form/leave-request/)로 일정을
      미리 확정해 두는 것이 좋습니다. 근무 여부와 대체 방식을 문서로 남겨 두면 수당 계산이나
      대체휴일을 둘러싼 다툼을 줄일 수 있습니다.

