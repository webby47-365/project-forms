faq:
  - q: 대체공휴일도 유급휴일에 포함되나요?
    a: 네. 관공서의 공휴일에 관한 규정의 공휴일뿐 아니라 그에 따른 대체공휴일도 함께 적용됩니다.
  - q: 아르바이트생도 명절 가산수당을 받나요?
    a: 상시 5인 이상 사업장이라면 고용 형태와 관계없이 근로기준법 제56조가 적용되는 것이 일반적입니다.
  - q: 연차를 대신 쓰라고 하면 따라야 하나요?
    a: 회사가 정한 휴일대체와 근로자 개인의 연차 사용은 다른 제도이므로, 회사 지시라면 어떤 제도로 처리하는지 먼저 확인하는 것이 좋습니다.
  - q: 5인 미만 사업장은 아예 못 받나요?
    a: 법적으로 가산수당 지급 의무는 없지만, 근로계약서나 회사 내규에 별도로 정했다면 그에 따라 받을 수 있습니다.

