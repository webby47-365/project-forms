faq:
  - q: 카카오톡 대화만 있어도 빌려준 걸 증명할 수 있나요?
    a: 금액과 갚겠다는 내용이 대화에 분명하고 이체 내역이 맞으면 유력한 증거가 됩니다. 다만 금액·기한이 모호하면 다툼이 생기므로, 대화가 있더라도 차용증을 따로 받아 두는 것이 안전합니다.
  - q: 차용증에 도장 없이 서명만 해도 되나요?
    a: 됩니다. 법은 계약 방식을 정하지 않으므로 자필 서명으로 충분합니다. 오히려 필적이 남는 자필 서명이 본인 확인에 유리합니다.
  - q: 이자를 연 24%로 정했는데 무효인가요?
    a: 계약 전체가 무효가 되는 것은 아니고, 연 20%를 넘는 부분의 이자 약정만 무효입니다. 원금과 연 20% 이내의 이자는 청구할 수 있습니다.
