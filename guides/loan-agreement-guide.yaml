slug: loan-agreement-guide
status: published
group: contract
title: 차용증 작성법 — 돈 빌려줄 때 꼭 넣을 항목
description: 개인 간 돈거래에서 차용증에 반드시 적어야 할 금액·변제기일·이자·지연손해금 항목과 이자제한법 최고이자율, 계좌이체·공증으로 증거를 남기는 방법, 못 받았을 때의 순서를 정리했습니다.
summary: 차용증에는 **빌려준 사람·빌린 사람, 금액(한글·숫자 병기), 빌려준 날, 갚을 날, 이자와 지급 방법, 늦게 갚을 때의 지연손해금, 서명**을 적습니다. 개인 간 이자도 **연 20%**(이자제한법)를 넘을 수 없고, 돈은 반드시 계좌이체로 보내 증거를 남기는 것이 안전합니다. 갚지 않으면 내용증명 → 지급명령·소송 순으로 진행합니다.
keywords: [차용증 작성법, 차용증 양식, 개인 간 돈거래, 이자제한법 최고이자율, 차용증 공증, 대여금 반환]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
sections:
  - h: 1. 차용증이 필요한 이유
    body: |
      개인 간 금전 대여는 말로만 해도 계약이 성립합니다. 문제는 **돈을 준 사실은 이체 내역으로 남아도, 그 돈이 빌려준 것인지 준 것인지는 남지 않는다**는 점입니다. 상대가 "선물로 받았다", "투자금이었다"고 주장하면 빌려준 사람이 대여 사실을 입증해야 합니다.

      차용증은 이 다툼을 막는 가장 간단한 문서입니다. 금액이 작거나 가족·친구 사이일수록 나중에 관계를 지키기 위해서라도 한 장 남겨 두는 것이 좋습니다. 조건이 간단하면 [차용증 간편형](/form/loan-note-simple/), 이자·지연손해금까지 정하려면 [차용증(금전소비대차계약서)](/form/loan-agreement/)을 씁니다.
  - h: 2. 반드시 넣어야 하는 항목
    table:
      head: [항목, 작성 요령]
      rows:
        - [당사자, "빌려준 사람(채권자)·빌린 사람(채무자)의 이름, 주소, 연락처, 생년월일"]
        - [차용 금액, "**일금 삼백만원정(₩3,000,000)** 처럼 한글과 숫자를 함께 적어 고쳐 쓰기를 막음"]
        - [빌려준 날·방법, "지급일과 계좌이체 사실(은행·계좌 끝자리)"]
        - [변제기일, "한 번에 갚을지, 매월 나눠 갚을지와 날짜"]
        - [이자, "연 몇 %, 매월 며칠에 지급하는지. 무이자면 '이자 없음'이라고 명시"]
        - [지연손해금, "변제기일을 넘기면 적용할 이율"]
        - [기한이익 상실, "이자를 2회 이상 밀리면 남은 원금 전부를 즉시 갚는다는 조항"]
        - [서명·날인, "양쪽 모두 자필 서명. 도장이 없으면 서명만으로도 유효"]
    body: |
      주민등록번호는 적지 않아도 차용증의 효력에는 문제가 없습니다. 상대를 특정할 수 있도록 이름·생년월일·주소를 적으면 충분하고, 유출 위험도 줄어듭니다. 도장이 필요하면 [디지털 도장 만들기](/tools/stamp/)로 이미지를 만들어 넣을 수 있지만, 분쟁에 대비하려면 **자필 서명**을 함께 받아 두는 편이 확실합니다.
  - h: 3. 이자는 연 20%를 넘을 수 없다
    body: |
      이자제한법에 따라 금전대차의 최고이자율은 **연 20%** 입니다. 이를 넘는 부분의 이자 약정은 무효이고, 이미 받은 초과 이자는 원금에 충당되거나 돌려줘야 합니다. 선이자를 떼고 빌려주면 실제 받은 금액을 원금으로 보고 이자율을 다시 계산합니다.

      이자를 정하지 않았다면 개인 간 대여에서는 이자를 청구할 수 없습니다. 다만 갚기로 한 날을 넘기면 그때부터는 지연손해금을 청구할 수 있으므로, 무이자 대여라도 변제기일은 반드시 적어 두십시오.
    list:
      - 가족 간 큰 금액을 무이자로 빌려주면 이자 상당액이 증여로 판단될 수 있습니다. 금액이 크면 세무 상담을 먼저 받으십시오.
      - 이자를 받으면 이자소득이 생깁니다(비영업대금의 이익).
  - h: 4. 증거를 남기는 방법 — 이체·보증·공증
    body: |
      돈은 **현금이 아니라 계좌이체**로 보내고, 이체 메모에 "차용금"이라고 적어 두십시오. 빌린 사람 본인 명의 계좌로 보내는 것이 원칙입니다. 다른 사람 계좌로 보내 달라고 하면 그 사실도 차용증에 적습니다.

      상대의 상환 능력이 걱정되면 보증인을 세울 수 있습니다. 보증은 보증인이 **서면에 기명날인하거나 서명해야** 효력이 생기므로, 보증인 칸이 있는 [차용증(연대보증 포함)](/form/loan-note-guaranteed/)을 쓰고 보증 한도 금액을 적습니다.

      금액이 크다면 공증사무소에서 **금전소비대차 공정증서**를 만드는 방법이 있습니다. "갚지 않으면 강제집행을 받아도 이의가 없다"는 문구가 들어간 공정증서는 소송 없이 바로 강제집행을 신청할 수 있어 회수 기간이 크게 줄어듭니다.
  - h: 5. 갚지 않을 때의 순서
    body: |
      변제기일이 지나도 갚지 않으면 먼저 **내용증명**으로 지급을 요구합니다. 내용증명 자체에 강제력은 없지만, 언제 무엇을 요구했는지 공적으로 남아 이후 절차의 증거가 되고 상대에게 심리적 압박이 됩니다. [대여금 반환청구 내용증명](/form/certified-notice-loan/)에 원금·이자·기한을 적어 보냅니다.

      그래도 응하지 않으면 법원에 **지급명령**을 신청하거나 **소액사건**(3,000만원 이하) 절차로 소송을 제기합니다. 상대가 지급명령에 2주 안에 이의를 하지 않으면 확정판결과 같은 효력이 생깁니다.
    list:
      - "개인 간 대여금 채권의 소멸시효는 **10년**입니다(민법 제162조). 상인 간 거래 등 상사채권은 5년입니다."
      - 일부라도 갚거나 채무를 인정하는 메시지를 받으면 시효가 새로 시작됩니다.
  - h: 6. 빌린 사람이 챙길 것 — 영수증과 차용증 돌려받기
    body: |
      돈을 갚는 쪽도 기록이 필요합니다. 민법 제474조에 따라 변제하는 사람은 돈을 받은 사람에게 **영수증**을 달라고 요구할 수 있고, 전부 갚았다면 제475조에 따라 **차용증(채권증서)을 돌려 달라고** 할 수 있습니다. 차용증이 상대에게 남아 있으면 다 갚은 뒤에도 다시 청구받는 분쟁이 생길 수 있습니다.

      나눠 갚을 때는 매번 계좌이체로 보내고 메모에 "차용금 ○회차 상환"이라고 적습니다. 마지막 상환 후에는 원금과 이자를 모두 받았다는 확인 문자를 받아 두십시오.
