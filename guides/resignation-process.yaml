slug: resignation-process
status: published
group: quit
title: 사직서 제출부터 퇴사까지 절차 총정리
description: 퇴사 의사를 밝히는 시점, 회사가 사직서를 받아주지 않을 때의 효력 발생일, 인수인계와 퇴직금·4대보험·실업급여까지 퇴사 전후에 챙길 일을 순서대로 정리했습니다.
summary: 퇴사는 **사직 의사 전달 → 퇴사일 합의 → 인수인계 → 금품 정산** 순서로 진행합니다. 회사가 사직서를 수리하지 않아도 민법 제660조에 따라 통보 후 1개월(월급제는 통보한 달의 다음 달이 끝난 뒤)이 지나면 효력이 생기고, 퇴직금·미지급 임금은 퇴사일부터 **14일 이내**에 받아야 합니다.
keywords: [사직서 제출, 퇴사 절차, 퇴사 통보 기간, 사직서 수리 거부, 퇴사 전 준비, 퇴직금 지급 기한]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
show_on: [resignation-letter, resignation-simple, retirement-application, handover-report, asset-handover, /tools/severance/, /tools/retirement-tax/]
sections:
  - h: 1. 퇴사 의사는 언제, 어떻게 알려야 하나
    body: |
      법에 "퇴사 몇 일 전에 알려야 한다"는 일률적인 기준은 없습니다. 다만 대부분의 회사가 취업규칙이나 근로계약서에 **30일 전 통보**를 적어 두고 있고, 후임 채용과 인수인계에 시간이 필요하므로 한 달 전에 알리는 것이 무난합니다.

      먼저 직속 상사에게 말로 알리고, 퇴사일이 정해지면 [사직서](/form/resignation-letter/)를 제출해 서면으로 남기는 것이 좋습니다. 사직서에는 퇴사 희망일과 사유를 적되, 사유는 "개인 사정" 정도로 간단히 써도 됩니다. 회사와 다툼이 있어 실업급여를 받을 가능성이 있다면 사유를 사실대로 구체적으로 적어 두는 편이 나중에 유리합니다.
    list:
      - 근로계약서·취업규칙의 **퇴직 통보 기간** 조항을 먼저 확인합니다.
      - 사직서 사본이나 제출 메일을 보관합니다. 효력 발생일을 따질 때 통보일의 증거가 됩니다.
      - 연봉 협상·이직처 합격 전에는 사직서를 내지 않습니다. 한 번 수리되면 일방적으로 철회하기 어렵습니다.
  - h: 2. 회사가 사직서를 받아주지 않으면
    body: |
      회사가 사직서를 수리하면 그날 합의한 날짜에 근로관계가 끝납니다. 수리를 미루거나 거부해도 퇴사할 수 없는 것은 아닙니다. 기간을 정하지 않은 근로계약이라면 **민법 제660조**에 따라 해지 통보가 회사에 도달한 날부터 효력 발생 시점이 계산됩니다.

      월급처럼 기간으로 임금을 정한 경우에는 "통보를 받은 당기 후의 1기"가 지나야 합니다. 급여 산정기간이 매월 1일~말일인 회사에서 9월 15일에 통보했다면, 당기인 9월 다음의 1기(10월)가 끝난 **11월 1일**에 효력이 생깁니다. 그 전에 무단으로 출근하지 않으면 결근으로 처리되어 평균임금이 낮아지고 퇴직금이 줄 수 있습니다.
    table:
      head: [상황, 퇴사 효력 발생]
      rows:
        - [회사가 사직서를 수리함, 합의한 퇴사일]
        - [수리 거부 · 일급·시급 등 기간으로 임금을 정하지 않음, 통보 도달일부터 1개월 경과 후]
        - [수리 거부 · 월급제(매월 1일~말일 산정), 통보한 달의 다음 달이 끝난 다음 날]
        - [기간제 계약의 기간 만료, 계약 종료일]
  - h: 3. 인수인계는 어디까지 해야 하나
    body: |
      인수인계 범위를 정한 법 조항은 따로 없지만, 퇴사일까지는 근로계약이 유지되므로 맡은 업무를 정리해 넘기는 것은 근로자의 기본 의무에 해당합니다. 인수인계 없이 갑자기 나가 회사에 실제 손해가 생기면 손해배상 분쟁이 생길 수 있습니다.

      분쟁을 막는 가장 확실한 방법은 **문서로 넘기는 것**입니다. [업무 인수인계서](/form/handover-report/)에 진행 중인 업무, 거래처 담당자, 파일 위치, 마감 일정을 적고 후임자·상사의 확인 서명을 받아 둡니다. 노트북·출입카드·법인카드처럼 회사 물품은 [자산 인수인계서](/form/asset-handover/)로 반납 내역을 남깁니다.
    list:
      - 진행 중인 업무와 다음 마감일
      - 거래처·협력사 담당자 연락처와 관계 메모
      - 공유 드라이브·계정 권한 목록과 이전 여부
      - 반납 물품과 반납 확인자
  - h: 4. 퇴사일에 받을 돈 — 14일 안에 정산
    body: |
      근로기준법 제36조는 퇴직한 날부터 **14일 이내**에 임금·보상금 등 모든 금품을 지급하도록 정하고 있고, 퇴직금도 근로자퇴직급여 보장법 제9조에 따라 같은 기한이 적용됩니다. 특별한 사정이 있으면 당사자 합의로 기한을 연장할 수 있습니다.

      정산 대상은 마지막 달 일할 급여, 법정 퇴직금(계속근로 1년 이상), 쓰지 못한 연차의 수당입니다. 퇴직금은 [퇴직금 계산기](/tools/severance/)로, 실제 받을 금액은 [퇴직소득세 계산기](/tools/retirement-tax/)로 미리 확인해 두면 회사 정산액과 비교할 수 있습니다. 기한이 지나도 지급되지 않으면 [임금체불 내용증명](/form/certified-notice-wage/)을 보내고 고용노동부에 진정을 넣을 수 있습니다.
  - h: 5. 퇴사 후 챙길 서류와 보험
    body: |
      경력증명서는 이직할 때 거의 반드시 요구됩니다. 근로기준법 제39조에 따라 회사는 퇴직한 근로자가 사용증명서(경력증명서)를 청구하면 사실대로 적어 즉시 내주어야 합니다. 퇴사 전에 미리 [경력증명서](/form/career-certificate/)를 받아 두면 편합니다.

      4대보험 자격상실 신고는 회사가 합니다. 퇴사 후 바로 재취업하지 않으면 건강보험이 지역가입자로 바뀌어 보험료가 오를 수 있는데, 퇴직 전 18개월 동안 직장가입자 기간이 1년 이상이면 **임의계속가입**을 신청해 직장에서 내던 수준의 보험료를 최대 36개월 유지할 수 있습니다. 신청은 지역가입자로 처음 고지된 보험료의 납부기한에서 2개월이 지나기 전까지 해야 합니다.
  - h: 6. 실업급여는 자진 퇴사도 받을 수 있나
    body: |
      실업급여(구직급여)는 원칙적으로 회사 사정에 의한 비자발적 퇴사에 지급됩니다. 자진 퇴사라도 **임금체불, 근로조건이 채용 때와 크게 달라짐, 사업장 이전으로 통근이 곤란함, 직장 내 괴롭힘** 같은 정당한 이직 사유가 있으면 받을 수 있습니다.

      기본 요건은 이직 전 18개월 동안 고용보험 피보험단위기간이 180일 이상인 것입니다. 회사가 신고하는 이직 사유 코드가 수급 여부를 좌우하므로, 사직서에 적은 사유와 회사 신고 내용이 다르지 않은지 퇴사 전에 확인해 두십시오.
