faq:
  - q: 사직서를 내고 한 달을 안 채우면 불이익이 있나요?
    a: 회사가 수리하지 않은 상태에서 먼저 출근을 멈추면 효력 발생일까지는 무단결근이 됩니다. 결근한 날은 무급이 되고 평균임금이 낮아져 퇴직금이 줄 수 있으며, 업무 공백으로 실제 손해가 생기면 배상 분쟁이 생길 수 있습니다.
  - q: 사직서를 낸 뒤 철회할 수 있나요?
    a: 회사가 아직 수리(승낙)하기 전이라면 철회할 수 있다고 보는 것이 일반적입니다. 이미 수리됐다면 회사가 동의해야 철회됩니다. 그래서 이직이 확정되기 전에는 사직서를 서두르지 않는 것이 좋습니다.
  - q: 퇴직금을 퇴사 후 한 달 뒤에 준다고 합니다.
    a: 원칙은 퇴직일부터 14일 이내이며, 늦추려면 근로자와 합의해야 합니다. 합의 없이 늦게 주면 지연이자가 붙고 체불로 신고할 수 있습니다. 합의했다면 날짜를 문서로 남겨 두십시오.
