slug: business-transfer-checklist
status: draft
group: contract
title: 가게 인수(영업양수도) 전 확인해야 할 것들
description: 상가·점포를 인수하거나 넘길 때 임대차 승계, 권리금 회수기회, 영업자 지위승계신고, 사업자등록 정리까지 순서대로 확인하는 방법을 정리합니다.
summary: 영업양수도는 **임대인 동의**가 필요한 임차권 양도이며, 권리금은 임대차 종료 전 **6개월부터** 회수기회가 보호됩니다(상가건물 임대차보호법 제10조의4). 영업자 지위승계신고(식품접객업 기준 승계일로부터 **1개월 이내**, 식품위생법 제39조)와 사업자등록 정정·폐업신고(국세청 안내상 사유 발생 시 **지체 없이**)도 함께 챙겨야 합니다.
keywords: [영업양수도, 가게 인수, 권리금 회수기회, 영업자 지위승계신고, 사업자등록 정정, 폐업신고, 상가 인수 체크리스트]
created_at: 2026-09-18
updated_at: 2026-09-18
basis_date: 2026-09-18
sections:
  - h: 1. 무엇부터 확인해야 하나
    body: |
      가게(상가)를 인수하거나 넘길 때 가장 먼저 확인할 것은 **임대차계약을 그대로 이어받을 수 있는지**와
      **권리금을 안전하게 주고받을 수 있는지** 두 가지입니다. 민법상 임차인은 임대인의 동의 없이
      임차권을 양도하거나 전대할 수 없으므로, 계약을 맺기 전에 임대인의 동의 여부부터 확인해야 합니다.

      권리금은 임대인이 아니라 기존 임차인(양도인)이 신규 임차인(양수인)에게 받는 돈입니다.
      상가건물 임대차보호법은 임대차 기간이 끝나기 **6개월 전부터 임대차 종료 시까지**를
      권리금 회수기회 보호기간으로 정해, 임대인이 정당한 사유 없이 신규 임차인과의 권리금 계약을
      방해하지 못하도록 하고 있습니다.

      확인 순서를 정리하면 ① 임대인 동의로 임대차계약을 승계할 수 있는지, ② 권리금·시설·재고를
      어디까지 넘기고 얼마에 넘길지, ③ 영업 인허가 명의를 언제까지 바꿔야 하는지, ④ 사업자등록을
      어떻게 정리할지 순서입니다. 이 순서를 건너뛰고 계약금부터 주고받으면, 임대인이 승계를
      거부하거나 인허가 명의 변경이 막혀 계약 자체가 무의미해지는 경우가 생길 수 있습니다.
  - h: 2. 임대차계약 승계 — 임대인 동의
    body: |
      가게를 인수한다고 해서 기존 임대차계약이 자동으로 넘어오는 것은 아닙니다. 임대인의 동의를 받아
      임차인 명의를 변경하거나, 임대인·양도인·양수인 3자가 함께 새 임대차계약을 맺는 방식으로
      승계를 진행합니다. 동의 없이 임차권을 넘기면 임대인이 임대차계약을 해지할 수 있으므로,
      계약 전에 반드시 임대인과 먼저 협의해야 합니다.

      임대차계약 승계가 정리되면 [상가건물 임대차계약서](/form/commercial-lease-contract/)를
      새 임차인 명의로 다시 작성하거나 특약사항에 승계 사실을 명시해 둡니다.
    list:
      - 임대인에게 양도 사실을 알리고 동의를 받는다
      - 보증금·월세 승계 조건을 임대인과 확인한다
      - 임대차 계약서에 양수인 명의를 반영한다
  - h: 3. 영업양도양수계약서 작성
    body: |
      임대차 승계 방향이 정해지면 영업권(권리금)과 시설·집기·재고의 포함 범위, 대금 지급 방법을
      정하는 계약서를 작성합니다. 계약서에는 미수금·미지급금 정산 기준과 직원 승계 여부도
      함께 적어 두어야 인수 이후 분쟁을 줄일 수 있습니다.

      [영업양도양수계약서](/form/business-transfer-contract/)에 권리금과 포함 범위, 계약금·잔금
      지급일을 구체적으로 적고, 양도인·양수인이 함께 서명합니다.
  - h: 4. 영업자 지위승계신고 — 인허가 명의 변경
    body: |
      영업신고·허가는 계약서만으로 자동으로 넘어가지 않습니다. 업종을 관리하는 개별 법령에 따라
      관할 관청에 영업자 지위승계신고를 별도로 해야 합니다. 예를 들어 식품접객업(음식점 등)은
      식품위생법에 따라 **영업자의 지위를 승계한 날로부터 1개월 이내**에 신고해야 합니다.
      통신판매업 등 다른 업종은 신고 기한과 절차가 다를 수 있으므로 관할 관청·정부24 안내를
      먼저 확인하십시오.
    table:
      head: [확인 사항, 근거·기한]
      rows:
        - [임대차계약 승계(임대인 동의), "민법 제629조 — 동의 없이 양도·전대 시 계약 해지 사유"]
        - [권리금 회수기회 보호기간, "상가건물 임대차보호법 제10조의4 — 임대차 종료 전 6개월부터"]
        - [영업자 지위승계신고(식품접객업 기준), "식품위생법 제39조제3항 — 승계일로부터 1개월 이내"]
        - [사업자등록 정정·휴폐업 신고, "국세청 안내 — 사유 발생 시 지체 없이 신고"]
  - h: 5. 사업자등록 정정·폐업신고
    body: |
      양수인은 새로 사업자등록을 하거나, 기존 사업자등록의 대표자·업종 등을 정정해야 합니다.
      양도인은 본인 명의 사업을 더 이상 운영하지 않으므로 휴업 또는 폐업 신고를 진행합니다.
      국세청은 정정·휴폐업 사유가 발생하면 별도로 정해진 일수 없이 **지체 없이** 신고하도록
      안내하고 있으므로, 인수 절차가 끝나는 대로 바로 처리하는 것이 안전합니다.

      양수인은 [사업자등록 신청서](/form/gov-business-registration-individual/)로 새로 등록하고,
      양도인은 [휴업·폐업 신고서](/form/gov-business-closure-report/)로 정리합니다.
  - h: 6. 놓치기 쉬운 것들
    body: |
      계약서와 신고 서류를 다 갖췄더라도 실제 인수 과정에서는 세부 정산이 뒤늦게 문제가 되는
      경우가 많습니다. 아래 사항을 인수 전에 미리 확인해 두면 분쟁을 줄일 수 있습니다.

      권리금을 지급한 뒤에는 영업 인수인계와 함께 폐업·신규 등록, 인허가 명의변경까지 순서대로
      마쳐야 비로소 절차가 끝납니다. 절차 중 하나라도 빠지면 양수인이 세금계산서를 정상 발행하지
      못하거나, 기존 영업자 명의로 단속·과태료가 이어질 수 있으므로 인수 시점에 체크리스트로
      함께 관리하는 것이 안전합니다.
    list:
      - 전기·수도·가스 등 공과금 미납액을 인수일 기준으로 정산한다
      - 거래처 미수금·미지급금 승계 여부를 특약사항에 명시한다
      - 기존 직원의 근로계약 승계 여부와 조건을 미리 협의한다
      - 원상복구 의무가 있는 임대차라면 시설 인수 범위를 임대인과 함께 확인한다
forms: [business-transfer-contract, commercial-lease-contract, gov-business-registration-individual, gov-business-closure-report]
faq:
  - q: 임대인 동의 없이 가게를 넘겨도 되나요?
    a: 민법상 임차권 양도는 임대인의 동의가 필요하며, 동의 없이 넘기면 임대차계약이 해지될 수 있습니다.
  - q: 권리금은 임대인에게 받는 건가요?
    a: 아닙니다. 권리금은 기존 임차인이 신규 임차인에게 받는 것이며, 임대인은 정당한 사유 없이 그 기회를 방해할 수 없습니다.
  - q: 영업 허가는 계약과 동시에 자동으로 넘어가나요?
    a: 자동으로 넘어가지 않으며, 업종별로 정해진 기한 안에 영업자 지위승계신고를 별도로 해야 합니다.
  - q: 사업자등록 정리는 언제까지 해야 하나요?
    a: 법령상 정해진 일수는 없지만, 국세청은 정정·폐업 사유가 생기면 지체 없이 신고하도록 안내하고 있습니다.
