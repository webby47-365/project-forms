slug: moving-out-deposit-return
status: published
group: housing
title: 이사 나갈 때 보증금 반환 절차와 확인사항
description: 임대차가 끝나 이사할 때 계약 해지 통보 시점, 원상복구 점검, 보증금 반환이 늦어질 때 임차권등기명령까지 순서대로 정리한 안내입니다.
summary: >-
  임대차 만기 6개월~2개월 전 갱신 거절을 통지하지 않으면 자동 갱신되고, 묵시적 갱신 후
  임차인이 해지를 통보하면 **3개월 후 효력이 생깁니다**. 보증금을 못 받고 이사해야 하면
  **임차권등기명령**을 먼저 신청해야 대항력·우선변제권을 지킬 수 있습니다.
keywords: [보증금 반환, 이사 보증금, 임차권등기명령, 전세보증금 반환, 계약 해지 통보, 원상복구, 묵시적 갱신]
created_at: 2026-09-16
updated_at: 2026-09-17
basis_date: 2026-09-17
show_on: [move-out-checklist, deposit-return-notice]

sections:
  - h: 1. 보증금, 언제 어떻게 돌려받나
    body: |
      원칙적으로 임대차가 끝나면 임대인은 임차인이 집을 비우고 넘겨주는 것과 동시에 보증금을
      돌려줄 의무가 있습니다(동시이행 관계). 법으로 "며칠 이내"라는 반환 기한이 따로 정해져
      있지는 않지만, 임차인이 먼저 집을 비워주고 열쇠까지 넘겼는데도 임대인이 보증금 지급을
      미루면 뒤에서 설명하는 임차권등기명령이나 내용증명으로 대응할 수 있습니다. 이사 날짜가
      정해졌다면 계약 해지·갱신 거절 통보 시점부터 순서대로 챙겨야 반환이 늦어지는 상황을
      줄일 수 있습니다.

  - h: 2. 계약 해지·갱신 거절 통보는 언제까지
    body: |
      계약 기간을 채우고 재계약 없이 나가려면 통보 시점을 놓치지 않아야 합니다.
      **주택임대차보호법 제6조**에 따라 임대인·임차인 모두 임대차 기간이 끝나기 6개월 전부터
      2개월 전까지 갱신 거절이나 조건 변경을 통지하지 않으면 이전과 같은 조건으로 자동
      갱신(묵시적 갱신)됩니다. 이 통지 기간 안에는 계속 살 경우를 대비해 **제6조의3의
      계약갱신요구권**도 함께 검토해 볼 수 있는데, 이 경우 임대인이 올릴 수 있는 차임·보증금
      증액은 **제7조**에 따라 기존 금액의 20분의 1(5%)을 넘지 못합니다.
    list:
      - "정해진 만기에 맞춰 나가려면: 만기 2개월 전까지 임대인에게 갱신 거절 의사를 통지합니다."
      - "이미 묵시적으로 갱신된 상태라면: 임차인은 언제든 해지를 통보할 수 있고, **제6조의2**에 따라 임대인이 통지를 받은 날부터 3개월이 지나야 효력이 생깁니다."
      - "통보는 나중에 다툼이 없도록 문자·내용증명 등 기록이 남는 방법으로 합니다."
    table:
      head: [상황, "통지·행동", 효력 발생]
      rows:
        - ["임대인이 갱신 거절", "만기 6개월~2개월 전 통지", "만기일에 계약 종료"]
        - ["임차인이 갱신 거절", "만기 2개월 전까지 통지", "만기일에 계약 종료"]
        - ["묵시적 갱신 후 임차인 해지", "언제든 해지 통보 가능", "통보 도달일부터 3개월 후"]

  - h: 3. 이사 전 시설물·정산 확인
    body: |
      보증금에서 공제할 항목을 놓고 다투는 가장 흔한 이유는 원상복구 범위와 미납 관리비입니다.
      입주 때 점검표를 작성해 두었다면 그 내용과 비교해 파손·오염 여부를 확인하고, 없다면
      현재 상태를 사진과 함께 기록해 둡니다. 관리비·전기·가스·수도 등 공과금은 이사 전에
      정산 내역을 미리 확인해 임대인과 합의된 금액만 공제하도록 합니다.
      [퇴거 점검표](/form/move-out-checklist/)에 공간별 상태와 정산 항목을 함께 적어 두면
      임대인과 확인·서명하는 절차로 그대로 쓸 수 있습니다.

  - h: 4. 열쇠를 넘기기 전에 확인할 것
    body: |
      임차인이 먼저 집을 비우고 열쇠를 넘겼는데 보증금을 받지 못하면 대항력을 잃을 위험이
      있습니다. 대항력은 **주택의 인도와 전입신고를 마친 다음 날 0시부터**(제3조) 생기므로,
      이사하면서 전입신고를 다른 곳으로 옮기면 기존 집에 대한 대항력이 사라집니다. 확정일자를
      받아 둔 경우의 우선변제권(제3조의2)도 대항요건이 유지되어야 온전히 지켜지므로, 보증금을
      받기 전에 먼저 이사해야 한다면 아래에서 설명하는 임차권등기명령을 먼저 신청해 두는 것이
      안전합니다.

  - h: 5. 보증금을 못 받고 나가야 할 때 — 임차권등기명령
    body: |
      임대차가 끝났는데도 보증금을 돌려받지 못했다면 **주택임대차보호법 제3조의3**에 따라
      임차주택 소재지를 관할하는 법원에 임차권등기명령을 신청할 수 있습니다. 등기가 완료되면
      이미 갖추고 있던 대항력과, 확정일자를 받아 둔 경우의 우선변제권이 그대로 유지되어 다른
      곳으로 전입신고를 옮기고 이사해도 권리를 잃지 않습니다. 등기 신청과 별도로 임대인에게
      반환을 촉구하는 내용증명을 먼저 보내 두면 이후 지연에 대한 증거로 남길 수 있습니다.
      [전세보증금 반환 내용증명](/form/deposit-return-notice/) 양식으로 청구 금액과 기한을
      명시해 발송하십시오.

  - h: 6. 그래도 반환이 안 될 때 상담받을 곳
    body: |
      내용증명과 임차권등기명령으로도 해결되지 않으면 소송에 앞서 상담받을 수 있는 공적
      기관이 있습니다. 대한법률구조공단은 임대차 분쟁을 포함한 법률 상담과 소송 대리를
      지원하고, 각 시·도의 주택임대차분쟁조정위원회는 소송 없이 임대인과 임차인이 조정으로
      분쟁을 해결하도록 돕습니다. 조정은 상대방이 응하지 않으면 성립하지 않으므로, 조정
      신청과 별도로 임차권등기명령 신청 기한을 놓치지 않는 것이 우선입니다.

  - h: 7. 이사 후에도 남겨 두어야 할 서류
    body: |
      임대차계약서, 확정일자를 받은 서류, 관리비·공과금 정산 내역, 퇴거 점검·정산 확인서는
      보증금을 완전히 돌려받을 때까지 보관합니다. 임차권등기명령을 신청했던 경우에는 보증금을
      받은 뒤 등기 말소 절차가 필요할 수 있으므로 관할 법원에 확인하십시오.

