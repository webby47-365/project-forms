faq:
  - q: 묵시적 갱신 중에도 바로 나갈 수 있나요?
    a: 언제든 해지를 통보할 수 있지만, 임대인이 통지를 받은 날부터 3개월이 지나야 효력이 생기므로 그 사이 임대료는 계속 부담합니다.
  - q: 반환이 늦어지면 이자를 받을 수 있나요?
    a: 별도 약정이 없어도 지급이 늦어진 기간에 대해 이자를 청구할 수 있으나 구체적인 이율은 상황에 따라 달라 법률구조기관 등에 확인하는 것이 안전합니다.
  - q: 임차권등기명령은 이사한 뒤 신청해도 되나요?
    a: 이사하기 전에 신청해 등기를 완료해 두는 것이 안전합니다. 대항요건을 유지한 상태에서 등기해야 권리 유지가 더 확실합니다.
  - q: 원상복구 범위를 임대인이 넓게 요구하면 어떻게 하나요?
    a: 통상적인 사용에 따른 마모는 임차인이 배상할 의무가 없다고 보는 것이 일반적이므로, 입주 당시 상태와 비교한 자료를 근거로 협의하는 것이 좋습니다.

