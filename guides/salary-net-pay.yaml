slug: salary-net-pay
status: published
group: pay
title: 급여명세서 공제 항목 읽는 법과 실수령액 계산
description: 월급에서 빠지는 국민연금·건강보험·장기요양·고용보험과 소득세·지방소득세가 각각 어떻게 계산되는지, 비과세 식대와 간이세액표 80·120% 선택이 실수령액에 주는 영향을 정리했습니다.
summary: 실수령액은 **세전 월급 − 4대보험 − 소득세 − 지방소득세**입니다. 4대보험은 비과세를 뺀 급여에 요율을 곱해 정하고(2026년 근로자 부담 국민연금 4.75%·건강보험 3.595%·고용보험 0.9%), 소득세는 국세청 **근로소득 간이세액표**에서 급여와 부양가족 수로 찾습니다. 매월 떼는 소득세는 임시 금액이라 연말정산에서 최종 확정됩니다.
keywords: [급여명세서 보는 법, 실수령액 계산, 4대보험 요율 2026, 간이세액표, 비과세 식대, 원천징수 80% 120%]
created_at: 2026-09-15
updated_at: 2026-09-15
sections:
  - h: 1. 급여명세서는 지급과 공제 두 칸으로 나뉜다
    body: |
      [급여명세서](/form/payslip/)의 왼쪽(또는 위)은 **지급 항목**, 오른쪽(또는 아래)은 **공제 항목**입니다. 지급 항목에는 기본급, 연장근로수당, 식대, 직책수당처럼 받는 돈이, 공제 항목에는 4대보험과 세금처럼 빠지는 돈이 적힙니다. 두 합계의 차이가 통장에 들어오는 실수령액입니다.

      2021년 11월부터 회사는 임금을 줄 때 임금의 구성항목·계산방법·공제 내역을 적은 임금명세서를 반드시 교부해야 합니다(근로기준법 제48조 제2항). 명세서를 받지 못했다면 요청할 수 있습니다.
  - h: 2. 4대보험은 이렇게 빠진다 (2026년)
    body: |
      4대보험료는 **비과세를 뺀 월 급여**(보수월액)에 요율을 곱해 계산하고, 회사와 근로자가 나눠 냅니다. 산재보험은 회사가 전액 부담하므로 명세서 공제란에는 나오지 않습니다. 보험료는 10원 미만을 버립니다.
    table:
      head: [항목, 근로자 부담, 계산 기준]
      rows:
        - [국민연금, 4.75%, "기준소득월액 상한 659만원·하한 41만원 안에서 부과 (2026.7~2027.6)"]
        - [건강보험, 3.595%, 보수월액 × 요율]
        - [장기요양보험, 건강보험료의 13.14%, 건강보험료에 곱함]
        - [고용보험, 0.9%, 실업급여 계정 1.8%를 노사 절반씩]
    list:
      - 국민연금은 상한이 있어 월 과세 급여가 659만원을 넘으면 더 늘지 않습니다.
      - 건강보험료는 매년 4월에 전년도 실제 보수로 정산해 추가 징수하거나 돌려줍니다.
  - h: 3. 소득세는 계산식이 아니라 표로 찾는다
    body: |
      매월 떼는 근로소득세는 소득세법 시행령 별표2 **근로소득 간이세액표**에서 찾습니다. 세로축은 비과세를 뺀 월 급여, 가로축은 본인을 포함한 공제대상 가족 수입니다. 8세 이상 20세 이하 자녀가 있으면 표의 금액에서 자녀 수만큼 정해진 금액을 더 뺍니다. 지방소득세는 찾은 소득세의 10%입니다.

      표에는 연말정산에서 받을 공제를 평균적으로 미리 반영해 둔 금액이 들어 있어, 법정 세율로 직접 계산하면 실제 표 금액과 맞지 않습니다. 정확한 금액은 표 원문을 탑재한 [연봉 실수령액 계산기](/tools/salary/)나 [연봉별 실수령액 표](/tools/salary/#salary-table)로 확인하십시오. 예를 들어 [연봉 4,000만원](/tools/salary/4000/)과 [연봉 5,000만원](/tools/salary/5000/)의 공제 내역을 나란히 보면 구간에 따른 차이를 알 수 있습니다.
  - h: 4. 비과세 식대가 실수령액을 바꾼다
    body: |
      식대는 **월 20만원까지 비과세**입니다. 비과세 금액에는 소득세뿐 아니라 4대보험료도 붙지 않으므로, 같은 연봉이라도 급여 중 20만원을 식대로 받으면 공제액이 줄어 실수령액이 늘어납니다. 자가운전보조금(월 20만원), 6세 이하 자녀 보육수당 등도 요건을 갖추면 비과세입니다.

      다만 비과세 항목은 퇴직금 산정과는 무관합니다. 식대가 매월 고정으로 지급되면 통상임금·평균임금에 포함될 수 있어 퇴직금 계산에서는 빠지지 않습니다.
  - h: 5. 소득세 80% · 100% · 120% 선택
    body: |
      근로자는 간이세액표 금액의 **80%, 100%, 120%** 중 하나를 골라 원천징수하도록 회사에 신청할 수 있습니다(소득세법 시행령 제194조). 80%를 고르면 매달 실수령액이 늘지만 연말정산에서 덜 걷힌 만큼을 한꺼번에 낼 가능성이 커지고, 120%를 고르면 반대로 매달은 적게 받고 연말정산 환급이 커집니다.

      선택은 총 세금을 바꾸지 않습니다. 1년 세금은 연말정산에서 똑같이 확정되고, 언제 내느냐만 달라집니다. 매년 연말정산에서 크게 토해 내는 편이라면 120%, 매달 현금 흐름이 중요하다면 80%를 고려할 수 있습니다.
  - h: 6. 연봉 계약할 때 확인할 것
    body: |
      연봉 금액이 같아도 **퇴직금 포함 여부**, 비과세 항목 구성, 상여금 분할 방식에 따라 매월 실수령액이 달라집니다. 연봉에 퇴직금이 포함된 계약이면 매월 받는 금액은 연봉 ÷ 13 수준입니다. 연봉 계약서나 [근로계약서](/form/labor-contract-standard/)의 임금 구성항목을 확인하고, 이직 시 비교할 때는 "월 실수령액" 기준으로 맞춰 보는 것이 정확합니다.
forms: [payslip, labor-contract-standard, employment-certificate]
tools: [/tools/salary/, /tools/severance/]
faq:
  - q: 같은 연봉인데 동료와 실수령액이 다른 이유는?
    a: 부양가족 수와 8~20세 자녀 수에 따라 매월 떼는 소득세가 다르고, 비과세 항목 구성이나 소득세 80·120% 선택 여부도 다를 수 있습니다. 4대보험료는 같은 급여라면 거의 같습니다.
  - q: 4월 월급에서 건강보험료가 갑자기 많이 빠졌어요.
    a: 매년 4월에 전년도 보수 변동을 반영해 건강보험료를 정산합니다. 작년에 연봉이 올랐거나 성과급을 받았다면 덜 낸 보험료가 추가로 빠지고, 반대라면 돌려받습니다.
  - q: 연말정산 전에 소득세를 줄일 수 있나요?
    a: 매월 떼는 세금을 80%로 줄일 수는 있지만 총 세금은 같습니다. 실제 세금을 줄이려면 연금저축·IRP 납입, 신용카드 사용 구성, 의료비·교육비 증빙 같은 연말정산 공제 항목을 챙겨야 합니다.
