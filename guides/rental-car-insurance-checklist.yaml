title: 렌터카 대여 전 확인할 보험·특약과 반납 기준
description: 렌터카를 빌리기 전에 확인해야 할 의무보험과 자차보험(면책제도), 계약서 특약, 반납할 때 다투지 않는 확인 방법을 순서대로 정리했습니다.
summary: >-
  렌터카는 자동차손해배상 보장법에 따라 **대인·대물 의무보험**에 가입되어 있지만, 차량 자체
  파손을 보장하는 **자기차량손해(자차)보험**은 별도로 선택해야 합니다. 면책금이 낮은
  '완전자차'일수록 대여료가 비싸지므로 여행·업무 목적에 맞게 고르고, **반납 시 연료·주행거리·
  파손 여부를 사진과 확인서로 남겨야** 나중에 청구 다툼을 줄일 수 있습니다.
keywords: [렌터카 보험, 렌터카 자차보험, 렌터카 면책금, 렌터카 반납확인서, 렌터카 특약, 자동차대여 표준약관]
created_at: 2026-09-26
updated_at: 2026-09-26
basis_date: 2026-09-26
show_on: [rental-car-return-confirmation, vehicle-lease-contract]

sections:
  - h: 1. 렌터카는 의무보험에 가입되어 있다
    body: |
      렌터카를 포함한 모든 자동차는 자동차손해배상 보장법 제5조에 따라 사람이 다치거나
      사망했을 때 배상하는 **책임보험**(대인배상Ⅰ)과 재물 피해를 배상하는 **보험**(대물배상)에
      가입해야 합니다. 특히 자동차 대여사업자는 같은 조 제3항에 따라 책임보험의 배상한도를
      넘는 대인 피해까지 보장하는 보험에 추가로 가입해야 할 의무가 있습니다.

      즉, 렌터카를 몰다가 다른 사람을 다치게 하거나 남의 차·시설을 파손했을 때 필요한
      기본 보상은 대여료에 이미 포함되어 있습니다. 다만 이 의무보험은 **상대방 피해**를
      보상하는 것이지, 내가 빌린 렌터카 자체의 파손은 별도 보험으로 처리해야 합니다.
  - h: 2. 자차보험(면책제도)은 선택 사항이다
    body: |
      렌터카 자체가 사고로 파손되었을 때 수리비를 물어줄지 여부는 **자기차량손해(자차)보험**
      또는 대여사업자가 운영하는 **차량손해면책제도**로 정합니다. 계약할 때 자차를 선택하지
      않으면, 사고 시 수리비 전액과 휴차보상비(수리 기간 동안 영업을 못 한 손해)까지
      이용자가 물어야 할 수 있습니다.

      면책제도는 보통 아래처럼 등급이 나뉘고, 업체마다 부르는 이름과 면책금 액수가 다릅니다.
      면책금 액수와 등급 이름은 업체마다 다르므로, 예약 화면이나 계약서에서 **면책금이
      정확히 얼마인지, 휴차보상비·자기부담금 상한이 있는지**를 직접 확인하는 것이
      가장 확실합니다.
    table:
      head: [등급(예시 명칭), 자기부담금(면책금), 특징]
      rows:
        - ["일반 자차", "사고 1건당 30만~50만원 수준", "대여료가 저렴하지만 사고 시 자기부담금 발생"]
        - ["완전자차 / 슈퍼자차", "면책금 0원에 가까움", "대여료가 비싸지만 사고 나도 자기부담금이 거의 없음"]
        - ["자차 미가입", "수리비 전액·휴차보상비 부담", "단거리·단시간이라도 위험이 크므로 권장하지 않음"]
  - h: 3. 대여 전 조건과 계약서를 확인한다
    body: |
      운전자의 나이·운전면허 취득 기간에 따라 대여 자체가 제한되거나 고급 차종의 자차보험
      가입이 안 될 수 있습니다. 예약 전에 본인 조건으로 자차보험 가입이 가능한지, 실제
      운전할 사람과 계약서상 운전자가 같은지 확인하십시오. 계약서상 운전자와 실제 운전자가
      다르면 사고가 나도 보험 처리가 되지 않을 수 있습니다.

      계약 시 [자동차 임대차계약서](/form/vehicle-lease-contract/)로 대여 기간·요금·보험
      조건·반납 장소를 서면으로 남겨 두면, 구두로 안내받은 내용과 실제 청구 내용이 다를 때
      근거로 쓸 수 있습니다.
    list:
      - 예약 화면·계약서의 면책금 액수와 보장 범위를 캡처하거나 출력해 둡니다.
      - 하이패스 단말기·내비게이션 등 부착 장비의 유무와 상태를 대여 시점에 확인합니다.
      - 연료 정책(가득 반납/선불 등)을 미리 확인해 반납 시 추가 요금을 피합니다.
  - h: 4. 반납할 때는 그 자리에서 확인서를 남긴다
    body: |
      반납 시점의 주행거리·연료 잔량·외관 파손 여부를 업체 담당자와 함께 확인하지 않으면,
      나중에 "몰랐던 흠집"이나 "부족한 연료"를 이유로 추가 요금이 청구되어도 반박하기
      어렵습니다. [렌터카 반납확인서](/form/rental-car-return-confirmation/)에 반납
      시점 상태를 적고 사진을 함께 남겨 두면, 청구 내용에 다툼이 생겼을 때 근거 자료로
      쓸 수 있습니다.
    list:
      - 반납 직전 차량 외관을 사방에서 사진으로 남깁니다.
      - 연료 게이지와 계기판 주행거리를 사진으로 함께 찍어 둡니다.
      - 확인서에 담당자 서명을 받고 사본을 이용자도 보관합니다.
  - h: 5. 운전 중 사고가 났다면
    body: |
      렌터카로 운전하다 사고가 나면 먼저 다친 사람이 있는지 확인하고, 필요하면 즉시
      119·112에 신고합니다. 이후 [교통사고 현장확인서](/form/traffic-accident-confirmation/)로
      사고 장소·시간·차량 정보와 파손 부위를 기록하고, 상대방과 합의가 필요한 경우
      [교통사고 합의서](/form/car-accident-settlement/)를 활용할 수 있습니다. 대여
      업체에도 사고 사실을 지체 없이 알려야 보험 처리가 늦어지지 않습니다.

      사고 처리 과정에서 과실 비율이나 배상 범위를 스스로 단정하지 말고, 보험사·업체의
      안내를 받아 진행하는 것이 안전합니다.
  - h: 6. 대여할 때 챙길 준비물
    body: |
      대여 계약자 본인 명의의 운전면허증과 신용카드는 대부분의 업체가 공통으로 요구합니다.
      사고·연체 요금에 대비해 면책금 상당액을 신용카드로 임시 승인(홀드)해 두는 경우가
      많으므로, 체크카드만 있으면 대여 자체가 거절될 수 있습니다.

      2명 이상이 번갈아 운전할 계획이라면 계약 시점에 **추가 운전자**로 등록해야 합니다.
      등록하지 않은 사람이 운전하다 사고가 나면 앞서 설명한 보험 처리에서 제외될 수 있으므로,
      추가 운전자의 운전면허증도 함께 챙겨 창구에서 등록을 요청하십시오.
    list:
      - 대여자 본인 명의 운전면허증과 신용카드를 준비합니다.
      - 함께 운전할 사람이 있으면 추가 운전자로 등록합니다.
      - 예약 확인서·바우처를 출력하거나 휴대전화에 저장해 둡니다.

faq:
  - q: 자차보험을 들어도 100% 보장되나요?
    a: 등급에 따라 면책금(자기부담금)이 남을 수 있어 계약서에서 면책금 액수를 직접 확인해야 합니다.
  - q: 하이패스 통행료는 어떻게 정산되나요?
    a: 반납 후 후불로 청구되는 경우가 많으므로 통행 내역을 미리 확인해 두면 안전합니다.
  - q: 계약서상 운전자가 아닌 사람이 운전해도 되나요?
    a: 사고가 나면 보험 처리가 되지 않을 수 있어 실제 운전자를 계약서에 반드시 등록해야 합니다.

