faq:
  - q: 괴롭힘을 신고하면 회사가 비밀을 지켜 주나요?
    a: 조사에 참여한 사람은 조사 과정에서 알게 된 비밀을 피해자 의사에 반해 다른 사람에게 누설해서는 안 됩니다. 신고할 때 공개를 원하지 않는 범위를 함께 적어 두십시오.
  - q: 한 번의 폭언도 직장 내 괴롭힘이 되나요?
    a: 반복성이 필수 요건은 아닙니다. 한 번이라도 행위의 정도가 심하면 인정될 수 있지만, 판단은 우위 이용·적정 범위 초과·고통의 세 요소를 종합해서 합니다.
  - q: 신고했더니 부서가 바뀌었습니다. 어떻게 해야 하나요?
    a: 신고자에게 불리한 처우를 하는 것은 금지되어 있습니다. 신고 날짜와 인사 조치 날짜, 조치 전후의 업무 차이를 정리해 관할 노동청에 진정할 수 있습니다.
