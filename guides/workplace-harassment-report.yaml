title: 직장 내 괴롭힘 신고 — 증거 정리부터 회사·노동청 절차까지
description: 직장 내 괴롭힘이 무엇인지 법의 세 가지 판단 기준과, 신고 전에 증거를 정리하는 방법, 회사에 신고했을 때 회사가 해야 할 조치, 회사가 움직이지 않을 때 노동청 진정까지 순서대로 정리했습니다.
summary: 직장 내 괴롭힘은 **지위·관계의 우위를 이용해 업무상 적정 범위를 넘어 신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위**입니다(근로기준법 제76조의2). 신고를 받은 회사는 **지체 없이 객관적으로 조사**하고 피해자를 보호해야 하며, 신고자에게 불리한 처우를 하면 안 됩니다. 신고 전에는 날짜·장소·발언·목격자를 기록한 진술서부터 만듭니다.
keywords: [직장 내 괴롭힘 신고, 직장 내 괴롭힘 기준, 괴롭힘 증거 수집, 괴롭힘 노동청 진정, 근로기준법 76조의2, 괴롭힘 조사 절차]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
show_on: [written-statement, statement-of-facts, fact-confirmation, certified-notice]
sections:
  - h: 1. 괴롭힘인지 판단하는 세 가지 기준
    body: |
      근로기준법 제76조의2는 직장 내 괴롭힘을 사용자나 근로자가 **직장에서의 지위 또는 관계 등의 우위를 이용하여**, **업무상 적정 범위를 넘어**, 다른 근로자에게 **신체적·정신적 고통을 주거나 근무환경을 악화시키는 행위**로 정의합니다. 세 요소가 모두 있어야 합니다.

      "우위"는 직급만 뜻하지 않습니다. 나이·학벌·정규직 여부·다수 집단 같은 관계의 우위도 포함됩니다. "업무상 적정 범위"는 업무 지시 자체가 아니라 그 방식을 봅니다. 성과 부진을 지적하는 것은 업무이지만, 공개된 자리에서 반복적으로 인격을 모욕하거나 업무를 주지 않고 따돌리는 것은 적정 범위를 넘는 행위로 볼 수 있습니다.
    table:
      head: [괴롭힘으로 볼 수 있는 행위, 업무상 필요로 볼 여지가 있는 행위]
      rows:
        - [여러 사람 앞에서 반복적인 폭언·인격 모독, 사실에 근거한 업무 피드백]
        - [정당한 이유 없이 업무에서 배제·따돌림, 조직 개편에 따른 업무 조정]
        - [사적인 심부름·회식 강요, 업무상 필요한 일정 공지]
        - [수행할 수 없는 과도한 업무를 반복적으로 부여, 마감이 있는 일시적 업무 증가]
  - h: 2. 신고 전에 증거부터 정리한다
    body: |
      괴롭힘 조사는 결국 "언제, 어디서, 누가, 무엇을 했는지"를 확인하는 과정입니다. 기억은 시간이 지나면 흐려지고, 행위자는 대체로 사실을 부인합니다. 그래서 신고보다 **기록이 먼저**입니다.

      일이 있을 때마다 날짜별로 적어 두고, 모이면 [진술서](/form/written-statement/)로 시간 순서대로 정리합니다. 같은 장면을 본 동료가 있다면 목격한 사실을 따로 적어 달라고 부탁하거나, 사실관계를 서로 확인한 [사실확인서](/form/fact-confirmation/)를 받아 둡니다. 녹음은 본인이 대화 당사자로 참여한 대화라면 증거로 쓰이는 경우가 많지만, 내가 빠진 다른 사람들의 대화를 몰래 녹음하는 것은 불법이 될 수 있습니다.
    list:
      - 날짜·시간·장소·행위자·구체적 발언이나 행동
      - 메신저·메일·문자 캡처 (날짜가 보이게)
      - 목격자 이름과 연락 방법
      - 병원 진료 기록이나 상담 기록 (고통을 보여 주는 자료)
      - 업무 배제라면 이전과 달라진 업무 분장·회의 초대 내역
  - h: 3. 회사에 신고하면 회사가 해야 할 일
    body: |
      누구든지 괴롭힘 사실을 알게 되면 회사에 신고할 수 있습니다(제76조의3 제1항). 사내 고충처리 창구나 인사팀에 서면이나 메일로 신고하면 신고한 날짜가 남습니다. 회사에 신고를 받거나 괴롭힘을 알게 된 회사는 다음 조치를 해야 합니다.
    list:
      - "**지체 없이 객관적인 조사** 실시"
      - 조사 기간에도 피해자 보호가 필요하면 근무 장소 변경·유급휴가 등 조치 (피해자 의사에 반해서는 안 됨)
      - 괴롭힘이 확인되면 피해자가 요청할 때 근무 장소 변경·배치전환·유급휴가 등 조치
      - 행위자에 대한 징계·근무 장소 변경 등 조치 (조치 전에 피해자 의견 청취)
      - "신고자·피해자에게 **해고나 그 밖의 불리한 처우 금지**"
      - 조사 참여자의 비밀 유지
  - h: 4. 회사가 조사하지 않거나 불이익을 줄 때
    body: |
      회사가 신고를 받고도 조사하지 않거나, 신고 뒤 오히려 부서 이동·평가 불이익을 줬다면 사업장 관할 지방고용노동관서에 **진정**을 넣을 수 있습니다. 고용노동부 노동포털에서 온라인으로 진정서를 낼 수 있고, 회사에 신고한 날짜와 이후 달라진 처우를 시간 순서로 정리해 첨부하면 조사가 빨라집니다.

      대표이사가 직접 괴롭힘을 한 경우처럼 회사 안에서 조사가 기대되지 않을 때는 처음부터 노동청 진정을 선택하기도 합니다. 회사에 보낸 신고와 요구 사항을 [내용증명](/form/certified-notice/)으로 남겨 두면 "회사가 알고도 조치하지 않았다"는 사실을 입증하기 쉬워집니다.
  - h: 5. 적용 범위와 확인할 점
    body: |
      직장 내 괴롭힘 조항은 근로기준법이 적용되는 사업장을 기준으로 합니다. **상시 근로자 5인 미만 사업장**은 근로기준법 일부 조항만 적용되고 적용 범위 확대가 논의되고 있으므로, 작은 사업장이라면 고용노동부 고객상담센터(국번 없이 1350)에서 현재 적용 여부를 먼저 확인하십시오.

      괴롭힘으로 인한 질병은 요건을 갖추면 업무상 재해로 산재 신청을 할 수 있고, 괴롭힘을 견디지 못해 퇴사한 경우에는 실업급여의 정당한 이직 사유가 될 수 있습니다. 어느 절차든 앞에서 정리한 기록이 출발점이 됩니다.
  - h: 6. 신고서·진술서를 쓸 때 문장 요령
    body: |
      감정 표현보다 **사실**을 적습니다. "너무 모욕적이었다"보다 "9월 3일 오전 10시 회의실에서 팀원 6명 앞에서 '이것도 못 하면 그만둬라'고 말함"이 조사에서 훨씬 힘이 있습니다. 한 사건에 한 문단씩, 날짜 순서로 번호를 붙이면 조사자가 사실을 하나씩 확인하기 좋습니다.

      마지막에는 원하는 조치를 적습니다. 행위자와 분리 근무, 사과, 재발 방지 같은 요구를 구체적으로 적어야 회사가 어떤 조치를 했는지 나중에 비교할 수 있습니다. [진술서(육하원칙형)](/form/statement-of-facts/)는 누가·언제·어디서 칸이 나뉘어 있어 처음 정리할 때 편합니다.
