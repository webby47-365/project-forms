faq:
  - q: 성과 숫자를 증명할 자료가 없으면 써도 되나요?
    a: 대략의 규모라도 본인이 설명할 수 있는 숫자라면 "약"을 붙여 쓸 수 있습니다. 다만 근거를 전혀 설명할 수 없는 숫자는 면접에서 신뢰를 잃으니 빼는 편이 낫습니다.
  - q: 회사 매출 같은 내부 수치를 적어도 되나요?
    a: 공개되지 않은 매출·단가·고객명은 비밀유지 의무에 걸릴 수 있습니다. 금액 대신 증가율이나 순위처럼 비율로 바꿔 적으십시오.
  - q: 경력기술서는 몇 장이 적당한가요?
    a: 정해진 기준은 없지만 핵심 성과가 첫 장에 보이도록 2~3장 안에서 정리하는 경우가 많습니다. 공고에 분량 지정이 있으면 그것을 따릅니다.
