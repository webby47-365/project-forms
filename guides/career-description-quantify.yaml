sections:
  - h: 1. 결론 — 한 문장에 과제·행동·결과를 넣는다
    body: |
      채용 담당자는 경력기술서에서 "무슨 일을 했나"보다 **"그 일로 무엇이 달라졌나"**를 찾습니다. 고용24 취업가이드도 경력자는 자신이 만든 성과를 수치로 기술하고, 직무와 관련된 주요 업무를 중심으로 쓰라고 안내합니다.

      가장 쓰기 쉬운 공식은 **과제 → 행동 → 결과(숫자)** 순서입니다. 업무를 나열한 문장에 이 세 칸을 채우기만 해도 문장이 달라집니다.
    table:
      head: [바꾸기 전, 바꾼 뒤]
      rows:
        - [고객 문의 응대 업무 담당, "반복 문의 FAQ 30개를 정리해 챗봇에 적용 → 월 문의 건수 1,200건에서 840건으로 30% 감소"]
        - [월말 정산 업무 수행, "정산 엑셀을 거래처별 자동 집계로 바꿔 → 마감 소요 5영업일에서 3영업일로 단축"]
        - [신규 거래처 발굴, "업종별 리스트 400곳에 제안 → 신규 계약 18건, 연 매출 2억 3,000만원 추가"]
  - h: 2. 숫자로 바꾸는 다섯 가지 지표
    body: |
      모든 직무에 매출 숫자가 있는 것은 아닙니다. 아래 다섯 가지 중 하나로 표현할 수 있으면 충분합니다. 한 성과에 숫자는 한두 개만 씁니다. 숫자가 많으면 오히려 핵심이 흐려집니다.
    list:
      - "**비율** — 증가율·감소율·달성률 (예: 목표 대비 112% 달성)"
      - "**시간** — 처리 시간·리드타임·마감 기간 단축 (예: 14일 → 9일)"
      - "**건수·횟수** — 처리 건수, 오류 건수, 재작업 횟수"
      - "**금액** — 매출·원가 절감·예산 집행 규모"
      - "**규모** — 담당 인원·거래처 수·사용자 수·예산 범위"
  - h: 3. 비교 기준을 반드시 붙인다
    body: |
      "매출 20% 증가"만으로는 좋은 성과인지 알 수 없습니다. 무엇과 비교했는지가 빠졌기 때문입니다. **전년 동기 대비, 도입 전 3개월 평균 대비, 팀 평균 대비**처럼 기준을 붙여야 숫자가 설득력을 가집니다.

      비율을 쓸 때는 계산을 한 번 더 확인합니다. 월 52건이던 오류가 38건이 되었다면 감소율은 (52-38)÷52로 약 26.9%입니다. 14일 걸리던 일을 9일로 줄였다면 5일, 약 35.7% 단축입니다. 면접에서 "어떻게 계산했나요?"라는 질문이 나오면 바로 답할 수 있어야 합니다.
  - h: 4. 매출이 없는 직무의 지표 예시
    body: |
      인사·총무·회계·개발·디자인 같은 직무는 "사내 고객"의 시간과 품질을 개선한 결과로 성과를 보여 줍니다. 아래 표에서 자기 직무에 맞는 지표를 골라 한 가지씩만 써 보십시오.
    table:
      head: [직무, 쓸 수 있는 지표]
      rows:
        - [인사·채용, "채용 소요일, 서류 합격자 면접 참석률, 수습 통과율"]
        - [총무·구매, "구매 단가 절감액, 발주 처리 시간, 재고 오차 건수"]
        - [회계·재무, "월 마감 소요일, 전표 오류 건수, 미수금 회수 기간"]
        - [개발, "배포 주기, 장애 건수·복구 시간, 페이지 응답 속도"]
        - [디자인·콘텐츠, "제작 리드타임, 클릭률·전환율 변화, 재작업 요청 건수"]
        - [고객지원, "첫 응답 시간, 재문의율, 만족도 점수"]
  - h: 5. 직무 중심과 프로젝트 중심, 무엇을 쓸까
    body: |
      같은 업무를 오래 맡아 전문성이 쌓였다면 **직무 중심**이 맞습니다. 담당 업무를 3~5개 묶음으로 나누고 묶음마다 성과를 한두 개씩 붙입니다. [경력기술서(직무 중심)](/form/career-desc-job/)은 이 구조로 칸이 나뉘어 있습니다.

      기간이 정해진 과제를 여러 번 수행한 기획·개발·컨설팅 직무라면 **프로젝트 중심**이 읽기 좋습니다. 프로젝트마다 기간·역할·참여 인원·사용 도구·결과를 적습니다. 여러 명이 함께한 성과는 **본인이 맡은 부분**을 분리해 적어야 면접에서 흔들리지 않습니다. [경력기술서(프로젝트 중심)](/form/career-desc-project/)를 참고하십시오.
  - h: 6. 제출 전 점검 목록
    body: |
      경력기술서는 [이력서(경력용)](/form/resume-experienced/)의 경력 칸을 풀어 쓴 문서입니다. 두 문서의 회사명·재직 기간·직급이 서로 맞는지 먼저 확인합니다. 지원 공고의 자격 요건 문장을 옆에 두고, 요건마다 대응하는 성과가 경력기술서에 하나 이상 있는지 표시해 보면 빠진 부분이 보입니다.
    list:
      - 최신 경력부터 역순으로 썼는가
      - 성과마다 비교 기준과 기간이 있는가
      - 회사 내부 기밀(고객명·단가·미공개 실적)을 그대로 쓰지 않았는가 — 비율로 바꿔 씁니다
      - 추정·과장한 숫자는 없는가
      - 지원 직무와 관련 없는 업무가 너무 길지 않은가
  - h: 7. 면접에서 숫자를 설명하는 법
    body: |
      경력기술서의 숫자는 면접 질문의 출발점이 됩니다. 면접관은 대체로 "그 성과에서 본인의 역할은 무엇이었나", "숫자는 어떻게 측정했나", "다시 한다면 무엇을 바꾸겠나" 세 가지를 묻습니다. 성과 문장마다 이 세 질문에 대한 답을 한두 문장씩 메모해 두면 면접 준비가 끝납니다.

      숫자가 좋지 않았던 경험도 준비해 둡니다. 목표에 못 미친 프로젝트에서 원인을 찾고 다음 분기에 개선한 과정은 성공 사례만큼 좋은 평가를 받습니다. 이때도 개선 전후를 숫자로 비교하면 설명이 짧고 분명해집니다.
