title: 경력기술서 성과 수치화 공식 — 직무형·프로젝트형 예시
description: 경력기술서의 성과 문장을 숫자로 바꾸는 공식과, 매출이 없는 지원·관리 직무에서 쓸 수 있는 지표, 직무 중심과 프로젝트 중심 경력기술서를 고르는 기준을 예시 문장으로 정리했습니다.
summary: 성과 문장은 **"무엇을(과제) + 어떻게(행동) + 얼마나(숫자 결과)"** 순서로 씁니다. 숫자는 비율(%)·기간 단축·건수·금액·규모 중 하나로 표현하고, 비교 기준(전년 대비·도입 전 대비)을 반드시 붙입니다. 매출이 없는 직무는 처리 시간·오류율·만족도 같은 운영 지표를 씁니다. 과장·추정치는 면접에서 검증되니 근거를 댈 수 있는 숫자만 적습니다.
keywords: [경력기술서 작성법, 경력기술서 성과, 성과 수치화, 경력기술서 예시, 이직 경력기술서, 프로젝트 경력기술서]
