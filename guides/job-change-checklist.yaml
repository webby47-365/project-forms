faq:
  - q: 합격 후 입사일을 얼마나 늦출 수 있나요?
    a: 회사마다 다르지만 인수인계를 이유로 한 달 정도는 일반적으로 받아들여집니다. 입사일은 처우 협의 단계에서 미리 제시하고 서면으로 확정하십시오.
  - q: 현 직장에 이직할 회사를 알려야 하나요?
    a: 알릴 의무는 없습니다. 다만 경업금지 약정이 있는 경우 동종업계 이직이 문제가 될 수 있으니 근로계약서와 서약서 내용을 먼저 확인하십시오.
  - q: 퇴사 후 경력증명서를 회사가 안 떼 줍니다.
    a: 계속 30일 이상 근무했다면 퇴직 후 3년 이내에 청구할 수 있고 회사는 즉시 발급해야 합니다. 거부하면 청구한 기록을 남겨 관할 노동청에 상담하십시오.
