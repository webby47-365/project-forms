title: 이직 준비 순서 — 이력서 정리부터 합격 후 퇴사 통보까지
description: 재직 중 이직을 준비할 때 서류를 먼저 만들고, 지원·면접·처우 협의·입사일 조율·퇴사 통보·경력증명서 발급까지 무엇을 어떤 순서로 해야 사고가 나지 않는지 단계별로 정리했습니다.
summary: 이직은 **서류 정리 → 지원·면접 → 처우 확정(서면) → 입사일 조율 → 퇴사 통보 → 인수인계·정산** 순서로 진행합니다. 새 회사의 **처우가 서면으로 확정되기 전에는 사직서를 내지 않는 것**이 가장 중요합니다. 입사일은 현 직장의 통보 기간(보통 30일)과 인수인계 기간을 더해 정하고, 경력증명서는 퇴사 전에 받아 둡니다.
keywords: [이직 준비, 이직 순서, 재직 중 이직, 퇴사 통보 시기, 처우 협의, 입사일 조율, 경력증명서 발급]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
show_on: [resume-experienced, cover-letter-experienced, career-certificate, resignation-simple, handover-report]
sections:
  - h: 1. 결론 — 합격 확정 전에는 사직서를 내지 않는다
    body: |
      이직 과정에서 가장 흔한 사고는 **최종 합격 연락만 받고 사직서를 먼저 내는 것**입니다. 처우 협의가 틀어지거나 입사가 미뤄지면 돌아갈 곳이 없어지고, 스스로 그만둔 것이라 실업급여도 받기 어렵습니다. 한번 수리된 사직서는 일방적으로 거둬들이기도 어렵습니다.

      그래서 순서가 중요합니다. 서류는 여유 있을 때 미리 만들고, 지원과 면접은 재직 중에 진행하고, 새 회사의 연봉·직급·입사일이 **메일이나 처우 확인서 같은 서면**으로 확정된 뒤에 퇴사를 알립니다.
  - h: 2. 서류 정리 — 지원 시작 3~4주 전
    body: |
      지원 공고가 뜬 뒤에 서류를 만들기 시작하면 마감에 쫓겨 성과 정리가 허술해집니다. [이력서(경력용)](/form/resume-experienced/)와 경력기술서를 먼저 완성해 두고, 공고마다 자격 요건에 맞춰 순서와 강조점만 바꾸는 방식이 효율적입니다.

      경력기술서의 성과 문장은 숫자와 비교 기준을 넣어 다듬습니다. 방법은 [경력기술서 성과 수치화 공식](/guide/career-description-quantify/)에 정리해 두었습니다. [자기소개서(경력용)](/form/cover-letter-experienced/)는 "왜 지금 이직하는가"와 "지원 직무에서 바로 할 수 있는 일"을 중심으로 씁니다. 현 직장을 깎아내리는 이직 사유는 쓰지 않습니다.
    list:
      - 재직 기간·직급·담당 업무를 인사 기록과 맞춰 확인
      - 포트폴리오·자격증 사본을 한 폴더에 정리
      - 채용 사이트 프로필의 공개 범위에서 현 직장 인사담당자가 볼 수 있는지 확인
  - h: 3. 지원과 면접 — 재직 중 일정 관리
    body: |
      면접 일정은 연차나 반차를 써서 잡고, 근무 시간 중에 회사 자원(회사 메일·노트북)으로 지원하지 않습니다. 회사 메일로 오간 기록은 회사 소유 자료로 남기 때문입니다. 지원한 회사·전형 단계·연락 담당자를 표로 관리하면 여러 곳을 동시에 진행해도 혼선이 없습니다.

      면접에서 퇴사 가능 시점을 물으면 "합격 통보 후 한 달 정도 인수인계 기간이 필요하다"고 솔직하게 답하는 편이 좋습니다. 당장 입사할 수 있다고 했다가 일정을 미루면 신뢰를 잃습니다.
  - h: 4. 처우 협의와 입사일 조율
    body: |
      최종 합격 뒤 연봉·직급·입사일을 협의합니다. 연봉은 총액만이 아니라 기본급·수당 구성, 성과급 기준, 퇴직금 포함 여부까지 확인해야 실제 비교가 됩니다. 연봉 총액이 같아도 구성에 따라 월 실수령액이 달라지니 [연봉 실수령액 계산기](/tools/salary/)로 현 직장과 나란히 비교해 보십시오.

      입사일은 **현 직장의 퇴사 통보 기간 + 인수인계 기간**을 역산해 정합니다. 취업규칙이나 근로계약서에 30일 전 통보가 있다면, 처우 확정 다음 날 통보해도 입사일은 그로부터 한 달 뒤가 현실적인 날짜입니다. 입사일이 확정되면 처우 내용을 메일로 한 번 더 정리해 받아 둡니다.
    table:
      head: [단계, 권장 시점]
      rows:
        - [서류 완성, 지원 시작 3~4주 전]
        - [처우 서면 확정, 퇴사 통보 전]
        - [퇴사 통보, 입사일 30일 전 이상(회사 규정 확인)]
        - [인수인계서 작성, 통보 직후~마지막 출근 1주 전]
        - [경력증명서 발급, 마지막 출근일 전]
  - h: 5. 퇴사 통보와 인수인계
    body: |
      처우가 확정되면 직속 상사에게 먼저 말로 알리고, 퇴사일이 합의되면 사직서를 제출합니다. 조건 협의가 필요 없는 일반적인 퇴사라면 [사직서(간편형)](/form/resignation-simple/)로 충분합니다. 회사가 사직서를 수리하지 않는 경우의 효력 발생일과 퇴사 절차 전체는 [사직서 제출부터 퇴사까지 절차 총정리](/guide/resignation-process/)에서 확인할 수 있습니다.

      인수인계는 문서로 남깁니다. [업무 인수인계서](/form/handover-report/)에 진행 중인 업무와 마감일, 거래처 담당자, 파일 위치를 적고 후임자 확인을 받아 두면 퇴사 후 연락이 이어지는 일도 줄고, 새 회사 입사 초기에 집중할 수 있습니다.
  - h: 6. 마지막 출근 전에 챙길 것
    body: |
      [경력증명서](/form/career-certificate/)는 새 회사가 입사 서류로 요구하는 경우가 많습니다. 근로기준법 제39조에 따라 회사는 퇴직한 근로자가 사용 기간·업무 종류·지위·임금 등에 관한 증명서를 청구하면 사실대로 적어 즉시 내주어야 하고, 시행령에 따라 계속 30일 이상 근무한 사람은 퇴직 후 3년 이내에 청구할 수 있습니다. 그래도 퇴사 전에 받아 두는 편이 편합니다.

      퇴직금과 미지급 임금은 퇴직일부터 14일 이내에 정산받아야 합니다. 개인 파일은 정리하되 회사 자료를 개인 저장장치로 옮기지 않습니다. 영업비밀 유출 분쟁은 이직 직후에 가장 많이 생깁니다.
    list:
      - 퇴직금·연차수당 정산 내역 확인 ([퇴직금 계산기](/tools/severance/)로 대조)
      - 원천징수영수증(새 회사 연말정산에 필요)
      - 회사 계정·출입카드·장비 반납 기록
      - 새 회사 입사 서류 목록과 제출 기한
  - h: 7. 입사 첫 달에 할 일
    body: |
      새 회사에 입사하면 근로계약서를 입사일 전후로 반드시 받아 처우 협의 때 받은 메일 내용과 일치하는지 확인합니다. 수습 기간이 있다면 기간과 수습 중 급여 조건도 계약서에 적혀 있어야 합니다.

      전 직장 원천징수영수증은 새 회사 연말정산에 합산해야 하므로 인사팀에 제출합니다. 퇴직금을 IRP 계좌로 받았다면 계좌 정보도 함께 정리해 둡니다.
