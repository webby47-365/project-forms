faq:
  - q: 5인 미만 회사에 다니면 연차가 전혀 없나요?
    a: 근로기준법의 연차 규정은 상시 5인 미만 사업장에는 적용되지 않습니다. 다만 근로계약서나 취업규칙에 휴가를 정해 두었다면 그 약속에 따라 받을 수 있습니다.
  - q: 연차수당은 언제 받나요?
    a: 사용기간 1년이 끝난 뒤 수당 청구권이 생기므로, 보통 그 다음 급여일에 함께 지급합니다. 퇴사하는 경우에는 다른 금품과 함께 퇴직일부터 14일 안에 정산해야 합니다.
  - q: 병가나 육아휴직 기간은 출근율에서 어떻게 보나요?
    a: 업무상 부상·질병 휴업, 출산전후휴가, 육아휴직 기간은 법에 따라 출근한 것으로 봅니다. 개인 사유 병가는 회사 규정에 따라 달라질 수 있으니 취업규칙을 확인하십시오.
