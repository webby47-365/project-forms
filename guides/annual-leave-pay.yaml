slug: annual-leave-pay
status: published
group: pay
title: 연차 발생 기준과 연차수당 계산법
description: 입사 1년 미만 월차, 1년 15일, 3년 차부터 늘어나는 연차 일수와 사용기한, 미사용 연차수당 계산식과 사용촉진제도, 퇴사할 때 정산하는 방법을 예시로 정리했습니다.
summary: 연차는 입사 1년 미만에는 **한 달 개근마다 1일(최대 11일)**, 1년이 되면 **15일**이 생기고 3년 차부터 2년마다 1일씩 늘어 최대 25일입니다. 발생일로부터 1년 안에 쓰지 못한 연차는 **1일 통상임금 × 남은 일수**로 수당을 받습니다. 다만 회사가 사용촉진 절차를 제대로 밟았다면 수당 지급 의무가 없어집니다.
keywords: [연차 발생 기준, 연차수당 계산, 미사용 연차수당, 연차 사용촉진, 퇴사 연차 정산, 1년 미만 월차]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
sections:
  - h: 1. 연차는 언제 몇 일 생기나
    body: |
      연차유급휴가는 근로기준법 제60조가 정합니다. 상시 근로자 **5인 이상** 사업장에 적용되고, 정규직·계약직·수습 구분 없이 같은 규칙입니다. 단시간 근로자는 소정근로시간에 비례해 줄어듭니다.

      입사 첫해에는 1개월을 개근할 때마다 1일씩 생겨 최대 11일이 됩니다. 입사 1년이 되는 날 그 해 출근율이 80% 이상이면 15일이 한꺼번에 생기고, 근속 3년 차부터는 2년마다 1일씩 더해집니다. 정확한 일수는 [연차 계산기](/tools/annual-leave/)에 입사일을 넣으면 연도별로 확인할 수 있습니다.
    table:
      head: [근속, 연차 일수, 비고]
      rows:
        - [1년 미만, 매월 1일 (최대 11일), 1개월 개근 시]
        - [1년 이상, 15일, 출근율 80% 이상]
        - [3년 이상, 16일, 2년마다 1일 가산]
        - [5년 이상, 17일, "—"]
        - [21년 이상, 25일, 상한]
  - h: 2. 연차는 쌓이지 않는다 — 사용기한 1년
    body: |
      연차는 **발생일로부터 1년** 안에 써야 합니다(제60조 제7항). 1년 미만 기간에 생긴 월 단위 연차는 입사일로부터 1년 안에 써야 합니다. 기한이 지난 연차는 휴가로서는 소멸하고, 대신 쓰지 못한 일수만큼 수당을 청구할 권리가 남습니다.

      그래서 입사 3년 차 직원이 "지금까지 41일이 생겼다"고 계산해도 지금 쓸 수 있는 휴가는 가장 최근에 생긴 15일뿐입니다. 앞선 발생분은 이미 수당으로 정산됐어야 하는 몫입니다.
  - h: 3. 미사용 연차수당 계산법
    body: |
      연차수당은 **1일 통상임금 × 쓰지 못한 연차 일수**입니다. 1일 통상임금은 기본급과 매월 고정으로 받는 수당(직책수당·자격수당 등)을 합한 월 통상임금을 월 소정근로시간으로 나눈 뒤 하루 근로시간을 곱해 구합니다. 주 40시간 근무자의 월 소정근로시간은 주휴를 포함해 **209시간**입니다.
    table:
      head: [항목, 예시 (월 통상임금 300만원 · 미사용 5일)]
      rows:
        - [시간당 통상임금, "3,000,000 ÷ 209 = 14,354원"]
        - [1일 통상임금, "14,354 × 8시간 = 114,832원"]
        - [연차수당, "114,832 × 5일 = 574,160원"]
    list:
      - 연장·야간근로수당, 실적에 따라 달라지는 성과급은 통상임금에 넣지 않습니다.
      - 연차수당도 근로소득이므로 급여와 합산해 4대보험료와 소득세가 붙습니다.
  - h: 4. 사용촉진제도를 거치면 수당이 없다
    body: |
      근로기준법 제61조의 **연차 사용촉진**을 회사가 절차대로 진행했다면, 근로자가 끝내 쓰지 않은 연차에 대해 수당을 줄 의무가 사라집니다. 절차는 두 단계입니다.

      먼저 사용기간이 끝나기 6개월 전을 기준으로 10일 이내에 회사가 근로자별 남은 연차 일수를 알리고 사용 시기를 정해 달라고 **서면으로** 촉구합니다. 근로자가 10일 안에 시기를 정하지 않으면, 회사는 기간 만료 2개월 전까지 사용 시기를 정해 다시 서면으로 통보합니다. 구두나 단체 공지만으로는 인정되지 않는 경우가 많으니, 회사로부터 받은 서면 통보가 있는지 확인하십시오. 촉진을 받았다면 [연차사용계획서](/form/annual-leave-plan/)로 사용 일정을 정해 제출하는 것이 안전합니다.
  - h: 5. 퇴사할 때 연차 정산
    body: |
      퇴사하면 남은 연차는 휴가로 쓸 수 없으므로 수당으로 정산합니다. 퇴직 시점의 사용촉진은 효력이 없어서, 남은 일수는 원칙적으로 모두 수당 대상입니다. 퇴사 전에 남은 연차를 휴가로 모두 쓰고 나가는 방법도 있는데, 이 경우 [휴가신청서](/form/leave-request/)로 기록을 남겨 두면 정산 때 다툼이 줄어듭니다.

      1년 계약직처럼 **정확히 1년(365일)만 근무하고 퇴사**하면 1년 차에 생기는 15일은 발생하지 않고 월 단위로 생긴 11일만 인정됩니다. 2021년 대법원 판결 이후 고용노동부 해석도 같은 기준입니다. 1년하고 하루 이상 근무해야 15일이 생깁니다.
  - h: 6. 회계연도 기준을 쓰는 회사라면
    body: |
      관리 편의를 위해 모든 직원의 연차를 매년 1월 1일에 한꺼번에 주는 회사가 많습니다(회계연도 기준). 입사 첫해에는 재직 일수에 비례해 연차를 먼저 주고, 이후 매년 1월 1일에 근속에 맞는 일수를 부여합니다.

      회계연도 기준은 허용되지만 **근로자에게 불리해서는 안 됩니다.** 퇴사할 때 입사일 기준으로 다시 계산해 받아야 할 연차가 더 많다면 그 차이를 수당으로 정산해야 합니다. 연차 계산기에서 두 기준을 바꿔 가며 비교해 보십시오.
  - h: 7. 수당을 받지 못했을 때
    body: |
      미사용 연차수당도 임금이라 근로기준법 제49조에 따라 **3년**이 지나면 소멸시효가 완성됩니다. 오래전에 쓰지 못한 연차라도 시효 안이라면 청구할 수 있으니, 연도별 발생·사용 기록을 급여명세서와 함께 모아 두십시오. 퇴사 후 14일이 지나도 정산되지 않으면 [임금체불 내용증명](/form/certified-notice-wage/)으로 지급을 요구하고 관할 노동청에 진정을 넣을 수 있습니다.
