slug: labor-contract-checklist
status: published
group: pay
title: 근로계약서 필수 기재사항과 작성 체크리스트
description: 근로기준법이 서면으로 반드시 적도록 한 임금·근로시간·휴일·연차 항목, 계약직·아르바이트에 추가로 필요한 기재사항, 서명 전에 확인할 조항과 교부 의무를 정리했습니다.
summary: 근로계약서에는 **임금(구성항목·계산방법·지급방법), 소정근로시간, 휴일, 연차유급휴가**를 반드시 서면으로 적고 근로자에게 한 부를 내주어야 합니다(근로기준법 제17조). 계약직·단시간 근로자는 계약기간, 근로일과 근로일별 근로시간 등을 추가로 적어야 하며, 어기면 회사에 벌금이나 과태료가 부과됩니다.
keywords: [근로계약서 필수 기재사항, 근로계약서 작성법, 근로계약서 미작성, 아르바이트 근로계약서, 계약직 근로계약서, 근로계약서 교부]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
sections:
  - h: 1. 반드시 서면으로 적어야 하는 항목
    body: |
      근로기준법 제17조는 근로계약을 맺을 때 근로조건을 밝히도록 하고, 그중 핵심 네 가지는 **서면으로 명시하고 근로자에게 교부**하도록 정하고 있습니다. 말로만 약속하거나, 작성만 하고 근로자에게 주지 않으면 위반입니다.
    table:
      head: [서면 명시 항목, 적는 방법]
      rows:
        - [임금, "기본급·각종 수당의 구성항목, 계산방법(월급·시급), 지급일과 지급방법(계좌이체 등)"]
        - [소정근로시간, "시업·종업 시각과 휴게시간 (예 09:00~18:00, 휴게 12:00~13:00)"]
        - [휴일, 주휴일 요일 (예 매주 일요일 유급휴일)]
        - [연차유급휴가, 근로기준법에 따른다는 문구 또는 부여 기준]
    list:
      - 이 밖에 **취업 장소와 담당 업무**, 취업규칙에 정한 사항도 명시 대상입니다.
      - 서면 명시·교부 의무를 어기면 500만원 이하의 벌금 대상입니다(제114조).
  - h: 2. 계약직·단시간 근로자는 더 적어야 한다
    body: |
      기간을 정한 계약직과 주 소정근로시간이 짧은 단시간 근로자(아르바이트 포함)는 「기간제 및 단시간근로자 보호 등에 관한 법률」 제17조가 추가로 적용됩니다. 위 네 가지에 더해 **근로계약기간, 휴게시간, 취업 장소와 업무**를 서면으로 적어야 하고, 단시간 근로자는 **근로일과 근로일별 근로시간**까지 적어야 합니다.

      계약 기간이 있는 경우 [기간제 근로계약서](/form/fixed-term-labor-contract/)를, 요일마다 시간이 다른 아르바이트는 [단시간 근로계약서](/form/labor-contract-parttime/)를 쓰면 필요한 칸이 이미 나뉘어 있습니다. 기간 없이 채용하는 정규직은 [표준근로계약서](/form/labor-contract-standard/)가 기본입니다.
  - h: 3. 임금 칸은 이렇게 확인한다
    body: |
      분쟁이 가장 많은 곳이 임금입니다. 월급 총액만 적지 말고 **기본급과 수당을 나눠 적는지** 확인하십시오. 연장근로수당을 미리 정액으로 넣는 포괄임금 방식이라면 몇 시간분인지가 적혀 있어야 나중에 초과 근무를 따질 수 있습니다.

      시급은 최저임금 이상이어야 합니다. **2026년 최저임금은 시간당 10,320원**이며, 주 40시간 근무자의 월 환산액(209시간 기준)은 2,156,880원입니다. 식대처럼 비과세로 처리하는 항목이 있다면 실수령액이 달라지므로 [연봉 실수령액 계산기](/tools/salary/)로 미리 계산해 보십시오.
    list:
      - 수습기간이 있다면 기간과 수습 중 임금(1년 이상 계약일 때 3개월까지 최저임금의 90% 가능, 단순노무직 제외)
      - 상여금 지급 기준과 퇴직 시 일할 지급 여부
      - 퇴직금을 연봉에 포함한다는 문구는 법정 퇴직금을 대신하지 못합니다
  - h: 4. 서명 전에 한 번 더 볼 조항
    body: |
      근로계약서는 한번 서명하면 그 내용이 근로조건의 기준이 됩니다. 법보다 불리한 조건은 무효이지만, 무효를 다투는 과정 자체가 부담입니다. 서명 전에 아래 조항을 확인하고, 이해가 안 되면 수정이나 설명을 요청하십시오.
    list:
      - "**위약금·손해배상 예정** — 조기 퇴사 시 교육비 전액 반환, 벌금 공제 같은 조항은 근로기준법 제20조에 위반될 수 있습니다."
      - "**경업금지** — 퇴사 후 동종업계 취업을 막는 조항은 기간·지역·보상이 합리적이어야 효력이 인정됩니다."
      - "**근무 장소·업무 변경** — 회사가 일방적으로 바꿀 수 있다는 포괄 조항은 범위를 확인합니다."
      - "**비밀유지** — 범위가 넓다면 별도의 [비밀유지계약서](/form/nda/)로 대상 정보를 특정하는 편이 명확합니다."
  - h: 5. 작성 시점과 보관
    body: |
      근로계약서는 **일을 시작하기 전**, 늦어도 첫 출근일에 작성해야 합니다. "수습이 끝나면 쓰자"는 것은 위반입니다. 임금이 오르거나 근무시간이 바뀌면 바뀐 조건으로 다시 작성하거나 변경 합의서를 남겨야 합니다.

      근로자는 받은 계약서를 퇴사 후에도 보관하십시오. 임금체불·퇴직금 분쟁에서 가장 먼저 요구되는 증거이고, 회사가 교부하지 않았다면 그 사실 자체를 고용노동부에 신고할 수 있습니다. 사용자도 근로계약서를 근로관계가 끝난 뒤 3년간 보존해야 합니다(제42조).
  - h: 6. 근로계약서를 받지 못했다면
    body: |
      재직 중이라도 회사에 근로계약서 작성과 교부를 요구할 수 있습니다. 요구는 메일이나 메신저처럼 기록이 남는 방법으로 합니다. 회사가 끝내 작성하지 않으면 관할 노동청에 진정할 수 있고, 이때는 계약서 대신 **급여 이체 내역, 출퇴근 기록, 채용 공고, 업무 지시 메시지**가 근로조건을 보여 주는 증거가 됩니다.

      이미 퇴사했더라도 임금·퇴직금 분쟁이 있다면 같은 자료로 근로조건을 입증할 수 있습니다. 퇴사 전에 급여명세서와 근무 기록을 개인 보관용으로 챙겨 두십시오. 회사 영업자료가 아니라 본인의 근로조건 자료만 챙기면 됩니다.
