faq:
  - q: 근로계약서를 안 쓰고 일했으면 월급을 못 받나요?
    a: 아닙니다. 계약서가 없어도 실제로 일한 사실이 있으면 근로관계는 성립하고 임금·퇴직금 청구권이 있습니다. 급여 이체 내역, 출퇴근 기록, 업무 메시지가 증거가 됩니다. 계약서를 작성·교부하지 않은 것은 회사의 법 위반입니다.
  - q: 전자 근로계약서도 효력이 있나요?
    a: 있습니다. 전자문서도 서면으로 인정되므로 전자서명으로 체결하고 근로자가 언제든 열람·출력할 수 있게 주면 교부 의무를 지킨 것으로 봅니다.
  - q: 아르바이트도 주휴수당을 계약서에 적어야 하나요?
    a: 주 소정근로시간이 15시간 이상이면 주휴일이 생기므로 휴일 항목에 유급 주휴일을 적어야 합니다. 15시간 미만이면 주휴일·연차가 적용되지 않습니다.
