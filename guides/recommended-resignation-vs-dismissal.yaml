faq:
  - q: 권고사직도 실업급여를 받을 수 있나요?
    a: 회사의 경영상 필요(인원 감축 등)에 따른 권고로 퇴사했다면 받을 수 있습니다. 다만 근로자에게 중대한 귀책사유가 있어 권고받은 경우는 제한됩니다.
  - q: 사직서를 이미 냈는데 철회할 수 있나요?
    a: 회사가 사직을 받아들이기 전이라면 철회할 수 있는 경우가 있지만, 수리된 뒤에는 일방적으로 철회하기 어렵습니다. 철회 의사는 즉시 서면으로 전달하십시오.
  - q: 문자로 해고 통보를 받았습니다. 효력이 있나요?
    a: 근로기준법은 해고사유와 시기를 서면으로 통지하도록 정합니다. 사유가 적히지 않은 문자 통보는 효력이 인정되지 않을 수 있으니 받은 내용을 보관하고 상담을 받으십시오.
