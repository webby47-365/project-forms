slug: recommended-resignation-vs-dismissal
status: published
group: quit
title: 권고사직과 부당해고 차이 — 사직서에 서명하기 전 확인할 것
description: 회사가 퇴사를 권할 때 사직서에 서명하면 해고가 아니라 합의 퇴사가 됩니다. 권고사직과 해고의 법적 차이, 해고 예고와 서면 통지, 부당해고 구제신청 기한, 합의서에 넣을 조건을 정리했습니다.
summary: 권고사직은 회사의 권유에 근로자가 **동의해 사직서를 내는 합의 퇴사**라 부당해고 구제신청 대상이 아닙니다. 해고는 회사가 일방적으로 끝내는 것으로, **서면 통지가 없으면 효력이 없고** 상시 5인 이상 사업장이면 해고일부터 **3개월 안에** 노동위원회에 구제신청을 할 수 있습니다. 서명 전 퇴사일·위로금·이직 사유 기재를 합의서로 남기십시오.
keywords: [권고사직, 부당해고, 권고사직 실업급여, 해고예고수당, 해고 서면통지, 부당해고 구제신청, 권고사직 합의서]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
show_on: [settlement-agreement, certified-notice, severance-calculation, disciplinary-notice]
sections:
  - h: 1. 결론 — 서명하는 순간 해고가 아니게 된다
    body: |
      회사가 "나가 달라"고 말해도 근로자가 사직서에 서명해 제출하면 법적으로는 **근로자와 회사가 합의해 근로계약을 끝낸 것**(합의해지)이 됩니다. 이렇게 되면 해고에 적용되는 정당한 이유 요건, 서면 통지 의무, 노동위원회 구제 절차를 주장하기 어렵습니다.

      반대로 사직서를 내지 않았는데 회사가 일방적으로 출근을 막거나 계약을 끝냈다면 그것은 해고입니다. 그래서 퇴사 권유를 받았을 때 가장 먼저 할 일은 **바로 서명하지 않고 조건을 확인하는 것**입니다. 서명은 조건이 문서로 정리된 뒤에 해도 늦지 않습니다.
  - h: 2. 권고사직과 해고 한눈에 비교
    table:
      head: [구분, 권고사직, 해고]
      rows:
        - [끝내는 방식, 회사 권유 + 근로자 동의(사직서 제출), 회사의 일방적 의사표시]
        - [정당한 이유 필요, 필요 없음(합의), 필요함(근로기준법 제23조)]
        - [서면 통지, 의무 없음, 해고사유·시기를 서면 통지해야 효력(제27조)]
        - [해고 예고, 해당 없음, 30일 전 예고 또는 30일분 이상 통상임금(제26조)]
        - [노동위원회 구제신청, 원칙적으로 불가, 상시 5인 이상 사업장이면 3개월 안에 가능]
        - [실업급여, 경영상 이유의 권고라면 수급 가능, 중대한 귀책사유 해고가 아니면 수급 가능]
    body: |
      퇴직금과 미사용 연차수당은 어느 경우든 똑같이 받습니다. 차이는 **다툴 수 있는 권리**와 **위로금을 협상할 여지**에 있습니다.
  - h: 3. 해고라면 회사가 지켜야 할 절차
    body: |
      해고는 사유만큼 절차가 중요합니다. 근로기준법 제27조는 해고사유와 해고시기를 **서면으로 통지해야 효력이 있다**고 정합니다. 문자 한 통이나 구두 통보만으로 한 해고는 절차 위반으로 무효가 될 수 있습니다. 징계 해고라면 취업규칙에 정한 징계위원회 개최·소명 기회 부여 같은 절차도 지켜야 합니다.

      해고 예고(제26조)는 적어도 30일 전에 알리거나, 알리지 않았다면 30일분 이상의 통상임금을 지급하는 의무입니다. 계속 근로 기간이 3개월 미만이거나 천재지변 등으로 사업을 계속할 수 없는 경우 등은 예외입니다. 예고 의무를 어겼다고 해고 자체가 무효가 되는 것은 아니고, 해고예고수당을 청구할 수 있다는 의미입니다.
    list:
      - "[징계 통보서](/form/disciplinary-notice/)를 받았다면 사유와 날짜가 구체적으로 적혀 있는지 확인합니다."
      - 통보를 받은 날짜와 방식(서면·문자·구두)을 기록해 둡니다.
  - h: 4. 부당해고 구제신청 — 3개월 안에
    body: |
      상시 근로자 5인 이상 사업장에서 정당한 이유 없이 해고되었다면, **해고된 날부터 3개월 이내**에 사업장 소재지를 관할하는 지방노동위원회에 구제신청을 할 수 있습니다. 노동위원회가 부당해고로 판정하면 원직복직을 명하거나, 근로자가 복직을 원하지 않을 때는 해고 기간 동안 받을 수 있었던 임금 상당액 이상의 금품을 지급하도록 명할 수 있습니다.

      5인 미만 사업장은 이 절차가 적용되지 않아 법원에 해고무효확인 소송을 내는 방법으로 다퉈야 합니다. 기한이 짧으니 해고 통보를 받았다면 서면 통지서, 근로계약서, 급여 내역을 먼저 모아 두고 상담을 받으십시오.
  - h: 5. 권고사직에 응한다면 합의서에 넣을 것
    body: |
      권고사직에 응하기로 했다면 조건을 말로 끝내지 말고 [합의서](/form/settlement-agreement/)로 남깁니다. 사직서의 사유란에도 "회사의 권고에 의한 사직"이라고 적어 두면 실업급여 신청 때 이직 사유를 설명하기 쉬워집니다. 회사가 이직확인서에 사유를 사실과 다르게 적는지도 확인하십시오.
    list:
      - "**퇴사일**과 그때까지의 근무 방식(출근·재택·유급 대기)"
      - "**위로금 금액과 지급일** — 법정 퇴직금과 별도라는 문구"
      - "**이직 사유**를 '경영상 필요에 따른 권고사직'으로 신고한다는 확인"
      - 미사용 연차 정산, 경력증명서 발급
      - "'향후 어떠한 이의도 제기하지 않는다'는 부제소 문구가 있다면 범위를 확인 — 법정 퇴직금·임금 청구까지 포기하는 문장인지 봅니다"
  - h: 6. 퇴사 후 돈 정산과 이의 제기
    body: |
      권고사직이든 해고든 퇴직한 날부터 14일 이내에 임금·퇴직금 등 금품을 정산받아야 합니다. 회사가 준 [퇴직금 정산서](/form/severance-calculation/)의 평균임금과 근속기간이 맞는지 [퇴직금 계산기](/tools/severance/)로 대조하십시오.

      약속한 위로금이나 퇴직금이 들어오지 않으면 [내용증명](/form/certified-notice/)으로 지급을 요구하고, 그래도 해결되지 않으면 고용노동부에 임금체불 진정을 넣을 수 있습니다. 서명을 강요받았거나 속아서 서명했다고 느낀다면 그 경위를 날짜별로 기록해 두고 노무사·변호사와 상담하십시오.
  - h: 7. 면담 자리에서 기억할 세 가지
    body: |
      퇴사 권유 면담은 예고 없이 잡히는 경우가 많습니다. 그 자리에서 결정하지 않아도 됩니다. "조건을 문서로 받아 보고 답하겠다"고 말하고, 면담 날짜·참석자·회사가 제시한 조건을 당일 메모로 남기십시오. 회사가 제시한 조건은 메일로 다시 보내 달라고 요청하면 기록이 됩니다.
