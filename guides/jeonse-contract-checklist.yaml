faq:
  - q: 등기부등본은 언제 떼어 봐야 하나요?
    a: 계약 직전, 잔금 치르기 직전, 전입신고 다음 날 세 번 확인하는 것이 안전합니다. 계약 후 잔금일 사이에 대출이나 압류가 새로 들어오는 경우가 있기 때문입니다.
  - q: 전입신고와 확정일자는 같은 날 해야 하나요?
    a: 같은 날 하는 것이 가장 안전합니다. 전입신고는 다음 날 0시에 대항력이 생기고, 확정일자는 받은 날부터 우선변제 순위의 기준이 됩니다. 임대차 신고를 하면 확정일자가 함께 부여됩니다.
  - q: 집주인이 전입신고를 하지 말아 달라고 합니다.
    a: 전입신고를 하지 않으면 대항력과 우선변제권이 생기지 않아 보증금을 보호받기 어렵습니다. 이런 요구를 조건으로 거는 집은 계약하지 않는 것이 좋습니다.
