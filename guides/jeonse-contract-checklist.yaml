title: 전월세 계약 전 확인사항 체크리스트
description: 전세사기를 피하기 위해 계약 전에 볼 등기사항증명서 갑구·을구, 집주인 신분·세금 체납 확인, 계약서 특약, 잔금일 전입신고·확정일자와 임대차 신고까지 순서대로 정리했습니다.
summary: 전월세 계약 전에는 **등기사항증명서로 소유자와 근저당·압류를 확인**하고, 계약서의 임대인이 등기상 소유자와 같은지 신분증으로 대조합니다. 선순위 채권과 보증금을 더한 금액이 집값보다 크면 위험 신호입니다. 잔금을 치르는 날 **전입신고와 확정일자**를 받아야 대항력과 우선변제권이 생기고, 계약 후 30일 안에 임대차 신고를 합니다.
keywords: [전세 계약 전 확인사항, 전월세 체크리스트, 등기부등본 보는 법, 전입신고 확정일자, 전세사기 예방, 임대차 신고]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
sections:
  - h: 1. 등기사항증명서(등기부등본) 확인
    body: |
      계약 전에 대법원 인터넷등기소에서 해당 주소의 **등기사항전부증명서**를 직접 발급해 봅니다. 중개사가 보여 준 사본이 아니라 계약 당일과 잔금 당일에 다시 떼어 변동이 없는지 확인하는 것이 핵심입니다.
    table:
      head: [구분, 볼 내용, 위험 신호]
      rows:
        - [표제부, 주소·면적·용도, "실제 호수·면적과 다름, 용도가 주택이 아님"]
        - [갑구 (소유권), "현재 소유자, 소유권 이전 시기", "압류·가압류·가처분·경매개시결정, 최근 잦은 소유자 변경"]
        - [을구 (소유권 외), "근저당권·전세권·임차권등기", "채권최고액이 큼, 임차권등기(전 세입자가 보증금을 못 받음)"]
  - h: 2. 보증금이 안전한지 계산해 보기
    body: |
      집이 경매로 넘어가면 먼저 등기된 권리부터 돈을 가져갑니다. 그래서 **선순위 채권(근저당 채권최고액 등) + 내 보증금**이 집의 시세보다 크면 보증금을 전부 돌려받지 못할 수 있습니다. 경매 낙찰가는 보통 시세보다 낮으므로 여유를 두고 판단해야 합니다.

      다가구주택은 건물 전체가 하나의 등기라, 나보다 먼저 들어온 **다른 세입자들의 보증금 합계**도 선순위가 될 수 있습니다. 집주인에게 선순위 임차인 보증금 내역을 요구하고, 계약 후에는 주민센터에서 확정일자 부여 현황을 열람할 수 있습니다.
    list:
      - 시세는 국토교통부 실거래가 공개시스템에서 같은 단지·유사 주택 거래로 확인합니다.
      - 신축 빌라처럼 거래 사례가 없어 시세 판단이 어려운 집은 특히 신중해야 합니다.
      - 전세보증금 반환보증 가입이 가능한 집인지 미리 확인해 두면 위험을 가늠하는 기준이 됩니다.
  - h: 3. 집주인 본인과 세금 체납 확인
    body: |
      계약서에 서명하는 사람이 **등기상 소유자 본인인지 신분증으로 대조**합니다. 공동소유라면 소유자 전원이 서명하거나, 나머지 소유자의 위임이 필요합니다. 대리인과 계약할 때는 소유자의 [위임장](/form/power-of-attorney/)과 인감증명서를 받고, 가능하면 소유자와 직접 통화해 계약 사실을 확인합니다. 보증금은 반드시 **소유자 명의 계좌**로 보냅니다.

      집주인이 국세·지방세를 체납하고 있으면 경매 때 세금이 보증금보다 먼저 배분될 수 있습니다. 보증금이 1,000만원을 넘는 임차인은 계약 후 임대차 시작일까지 **집주인 동의 없이도** 세무서에서 미납 국세를 열람할 수 있습니다. 계약 전이라면 집주인에게 납세증명서를 요청하십시오.
  - h: 4. 계약서에 넣을 특약
    body: |
      [주택임대차계약서](/form/housing-lease-contract/)의 표준 조항만으로는 계약 후 잔금일까지 생기는 위험을 막지 못합니다. 아래 같은 특약을 구체적으로 적어 두면 문제가 생겼을 때 계약을 해제하고 계약금을 돌려받을 근거가 됩니다.
    list:
      - "임대인은 **잔금일 다음 날까지** 근저당권 등 새로운 권리를 설정하지 않는다. 위반 시 임차인은 계약을 해제할 수 있고 임대인은 계약금을 반환한다."
      - "잔금일 기준 등기사항에 계약 당시 없던 권리가 있으면 계약을 해제할 수 있다."
      - "임대인의 국세·지방세 체납 사실이 확인되면 계약을 해제할 수 있다."
      - "전세보증금 반환보증 가입이 거절되면 계약을 해제하고 계약금을 반환한다."
      - "입주 전 하자(누수·보일러 등)의 수리 책임과 기한"
  - h: 5. 잔금일에 할 일 — 전입신고·확정일자
    body: |
      주택임대차보호법상 **대항력**은 집을 인도받고(이사) 전입신고를 마친 **다음 날 0시**에 생깁니다. 여기에 계약서에 **확정일자**를 받아 두면 경매 때 후순위 권리자보다 먼저 보증금을 받을 **우선변제권**이 생깁니다. 은행 근저당은 설정 당일 효력이 생기므로, 잔금일에 집주인이 대출을 받으면 세입자가 뒤로 밀리게 됩니다. 앞의 특약이 필요한 이유입니다.

      이사 당일 입주 상태를 사진과 함께 [입주 점검표](/form/move-in-checklist/)에 기록해 두면 퇴거 때 원상복구 범위를 두고 다투지 않아도 됩니다.
  - h: 6. 계약 후 30일 안에 임대차 신고
    body: |
      보증금 6,000만원을 넘거나 월세 30만원을 넘는 주택 임대차 계약은 계약일부터 **30일 이내에 신고**해야 합니다(주택 임대차 계약 신고제). 주민센터나 부동산거래관리시스템에서 신고하고, 신고를 마치면 **확정일자가 자동으로 부여**됩니다. 기간 안에 신고하지 않으면 과태료가 부과될 수 있습니다.

      계약을 갱신하거나 보증금이 바뀌어도 신고 대상입니다. 계약갱신청구권을 쓸 때는 [임대차 계약 갱신계약서](/form/lease-renewal-contract/)로 변경된 조건을 남기십시오.
  - h: 7. 계약이 끝날 때 보증금 돌려받기
    body: |
      집주인이 계약 만료 **6개월 전부터 2개월 전까지** 갱신 거절이나 조건 변경을 알리지 않으면 같은 조건으로 계약이 갱신된 것으로 봅니다(주택임대차보호법 제6조). 이사를 계획한다면 이 기간 안에 집주인에게 계약을 끝내겠다고 문자·메일로 알려 기록을 남깁니다.

      만료일에 보증금을 받지 못한 채 이사해야 한다면, 먼저 법원에 **임차권등기명령**을 신청해 등기가 된 것을 확인한 뒤 이사해야 대항력과 우선변제권이 유지됩니다. 반환을 요구할 때는 [전세보증금 반환 내용증명](/form/deposit-return-notice/)을 보냅니다.
