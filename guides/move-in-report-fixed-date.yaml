faq:
  - q: 전입신고는 이사 며칠 전에도 할 수 있나요?
    a: 전입신고는 실제로 전입한 날부터 하는 것이 원칙입니다. 인도 전에 미리 신고할 수 있는지는 주민센터에 확인하십시오.
  - q: 전입신고만 하면 보증금이 보호되나요?
    a: 대항력은 생기지만 경매 때 먼저 받을 수 있는 우선변제권은 확정일자까지 받아야 갖춥니다.
  - q: 전입신고를 14일 넘겨서 했어요. 어떻게 되나요?
    a: 대항력도 그만큼 늦게 생깁니다. 가능한 빨리 신고하십시오.

