slug: move-in-report-fixed-date
status: draft
group: housing
title: 전입신고·확정일자 하는 법 — 이사 후 순서와 효력 시점
description: 이사 후 14일 안에 하는 전입신고와 확정일자 받는 방법, 대항력·우선변제권이 생기는 시점, 대리 신고 때 필요한 서류를 순서대로 정리한 안내입니다.
summary: >-
  전입신고는 새 집에 전입한 날부터 **14일 이내**에 해야 하지만, 보증금을 지키려면 이사 당일 하는 것이 안전합니다.
  집을 넘겨받고 전입신고를 마치면 **다음 날부터 대항력**이 생기고, 여기에 **확정일자**까지 받아야 우선변제권을 갖춥니다.
keywords: [전입신고, 확정일자, 대항력, 우선변제권, 이사 당일, 전입신고 대리, 전입신고 위임장]
created_at: 2026-09-28
updated_at: 2026-09-28
basis_date: 2026-09-28
show_on: [move-in-report-poa, gov-move-in-report]

sections:
  - h: 1. 전입신고는 언제까지, 그리고 왜 이사 당일인가
    body: |
      전입신고는 세대주 등 신고의무자가 새로운 거주지에 전입한 날부터 **14일 이내**에 새 주소지의 읍·면사무소나 동 주민센터에 하거나 정부24에서 온라인으로 합니다. 정당한 사유 없이 기한을 넘기면 과태료가 부과될 수 있습니다.

      기한이 14일이라고 해서 14일째에 해도 된다는 뜻은 아닙니다. 세입자에게 전입신고는 단순한 주소 변경이 아니라 **보증금을 지키는 첫 단계**입니다. 임대차는 등기가 없어도 임차인이 ① 주택을 넘겨받고(인도) ② 주민등록을 마치면 그 **다음 날부터** 제3자에게 주장할 수 있는 힘(대항력)이 생깁니다. 하루라도 늦게 신고하면 그만큼 대항력이 늦게 생기므로, 이사 당일 신고하는 것이 가장 안전합니다.
  - h: 2. 대항력과 우선변제권, 무엇이 다른가
    body: |
      두 권리는 이름이 비슷하지만 지키는 대상이 다릅니다. 아래 표로 구분해 두면 편합니다.
    table:
      head: [구분, 갖추는 조건, 지켜 주는 것]
      rows:
        - [대항력, 주택 인도 + 전입신고, 집주인이 바뀌어도 계약 기간 동안 살 수 있고 새 집주인에게 보증금을 요구할 수 있는 힘]
        - [우선변제권, 대항요건 + 임대차계약서 확정일자, 집이 경매·공매로 넘어갈 때 후순위 권리자보다 먼저 보증금을 받을 수 있는 권리]
    list:
      - 대항요건(인도·전입신고)만 갖추면 대항력은 생기지만 우선변제권은 아닙니다.
      - 확정일자를 받아도 전입신고를 하지 않으면 대항요건이 없어 우선변제권을 주장하기 어렵습니다.
      - 두 가지를 모두 이사 당일에 끝내는 것이 안전합니다.
  - h: 3. 이사 당일 순서
    body: |
      계약서를 받았다면 순서는 단순합니다. 먼저 **열쇠를 받아 집을 넘겨받고**, 같은 날 전입신고를 하고, 이어서 확정일자를 받습니다.

      전입신고를 할 때는 등기사항증명서에 적힌 번지와 동·호수를 확인한 뒤 신고서에 **정확히** 적어야 합니다. 주소를 잘못 적으면 대항력을 인정받지 못할 수 있습니다. 연립·아파트는 동·호수까지 적고, 다가구주택은 지번만 적는 것이 안내되어 있습니다. 세대 구성이 바뀌는 경우에는 [전입신고서](/form/gov-move-in-report/)의 세대 구성 항목도 함께 확인하십시오.
    list:
      - "준비물: 신분증과 임대차계약서 원본(확정일자용)"
      - 온라인은 정부24, 방문은 새 주소지 주민센터
      - 확정일자는 전입신고를 한 창구에서 이어서 신청하면 편합니다.
  - h: 4. 확정일자, 어디서 어떻게 받나
    body: |
      확정일자는 임대차계약서에 찍는 날짜 도장으로, 그 날짜에 그 계약서가 존재했다는 사실을 증명합니다. 받을 수 있는 곳은 읍·면사무소와 동 주민센터, 지방법원 및 등기소, 공증인입니다. 계약서 원본을 가지고 가야 하며, 수수료는 생활법령정보 안내 기준 600원입니다(수급자·국가유공자 등은 면제).

      전입신고를 했다고 해서 확정일자가 **자동으로 부여되는 것은 아닙니다.** 별도로 신청해야 하므로 신고서만 내고 돌아오는 일이 없도록 하십시오. 전입신고와 확정일자를 모두 이사 당일 받으면 다음 날 0시부터 두 권리를 함께 갖추는 것으로 정리됩니다.
  - h: 5. 상황별 효력 시점 예시
    body: |
      날짜는 예시입니다. 실제 판단은 신고 접수 시점과 계약 내용에 따라 달라질 수 있습니다.
    table:
      head: [상황, 대항력, 우선변제권]
      rows:
        - ["10월 5일 인도·전입신고·확정일자를 모두 완료", "10월 6일 0시부터", "10월 6일 0시부터"]
        - ["10월 5일 인도·전입신고, 10월 8일 확정일자", "10월 6일 0시부터", "확정일자까지 갖춘 10월 8일 이후로 보는 것이 일반적"]
        - ["10월 5일 인도, 10월 12일 전입신고", "10월 13일 0시부터", "전입신고 이후 확정일자를 받은 때"]
    list:
      - 신고가 하루 늦어지면 대항력도 하루 늦게 생깁니다.
      - 확정일자를 나중에 받으면 그때 우선변제권을 갖춘 것으로 보는 것이 일반적입니다.
  - h: 6. 직접 못 갈 때는 대리 신고
    body: |
      전입신고를 가족이나 지인이 대신할 수도 있습니다. 정부24 안내에 따르면 대리인이 신청할 때는 신청인 서류 외에 **위임장과 대리인의 신분증**이 필요합니다. [전입신고 대리 위임장](/form/move-in-report-poa/)에 위임인·대리인·전입 주소와 이사한 날을 적고 서명하면 됩니다. 접수처에 따라 위임인 신분증 사본을 요구하기도 하니 미리 확인하십시오.

      확정일자도 대리로 신청할 수 있는지는 접수처마다 요구 서류가 다를 수 있으니 방문 전에 주민센터에 문의하십시오. 임대차 계약 자체는 [주택임대차계약서](/form/housing-lease-contract/)로 정리해 두면 확정일자 신청 때 그대로 쓸 수 있습니다.
  - h: 7. 이사 직후 체크
    list:
      - 신고 뒤 주민등록 등본에서 새 주소가 제대로 반영됐는지 확인합니다.
      - 임대차계약서 원본과 확정일자가 찍힌 페이지를 사진으로도 보관합니다.
      - 계약 기간이 끝나기 전에는 전출(주소 이동)하지 않습니다. 대항력은 주민등록이 유지되는 동안 이어집니다.
      - 입주 상태는 [입주 점검표](/form/move-in-checklist/)로 기록해 두면 나중에 보증금 정산 때 도움이 됩니다.

