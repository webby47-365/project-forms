title: 전입신고·확정일자 하는 법 — 이사 후 순서와 효력 시점
description: 이사 후 14일 안에 하는 전입신고와 확정일자 받는 방법, 대항력·우선변제권이 생기는 시점, 대리 신고 때 필요한 서류를 순서대로 정리한 안내입니다.
summary: >-
  전입신고는 새 집에 전입한 날부터 **14일 이내**에 해야 하지만, 보증금을 지키려면 이사 당일 하는 것이 안전합니다.
  집을 넘겨받고 전입신고를 마치면 **다음 날부터 대항력**이 생기고, 여기에 **확정일자**까지 받아야 우선변제권을 갖춥니다.
keywords: [전입신고, 확정일자, 대항력, 우선변제권, 이사 당일, 전입신고 대리, 전입신고 위임장]
created_at: 2026-09-28
updated_at: 2026-10-05
basis_date: 2026-10-05
show_on: [move-in-report-poa, gov-move-in-report]

sections:
  - h: 1. 전입신고는 언제까지, 그리고 왜 이사 당일인가
    body: |
      전입신고는 세대주 등 신고의무자가 새로운 거주지에 전입한 날부터 **14일 이내**에 새 주소지의 읍·면사무소나 동 주민센터에 하거나 정부24에서 온라인으로 합니다.

      기한이 14일이라고 해서 14일째에 해도 된다는 뜻은 아닙니다. 세입자에게 전입신고는 단순한 주소 변경이 아니라 **보증금을 지키는 첫 단계**입니다. 임대차는 등기가 없어도 임차인이 ① 주택을 넘겨받고(인도) ② 주민등록을 마치면 그 **다음 날부터** 제3자에게 주장할 수 있는 힘(대항력)이 생깁니다. 하루라도 늦게 신고하면 그만큼 대항력이 늦게 생기므로, 이사 당일 신고하는 것이 가장 안전합니다.

      신고는 세대주, 세대를 관리하는 사람, 본인 외에 세대주의 위임을 받은 배우자 또는 직계혈족도 할 수 있고, 기숙사·공동 숙소라면 관리자나 거주민이 할 수 있다고 안내되어 있습니다. 신고 장소는 읍사무소, 면사무소, 동 주민센터와 정부24 홈페이지입니다. 이사 날짜와 신고 날짜가 곧 대항력의 시작을 좌우하므로, 계약서를 쓰는 단계에서부터 입주일과 신고 일정을 함께 정해 두는 것이 좋습니다.
  - h: 2. 대항력과 우선변제권, 무엇이 다른가
    body: |
      두 권리는 이름이 비슷하지만 지키는 대상이 다릅니다. 아래 표로 구분해 두면 편합니다.
    table:
      head: [구분, 갖추는 조건, 지켜 주는 것]
      rows:
        - [대항력, 주택 인도 + 전입신고, 제3자에게 임차권을 주장할 수 있는 힘]
        - [우선변제권, 대항요건 + 임대차계약서 확정일자, 보증금을 우선하여 변제받을 수 있는 권리]
    list:
      - 대항요건(인도·전입신고)만 갖추면 대항력은 생기지만 우선변제권은 아닙니다.
      - 확정일자를 받아도 전입신고를 하지 않으면 대항요건이 없어 우선변제권을 주장하기 어렵습니다.
      - 두 가지를 모두 이사 당일에 끝내는 것이 안전합니다.
  - h: 3. 이사 당일 순서
    body: |
      계약서를 받았다면 순서는 단순합니다. 먼저 **열쇠를 받아 집을 넘겨받고**, 같은 날 전입신고를 하고, 이어서 확정일자를 받습니다.

      전입신고를 할 때는 임차주택의 소재지를 **정확히** 적어야 합니다. 세대 구성이 바뀌는 경우에는 [전입신고서](/form/gov-move-in-report/)의 세대 구성 항목도 함께 확인하십시오.
    list:
      - "준비물: 신분증과 임대차계약서 원본(확정일자용)"
      - 온라인은 정부24, 방문은 새 주소지 주민센터
      - 확정일자는 전입신고를 한 창구에서 이어서 신청하면 편합니다.
  - h: 4. 확정일자, 어디서 어떻게 받나
    body: |
      확정일자는 임대차계약서에 받는 날짜 확인입니다. 받을 수 있는 곳은 읍·면사무소와 동 주민센터, 시·군·구 출장소, 지방법원 및 지원, 등기소, 공증인입니다. 계약서 원본을 가지고 가야 하며, 수수료는 생활법령정보 안내 기준 600원이며, 계약증서가 4장을 넘으면 초과 4장마다 100원이 더해집니다(기초생활수급자·국가유공자 등은 면제).

      전입신고를 했다고 해서 확정일자가 **자동으로 부여되는 것은 아닙니다.** 별도로 신청해야 하므로 신고서만 내고 돌아오는 일이 없도록 하십시오. 대항요건과 확정일자를 모두 이사 당일 갖추는 것이 가장 안전합니다.
  - h: 5. 상황별 효력 시점 예시
    body: |
      날짜는 예시입니다. 실제 판단은 신고 접수 시점과 계약 내용에 따라 달라질 수 있습니다.
    table:
      head: [상황, 대항력, 우선변제권]
      rows:
        - ["10월 5일 인도·전입신고 완료", "10월 6일 0시부터", "확정일자도 받아야 갖춤"]
        - ["10월 5일 인도, 10월 12일 전입신고", "10월 13일 0시부터", "확정일자도 받아야 갖춤"]
    list:
      - 신고가 하루 늦어지면 대항력도 하루 늦게 생깁니다.
      - 우선변제권은 대항요건과 확정일자를 모두 갖춰야 하므로, 확정일자도 서둘러 받습니다.
  - h: 6. 직접 못 갈 때는 대리 신고
    body: |
      전입신고를 가족이나 지인이 대신할 수도 있습니다. 정부24 안내에 따르면 본인이 아닌 사람이 신청할 때는 신청 권한을 확인하는 서류와 **위임장**(해당하는 경우) 등이 필요하고, 정확한 서류는 신청 유형에 따라 다릅니다. [전입신고 대리 위임장](/form/move-in-report-poa/)에 위임인·대리인·전입 주소와 이사한 날을 적고 서명하면 됩니다. 필요한 서류는 접수처에 미리 확인하십시오.

      확정일자도 대리로 신청할 수 있는지는 접수처마다 요구 서류가 다를 수 있으니 방문 전에 주민센터에 문의하십시오. 임대차 계약 자체는 [주택임대차계약서](/form/housing-lease-contract/)로 정리해 두면 확정일자 신청 때 그대로 쓸 수 있습니다.
  - h: 7. 이사 직후 체크
    list:
      - 신고 뒤 주민등록 등본에서 새 주소가 제대로 반영됐는지 확인합니다.
      - 임대차계약서 원본과 확정일자가 찍힌 페이지를 사진으로도 보관합니다.
      - 입주 상태는 [입주 점검표](/form/move-in-checklist/)로 기록해 두면 나중에 보증금 정산 때 도움이 됩니다.

