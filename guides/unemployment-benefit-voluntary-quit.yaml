title: 실업급여, 자진퇴사도 받는 경우 — 정당한 이직 사유 정리
description: 자진퇴사는 원칙적으로 실업급여를 받지 못하지만 임금체불·근로조건 저하·통근 곤란·직장 내 괴롭힘 같은 정당한 이직 사유가 있으면 받을 수 있습니다. 수급 요건과 증빙 준비 순서를 정리했습니다.
summary: 실업급여(구직급여)는 **이직 전 18개월 동안 고용보험 가입 기간 180일 이상**이고 비자발적으로 퇴사했을 때 받습니다. 자진퇴사라도 이직일 전 1년 안에 **2개월 이상 임금체불**, 채용 조건보다 낮아진 근로조건, 왕복 3시간 이상 통근, 직장 내 괴롭힘 같은 정당한 사유가 있으면 수급 대상이 됩니다. 증빙은 퇴사 전에 모아 둡니다.
keywords: [실업급여 자진퇴사, 정당한 이직 사유, 구직급여 수급 조건, 임금체불 퇴사 실업급여, 통근 곤란 실업급여, 괴롭힘 퇴사 실업급여]
created_at: 2026-09-15
updated_at: 2026-09-15
basis_date: 2026-09-15
show_on: [resignation-letter, resignation-simple, retirement-application, career-certificate, /tools/severance/]
sections:
  - h: 1. 결론 — 자진퇴사도 사유가 있으면 받는다
    body: |
      실업급여의 중심인 구직급여는 "일할 의사와 능력이 있는데 취업하지 못한 상태"를 돕는 제도라, 스스로 그만둔 경우에는 원칙적으로 지급되지 않습니다. 다만 고용보험법 시행규칙 [별표 2]는 **스스로 그만둘 수밖에 없었던 사정**을 정당한 이직 사유로 정해 두고 있고, 여기에 해당하면 자진퇴사도 수급 자격이 인정됩니다.

      핵심은 퇴사 형식이 아니라 **사유와 증빙**입니다. 사직서에 "개인 사정"이라고만 쓰고 나오면, 나중에 임금체불이나 괴롭힘이 있었다고 주장해도 입증 부담이 커집니다. 사유가 있다면 퇴사 전에 기록부터 확보하십시오.
  - h: 2. 기본 수급 요건 네 가지
    body: |
      정당한 이직 사유가 있어도 아래 기본 요건을 함께 갖춰야 합니다. 가장 먼저 확인할 것은 가입 기간입니다. 근로복지공단 고용·산재보험 토탈서비스에서 본인의 피보험 이력을 조회할 수 있습니다.
    list:
      - "**피보험단위기간** — 이직일 이전 18개월 동안 180일 이상 (초단시간 근로자는 24개월)"
      - "**근로 의사와 능력** — 곧바로 일할 수 있는 상태인데 취업하지 못함"
      - "**수급 제한 사유가 없을 것** — 중대한 귀책사유로 해고되었거나 정당한 사유 없이 스스로 그만둔 경우가 아님"
      - "**재취업 노력** — 수급 기간 동안 구직 활동을 하고 실업인정을 받음"
  - h: 3. 인정되는 정당한 이직 사유
    body: |
      [별표 2]의 사유 중 직장인이 실제로 많이 해당하는 것을 추렸습니다. 근로조건 관련 사유는 대체로 **이직일 전 1년 이내에 2개월 이상** 그런 상태가 있었는지를 봅니다. 한두 번의 지연이 아니라 반복·지속된 사정이어야 한다는 뜻입니다.
    table:
      head: [사유, 확인 포인트]
      rows:
        - [실제 근로조건이 채용 때 제시된 조건보다 낮아짐, 근로계약서·채용공고와 실제 급여·근무시간 비교]
        - [임금체불, 이직일 전 1년 안에 2개월 이상 발생]
        - [최저임금 미달 지급, 급여명세서의 시간당 임금 계산]
        - [법정 연장근로 한도 위반, 출퇴근 기록·업무 메신저 시간]
        - [직장 내 괴롭힘·성희롱 피해, 신고 내역·진술·메시지 기록]
        - [사업장 이전·전근으로 통근 곤란, 통상의 교통수단으로 왕복 3시간 이상]
        - [가족 간호가 필요한데 휴가·휴직이 허용되지 않음, 진단 서류와 휴직 신청·거절 기록]
        - [계약기간 만료·정년, 계약서의 기간 조항]
  - h: 4. 퇴사 전에 모아 둘 증빙
    body: |
      고용센터는 회사가 제출한 **이직확인서**와 근로자가 낸 자료를 함께 보고 판단합니다. 회사가 사유를 "개인 사정에 의한 자진퇴사"로 신고하면 근로자가 반대 사실을 입증해야 하므로, 재직 중에 접근할 수 있는 자료를 미리 확보하는 것이 가장 중요합니다.

      임금체불이 사유라면 월별 급여 입금 내역과 [급여명세서](/form/payslip/)를, 괴롭힘이 사유라면 날짜별로 정리한 [진술서](/form/written-statement/)와 메시지 캡처를 준비합니다. 회사에 사정을 알리고 개선을 요구한 기록(메일·내용증명)도 "참다가 어쩔 수 없이 그만뒀다"는 사정을 보여 주는 자료가 됩니다.
    list:
      - 근로계약서, 채용공고 캡처 (조건 저하 비교용)
      - 급여 통장 입금 내역, 급여명세서
      - 출퇴근 기록, 업무 메신저·메일 발송 시간
      - 회사에 개선을 요구한 메일·문서와 회사의 답변
  - h: 5. 사직서와 이직확인서 — 사유를 맞춘다
    body: |
      [사직서](/form/resignation-letter/)의 퇴사 사유는 사실대로 구체적으로 적습니다. "임금체불(2026년 6~8월 급여 미지급)로 인한 퇴사"처럼 기간과 내용을 넣으면 나중에 사유를 입증할 때 출발점이 됩니다.

      퇴사 후 회사는 고용보험 상실신고와 함께 이직 사유를 신고합니다. 신고 내용이 사실과 다르면 고용센터에 수급자격 신청을 하면서 사정을 설명하고 증빙을 내면 됩니다. 반대로 실제로는 개인 사정으로 그만뒀는데 회사와 짜고 사유를 바꾸면 **부정수급**이 되어 받은 돈을 돌려주고 추가 징수까지 당할 수 있으니 절대 권하지 않습니다.
  - h: 6. 신청 순서와 기한
    body: |
      구직급여는 **이직일 다음 날부터 12개월**이 지나면 남은 기간이 있어도 받을 수 없습니다. 퇴사 후 바로 고용24에 구직 등록을 하고 수급자격 신청자 온라인 교육을 들은 뒤 거주지 관할 고용센터에 수급자격을 신청합니다.

      지급액은 원칙적으로 퇴직 전 평균임금의 60%이며, 법으로 정한 하한(최저임금의 80% 수준)과 상한이 있습니다. 지급 일수는 나이와 가입 기간에 따라 달라집니다. 퇴직금과 연차수당은 실업급여와 별개로 받는 돈이니 [퇴직금 계산기](/tools/severance/)로 정산액도 함께 확인해 두십시오. 이직 준비에 필요한 [경력증명서](/form/career-certificate/)는 퇴사 전에 받아 두면 편합니다.
  - h: 7. 수급 중에 조심할 것
    body: |
      구직급여를 받는 동안 아르바이트나 단기 근로로 소득이 생기면 실업인정일에 반드시 신고해야 합니다. 신고하지 않고 받으면 부정수급으로 처리되어 지급이 중단되고 받은 금액을 돌려줘야 합니다. 재취업이 되면 조기재취업수당 요건에 해당하는지도 고용센터에 확인해 보십시오.
