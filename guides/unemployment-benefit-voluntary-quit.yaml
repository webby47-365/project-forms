faq:
  - q: 이직할 회사가 정해져서 그만두면 실업급여를 받을 수 있나요?
    a: 받을 수 없습니다. 전직이나 자영업을 위해 이직한 경우는 수급 자격 제한 사유입니다. 새 회사 입사가 취소되는 등 사정이 바뀌면 고용센터에 상담해 보십시오.
  - q: 급여가 몇 번 늦게 들어온 것도 임금체불 사유가 되나요?
    a: 정당한 이직 사유로 인정되려면 대체로 이직일 전 1년 이내에 2개월 이상 체불·지연이 있었는지를 봅니다. 날짜별 입금 내역으로 기간을 정리해 고용센터에 제출하십시오.
  - q: 회사가 이직 사유를 자진퇴사로 신고했으면 끝인가요?
    a: 아닙니다. 수급자격 신청 때 실제 사유와 증빙을 제출하면 고용센터가 사실관계를 확인해 판단합니다. 결정에 불복하면 심사청구를 할 수 있습니다.
