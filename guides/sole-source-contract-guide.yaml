slug: sole-source-contract-guide
status: draft
group: contract
title: 수의계약 금액기준과 견적서 요건, 사유서 쓰는 법
description: 지방자치단체·공공기관에서 경쟁입찰 없이 수의계약을 진행할 때 확인해야 할 금액 기준, 견적서 요건, 사유서 작성 순서를 정리합니다.
summary: 지방자치단체 수의계약은 **2인 이상 견적서**가 원칙이지만 추정가격이 **2천만원 이하**인 공사·물품·용역은 1인 견적으로도 가능합니다(지방계약법 시행령 제30조). 여성기업·장애인기업 등과 계약할 때는 그 기준이 **5천만원 이하**까지 늘어납니다.
keywords: [수의계약, 수의계약 금액기준, 수의계약 사유, 견적서 몇명, 소액수의계약, 지방계약법 시행령, 수의계약 사유서]
created_at: 2026-09-21
updated_at: 2026-09-21
basis_date: 2026-09-21
sections:
  - h: 1. 수의계약, 언제 쓸 수 있나
    body: |
      수의계약은 경쟁입찰을 거치지 않고 발주자가 특정 상대방을 선택해 계약을 맺는 방식입니다.
      국가계약법 시행령과 지방계약법 시행령은 경쟁입찰이 어렵거나 불필요한 경우에만 예외적으로
      수의계약을 허용합니다. 대표적으로 계약금액이 작은 **소액수의계약**, 특정인의 기술·자격이
      아니면 계약 목적을 이룰 수 없는 경우, 천재지변·감염병 확산 방지처럼 **긴급한 사유**가
      있는 경우입니다.

      학교 행정실·소규모 지자체·공공기관 실무자가 가장 자주 접하는 것은 이 중 소액수의계약입니다.
      담당자가 맨 먼저 확인해야 할 것은 계약금액이 소액수의계약 기준 안에 드는지입니다.

      수의계약은 절차가 간단한 대신 특정 업체를 봐주었다는 오해를 받기 쉬운 계약 방식이기도
      합니다. 그래서 사유서에 어떤 사유에 해당하는지와 견적 확보 근거를 남겨 두는 것이,
      나중에 감사나 회계 점검을 받을 때 계약의 정당성을 소명하는 가장 확실한 방법입니다.
  - h: 2. 금액 기준부터 확인하세요
    body: |
      지방자치단체 계약은 수의계약을 체결하려는 경우에도 원칙적으로 **2인 이상**으로부터
      견적서를 받아야 합니다. 다만 추정가격이 **2천만원 이하**인 공사, 물품 제조·구매, 용역은
      1인으로부터 받은 견적서만으로도 계약을 진행할 수 있습니다.

      여성기업·장애인기업·사회적기업 등 정책적으로 지원하는 업체와 계약할 때는 이 기준이
      **5천만원 이하**까지 늘어납니다. 국가계약(중앙행정기관·공공기관) 사무도 비슷한 취지의
      소액수의계약 기준을 두고 있으므로, 소속 기관이 국가계약법과 지방계약법 중 어느 쪽을
      적용받는지 먼저 확인해야 합니다.
    table:
      head: [구분, 견적서 기준]
      rows:
        - ["일반 공사·물품·용역", "추정가격 2천만원 이하 — 1인 견적 가능"]
        - ["여성기업·장애인기업 등", "추정가격 5천만원 이하 — 1인 견적 가능"]
        - ["그 밖의 경우", "원칙대로 2인 이상 견적서 필요"]
  - h: 3. 수의계약 사유는 이렇게 구분합니다
    body: |
      금액 기준을 넘는데도 수의계약을 진행하려면 국가계약법 시행령이 정한 사유 중 하나에
      해당해야 합니다. 실무에서 자주 쓰이는 사유를 유형별로 정리하면 다음과 같습니다.
    list:
      - 소액수의계약 — 추정가격이 정해진 금액 이하인 경우
      - 특정인의 기술·자격·설비 필요 — 대체할 수 있는 업체가 없는 경우
      - 긴급한 사유 — 천재지변, 감염병 확산 방지, 긴급 복구 등
      - 기존 계약 유지 — 진행 중인 계약을 계속 이행하게 할 필요가 있는 경우
  - h: 4. 사유서에 사유와 근거를 구체적으로 적으세요
    body: |
      수의계약 사유서에는 해당 사유를 표시하는 것에서 그치지 말고, 왜 그 사유에 해당하는지
      구체적인 사정을 함께 적어야 합니다. "특정인의 기술이 필요하다"라고만 적으면 근거가
      부족하다는 지적을 받을 수 있습니다. "해당 설비를 설치한 업체만 부품 호환과 이력 관리가
      가능하다"처럼 다른 업체로 대체할 수 없는 이유를 구체적으로 밝혀야 합니다.

      [수의계약 사유서](/form/sole-source-contract-report/) 서식에 계약 개요와 사유, 확보한
      견적서 현황을 함께 정리해 결재를 받으면 됩니다.
  - h: 5. 견적서는 이렇게 준비합니다
    body: |
      1인 견적이 허용되는 금액 이하라도 실무에서는 가격 비교 자료를 남겨 두는 것이 안전합니다.
      2인 이상 견적서가 필요한 경우라면 서로 다른 업체에서 받은 견적서를
      [견적 비교표](/form/quotation-comparison/)로 정리해 사유서에 첨부합니다. 견적금액과 함께
      업체의 사업자번호를 받아 두면 나중에 감사·정산 과정에서 소명하기 쉽습니다.
  - h: 6. 사유서 결재 이후 절차
    body: |
      사유서 결재가 끝나면 선정한 업체와 [물품구매계약서](/form/goods-purchase-contract/) 등
      계약서를 작성합니다. 공공기관 계약에는 청렴계약 이행서약서를 함께 받는 경우가 많으므로
      [청렴계약 이행서약서](/form/integrity-pledge-bidding/)도 같이 준비해 두면 결재와 계약
      체결까지 한 번에 진행할 수 있습니다.

      계약 체결 후에는 물품·용역의 검수 결과를 남겨 대금 지급의 근거로 삼아야 하며, 수의계약
      서류 일체는 정해진 보존기간 동안 보관해 감사·점검에 대비합니다.
  - h: 7. 자주 틀리는 점
    body: |
      담당자가 자주 놓치는 부분을 미리 알아 두면 사유서를 반려당하는 일을 줄일 수 있습니다.
      아래 항목은 실무에서 지적을 받는 대표적인 경우입니다.
    list:
      - 소액수의계약 금액을 계약금액이 아니라 부가세를 뺀 추정가격 기준으로 확인하지 않은 경우
      - 견적서에 업체의 사업자번호나 견적일자가 빠져 근거 자료로 인정받지 못하는 경우
      - 같은 업체와 계약을 나눠서 반복 체결해 금액 기준을 회피한 것으로 보이는 경우
      - 수의계약 사유를 표시만 하고 구체적인 사정을 적지 않아 소명이 부족한 경우
forms: [sole-source-contract-report, quotation-comparison, goods-purchase-contract, integrity-pledge-bidding]
faq:
  - q: 수의계약도 견적서가 꼭 필요한가요?
    a: 원칙적으로 2인 이상의 견적서가 필요하지만, 추정가격이 2천만원 이하인 공사·물품·용역은 1인 견적으로도 계약할 수 있습니다.
  - q: 여성기업과 계약하면 기준이 달라지나요?
    a: 네. 여성기업·장애인기업 등 정책 지원 대상 업체와 계약할 때는 1인 견적이 가능한 금액 기준이 5천만원 이하까지 늘어납니다.
  - q: 사유가 애매하면 어떻게 하나요?
    a: 가장 가까운 사유 하나를 주된 근거로 적고, 구체적인 사정을 함께 밝혀 담당 부서나 감사 부서에 미리 확인받는 것이 안전합니다.
  - q: 국가계약과 지방계약 기준이 다른가요?
    a: 적용 법령이 다르므로 금액 기준과 절차가 다를 수 있습니다. 소속 기관이 어느 법령을 적용받는지 먼저 확인해야 합니다.
