faq:
  - q: 매매계약일과 잔금일이 다르면 언제부터 15일인가요?
    a: 실제로 소유권이 넘어간 날, 통상 잔금을 지급하고 차량을 인도받은 날부터 계산합니다.
  - q: 매매업자를 통하면 인감증명서가 필요 없나요?
    a: 등록된 자동차매매업자가 매도하거나 알선한 경우, 경매거래 증명서를 낸 경우는 양도인의 인감증명서가 필요 없습니다.
  - q: 대리인이 신청해도 되나요?
    a: 위임장과 위임자 신분증 사본을 갖추면 대리인이 관할 등록사업소를 방문해 신청할 수 있습니다.
  - q: 취득세와 이전등록 기한이 다른데 뭘 먼저 챙기나요?
    a: 취득세 신고 기한(60일)이 더 길지만, 이전등록(15일) 신청 시 납부 확인이 필요해 사실상 이전등록에 맞춰 함께 처리하는 경우가 많습니다.
