slug: vehicle-ownership-transfer-registration
status: draft
group: life
title: 자동차 이전등록 기한과 절차, 준비 서류 총정리
description: 중고차를 사고팔 때 자동차 이전등록을 며칠 안에 해야 하는지, 필요 서류와 기한을 넘기면 붙는 과태료, 취득세 신고 기한까지 한 번에 정리합니다.
summary: 자동차 소유권이 바뀌면 **15일 이내**에 이전등록을 해야 하며, 넘기면 **10일 이내 10만원, 이후 1일마다 1만원씩 가산, 50일 이상은 50만원**의 과태료가 붙습니다. 개인 간 거래는 양도인의 인감증명서(또는 본인서명확인서)가 필요하지만, 등록된 매매업자를 통한 거래는 필요 없습니다.
keywords: [자동차 이전등록, 자동차 명의이전, 자동차 이전등록 기한, 자동차양도증명서, 이전등록 과태료, 중고차 명의변경]
created_at: 2026-09-25
updated_at: 2026-09-25
basis_date: 2026-09-25
show_on: [gov-vehicle-transfer-registration, parking-space-consent-vehicle-registration]
sections:
  - h: 1. 이전등록, 언제까지 해야 하나요
    body: |
      매매나 증여로 자동차 소유권이 바뀌면 양수인은 **소유권 이전 사유가 발생한 날부터
      15일 이내**에 자동차 이전등록을 해야 합니다(자동차관리법 제12조제1항, 자동차등록령
      제26조제1항제1호). 매매계약일이 아니라 실제로 소유권이 넘어간 날(통상 잔금 지급일)이
      기준입니다.

      기한 안에 등록을 마치지 않으면 뒤에서 설명하는 과태료가 부과되므로, 계약할 때
      이전등록 예정일을 미리 정해 두는 것이 안전합니다.
  - h: 2. 이전등록 신청에 필요한 서류
    body: |
      개인 간 직접 거래인지, 등록된 자동차매매업자를 통한 거래인지에 따라 서류가 다릅니다.

      직접 방문이 어려워 [대리인에게 신청을 맡길 때](/form/vehicle-registration-poa/)는
      위임장과 위임자 신분증 사본을 추가로 준비합니다. 매매 사실 자체를 정리하는
      [자동차양도증명서](/form/gov-vehicle-transfer-cert/)는 양도인과 양수인이 함께
      작성해 첨부합니다.
    table:
      head: [거래 유형, 필요 서류]
      rows:
        - ["개인 간 직접 거래", "이전등록신청서, 자동차양도증명서, 양도인 인감증명서(또는 본인서명확인서·전자본인서명확인서 발급증)"]
        - ["등록된 매매업자를 통한 거래", "이전등록신청서, 자동차양도증명서 (양도인 인감증명서 불필요)"]
        - ["공통 지참물", "기존 자동차등록증, 신분증, 자동차검사 유효기간 확인"]
  - h: 3. 기한을 넘기면 붙는 과태료
    body: |
      이전등록 기한을 넘기면 지연 기간에 따라 과태료가 차등 부과됩니다(자동차관리법
      제80조제1호·제2호, 같은 법 시행령 제21조제1항 및 별표3 제3호).

      예를 들어 기한을 25일 넘겼다면 "10만원 + (25일 − 10일) × 1만원 = 25만원"이
      과태료로 부과됩니다. 49일을 넘기면 49만원이 되고, 50일부터는 더 늘지 않고
      50만원으로 고정됩니다.
    table:
      head: [지연 기간, 과태료]
      rows:
        - ["10일 이내", "10만원"]
        - ["11~49일", "10만원 + (10일 초과 1일마다 1만원 가산)"]
        - ["50일 이상", "50만원"]
  - h: 4. 신청 전에 확인할 것
    body: |
      저당권이 설정된 차량은 이전등록 전에 말소 절차가 먼저 필요할 수 있어 관할
      등록사업소에 처리 순서를 확인하는 것이 안전합니다.

      의무보험(책임보험)은 양도인이 새로 가입하지 않아도 **양도일부터 이전등록 신청
      기간이 끝나는 날까지**는 양수인이 양도인의 보험계약상 권리의무를 자동으로
      승계합니다(자동차손해배상보장법 제26조제1항). 다만 그 기간이 지나도록 양수인이
      새 의무보험에 가입하지 않으면 보장 공백이 생기므로, 인도받은 즉시 본인 명의
      의무보험부터 가입해 두는 것이 안전합니다.

      제주특별자치도는 전국에서 유일하게 차고지증명제를 시행하고 있어, 도내에서
      자동차를 등록하려면 [주차장소 사용승낙서](/form/parking-space-consent-vehicle-registration/)
      등으로 차고지를 확보했다는 서류를 함께 내야 합니다. 다만 2025년 3월 조례 개정으로
      경형·소형차(1톤 이하 화물차 포함)와 전기차·수소차는 이 대상에서 빠졌습니다.
      제주 외 지역은 해당하지 않으므로 관할 등록사업소에 대상 여부를 먼저 확인하십시오.
  - h: 5. 신청 절차
    body: |
      서류를 갖췄다면 관할 차량등록사업소(구청 교통행정과)를 방문해 접수합니다.
      담당자가 서류를 확인하고 번호판 유지 여부(관할이 같은 경우) 또는 번호판 교체
      여부(관할이 바뀌는 경우)를 안내합니다. 정부24 온라인 신청도 안내되지만 지역·
      상황에 따라 처리 범위가 달라, 완전한 비대면 처리가 어려우면 방문 접수로
      진행하는 것이 확실합니다.

      번호판을 그대로 쓸지 새로 받을지는 등록 관할(시·군·구)이 같은지에 따라
      갈리므로, 접수 창구에서 번호판 지참 여부를 미리 안내받아 두면 두 번
      방문하지 않아도 됩니다.

      접수 후 [이전등록 신청서](/form/gov-vehicle-transfer-registration/)가 처리되면
      새 등록증이 발급되며, 등록 관할이 바뀌는 경우 번호판을 새로 발급받아야 합니다.
  - h: 6. 취득세 신고·납부도 따로 챙기세요
    body: |
      이전등록과 별개로, 자동차를 유상으로 취득했다면 취득일로부터 **60일 이내**에
      취득세를 신고·납부해야 합니다(지방세법 제20조). 다만 등록관청에 이전등록을
      신청할 때는 그 신청서를 접수하는 날까지 취득세를 내야 하는 것이 실무 처리
      순서이므로, 대부분 이전등록 15일 기한에 맞춰 취득세도 함께 정산하게 됩니다.

      취득세율은 배기량·차종·감면 대상 여부에 따라 달라지므로, 정확한 세액은
      관할 지방자치단체 세무부서나 위택스에서 확인하는 것이 안전합니다. 경차·
      전기차 등은 감면 혜택이 있을 수 있어 신고 전에 대상 여부를 먼저 확인하면
      과오납을 줄일 수 있습니다.
